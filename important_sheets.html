<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Important data sheets · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <style>
    .ui-page { max-width: 980px; }
    .sl { list-style: none; margin: 0; padding: 0; }
    .sl li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px 16px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--mzo-border); }
    .sl li:first-child { border-top: 0; }
    .sl li:hover { background: var(--mzo-row-hover); }
    .sl .n { font-weight: 500; min-width: 0; }
    .sl .n a { color: inherit; text-decoration: none; }
    .sl .n a:hover { text-decoration: underline; text-underline-offset: 2px; }
    .sl .vals { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-variant-numeric: tabular-nums; }
    .sl .acts { display: flex; gap: 4px; }
    .mg-list li { grid-template-columns: minmax(0, 1fr) auto; }
    .mg-list .meta { font-size: 12px; color: var(--mzo-muted); word-break: break-all; }
    .mg form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 16px; border-bottom: 1px solid var(--mzo-border); }
    .mg form label { display: grid; gap: 4px; font-size: 12px; color: var(--mzo-muted); }
    .mg form .wide { grid-column: span 2; }
    .mg form .ui-input { width: 100%; padding: 0 10px; }
    .mg form .row { grid-column: span 2; display: flex; justify-content: flex-end; gap: 8px; }
    @media (max-width: 760px) { .sl li { grid-template-columns: minmax(0, 1fr) auto; } .sl .vals { grid-column: 1; justify-content: flex-start; flex-wrap: nowrap; } .sl .acts { grid-row: 1 / span 2; grid-column: 2; } .sl .acts .lbl { display: none; } .sl .acts .ui-btn { padding: 0 8px; } }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Important data sheets</h1>
        <p>Open in Google Sheets, download as Excel, or share.</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn" id="manageBtn" hidden>Manage months</button>
      </div>
    </header>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2>Unbilled up to date</h2><span class="ui-note">Q and M from each month's sheet</span></div>
      <ul class="sl" id="unbilled"><li><span class="ui-skel" style="width:40%"></span></li></ul>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2>Billing and metering</h2></div>
      <ul class="sl" id="billing"></ul>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2>REM OSD</h2></div>
      <ul class="sl" id="rem"></ul>
    </section>
  </main>

  <div class="ui-drawer" id="manage" hidden>
    <section class="mg" role="dialog" aria-modal="true" aria-label="Manage unbilled months">
      <header><div><h3>Unbilled months</h3><p>Add, edit or remove a month's sheet.</p></div><button type="button" class="ui-btn icon ghost" data-close aria-label="Close"><svg class="ui-i"><use href="#ui-x"/></svg></button></header>
      <form id="mgForm">
        <input type="hidden" name="mid" />
        <label class="wide">Month label<input class="ui-input" name="label" required placeholder="Sep-2026" /></label>
        <label class="wide">Google Sheet ID<input class="ui-input" name="sheetId" required placeholder="1SazJY-ohGv…" /></label>
        <label>Tab GID<input class="ui-input" name="gid" placeholder="0" /></label>
        <label>Sort order<input class="ui-input" name="sort" type="number" placeholder="auto" /></label>
        <div class="row"><button type="button" class="ui-btn ghost sm" id="mgReset">Clear</button><button type="submit" class="ui-btn primary sm" id="mgSave">Add month</button></div>
      </form>
      <ul class="sl mg-list" id="mgList"></ul>
    </section>
  </div>

  <script src="/auth.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var FALLBACK = [
      { id: 1, label: 'Jan-2026', sheetId: '1ujR9e1olZKeu1uIgzSsIl2XXK-fN6YWI-1Z_E6xyOTs', gid: '979760067', sortOrder: 1 },
      { id: 2, label: 'Feb-2026', sheetId: '1cYIV5Uk5Wa0CPkFMPFdeIUwJ3262o6tNJTbxTe7Lelk', gid: '827560931', sortOrder: 2 },
      { id: 3, label: 'Mar-2026', sheetId: '1iRAE1fXfCbkb7mtRIjYIGYdbMLUga-bmhlHgKm1ZorE', gid: '0', sortOrder: 3 },
      { id: 4, label: 'Apr-2026', sheetId: '1u3x_XJ_re_MJvkDbGmcE4iwweRk5xe89Qib2p9JxAGc', gid: '801371725', sortOrder: 4 },
      { id: 5, label: 'May-2026', sheetId: '1c9I7Ng3OCqMik4jyRqO7WZn6ysdVXAFsm93va1Z1PFk', gid: '0', sortOrder: 5 },
      { id: 6, label: 'Jun-2026', sheetId: '1rgHVfi2Z-8lKPCBl6byXCHfJ_QVCbQcB-7awggyDa1M', gid: '0', sortOrder: 6 },
      { id: 7, label: 'Jul-2026', sheetId: '1Pw1mSp8x7b5DxgjQMu8WfVfX2dY0UkF836p4YXva1ko', gid: '1573581583', sortOrder: 7 },
      { id: 8, label: 'Aug-2026', sheetId: '1SazJY-ohGvhTji5zN-mfrCTbaEUvfvGGKh6XWlRn76s', gid: '903839015', sortOrder: 8 }
    ];
    // name, sheet id, gid, live cells [[label, range]]
    var BILLING = [
      ['3 months unbilled', '1g_YAYXocaaEDh42WpgT5jqzEwWMgwtvfrXP2J3Jh8lw', '0', [['', 'Q60']]],
      ['1st bill not generated', '1gPNCdyhoGNZy5i6FFp2HBIHs4-4FelNWGWThmC8PeQE', '0', [['', 'J57']]],
      ['Smart metering', '1-stbDqVWjFfeftqpe20zQOw2NFKj6595ptBLrCG-__s', '1066479111', []],
      ['Smart meter: non-push cases', '18z-dWyTbw9jsrJtQ67UUL2TbT-QUgi_Q', '183159560', [['', 'G63']]],
      ['REM less unit billed', '1It8j3Ic8mjoVf7ejljj1VrN7LEEnqg-9A8n7BY3UrQM', '0', [['<10', 'I56'], ['0', 'M56']]]
    ];
    var REM = [
      ['REM OSD follow-up', '1kB6g0zxWqR7sX6KiJaHG1pn0Fq_CWFAjyLzDNyOvpDY', '0'],
      ['ATR summary', '1VGwEKCN5zQogt7EiPZ2potuSpPBBjZfFqm4FtutWxOk', '596686415'],
      ['REM STW OSD', '1hehnzupXA_4MFvaFf4blhwqb9gRbQS1YORB6IuGOfTg', '1783257436'],
      ['REM OSD age analysis', '1t_N9fTRVbRaKPejMW5TfhMiRmBMmwL5kWrItzWnR3OM', '1275155087']
    ];
    var months = [], canManage = false, seq = 0;

    function view(id, gid) { return 'https://docs.google.com/spreadsheets/d/' + id + '/edit?gid=' + gid + '#gid=' + gid; }
    function xlsx(id) { return 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=xlsx'; }
    function wa(name, url) { return 'https://api.whatsapp.com/send?text=' + encodeURIComponent(name + ': ' + url); }

    // One sheet row: name links to the sheet; live cells fill in after.
    function row(name, id, gid, cells) {
      var url = view(id, gid);
      var vals = (cells || []).map(function (c) { var k = 'c' + (++seq); cell(id, c[1], k, c[0]); return '<span class="ui-badge" id="' + k + '">' + (c[0] ? UI.esc(c[0]) + ' · ' : '') + '…</span>'; }).join('');
      return '<li><div class="n"><a href="' + UI.esc(url) + '" target="_blank" rel="noopener">' + UI.esc(name) + '</a></div>' +
        '<div class="vals">' + vals + '</div>' +
        '<div class="acts"><a class="ui-btn sm ghost" href="' + UI.esc(url) + '" target="_blank" rel="noopener" title="Open in Google Sheets"><svg class="ui-i"><use href="#ui-arrow"/></svg><span class="lbl">Open</span></a>' +
        '<a class="ui-btn sm ghost" href="' + UI.esc(xlsx(id)) + '" title="Download as Excel"><svg class="ui-i"><use href="#ui-download"/></svg><span class="lbl">Excel</span></a>' +
        '<a class="ui-btn sm ghost" href="' + UI.esc(wa(name, url)) + '" target="_blank" rel="noopener" title="Share on WhatsApp">Share</a></div></li>';
    }
    function cell(id, range, target, label) {
      fetch('https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv&range=' + range)
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var v = t.replace(/"/g, '').trim(), el = $(target);
          if (!el) return;
          el.textContent = (label ? label + ' · ' : '') + (v || '0');
        })
        .catch(function () { var el = $(target); if (el) el.textContent = (label ? label + ' · ' : '') + '—'; });
    }

    function paintMonths() {
      var list = months.filter(function (m) { var id = m.sheetId || m.sheet_id; return id && id !== '#'; });
      $('unbilled').innerHTML = list.map(function (m) {
        var gid = m.gid != null && String(m.gid).trim() !== '' ? String(m.gid) : '0';
        return row(m.label, m.sheetId || m.sheet_id, gid, [['Q', 'D57'], ['M', 'E57']]);
      }).join('') || '<li><span class="ui-note">No months configured yet.</span></li>';
      if (canManage) paintManage();
    }
    function loadMonths() {
      return fetch('/api/important-sheets/unbilled', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (d) { if (!r.ok || d.status !== 'success') throw new Error(d.message || 'load'); return d; }); })
        .then(function (d) { months = Array.isArray(d.months) && d.months.length ? d.months : FALLBACK.slice(); })
        .catch(function () { months = FALLBACK.slice(); })
        .then(paintMonths);
    }

    /* Manage months (admin or Sheets: Manage) */
    function canManageSheets(p) {
      p = p || {};
      if (String(p.role || '').toLowerCase() === 'admin') return true;
      var f = String(p['sheets-autho'] != null ? p['sheets-autho'] : (p.sheets_autho || '')).trim().toLowerCase();
      return f === 'edit' || f === 'y' || f === 'all';
    }
    function paintManage() {
      $('mgList').innerHTML = months.map(function (m) {
        return '<li><div><div class="n">' + UI.esc(m.label) + '</div><div class="meta">GID ' + UI.esc(m.gid || '0') + ' · order ' + (m.sortOrder != null ? m.sortOrder : '—') + ' · ' + UI.esc(m.sheetId) + '</div></div>' +
          '<div class="acts"><button type="button" class="ui-btn sm ghost" data-edit="' + m.id + '">Edit</button><button type="button" class="ui-btn sm ghost" data-del="' + m.id + '" style="color:var(--mzo-bad)">Remove</button></div></li>';
      }).join('') || '<li><span class="ui-note">No months yet.</span></li>';
    }
    var form = $('mgForm');
    function resetForm() { form.reset(); form.mid.value = ''; $('mgSave').textContent = 'Add month'; }
    function api(url, method, body) {
      return fetch(url, { method: method, headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, credentials: 'same-origin', body: body ? JSON.stringify(body) : undefined })
        .then(function (r) { return r.json().then(function (d) { if (!r.ok || d.status !== 'success') throw new Error(d.message || 'Request failed'); return d; }); });
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = form.mid.value.trim(), sort = form.sort.value.trim();
      var body = { label: form.label.value.trim(), sheetId: form.sheetId.value.trim(), gid: form.gid.value.trim() || '0', sortOrder: sort ? Number(sort) : undefined, active: true };
      if (!body.label || !body.sheetId) return;
      $('mgSave').disabled = true;
      api(id ? '/api/important-sheets/unbilled/' + id : '/api/important-sheets/unbilled', id ? 'PATCH' : 'POST', body)
        .then(function () { resetForm(); UI.toast('Saved'); return loadMonths(); })
        .catch(function (err) { UI.toast(err.message || 'Save failed'); })
        .then(function () { $('mgSave').disabled = false; });
    });
    $('mgReset').addEventListener('click', resetForm);
    $('mgList').addEventListener('click', function (e) {
      var ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
      if (ed) {
        var m = months.filter(function (x) { return String(x.id) === ed.getAttribute('data-edit'); })[0]; if (!m) return;
        form.mid.value = m.id; form.label.value = m.label || ''; form.sheetId.value = m.sheetId || ''; form.gid.value = m.gid || '0'; form.sort.value = m.sortOrder != null ? m.sortOrder : '';
        $('mgSave').textContent = 'Update month'; form.label.focus();
      }
      if (del && confirm('Remove this month from the list?')) {
        var id = del.getAttribute('data-del');
        api('/api/important-sheets/unbilled/' + id, 'DELETE').then(function () { if (form.mid.value === id) resetForm(); UI.toast('Removed'); return loadMonths(); })
          .catch(function (err) { UI.toast(err.message || 'Delete failed'); });
      }
    });
    $('manageBtn').addEventListener('click', function () { $('manage').hidden = false; paintManage(); });
    $('manage').addEventListener('click', function (e) { if (e.target === this || e.target.closest('[data-close]')) { this.hidden = true; resetForm(); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('manage').hidden = true; });

    $('billing').innerHTML = BILLING.map(function (b) { return row(b[0], b[1], b[2], b[3]); }).join('');
    $('rem').innerHTML = REM.map(function (b) { return row(b[0], b[1], b[2], []); }).join('');

    var profile = {};
    try { profile = JSON.parse(localStorage.getItem('mzo_user_profile') || '{}') || {}; } catch (e) {}
    fetch('/api/session-check', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.profile) { profile = d.profile; try { localStorage.setItem('mzo_authenticated', 'true'); localStorage.setItem('mzo_user_profile', JSON.stringify(d.profile)); } catch (e) {} } })
      .catch(function () {})
      .then(function () { canManage = canManageSheets(profile); $('manageBtn').hidden = !canManage; return loadMonths(); });
  });
  </script>
</body>
</html>
