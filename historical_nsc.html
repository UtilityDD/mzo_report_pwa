<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historical analysis · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .hs-chart { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 200px; padding-left: 44px; }
    .hs-chart .col { position: relative; flex: 1 1 0; min-width: 1px; height: 100%; border-radius: 2px; }
    .hs-chart .col:hover { background: var(--mzo-row-hover); }
    .hs-chart .col b { position: absolute; left: 12%; right: 12%; bottom: 0; border-radius: 2px 2px 0 0; background: var(--mzo-chart); }
    .hs-chart .col:hover b { background: var(--mzo-text); }
    .hs-grid { position: absolute; left: 44px; right: 0; height: 1px; background: var(--mzo-border); pointer-events: none; }
    .hs-grid span { position: absolute; right: calc(100% + 8px); top: -7px; font-size: 11.5px; color: var(--mzo-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hs-axis { display: flex; justify-content: space-between; margin: 8px 0 0 44px; font-size: 12px; color: var(--mzo-muted); }
    .hs-tip { position: fixed; z-index: 50; pointer-events: none; padding: 8px 10px; border-radius: 8px; background: var(--mzo-surface); color: var(--mzo-text); box-shadow: 0 0 0 1px var(--mzo-border), var(--mzo-shadow-pop); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .hs-tip b { display: block; font-weight: 600; margin-bottom: 2px; }
    .hs-tip span { color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Historical analysis</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="period" role="group" aria-label="Period">
          <button type="button" data-p="week" aria-pressed="false">Week</button>
          <button type="button" data-p="month" aria-pressed="true">Month</button>
          <button type="button" data-p="quarter" aria-pressed="false">Quarter</button>
          <button type="button" data-p="year" aria-pressed="false">Year</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="yearFilter" aria-label="Year"><option value="">All years</option></select></span>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-c=""><div class="k">Connections</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="D"><div class="k">Domestic</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="C"><div class="k">Commercial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="I"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="A"><div class="k">Agriculture</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2 id="trendTitle">Connections per month</h2><span class="ui-note" id="trendNote"></span></div>
      <div class="ui-panel-b">
        <div class="hs-chart" id="chart"></div>
        <div class="hs-axis"><span id="axisFrom"></span><span id="axisMid"></span><span id="axisTo"></span></div>
      </div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel" style="margin-top:0">
        <div class="ui-panel-h">
          <h2 id="periodTitle">Months</h2>
          <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
        </div>
        <div id="periodTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
    </div>
  </main>
  <div class="hs-tip" id="tip" hidden></div>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1VYUaMC92oZPb3f452Q2b5WJf3Zhm02JdVq2Hsykt-_ipAcIIYaFdgYm4qZdZ8heGcrDon5eQA7nk/pub?gid=2021450441&single=true&output=csv';
    var CLASSES = ['D', 'C', 'I', 'A', 'O'];
    var CLASS = { D: 'Domestic', C: 'Commercial', I: 'Industrial', A: 'Agriculture', O: 'Other' };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var PERIOD = { week: ['week', 'Weeks'], month: ['month', 'Months'], quarter: ['quarter', 'Quarters'], year: ['year', 'Years'] };
    var all = [], f = { period: 'month', cls: '' }, level = 'region', scope = null;

    // The sheet writes dates as M/D/YY.
    function mdy(s) {
      var m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (m) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
      return UI.date(s);
    }
    function key(d, p) {
      if (p === 'year') return { k: String(d.getFullYear()), label: String(d.getFullYear()) };
      if (p === 'quarter') { var q = Math.floor(d.getMonth() / 3) + 1; return { k: d.getFullYear() + '-' + q, label: 'Q' + q + ' ' + d.getFullYear() }; }
      if (p === 'month') return { k: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: MON[d.getMonth()] + ' ' + d.getFullYear() };
      var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
      return { k: mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0'), label: UI.fmtDate(mon) };
    }

    function prepare(text) {
      var min = null, max = null;
      all = UI.csv(text).map(function (d) {
        var code = String(d['CCC CODE'] || d.CCC_CODE || '').replace(/\D/g, '').slice(-7);
        var dt = mdy(d.METER_INSTALL_DATE);
        if (!code || !dt) return null;
        var o = UI.office(code);
        var r = { CCC_CODE: code, _region: o.region, _divn: o.division, _supp: o.ccc || code, date: dt };
        CLASSES.forEach(function (c) { r[c] = Number(d[c]) || 0; });
        if (!min || dt < min) min = dt; if (!max || dt > max) max = dt;
        return r;
      }).filter(Boolean);
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      $('meta').textContent = 'Meters installed for new connections' + (min ? ' · ' + UI.fmtDate(min) + ' to ' + UI.fmtDate(max) : '');
      var years = {}; all.forEach(function (r) { years[r.date.getFullYear()] = 1; });
      UI.fill('yearFilter', Object.keys(years).sort().reverse(), 'All years');
      fillOffices();
    }

    function fillOffices() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      UI.mark($('yearFilter'));
    }

    function rows() {
      var y = $('yearFilter').value, reg = $('regionFilter').value, div = $('divisionFilter').value, cc = $('cccFilter').value;
      return all.filter(function (r) { return (!y || String(r.date.getFullYear()) === y) && (!reg || r._region === reg) && (!div || r._divn === div) && (!cc || r._supp === cc); });
    }
    function val(r) { return f.cls ? r[f.cls] : r.D + r.C + r.I + r.A + r.O; }
    function periods(list, p) {
      var g = {};
      list.forEach(function (r) {
        var k = key(r.date, p), b = g[k.k] || (g[k.k] = { k: k.k, label: k.label, D: 0, C: 0, I: 0, A: 0, O: 0 });
        CLASSES.forEach(function (c) { b[c] += r[c]; });
      });
      return Object.keys(g).sort().map(function (k) { var b = g[k]; b.total = b.D + b.C + b.I + b.A + b.O; b.v = f.cls ? b[f.cls] : b.total; return b; });
    }
    function count(list, p) { var s = {}; list.forEach(function (r) { s[key(r.date, p).k] = 1; }); return Object.keys(s).length || 1; }

    function render() {
      var list = rows(), p = f.period, n = count(list, p), per = PERIOD[p][0];
      var tot = { D: 0, C: 0, I: 0, A: 0, O: 0 }; list.forEach(function (r) { CLASSES.forEach(function (c) { tot[c] += r[c]; }); });
      var all5 = tot.D + tot.C + tot.I + tot.A + tot.O;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var c = el.getAttribute('data-c'), v = c ? tot[c] : all5;
        el.querySelector('.v').textContent = UI.n(v);
        el.querySelector('.s').textContent = UI.n(Math.round(v / n)) + ' per ' + per + (c ? ' · ' + UI.pct(v, all5) : '');
        el.setAttribute('aria-pressed', String(f.cls === c));
      });

      var series = periods(list, p);
      $('trendTitle').textContent = (f.cls ? CLASS[f.cls] + ' connections' : 'Connections') + ' per ' + per;
      $('trendNote').textContent = series.length ? 'Average ' + UI.n(Math.round(series.reduce(function (a, s) { return a + s.v; }, 0) / series.length)) + ' per ' + per : '';
      chart(series);

      var keyName = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      list.forEach(function (r) {
        var name = r[keyName] || 'Unmapped';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', total: 0, rows: [] });
        g.total += val(r); g.rows.push(r);
      });
      var gl = Object.keys(groups).map(function (k) { var g = groups[k]; g.avg = g.total / count(g.rows, p); g.peryear = g.total / count(g.rows, 'year'); delete g.rows; return g; });
      var max = Math.max.apply(null, gl.map(function (g) { return g.total; }).concat([0])), sumAll = gl.reduce(function (a, g) { return a + g.total; }, 0);
      UI.table('officeTable', {
        rows: gl, sort: { key: 'total', dir: 'desc' }, count: false, empty: 'No connections for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'total', label: 'Connections', num: true, fmt: UI.n },
          { key: 'avg', label: 'Per ' + per, num: true, fmt: function (v) { return UI.n(Math.round(v)); } },
          { key: 'peryear', label: 'Per year', num: true, hideSm: true, fmt: function (v) { return UI.n(Math.round(v)); } },
          { key: 'share', label: 'Share', sortVal: function (g) { return g.total; }, fmt: function (_, g) { return UI.bar(g.total, max, UI.pct(g.total, sumAll)); }, hideSm: true, width: '26%' }
        ],
        foot: gl.length > 1 ? { total: sumAll, avg: sumAll / n, peryear: sumAll / count(list, 'year') } : null,
        onRow: level === 'ccc' ? null : function (g) { drill(g.name); }
      });

      $('periodTitle').textContent = PERIOD[p][1];
      var pl = series.slice().reverse();
      UI.table('periodTable', {
        rows: pl, sort: { key: 'k', dir: 'desc' }, limit: p === 'week' ? 52 : 36, resetPage: true, count: false, empty: 'No connections.',
        columns: PERIOD_COLS
      });
      window.__periods = pl;
      $('clearBtn').hidden = !(f.cls || $('yearFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    var PERIOD_COLS = [
      { key: 'k', label: 'Period', fmt: function (_, r) { return '<span style="white-space:nowrap">' + UI.esc(r.label) + '</span>'; }, csv: function (r) { return r.label; } },
      { key: 'D', label: 'Dom.', num: true, fmt: UI.n, hideSm: true },
      { key: 'C', label: 'Com.', num: true, fmt: UI.n, hideSm: true },
      { key: 'I', label: 'Ind.', num: true, fmt: UI.n, hideSm: true },
      { key: 'A', label: 'Agri.', num: true, fmt: UI.n, hideSm: true },
      { key: 'O', label: 'Other', num: true, fmt: UI.n, hideSm: true },
      { key: 'total', label: 'Total', num: true, fmt: function (v) { return '<span class="ui-strong">' + UI.n(v) + '</span>'; }, csv: function (r) { return r.total; } }
    ];

    function nice(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p, steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]; for (var i = 0; i < steps.length; i++) if (m <= steps[i]) return steps[i] * p; return 10 * p; }
    function chart(series) {
      var max = nice(Math.max.apply(null, series.map(function (s) { return s.v; }).concat([0])));
      var grid = [0, 0.5, 1].map(function (t) { return '<div class="hs-grid" style="bottom:' + (t * 100) + '%"><span>' + UI.n(Math.round(max * t)) + '</span></div>'; }).join('');
      $('chart').innerHTML = grid + series.map(function (s, i) {
        return '<div class="col" data-i="' + i + '"><b style="height:' + (s.v ? Math.max(0.6, (s.v / max) * 100) : 0) + '%"></b></div>';
      }).join('');
      $('axisFrom').textContent = series.length ? series[0].label : '';
      $('axisMid').textContent = series.length > 2 ? series[Math.floor(series.length / 2)].label : '';
      $('axisTo').textContent = series.length > 1 ? series[series.length - 1].label : '';
      $('chart').__series = series;
    }
    $('chart').addEventListener('pointermove', function (e) {
      var c = e.target.closest('.col'), tip = $('tip');
      if (!c) { tip.hidden = true; return; }
      var s = this.__series[+c.getAttribute('data-i')];
      tip.innerHTML = '<b>' + UI.esc(s.label) + ' · ' + UI.n(s.v) + '</b>' + CLASSES.filter(function (k) { return s[k]; }).map(function (k) { return '<span>' + CLASS[k] + '</span> ' + UI.n(s[k]); }).join('<br>');
      tip.hidden = false;
      var x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
      tip.style.left = x + 'px'; tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 10) + 'px';
    });
    $('chart').addEventListener('pointerleave', function () { $('tip').hidden = true; });

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillOffices(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); render();
      });
    });
    $('yearFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('period').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      f.period = b.getAttribute('data-p');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var c = s.getAttribute('data-c'); f.cls = f.cls === c ? '' : c; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.cls = ''; $('yearFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillOffices(); render();
    });
    $('exportBtn').addEventListener('click', function () { UI.exportCsv('historical-nsc-' + f.period + '.csv', PERIOD_COLS, window.__periods || []); });

    function load(force) {
      var b = $('refreshBtn'); b.classList.add('spin');
      return fetch(CSV_URL, force ? { cache: 'no-store' } : {})
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (t) { prepare(t); return true; })
        .catch(function () { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = $('periodTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; return false; })
        .then(function (ok) { b.classList.remove('spin'); return ok; });
    }
    $('refreshBtn').addEventListener('click', function () { load(true).then(function (ok) { if (ok) render(); }); });

    load(false).then(function (ok) {
      if (!ok) return;
      if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      render();
    });
  });
  </script>
</body>
</html>
