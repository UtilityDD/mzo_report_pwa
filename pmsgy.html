<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PM Surya Ghar · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>PM Surya Ghar</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="catSeg" role="group" aria-label="Category">
          <button type="button" data-c="" aria-pressed="true">All</button>
          <button type="button" data-c="Residential-Self" aria-pressed="false">Residential self</button>
          <button type="button" data-c="RWA" aria-pressed="false">RWA</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, consumer, vendor or stage" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="vendorFilter" aria-label="Vendor"><option value="">All vendors</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Applications</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="vendor"><div class="k">Vendor assigned</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="agreement"><div class="k">Agreement</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="installed"><div class="k">Installed</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="connected"><div class="k"><span class="ui-dot ok"></span>Connected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Breakdown</h2>
          <div class="ui-tabs" role="tablist" id="tabs">
            <button type="button" class="ui-tab" role="tab" data-t="region">Region</button>
            <button type="button" class="ui-tab" role="tab" data-t="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-t="ccc">CCC</button>
            <button type="button" class="ui-tab" role="tab" data-t="vendor">Vendor</button>
            <button type="button" class="ui-tab" role="tab" data-t="stage">Stage</button>
          </div>
        </div>
        <div id="breakdown" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Progress</h2></div>
          <div class="ui-panel-b"><div id="funnel"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Installed, not connected</h2><span class="ui-note" id="gapNote"></span></div>
          <div class="ui-panel-b"><div id="gapHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
    var JOBS = [['CACHE_PMSGY_MALDA', 'Malda'], ['CACHE_PMSGY_UD', 'Raiganj'], ['CACHE_PMSGY_DD', 'Balurghat']];
    var STEP = {
      vendor: { label: 'Vendor assigned', test: function (r) { return r.vendorSet; } },
      agreement: { label: 'Agreement', test: function (r) { return r.agreement; } },
      installed: { label: 'Installed', test: function (r) { return r.installed; } },
      connected: { label: 'Connected', test: function (r) { return r.connected; } }
    };
    var all = [], step = '', cat = '', tab = '', stageDrill = null, scope = null;

    function pick(row, keys) {
      var want = {}; keys.forEach(function (k) { want[k.toLowerCase()] = 1; });
      for (var k in row) if (want[k.toLowerCase().trim()] && row[k] != null && String(row[k]).trim() !== '') return String(row[k]).trim();
      return '';
    }
    function parseDate(raw) {
      var s = String(raw || '').trim(), m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})/);
      if (m && MON[m[2].toLowerCase()] != null) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, MON[m[2].toLowerCase()], +m[1]); }
      m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
      if (m) { var y2 = +m[3]; if (y2 < 100) y2 += 2000; return new Date(y2, +m[2] - 1, +m[1]); }
      return null;
    }
    // Sheets sometimes turn masked numbers into 9.87E+09; keep the digits we have.
    function phone(raw) {
      var s = String(raw || '').trim(), m = s.match(/^(\d+)(?:\.(\d+))?[eE]\+(\d+)$/);
      if (!m) return s;
      var d = m[1] + (m[2] || ''), w = +m[3] + 1;
      return d.length >= w ? d.slice(0, w) : d + '•'.repeat(w - d.length);
    }
    function category(row) {
      var s = (pick(row, ['Consumer Category']) + ' ' + pick(row, ['Category'])).toLowerCase();
      return /welfare|rwa/.test(s) ? 'RWA' : /self/.test(s) ? 'Residential-Self' : 'Other';
    }
    function office(row, region) {
      var divRaw = pick(row, ['Division Name']), cccRaw = pick(row, ['Sub-Division Name']).replace(/\s*ccc\s*$/i, '').trim();
      var division = divRaw, ccc = cccRaw, S = window.MzoScope;
      if (S) {
        var named = S.cccNameOf(cccRaw), parent = named ? S.parentOfCcc(named) : null;
        if (parent) { division = parent.division; ccc = parent.ccc; }
        else { division = S.divisionNameOf(divRaw) || divRaw; ccc = named || cccRaw; }
      }
      return { region: region, division: division || '', ccc: ccc || '' };
    }

    // Email and bank details stay off the page (docs/reports.md): only these fields are kept.
    function ingest(csv, region) {
      if (!/application number/i.test(String(csv || '').slice(0, 800))) return [];
      return UI.csv(csv).filter(function (row) { var f = String(row[Object.keys(row)[0]] || '').trim(); return f && !/^logic$/i.test(f); }).map(function (row) {
        var o = office(row, region), net = parseDate(pick(row, ['Net Metering Date']));
        var r = {
          appl: pick(row, ['Application Number']), name: UI.title(pick(row, ['Consumer Name'])), con: pick(row, ['Consumer Number']),
          mobile: phone(pick(row, ['Mobile (Masked)', 'Mobile Number', 'Mobile'])), category: category(row),
          stage: pick(row, ['Current Stage']) || 'Blank', sub: pick(row, ['Sub Status of Current Stage']) || 'Blank',
          phase: pick(row, ['Connection Phase']), vendor: pick(row, ['Vendor Name']), kw: parseFloat(pick(row, ['Installed Capacity (in kW)'])) || 0,
          net: net, last: parseDate(pick(row, ['Last Action Date'])),
          vendorSet: !!pick(row, ['Vendor Name']), agreement: !!parseDate(pick(row, ['Agreement Upload Date'])),
          installed: /installation completed/i.test(pick(row, ['Installation Status'])), connected: !!net,
          REGION: o.region, DIVISION: o.division, 'CCC NAME': o.ccc, REGION_NORM: o.region, DIVISION_NORM: o.division, CCC_NORM: o.ccc
        };
        r.vendorLabel = r.vendor || 'No vendor';
        r.search = [r.appl, r.name, r.con, r.mobile, r.vendor, r.stage, r.sub, o.ccc, o.division].join(' ').toLowerCase();
        return r;
      }).filter(function (r) { return r.appl; });
    }

    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      UI.fill('regionFilter', UI.uniq(all, 'REGION_NORM'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r.REGION_NORM === reg; });
      UI.fill('divisionFilter', UI.uniq(r1, 'DIVISION_NORM'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r.DIVISION_NORM === div; });
      UI.fill('cccFilter', UI.uniq(r2, 'CCC_NORM'), 'All CCCs');
      var r3 = r2.filter(function (r) { return !ccc || r.CCC_NORM === ccc; });
      UI.fill('vendorFilter', UI.uniq(r3, 'vendorLabel'), 'All vendors');
      if (!scope) scope = UI.lockScope();
      ['regionFilter', 'divisionFilter', 'cccFilter', 'vendorFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function base() {
      var q = $('q').value.trim().toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, ven = $('vendorFilter').value;
      return all.filter(function (r) {
        return (!reg || r.REGION_NORM === reg) && (!div || r.DIVISION_NORM === div) && (!ccc || r.CCC_NORM === ccc) &&
          (!ven || r.vendorLabel === ven) && (!cat || r.category === cat) && (!q || r.search.indexOf(q) !== -1);
      });
    }
    function defaultTab() {
      if (!$('regionFilter').value) return 'region';
      if (!$('divisionFilter').value) return 'division';
      if (!$('cccFilter').value) return 'ccc';
      return 'vendor';
    }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return (!step || STEP[step].test(r)) && (!stageDrill || (r.stage === stageDrill[0] && r.sub === stageDrill[1])); });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? b.filter(STEP[k].test).length : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? UI.pct(c, b.length) + ' of applications' : UI.n(b.filter(function (r) { return r.category === 'RWA'; }).length) + ' RWA';
        el.setAttribute('aria-pressed', String(step === k));
      });

      // Breakdown table (offices, vendor or stage)
      if (!tab) tab = defaultTab();
      [].forEach.call(document.querySelectorAll('#tabs .ui-tab'), function (t) {
        var k = t.getAttribute('data-t');
        t.hidden = (k === 'region' && $('regionFilter').value) || (k === 'division' && $('divisionFilter').value) || (k === 'ccc' && $('cccFilter').value);
        t.setAttribute('aria-selected', String(k === tab));
      });
      if (tab === 'stage') {
        var st = {};
        view.forEach(function (r) { var k = r.stage + '\t' + r.sub; (st[k] || (st[k] = { stage: r.stage, sub: r.sub, n: 0 })).n++; });
        var sl = Object.keys(st).map(function (k) { return st[k]; }), smax = Math.max.apply(null, sl.map(function (x) { return x.n; }).concat([0]));
        UI.table('breakdown', {
          rows: sl, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No applications in this view.',
          columns: [
            { key: 'stage', label: 'Stage', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.sub !== 'Blank' ? '<span class="sub">' + UI.esc(x.sub) + '</span>' : ''); } },
            { key: 'n', label: 'Applications', num: true, fmt: UI.n },
            { key: 'share', label: 'Share', sortVal: function (x) { return x.n; }, fmt: function (_, x) { return UI.bar(x.n, smax, UI.pct(x.n, view.length)); }, width: '34%' }
          ],
          onRow: function (x) { stageDrill = [x.stage, x.sub]; render(); }
        });
      } else {
        var key = { region: 'REGION_NORM', division: 'DIVISION_NORM', ccc: 'CCC_NORM', vendor: 'vendorLabel' }[tab], g = {};
        view.forEach(function (r) {
          var name = r[key] || (tab === 'ccc' ? 'CCC pending' : 'Unknown');
          var x = g[name] || (g[name] = { name: name, parent: tab === 'ccc' ? r.DIVISION_NORM : tab === 'division' ? r.REGION_NORM : '', n: 0, agreement: 0, installed: 0, connected: 0 });
          x.n++; if (r.agreement) x.agreement++; if (r.installed) x.installed++; if (r.connected) x.connected++;
        });
        var list = Object.keys(g).map(function (k) { return g[k]; });
        var tot = { n: view.length, agreement: view.filter(STEP.agreement.test).length, installed: view.filter(STEP.installed.test).length, connected: view.filter(STEP.connected.test).length };
        UI.table('breakdown', {
          rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No applications in this view.',
          columns: [
            { key: 'name', label: { region: 'Region', division: 'Division', ccc: 'CCC', vendor: 'Vendor' }[tab], fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Total', num: true, fmt: UI.n },
            { key: 'agreement', label: 'Agreement', num: true, fmt: UI.n, hideSm: true },
            { key: 'installed', label: 'Installed', num: true, fmt: UI.n },
            { key: 'connected', label: 'Connected', num: true, fmt: UI.n },
            { key: 'rate', label: 'Connected %', sortVal: function (x) { return x.n ? x.connected / x.n : 0; }, fmt: function (_, x) { return UI.bar(x.connected, x.n, UI.pct(x.connected, x.n)); }, hideSm: true, width: '24%' }
          ],
          foot: list.length > 1 ? { n: tot.n, agreement: tot.agreement, installed: tot.installed, connected: tot.connected, rate: 0 } : null,
          onRow: function (x) { drill(x); }
        });
      }

      // Funnel and the installed-but-not-connected gap by office
      UI.hist('funnel', [{ key: '', label: 'Applications', value: b.length }].concat(Object.keys(STEP).map(function (k) { return { key: k, label: k === 'vendor' ? 'Vendor' : STEP[k].label, value: b.filter(STEP[k].test).length }; })),
        { active: step || '', onClick: function (row) { step = step === row.key ? '' : row.key; render(); } });
      var gapKey = !$('regionFilter').value ? 'REGION_NORM' : !$('divisionFilter').value ? 'DIVISION_NORM' : 'CCC_NORM', gap = {};
      b.forEach(function (r) { if (r.installed && !r.connected) { var k = r[gapKey] || 'Unknown'; gap[k] = (gap[k] || 0) + 1; } });
      var gl = Object.keys(gap).sort(function (a, c) { return gap[c] - gap[a]; });
      $('gapNote').textContent = UI.n(gl.reduce(function (a, k) { return a + gap[k]; }, 0));
      if (gl.length) UI.hist('gapHist', gl.slice(0, 8).map(function (k) { return { key: k, label: k, value: gap[k] }; }));
      else $('gapHist').innerHTML = '<div class="ui-note">None in this view.</div>';

      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'last', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications in this view.', columns: COLS, onRow: detail });
      window.__view = view;
      $('clearBtn').hidden = !($('q').value || step || cat || stageDrill || $('vendorFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    function progress(r) { return r.connected ? ['ok', 'Connected'] : r.installed ? ['warn', 'Installed'] : r.agreement ? ['', 'Agreement'] : r.vendorSet ? ['', 'Vendor'] : ['', 'Applied']; }
    var COLS = [
      { key: 'name', label: 'Consumer', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || r.appl) + '</span><span class="sub">' + UI.esc(r.appl) + '</span>'; } },
      { key: 'con', label: 'Consumer ID', hideSm: true },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      { key: 'CCC_NORM', label: 'CCC', fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r.DIVISION_NORM) + '</span>'; } },
      { key: 'vendorLabel', label: 'Vendor', hideSm: true, cls: 'wrap' },
      { key: 'kw', label: 'kW', num: true, fmt: function (v) { return v ? UI.n(v) : '—'; } },
      { key: 'last', label: 'Last action', num: true, hideSm: true, sortVal: function (r) { return r.last ? r.last.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.last ? UI.fmtDate(r.last) : ''; } },
      { key: 'state', label: 'Progress', sortVal: function (r) { return r.connected ? 4 : r.installed ? 3 : r.agreement ? 2 : r.vendorSet ? 1 : 0; }, fmt: function (_, r) { var p = progress(r); return '<span class="ui-badge ' + p[0] + '">' + p[1] + '</span>'; }, csv: function (r) { return progress(r)[1]; } }
    ];

    function detail(r) {
      UI.drawer(r.name || r.appl, [r.CCC_NORM, r.DIVISION_NORM, r.REGION_NORM].filter(Boolean).join(' · '), [
        ['Application', r.appl], ['Consumer ID', r.con], ['Mobile', r.mobile], ['Category', r.category === 'Residential-Self' ? 'Residential self' : r.category],
        ['Vendor', r.vendorLabel], ['Stage', r.stage + (r.sub !== 'Blank' ? ' · ' + r.sub : '')], ['Phase', r.phase],
        ['Capacity', r.kw ? r.kw + ' kW' : ''], ['Agreement', r.agreement ? 'Uploaded' : 'Not yet'], ['Installed', r.installed ? 'Yes' : 'No'],
        ['Net metering', r.net ? UI.fmtDate(r.net) : 'Not yet'], ['Last action', r.last ? UI.fmtDate(r.last) : '']
      ]);
    }

    function drill(x) {
      if (tab === 'vendor') { $('vendorFilter').value = x.name; UI.mark($('vendorFilter')); render(); return; }
      if (tab === 'ccc' && x.name === 'CCC pending') return;
      var id = { region: 'regionFilter', division: 'divisionFilter', ccc: 'cccFilter' }[tab];
      if ($(id).disabled) return;
      if (tab === 'ccc' && x.parent && !$('divisionFilter').disabled) { $('divisionFilter').value = x.parent; fillFilters(); }
      $(id).value = x.name;
      fillFilters(); tab = ''; render();
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; }
        if (id === 'divisionFilter') $('cccFilter').value = '';
        fillFilters(); tab = ''; render();
      });
    });
    $('vendorFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('q').addEventListener('input', UI.debounce(render, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); step = step === k ? '' : k; render(); });
    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) { tab = t.getAttribute('data-t'); render(); } });
    $('catSeg').addEventListener('click', function (e) {
      var bt = e.target.closest('button'); if (!bt) return;
      cat = bt.getAttribute('data-c');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === bt)); });
      render();
    });
    $('clearBtn').addEventListener('click', function () {
      $('q').value = ''; step = ''; stageDrill = null; cat = ''; $('vendorFilter').value = '';
      [].forEach.call(document.querySelectorAll('#catSeg button'), function (x) { x.setAttribute('aria-pressed', String(!x.getAttribute('data-c'))); });
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); tab = ''; render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('pm-surya-ghar.csv', [{ key: 'appl', label: 'Application' }, { key: 'name', label: 'Consumer' }, { key: 'con', label: 'Consumer ID' }, { key: 'mobile', label: 'Mobile' },
        { key: 'REGION_NORM', label: 'Region' }, { key: 'DIVISION_NORM', label: 'Division' }, { key: 'CCC_NORM', label: 'CCC' }, { key: 'category', label: 'Category' },
        { key: 'vendorLabel', label: 'Vendor' }, { key: 'stage', label: 'Stage' }, { key: 'sub', label: 'Sub status' }, { key: 'kw', label: 'kW' },
        { key: 'net', label: 'Net metering', csv: function (r) { return r.net ? UI.fmtDate(r.net) : ''; } }, COLS[7]], window.__view || []);
    });

    // lazySync: the home Sync skips these sheets, so this page loads them (docs/reports.md).
    function load(force) {
      var hub = window.mzoDataHub, b = $('refreshBtn');
      if (!hub) { $('meta').textContent = 'Data hub is not available'; return; }
      b.classList.add('spin');
      Promise.all(JOBS.map(function (j) { return Promise.resolve(hub.waitForDataset(j[0], force ? { forceCheck: true } : undefined)).catch(function () {}); }))
        .then(function () { return Promise.all(JOBS.map(function (j) { return hub._peek(j[0]); })); })
        .then(function (csvs) {
          var rows = [];
          csvs.forEach(function (c, i) { rows = rows.concat(ingest(c || '', JOBS[i][1])); });
          var last = rows.reduce(function (a, r) { return r.last && r.last > a ? r.last : a; }, null);
          if (last) {
            var p = function (n) { return String(n).padStart(2, '0'); };
            try { localStorage.setItem('mzo_pmsgy_as_on', p(last.getDate()) + '/' + p(last.getMonth() + 1) + '/' + last.getFullYear()); } catch (e) {}
          }
          if (window.MzoScope) rows = MzoScope.filterRows(rows);
          all = rows;
          if (!all.length) { $('meta').textContent = 'Could not load PM Surya Ghar'; $('appTable').innerHTML = $('breakdown').innerHTML = '<div class="ui-empty">No data.</div>'; return; }
          $('meta').textContent = (last ? 'As on ' + UI.fmtDate(last) + ' · ' : '') + UI.n(all.length) + ' applications';
          fillFilters(); render();
        })
        .catch(function () { $('meta').textContent = 'Could not load PM Surya Ghar'; })
        .then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
