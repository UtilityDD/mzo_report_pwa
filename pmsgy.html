<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PM Surya Ghar · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=23" />
  <script src="/mzo_ui.js?v=21" defer></script>
  <script src="/mzo_data_hub.js?v=94" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=20" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>PM Surya Ghar<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Application, consumer, vendor or stage" aria-label="Search by application, consumer, vendor or stage" autocomplete="off" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec"><div aria-label="Category" id="fCat"></div></div>
        <div class="ui-side-sec"><div aria-label="Progress stage" id="fStep"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Capacity and Vendor">
            <button type="button" role="tab" data-pane="fLoad" aria-pressed="true" aria-selected="true">Capacity</button>
            <button type="button" role="tab" data-pane="fVendor" aria-pressed="false" aria-selected="false">Vendor</button>
          </div>
          <div aria-label="Installed capacity" id="fLoad"></div>
          <div aria-label="Top vendors" id="fVendor" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Applications</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="vendor"><div class="k">Vendor assigned</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="agreement"><div class="k">Agreement</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="installed"><div class="k">Installed</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="connected"><div class="k"><span class="ui-dot ok"></span>Connected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>Breakdown</h2>
            <div class="ui-tabs" role="tablist" id="tabs">
              <button type="button" class="ui-tab" role="tab" data-t="region">Region</button>
              <button type="button" class="ui-tab" role="tab" data-t="division">Division</button>
              <button type="button" class="ui-tab" role="tab" data-t="ccc">CCC</button>
              <button type="button" class="ui-tab" role="tab" data-t="vendor">Vendor</button>
              <button type="button" class="ui-tab" role="tab" data-t="stage">Stage</button>
            </div>
          </div>
          <div id="breakdown" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">Applications</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="appTable"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    // One dataset per district tab; the tab says the region.
    var JOBS = [['pmsgy_malda', 'Malda'], ['pmsgy_uttar_dinajpur', 'Uttar Dinajpur'], ['pmsgy_dakshin_dinajpur', 'Dakshin Dinajpur']];
    var STEP = {
      vendor: { label: 'Vendor assigned', test: function (r) { return r.vendorSet; } },
      agreement: { label: 'Agreement', test: function (r) { return r.agreement; } },
      installed: { label: 'Installed', dot: 'warn', test: function (r) { return r.installed; } },
      connected: { label: 'Connected', dot: 'ok', test: function (r) { return r.connected; } }
    };
    var STEPS = [
      { key: 'vendor', label: 'Vendor assigned', test: function (r) { return r.vendorSet; } },
      { key: 'agreement', label: 'Agreement', test: function (r) { return r.agreement; } },
      { key: 'installed', label: 'Installed', dot: 'warn', test: function (r) { return r.installed; } },
      { key: 'connected', label: 'Connected', dot: 'ok', test: function (r) { return r.connected; } }
    ];
    var CATEGORIES = [
      { key: 'Residential-Self', label: 'Residential self' },
      { key: 'RWA', label: 'RWA' },
      { key: 'Other', label: 'Other' }
    ];
    var LOAD = [
      { key: 'l0', label: 'Up to 2 kW', max: 2 },
      { key: 'l1', label: '2–3 kW', max: 3 },
      { key: 'l2', label: '3–5 kW', max: 5 },
      { key: 'l3', label: 'Above 5 kW', max: Infinity }
    ];
    function loadKey(v) { return (LOAD.filter(function (b) { return v <= b.max; })[0] || LOAD[3]).key; }

    var all = [], f = { q: '', cat: '', step: '', load: '', vendor: '' }, tab = '', stageDrill = null, scope = null;
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    // Sheets sometimes turn masked numbers into 9.87E+09; keep the digits we have.
    function phone(raw) {
      var s = String(raw || '').trim(), m = s.match(/^(\d+)(?:\.(\d+))?[eE]\+(\d+)$/);
      if (!m) return s;
      var d = m[1] + (m[2] || ''), w = +m[3] + 1;
      return d.length >= w ? d.slice(0, w) : d + '•'.repeat(w - d.length);
    }
    function category(d) {
      var s = (d.consumer_category + ' ' + d.category).toLowerCase();
      return /welfare|rwa/.test(s) ? 'RWA' : /self/.test(s) ? 'Residential-Self' : 'Other';
    }
    // Offices: the canonical CCC / division of the row; the region is the tab's when the row names
    // none. A sub-division that is not an MZO office keeps its own text (portal rows from elsewhere).
    function office(d, region) {
      return { region: d._region || region, division: d._division || d.division_name, ccc: d._ccc || d.sub_division_name.replace(/\s*ccc\s*$/i, '').trim() };
    }
    function isApplication(d) { var fl = d.sl_no; return !!(fl && !/^logic$/i.test(fl) && d.application_number); }
    function isSheet(t) { return !!t && t.columns.some(function (c) { return c.name === 'application_number' && c.source_name; }); }

    // t.rows: uniform rows of schema/pmsgy_*.json, already scoped to the login.
    function ingest(t, region) {
      if (!isSheet(t)) return [];
      return t.rows.filter(isApplication).map(function (d) {
        var o = office(d, region), net = UI.date(d.net_metering_date);
        var r = {
          appl: d.application_number, name: UI.title(d.consumer_name), con: d.consumer_number,
          mobile: phone(d.mobile_masked), category: category(d),
          stage: d.current_stage || 'Blank', sub: d.sub_status_of_current_stage || 'Blank',
          phase: d.connection_phase, vendor: d.vendor_name, kw: d.installed_capacity_in_kw || 0,
          net: net, last: UI.date(d.last_action_date),
          vendorSet: !!d.vendor_name, agreement: !!d.agreement_upload_date,
          installed: /installation completed/i.test(d.installation_status), connected: !!net,
          REGION: o.region, DIVISION: o.division, 'CCC NAME': o.ccc, REGION_NORM: o.region, DIVISION_NORM: o.division, CCC_NORM: o.ccc
        };
        r.vendorLabel = r.vendor || 'No vendor';
        r.search = [r.appl, r.name, r.con, r.mobile, r.vendor, r.stage, r.sub, o.ccc, o.division].join(' ').toLowerCase();
        return r;
      });
    }

    function asOnOf(ts) {
      var last = null;
      ts.forEach(function (t) {
        if (isSheet(t)) t.all.forEach(function (d) { var x = isApplication(d) ? UI.date(d.last_action_date) : null; if (x && (!last || x > last)) last = x; });
      });
      return last;
    }

    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', UI.uniq(all, 'REGION_NORM'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r.REGION_NORM === reg; });
      UI.fill('divisionFilter', UI.uniq(r1, 'DIVISION_NORM'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r.DIVISION_NORM === div; });
      UI.fill('cccFilter', UI.uniq(r2, 'CCC_NORM'), 'All CCCs');
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function base(skip) {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        if ((reg && r.REGION_NORM !== reg) || (div && r.DIVISION_NORM !== div) || (ccc && r.CCC_NORM !== ccc)) return false;
        if (skip !== 'cat' && f.cat && r.category !== f.cat) return false;
        if (skip !== 'step' && f.step && !STEP[f.step].test(r)) return false;
        if (skip !== 'load' && f.load && loadKey(r.kw) !== f.load) return false;
        if (skip !== 'vendor' && f.vendor && r.vendorLabel !== f.vendor) return false;
        if (q && r.search.indexOf(q) === -1) return false;
        return true;
      });
    }

    function defaultTab() {
      if (!$('regionFilter').value) return 'region';
      if (!$('divisionFilter').value) return 'division';
      if (!$('cccFilter').value) return 'ccc';
      return 'vendor';
    }

    function renderFacets() {
      // Category
      var bCat = base('cat');
      var catOpts = CATEGORIES.map(function (c) {
        return { value: c.key, label: c.label, count: bCat.filter(function (r) { return r.category === c.key; }).length };
      }).filter(function (o) { return o.count > 0; });
      UI.facet('fCat', catOpts, f.cat, function (v) { f.cat = v; render(); });

      // Step
      var bStep = base('step');
      var stepOpts = STEPS.map(function (s) {
        return { value: s.key, label: s.label, count: bStep.filter(s.test).length, dot: s.dot || '' };
      });
      UI.facet('fStep', stepOpts, f.step, function (v) { f.step = v; render(); });

      // Capacity / Load
      var bLoad = base('load');
      var loadOpts = LOAD.map(function (l) {
        return { value: l.key, label: l.label, count: bLoad.filter(function (r) { return loadKey(r.kw) === l.key; }).length };
      });
      UI.facet('fLoad', loadOpts, f.load, function (v) { f.load = v; render(); });

      // Vendor
      var bVen = base('vendor');
      var vCounts = {};
      bVen.forEach(function (r) { if (r.vendorLabel) vCounts[r.vendorLabel] = (vCounts[r.vendorLabel] || 0) + 1; });
      var topVendors = Object.keys(vCounts).sort(function (a, b) { return vCounts[b] - vCounts[a]; }).slice(0, 8);
      var venOpts = topVendors.map(function (v) {
        return { value: v, label: v, count: vCounts[v] };
      });
      UI.facet('fVendor', venOpts, f.vendor, function (v) { f.vendor = v; render(); });

      var active = (f.q ? 1 : 0) + (f.cat ? 1 : 0) + (f.step ? 1 : 0) + (f.load ? 1 : 0) + (f.vendor ? 1 : 0) +
                   SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active, { fLoad: f.load, fVendor: f.vendor });
    }

    function clearAll() {
      f.q = ''; f.cat = ''; f.step = ''; f.load = ''; f.vendor = ''; stageDrill = null;
      $('q').value = '';
      SELECTS.forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters();
      tab = '';
      render();
    }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return (!stageDrill || (r.stage === stageDrill[0] && r.sub === stageDrill[1])); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? b.filter(STEP[k].test).length : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? UI.pct(c, b.length) + ' of applications' : UI.n(b.filter(function (r) { return r.category === 'RWA'; }).length) + ' RWA';
        el.setAttribute('aria-pressed', String(f.step === k));
      });

      renderFacets();

      // Breakdown table (offices, vendor or stage)
      if (!tab) tab = defaultTab();
      [].forEach.call(document.querySelectorAll('#tabs .ui-tab'), function (t) {
        var k = t.getAttribute('data-t');
        t.hidden = (k === 'region' && $('regionFilter').value) || (k === 'division' && $('divisionFilter').value) || (k === 'ccc' && $('cccFilter').value);
        t.setAttribute('aria-selected', String(k === tab));
      });

      if (tab === 'stage') {
        var st = {};
        view.forEach(function (r) { var k = r.stage + '\t' + r.sub; (st[k] || (st[k] = { stage: r.stage, sub: r.sub, n: 0 })).n++; });
        var sl = Object.keys(st).map(function (k) { return st[k]; }), smax = Math.max.apply(null, sl.map(function (x) { return x.n; }).concat([0]));
        UI.table('breakdown', {
          rows: sl, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No applications in this view.',
          columns: [
            { key: 'stage', label: 'Stage', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.sub !== 'Blank' ? '<span class="sub">' + UI.esc(x.sub) + '</span>' : ''); } },
            { key: 'n', label: 'Applications', num: true, fmt: UI.n },
            { key: 'share', label: 'Share', sortVal: function (x) { return x.n; }, fmt: function (_, x) { return UI.bar(x.n, smax, UI.pct(x.n, view.length)); }, width: '34%' }
          ],
          onRow: function (x) { stageDrill = [x.stage, x.sub]; render(); }
        });
      } else {
        var key = { region: 'REGION_NORM', division: 'DIVISION_NORM', ccc: 'CCC_NORM', vendor: 'vendorLabel' }[tab], g = {};
        view.forEach(function (r) {
          var name = r[key] || (tab === 'ccc' ? 'CCC pending' : 'Unknown');
          var x = g[name] || (g[name] = { name: name, parent: tab === 'ccc' ? r.DIVISION_NORM : tab === 'division' ? r.REGION_NORM : '', n: 0, agreement: 0, installed: 0, connected: 0 });
          x.n++; if (r.agreement) x.agreement++; if (r.installed) x.installed++; if (r.connected) x.connected++;
        });
        var list = Object.keys(g).map(function (k) { return g[k]; });
        var tot = { n: view.length, agreement: view.filter(STEP.agreement.test).length, installed: view.filter(STEP.installed.test).length, connected: view.filter(STEP.connected.test).length };
        UI.table('breakdown', {
          rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No applications in this view.',
          columns: [
            { key: 'name', label: { region: 'Region', division: 'Division', ccc: 'CCC', vendor: 'Vendor' }[tab], fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Total', num: true, fmt: UI.n },
            { key: 'agreement', label: 'Agreement', num: true, fmt: UI.n, hideSm: true },
            { key: 'installed', label: 'Installed', num: true, fmt: UI.n },
            { key: 'connected', label: 'Connected', num: true, fmt: UI.n },
            { key: 'rate', label: 'Connected %', sortVal: function (x) { return x.n ? x.connected / x.n : 0; }, fmt: function (_, x) { return UI.bar(x.connected, x.n, UI.pct(x.connected, x.n), 2); }, hideSm: true, width: '24%' }
          ],
          foot: list.length > 1 ? { n: tot.n, agreement: tot.agreement, installed: tot.installed, connected: tot.connected, rate: 0 } : null,
          onRow: function (x) { drill(x); }
        });
      }

      var totKw = view.reduce(function (sum, r) { return sum + (r.kw || 0); }, 0);
      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(view.length) + (totKw ? ' · ' + UI.n(Math.round(totKw)) + ' kW' : '');
      renderReportHead(view);
      UI.table('appTable', { rows: view, sort: { key: 'last', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications in this view.', columns: COLS, onRow: detail });
      window.__view = view;
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillFilters(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillFilters(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; render(); } });
      }
      if (f.cat) {
        var cMatch = CATEGORIES.filter(function (c) { return c.key === f.cat; })[0];
        active.push({ key: 'cat', label: 'Category: ' + (cMatch ? cMatch.label : f.cat), clear: function () { f.cat = ''; render(); } });
      }
      if (f.step) {
        var sMatch = STEPS.filter(function (s) { return s.key === f.step; })[0];
        active.push({ key: 'step', label: 'Stage: ' + (sMatch ? sMatch.label : f.step), clear: function () { f.step = ''; render(); } });
      }
      if (f.load) {
        var lMatch = LOAD.filter(function (l) { return l.key === f.load; })[0];
        active.push({ key: 'load', label: 'Capacity: ' + (lMatch ? lMatch.label : f.load), clear: function () { f.load = ''; render(); } });
      }
      if (f.vendor) {
        active.push({ key: 'vendor', label: 'Vendor: ' + f.vendor, clear: function () { f.vendor = ''; render(); } });
      }
      if (stageDrill) {
        active.push({ key: 'stageDrill', label: 'Drill: ' + stageDrill[0] + (stageDrill[1] && stageDrill[1] !== 'Blank' ? ' / ' + stageDrill[1] : ''), clear: function () { stageDrill = null; render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    function progress(r) { return r.connected ? ['ok', 'Connected'] : r.installed ? ['warn', 'Installed'] : r.agreement ? ['', 'Agreement'] : r.vendorSet ? ['', 'Vendor'] : ['', 'Applied']; }
    var COLS = [
      { key: 'name', label: 'Consumer', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || r.appl) + '</span><span class="sub">' + UI.esc(r.appl) + '</span>'; } },
      { key: 'con', label: 'Consumer ID', hideSm: true },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      { key: 'CCC_NORM', label: 'CCC', fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r.DIVISION_NORM) + '</span>'; } },
      { key: 'vendorLabel', label: 'Vendor', hideSm: true, cls: 'wrap' },
      { key: 'kw', label: 'kW', num: true, fmt: function (v) { return v ? UI.n(v) : '—'; } },
      { key: 'last', label: 'Last action', num: true, hideSm: true, sortVal: function (r) { return r.last ? r.last.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.last ? UI.fmtDate(r.last) : ''; } },
      { key: 'state', label: 'Progress', sortVal: function (r) { return r.connected ? 4 : r.installed ? 3 : r.agreement ? 2 : r.vendorSet ? 1 : 0; }, fmt: function (_, r) { var p = progress(r); return '<span class="ui-badge ' + p[0] + '">' + p[1] + '</span>'; }, csv: function (r) { return progress(r)[1]; } }
    ];

    function detail(r) {
      UI.drawer(r.name || r.appl, [r.CCC_NORM, r.DIVISION_NORM, r.REGION_NORM].filter(Boolean).join(' · '), [
        ['Application', r.appl], ['Consumer ID', r.con], ['Mobile', r.mobile], ['Category', r.category === 'Residential-Self' ? 'Residential self' : r.category],
        ['Vendor', r.vendorLabel], ['Stage', r.stage + (r.sub !== 'Blank' ? ' · ' + r.sub : '')], ['Phase', r.phase],
        ['Capacity', r.kw ? r.kw + ' kW' : ''], ['Agreement', r.agreement ? 'Uploaded' : 'Not yet'], ['Installed', r.installed ? 'Yes' : 'No'],
        ['Net metering', r.net ? UI.fmtDate(r.net) : 'Not yet'], ['Last action', r.last ? UI.fmtDate(r.last) : '']
      ]);
    }

    function drill(x) {
      if (tab === 'vendor') { f.vendor = x.name; render(); return; }
      if (tab === 'ccc' && x.name === 'CCC pending') return;
      var id = { region: 'regionFilter', division: 'divisionFilter', ccc: 'cccFilter' }[tab];
      if ($(id).disabled) return;
      if (tab === 'ccc' && x.parent && !$('divisionFilter').disabled) { $('divisionFilter').value = x.parent; fillFilters(); }
      $(id).value = x.name;
      fillFilters(); tab = ''; render();
    }

    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; }
        if (id === 'divisionFilter') $('cccFilter').value = '';
        fillFilters(); tab = ''; render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat'); if (!s) return;
      var k = s.getAttribute('data-k');
      f.step = f.step === k ? '' : k;
      render();
    });
    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) { tab = t.getAttribute('data-t'); render(); } });
    $('rhFiltersBar').addEventListener('click', function (e) {
      var clearBtn = e.target.closest('#rhClearBtn');
      if (clearBtn) { clearAll(); return; }
      var chipBtn = e.target.closest('[data-rh-clear]');
      if (chipBtn) {
        var idx = parseInt(chipBtn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
        }
      }
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('pm-surya-ghar.csv', [{ key: 'appl', label: 'Application' }, { key: 'name', label: 'Consumer' }, { key: 'con', label: 'Consumer ID' }, { key: 'mobile', label: 'Mobile' },
        { key: 'REGION_NORM', label: 'Region' }, { key: 'DIVISION_NORM', label: 'Division' }, { key: 'CCC_NORM', label: 'CCC' }, { key: 'category', label: 'Category' },
        { key: 'vendorLabel', label: 'Vendor' }, { key: 'stage', label: 'Stage' }, { key: 'sub', label: 'Sub status' }, { key: 'kw', label: 'kW' },
        { key: 'net', label: 'Net metering', csv: function (r) { return r.net ? UI.fmtDate(r.net) : ''; } }, COLS[7]], window.__view || []);
    });

    function paint(ts) {
      var rws = [];
      ts.forEach(function (t, i) { rws = rws.concat(ingest(t, JOBS[i][1])); });
      var last = asOnOf(ts);
      all = rws;
      if (!all.length) { $('asOn').textContent = '—'; $('appTable').innerHTML = $('breakdown').innerHTML = '<div class="ui-empty">No data.</div>'; return; }
      $('asOn').textContent = last ? UI.fmtDate(last) : '—';
      fillFilters(); render();
    }
    function load(force) {
      var b = $('refreshBtn');
      if (!window.MzoRows) { $('asOn').textContent = 'Unavailable'; return; }
      b.classList.add('spin');
      var done;
      if (force) {
        done = Promise.all(JOBS.map(function (j) { return MzoRows.get(j[0], { forceCheck: true }).catch(function () { return null; }); })).then(paint);
      } else {
        var got = {};
        done = Promise.all(JOBS.map(function (j) {
          return MzoRows.load(j[0], function (t) {
            got[j[0]] = t || got[j[0]] || null;
            if (JOBS.every(function (x) { return x[0] in got; })) paint(JOBS.map(function (x) { return got[x[0]]; }));
          });
        }));
      }
      done.catch(function () { $('asOn').textContent = 'Error'; }).then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
