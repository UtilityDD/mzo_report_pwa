<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REM OSD over ₹5,000 · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>REM OSD over ₹5,000</h1>
        <p id="meta">Non-STW, non-govt. consumers · Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="dateFilter" aria-label="Notice due date"></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="By class">
      <button type="button" class="ui-stat" data-c="Total"><div class="k">All classes</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="DOM"><div class="k">Domestic</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="COM"><div class="k">Commercial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="IND"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-c="Others"><div class="k">Others</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="trendTitle">Trend</h2>
        <div class="ui-seg" id="metric" role="group" aria-label="Measure">
          <button type="button" data-m="amt" aria-pressed="true">Outstanding</button>
          <button type="button" data-m="count" aria-pressed="false">Consumers</button>
        </div>
      </div>
      <div class="ui-panel-b"><div id="trend"><div class="ui-empty">Loading…</div></div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="tableTitle">Offices</h2>
        <div class="ui-actions">
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
          <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
        </div>
      </div>
      <div id="officeTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CLASSES = ['DOM', 'COM', 'IND', 'Others'];
    var CLASS_LABEL = { Total: 'All classes', DOM: 'Domestic', COM: 'Commercial', IND: 'Industrial', Others: 'Others' };
    var all = [], dates = [], cls = 'Total', metric = 'amt', level = 'region', scope = null;

    function dmy(s) { var p = String(s || '').trim().split('/'); return p.length === 3 ? new Date(+p[2], +p[1] - 1, +p[0]) : null; }
    var lakh = function (v) { return UI.inr(v * 1e5); };
    // Short axis labels (the chart gutter is narrow).
    function axisL(v) { var r = v * 1e5, a = Math.abs(r); if (a >= 1e7) return +(r / 1e7).toFixed(a >= 1e9 ? 0 : 1) + ' Cr'; if (a >= 1e5) return +(r / 1e5).toFixed(a >= 1e6 ? 0 : 1) + ' L'; return UI.n(Math.round(r)); }
    function cnt(r, c) { if (c === 'Total') { return CLASSES.reduce(function (a, k) { return a + (+r[k + '-Count'] || 0); }, 0) || (+r['Total-Count'] || 0); } return +r[c + '-Count'] || 0; }
    function amt(r, c) { if (c === 'Total') { return CLASSES.reduce(function (a, k) { return a + (+r[k + '-Amount in Lakhs'] || 0); }, 0) || (+r['Total-Amount in Lakhs'] || 0); } return +r[c + '-Amount in Lakhs'] || 0; }

    function prepare(text) {
      all = UI.csv(text).filter(function (r) { return r['Notice Due Date'] && (r['CCC Code'] || r['CCC name']); }).map(function (r) {
        var code = String(r['CCC Code'] || '').trim(), o = UI.office(code, r['CCC name']);
        r._region = o.region || UI.title(r['Region Name']);
        r._divn = o.division || UI.title(r.Division);
        r._supp = o.ccc || UI.title(r['CCC name']);
        r.CCC_CODE = code;
        r._due = String(r['Notice Due Date']).trim();
        r._dueD = dmy(r._due);
        return r;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      var seen = {};
      all.forEach(function (r) { if (r._dueD && !seen[r._due]) seen[r._due] = r; });
      dates = Object.keys(seen).sort(function (a, b) { return dmy(b) - dmy(a); });
      var cur = $('dateFilter').value;
      $('dateFilter').innerHTML = dates.map(function (d) { return '<option value="' + d + '">Notice due ' + UI.fmtDate(dmy(d)) + '</option>'; }).join('');
      if (cur && dates.indexOf(cur) !== -1) $('dateFilter').value = cur;
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }
    function offices() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) { return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc); });
    }

    function render() {
      var date = $('dateFilter').value || dates[0];
      var idx = dates.indexOf(date), prevDate = idx >= 0 ? dates[idx + 1] : null;
      var o = offices(), now = o.filter(function (r) { return r._due === date; }), before = prevDate ? o.filter(function (r) { return r._due === prevDate; }) : [];
      var any = now[0] || {};
      $('meta').textContent = 'Non-STW, non-govt. consumers' + (any['Report Date/Email Date'] ? ' · REM email ' + UI.fmtDate(dmy(any['Report Date/Email Date'])) : '');

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var c = el.getAttribute('data-c');
        var n = now.reduce(function (a, r) { return a + cnt(r, c); }, 0), a = now.reduce(function (s, r) { return s + amt(r, c); }, 0);
        el.querySelector('.v').textContent = lakh(a);
        el.querySelector('.s').textContent = UI.n(n) + ' consumers' + (n ? ' · avg ' + UI.inr(a * 1e5 / n) : '');
        el.setAttribute('aria-pressed', String(c === cls));
      });

      // Trend across notice dates for the selected class
      var byDate = {};
      o.forEach(function (r) { var b = byDate[r._due] || (byDate[r._due] = { count: 0, amt: 0 }); b.count += cnt(r, cls); b.amt += amt(r, cls); });
      // UI.line thins crowded axis labels itself; the tooltip names the full notice date.
      var asc = dates.slice().reverse();
      var labels = asc.map(function (d) { var x = UI.fmtDate(dmy(d)).split(' '); return x[0] + ' ' + x[1] + ' ' + x[2].slice(2); });
      var vals = asc.map(function (d) { var b = byDate[d]; return b ? b[metric] : null; });
      $('trendTitle').textContent = (metric === 'amt' ? 'Outstanding' : 'Consumers') + ' · ' + CLASS_LABEL[cls];
      UI.line('trend', {
        labels: labels, tipLabels: asc.map(function (d) { return 'Notice due ' + UI.fmtDate(dmy(d)); }),
        series: [{ label: CLASS_LABEL[cls], values: vals, strong: true }], fmt: metric === 'amt' ? lakh : UI.n, axis: metric === 'amt' ? axisL : UI.n, title: 'Trend'
      });

      // Offices on the selected date, with change since the previous notice
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      function add(rows, field) {
        rows.forEach(function (r) {
          var name = r[key] || 'Unknown';
          var x = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, a: 0, pn: 0, pa: 0 });
          if (field === 'now') { x.n += cnt(r, cls); x.a += amt(r, cls); } else { x.pn += cnt(r, cls); x.pa += amt(r, cls); }
        });
      }
      add(now, 'now'); add(before, 'prev');
      var list = Object.keys(g).map(function (k) { var x = g[k]; x.d = prevDate && x.pa ? (x.a - x.pa) / x.pa * 100 : null; return x; }).filter(function (x) { return x.n || x.a || x.pn; });
      var totN = list.reduce(function (s, x) { return s + x.n; }, 0), totA = list.reduce(function (s, x) { return s + x.a; }, 0), totPA = list.reduce(function (s, x) { return s + x.pa; }, 0);
      var maxA = Math.max.apply(null, list.map(function (x) { return x.a; }).concat([0]));
      window.__rows = list;
      $('tableTitle').textContent = CLASS_LABEL[cls] + ' · notice due ' + UI.fmtDate(dmy(date));
      var dl = function (v) { return v == null ? '<span class="ui-muted">—</span>' : '<span class="ui-delta ' + (Math.abs(v) < 0.05 ? 'flat' : v > 0 ? 'bad' : 'ok') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%</span>'; };
      UI.table('officeTable', {
        rows: list, sort: { key: 'a', dir: 'desc' }, count: false, empty: 'No defaulters for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'a', label: 'Outstanding', num: true, fmt: lakh },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.a; }, fmt: function (_, x) { return UI.bar(x.a, maxA, UI.pct(x.a, totA)); }, hideSm: true, width: '26%' },
          { key: 'avg', label: 'Average', num: true, hideSm: true, sortVal: function (x) { return x.n ? x.a / x.n : 0; }, fmt: function (_, x) { return x.n ? UI.inr(x.a * 1e5 / x.n) : '—'; } },
          { key: 'd', label: 'vs previous', num: true, sortVal: function (x) { return x.d == null ? -1e9 : x.d; }, fmt: dl }
        ],
        foot: list.length > 1 ? { n: totN, a: totA, share: null, avg: null, d: prevDate && totPA ? (totA - totPA) / totPA * 100 : null } : null,
        onRow: function (x) { if (level === 'ccc') classes(x.name, now); else drill(x.name); }
      });
    }

    function classes(name, now) {
      var rows = now.filter(function (r) { return r._supp === name; }), first = rows[0] || {};
      UI.drawer(name, [first._divn, first._region].filter(Boolean).join(' · '), ['Total'].concat(CLASSES).map(function (c) {
        var n = rows.reduce(function (a, r) { return a + cnt(r, c); }, 0), a = rows.reduce(function (s, r) { return s + amt(r, c); }, 0);
        return [CLASS_LABEL[c], UI.n(n) + ' consumers · ' + lakh(a)];
      }).concat([['Remarks', first.Remarks && first.Remarks !== 'Nil' ? first.Remarks : ''], ['CCC code', first.CCC_CODE]]));
    }

    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillFilters(); marks(); setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      update();
    }
    function marks() { ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); }); }
    function update() {
      render();
      $('clearBtn').hidden = !(cls !== 'Total' || ($('dateFilter').value && $('dateFilter').value !== dates[0]) || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); marks(); update();
      });
    });
    $('dateFilter').addEventListener('change', update);
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; cls = s.getAttribute('data-c'); update(); });
    $('metric').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      metric = b.getAttribute('data-m');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      update();
    });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      cls = 'Total'; $('dateFilter').value = dates[0] || '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); marks(); setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('rem-osd-' + level + '.csv', [
        { key: 'name', label: 'Office' }, { key: 'parent', label: 'Parent' }, { key: 'n', label: 'Consumers' },
        { key: 'a', label: 'Outstanding (lakh)', csv: function (x) { return x.a.toFixed(2); } }, { key: 'pa', label: 'Previous notice (lakh)', csv: function (x) { return x.pa.toFixed(2); } },
        { key: 'd', label: 'Change %', csv: function (x) { return x.d == null ? '' : x.d.toFixed(1); } }
      ], window.__rows || []);
    });
    UI.refresh('refreshBtn', 'CACHE_REM_v2', function (t) { prepare(t); update(); });

    var first = true;
    UI.load('CACHE_REM_v2', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = $('trend').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      update();
    });
  });
  </script>
</body>
</html>
