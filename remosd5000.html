<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REM OSD over ₹5,000 · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=17" />
  <script src="/mzo_ui.js?v=14" defer></script>
  <script src="/mzo_data_hub.js?v=93" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-kpis .ui-stat { padding: 13px 14px 14px; text-align: left; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .rem-chart-box { padding: 16px 16px 20px; border-bottom: 1px solid var(--mzo-border); }
    .rem-chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .rem-chart-head h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--mzo-text); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>REM OSD over ₹5,000<span class="ui-badge ui-date" id="asOn">…</span></h1>
        <p id="meta" style="display:none"></p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <div class="ui-seg" id="metric" role="group" aria-label="Measure">
          <button type="button" data-m="amt" aria-pressed="true">Outstanding</button>
          <button type="button" data-m="count" aria-pressed="false">Consumers</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search CCC, division or region" autocomplete="off" aria-label="Search offices" title="Search offices" /></label>
          <span class="ui-select"><select id="dateFilter" aria-label="Notice due date"></select></span>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Consumer class" id="fClass"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Measure" id="fMetric"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Trajectory vs previous notice" id="fTraj"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Outstanding bracket" id="fBracket"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats cl-kpis" id="stats" aria-label="By class">
          <button type="button" class="ui-stat" data-c="Total"><div class="k">All classes</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-c="DOM"><div class="k">Domestic</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-c="COM"><div class="k">Commercial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-c="IND"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-c="Others"><div class="k">Others</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title" id="tableTitle">Detailed analysis</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="chartContainer" class="rem-chart-box" hidden>
            <div class="rem-chart-head">
              <h3 id="trendTitle">Trend</h3>
            </div>
            <div id="trendChart"></div>
          </div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CLASSES = ['DOM', 'COM', 'IND', 'Others'];
    var CLASS_LABEL = { Total: 'All classes', DOM: 'Domestic', COM: 'Commercial', IND: 'Industrial', Others: 'Others' };
    var all = [], dates = [], cls = 'Total', metric = 'amt', level = 'region', scope = null;

    // Notice and email dates are uniform dates (ISO); the select keeps them as its values.
    function dmy(s) { return s ? UI.date(s) : null; }
    var lakh = function (v) { return UI.inr(v * 1e5); };
    // Short axis labels (the chart gutter is narrow).
    function axisL(v) { var r = v * 1e5, a = Math.abs(r); if (a >= 1e7) return +(r / 1e7).toFixed(a >= 1e9 ? 0 : 1) + ' Cr'; if (a >= 1e5) return +(r / 1e5).toFixed(a >= 1e6 ? 0 : 1) + ' L'; return UI.n(Math.round(r)); }
    function cnt(r, c) { if (c === 'Total') { return CLASSES.reduce(function (a, k) { return a + (r.n[k] || 0); }, 0) || (r.n.Total || 0); } return r.n[c] || 0; }
    function amt(r, c) { if (c === 'Total') { return CLASSES.reduce(function (a, k) { return a + (r.a[k] || 0); }, 0) || (r.a.Total || 0); } return r.a[c] || 0; }

    // t.rows: uniform rows of schema/rem_osd.json, already scoped to the login by MzoRows.
    function prepare(t) {
      all = t.rows.filter(function (d) { return (d.notice_due_date || d.notice_due_date_raw) && (d.ccc_code || d.ccc_name); }).map(function (d) {
        var r = { n: {}, a: {} };
        ['Total'].concat(CLASSES).forEach(function (k) { var f = k.toLowerCase(); r.n[k] = d[f + '_count']; r.a[k] = d[f + '_amount_in_lakhs']; });
        r._region = d._region || UI.regionName(d.region_name);
        r._divn = d._division || UI.title(d.division);
        r._supp = d._ccc || UI.title(d.ccc_name);
        r.CCC_CODE = d.ccc_code;
        r._due = d.notice_due_date || d.notice_due_date_raw;
        r._dueD = dmy(r._due);
        r.email = d.report_date_email_date;
        r.remarks = d.remarks;
        return r;
      });
      var seen = {};
      all.forEach(function (r) { if (r._dueD && !seen[r._due]) seen[r._due] = r; });
      dates = Object.keys(seen).sort(function (a, b) { return dmy(b) - dmy(a); });
      var cur = $('dateFilter').value;
      $('dateFilter').innerHTML = dates.map(function (d) { return '<option value="' + UI.esc(d) + '">Notice due ' + UI.fmtDate(dmy(d)) + '</option>'; }).join('');
      if (cur && dates.indexOf(cur) !== -1) $('dateFilter').value = cur;
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    var TABS = [
      ['trend', 'Trend Chart'],
      ['region', 'Region'],
      ['division', 'Division'],
      ['ccc', 'CCC'],
      ['classes', 'Class Breakdown'],
      ['hotspots', 'Top Defaulters']
    ];
    var tab = 'trend', renderedTab = '', lastTable = null, lastRows = null, f = { q: '', traj: '', bracket: '' };
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function clearAll() {
      cls = 'Total'; metric = 'amt';
      f.q = ''; f.traj = ''; f.bracket = '';
      $('q').value = '';
      SELECTS.forEach(function (id) { if (!$(id).disabled) set(id, ''); });
      fillFilters();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
      syncControls();
      render();
    }

    function offices() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) { return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc); });
    }

    function dl(v) {
      if (v == null || !isFinite(v)) return '<span class="ui-delta flat">—</span>';
      return '<span class="ui-delta ' + (Math.abs(v) < 0.05 ? 'flat' : v > 0 ? 'bad' : 'ok') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%</span>';
    }

    function renderFacets(now, prevDate, before) {
      // Class facet
      var classOpts = ['Total'].concat(CLASSES).map(function (c) {
        var n = now.reduce(function (a, r) { return a + cnt(r, c); }, 0);
        return { value: c, label: CLASS_LABEL[c], count: n };
      });
      UI.facet('fClass', classOpts, cls, function (val) {
        if (!val) return;
        cls = val;
        syncControls();
        render();
      });

      // Measure facet
      var mOpts = [
        { value: 'amt', label: 'Outstanding amount' },
        { value: 'count', label: 'Consumers count' }
      ];
      UI.facet('fMetric', mOpts, metric, function (val) {
        if (!val) return;
        metric = val;
        syncControls();
        render();
      });

      // Trajectory facet (comparing CCCs now vs prev)
      var cDec = 0, cInc = 0;
      var g = {};
      now.forEach(function (r) {
        var name = r._supp || 'Unknown';
        var x = g[name] || (g[name] = { a: 0, pa: 0 });
        x.a += amt(r, cls);
      });
      before.forEach(function (r) {
        var name = r._supp || 'Unknown';
        var x = g[name] || (g[name] = { a: 0, pa: 0 });
        x.pa += amt(r, cls);
      });
      Object.keys(g).forEach(function (k) {
        var x = g[k];
        if (prevDate && x.pa) {
          if (x.a <= x.pa) cDec++; else cInc++;
        }
      });
      var trajOpts = [
        { value: 'dec', label: 'Decreased OSD (< 0%)', count: cDec, dot: 'ok' },
        { value: 'inc', label: 'Increased OSD (> 0%)', count: cInc, dot: 'warn' }
      ];
      UI.facet('fTraj', trajOpts, f.traj, function (val) { f.traj = val; render(); });

      // Bracket facet
      var bHigh = 0, bMid = 0, bLow = 0;
      Object.keys(g).forEach(function (k) {
        var a = g[k].a;
        if (a >= 50) bHigh++;
        else if (a >= 10) bMid++;
        else bLow++;
      });
      var bracketOpts = [
        { value: 'high', label: '> 50 lakh', count: bHigh, dot: 'warn' },
        { value: 'mid', label: '10 – 50 lakh', count: bMid },
        { value: 'low', label: '< 10 lakh', count: bLow, dot: 'ok' }
      ];
      UI.facet('fBracket', bracketOpts, f.bracket, function (val) { f.bracket = val; render(); });

      var active = (f.q ? 1 : 0) + (cls !== 'Total' ? 1 : 0) + (metric !== 'amt' ? 1 : 0) +
        (f.traj ? 1 : 0) + (f.bracket ? 1 : 0) +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active);
    }

    function syncControls() {
      [].forEach.call(document.querySelectorAll('#metric button'), function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-m') === metric));
      });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        el.setAttribute('aria-pressed', String(el.getAttribute('data-c') === cls));
      });
    }

    function render() {
      var date = $('dateFilter').value || dates[0];
      var idx = dates.indexOf(date), prevDate = idx >= 0 ? dates[idx + 1] : null;
      var o = offices(), now = o.filter(function (r) { return r._due === date; }), before = prevDate ? o.filter(function (r) { return r._due === prevDate; }) : [];
      var any = now[0] || {};

      renderFacets(now, prevDate, before);
      syncControls();

      var dateObj = dmy(date);
      $('asOn').textContent = dateObj ? 'Due ' + UI.fmtDate(dateObj) : '…';
      $('asOn').title = 'Notice due ' + (dateObj ? UI.fmtDate(dateObj) : '') + (any.email ? ' · REM email ' + UI.fmtDate(dmy(any.email)) : '');
      $('meta').textContent = 'Non-STW, non-govt. consumers' + (any.email ? ' · REM email ' + UI.fmtDate(dmy(any.email)) : '');

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var c = el.getAttribute('data-c');
        var n = now.reduce(function (a, r) { return a + cnt(r, c); }, 0), a = now.reduce(function (s, r) { return s + amt(r, c); }, 0);
        el.querySelector('.v').textContent = lakh(a);
        el.querySelector('.s').textContent = UI.n(n) + ' consumers' + (n ? ' · avg ' + UI.inr(a * 1e5 / n) : '');
        el.setAttribute('aria-pressed', String(c === cls));
      });

      var cccCount = UI.uniq(now, '_supp').length;
      var divCount = UI.uniq(now, '_divn').length;
      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = '';
        if (t[0] === 'ccc') extra = '<small>' + cccCount + '</small>';
        else if (t[0] === 'division') extra = '<small>' + divCount + '</small>';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var filterDesc = [
        cls !== 'Total' ? CLASS_LABEL[cls] : '',
        metric === 'count' ? 'Consumer counts' : '',
        f.traj === 'dec' ? 'Decreased OSD (<0%)' : f.traj === 'inc' ? 'Increased OSD (>0%)' : '',
        f.bracket ? 'Bracket: ' + (f.bracket === 'high' ? '>50L' : f.bracket === 'mid' ? '10-50L' : '<10L') : '',
        f.q ? 'Search: "' + f.q + '"' : ''
      ].filter(Boolean).join(' · ');

      var scopeLabel = $('cccFilter').value || ($('divisionFilter').value ? $('divisionFilter').value + ' division' : $('regionFilter').value ? $('regionFilter').value + ' region' : 'Malda Zone');
      $('hint').textContent = [filterDesc ? 'Showing ' + filterDesc : '', tab === 'region' ? 'Notice due ' + UI.fmtDate(dmy(date)) + '.' : ''].filter(Boolean).join(' · ');

      var totAmt = now.reduce(function (s, r) { return s + amt(r, cls); }, 0);
      var totCnt = now.reduce(function (a, r) { return a + cnt(r, cls); }, 0);
      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = lakh(totAmt) + ' · ' + UI.n(totCnt) + ' consumers';
      renderReportHead(now);

      renderTab(date, prevDate, o, now, before, scopeLabel);
    }

    var currentActiveFilters = [];
    function renderReportHead(now) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { set('regionFilter', ''); set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); SELECTS.forEach(function (id) { UI.mark($(id)); }); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); SELECTS.forEach(function (id) { UI.mark($(id)); }); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { set('cccFilter', ''); UI.mark($('cccFilter')); render(); } });
      }
      if (cls && cls !== 'Total') {
        active.push({ key: 'cls', label: 'Class: ' + (CLASS_LABEL[cls] || cls), clear: function () { cls = 'Total'; syncControls(); render(); } });
      }
      if (metric && metric !== 'amt') {
        active.push({ key: 'metric', label: 'Measure: Consumers', clear: function () { metric = 'amt'; syncControls(); render(); } });
      }
      if (f.traj) {
        var trLabel = f.traj === 'dec' ? 'Decreased OSD (<0%)' : 'Increased OSD (>0%)';
        active.push({ key: 'traj', label: 'Trajectory: ' + trLabel, clear: function () { f.traj = ''; render(); } });
      }
      if (f.bracket) {
        var brLabel = f.bracket === 'high' ? '> 50 lakh' : f.bracket === 'mid' ? '10 – 50 lakh' : '< 10 lakh';
        active.push({ key: 'bracket', label: 'Bracket: ' + brLabel, clear: function () { f.bracket = ''; render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    function renderTab(date, prevDate, o, now, before, scopeLabel) {
      lastTable = null;
      lastRows = null;
      var cfg = null;

      if (tab === 'trend') {
        $('chartContainer').hidden = false;
        var byDate = {};
        o.forEach(function (r) {
          var b = byDate[r._due] || (byDate[r._due] = { count: 0, amt: 0, d: r._dueD });
          b.count += cnt(r, cls);
          b.amt += amt(r, cls);
        });

        var asc = dates.slice().reverse();
        var labels = asc.map(function (d) { var x = UI.fmtDate(dmy(d)).split(' '); return x[0] + ' ' + x[1] + ' ' + x[2].slice(2); });
        var vals = asc.map(function (d) { var b = byDate[d]; return b ? b[metric] : null; });
        $('trendTitle').textContent = (metric === 'amt' ? 'Outstanding' : 'Consumers') + ' · ' + CLASS_LABEL[cls] + ' (' + scopeLabel + ')';
        UI.line('trendChart', {
          labels: labels, tipLabels: asc.map(function (d) { return 'Notice due ' + UI.fmtDate(dmy(d)); }),
          series: [{ label: CLASS_LABEL[cls], values: vals, strong: true }], fmt: metric === 'amt' ? lakh : UI.n, axis: metric === 'amt' ? axisL : UI.n, title: 'Trend'
        });

        var trendRows = dates.map(function (d, i) {
          var b = byDate[d] || { count: 0, amt: 0 };
          var pD = dates[i + 1], pB = pD ? byDate[pD] : null;
          var chgAmt = pB && pB.amt ? (b.amt - pB.amt) / pB.amt * 100 : null;
          var chgCnt = pB && pB.count ? (b.count - pB.count) / pB.count * 100 : null;
          return {
            due: d,
            amt: b.amt,
            count: b.count,
            chgAmt: chgAmt,
            chgCnt: chgCnt,
            avg: b.count ? b.amt * 1e5 / b.count : 0
          };
        });

        lastTable = {
          title: 'Timeline · ' + CLASS_LABEL[cls] + ' · ' + scopeLabel,
          cols: ['Notice Due Date', 'Outstanding (Rs)', 'Change vs Previous %', 'Consumers', 'Change in Consumers %', 'Avg / Consumer'],
          rows: trendRows.map(function (r) {
            return [UI.fmtDate(dmy(r.due)), Math.round(r.amt * 1e5), r.chgAmt != null ? r.chgAmt.toFixed(1) + '%' : '—', r.count, r.chgCnt != null ? r.chgCnt.toFixed(1) + '%' : '—', Math.round(r.avg)];
          })
        };

        cfg = {
          rows: trendRows, sort: null, count: false, limit: 30, empty: 'No notice dates available.',
          columns: [
            { key: 'due', label: 'Notice Due', fmt: function (v) { return '<span class="ui-strong">' + UI.fmtDate(dmy(v)) + '</span>'; } },
            { key: 'amt', label: 'Outstanding', num: true, fmt: lakh },
            { key: 'chgAmt', label: 'vs previous', num: true, fmt: dl },
            { key: 'count', label: 'Consumers', num: true, fmt: UI.n },
            { key: 'chgCnt', label: 'Consumers %', num: true, hideSm: true, fmt: dl },
            { key: 'avg', label: 'Average', num: true, hideSm: true, fmt: function (v) { return v ? UI.inr(v) : '—'; } }
          ]
        };
      }
      else {
        $('chartContainer').hidden = true;

        if (tab === 'region' || tab === 'division' || tab === 'ccc' || tab === 'hotspots') {
          var key = (tab === 'region') ? '_region' : (tab === 'division') ? '_divn' : '_supp';
          var g = {}, q = f.q.toLowerCase();

          function addGroup(rows, field) {
            rows.forEach(function (r) {
              var name = r[key] || 'Unknown';
              var x = g[name] || (g[name] = {
                name: name,
                parent: key === '_supp' ? r._divn : key === '_divn' ? r._region : '',
                region: r._region,
                division: r._divn,
                ccc: r._supp,
                code: r.CCC_CODE,
                n: 0, a: 0, pn: 0, pa: 0, remarks: r.remarks
              });
              if (field === 'now') { x.n += cnt(r, cls); x.a += amt(r, cls); }
              else { x.pn += cnt(r, cls); x.pa += amt(r, cls); }
            });
          }
          addGroup(now, 'now');
          addGroup(before, 'prev');

          var list = Object.keys(g).map(function (k) {
            var x = g[k];
            x.d = prevDate && x.pa ? (x.a - x.pa) / x.pa * 100 : null;
            x.avg = x.n ? x.a * 1e5 / x.n : 0;
            return x;
          }).filter(function (x) {
            return x.n || x.a || x.pn;
          }).filter(function (x) {
            if (q && x.name.toLowerCase().indexOf(q) === -1 && (x.parent && x.parent.toLowerCase().indexOf(q) === -1)) return false;
            if (f.traj === 'dec' && (x.d == null || x.d >= 0)) return false;
            if (f.traj === 'inc' && (x.d == null || x.d <= 0)) return false;
            if (f.bracket === 'high' && x.a < 50) return false;
            if (f.bracket === 'mid' && (x.a < 10 || x.a >= 50)) return false;
            if (f.bracket === 'low' && x.a >= 10) return false;
            return true;
          });

          var totN = list.reduce(function (s, x) { return s + x.n; }, 0);
          var totA = list.reduce(function (s, x) { return s + x.a; }, 0);
          var totPA = list.reduce(function (s, x) { return s + x.pa; }, 0);
          var maxA = Math.max.apply(null, list.map(function (x) { return x.a; }).concat([0]));

          lastRows = list;
          var levelTitle = (tab === 'region') ? 'Regions' : (tab === 'division') ? 'Divisions' : (tab === 'ccc') ? 'CCCs' : 'Top Defaulters';
          $('tableTitle').textContent = levelTitle + ' · ' + CLASS_LABEL[cls] + ' · ' + UI.fmtDate(dmy(date));

          lastTable = {
            title: levelTitle + ' (' + UI.fmtDate(dmy(date)) + ')',
            cols: ['Office', 'Consumers', 'Outstanding (lakh)', 'Share %', 'Average (Rs)', 'vs Previous Notice %'],
            rows: list.map(function (x) {
              return [x.name, x.n, x.a.toFixed(2), UI.pct(x.a, totA), Math.round(x.avg), x.d != null ? x.d.toFixed(1) + '%' : '—'];
            })
          };

          var defaultSort = (tab === 'hotspots') ? { key: 'a', dir: 'desc' } : { key: 'a', dir: 'desc' };

          cfg = {
            rows: list, sort: defaultSort, count: false, limit: (tab === 'ccc' || tab === 'hotspots') ? 50 : 0,
            empty: 'No defaulters found for these filters.',
            columns: [
              {
                key: 'name',
                label: (tab === 'region') ? 'Region' : (tab === 'division') ? 'Division' : 'Office',
                fmt: function (v, x) {
                  return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : '');
                }
              },
              { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
              {
                key: 'a', label: 'Outstanding', num: true,
                fmt: function (v) {
                  return '<span class="' + (v > 50 ? 'ui-badge warn' : '') + '">' + lakh(v) + '</span>';
                }
              },
              { key: 'share', label: 'Share', sortVal: function (x) { return x.a; }, fmt: function (_, x) { return UI.bar(x.a, maxA, UI.pct(x.a, totA), 1); }, hideSm: true, width: '22%' },
              { key: 'avg', label: 'Average', num: true, hideSm: true, sortVal: function (x) { return x.avg; }, fmt: function (_, x) { return x.n ? UI.inr(x.avg) : '—'; } },
              { key: 'd', label: 'vs previous', num: true, sortVal: function (x) { return x.d == null ? -1e9 : x.d; }, fmt: dl }
            ],
            foot: list.length > 1 ? { n: totN, a: totA, share: null, avg: totN ? totA * 1e5 / totN : 0, d: prevDate && totPA ? (totA - totPA) / totPA * 100 : null } : null,
            onRow: function (x) {
              if (tab === 'region') drill('region', x.name);
              else if (tab === 'division') drill('division', x.name);
              else classes(x.name, now);
            }
          };
        }
        else if (tab === 'classes') {
          var nowRows = now;
          var prevRows = before;

          var classList = CLASSES.map(function (c) {
            var n = nowRows.reduce(function (s, r) { return s + cnt(r, c); }, 0);
            var a = nowRows.reduce(function (s, r) { return s + amt(r, c); }, 0);
            var pn = prevRows.reduce(function (s, r) { return s + cnt(r, c); }, 0);
            var pa = prevRows.reduce(function (s, r) { return s + amt(r, c); }, 0);
            var chg = prevDate && pa ? (a - pa) / pa * 100 : null;
            return {
              key: c,
              label: CLASS_LABEL[c],
              n: n,
              a: a,
              avg: n ? a * 1e5 / n : 0,
              d: chg
            };
          });

          var totAllN = classList.reduce(function (s, c) { return s + c.n; }, 0);
          var totAllA = classList.reduce(function (s, c) { return s + c.a; }, 0) || 1;

          lastRows = classList;
          lastTable = {
            title: 'Class Breakdown · ' + scopeLabel + ' (' + UI.fmtDate(dmy(date)) + ')',
            cols: ['Class', 'Consumers', 'Outstanding (lakh)', 'Share %', 'Average (Rs)', 'vs Previous Notice %'],
            rows: classList.map(function (c) {
              return [c.label, c.n, c.a.toFixed(2), UI.pct(c.a, totAllA), Math.round(c.avg), c.d != null ? c.d.toFixed(1) + '%' : '—'];
            })
          };

          cfg = {
            rows: classList, sort: { key: 'a', dir: 'desc' }, count: false,
            columns: [
              { key: 'label', label: 'Consumer Class', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
              { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
              { key: 'a', label: 'Outstanding', num: true, fmt: lakh },
              { key: 'share', label: 'Share', sortVal: function (c) { return c.a; }, fmt: function (_, c) { return UI.bar(c.a, totAllA, UI.pct(c.a, totAllA), 1); }, width: '24%' },
              { key: 'avg', label: 'Average', num: true, fmt: function (_, c) { return c.n ? UI.inr(c.avg) : '—'; } },
              { key: 'd', label: 'vs previous', num: true, fmt: dl }
            ],
            foot: {
              label: 'Total All Classes',
              n: totAllN,
              a: totAllA,
              share: 0,
              avg: totAllN ? totAllA * 1e5 / totAllN : 0,
              d: null
            },
            onRow: function (c) {
              cls = c.key;
              syncControls();
              tab = 'ccc';
              render();
            }
          };
        }
      }

      var kState = tab + ':' + cls + ':' + metric + ':' + ($('dateFilter').value || '') + ':' + f.traj + ':' + f.bracket + ':' + ($('regionFilter').value || '') + ':' + ($('divisionFilter').value || '') + ':' + ($('cccFilter').value || '');
      if (renderedTab !== kState) { $('table').__ui = null; renderedTab = kState; }
      UI.table('table', cfg);
    }

    function classes(name, now) {
      var rows = now.filter(function (r) { return r._supp === name; }), first = rows[0] || {};
      var pairs = ['Total'].concat(CLASSES).map(function (c) {
        var n = rows.reduce(function (a, r) { return a + cnt(r, c); }, 0);
        var a = rows.reduce(function (s, r) { return s + amt(r, c); }, 0);
        return [CLASS_LABEL[c], UI.n(n) + ' consumers · ' + lakh(a) + (n ? ' (avg ' + UI.inr(a * 1e5 / n) + ')' : '')];
      }).concat([
        ['Remarks / Bottlenecks', first.remarks && first.remarks !== 'Nil' ? first.remarks : 'None'],
        ['CCC Code', first.CCC_CODE || '—'],
        ['Division', first._divn || '—'],
        ['Region', first._region || '—']
      ]);

      UI.drawer(name, [first._divn, first._region].filter(Boolean).join(' · '), pairs, '', '<button type="button" class="ui-btn sm" data-copy-detail>Copy details</button>');
      var copyBtn = document.querySelector('[data-copy-detail]');
      if (copyBtn) {
        copyBtn.onclick = function () {
          var lines = [
            'Office: ' + name + (first._divn ? ' (' + first._divn + ', ' + first._region + ')' : ''),
            'Notice Due Date: ' + UI.fmtDate(dmy($('dateFilter').value || dates[0])),
            'Defaulter Breakdown (OSD > ₹5,000):'
          ].concat(['Total'].concat(CLASSES).map(function (c) {
            var n = rows.reduce(function (a, r) { return a + cnt(r, c); }, 0);
            var a = rows.reduce(function (s, r) { return s + amt(r, c); }, 0);
            return CLASS_LABEL[c] + ': ' + lakh(a) + ' (' + UI.n(n) + ' consumers)';
          }));
          if (first.remarks && first.remarks !== 'Nil') lines.push('Remarks: ' + first.remarks);
          UI.copy(lines.join('\n')).then(function () { UI.toast('Defaulter details copied'); });
        };
      }
    }

    function set(id, v) { if (!$(id).disabled) $(id).value = v; }

    function drill(targetLevel, name) {
      if (targetLevel === 'region') {
        set('regionFilter', name);
        set('divisionFilter', '');
        set('cccFilter', '');
        tab = 'division';
      } else if (targetLevel === 'division') {
        if (!$('regionFilter').value) {
          var match = all.filter(function (r) { return r._divn === name; })[0];
          if (match && match._region) set('regionFilter', match._region);
        }
        set('divisionFilter', name);
        set('cccFilter', '');
        tab = 'ccc';
      } else {
        set('cccFilter', $('cccFilter').value === name ? '' : name);
      }
      fillFilters();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
      render();
    }

    function clearAll() {
      cls = 'Total';
      metric = 'amt';
      f.q = ''; f.traj = ''; f.bracket = '';
      $('q').value = '';
      if ($('dateFilter')) $('dateFilter').value = dates[0] || '';
      SELECTS.forEach(function (id) { set(id, ''); });
      fillFilters();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
      tab = scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region';
      render();
    }

    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters();
        SELECTS.forEach(function (x) { UI.mark($(x)); });
        render();
      });
    });

    $('dateFilter').addEventListener('change', render);
    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      if (f.q && tab !== 'ccc' && tab !== 'hotspots' && tab !== 'division') tab = 'ccc';
      render();
    }, 180));

    $('metric').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      metric = b.getAttribute('data-m');
      syncControls();
      render();
    });

    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat'); if (!s) return;
      cls = s.getAttribute('data-c');
      syncControls();
      render();
    });

    $('tabs').addEventListener('click', function (e) {
      var t = e.target.closest('.ui-drill-tab'); if (t) { tab = t.getAttribute('data-t'); render(); }
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var clearBtn = e.target.closest('#rhClearBtn');
      if (clearBtn) { clearAll(); return; }
      var chipBtn = e.target.closest('[data-rh-clear]');
      if (chipBtn) {
        var idx = parseInt(chipBtn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
        }
      }
    });

    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = ['*REM OSD — ' + lastTable.title + '*', lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
    });

    $('exportBtn').addEventListener('click', function () {
      if (!lastTable) return;
      UI.exportCsv('rem-osd-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
    });

    MzoRows.refresh('refreshBtn', 'rem_osd', function (t) { prepare(t); render(); });

    var first = true;
    MzoRows.load('rem_osd', function (t, info) {
      if (!t) {
        if (info && info.error) {
          $('meta').textContent = 'Could not load data';
          $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
        }
        return;
      }
      prepare(t);
      if (first) {
        first = false;
        var p = new URLSearchParams(location.search);
        var reg = p.get('region'), div = p.get('division'), ccc = p.get('ccc');
        if (reg) set('regionFilter', reg);
        if (div) set('divisionFilter', div);
        if (ccc) set('cccFilter', ccc);
        if (p.get('class')) {
          var cl = p.get('class').toUpperCase();
          if (CLASSES.indexOf(cl) !== -1 || cl === 'TOTAL') cls = cl === 'TOTAL' ? 'Total' : cl;
        }
        if (p.get('metric')) {
          var m = p.get('metric').toLowerCase();
          if (m === 'amt' || m === 'count') metric = m;
        }
        if (p.get('date')) {
          var dt = p.get('date');
          if (dates.indexOf(dt) !== -1) $('dateFilter').value = dt;
        }
        fillFilters();
        SELECTS.forEach(function (id) { UI.mark($(id)); });
        if (TABS.some(function (t) { return t[0] === p.get('tab'); })) {
          tab = p.get('tab');
        } else {
          if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
          else if (scope && scope.level === 'region') tab = 'division';
          else tab = 'trend';
        }
      }
      render();
    });
  });
  </script>
</body>
</html>
