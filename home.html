<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Home · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <script src="/mzo_pwa_icons.js"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=23" />
  <style>
    .home {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px));
    }
    .home-hero {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px 22px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(10px);
      animation: homeIn .45s cubic-bezier(.2, .8, .2, 1) .05s forwards;
    }
    .home-mark {
      width: 72px; height: 72px; border-radius: 18px; overflow: hidden;
      background: #fff; box-shadow: 0 0 0 1px var(--mzo-border);
      flex: none;
    }
    .home-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .home-brand { min-width: 0; }
    .home-name {
      margin: 0; font-size: 28px; font-weight: 750; letter-spacing: -0.03em;
      line-height: 1.15; color: var(--mzo-text);
    }
    .home-expand {
      margin: 4px 0 0; font-size: 13.5px; line-height: 1.4; color: var(--mzo-muted);
      max-width: 42ch;
    }
    .home-scope {
      margin: 8px 0 0; font-size: 12px; color: var(--mzo-faint);
      font-variant-numeric: tabular-nums;
    }
    .home-cta {
      display: inline-flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 16px; border-radius: 999px;
      background: var(--mzo-fill); color: var(--mzo-on-fill);
      font-size: 13.5px; font-weight: 600; border: 0; cursor: pointer;
      white-space: nowrap;
    }
    .home-cta:hover { filter: brightness(1.05); }
    .home-cta:active { transform: scale(.98); }
    .home-cta .ui-i { width: 16px; height: 16px; }

    /* DISHA Collect strip: neutral card, amber status dot (colour is the mark, text stays ink). */
    .home-collect {
      width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px;
      padding: 12px 14px; border-radius: 12px; cursor: pointer; text-align: left;
      border: 1px solid var(--mzo-border-strong); background: var(--mzo-surface);
      color: var(--mzo-text); font: inherit; font-size: 13.5px; font-weight: 600;
    }
    .home-collect:hover { background: var(--mzo-hover); }
    .home-collect:focus-visible { outline: 2px solid var(--mzo-accent); outline-offset: 2px; }
    .home-collect-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--mzo-warn-mark); flex: none;
    }
    .home-collect-go { margin-left: auto; font-size: 12.5px; font-weight: 500; color: var(--mzo-muted); white-space: nowrap; }

    .home-sec {
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(12px);
      animation: homeIn .45s cubic-bezier(.2, .8, .2, 1) forwards;
    }
    .home-sec:nth-of-type(2) { animation-delay: .12s; }
    .home-sec:nth-of-type(3) { animation-delay: .2s; }
    .home-sec:nth-of-type(4) { animation-delay: .28s; }
    .home-sec-h {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 0 0 10px;
    }
    .home-sec-h h2 {
      margin: 0; font-size: 12px; font-weight: 650; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--mzo-muted);
    }
    .home-sec-h span { font-size: 12px; color: var(--mzo-faint); }

    .home-mosaic {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .home-tile {
      position: relative;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      gap: 18px; min-height: 96px; padding: 14px 14px 12px;
      border-radius: 14px; border: 1px solid var(--mzo-border);
      background: var(--mzo-surface); color: inherit; text-align: left; cursor: pointer;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .home-tile::before {
      content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--tile, var(--mzo-accent));
    }
    .home-tile:hover {
      border-color: var(--mzo-border-strong);
      background: var(--mzo-surface-2);
    }
    .home-tile:active:not(.swap-out):not(.swap-in) { transform: scale(.985); }
    .home-tile .t { font-size: 14px; font-weight: 650; line-height: 1.25; padding-left: 8px; }
    .home-tile .g { font-size: 11.5px; color: var(--mzo-muted); padding-left: 8px; margin-top: 2px; }
    .home-tile .go {
      padding-left: 8px; font-size: 12px; font-weight: 600; color: var(--mzo-faint);
      letter-spacing: 0.01em;
    }
    .home-tile:hover .go { color: var(--mzo-muted); }
    .home-tile.swap-out {
      animation: tileSwapOut .32s cubic-bezier(.4, 0, .7, .2) forwards;
      pointer-events: none;
    }
    .home-tile.swap-in {
      animation: tileSwapIn .42s cubic-bezier(.2, .8, .2, 1) forwards;
    }
    @keyframes tileSwapOut {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(10px) scale(.94); }
    }
    @keyframes tileSwapIn {
      0% { opacity: 0; transform: translateY(-12px) scale(.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .home-list {
      display: grid; gap: 4px;
      border: 1px solid var(--mzo-border); border-radius: 12px;
      background: var(--mzo-surface); overflow: hidden;
    }
    .home-row {
      display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px;
      padding: 11px 12px; border: 0; background: transparent; color: inherit;
      text-align: left; cursor: pointer; width: 100%;
      border-top: 1px solid var(--mzo-border);
    }
    .home-row:first-child { border-top: 0; }
    .home-row:hover { background: var(--mzo-hover-soft); }
    .home-row .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--tile, var(--mzo-accent));
    }
    .home-row .lbl { font-size: 13.5px; font-weight: 550; }
    .home-row .sub { font-size: 11.5px; color: var(--mzo-muted); margin-top: 1px; }
    .home-row .chev { color: var(--mzo-faint); font-size: 16px; line-height: 1; }
    .home-empty {
      padding: 14px 16px; font-size: 13px; color: var(--mzo-muted);
      border: 1px dashed var(--mzo-border); border-radius: 12px;
    }

    @keyframes homeIn {
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .home-hero, .home-sec { animation: none; opacity: 1; transform: none; }
      .home-tile.swap-out, .home-tile.swap-in { animation: none; }
    }

    @media (max-width: 900px) {
      .home { padding: 16px 12px calc(72px + env(safe-area-inset-bottom, 0px)); }
      .home-hero {
        grid-template-columns: 1fr;
        justify-items: center; text-align: center;
        gap: 12px; margin-bottom: 20px;
      }
      .home-mark { width: 64px; height: 64px; border-radius: 16px; }
      .home-name { font-size: 24px; }
      .home-expand { max-width: 34ch; margin-left: auto; margin-right: auto; }
      .home-cta { width: min(100%, 280px); justify-content: center; height: 42px; }
      .home-mosaic {
        display: flex; gap: 8px;
        overflow-x: auto; overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory; scroll-padding-left: 2px;
        padding: 2px 2px 6px; margin: 0 -2px;
        scrollbar-width: none;
      }
      .home-mosaic::-webkit-scrollbar { display: none; }
      .home-tile {
        flex: 0 0 min(168px, 68vw);
        scroll-snap-align: start;
        min-height: 88px; padding: 12px;
      }
    }
    @media (min-width: 901px) and (max-width: 1100px) {
      .home-mosaic { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="ui-page home" id="home">
    <header class="home-hero">
      <div class="home-mark" aria-hidden="true">
        <img src="/icons/disha-app-mark.png?v=309" alt="" width="128" height="128" />
      </div>
      <div class="home-brand">
        <h1 class="home-name">DISHA</h1>
        <p class="home-expand">Distribution Insights for Swift &amp; Holistic Action</p>
        <p class="home-scope" id="homeScope" hidden></p>
      </div>
      <button type="button" class="home-cta" id="openBriefing">
        Open briefing
        <svg class="ui-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </header>

    <section class="home-sec" id="collectSec" hidden>
      <button type="button" class="home-collect" id="collectBanner">
        <span class="home-collect-dot" aria-hidden="true"></span>
        <span id="collectBannerTxt">Collect due</span>
        <span class="home-collect-go">Open Collect ›</span>
      </button>
    </section>

    <section class="home-sec" aria-labelledby="spotH">
      <div class="home-sec-h">
        <h2 id="spotH">Reports</h2>
      </div>
      <div class="home-mosaic" id="spotGrid"></div>
    </section>

    <section class="home-sec" aria-labelledby="favH" id="favSec" hidden>
      <div class="home-sec-h">
        <h2 id="favH">Favourites</h2>
      </div>
      <div class="home-list" id="favList"></div>
    </section>

    <section class="home-sec" aria-labelledby="recH" id="recSec" hidden>
      <div class="home-sec-h">
        <h2 id="recH">Recent</h2>
      </div>
      <div class="home-list" id="recList"></div>
    </section>
  </main>

  <script src="/mzo_scope.js?v=20"></script>
  <script>
    (function () {
      'use strict';

      var HUES = {
        c1: 'var(--mzo-c1)', c2: 'var(--mzo-c2)', c3: 'var(--mzo-c3)',
        c4: 'var(--mzo-c4)', c5: 'var(--mzo-c5)', c6: 'var(--mzo-c6)',
        warn: 'var(--mzo-warn-mark)'
      };

      // Full launch pool. A subset is shown; cards rotate while the user stays on Home.
      var POOL = [
        { k: 'nsc', n: 'Pending NSC', g: 'New service connection', hue: 'c1' },
        { k: 'weekly', n: 'Weekly deposit vs disposal', g: 'New service connection', hue: 'c1' },
        { k: 'withheld', n: 'Withheld', g: 'New service connection', hue: 'c1' },
        { k: 'pending_mc', n: 'Pending master card', g: 'New service connection', hue: 'c1' },
        { k: 'solar', n: 'Solar connection', g: 'New service connection', hue: 'c1' },
        { k: 'jjm', n: 'JJM connection', g: 'New service connection', hue: 'c1' },
        { k: 'collection', n: 'Collection', g: 'Revenue', hue: 'c5' },
        { k: 'loss', n: 'Losses', g: 'Revenue', hue: 'c5' },
        { k: 'disconnection', n: 'Disconnection', g: 'Revenue', hue: 'c5' },
        { k: 'performance_index', n: 'Performance index', g: 'Revenue', hue: 'c5' },
        { k: 'theft_assessment', n: 'Theft assessment', g: 'Revenue', hue: 'c5' },
        { k: 'remosd5000', n: 'REM OSD > ₹5,000', g: 'Revenue', hue: 'c5' },
        { k: 'docket', n: 'Docket calls', g: 'Consumers & meters', hue: 'c2' },
        { k: 'defective_meter', n: 'Defective meter', g: 'Consumers & meters', hue: 'c2' },
        { k: 'unbilled', n: 'Unbilled & exceptions', g: 'Consumers & meters', hue: 'c2' },
        { k: 'smart_meter', n: 'Smart meters', g: 'Consumers & meters', hue: 'c2' },
        { k: 'upcoming_dd', n: 'Upcoming DD', g: 'DD visit', hue: 'c6' },
        { k: 'dd_visit_page', n: 'DD visit', g: 'DD visit', hue: 'c6' },
        { k: 'power_map', n: 'Power map', g: 'Substation & network', hue: 'c3' },
        { k: 'feeder_outage', n: 'Feeder outage', g: 'Substation & network', hue: 'c3' },
        { k: 'capex_all', n: 'Capex summary', g: 'Vendor advances', hue: 'c4' },
        { k: 'advance_onm', n: 'O&M summary', g: 'Vendor advances', hue: 'c4' },
        { k: 'cmo', n: 'CMO grievance', g: 'Important', hue: 'warn' },
        { k: 'pmsgy', n: 'PM Surya Ghar', g: 'Important', hue: 'warn' },
        { k: 'accident', n: 'Accident reports', g: 'Important', hue: 'warn' },
        { k: 'stock', n: 'Stock', g: 'Important', hue: 'warn' },
        { k: 'dtr', n: 'DTR records', g: 'Important', hue: 'warn' },
        { k: 'media_news', n: 'Power news hub', g: 'Media', hue: 'c3' }
      ];
      var VISIBLE = 9;
      var ROTATE_MS = 7000;
      var SWAP_STAGGER_MS = 90;
      var SWAP_OUT_MS = 320;

      var NAMES = {
        nsc: 'Pending NSC', historical_nsc: 'NSC: Historical Analysis', nsc_kpi: 'NSC KPIs', weekly: 'Weekly deposit vs disposal',
        pending_mc: 'Pending master card', withheld: 'Withheld', pending_load_extension: 'Pending load extension',
        solar: 'Solar connection', jjm: 'JJM connection', meter_utilization: 'Meter utilization', wridd: 'WRIDD schemes',
        bharatnet: 'Bharat Net', icds: 'ICDS connections', loss: 'Losses', performance_index: 'Performance index',
        collection: 'Collection', disconnection: 'Disconnection tracker', theft_assessment: 'Theft assessment',
        remosd5000: 'REM OSD > ₹5,000', rem_defaulters: 'REM defaulters', upcoming_dd: 'Upcoming DD',
        dd_visit_page: 'DD visit', defective_meter: 'Defective meter', unbilled: 'Unbilled & exceptions',
        consumers: 'Consumers', docket: 'Docket calls', docket_kpi: 'Docket KPI', smart_meter: 'Smart meter utilization',
        capex_all: 'Capex summary', advance_onm: 'O&M summary', power_map: 'Power map',
        highway_crossings: 'Line–highway crossings', prt_oil: 'PRT / transformer records', feeder_outage: 'Feeder outage',
        cmo: 'CMO grievance', pmsgy: 'PM Surya Ghar', si_works: 'Priority SI works', accident: 'Accident reports',
        safety_app: 'Safety app reports', manpower: 'Manpower report', upkeeping: 'Substation upkeeping',
        dtr: 'DTR records', dtr_load: 'Peak load measurements', health_checkup: 'Health check-up',
        puja: 'Durga Puja 2026', stock: 'Stock', important_sheets: 'Important data sheets', sheet_links: 'Sheet links',
        media_news: 'Power news hub', briefing: 'Briefing', ask: 'Ask'
      };

      var HUE_BY_KEY = {
        nsc: 'c1', historical_nsc: 'c1', nsc_kpi: 'c1', weekly: 'c1', pending_mc: 'c1', withheld: 'c1',
        pending_load_extension: 'c1', solar: 'c1', jjm: 'c1', meter_utilization: 'c1', wridd: 'c1',
        bharatnet: 'c1', icds: 'c1', loss: 'c5', performance_index: 'c5', collection: 'c5',
        disconnection: 'c5', theft_assessment: 'c5', remosd5000: 'c5', rem_defaulters: 'c5',
        upcoming_dd: 'c6', dd_visit_page: 'c6', defective_meter: 'c2', unbilled: 'c2', consumers: 'c2',
        docket: 'c2', docket_kpi: 'c2', smart_meter: 'c2', capex_all: 'c4', advance_onm: 'c4',
        power_map: 'c3', highway_crossings: 'c3', prt_oil: 'c3', feeder_outage: 'c3',
        cmo: 'warn', pmsgy: 'warn', si_works: 'warn', accident: 'warn', safety_app: 'warn',
        manpower: 'warn', upkeeping: 'warn', dtr: 'warn', dtr_load: 'warn', health_checkup: 'warn',
        puja: 'warn', stock: 'warn'
      };

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      function openKey(k) {
        if (!k) return;
        try {
          if (window.parent !== window) {
            window.parent.location.hash = '#' + encodeURIComponent(k);
            return;
          }
        } catch (e) {}
        location.href = '/app.html#' + encodeURIComponent(k);
      }
      function lsJson(key) {
        try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
      }
      // Inside the shell, its module index is the truth: it applies the modules list, sheet access,
      // admin-only groups and retired-key aliases. On its own, fall back to the profile's modules list.
      function shellMods() {
        try {
          var m = window.parent !== window && window.parent.__MZO_MODS__;
          return m && typeof m === 'object' ? m : null;
        } catch (e) { return null; }
      }
      var ALIAS = { perf_index_imp: 'performance_index' };
      function allowedModules() {
        try {
          var p = JSON.parse(localStorage.getItem('mzo_user_profile') || 'null');
          if (!p || String(p.role || '').toLowerCase() === 'admin') return null;
          if (Array.isArray(p.modules)) return p.modules.map(function (k) { return ALIAS[k] || k; });
        } catch (e) {}
        return null;
      }
      function canSee(k) {
        var sm = shellMods();
        if (sm) return !!sm[k];
        if (/^admin_/.test(k) || k === 'sheet_links') return false;
        var mods = allowedModules();
        if (!mods) return true;
        return mods.indexOf(k) !== -1;
      }
      // Same name and group as the sidebar when the shell is there.
      function label(k, fallback) {
        var sm = shellMods();
        return (sm && sm[k] && sm[k].n) || fallback || NAMES[k] || k;
      }
      function groupLabel(k, fallback) {
        var sm = shellMods();
        return (sm && sm[k] && sm[k].g) || fallback || '';
      }

      function paintScope() {
        var el = document.getElementById('homeScope');
        if (!el || !window.MzoScope) return;
        try {
          if (MzoScope.isUnscoped && MzoScope.isUnscoped()) { el.hidden = true; return; }
          var sc = MzoScope.getScope && MzoScope.getScope();
          if (!sc) { el.hidden = true; return; }
          var bits = [];
          if (sc.region) bits.push(sc.region);
          if (sc.division) bits.push(sc.division);
          if (sc.ccc) bits.push(sc.ccc);
          if (!bits.length && sc.level) bits.push(sc.level);
          if (!bits.length) { el.hidden = true; return; }
          el.textContent = bits.join(' · ');
          el.hidden = false;
        } catch (e) { el.hidden = true; }
      }

      function tileInner(t) {
        return '<div><div class="t">' + esc(label(t.k, t.n)) + '</div><div class="g">' + esc(groupLabel(t.k, t.g)) + '</div></div>' +
          '<div class="go">Open ›</div>';
      }
      function fillTile(el, t) {
        var hue = HUES[t.hue] || HUES.c1;
        el.setAttribute('data-k', t.k);
        el.style.setProperty('--tile', hue);
        el.innerHTML = tileInner(t);
      }
      function tileHtml(t) {
        var hue = HUES[t.hue] || HUES.c1;
        return '<button type="button" class="home-tile" data-k="' + esc(t.k) + '" style="--tile:' + hue + '">' +
          tileInner(t) + '</button>';
      }

      function rowHtml(k) {
        var hue = HUES[HUE_BY_KEY[k] || 'c1'] || HUES.c1;
        var name = label(k);
        return '<button type="button" class="home-row" data-k="' + esc(k) + '" style="--tile:' + hue + '">' +
          '<span class="dot" aria-hidden="true"></span>' +
          '<span><span class="lbl">' + esc(name) + '</span></span>' +
          '<span class="chev" aria-hidden="true">›</span></button>';
      }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      }
      function pickVisible(pool, n) {
        return shuffle(pool).slice(0, Math.min(n, pool.length));
      }

      var shown = [];
      var pool = [];
      var rotateTimer = null;
      var reduceMotion = false;
      try { reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

      function paintSpot(initial) {
        var grid = document.getElementById('spotGrid');
        pool = POOL.filter(function (t) { return canSee(t.k); });
        if (!pool.length) {
          shown = [];
          grid.innerHTML = '<div class="home-empty">No reports available for your login.</div>';
          return;
        }
        shown = pickVisible(pool, VISIBLE);
        grid.innerHTML = shown.map(tileHtml).join('');
        if (initial) startRotate();
      }

      function waitingKeys() {
        var on = {};
        shown.forEach(function (t) { on[t.k] = 1; });
        return pool.filter(function (t) { return !on[t.k]; });
      }

      function swapOne(slot, next, done) {
        var grid = document.getElementById('spotGrid');
        var el = grid && grid.children[slot];
        if (!el || !next) { if (done) done(); return; }
        shown[slot] = next;
        if (reduceMotion) {
          fillTile(el, next);
          if (done) done();
          return;
        }
        el.classList.remove('swap-in');
        el.classList.add('swap-out');
        setTimeout(function () {
          fillTile(el, next);
          el.classList.remove('swap-out');
          el.classList.add('swap-in');
          setTimeout(function () {
            el.classList.remove('swap-in');
            if (done) done();
          }, 420);
        }, SWAP_OUT_MS);
      }

      // Hold the tiles still while someone is using them: hover, keyboard focus on a tile, or a tap /
      // swipe in the last few seconds (a tile must not change under a finger or a focused button).
      var lastTouch = 0;
      function rotateOnce() {
        if (document.hidden) return;
        var grid = document.getElementById('spotGrid');
        if (!grid || grid.matches(':hover')) return;
        if (!grid.offsetParent) return; // the shell keeps Home loaded but hidden behind another report
        if (grid.contains(document.activeElement)) return;
        if (Date.now() - lastTouch < 5000) return;
        var spare = waitingKeys();
        if (!spare.length || shown.length < 2) return;
        spare = shuffle(spare);
        var slots = shuffle(shown.map(function (_, i) { return i; }));
        var n = Math.min(3, spare.length, Math.max(1, Math.floor(shown.length / 3)));
        var i = 0;
        function step() {
          if (i >= n) return;
          var slot = slots[i];
          var next = spare[i];
          i += 1;
          swapOne(slot, next, function () {
            setTimeout(step, SWAP_STAGGER_MS);
          });
        }
        step();
      }

      function startRotate() {
        stopRotate();
        // Reduced motion: no auto-changing content at all (content that changes on its own every few
        // seconds with no pause control is the problem, not only the animation).
        if (reduceMotion) return;
        if (pool.length <= shown.length) return;
        rotateTimer = setInterval(rotateOnce, ROTATE_MS);
      }
      function stopRotate() {
        if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }
      }

      function paintLists() {
        var canonK = function (k) { return ALIAS[k] || k; };
        var fav = lsJson('mzo_ws_favs').map(canonK).filter(function (k, i, a) {
          return k && k !== 'home' && k !== 'ask' && k !== 'briefing' && canSee(k) && a.indexOf(k) === i;
        }).slice(0, 8);
        var rec = lsJson('mzo_ws_recent').map(canonK).filter(function (k, i, a) {
          return k && k !== 'home' && k !== 'ask' && k !== 'briefing' && canSee(k) && a.indexOf(k) === i && fav.indexOf(k) === -1;
        }).slice(0, 6);
        var favSec = document.getElementById('favSec');
        var recSec = document.getElementById('recSec');
        var favList = document.getElementById('favList');
        var recList = document.getElementById('recList');
        if (fav.length) {
          favSec.hidden = false;
          favList.innerHTML = fav.map(rowHtml).join('');
        } else favSec.hidden = true;
        if (rec.length) {
          recSec.hidden = false;
          recList.innerHTML = rec.map(rowHtml).join('');
        } else recSec.hidden = true;
      }

      function onClick(e) {
        var btn = e.target.closest('[data-k]');
        if (!btn) return;
        openKey(btn.getAttribute('data-k'));
      }

      function paintCollect() {
        var sec = document.getElementById('collectSec');
        var txt = document.getElementById('collectBannerTxt');
        fetch('/api/collect/status', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
          .then(function (r) { return r.json().catch(function () { return null; }); })
          .then(function (d) {
            var n = (d && d.available && Number(d.pending_count)) || 0;
            if (!sec) return;
            if (n > 0) {
              sec.hidden = false;
              if (txt) txt.textContent = n === 1 ? '1 report to fill in for your office' : (n + ' reports to fill in for your office');
            } else sec.hidden = true;
          })
          .catch(function () { if (sec) sec.hidden = true; });
      }

      function boot() {
        paintScope();
        paintSpot(true);
        paintLists();
        paintCollect();
        var spot = document.getElementById('spotGrid');
        spot.addEventListener('click', onClick);
        ['pointerdown', 'touchstart', 'scroll'].forEach(function (ev) {
          spot.addEventListener(ev, function () { lastTouch = Date.now(); }, { passive: true });
        });
        document.getElementById('favList').addEventListener('click', onClick);
        document.getElementById('recList').addEventListener('click', onClick);
        document.getElementById('openBriefing').addEventListener('click', function () { openKey('briefing'); });
        document.getElementById('collectBanner').addEventListener('click', function () { openKey('collect'); });
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) stopRotate();
          else { startRotate(); paintCollect(); }
        });
        setInterval(function () { if (!document.hidden) paintCollect(); }, 60000);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
