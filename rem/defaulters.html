<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REM defaulters · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .rd-copy { margin-left: auto; margin-right: 2px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>REM defaulters</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Consumer ID, name or address" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Base class"><option value="">All base classes</option></select></span>
      <span class="ui-select"><select id="tagFilter" aria-label="Consumer type">
        <option value="">Any consumer</option>
        <option value="school">Schools</option>
        <option value="party">Party offices</option>
        <option value="tower">Telecom towers</option>
      </select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="By type">
      <button type="button" class="ui-stat" data-t=""><div class="k">All defaulters</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-t="DOM"><div class="k">Domestic</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-t="COM"><div class="k">Commercial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-t="IND"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-t="AGRI"><div class="k">Agriculture</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Last payment</h2></div>
          <div class="ui-panel-b"><div id="payHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Outstanding size</h2></div>
          <div class="ui-panel-b"><div id="osdHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Consumers <small id="count"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="table"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var TYPE = { DOM: 'Domestic', COM: 'Commercial', IND: 'Industrial', AGRI: 'Agriculture' };
    var PAY = [
      { key: 'p0', label: 'Within a month', test: function (m, d) { return d != null && d <= 30; } },
      { key: 'p1', label: '1–3 months', test: function (m, d) { return d > 30 && m < 3; } },
      { key: 'p2', label: '3–6 months', test: function (m) { return m >= 3 && m < 6; } },
      { key: 'p3', label: '6–12 months', test: function (m) { return m >= 6 && m < 12; } },
      { key: 'p4', label: 'Over a year', test: function (m) { return m >= 12; } },
      { key: 'p5', label: 'No payment date', test: function (m, d) { return d == null; } }
    ];
    var OSD = [
      { key: 'o0', label: 'Over ₹1 lakh', min: 1e5, max: Infinity },
      { key: 'o1', label: '₹50K – 1 lakh', min: 5e4, max: 1e5 },
      { key: 'o2', label: '₹25K – 50K', min: 2.5e4, max: 5e4 },
      { key: 'o3', label: '₹10K – 25K', min: 1e4, max: 2.5e4 },
      { key: 'o4', label: 'Under ₹10K', min: -Infinity, max: 1e4 }
    ];
    var parts = { DOM: [], AGRI: [], IC: [] }, all = [], f = { q: '', type: '', pay: '', osd: '' }, level = 'region', scope = null;

    function tsv(text) {
      var lines = String(text || '').replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
      if (!lines.length) return [];
      var head = lines[0].split('\t').map(function (h) { return h.trim(); });
      var gi = head.indexOf('GOVT_STAT'), ai = head.indexOf('ADDRESS'), yn = /^(YES|NO)$/i;
      return lines.slice(1).map(function (l) {
        var v = l.split('\t'), o = {};
        // Some sheet rows carry an extra empty cell after NAME, shifting every later column right by one.
        if (gi > 0 && ai > 0 && !yn.test((v[gi] || '').trim()) && yn.test((v[gi + 1] || '').trim()) && !(v[ai] || '').trim()) v.splice(ai, 1);
        head.forEach(function (h, i) { if (h) o[h] = v[i] ? v[i].trim() : ''; });
        return o;
      });
    }
    function ymd(s) { s = String(s || '').trim(); if (s.length !== 8) return null; var d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)); return isNaN(d) ? null : d; }
    function monthsSince(d) {
      if (!d) return null;
      var now = new Date(); now.setHours(0, 0, 0, 0);
      var m = (now.getFullYear() - d.getFullYear()) * 12 + now.getMonth() - d.getMonth();
      if (now.getDate() < d.getDate()) m--;
      return m;
    }

    function enrich(rows, type) {
      return rows.filter(function (r) { return r.CON_ID || r.CCC_CODE; }).map(function (r) {
        var code = String(r.CCC_CODE || '').trim(), o = UI.office(code);
        var bc = String(r.BASE_CLASS || '').trim().toUpperCase();
        var last = ymd(r.LAST_PDT), days = last ? Math.max(0, Math.round((Date.now() - last.getTime()) / 864e5)) : null, m = monthsSince(last);
        var txt = ((r.NAME || '') + ' ' + (r.ADDRESS || '')).toLowerCase();
        return {
          raw: r, con: String(r.CON_ID || '').trim(), name: UI.title(r.NAME || ''), address: r.ADDRESS || '', code: code,
          _region: o.region, _divn: o.division, _supp: o.ccc || code, CCC_CODE: code,
          type: type === 'IC' ? (bc === 'I' ? 'IND' : 'COM') : type, base: bc,
          osd: parseFloat(r.NOTOSD_UPD) || 0, locked: parseFloat(r.LOCKED_OSD) || 0,
          last: last, lastDays: days, lastMonths: m, mobile: r.REG_MOB_NO,
          payKey: PAY.filter(function (p) { return p.test(m, days); })[0].key,
          school: txt.indexOf('school') !== -1, party: txt.indexOf('party') !== -1,
          tower: ['indus', 'bharti', 'jio', 'bsnl', 'telecom'].some(function (k) { return txt.indexOf(k) !== -1; }),
          upd: r.UPD_DT
        };
      });
    }

    function rebuild() {
      all = parts.DOM.concat(parts.AGRI, parts.IC);
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      all.forEach(function (r) { r.osdKey = OSD.filter(function (b) { return r.osd >= b.min && r.osd < b.max; })[0].key; });
      var upd = all.reduce(function (m, r) { return r.upd && r.upd > m ? r.upd : m; }, '');
      $('meta').textContent = (upd ? 'Updated ' + UI.fmtDate(ymd(upd)) + ' · ' : '') + UI.n(all.length) + ' consumers' + (parts.IC.length ? '' : ' · loading commercial and industrial…');
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      UI.fill('classFilter', UI.uniq(all, 'base'), 'All base classes');
      if (!scope) scope = UI.lockScope();
    }

    // Office, class, tag and search (stat totals use this set).
    function base() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, bc = $('classFilter').value, tag = $('tagFilter').value, q = f.q.toLowerCase();
      return all.filter(function (r) {
        if ((reg && r._region !== reg) || (div && r._divn !== div) || (ccc && r._supp !== ccc) || (bc && r.base !== bc) || (tag && !r[tag])) return false;
        return !q || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1 || r.address.toLowerCase().indexOf(q) !== -1 || String(r._supp).toLowerCase().indexOf(q) !== -1;
      });
    }

    function render() {
      var b = base();
      var pre = b.filter(function (r) { return (!f.pay || r.payKey === f.pay) && (!f.osd || r.osdKey === f.osd); });
      var v = pre.filter(function (r) { return !f.type || r.type === f.type; });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var t = el.getAttribute('data-t'), rows = t ? pre.filter(function (r) { return r.type === t; }) : pre;
        var amt = rows.reduce(function (a, r) { return a + r.osd; }, 0);
        el.querySelector('.v').textContent = UI.inr(amt);
        el.querySelector('.s').textContent = UI.n(rows.length) + ' consumers';
        el.setAttribute('aria-pressed', String(f.type === t));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      v.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var o = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, osd: 0, yr: 0 });
        o.n++; o.osd += r.osd; if (r.lastMonths != null && r.lastMonths >= 12) o.yr++;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }), tot = v.reduce(function (a, r) { return a + r.osd; }, 0);
      var max = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));
      UI.table('officeTable', {
        rows: list, sort: { key: 'osd', dir: 'desc' }, count: false, empty: 'No defaulters for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (x, o) { return '<span class="ui-strong">' + UI.esc(x) + '</span>' + (o.parent ? '<span class="sub">' + UI.esc(o.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', sortVal: function (o) { return o.osd; }, fmt: function (_, o) { return UI.bar(o.osd, max, UI.pct(o.osd, tot)); }, width: '26%', hideSm: true },
          { key: 'yr', label: 'No pay > 1 yr', num: true, fmt: UI.n, hideSm: true }
        ],
        onRow: level === 'ccc' ? null : function (o) { drill(o.name); }
      });

      var forHist = b.filter(function (r) { return !f.type || r.type === f.type; });
      UI.hist('payHist', PAY.map(function (p) { return { key: p.key, label: p.label, value: forHist.filter(function (r) { return r.payKey === p.key && (!f.osd || r.osdKey === f.osd); }).length }; }),
        { active: f.pay, onClick: function (row) { f.pay = f.pay === row.key ? '' : row.key; render(); } });
      UI.hist('osdHist', OSD.map(function (o) { return { key: o.key, label: o.label, value: forHist.filter(function (r) { return r.osdKey === o.key && (!f.pay || r.payKey === f.pay); }).length }; }),
        { active: f.osd, onClick: function (row) { f.osd = f.osd === row.key ? '' : row.key; render(); } });

      $('count').textContent = UI.n(v.length);
      UI.table('table', { rows: v, sort: { key: 'osd', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No consumers match these filters.', columns: COLS, onRow: detail });
      window.__view = v;
      $('clearBtn').hidden = !(f.q || f.type || f.pay || f.osd || $('classFilter').value || $('tagFilter').value || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
    }

    function lastLabel(r) { return r.lastDays == null ? '—' : r.lastDays <= 30 ? 'This month' : r.lastMonths <= 0 ? '1 mo ago' : r.lastMonths >= 12 ? Math.floor(r.lastMonths / 12) + 'y ' + (r.lastMonths % 12 ? r.lastMonths % 12 + 'mo ' : '') + 'ago' : r.lastMonths + ' mo ago'; }
    var COLS = [
      { key: 'con', label: 'Consumer', fmt: function (x, r) { return '<span class="ui-strong">' + UI.esc(x || '—') + '</span><span class="sub">' + UI.esc(r.name) + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (x, r) { return UI.esc(x || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'type', label: 'Type', hideSm: true, fmt: function (x) { return UI.esc(TYPE[x] || x); } },
      { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr },
      { key: 'locked', label: 'Locked', num: true, hideSm: true, fmt: function (x) { return x ? UI.inr(x) : '<span class="ui-muted">—</span>'; } },
      { key: 'last', label: 'Last payment', num: true, sortVal: function (r) { return r.last ? r.last.getTime() : 0; }, fmt: function (_, r) { return UI.esc(lastLabel(r)); } },
      { key: 'mobile', label: 'Mobile', hideSm: true }
    ];

    function fd(s) { var d = ymd(s); return d ? UI.fmtDate(d) : ''; }
    function detail(r) {
      var x = r.raw;
      var pairs = [
        ['Consumer ID', r.con], ['Name', r.name], ['Address', r.address], ['Mobile', r.mobile], ['Installation', x.INST_NO], ['MRU', x.MRU],
        ['CCC', r._supp], ['Division', r._divn], ['Region', r._region],
        ['Type', TYPE[r.type]], ['Base class', r.base], ['Class', x.CLASS_DESC], ['Govt.', x.GOVT_STAT],
        ['Outstanding', UI.inr(r.osd)], ['Locked OSD', r.locked ? UI.inr(r.locked) : ''], ['Bill date', fd(x.BDATE)],
        ['Last payment', r.last ? lastLabel(r) + ' (' + UI.fmtDate(r.last) + ')' : 'None recorded'], ['Notice issued', fd(x.NOT_ISSUE_DT)],
        ['Report date', fd(x.UPD_DT)], ['Disconnected', x.DISC_FLAG]
      ];
      UI.drawer(r.name || 'Consumer', r.con + ' · ' + [r._supp, r._divn].filter(Boolean).join(', '), pairs);
      var head = document.querySelector('#ui-drawer header'), btn = head.querySelector('.rd-copy');
      if (!btn) {
        btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ui-btn sm rd-copy';
        btn.innerHTML = UI.icon('copy') + 'Copy';
        head.insertBefore(btn, head.lastElementChild);
      }
      btn.onclick = function () {
        var text = '*REM defaulter*\n' + pairs.filter(function (p) { return !UI.blank(p[1]); }).map(function (p) { return '*' + p[0] + ':* ' + p[1]; }).join('\n');
        UI.copy(text).then(function () { UI.toast('Details copied'); });
      };
    }

    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillFilters(); marks(); setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function marks() { ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'tagFilter'].forEach(function (id) { UI.mark($(id)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); marks(); render();
      });
    });
    ['classFilter', 'tagFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var t = s.getAttribute('data-t'); f.type = f.type === t ? '' : t; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.type = ''; f.pay = ''; f.osd = ''; $('q').value = ''; $('classFilter').value = ''; $('tagFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); marks(); setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      var v = window.__view || [];
      var keys = []; v.forEach(function (r) { Object.keys(r.raw).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); }); });
      UI.exportCsv('rem-defaulters.csv', [{ key: 't', label: 'TYPE', csv: function (r) { return r.type; } }, { key: 'c', label: 'CCC', csv: function (r) { return r._supp; } }]
        .concat(keys.map(function (k) { return { key: k, label: k, csv: function (r) { return r.raw[k]; } }; })), v);
    });

    // DOM + AGRI paint first; the larger I&C sheet joins when ready.
    var SRC = { DOM: 'CACHE_REM_DOM', AGRI: 'CACHE_REM_AGRI', IC: 'CACHE_REM_DEFAULTERS' }, first = true;
    function onData(part) {
      return function (text, info) {
        if (!text) { if (info && info.error && !all.length) { $('meta').textContent = 'Could not load data'; $('table').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
        parts[part] = enrich(tsv(text), part);
        rebuild();
        if (first) {
          first = false;
          if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
          [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
        }
        render();
      };
    }
    function loadAll(force) {
      return Promise.all(Object.keys(SRC).map(function (p) {
        if (!force) return UI.load(SRC[p], onData(p));
        return Promise.resolve(window.mzoDataHub.waitForDataset(SRC[p], { forceCheck: true })).catch(function () {})
          .then(function () { return window.mzoDataHub._peek(SRC[p]); }).then(function (t) { if (t) onData(p)(t, {}); });
      }));
    }
    $('refreshBtn').addEventListener('click', function () { var b = this; b.classList.add('spin'); loadAll(true).then(function () { b.classList.remove('spin'); }); });
    loadAll(false);
  });
  </script>
</body>
</html>
