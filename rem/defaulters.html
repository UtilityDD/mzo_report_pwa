<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REM defaulters · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=23" />
  <script src="/mzo_ui.js?v=21" defer></script>
  <script src="/mzo_data_hub.js?v=94" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=20" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .rem-hint {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--mzo-muted);
      border-bottom: 1px solid var(--mzo-border);
    }
    .rd-copy { margin-left: auto; margin-right: 2px; }
    .ui-stat .s { font-size: 11px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>REM defaulters <span class="ui-badge ui-date" id="asOn"></span></h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <div class="ui-seg" id="metric" role="group" aria-label="Measure">
          <button type="button" data-m="amt" aria-pressed="true">Outstanding</button>
          <button type="button" data-m="count" aria-pressed="false">Consumers</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Consumer ID, name, address or CCC" autocomplete="off" aria-label="Search consumers" title="Search consumers" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
          <span class="ui-select"><select id="classFilter" aria-label="Base class"><option value="">All base classes</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Consumer type" id="fType"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Outstanding size" id="fOsd"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Last payment" id="fPay"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Special category" id="fTag"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="By type">
          <button type="button" class="ui-stat" data-t=""><div class="k">All defaulters</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t="DOM"><div class="k">Domestic</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t="COM"><div class="k">Commercial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t="IND"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t="AGRI"><div class="k">Agriculture</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title" id="tableTitle">Detailed analysis</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
            <div id="scopeTrail" class="ui-scope-trail-host"></div>
          <div class="rem-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var TYPE = { DOM: 'Domestic', COM: 'Commercial', IND: 'Industrial', AGRI: 'Agriculture' };
    var PAY = [
      { key: 'p0', label: 'Within a month', test: function (m, d) { return d != null && d <= 30; } },
      { key: 'p1', label: '1–3 months', test: function (m, d) { return d > 30 && m < 3; } },
      { key: 'p2', label: '3–6 months', test: function (m) { return m >= 3 && m < 6; } },
      { key: 'p3', label: '6–12 months', test: function (m) { return m >= 6 && m < 12; } },
      { key: 'p4', label: 'Over a year', test: function (m) { return m >= 12; } },
      { key: 'p5', label: 'No payment date', test: function (m, d) { return d == null; } }
    ];
    var OSD = [
      { key: 'o0', label: 'Over ₹1 lakh', min: 1e5, max: Infinity },
      { key: 'o1', label: '₹50K – 1 lakh', min: 5e4, max: 1e5 },
      { key: 'o2', label: '₹25K – 50K', min: 2.5e4, max: 5e4 },
      { key: 'o3', label: '₹10K – 25K', min: 1e4, max: 2.5e4 },
      { key: 'o4', label: 'Under ₹10K', min: -Infinity, max: 1e4 }
    ];
    var TAGS = [
      { key: 'school', label: 'Schools', test: function (r) { return r.school; } },
      { key: 'party', label: 'Party offices', test: function (r) { return r.party; } },
      { key: 'tower', label: 'Telecom towers', test: function (r) { return r.tower; } },
      { key: 'locked', label: 'Locked OSD', test: function (r) { return r.hasLocked; } },
      { key: 'disc', label: 'Disconnected', test: function (r) { return r.disc; } }
    ];
    var TABS = [
      { id: 'region', label: 'Region' },
      { id: 'division', label: 'Division' },
      { id: 'ccc', label: 'CCC' },
      { id: 'consumers', label: 'Consumers' },
      { id: 'osd', label: 'Outstanding Brackets' },
      { id: 'pay', label: 'Payment Aging' },
      { id: 'tags', label: 'Special Categories' }
    ];

    var parts = { DOM: [], AGRI: [], IC: [] }, cols = { DOM: [], AGRI: [], IC: [] };
    var all = [], f = { q: '', type: '', pay: '', osd: '', tag: '' };
    var tab = 'region', metric = 'amt', scope = null;

    // The sheet's own columns of a rows document, in sheet order (no _raw or office columns).
    function sheetCols(t) { return t.columns.filter(function (c) { return !c.raw_of && c.name.charAt(0) !== '_'; }); }
    // A cell as the sheet wrote it (a typed value as text, or the text that did not parse).
    function cell(r, c) { var v = r[c.name]; return v == null || v === '' ? r[c.name + '_raw'] || '' : String(v); }
    // Some sheet rows carry an extra empty cell after NAME, shifting every later column right by one:
    // GOVT_STAT then holds the base class and the next cell YES/NO. Move those cells back.
    function unshift(rows, list) {
      var names = list.map(function (c) { return c.name; }), ai = names.indexOf('address'), gi = names.indexOf('govt_stat'), yn = /^(YES|NO)$/i;
      if (ai <= 0 || gi <= 0 || gi + 1 >= list.length) return rows;
      rows.forEach(function (r) {
        if (yn.test(r.govt_stat) || !yn.test(cell(r, list[gi + 1])) || r.address) return;
        for (var i = ai; i < list.length; i++) {
          var c = list[i], s = i + 1 < list.length ? cell(r, list[i + 1]) : '';
          if (c.type === 'number') { var n = s === '' ? null : Number(s); r[c.name] = isFinite(n) ? n : null; r[c.name + '_raw'] = s !== '' && r[c.name] == null ? s : ''; }
          else r[c.name] = s;
        }
      });
      return rows;
    }
    function ymd(s) { s = String(s || '').trim(); if (s.length !== 8) return null; var d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)); return isNaN(d) ? null : d; }
    function monthsSince(d) {
      if (!d) return null;
      var now = new Date(); now.setHours(0, 0, 0, 0);
      var m = (now.getFullYear() - d.getFullYear()) * 12 + now.getMonth() - d.getMonth();
      if (now.getDate() < d.getDate()) m--;
      return m;
    }

    // t.rows: uniform rows of schema/rem_defaulters_*.json, already scoped to the login by MzoRows.
    function enrich(t, type) {
      cols[type] = sheetCols(t);
      return unshift(t.rows, cols[type]).filter(function (r) { return r.con_id || r.ccc_code; }).map(function (r) {
        var code = r.ccc_code;
        var bc = (r.base_class || '').toUpperCase();
        var last = ymd(r.last_pdt), days = last ? Math.max(0, Math.round((Date.now() - last.getTime()) / 864e5)) : null, m = monthsSince(last);
        var txt = ((r.name || '') + ' ' + (r.address || '')).toLowerCase();
        var disc = String(r.disc_flag || '').trim().toUpperCase() === 'YES';
        var locked = Number(r.locked_osd) || 0;
        // NOTOSD_UPD is the notice amount brought up to UPD_DT, so it counts only when UPD_DT is set. The live
        // sheets leave both 0; then the amount is OSD (outstanding on BDATE, the sheet's run date), else NOTOSD.
        var updDt = Number(r.upd_dt) || 0;
        var osd = updDt ? Number(r.notosd_upd) || 0 : r.osd != null ? Number(r.osd) || 0 : Number(r.notosd) || 0;
        return {
          raw: r, con: String(r.con_id || ''), name: UI.title(r.name), address: r.address || '', code: code,
          _region: r._region, _divn: r._division, _supp: r._ccc || code, CCC_CODE: code,
          type: type === 'IC' ? (bc === 'I' ? 'IND' : 'COM') : type, base: bc,
          osd: osd, locked: locked, hasLocked: locked > 0, disc: disc,
          last: last, lastDays: days, lastMonths: m, mobile: r.reg_mob_no || '',
          payKey: (PAY.filter(function (p) { return p.test(m, days); })[0] || {}).key || 'p5',
          school: txt.indexOf('school') !== -1, party: txt.indexOf('party') !== -1,
          tower: ['indus', 'bharti', 'jio', 'bsnl', 'telecom'].some(function (k) { return txt.indexOf(k) !== -1; }),
          upd: String(updDt || Number(r.bdate) || '')
        };
      });
    }

    // The export writes every sheet column under its sheet header, as the sheet wrote it.
    function exportCols() {
      var seen = {}, out = [];
      ['DOM', 'AGRI', 'IC'].forEach(function (p) {
        (cols[p] || []).forEach(function (c) {
          if (c.source_name && !seen[c.name]) { seen[c.name] = 1; out.push(c); }
        });
      });
      return out;
    }

    function rebuild() {
      all = parts.DOM.concat(parts.AGRI, parts.IC);
      all.forEach(function (r) {
        var match = OSD.filter(function (b) { return r.osd >= b.min && r.osd < b.max; })[0];
        r.osdKey = match ? match.key : 'o4';
      });
      all.sort(function (a, b) { return b.osd - a.osd; });
      var upd = all.reduce(function (m, r) { return r.upd.length === 8 && r.upd > m ? r.upd : m; }, '');
      if (upd && $('asOn')) $('asOn').textContent = 'As on ' + UI.fmtDate(ymd(upd));
      var noAmounts = all.length && !all.some(function (r) { return r.osd; });
      if (noAmounts && window.console) console.warn('[REM defaulters] ' + all.length + ' rows but every outstanding amount is 0 (NOTOSD_UPD, OSD, NOTOSD)');
      $('meta').textContent = UI.n(all.length) + ' consumers' + (noAmounts ? ' · the sheets give no outstanding amounts' : '') + (parts.IC.length ? '' : ' · loading commercial and industrial…');
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      UI.fill('classFilter', UI.uniq(all, 'base'), 'All base classes');
      if (!scope) scope = UI.lockScope();
    }

    // Base filter without specific facets, for computing live facet counts
    function base(skip) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, bc = $('classFilter').value, q = f.q.toLowerCase();
      var tagDef = f.tag ? TAGS.filter(function (t) { return t.key === f.tag; })[0] : null;
      return all.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (ccc && r._supp !== ccc) return false;
        if (bc && r.base !== bc) return false;
        if (q && r.con.indexOf(q) === -1 && r.name.toLowerCase().indexOf(q) === -1 && r.address.toLowerCase().indexOf(q) === -1 && String(r._supp).toLowerCase().indexOf(q) === -1) return false;
        if (skip !== 'type' && f.type && r.type !== f.type) return false;
        if (skip !== 'osd' && f.osd && r.osdKey !== f.osd) return false;
        if (skip !== 'pay' && f.pay && r.payKey !== f.pay) return false;
        if (skip !== 'tag' && tagDef && !tagDef.test(r)) return false;
        return true;
      });
    }

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    function clearAll() {
      f.q = ''; f.type = ''; f.pay = ''; f.osd = ''; f.tag = '';
      $('q').value = ''; $('classFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
        if (!$(id).disabled) $(id).value = '';
      });
      fillFilters(); marks();
      syncUrl();
      render();
    }

    function marks() {
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function syncUrl() {
      var p = new URLSearchParams();
      if ($('regionFilter').value) p.set('region', $('regionFilter').value);
      if ($('divisionFilter').value) p.set('division', $('divisionFilter').value);
      if ($('cccFilter').value) p.set('ccc', $('cccFilter').value);
      if ($('classFilter').value) p.set('class', $('classFilter').value);
      if (f.q) p.set('q', f.q);
      if (f.type) p.set('type', f.type);
      if (f.osd) p.set('osd', f.osd);
      if (f.pay) p.set('pay', f.pay);
      if (f.tag) p.set('tag', f.tag);
      if (tab !== 'region') p.set('tab', tab);
      if (metric !== 'amt') p.set('metric', metric);
      var qs = p.toString();
      var url = location.pathname + (qs ? '?' + qs : '');
      if (location.search !== (qs ? '?' + qs : '')) history.replaceState(null, '', url);
    }

    function render(tabOnly) {
      var b = (tabOnly && window.__view) ? window.__view : base('none');
      if (!tabOnly || !window.__view) {
        var bType = base('type'), bOsd = base('osd'), bPay = base('pay'), bTag = base('tag');

        // Update KPI stats
        [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
          var t = el.getAttribute('data-t');
          var rows = t ? bType.filter(function (r) { return r.type === t; }) : bType;
          var amt = rows.reduce(function (a, r) { return a + r.osd; }, 0);
          var n = rows.length;
          var avg = n ? Math.round(amt / n) : 0;
          el.querySelector('.v').textContent = UI.inr(amt);
          el.querySelector('.s').textContent = UI.n(n) + ' cons · avg ' + UI.inr(avg);
          el.setAttribute('aria-pressed', String(f.type === t));
        });

        // Update side panel facets
        var typeFacets = [
          { value: '', label: 'All types', count: bType.length },
          { value: 'DOM', label: 'Domestic', count: bType.filter(function (r) { return r.type === 'DOM'; }).length },
          { value: 'COM', label: 'Commercial', count: bType.filter(function (r) { return r.type === 'COM'; }).length },
          { value: 'IND', label: 'Industrial', count: bType.filter(function (r) { return r.type === 'IND'; }).length },
          { value: 'AGRI', label: 'Agriculture', count: bType.filter(function (r) { return r.type === 'AGRI'; }).length }
        ];
        UI.facet($('fType'), typeFacets, f.type, function (v) { f.type = v; syncUrl(); render(); });

        var osdFacets = [{ value: '', label: 'All sizes', count: bOsd.length }].concat(OSD.map(function (o) {
          return { value: o.key, label: o.label, count: bOsd.filter(function (r) { return r.osdKey === o.key; }).length };
        }));
        UI.facet($('fOsd'), osdFacets, f.osd, function (v) { f.osd = v; syncUrl(); render(); });

        var payFacets = [{ value: '', label: 'All aging', count: bPay.length }].concat(PAY.map(function (p) {
          return { value: p.key, label: p.label, count: bPay.filter(function (r) { return r.payKey === p.key; }).length };
        }));
        UI.facet($('fPay'), payFacets, f.pay, function (v) { f.pay = v; syncUrl(); render(); });

        var tagFacets = [{ value: '', label: 'Any category', count: bTag.length }].concat(TAGS.map(function (t) {
          return { value: t.key, label: t.label, count: bTag.filter(function (r) { return t.test(r); }).length };
        }));
        UI.facet($('fTag'), tagFacets, f.tag, function (v) { f.tag = v; syncUrl(); render(); });

        // Active filters counting
        var nActive = (f.q ? 1 : 0) + (f.type ? 1 : 0) + (f.pay ? 1 : 0) + (f.osd ? 1 : 0) + (f.tag ? 1 : 0) +
          ($('classFilter').value ? 1 : 0) +
          ($('regionFilter').value && !$('regionFilter').disabled ? 1 : 0) +
          ($('divisionFilter').value && !$('divisionFilter').disabled ? 1 : 0) +
          ($('cccFilter').value && !$('cccFilter').disabled ? 1 : 0);
        setActive(nActive);
      }

      // Render Drill Tabs
      var tabsEl = $('tabs');
      tab = UI.snapOfficeTab(tab);
      tabsEl.innerHTML = UI.filterOfficeTabs(TABS).map(function (t) {
        var count = '';
        if (t.id === 'consumers') count = '<small>' + UI.n(b.length) + '</small>';
        return '<button type="button" class="ui-drill-tab" role="tab" data-tab="' + t.id + '" aria-selected="' + String(tab === t.id) + '">' + t.label + count + '</button>';
      }).join('');
      UI.scopeTrail('scopeTrail');

      var totOsd = (tabOnly && window.__totOsd != null) ? window.__totOsd : b.reduce(function (a, r) { return a + r.osd; }, 0);
      var totN = b.length;
      var avgDef = totN ? Math.round(totOsd / totN) : 0;
      $('hint').innerHTML = 'Total default: <span class="ui-strong">' + UI.inr(totOsd) + '</span> across <span class="ui-strong">' + UI.n(totN) + '</span> defaulters · Avg default: <span class="ui-strong">' + UI.inr(avgDef) + '</span>';

      window.__view = b;
      window.__totOsd = totOsd;

      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.inr(totOsd) + ' · ' + UI.n(totN) + ' defaulters';
      if (!tabOnly) renderReportHead(b);

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        renderOfficesTab(b, totOsd, totN);
      } else if (tab === 'consumers') {
        renderConsumersTab(b);
      } else if (tab === 'osd') {
        renderOsdTab(b, totOsd, totN);
      } else if (tab === 'pay') {
        renderPayTab(b, totOsd, totN);
      } else if (tab === 'tags') {
        renderTagsTab(b, totOsd, totN);
      }
    }

    var currentActiveFilters = [];
    function renderReportHead(b) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; syncUrl(); render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillFilters(); marks(); syncUrl(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillFilters(); marks(); syncUrl(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; marks(); syncUrl(); render(); } });
      }
      var clVal = $('classFilter').value;
      if (clVal) {
        active.push({ key: 'class', label: 'Base class: ' + clVal, clear: function () { $('classFilter').value = ''; marks(); syncUrl(); render(); } });
      }
      if (f.type) {
        active.push({ key: 'type', label: 'Type: ' + (TYPE[f.type] || f.type), clear: function () { f.type = ''; syncUrl(); render(); } });
      }
      if (f.osd) {
        var oMatch = OSD.filter(function (o) { return o.key === f.osd; })[0];
        active.push({ key: 'osd', label: 'Size: ' + (oMatch ? oMatch.label : f.osd), clear: function () { f.osd = ''; syncUrl(); render(); } });
      }
      if (f.pay) {
        var pMatch = PAY.filter(function (p) { return p.key === f.pay; })[0];
        active.push({ key: 'pay', label: 'Aging: ' + (pMatch ? pMatch.label : f.pay), clear: function () { f.pay = ''; syncUrl(); render(); } });
      }
      if (f.tag) {
        var tMatch = TAGS.filter(function (t) { return t.key === f.tag; })[0];
        active.push({ key: 'tag', label: 'Category: ' + (tMatch ? tMatch.label : f.tag), clear: function () { f.tag = ''; syncUrl(); render(); } });
      }
      if (metric && metric !== 'amt') {
        active.push({ key: 'metric', label: 'Measure: Consumers', clear: function () { metric = 'amt'; [].forEach.call($('metric').children, function (el) { el.setAttribute('aria-pressed', String(el.getAttribute('data-m') === 'amt')); }); syncUrl(); render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    function renderOfficesTab(rows, totOsd, totN) {
      var key = tab === 'region' ? '_region' : tab === 'division' ? '_divn' : '_supp';
      var g = {};
      rows.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var o = g[name] || (g[name] = { name: name, parent: tab === 'ccc' ? r._divn : tab === 'division' ? r._region : '', n: 0, osd: 0, yr: 0 });
        o.n++;
        o.osd += r.osd;
        if (r.lastMonths != null && r.lastMonths >= 12) o.yr++;
      });
      var list = Object.keys(g).map(function (k) {
        var o = g[k];
        o.avg = o.n ? Math.round(o.osd / o.n) : 0;
        return o;
      });
      var maxVal = Math.max.apply(null, list.map(function (o) { return metric === 'count' ? o.n : o.osd; }).concat([0]));
      var totVal = metric === 'count' ? totN : totOsd;

      UI.table('table', {
        rows: list,
        sort: { key: metric === 'count' ? 'n' : 'osd', dir: 'desc' },
        count: false,
        empty: 'No defaulters for these filters.',
        columns: [
          {
            key: 'name',
            label: tab === 'ccc' ? 'CCC' : tab === 'division' ? 'Division' : 'Region',
            fmt: function (x, o) {
              return '<span class="ui-strong">' + UI.esc(x) + '</span>' + (o.parent ? '<span class="sub">' + UI.esc(o.parent) + '</span>' : '');
            }
          },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr },
          {
            key: 'share',
            label: metric === 'count' ? 'Consumer Share' : 'Outstanding Share',
            sortVal: function (o) { return metric === 'count' ? o.n : o.osd; },
            fmt: function (_, o) {
              var v = metric === 'count' ? o.n : o.osd;
              return UI.bar(v, maxVal, UI.pct(v, totVal));
            },
            width: '24%',
            hideSm: true
          },
          { key: 'yr', label: 'No pay > 1 yr', num: true, fmt: UI.n, hideSm: true },
          { key: 'avg', label: 'Avg default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          if (tab === 'region') {
            $('regionFilter').value = o.name; $('divisionFilter').value = ''; $('cccFilter').value = '';
            tab = 'division';
          } else if (tab === 'division') {
            $('divisionFilter').value = o.name; $('cccFilter').value = '';
            tab = 'ccc';
          } else {
            $('cccFilter').value = o.name;
            tab = 'consumers';
          }
          fillFilters(); marks(); syncUrl(); render();
        }
      });
    }

    function lastLabel(r) {
      return r.lastDays == null ? '—' : r.lastDays <= 30 ? 'This month' : r.lastMonths <= 0 ? '1 mo ago' : r.lastMonths >= 12 ? Math.floor(r.lastMonths / 12) + 'y ' + (r.lastMonths % 12 ? r.lastMonths % 12 + 'mo ' : '') + 'ago' : r.lastMonths + ' mo ago';
    }

    var COLS = [
      { key: 'con', label: 'Consumer', fmt: function (x, r) { return '<span class="ui-strong">' + UI.esc(x || '—') + '</span><span class="sub">' + UI.esc(r.name) + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (x, r) { return UI.esc(x || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'type', label: 'Type', hideSm: true, fmt: function (x) { return UI.esc(TYPE[x] || x); } },
      { key: 'base', label: 'Class', hideSm: true },
      { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr },
      { key: 'locked', label: 'Locked OSD', num: true, hideSm: true, fmt: function (x) { return x ? UI.inr(x) : '<span class="ui-muted">—</span>'; } },
      { key: 'last', label: 'Last payment', num: true, sortVal: function (r) { return r.last ? r.last.getTime() : 0; }, fmt: function (_, r) { return UI.esc(lastLabel(r)); } },
      { key: 'mobile', label: 'Mobile', hideSm: true }
    ];

    function renderConsumersTab(rows) {
      UI.table('table', {
        rows: rows,
        sort: { key: 'osd', dir: 'desc' },
        limit: 50,
        resetPage: true,
        empty: 'No consumers match these filters.',
        columns: COLS,
        onRow: detail
      });
    }

    function renderOsdTab(rows, totOsd, totN) {
      var list = OSD.map(function (o) {
        var sub = rows.filter(function (r) { return r.osdKey === o.key; });
        var osd = sub.reduce(function (a, r) { return a + r.osd; }, 0);
        var n = sub.length;
        return {
          key: o.key, label: o.label, n: n, osd: osd,
          pctN: UI.pct(n, totN), pctOsd: UI.pct(osd, totOsd),
          avg: n ? Math.round(osd / n) : 0
        };
      });
      var maxOsd = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'osd', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Outstanding Bracket', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'pctN', label: '% Consumers', num: true },
          { key: 'osd', label: 'Total Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', fmt: function (_, o) { return UI.bar(o.osd, maxOsd, o.pctOsd); }, width: '24%', hideSm: true },
          { key: 'avg', label: 'Avg Default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          f.osd = f.osd === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function renderPayTab(rows, totOsd, totN) {
      var list = PAY.map(function (p) {
        var sub = rows.filter(function (r) { return r.payKey === p.key; });
        var osd = sub.reduce(function (a, r) { return a + r.osd; }, 0);
        var n = sub.length;
        return {
          key: p.key, label: p.label, n: n, osd: osd,
          pctN: UI.pct(n, totN), pctOsd: UI.pct(osd, totOsd),
          avg: n ? Math.round(osd / n) : 0
        };
      });
      var maxOsd = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'n', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Last Payment Aging', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'pctN', label: '% Consumers', num: true },
          { key: 'osd', label: 'Total Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', fmt: function (_, o) { return UI.bar(o.osd, maxOsd, o.pctOsd); }, width: '24%', hideSm: true },
          { key: 'avg', label: 'Avg Default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          f.pay = f.pay === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function renderTagsTab(rows, totOsd, totN) {
      var list = TAGS.map(function (t) {
        var sub = rows.filter(function (r) { return t.test(r); });
        var osd = sub.reduce(function (a, r) { return a + r.osd; }, 0);
        var n = sub.length;
        return {
          key: t.key, label: t.label, n: n, osd: osd,
          pctN: UI.pct(n, totN), pctOsd: UI.pct(osd, totOsd),
          avg: n ? Math.round(osd / n) : 0
        };
      });
      var maxOsd = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'osd', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Special Category', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'pctN', label: '% Consumers', num: true },
          { key: 'osd', label: 'Total Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', fmt: function (_, o) { return UI.bar(o.osd, maxOsd, o.pctOsd); }, width: '24%', hideSm: true },
          { key: 'avg', label: 'Avg Default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          f.tag = f.tag === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function fd(s) { var d = ymd(s); return d ? UI.fmtDate(d) : ''; }
    function detail(r) {
      var x = r.raw;
      var pairs = [
        ['Consumer ID', r.con], ['Name', r.name], ['Address', r.address], ['Mobile', r.mobile], ['Installation', x.inst_no], ['MRU', x.mru],
        ['CCC', r._supp], ['Division', r._divn], ['Region', r._region],
        ['Type', TYPE[r.type] || r.type], ['Base class', r.base], ['Class', x.class_desc], ['Govt.', x.govt_stat],
        ['Outstanding', UI.inr(r.osd)], ['Locked OSD', r.locked ? UI.inr(r.locked) : ''], ['Bill date', fd(x.bdate)],
        ['Last payment', r.last ? lastLabel(r) + ' (' + UI.fmtDate(r.last) + ')' : 'None recorded'], ['Notice issued', fd(x.not_issue_dt)],
        ['Report date', fd(x.upd_dt)], ['Disconnected', x.disc_flag]
      ];
      UI.drawer(r.name || 'Consumer', r.con + ' · ' + [r._supp, r._divn].filter(Boolean).join(', '), pairs);
      var head = document.querySelector('#ui-drawer header'), btn = head ? head.querySelector('.rd-copy') : null;
      if (head && !btn) {
        btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ui-btn sm rd-copy';
        btn.innerHTML = UI.icon('copy') + 'Copy';
        head.insertBefore(btn, head.lastElementChild);
      }
      if (btn) {
        btn.onclick = function () {
          var text = '*REM defaulter*\n' + pairs.filter(function (p) { return !UI.blank(p[1]); }).map(function (p) { return '*' + p[0] + ':* ' + p[1]; }).join('\n');
          UI.copy(text).then(function () { UI.toast('Details copied'); });
        };
      }
    }

    // Office filter change events
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); marks(); syncUrl(); render();
      });
    });
    $('classFilter').addEventListener('change', function () { marks(); syncUrl(); render(); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); syncUrl(); render(); }, 160));

    // Stats click toggles consumer type
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var t = s.getAttribute('data-t');
      f.type = f.type === t ? '' : t;
      syncUrl(); render();
    });

    // Metric toggle (Outstanding vs Consumers)
    $('metric').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-m]');
      if (!b) return;
      metric = b.getAttribute('data-m');
      [].forEach.call($('metric').children, function (el) {
        el.setAttribute('aria-pressed', String(el === b));
      });
      syncUrl(); render();
    });

    // Tab navigation
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-tab');
      syncUrl(); render(true);
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var clearBtn = e.target.closest('#rhClearBtn');
      if (clearBtn) { clearAll(); return; }
      var chipBtn = e.target.closest('[data-rh-clear]');
      if (chipBtn) {
        var idx = parseInt(chipBtn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
        }
      }
    });

    // Copy summary action
    $('copyBtn').addEventListener('click', function () {
      var v = window.__view || [];
      var totOsd = v.reduce(function (a, r) { return a + r.osd; }, 0);
      var text = 'REM Defaulters — ' + ($('tableTitle').textContent || 'Summary') + '\n' +
        'Defaulters: ' + UI.n(v.length) + '\n' +
        'Total Outstanding: ' + UI.inr(totOsd) + '\n' +
        (v.length ? 'Average Default: ' + UI.inr(Math.round(totOsd / v.length)) + '\n' : '') +
        (f.type ? 'Type: ' + (TYPE[f.type] || f.type) + '\n' : '') +
        ($('regionFilter').value ? 'Region: ' + $('regionFilter').value + '\n' : '') +
        ($('divisionFilter').value ? 'Division: ' + $('divisionFilter').value + '\n' : '') +
        ($('cccFilter').value ? 'CCC: ' + $('cccFilter').value + '\n' : '');
      UI.copy(text).then(function () { UI.toast('Summary copied to clipboard'); });
    });

    // Export CSV
    $('exportBtn').addEventListener('click', function () {
      var v = window.__view || [];
      UI.exportCsv('rem-defaulters.csv', [
        { key: 't', label: 'TYPE', csv: function (r) { return r.type; } },
        { key: 'c', label: 'CCC', csv: function (r) { return r._supp; } }
      ].concat(exportCols().map(function (c) {
        return { key: c.name, label: c.source_name, csv: function (r) { return c.name in r.raw ? cell(r.raw, c) : undefined; } };
      })), v);
    });

    // Read deep link params on start
    function initParams() {
      var p = new URLSearchParams(location.search);
      if (p.has('region')) $('regionFilter').value = p.get('region');
      if (p.has('division')) $('divisionFilter').value = p.get('division');
      if (p.has('ccc')) $('cccFilter').value = p.get('ccc');
      if (p.has('class')) $('classFilter').value = p.get('class');
      if (p.has('q')) { f.q = p.get('q'); $('q').value = f.q; }
      if (p.has('type')) f.type = p.get('type');
      if (p.has('osd')) f.osd = p.get('osd');
      if (p.has('pay')) f.pay = p.get('pay');
      if (p.has('tag')) f.tag = p.get('tag');
      if (p.has('tab')) tab = p.get('tab');
      if (p.has('metric')) {
        metric = p.get('metric');
        [].forEach.call($('metric').children, function (el) {
          el.setAttribute('aria-pressed', String(el.getAttribute('data-m') === metric));
        });
      }
    }

    // DOM + AGRI paint first; the larger I&C sheet joins when ready.
    var SRC = { DOM: 'rem_defaulters_dom', AGRI: 'rem_defaulters_agri', IC: 'rem_defaulters_ind_com' }, first = true;
    function onData(part) {
      return function (t, info) {
        if (!t) {
          if (info && info.error && !all.length) {
            $('meta').textContent = 'Could not load data';
            $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
          }
          return;
        }
        parts[part] = enrich(t, part);
        rebuild();
        if (first) {
          first = false;
          initParams();
          if (!new URLSearchParams(location.search).has('tab')) {
            if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
            else if (scope && scope.level === 'region') tab = 'division';
          }
        }
        marks();
        render();
      };
    }

    function loadAll(force) {
      return Promise.all(Object.keys(SRC).map(function (p) {
        if (!force) return MzoRows.load(SRC[p], onData(p));
        return MzoRows.get(SRC[p], { forceCheck: true }).then(function (t) { onData(p)(t, {}); }, function () {});
      }));
    }

    $('refreshBtn').addEventListener('click', function () {
      var b = this; b.classList.add('spin');
      loadAll(true).then(function () { b.classList.remove('spin'); });
    });

    loadAll(false);
  });
  </script>
</body>
</html>
