<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theft assessment · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <script src="/mzo_rows.js?v=6" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Theft assessment<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <a class="ui-btn" href="https://docs.google.com/spreadsheets/d/1RiP2NDE6BgtgEp3Fufpx1G8p9k3VR786TY60LpvMdZM/edit" target="_blank" rel="noopener"><svg class="ui-i"><use href="#ui-arrow"/></svg>Open sheet</a>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Consumer, bill no, FIR or police station" aria-label="Search by consumer, bill no, FIR or police station" autocomplete="off" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec"><div aria-label="Status" id="fStatus"></div></div>
        <div class="ui-side-sec"><div aria-label="FIR status" id="fFir"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Cut & Year">
            <button type="button" role="tab" data-pane="fCut" aria-pressed="true" aria-selected="true">Cut at final</button>
            <button type="button" role="tab" data-pane="fYear" aria-pressed="false" aria-selected="false">Year</button>
          </div>
          <div aria-label="Cut at final" id="fCut"></div>
          <div aria-label="Assessment year" id="fYear" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Provisional demand</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="final"><div class="k">Final assessment</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="cut"><div class="k">Cut at final</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="paid"><div class="k"><span class="ui-dot ok"></span>Recovered</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="due"><div class="k"><span class="ui-dot bad"></span>Outstanding</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>By office</h2>
            <div class="ui-tabs" role="tablist" id="levelTabs">
              <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
              <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
              <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
            </div>
          </div>
          <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">Cases</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="caseTable"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'theft_assessment';
    var STATUS = { recovered: ['Recovered', 'ok'], partial: ['Partly paid', 'warn'], unpaid: ['Unpaid', 'bad'], pending_final: ['Final pending', ''] };
    var CUT = [
      { key: 'critical', label: 'Cut over 50%' }, { key: 'moderate', label: 'Cut 20–50%' }, { key: 'minor', label: 'Cut under 20%' },
      { key: 'zero', label: 'No cut' }, { key: 'pending_final', label: 'Final pending' }
    ];
    var all = [], f = { q: '', stat: '', cut: '', status: '', fir: '', year: '' }, level = 'region', scope = null;
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    function num(s) { var n = parseFloat(String(s == null ? '' : s).replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; }
    // A uniform number, or the page's old clean-up of a cell that did not parse (units, ₹ signs).
    function amt(r, k) { return r[k] != null ? r[k] : num(r[k + '_raw']); }
    // A uniform date (ISO) back as the sheet writes it (dd.mm.yyyy); a cell that did not parse as written.
    function dots(r, k) { var v = r[k]; return v ? v.slice(8, 10) + '.' + v.slice(5, 7) + '.' + v.slice(0, 4) : r[k + '_raw'] || ''; }
    function dmy(s) { var p = String(s || '').trim().split(/[./-]/); if (p.length !== 3) return null; var y = +p[2]; if (y < 2000 || y > 2040) return null; return new Date(y, +p[1] - 1, +p[0]); }
    function cccName(raw) { var s = String(raw || '').replace(/\s*(CUSTOMER CARE CENTER|CUSTOMER CARE CENTRE|CCC)\s*/gi, '').trim(); return s ? UI.title(s) : 'Unknown'; }

    // Rules kept from the old page: a paid provisional bill counts as final; buckets by % cut.
    // t.rows: uniform rows of schema/theft_assessment.json, already scoped to the login by MzoRows.
    function prepare(t) {
      var lo = null, hi = null;
      // The inspection range in the header covers the whole sheet, as before (t.all, not the scoped rows).
      t.all.forEach(function (r) { var d = dmy(dots(r, 'inspection_date')); if (d) { if (!lo || d < lo) lo = d; if (!hi || d > hi) hi = d; } });
      all = t.rows.map(function (r) {
        var loc = r.location_code;
        var provU = amt(r, 'provsnl_bill_unit'), provA = amt(r, 'provsnl_bill_amt'), finU = amt(r, 'final_billing_unit'), finA = amt(r, 'final_bill_amt'), pay = amt(r, 'payment_amt');
        var explicitFinal = finA > 0 || r.final_print_doc_no.length > 3;
        var paid = pay > 0, hasFinal = explicitFinal || paid;
        var effA = explicitFinal ? finA : paid ? (provA > 0 ? provA : pay) : 0;
        var effU = explicitFinal ? finU : paid ? provU : 0;
        var cut = 0, cutPct = 0, bucket = 'pending_final';
        if (hasFinal) {
          if (explicitFinal && provA > 0) {
            cut = provA - effA; cutPct = cut / provA * 100;
            bucket = cut > 0 ? (cutPct > 50 ? 'critical' : cutPct >= 20 ? 'moderate' : 'minor') : cut < 0 ? 'increased' : 'zero';
          } else bucket = 'zero';
        }
        var assess = hasFinal ? effA : provA, balance = Math.max(0, assess - pay);
        var status = pay >= assess && assess > 0 ? 'recovered' : pay > 0 ? 'partial' : !hasFinal ? 'pending_final' : 'unpaid';
        var type = (r.case_type || 'FIR').toUpperCase();
        var insp = dots(r, 'inspection_date'), prov = dots(r, 'provsnl_bill_date');
        var ym = prov.match(/(\d{4})$/) || insp.match(/(\d{4})$/);
        var d = dmy(insp);
        return {
          con: r.consumer_id, loc: loc,
          _region: r._region || 'Unknown', _divn: r._division || 'Unknown', _supp: r._ccc || cccName(r.ccc_name), CCC_CODE: loc,
          insp: insp, inspD: d, provNo: r.provsnl_bill_no, provDate: prov, provU: provU, provA: provA,
          finNo: r.final_print_doc_no, finDate: dots(r, 'final_billing_date'), finU: effU, finA: effA,
          hasFinal: hasFinal, paidAsFinal: !explicitFinal && paid, cut: cut, cutPct: cutPct, bucket: bucket,
          payDate: dots(r, 'payment_dt'), pay: pay, assess: assess, balance: balance, status: status,
          fir: type.indexOf('NOT') === -1 && type.indexOf('FIR') !== -1, firDetails: r.fir_details,
          police: r.police_station, slp: r.s_lp_unit, year: ym ? ym[1] : ''
        };
      });
      $('asOn').textContent = lo && hi ? UI.fmtDate(lo) + ' – ' + UI.fmtDate(hi) : '—';
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    // Office, search, and facets: the set the numbers are counted on.
    function base(skip) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, q = f.q.toLowerCase();
      return all.filter(function (r) {
        if ((reg && r._region !== reg) || (div && r._divn !== div) || (ccc && r._supp !== ccc)) return false;
        if (skip !== 'year' && f.year && r.year !== f.year) return false;
        if (skip !== 'status' && f.status && r.status !== f.status) return false;
        if (skip !== 'fir' && f.fir && (f.fir === 'fir' ? !r.fir : r.fir)) return false;
        if (skip !== 'cut' && f.cut && cutKey(r) !== f.cut) return false;
        if (q && r.con.toLowerCase().indexOf(q) === -1 && r.provNo.toLowerCase().indexOf(q) === -1 && r.finNo.toLowerCase().indexOf(q) === -1 &&
            r.firDetails.toLowerCase().indexOf(q) === -1 && r.police.toLowerCase().indexOf(q) === -1 && String(r._supp).toLowerCase().indexOf(q) === -1 && r.loc.indexOf(q) === -1) return false;
        return true;
      });
    }

    var STAT = { final: function (r) { return r.hasFinal; }, cut: function (r) { return r.cut > 0; }, paid: function (r) { return r.pay > 0; }, due: function (r) { return r.balance > 0; } };
    // Cut bucket shown in the chart; "No cut" also holds the few bills that rose at final.
    function cutKey(r) { return !r.hasFinal ? 'pending_final' : r.bucket === 'increased' ? 'zero' : r.bucket; }

    function renderFacets() {
      // Status
      var bStatus = base('status');
      var statusCounts = { recovered: 0, partial: 0, unpaid: 0, pending_final: 0 };
      bStatus.forEach(function (r) { if (statusCounts[r.status] != null) statusCounts[r.status]++; });
      var statusOpts = [
        { value: 'recovered', label: 'Recovered', count: statusCounts.recovered, dot: 'ok' },
        { value: 'partial', label: 'Partly paid', count: statusCounts.partial, dot: 'warn' },
        { value: 'unpaid', label: 'Unpaid', count: statusCounts.unpaid, dot: 'bad' },
        { value: 'pending_final', label: 'Final pending', count: statusCounts.pending_final, dot: '' }
      ];
      UI.facet('fStatus', statusOpts, f.status, function (v) { f.status = v; render(); });

      // FIR
      var bFir = base('fir');
      var firCount = 0, noFirCount = 0;
      bFir.forEach(function (r) { if (r.fir) firCount++; else noFirCount++; });
      var firOpts = [
        { value: 'fir', label: 'With FIR', count: firCount },
        { value: 'not_fir', label: 'Without FIR', count: noFirCount }
      ];
      UI.facet('fFir', firOpts, f.fir, function (v) { f.fir = v; render(); });

      // Cut at final
      var bCut = base('cut');
      var cutCounts = {};
      CUT.forEach(function (c) { cutCounts[c.key] = 0; });
      bCut.forEach(function (r) { var k = cutKey(r); if (cutCounts[k] != null) cutCounts[k]++; });
      var cutDot = { critical: 'bad', moderate: 'warn', zero: 'ok' };
      var cutOpts = CUT.map(function (c) {
        return { value: c.key, label: c.label, count: cutCounts[c.key] || 0, dot: cutDot[c.key] || '' };
      });
      UI.facet('fCut', cutOpts, f.cut, function (v) { f.cut = v; render(); });

      // Year
      var bYear = base('year');
      var yrCounts = {};
      bYear.forEach(function (r) { if (r.year) yrCounts[r.year] = (yrCounts[r.year] || 0) + 1; });
      var yearOpts = Object.keys(yrCounts).sort().reverse().map(function (y) {
        return { value: y, label: y, count: yrCounts[y] };
      });
      UI.facet('fYear', yearOpts, f.year, function (v) { f.year = v; render(); });

      var active = (f.q ? 1 : 0) + (f.status ? 1 : 0) + (f.fir ? 1 : 0) + (f.cut ? 1 : 0) + (f.year ? 1 : 0) +
                   SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active, { fCut: f.cut, fYear: f.year });
    }

    function clearAll() {
      f.q = ''; f.stat = ''; f.status = ''; f.fir = ''; f.cut = ''; f.year = '';
      $('q').value = '';
      SELECTS.forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters();
      setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : 'region');
    }

    function render() {
      var b = base(), v = b.filter(function (r) { return !f.stat || STAT[f.stat](r); });
      var s = { prov: 0, fin: 0, finN: 0, provOnFin: 0, cut: 0, cutN: 0, pay: 0, payN: 0, due: 0, dueN: 0 };
      b.forEach(function (r) {
        s.prov += r.provA;
        if (r.hasFinal) { s.finN++; s.fin += r.finA; s.provOnFin += r.provA; if (r.cut > 0) { s.cut += r.cut; s.cutN++; } }
        if (r.pay > 0) { s.payN++; s.pay += r.pay; }
        if (r.balance > 0) s.dueN++;
        s.due += r.balance;
      });
      var rate = s.fin > 0 ? s.pay / s.fin * 100 : s.prov > 0 ? s.pay / s.prov * 100 : 0;
      var vals = {
        '': [UI.inr(s.prov), UI.n(b.length) + ' cases'],
        final: [UI.inr(s.fin), UI.n(s.finN) + ' finalised'],
        cut: [UI.inr(s.cut), (s.provOnFin ? '−' + (s.cut / s.provOnFin * 100).toFixed(1) + '% · ' : '') + UI.n(s.cutN) + ' cases'],
        paid: [UI.inr(s.pay), rate.toFixed(1) + '% of final · ' + UI.n(s.payN) + ' cases'],
        due: [UI.inr(s.due), UI.n(s.dueN) + ' cases']
      };
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        el.querySelector('.v').textContent = vals[k][0];
        el.querySelector('.s').textContent = vals[k][1];
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      renderFacets();

      // Offices
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      v.forEach(function (r) {
        var name = r[key] || 'Unknown';
        var o = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, prov: 0, fin: 0, provOnFin: 0, cut: 0, high: 0, pay: 0, due: 0 });
        o.n++; o.prov += r.provA; o.pay += r.pay; o.due += r.balance;
        if (r.hasFinal) { o.fin += r.finA; o.provOnFin += r.provA; if (r.cut > 0) o.cut += r.cut; if (r.bucket === 'critical') o.high++; }
      });
      var list = Object.keys(g).map(function (k) { var o = g[k]; o.cutPct = o.provOnFin ? o.cut / o.provOnFin * 100 : 0; o.rec = o.fin ? o.pay / o.fin * 100 : o.prov ? o.pay / o.prov * 100 : 0; return o; });
      UI.table('officeTable', {
        rows: list, sort: { key: 'due', dir: 'desc' }, count: false, empty: 'No cases for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (x, o) { return '<span class="ui-strong">' + UI.esc(x) + '</span>' + (o.parent ? '<span class="sub">' + UI.esc(o.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Cases', num: true, fmt: UI.n },
          { key: 'prov', label: 'Provisional', num: true, fmt: UI.inr, hideSm: true },
          { key: 'cutPct', label: 'Cut', num: true, fmt: function (x) { return x ? x.toFixed(1) + '%' : '—'; } },
          { key: 'high', label: 'Cut > 50%', num: true, fmt: UI.n, hideSm: true },
          { key: 'rec', label: 'Recovered', sortVal: function (o) { return o.rec; }, fmt: function (x, o) { return UI.bar(Math.min(o.rec, 100), 100, o.rec.toFixed(0) + '%', 2); }, width: '20%' },
          { key: 'due', label: 'Outstanding', num: true, fmt: UI.inr }
        ],
        onRow: level === 'ccc' ? null : function (o) { drill(o.name); }
      });

      var totDue = v.reduce(function (sum, r) { return sum + (r.balance || 0); }, 0);
      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(v.length) + (totDue ? ' · ' + UI.inr(totDue) + ' due' : '');
      renderReportHead(v);
      UI.table('caseTable', { rows: v, sort: { key: 'balance', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No cases match these filters.', columns: CASE_COLS, onRow: detail });
      window.__view = v;
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillFilters(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillFilters(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; render(); } });
      }
      if (f.stat) {
        var statName = { final: 'Final assessment', cut: 'Cut at final', paid: 'Recovered', due: 'Outstanding' }[f.stat] || f.stat;
        active.push({ key: 'stat', label: 'Stat: ' + statName, clear: function () { f.stat = ''; render(); } });
      }
      if (f.status) {
        var stLabel = (STATUS[f.status] && STATUS[f.status][0]) || f.status;
        active.push({ key: 'status', label: 'Status: ' + stLabel, clear: function () { f.status = ''; render(); } });
      }
      if (f.fir) {
        var firLabel = f.fir === 'yes' ? 'FIR lodged' : f.fir === 'no' ? 'No FIR' : f.fir;
        active.push({ key: 'fir', label: 'FIR: ' + firLabel, clear: function () { f.fir = ''; render(); } });
      }
      if (f.cut) {
        var cMatch = CUT.filter(function (c) { return c.key === f.cut; })[0];
        active.push({ key: 'cut', label: 'Cut: ' + (cMatch ? cMatch.label : f.cut), clear: function () { f.cut = ''; render(); } });
      }
      if (f.year) {
        active.push({ key: 'year', label: 'Year: ' + f.year, clear: function () { f.year = ''; render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    var CASE_COLS = [
      { key: 'con', label: 'Consumer', fmt: function (x, r) { return '<span class="ui-strong">' + UI.esc(x || '—') + '</span><span class="sub">' + UI.esc(r._supp) + '</span>'; } },
      { key: 'insp', label: 'Inspected', num: true, hideSm: true, sortVal: function (r) { return r.inspD ? r.inspD.getTime() : 0; }, fmt: function (x, r) { return r.inspD ? UI.fmtDate(r.inspD) : UI.esc(x || '—'); } },
      { key: 'provA', label: 'Provisional', num: true, fmt: UI.inr },
      { key: 'finA', label: 'Final', num: true, hideSm: true, fmt: function (x, r) { return r.hasFinal ? UI.inr(x) : '<span class="ui-muted">—</span>'; } },
      { key: 'cutPct', label: 'Cut', num: true, fmt: function (x, r) { return r.cut > 0 ? '<span class="ui-delta ' + (x > 50 ? 'bad' : 'flat') + '">' + x.toFixed(0) + '%</span>' : '<span class="ui-muted">—</span>'; } },
      { key: 'pay', label: 'Paid', num: true, hideSm: true, fmt: function (x) { return x ? UI.inr(x) : '<span class="ui-muted">—</span>'; } },
      { key: 'balance', label: 'Balance', num: true, fmt: function (x) { return x ? UI.inr(x) : '<span class="ui-muted">—</span>'; } },
      { key: 'status', label: 'Status', fmt: function (x) { var s = STATUS[x]; return '<span class="ui-badge ' + s[1] + '">' + s[0] + '</span>'; }, csv: function (r) { return STATUS[r.status][0]; } }
    ];

    function detail(r) {
      UI.drawer('Consumer ' + (r.con || '—'), [STATUS[r.status][0], r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Inspected on', r.inspD ? UI.fmtDate(r.inspD) : r.insp], ['Case type', r.fir ? 'FIR' : 'No FIR'], ['FIR details', r.firDetails], ['Police station', r.police], ['S&LP unit', r.slp],
        ['Provisional bill', r.provNo], ['Provisional date', r.provDate], ['Provisional units', r.provU ? UI.n(r.provU) : ''], ['Provisional amount', UI.inr(r.provA)],
        ['Final bill', r.paidAsFinal ? 'Provisional bill paid (treated as final)' : r.finNo], ['Final date', r.finDate], ['Final units', r.finU ? UI.n(r.finU) : ''], ['Final amount', r.hasFinal ? UI.inr(r.finA) : 'Pending'],
        ['Cut at final', r.cut > 0 ? UI.inr(r.cut) + ' (' + r.cutPct.toFixed(1) + '%)' : r.bucket === 'increased' ? 'Increased at final' : ''],
        ['Paid', r.pay ? UI.inr(r.pay) : ''], ['Paid on', r.payDate], ['Balance', UI.inr(r.balance)], ['Location code', r.loc]
      ]);
    }

    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillFilters(); setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }

    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('rhFiltersBar').addEventListener('click', function (e) {
      var clearBtn = e.target.closest('#rhClearBtn');
      if (clearBtn) { clearAll(); return; }
      var chipBtn = e.target.closest('[data-rh-clear]');
      if (chipBtn) {
        var idx = parseInt(chipBtn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
        }
      }
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('theft-assessment.csv', [
        { key: 'con', label: 'Consumer ID' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'loc', label: 'Location code' },
        { key: 'insp', label: 'Inspection date' }, { key: 'provNo', label: 'Provisional bill no' }, { key: 'provA', label: 'Provisional amount' },
        { key: 'finNo', label: 'Final doc no' }, { key: 'finA', label: 'Final amount' }, { key: 'cut', label: 'Cut amount' }, { key: 'cutPct', label: 'Cut %', csv: function (r) { return r.cutPct ? r.cutPct.toFixed(1) : ''; } },
        { key: 'pay', label: 'Paid' }, { key: 'payDate', label: 'Paid on' }, { key: 'balance', label: 'Balance' }, { key: 'status', label: 'Status', csv: function (r) { return STATUS[r.status][0]; } },
        { key: 'fir', label: 'FIR', csv: function (r) { return r.fir ? 'Yes' : 'No'; } }, { key: 'firDetails', label: 'FIR details' }, { key: 'police', label: 'Police station' }
      ], window.__view || []);
    });
    MzoRows.refresh('refreshBtn', KEY, function (t) { prepare(t); render(); });

    var first = true;
    MzoRows.load(KEY, function (t, info) {
      if (!t) { if (info && info.error) { $('asOn').textContent = 'Error'; $('caseTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
