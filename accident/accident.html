<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accident reports · DISHA</title>
  <script src="/mzo_theme.js?v=7"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=9" />
  <script src="/mzo_presets_hub.js?v=89"></script>
  <script src="/mzo_ui.js?v=9" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .ui-side-sec-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--mzo-muted); margin-bottom: 6px; }
    .ui-check-group { display: grid; gap: 3px; }
    .ui-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--mzo-text-2);
      cursor: pointer;
      user-select: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .ui-check-label:hover {
      background: var(--mzo-hover);
      color: var(--mzo-text);
    }
    .ui-check-label input[type="checkbox"] {
      accent-color: var(--mzo-accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
      margin: 0;
      flex: none;
    }
    .ui-check-label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ui-check-label small { color: var(--mzo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .sub { display: block; font-size: 11.5px; color: var(--mzo-muted); margin-top: 2px; }

    /* Overview Executive Dashboard Grid */
    .acc-ov-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .acc-card {
      background: var(--mzo-surface-2);
      border: 1px solid var(--mzo-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .acc-card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--mzo-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .acc-metric-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed var(--mzo-border);
      font-size: 13px;
    }
    .acc-metric-row:last-child {
      border-bottom: none;
    }
    .acc-metric-label {
      color: var(--mzo-text-2);
    }
    .acc-metric-val {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--mzo-text);
    }

    /* Monthly timeline distribution matrix */
    .acc-cal-sec {
      padding: 0 16px 16px;
    }
    .acc-cal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--mzo-text);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .acc-cal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
    }
    .acc-cal-cell {
      padding: 10px;
      border-radius: 8px;
      background: var(--mzo-surface-2);
      border: 1px solid var(--mzo-border);
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .acc-cal-cell:hover {
      background: var(--mzo-hover);
      border-color: var(--mzo-border-strong);
    }
    .acc-cal-cell.hot {
      background: var(--mzo-bad-soft);
      border-color: transparent;
    }
    .acc-cal-cell.hot .acc-cal-v {
      color: var(--mzo-bad);
    }
    .acc-cal-k {
      font-size: 11.5px;
      color: var(--mzo-muted);
      font-weight: 500;
    }
    .acc-cal-v {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 0;
      font-variant-numeric: tabular-nums;
      color: var(--mzo-text);
    }
    .acc-cal-s {
      font-size: 11px;
      color: var(--mzo-muted);
    }

    /* Hotspot badges */
    .acc-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--mzo-surface-2);
      border: 1px solid var(--mzo-border);
      font-size: 12px;
      color: var(--mzo-text);
      margin: 2px;
    }
    .acc-chip strong {
      margin-left: 4px;
      color: var(--mzo-accent);
    }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Accident reports<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search victim, accident ID, cause, location or officer" title="Victim, accident ID, cause, location or officer" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All Malda Zone</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="Unit / CCC"><option value="">All units / CCCs</option></select></span>
          <span class="ui-select"><select id="voltageFilter" aria-label="Voltage class"><option value="">All voltage classes</option></select></span>
          <span class="ui-select"><select id="causeFilter" aria-label="Cause"><option value="">All causes</option></select></span>
          <span class="ui-select"><select id="categoryFilter" aria-label="Victim category"><option value="">All victim categories</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Quick filters</div>
          <div class="ui-check-group">
            <label class="ui-check-label"><input type="checkbox" id="chkFatal" /><span>Fatal accidents only</span><small id="cntFatal"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkPending" /><span>Inquiry pending only</span><small id="cntPending"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkHuman" /><span>Human victims only</span><small id="cntHuman"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkOutsourced" /><span>Outsourced / Contractor</span><small id="cntOutsourced"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkAnimal" /><span>Animals &amp; Livestock</span><small id="cntAnimal"></small></label>
          </div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Facets">
            <button type="button" role="tab" data-pane="fYear" aria-pressed="true" aria-selected="true">Year</button>
            <button type="button" role="tab" data-pane="fVoltage" aria-pressed="false" aria-selected="false">Voltage</button>
            <button type="button" role="tab" data-pane="fCause" aria-pressed="false" aria-selected="false">Cause</button>
          </div>
          <div aria-label="Accident Year" id="fYear"></div>
          <div aria-label="Voltage Class" id="fVoltage" hidden></div>
          <div aria-label="Cause of Accident" id="fCause" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary"></section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    var VALID_REGIONS = [
      'Malda (D) Region',
      'Dakshin Dinajpur (D) Region',
      'Raiganj (D) Region',
      'Uttar Dinajpur (D) Region'
    ];

    var FIELDS = {
      'Victim Id': 'victim_id', 'Victim Status': 'victim_status', 'Accident Id': 'accident_id', 'Status Description': 'status_description',
      'Type of Injury': 'type_of_injury', 'Type of Victim': 'type_of_victim', 'Name of victim': 'name_of_victim', 'Type of Animal': 'type_of_animal',
      'Type of property': 'type_of_property', 'Name of Owner of Animal/ property': 'name_of_owner_of_animal_property',
      'Address of victim/ Owner of Animal': 'address_of_victim_owner_of_animal', 'Category of Victim': 'category_of_victim',
      'Name of Outsourced Agency': 'name_of_outsourced_agency', 'Type of job performed': 'type_of_job_performed', 'Skilled or Not': 'skilled_or_not',
      'Coverage under ESI or Not': 'coverage_under_esi_or_not', 'Nature of Injury': 'nature_of_injury', 'Fatality On Enquery': 'fatality_on_enquery',
      'Post Morten Attached': 'post_morten_attached', 'Incident submitted by (Reporting officer': 'incident_submitted_by_reporting_officer',
      'CUG No of Reporting officer': 'cug_no_of_reporting_officer', 'Authorised or not': 'authorised_or_not',
      'Name of CCC/ Substation/ RE Project': 'name_of_ccc_substation_re_project', 'Name of Division / RE Project': 'name_of_division_re_project',
      'Name of the Region': 'name_of_the_region', 'Accident Location': 'accident_location', 'Working System in Voltage Class': 'working_system_in_voltage_class',
      'Accident in Voltage Class': 'accident_in_voltage_class', 'Cause of Accident': 'cause_of_accident', 'Addl. Casue of Accident': 'addl_casue_of_accident',
      'Inquiry Submitted on': 'inquiry_submitted_on', 'Inquiry Accepted on': 'inquiry_accepted_on', 'Incident Disposed on': 'incident_disposed_on',
      'Payment Released on': 'payment_released_on', 'Age of Victim': 'age_of_victim', 'Date of Accident': 'date_of_accident',
      'Pending since last status change(days)': 'pending_since_last_status_change_days'
    };

    var TABS = [
      ['overview', 'Overview & Insights'],
      ['division', 'Division'],
      ['unit', 'CCC / Unit'],
      ['timeline', 'Year & Month'],
      ['cause', 'Cause & Hazard'],
      ['voltage', 'Voltage Class'],
      ['victim', 'Victim & Agency'],
      ['incidents', 'Incidents list']
    ];

    var KPI_STATS = [
      { key: '', label: 'Total Incidents', dot: '' },
      { key: 'fatal', label: 'Fatal Accidents', dot: 'bad' },
      { key: 'pending', label: 'Pending Inquiries', dot: 'warn' },
      { key: 'human', label: 'Human Victims', dot: 'ok' },
      { key: 'outsourced', label: 'Outsourced / Contractor', dot: 'c4' },
      { key: 'animal', label: 'Animals / Livestock', dot: 'c5' }
    ];

    var KPI_MAP = {
      '': { label: 'All Incidents', test: function () { return true; } },
      'fatal': { label: 'Fatal accidents', test: function (r) { return r.isFatal; } },
      'pending': { label: 'Pending inquiries', test: function (r) { return r.isInquiryPending; } },
      'human': { label: 'Human victims', test: function (r) { return r.isHuman; } },
      'outsourced': { label: 'Outsourced victims', test: function (r) { return r.isOutsourced; } },
      'animal': { label: 'Animal / Property cases', test: function (r) { return r.isAnimal; } }
    };

    var all = [];
    var accidentVictimsMap = {};
    var tab = 'overview';
    var lastTable = null;
    var asOn = null;

    var f = {
      q: '',
      region: '',
      division: '',
      ccc: '',
      voltage: '',
      cause: '',
      category: '',
      chkFatal: false,
      chkPending: false,
      chkHuman: false,
      chkOutsourced: false,
      chkAnimal: false,
      year: '',
      facetVoltage: '',
      facetCause: '',
      kpi: ''
    };

    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter', 'voltageFilter', 'causeFilter', 'categoryFilter'];

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    $('stats').innerHTML = KPI_STATS.map(function (o) {
      return '<button type="button" class="ui-stat" data-k="' + o.key + '">' +
        '<div class="k">' + (o.dot ? '<span class="ui-dot ' + o.dot + '"></span>' : '') + UI.esc(o.label) + '</div>' +
        '<div class="v"><span class="ui-skel"></span></div>' +
        '<div class="s">&nbsp;</div>' +
        '</button>';
    }).join('');

    function parseDMY(str) {
      if (!str) return null;
      var m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(String(str).trim());
      if (m) {
        var d = new Date(+m[3], +m[2] - 1, +m[1]);
        return isNaN(d) ? null : d;
      }
      var iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(str).trim());
      if (iso) {
        var d2 = new Date(+iso[1], +iso[2] - 1, +iso[3]);
        return isNaN(d2) ? null : d2;
      }
      return null;
    }

    function formatDMY(date) {
      if (!date) return '';
      return String(date.getDate()).padStart(2, '0') + '/' + String(date.getMonth() + 1).padStart(2, '0') + '/' + date.getFullYear();
    }

    function clean(str) {
      return (str == null ? '' : String(str)).trim().replace(/\s+/g, ' ');
    }

    function isFatalRow(row, d) {
      var n = ((row['Nature of Injury'] || d.nature_of_injury || '') + '').toLowerCase();
      var f = ((row['Fatality On Enquery'] || d.fatality_on_enquery || '') + '').toLowerCase();
      return n === 'fatal' || f === 'yes';
    }

    function isInquiryPendingRow(row, d) {
      var inq = clean(row['Inquiry Submitted on'] || d.inquiry_submitted_on || '');
      return !inq;
    }

    function toRow(d, dates) {
      var row = {};
      for (var label in FIELDS) {
        var fld = FIELDS[label], v = d[fld];
        if (v == null || v === '') row[label] = d[fld + '_raw'] || '';
        else if (dates.has(fld)) row[label] = v.slice(8, 10) + '/' + v.slice(5, 7) + '/' + v.slice(0, 4);
        else row[label] = String(v);
      }
      return row;
    }

    function prepare(t) {
      var dates = new Set(t.columns.filter(function (c) { return c.type === 'date'; }).map(function (c) { return c.name; }));
      var rawRows = t.rows.map(function (d) { return { raw: toRow(d, dates), d: d }; });

      var seenAccidentIds = new Set();
      var processed = [];
      accidentVictimsMap = {};

      rawRows.forEach(function (item) {
        var row = item.raw, d = item.d;
        var region = clean(row['Name of the Region'] || d.name_of_the_region);
        var accidentId = clean(row['Accident Id'] || d.accident_id);

        if (!accidentId || !region || VALID_REGIONS.indexOf(region) === -1) return;

        var mappedRegion = region === 'Raiganj (D) Region' ? 'Uttar Dinajpur (D) Region' : region; // old name of the region
        var divn = clean(row['Name of Division / RE Project'] || d.name_of_division_re_project) || 'Unknown';
        var ccc = clean(row['Name of CCC/ Substation/ RE Project'] || d.name_of_ccc_substation_re_project) || 'Unknown';
        var dt = parseDMY(row['Date of Accident'] || d.date_of_accident);
        var fatal = isFatalRow(row, d);
        var pending = isInquiryPendingRow(row, d);
        var vType = clean(row['Type of Victim'] || d.type_of_victim);
        var vCat = clean(row['Category of Victim'] || d.category_of_victim);

        var victimObj = {
          accidentId: accidentId,
          victimId: clean(row['Victim Id'] || d.victim_id),
          victimName: clean(row['Name of victim'] || d.name_of_victim),
          victimAge: clean(row['Age of Victim'] || d.age_of_victim),
          victimType: vType,
          victimCategory: vCat,
          injuryType: clean(row['Type of Injury'] || d.type_of_injury),
          natureOfInjury: clean(row['Nature of Injury'] || d.nature_of_injury),
          fatalityOnEnquiry: clean(row['Fatality On Enquery'] || d.fatality_on_enquery),
          isFatal: fatal,
          isInquiryPending: pending,
          dateStr: dt ? formatDMY(dt) : clean(row['Date of Accident'] || d.date_of_accident),
          dateObj: dt,
          year: dt ? dt.getFullYear() : null,
          monthIndex: dt ? dt.getMonth() : -1,
          monthName: dt ? dt.toLocaleString('default', { month: 'short' }) : '',
          region: mappedRegion,
          division: divn,
          ccc: ccc,
          location: clean(row['Accident Location'] || d.accident_location),
          voltage: clean(row['Accident in Voltage Class'] || d.accident_in_voltage_class) || 'Unknown',
          workingVoltage: clean(row['Working System in Voltage Class'] || d.working_system_in_voltage_class) || 'Unknown',
          cause: clean(row['Cause of Accident'] || d.cause_of_accident) || 'Unknown',
          addlCause: clean(row['Addl. Casue of Accident'] || d.addl_casue_of_accident),
          reportingOfficer: clean(row['Incident submitted by (Reporting officer'] || d.incident_submitted_by_reporting_officer),
          cugNo: clean(row['CUG No of Reporting officer'] || d.cug_no_of_reporting_officer),
          authorised: clean(row['Authorised or not'] || d.authorised_or_not),
          skilled: clean(row['Skilled or Not'] || d.skilled_or_not),
          outsourcedAgency: clean(row['Name of Outsourced Agency'] || d.name_of_outsourced_agency),
          jobPerformed: clean(row['Type of job performed'] || d.type_of_job_performed),
          coverageESI: clean(row['Coverage under ESI or Not'] || d.coverage_under_esi_or_not),
          postMortem: clean(row['Post Morten Attached'] || d.post_morten_attached),
          inquirySubmittedOn: clean(row['Inquiry Submitted on'] || d.inquiry_submitted_on),
          inquiryAcceptedOn: clean(row['Inquiry Accepted on'] || d.inquiry_accepted_on),
          incidentDisposedOn: clean(row['Incident Disposed on'] || d.incident_disposed_on),
          paymentReleasedOn: clean(row['Payment Released on'] || d.payment_released_on),
          animalType: clean(row['Type of Animal'] || d.type_of_animal),
          ownerName: clean(row['Name of Owner of Animal/ property'] || d.name_of_owner_of_animal_property),
          ownerAddress: clean(row['Address of victim/ Owner of Animal'] || d.address_of_victim_owner_of_animal),
          pendingDays: clean(row['Pending since last status change(days)'] || d.pending_since_last_status_change_days),
          isHuman: vType.toLowerCase() === 'human',
          isOutsourced: vCat.toLowerCase() === 'outsourced',
          isAnimal: vType.toLowerCase() === 'animal' || vType.toLowerCase() === 'property'
        };

        if (!accidentVictimsMap[accidentId]) {
          accidentVictimsMap[accidentId] = [];
        }
        accidentVictimsMap[accidentId].push(victimObj);

        if (!seenAccidentIds.has(accidentId)) {
          seenAccidentIds.add(accidentId);
          processed.push(victimObj);
        }
      });

      all = processed;
      all.forEach(function (r) {
        var victims = accidentVictimsMap[r.accidentId] || [r];
        var vNames = victims.map(function (v) { return v.victimName; }).join(' ');
        r.search = (r.accidentId + ' ' + vNames + ' ' + r.location + ' ' + r.reportingOfficer + ' ' + r.cause + ' ' + r.division + ' ' + r.ccc + ' ' + r.voltage + ' ' + r.victimCategory).toLowerCase();
      });

      fillFilters();
    }

    function fillFilters() {
      var reg = $('regionFilter').value;
      var div = $('divisionFilter').value;

      var regions = ['Malda (D) Region', 'Dakshin Dinajpur (D) Region', 'Uttar Dinajpur (D) Region'];
      UI.fill('regionFilter', regions, 'All Malda Zone');

      var r1 = all.filter(function (r) { return !reg || r.region === reg; });
      var divs = {};
      r1.forEach(function (r) { if (r.division) divs[r.division] = 1; });
      UI.fill('divisionFilter', Object.keys(divs).sort(), 'All divisions');

      var r2 = r1.filter(function (r) { return !div || r.division === div; });
      var cccs = {};
      r2.forEach(function (r) { if (r.ccc) cccs[r.ccc] = 1; });
      UI.fill('cccFilter', Object.keys(cccs).sort(), 'All units / CCCs');

      var voltages = {};
      all.forEach(function (r) { if (r.voltage && r.voltage !== 'Unknown') voltages[r.voltage] = 1; });
      UI.fill('voltageFilter', Object.keys(voltages).sort(), 'All voltage classes');

      var causes = {};
      all.forEach(function (r) { if (r.cause && r.cause !== 'Unknown') causes[r.cause] = 1; });
      UI.fill('causeFilter', Object.keys(causes).sort(), 'All causes');

      var cats = {};
      all.forEach(function (r) { if (r.victimCategory && r.victimCategory !== 'Unknown') cats[r.victimCategory] = 1; });
      UI.fill('categoryFilter', Object.keys(cats).sort(), 'All victim categories');

      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function filtered(skip) {
      var q = f.q.toLowerCase(), v = function (id) { return $(id).value; };
      return all.filter(function (r) {
        if (v('regionFilter') && r.region !== v('regionFilter')) return false;
        if (v('divisionFilter') && r.division !== v('divisionFilter')) return false;
        if (v('cccFilter') && r.ccc !== v('cccFilter')) return false;
        if (v('voltageFilter') && r.voltage !== v('voltageFilter')) return false;
        if (v('causeFilter') && r.cause !== v('causeFilter')) return false;
        if (v('categoryFilter') && r.victimCategory !== v('categoryFilter')) return false;

        if (skip !== 'checkboxes') {
          if (f.chkFatal && !r.isFatal) return false;
          if (f.chkPending && !r.isInquiryPending) return false;
          if (f.chkHuman && !r.isHuman) return false;
          if (f.chkOutsourced && !r.isOutsourced) return false;
          if (f.chkAnimal && !r.isAnimal) return false;
        }

        if (skip !== 'year' && f.year && String(r.year) !== f.year) return false;
        if (skip !== 'voltage' && f.facetVoltage && r.voltage !== f.facetVoltage) return false;
        if (skip !== 'cause' && f.facetCause && r.cause !== f.facetCause) return false;

        if (q && r.search.indexOf(q) === -1) return false;

        return true;
      });
    }

    function renderFacets() {
      var bYear = filtered('year');
      var years = {};
      bYear.forEach(function (r) { if (r.year) years[r.year] = (years[r.year] || 0) + 1; });
      var yearItems = Object.keys(years).sort(function (a, b) { return +b - +a; }).map(function (y) {
        return { value: y, label: y, count: years[y] };
      });
      UI.facet($('fYear'), yearItems, f.year, function (val) {
        f.year = val;
        render();
      });

      var bVolt = filtered('voltage');
      var volts = {};
      bVolt.forEach(function (r) { if (r.voltage && r.voltage !== 'Unknown') volts[r.voltage] = (volts[r.voltage] || 0) + 1; });
      var voltItems = Object.keys(volts).sort(function (a, b) { return volts[b] - volts[a]; }).map(function (v) {
        return { value: v, label: v, count: volts[v] };
      });
      UI.facet($('fVoltage'), voltItems, f.facetVoltage, function (val) {
        f.facetVoltage = val;
        render();
      });

      var bCause = filtered('cause');
      var causes = {};
      bCause.forEach(function (r) { if (r.cause && r.cause !== 'Unknown') causes[r.cause] = (causes[r.cause] || 0) + 1; });
      var causeItems = Object.keys(causes).sort(function (a, b) { return causes[b] - causes[a]; }).slice(0, 15).map(function (c) {
        return { value: c, label: c, count: causes[c] };
      });
      UI.facet($('fCause'), causeItems, f.facetCause, function (val) {
        f.facetCause = val;
        render();
      });
    }

    function render() {
      var b = filtered();

      var nOn = (f.q ? 1 : 0) +
        (f.chkFatal ? 1 : 0) + (f.chkPending ? 1 : 0) + (f.chkHuman ? 1 : 0) + (f.chkOutsourced ? 1 : 0) + (f.chkAnimal ? 1 : 0) +
        (f.year ? 1 : 0) + (f.facetVoltage ? 1 : 0) + (f.facetCause ? 1 : 0) + (f.kpi ? 1 : 0);
      SELECTS.forEach(function (id) { if ($(id).value) nOn++; });

      setActive(nOn, {
        fYear: !!f.year,
        fVoltage: !!f.facetVoltage,
        fCause: !!f.facetCause
      });

      var bChk = filtered('checkboxes');
      $('cntFatal').textContent = UI.n(bChk.filter(function (r) { return r.isFatal; }).length);
      $('cntPending').textContent = UI.n(bChk.filter(function (r) { return r.isInquiryPending; }).length);
      $('cntHuman').textContent = UI.n(bChk.filter(function (r) { return r.isHuman; }).length);
      $('cntOutsourced').textContent = UI.n(bChk.filter(function (r) { return r.isOutsourced; }).length);
      $('cntAnimal').textContent = UI.n(bChk.filter(function (r) { return r.isAnimal; }).length);

      renderFacets();

      var tot = b.length;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        var kpiDef = KPI_MAP[k] || KPI_MAP[''];
        var rows = b.filter(kpiDef.test);
        el.querySelector('.v').textContent = UI.n(rows.length);

        if (k === '') {
          var dates = b.map(function (r) { return r.dateObj; }).filter(Boolean);
          if (dates.length) {
            var min = new Date(Math.min.apply(null, dates));
            var max = new Date(Math.max.apply(null, dates));
            el.querySelector('.s').textContent = formatDMY(min) + ' – ' + formatDMY(max);
          } else {
            el.querySelector('.s').textContent = 'All records';
          }
        } else if (k === 'fatal') {
          el.querySelector('.s').textContent = UI.pct(rows.length, tot) + ' fatality rate';
        } else if (k === 'pending') {
          el.querySelector('.s').textContent = UI.pct(rows.length, tot) + ' pending';
        } else if (k === 'human') {
          var ages = rows.map(function (r) { return parseFloat(r.victimAge); }).filter(function (a) { return !isNaN(a) && a > 0; });
          var avgAge = ages.length ? (ages.reduce(function (s, a) { return s + a; }, 0) / ages.length).toFixed(1) + ' yrs avg' : '';
          el.querySelector('.s').textContent = avgAge ? avgAge + ' · ' + UI.pct(rows.length, tot) : UI.pct(rows.length, tot);
        } else {
          el.querySelector('.s').textContent = UI.pct(rows.length, tot) + ' of total';
        }

        el.setAttribute('aria-pressed', String(f.kpi === k));
      });

      if (all.length) $('asOn').textContent = UI.n(all.length) + ' accidents recorded';

      var view = f.kpi && KPI_MAP[f.kpi] ? b.filter(KPI_MAP[f.kpi].test) : b;

      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'incidents' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';
      var hintText = (kpiTitle ? 'Showing ' + kpiTitle.toLowerCase() + ' only.' : '');
      $('hint').textContent = hintText;

      renderReportHead(view);
      renderTab(view);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';

      $('rhTitle').textContent = tabLabel + (kpiTitle ? ' · ' + kpiTitle : '');

      if (view.length === all.length) {
        $('rhCount').textContent = 'Showing all ' + UI.n(all.length) + ' accidents';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' accidents';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('regionFilter').value) {
        currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { $('regionFilter').value = ''; fillFilters(); } });
      }
      if ($('divisionFilter').value) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { $('divisionFilter').value = ''; fillFilters(); } });
      }
      if ($('cccFilter').value) {
        currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { $('cccFilter').value = ''; fillFilters(); } });
      }
      if ($('voltageFilter').value) {
        currentActiveFilters.push({ label: 'Voltage', value: $('voltageFilter').value, clear: function () { $('voltageFilter').value = ''; fillFilters(); } });
      }
      if ($('causeFilter').value) {
        currentActiveFilters.push({ label: 'Cause', value: $('causeFilter').value, clear: function () { $('causeFilter').value = ''; fillFilters(); } });
      }
      if ($('categoryFilter').value) {
        currentActiveFilters.push({ label: 'Victim category', value: $('categoryFilter').value, clear: function () { $('categoryFilter').value = ''; fillFilters(); } });
      }
      if (f.chkFatal) {
        currentActiveFilters.push({ label: 'Quick', value: 'Fatal only', clear: function () { f.chkFatal = false; $('chkFatal').checked = false; } });
      }
      if (f.chkPending) {
        currentActiveFilters.push({ label: 'Quick', value: 'Inquiry pending', clear: function () { f.chkPending = false; $('chkPending').checked = false; } });
      }
      if (f.chkHuman) {
        currentActiveFilters.push({ label: 'Quick', value: 'Human only', clear: function () { f.chkHuman = false; $('chkHuman').checked = false; } });
      }
      if (f.chkOutsourced) {
        currentActiveFilters.push({ label: 'Quick', value: 'Outsourced/dept staff', clear: function () { f.chkOutsourced = false; $('chkOutsourced').checked = false; } });
      }
      if (f.chkAnimal) {
        currentActiveFilters.push({ label: 'Quick', value: 'Animal only', clear: function () { f.chkAnimal = false; $('chkAnimal').checked = false; } });
      }
      if (f.year) {
        currentActiveFilters.push({ label: 'Year', value: f.year, clear: function () { f.year = ''; } });
      }
      if (f.facetVoltage) {
        currentActiveFilters.push({ label: 'Voltage facet', value: f.facetVoltage, clear: function () { f.facetVoltage = ''; } });
      }
      if (f.facetCause) {
        currentActiveFilters.push({ label: 'Cause facet', value: f.facetCause, clear: function () { f.facetCause = ''; } });
      }
      if (f.kpi && KPI_MAP[f.kpi]) {
        currentActiveFilters.push({ label: 'KPI', value: KPI_MAP[f.kpi].label, clear: function () { f.kpi = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    function renderTab(view) {
      var el = $('table');
      if (tab === 'overview') {
        renderOverview(view, el);
      } else if (tab === 'division') {
        UI.table(el, groupTable(view, function (r) { return r.division; }, 'Division', null, null, function (r) { return r.region; }, function (name) {
          $('divisionFilter').value = name;
          tab = 'unit';
          fillFilters();
          render();
        }));
      } else if (tab === 'unit') {
        UI.table(el, groupTable(view, function (r) { return r.ccc; }, 'CCC / Unit', null, null, function (r) { return r.division; }, function (name) {
          $('cccFilter').value = name;
          tab = 'incidents';
          fillFilters();
          render();
        }));
      } else if (tab === 'timeline') {
        renderTimelineTable(view, el);
      } else if (tab === 'cause') {
        UI.table(el, groupTable(view, function (r) { return r.cause; }, 'Cause of accident', null, null, null, function (name) {
          f.cause = name;
          $('causeFilter').value = name;
          tab = 'incidents';
          render();
        }));
      } else if (tab === 'voltage') {
        UI.table(el, groupTable(view, function (r) { return r.voltage; }, 'Voltage Class', null, null, null, function (name) {
          f.voltage = name;
          $('voltageFilter').value = name;
          tab = 'incidents';
          render();
        }));
      } else if (tab === 'victim') {
        UI.table(el, groupTable(view, function (r) { return r.victimCategory || 'Unknown'; }, 'Victim Category', null, null, null, function (name) {
          f.category = name;
          $('categoryFilter').value = name;
          tab = 'incidents';
          render();
        }));
      } else if (tab === 'incidents') {
        renderIncidentsList(view, el);
      }
    }

    function renderOverview(view, el) {
      var total = view.length;
      if (total === 0) {
        el.innerHTML = '<div class="ui-empty">No accident reports match the selected filters.</div>';
        lastTable = null;
        return;
      }

      var fatalCases = view.filter(function (r) { return r.isFatal; }).length;
      var pendingInquiries = view.filter(function (r) { return r.isInquiryPending; }).length;
      var humanCases = view.filter(function (r) { return r.isHuman; }).length;
      var outsourcedCases = view.filter(function (r) { return r.isOutsourced; }).length;
      var animalCases = view.filter(function (r) { return r.isAnimal; }).length;

      var ages = view.filter(function (r) { return r.isHuman; }).map(function (r) { return parseFloat(r.victimAge); }).filter(function (a) { return !isNaN(a) && a > 0; });
      var avgAge = ages.length ? (ages.reduce(function (s, a) { return s + a; }, 0) / ages.length).toFixed(1) : '—';

      var totalDelay = 0, countDelay = 0;
      view.forEach(function (r) {
        if (r.dateObj && r.inquirySubmittedOn) {
          var submitDate = parseDMY(r.inquirySubmittedOn);
          if (submitDate) {
            var diff = Math.floor((submitDate - r.dateObj) / 86400000);
            if (diff >= 0 && diff < 3650) {
              totalDelay += diff;
              countDelay++;
            }
          }
        }
      });
      var avgDelay = countDelay ? (totalDelay / countDelay).toFixed(1) + ' days' : 'N/A';

      // Top causes
      var causesMap = {};
      view.forEach(function (r) { var c = r.cause || 'Unknown'; causesMap[c] = (causesMap[c] || 0) + 1; });
      var topCauses = Object.entries(causesMap).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);

      // Voltage distribution
      var voltMap = {};
      view.forEach(function (r) { var v = r.voltage || 'Unknown'; voltMap[v] = (voltMap[v] || 0) + 1; });
      var voltList = Object.entries(voltMap).sort(function (a, b) { return b[1] - a[1]; });

      // Monthly calendar distribution
      var monthCounts = Array.from({ length: 12 }, function (_, i) {
        return {
          name: new Date(2024, i, 1).toLocaleString('default', { month: 'short' }),
          index: i,
          count: 0
        };
      });
      view.forEach(function (r) {
        if (r.dateObj) {
          var m = r.dateObj.getMonth();
          if (m >= 0 && m < 12) monthCounts[m].count++;
        }
      });
      var topMonthCounts = monthCounts.map(function (m) { return m.count; }).sort(function (a, b) { return b - a; }).slice(0, 3);

      // Police Station Hotspots
      var psMap = {};
      var psRegex = /P[.\s-]*S[.\s:-]*([\w\s]+)/gi;
      view.forEach(function (r) {
        var loc = r.location || '';
        var match;
        while ((match = psRegex.exec(loc)) !== null) {
          var ps = match[1].trim().split(/[.,;()\\/-]/)[0].trim();
          if (ps && ps.length > 2) {
            psMap[ps] = (psMap[ps] || 0) + 1;
          }
        }
      });
      var topPs = Object.entries(psMap).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);

      var html = '<div class="acc-ov-grid">';

      // Card 1: Fatality & Injury Severity
      html += '<div class="acc-card">' +
        '<div class="acc-card-title">Fatality &amp; Severity Analysis <span class="ui-dot bad"></span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Fatal accidents</span><span class="acc-metric-val">' + fatalCases + ' (' + UI.pct(fatalCases, total) + ')</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Non-fatal injuries</span><span class="acc-metric-val">' + (total - fatalCases) + ' (' + UI.pct(total - fatalCases, total) + ')</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Human victims</span><span class="acc-metric-val">' + humanCases + ' (' + UI.pct(humanCases, total) + ')</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Average victim age</span><span class="acc-metric-val">' + avgAge + ' years</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Animal / Livestock cases</span><span class="acc-metric-val">' + animalCases + '</span></div>' +
        '</div>';

      // Card 2: Inquiry & Legal Compliance
      html += '<div class="acc-card">' +
        '<div class="acc-card-title">Inquiry &amp; Reporting Compliance <span class="ui-dot warn"></span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Inquiry submitted</span><span class="acc-metric-val">' + (total - pendingInquiries) + ' (' + UI.pct(total - pendingInquiries, total) + ')</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Inquiry pending</span><span class="acc-metric-val">' + pendingInquiries + ' (' + UI.pct(pendingInquiries, total) + ')</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Average inquiry delay</span><span class="acc-metric-val">' + avgDelay + '</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Outsourced victims</span><span class="acc-metric-val">' + outsourcedCases + ' (' + UI.pct(outsourcedCases, total) + ')</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Inquiry compliance rate</span><span class="acc-metric-val">' + UI.pct(total - pendingInquiries, total) + '</span></div>' +
        '</div>';

      // Card 3: Hazard & Hotspot Profile
      html += '<div class="acc-card">' +
        '<div class="acc-card-title">Hazards &amp; Operational Hotspots <span class="ui-dot ok"></span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Predominant voltage</span><span class="acc-metric-val">' + (voltList[0] ? voltList[0][0] + ' (' + UI.pct(voltList[0][1], total) + ')' : '—') + '</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Primary accident cause</span><span class="acc-metric-val">' + (topCauses[0] ? UI.esc(topCauses[0][0]) : '—') + '</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Top cause share</span><span class="acc-metric-val">' + (topCauses[0] ? topCauses[0][1] + ' (' + UI.pct(topCauses[0][1], total) + ')' : '—') + '</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Identified P.S. clusters</span><span class="acc-metric-val">' + Object.keys(psMap).length + ' areas</span></div>' +
        '<div class="acc-metric-row"><span class="acc-metric-label">Most prone area</span><span class="acc-metric-val">' + (topPs[0] ? topPs[0][0] + ' (' + topPs[0][1] + ')' : '—') + '</span></div>' +
        '</div>';

      html += '</div>';

      // Monthly Seasonality Calendar
      html += '<div class="acc-cal-sec">' +
        '<div class="acc-cal-title"><span>Monthly Seasonal Distribution (Jan – Dec)</span><small style="color:var(--mzo-muted)">Red highlights peak risk months</small></div>' +
        '<div class="acc-cal-grid">';
      monthCounts.forEach(function (m) {
        var isHot = m.count > 0 && topMonthCounts.indexOf(m.count) !== -1;
        html += '<div class="acc-cal-cell' + (isHot ? ' hot' : '') + '" data-month="' + m.name + '">' +
          '<div class="acc-cal-k">' + m.name + '</div>' +
          '<div class="acc-cal-v">' + m.count + '</div>' +
          '<div class="acc-cal-s">' + UI.pct(m.count, total) + '</div>' +
          '</div>';
      });
      html += '</div></div>';

      // Hotspot Area Chips
      if (topPs.length) {
        html += '<div style="padding:0 16px 16px">' +
          '<div style="font-size:12px;font-weight:600;color:var(--mzo-muted);text-transform:uppercase;margin-bottom:8px">Top Accident-Prone Police Station Zones</div>' +
          '<div>' + topPs.map(function (p) {
            return '<span class="acc-chip">P.S. ' + UI.esc(p[0]) + '<strong>' + p[1] + ' cases</strong></span>';
          }).join('') + '</div></div>';
      }

      el.innerHTML = html;

      // Click on month cell filters or switches
      el.querySelectorAll('.acc-cal-cell').forEach(function (cell) {
        cell.addEventListener('click', function () {
          var m = cell.getAttribute('data-month');
          f.q = m;
          $('q').value = m;
          tab = 'incidents';
          render();
        });
      });

      lastTable = {
        title: 'Executive safety summary',
        cols: ['Metric', 'Value'],
        rows: [
          ['Total Incidents', total],
          ['Fatal Accidents', fatalCases + ' (' + UI.pct(fatalCases, total) + ')'],
          ['Pending Inquiries', pendingInquiries + ' (' + UI.pct(pendingInquiries, total) + ')'],
          ['Human Victims', humanCases],
          ['Average Age (Human)', avgAge + ' years'],
          ['Outsourced / Contractor', outsourcedCases],
          ['Animal / Property Cases', animalCases],
          ['Average Inquiry Delay', avgDelay],
          ['Predominant Voltage', voltList[0] ? voltList[0][0] : '—'],
          ['Primary Cause', topCauses[0] ? topCauses[0][0] : '—']
        ]
      };
    }

    function groupTable(view, keyFn, label, order, dots, subKeyFn, onRowAction) {
      var groups = {}, total = view.length;
      view.forEach(function (r) {
        var k = keyFn(r);
        if (k == null) return;
        (Array.isArray(k) ? k : [k]).forEach(function (kk) {
          var g = groups[kk] || (groups[kk] = { name: kk, sub: subKeyFn ? subKeyFn(r) : '', n: 0, fatal: 0, nonFatal: 0, pending: 0, human: 0, outsourced: 0, animal: 0 });
          g.n++;
          if (r.isFatal) g.fatal++;
          else g.nonFatal++;
          if (r.isInquiryPending) g.pending++;
          if (r.isHuman) g.human++;
          if (r.isOutsourced) g.outsourced++;
          if (r.isAnimal) g.animal++;
        });
      });

      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      if (order) {
        list.sort(function (a, b) {
          var ia = order.indexOf(a.name), ib = order.indexOf(b.name);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });
      } else {
        list.sort(function (a, b) { return b.n - a.n; });
      }

      var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));

      lastTable = {
        title: label,
        cols: [label, 'Total Incidents', 'Fatal', 'Non-Fatal', 'Pending Inquiries', 'Human', 'Outsourced', 'Animal', '% Share'],
        rows: list.map(function (g) {
          return [g.name + (g.sub ? ' (' + g.sub + ')' : ''), g.n, g.fatal, g.nonFatal, g.pending, g.human, g.outsourced, g.animal, UI.pct(g.n, total)];
        })
      };

      return {
        rows: list,
        sort: order ? null : { key: 'n', dir: 'desc' },
        count: false,
        empty: 'No accidents match these filters.',
        columns: [
          {
            key: 'name',
            label: label,
            cls: 'wrap',
            fmt: function (v, g) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span>' +
                (g.sub ? '<span class="sub">' + UI.esc(g.sub) + '</span>' : '');
            }
          },
          {
            key: 'n',
            label: 'Incidents',
            num: true,
            fmt: function (v) {
              return '<span class="ui-strong">' + UI.n(v) + '</span>' + UI.bar(v, max, UI.pct(v, total));
            }
          },
          {
            key: 'fatal',
            label: 'Fatal',
            num: true,
            fmt: function (v, g) {
              return v ? '<span class="ui-badge bad">' + UI.n(v) + '</span>' : '<span class="ui-muted">0</span>';
            }
          },
          {
            key: 'nonFatal',
            label: 'Non-Fatal',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">0</span>'; }
          },
          {
            key: 'pending',
            label: 'Inquiry Pending',
            num: true,
            fmt: function (v) {
              return v ? '<span class="ui-badge warn">' + UI.n(v) + '</span>' : '<span class="ui-badge ok">Done</span>';
            }
          },
          {
            key: 'human',
            label: 'Human',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">—</span>'; }
          },
          {
            key: 'outsourced',
            label: 'Outsourced',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">—</span>'; }
          },
          {
            key: 'animal',
            label: 'Animal',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">—</span>'; }
          }
        ],
        onRow: onRowAction ? function (g) { onRowAction(g.name); } : null
      };
    }

    function renderTimelineTable(view, el) {
      var years = {}, total = view.length;
      view.forEach(function (r) {
        var y = r.year || 'Unknown';
        var g = years[y] || (years[y] = { name: String(y), n: 0, fatal: 0, pending: 0, human: 0, outsourced: 0, months: {} });
        g.n++;
        if (r.isFatal) g.fatal++;
        if (r.isInquiryPending) g.pending++;
        if (r.isHuman) g.human++;
        if (r.isOutsourced) g.outsourced++;
        if (r.monthName) g.months[r.monthName] = (g.months[r.monthName] || 0) + 1;
      });

      var list = Object.keys(years).map(function (k) { return years[k]; });
      list.sort(function (a, b) {
        if (a.name === 'Unknown') return 1;
        if (b.name === 'Unknown') return -1;
        return +b.name - +a.name;
      });

      var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));

      lastTable = {
        title: 'Timeline progression',
        cols: ['Year', 'Incidents', 'Fatal', 'Inquiry Pending', 'Human', 'Outsourced', 'Peak Month', '% Share'],
        rows: list.map(function (g) {
          var peakMonth = Object.entries(g.months).sort(function (a, b) { return b[1] - a[1]; })[0];
          var peakStr = peakMonth ? peakMonth[0] + ' (' + peakMonth[1] + ')' : '—';
          return [g.name, g.n, g.fatal, g.pending, g.human, g.outsourced, peakStr, UI.pct(g.n, total)];
        })
      };

      UI.table(el, {
        rows: list,
        count: false,
        empty: 'No timeline records match.',
        columns: [
          {
            key: 'name',
            label: 'Year',
            fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; }
          },
          {
            key: 'n',
            label: 'Incidents',
            num: true,
            fmt: function (v) {
              return '<span class="ui-strong">' + UI.n(v) + '</span>' + UI.bar(v, max, UI.pct(v, total));
            }
          },
          {
            key: 'fatal',
            label: 'Fatal',
            num: true,
            fmt: function (v) {
              return v ? '<span class="ui-badge bad">' + UI.n(v) + '</span>' : '<span class="ui-muted">0</span>';
            }
          },
          {
            key: 'pending',
            label: 'Inquiry Pending',
            num: true,
            fmt: function (v) {
              return v ? '<span class="ui-badge warn">' + UI.n(v) + '</span>' : '<span class="ui-badge ok">Done</span>';
            }
          },
          {
            key: 'human',
            label: 'Human',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">0</span>'; }
          },
          {
            key: 'outsourced',
            label: 'Outsourced',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">0</span>'; }
          },
          {
            key: 'months',
            label: 'Peak Month',
            hideSm: true,
            fmt: function (m) {
              var peak = Object.entries(m).sort(function (a, b) { return b[1] - a[1]; })[0];
              return peak ? peak[0] + ' <small style="color:var(--mzo-muted)">(' + peak[1] + ')</small>' : '—';
            }
          }
        ],
        onRow: function (g) {
          f.year = g.name;
          tab = 'incidents';
          render();
        }
      });
    }

    function renderIncidentsList(view, el) {
      lastTable = {
        title: 'Incidents list',
        cols: ['Date', 'Accident ID', 'Victim Name', 'Age', 'Category', 'Division', 'CCC', 'Voltage', 'Cause', 'Injury', 'Inquiry Status', 'Location'],
        rows: view.map(function (r) {
          var victims = accidentVictimsMap[r.accidentId] || [r];
          var vNames = victims.map(function (v) { return v.victimName || 'Unnamed'; }).join(', ');
          var vAges = victims.map(function (v) { return v.victimAge; }).filter(Boolean).join(', ');
          return [
            r.dateStr, r.accidentId, vNames, vAges, r.victimCategory, r.division, r.ccc, r.voltage, r.cause,
            r.isFatal ? 'Fatal' : 'Non-Fatal',
            r.inquirySubmittedOn ? 'Submitted ' + r.inquirySubmittedOn : 'Pending',
            r.location
          ];
        })
      };

      UI.table(el, {
        rows: view,
        count: true,
        empty: 'No accident incidents match these filters.',
        columns: [
          {
            key: 'dateStr',
            label: 'Date',
            cls: 'nowrap',
            fmt: function (v, r) {
              return '<span class="ui-strong">' + UI.esc(v || '—') + '</span>' +
                '<span class="sub">' + UI.esc(r.accidentId) + '</span>';
            }
          },
          {
            key: 'victimName',
            label: 'Victim & Details',
            cls: 'wrap',
            fmt: function (v, r) {
              var victims = accidentVictimsMap[r.accidentId] || [r];
              var vText = victims.map(function (vItem) {
                var name = vItem.victimName || (vItem.isAnimal ? 'Animal / Property' : 'Unnamed');
                var age = vItem.victimAge ? ', ' + vItem.victimAge + 'y' : '';
                return name + age;
              }).join(' · ');
              var badgeCls = r.isFatal ? 'bad' : 'ok';
              return '<span class="ui-strong">' + UI.esc(vText) + '</span>' +
                '<span class="sub">' + UI.esc(r.victimCategory || 'Unknown') + ' · ' + UI.esc(r.victimType) + '</span>';
            }
          },
          {
            key: 'division',
            label: 'Division & CCC',
            cls: 'wrap',
            fmt: function (v, r) {
              return UI.esc(r.ccc || '—') + '<span class="sub">' + UI.esc(v) + '</span>';
            }
          },
          {
            key: 'cause',
            label: 'Cause & Voltage',
            cls: 'wrap',
            hideSm: true,
            fmt: function (v, r) {
              return UI.esc(v) + '<span class="sub">' + UI.esc(r.voltage) + '</span>';
            }
          },
          {
            key: 'isFatal',
            label: 'Injury',
            fmt: function (v, r) {
              return v
                ? '<span class="ui-badge bad">Fatal</span>'
                : '<span class="ui-badge ok">' + UI.esc(r.natureOfInjury || 'Non-Fatal') + '</span>';
            }
          },
          {
            key: 'inquirySubmittedOn',
            label: 'Inquiry',
            fmt: function (v, r) {
              return r.isInquiryPending
                ? '<span class="ui-badge warn">Pending</span>'
                : '<span class="ui-badge ok">' + UI.esc(v) + '</span>';
            }
          }
        ],
        onRow: openIncidentDrawer
      });
    }

    function openIncidentDrawer(inc) {
      var victims = accidentVictimsMap[inc.accidentId] || [inc];

      var pairs = [
        ['Accident ID', inc.accidentId],
        ['Date of Accident', inc.dateStr || '—'],
        ['Accident Location', inc.location || '—'],
        ['Region', inc.region || '—'],
        ['Division', inc.division || '—'],
        ['CCC / Substation / Project', inc.ccc || '—'],
        ['Accident Voltage Class', inc.voltage || '—'],
        ['Working System Voltage', inc.workingVoltage || '—'],
        ['Cause of Accident', inc.cause || '—'],
        ['Additional Cause', inc.addlCause || '—'],
        ['Reporting Officer', inc.reportingOfficer || '—'],
        ['CUG Contact', inc.cugNo || '—'],
        ['Inquiry Submitted On', inc.inquirySubmittedOn || 'Pending'],
        ['Inquiry Accepted On', inc.inquiryAcceptedOn || '—'],
        ['Incident Disposed On', inc.incidentDisposedOn || '—'],
        ['Payment Released On', inc.paymentReleasedOn || '—'],
        ['Pending Days', inc.pendingDays ? inc.pendingDays + ' days' : '—']
      ];

      if (victims.length === 1) {
        var v = victims[0];
        pairs.splice(3, 0,
          ['Victim Name', (v.victimName || '—') + (v.victimAge ? ' (' + v.victimAge + ' yrs)' : '')],
          ['Type of Victim', v.victimType || '—'],
          ['Category of Victim', v.victimCategory || '—'],
          ['Nature of Injury', v.natureOfInjury || '—'],
          ['Fatality on Inquiry', v.fatalityOnEnquiry || '—'],
          ['Authorised / Skilled', [v.authorised, v.skilled].filter(Boolean).join(' · ') || '—'],
          ['Outsourced Agency', v.outsourcedAgency || '—'],
          ['Job Performed', v.jobPerformed || '—'],
          ['ESI Coverage', v.coverageESI || '—'],
          ['Post-Mortem Attached', v.postMortem || '—']
        );
      }

      var extraHtml = '';
      if (victims.length > 1) {
        extraHtml += '<div style="margin-top:16px"><h4 style="font-size:13px;font-weight:600;margin:0 0 8px;color:var(--mzo-text)">Victims Involved (' + victims.length + ')</h4><div style="display:grid;gap:8px">';
        victims.forEach(function (v, idx) {
          var isVFatal = v.isFatal;
          extraHtml += '<div style="background:var(--mzo-surface-2);border:1px solid var(--mzo-border);border-radius:8px;padding:8px 10px;font-size:12.5px">' +
            '<strong>Victim ' + (idx + 1) + ': ' + UI.esc(v.victimName || 'Unnamed') + '</strong> ' + (v.victimAge ? '(' + v.victimAge + ' yrs)' : '') + '<br>' +
            'Category: ' + UI.esc(v.victimCategory || '—') + ' · Type: ' + UI.esc(v.victimType || '—') + '<br>' +
            'Injury: <span class="ui-badge ' + (isVFatal ? 'bad' : 'ok') + '">' + UI.esc(v.natureOfInjury || '—') + '</span>' +
            (v.outsourcedAgency ? ' · Agency: ' + UI.esc(v.outsourcedAgency) : '') +
            '</div>';
        });
        extraHtml += '</div></div>';
      }

      var actionsHtml = '<button type="button" class="ui-btn sm" id="copyIncidentBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy summary</button>';

      UI.drawer(
        'Accident ' + inc.accidentId,
        [inc.dateStr, inc.ccc, inc.division, inc.region].filter(Boolean).join(' · '),
        pairs,
        extraHtml,
        actionsHtml
      );

      var copyBtn = document.getElementById('copyIncidentBtn');
      if (copyBtn) {
        copyBtn.onclick = function () {
          var summaryText = 'ACCIDENT REPORT - ' + inc.accidentId + '\n' +
            'Date: ' + (inc.dateStr || '—') + '\n' +
            'Location: ' + (inc.location || '—') + ' (' + (inc.ccc || '') + ', ' + (inc.division || '') + ')\n' +
            'Voltage: ' + (inc.voltage || '—') + '\n' +
            'Cause: ' + (inc.cause || '—') + '\n' +
            'Victims: ' + victims.map(function (v) { return (v.victimName || 'Unnamed') + ' (' + (v.victimCategory || '') + ', ' + (v.natureOfInjury || '') + ')'; }).join(', ') + '\n' +
            'Inquiry: ' + (inc.inquirySubmittedOn ? 'Submitted ' + inc.inquirySubmittedOn : 'PENDING');
          UI.copy(summaryText).then(function () { UI.toast('Accident summary copied'); });
        };
      }
    }

    function clearAll() {
      f.q = '';
      f.chkFatal = false;
      f.chkPending = false;
      f.chkHuman = false;
      f.chkOutsourced = false;
      f.chkAnimal = false;
      f.year = '';
      f.facetVoltage = '';
      f.facetCause = '';
      f.kpi = '';
      $('q').value = '';
      $('chkFatal').checked = false;
      $('chkPending').checked = false;
      $('chkHuman').checked = false;
      $('chkOutsourced').checked = false;
      $('chkAnimal').checked = false;
      SELECTS.forEach(function (id) { $(id).value = ''; });
      fillFilters();
      render();
    }

    // Event listeners
    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      render();
    }, 150));

    $('regionFilter').addEventListener('change', function () {
      fillFilters();
      render();
    });

    $('divisionFilter').addEventListener('change', function () {
      fillFilters();
      render();
    });

    ['cccFilter', 'voltageFilter', 'causeFilter', 'categoryFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        SELECTS.forEach(function (selId) { UI.mark($(selId)); });
        render();
      });
    });

    ['chkFatal', 'chkPending', 'chkHuman', 'chkOutsourced', 'chkAnimal'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        f[id] = this.checked;
        render();
      });
    });

    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var k = s.getAttribute('data-k');
      f.kpi = f.kpi === k ? '' : k;
      render();
    });

    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-t');
      render();
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });

    $('copyBtn').addEventListener('click', function () {
      if (!lastTable || !lastTable.rows.length) {
        UI.toast('Nothing to copy');
        return;
      }
      var t = lastTable.cols.join('\t') + '\n' +
        lastTable.rows.map(function (r) { return r.join('\t'); }).join('\n');
      UI.copy(t).then(function () { UI.toast(lastTable.title + ' copied'); });
    });

    $('exportBtn').addEventListener('click', function () {
      if (!lastTable || !lastTable.rows.length) {
        UI.toast('Nothing to export');
        return;
      }
      var cols = lastTable.cols.map(function (c, i) {
        return { key: i, label: c };
      });
      UI.exportCsv('accident-' + tab + '.csv', cols, lastTable.rows);
    });

    // Initial Load & Refresh
    MzoRows.load('accident_reports', function (t, info) {
      if (!t) {
        if (info && info.error) $('table').innerHTML = '<div class="ui-empty">Error loading accident records. Please refresh.</div>';
        return;
      }
      prepare(t);
      render();
    }, { scope: false, forceCheck: true });

    MzoRows.refresh('refreshBtn', 'accident_reports', function (t) {
      prepare(t);
      render();
    });

  });
  </script>
</body>
</html>
