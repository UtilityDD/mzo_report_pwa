<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O&amp;M advance · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>.ui-grid > .ui-panel { margin-top: 0; } #ageTable td:first-child { white-space: nowrap; }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>O&amp;M advance to vendors</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Order number, work or vendor" autocomplete="off" /></label>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="unitFilter" aria-label="Unit"><option value="">All units</option></select></span>
      <span class="ui-select"><select id="vendorFilter" aria-label="Vendor"><option value="">All vendors</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Outstanding by age"></section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Outstanding by</h2>
          <div class="ui-tabs" role="tablist" id="dimTabs">
            <button type="button" class="ui-tab" role="tab" data-d="division" aria-selected="true">Division</button>
            <button type="button" class="ui-tab" role="tab" data-d="unit">Unit</button>
            <button type="button" class="ui-tab" role="tab" data-d="vendor">Vendor</button>
          </div>
        </div>
        <div id="dimTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel">
        <div class="ui-panel-h"><h2>Ageing</h2></div>
        <div id="ageTable"></div>
      </section>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Orders <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var URLS = {
      main: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQPBYq0ZQpaAnu0Mp_qN5oGvklgIpjolyRPf3LfSojRaN-GBBBXKHslR9ue1DOv1432oP2PzYznUUmn/pub?gid=512034300&single=true&output=csv',
      vendors: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZPn6CB_cHTFVb8S5vpvaBnczj63fYMTI0RVEdMzVcQ8O6XQi5iwTbMp2xa5vsL6zHGWxezWUSehrN/pub?gid=1818971964&single=true&output=csv',
      costcenter: '/data/costcenter.json'
    };
    var AGE = [
      { key: 'a0', label: 'Under 6 months', min: 0, max: 180 }, { key: 'a1', label: '6–12 months', min: 181, max: 365 },
      { key: 'a2', label: '1–2 years', min: 366, max: 730 }, { key: 'a3', label: '2–3 years', min: 731, max: 1095 },
      { key: 'a4', label: '3–4 years', min: 1096, max: 1460 }, { key: 'a5', label: '4–5 years', min: 1461, max: 1825 },
      { key: 'a6', label: 'Over 5 years', min: 1826, max: Infinity }
    ];
    var OVER = [['', 'Outstanding', -1], ['m6', 'Over 6 months', 180], ['y1', 'Over 1 year', 365], ['y2', 'Over 2 years', 730], ['y3', 'Over 3 years', 1095]];
    var all = [], vendors = {}, cc = {}, f = { q: '', over: '', age: '' }, dim = 'division', asOn = null;

    $('stats').innerHTML = OVER.map(function (o) { return '<button type="button" class="ui-stat" data-k="' + o[0] + '"><div class="k">' + o[1] + '</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>'; }).join('');

    function num(v) { var x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; }
    function unitName(u) { return UI.title(u).replace(/\bCcc\b/g, 'CCC').replace(/\bSs\b/g, 'SS').replace(/\bKv\b/g, 'kV').replace(/\bDtr\b/g, 'DTR'); }
    function regionOf(div) { var H = window.MzoScope && window.MzoScope.HIERARCHY, out = ''; if (H) Object.keys(H).forEach(function (r) { if (H[r].divisions && H[r].divisions[div]) out = r; }); return out; }
    function maps(vText, ccData) {
      vendors = {}; UI.csv(vText || '').forEach(function (v) { if (v.VENDOR_NO && v.NAME) vendors[String(v.VENDOR_NO).trim()] = v.NAME.trim(); });
      cc = {}; (ccData || []).forEach(function (e) { if (e['Cost Cen_Code'] && e['Unit Name'] && e['Division Name']) cc[String(e['Cost Cen_Code']).trim()] = { unit: e['Unit Name'].trim(), division: e['Division Name'].trim() }; });
    }
    function prepare(text) {
      asOn = null;
      var today = Date.now();
      all = UI.csv(text).filter(function (r) { return r['Order Number']; }).map(function (r) {
        // Cost centre column is "Resp. CCtr"; fall back to the plant code for the division.
        var m = cc[String(r['Resp. CCtr'] || '').trim()] || {}, divRaw = m.division || '';
        var isDiv = /division$/i.test(divRaw), div = divRaw.replace(/\s*division$/i, '');
        if (!divRaw && window.MzoScope) { var pd = window.MzoScope.divisionNameOf(String(r.Plant || '').trim()); if (pd) { div = pd; isDiv = true; } }
        var created = UI.date(r['Creation Date']); if (created && (!asOn || created > asOn)) asOn = created;
        var vcode = String(r.Vendor || '').trim();
        var o = {
          order: String(r['Order Number']).trim(), created: created, rawDate: r['Creation Date'],
          age: created ? Math.max(0, Math.ceil((today - created.getTime()) / 864e5)) : 0,
          value: num(r['Mat Balance(Value)']), work: String(r.Description || '').trim() || '—', plant: r.Plant, costCentre: r['Resp. CCtr'],
          division: div ? (isDiv ? div : UI.title(div)) : 'Unknown', unit: m.unit ? unitName(m.unit) : 'Unknown unit',
          vendor: vendors[vcode] || 'Unknown vendor (' + vcode + ')', vcode: vcode
        };
        o._divn = isDiv ? div : ''; o._region = isDiv ? regionOf(div) : '';
        o._supp = m.unit && /ccc$/i.test(m.unit) && window.MzoScope ? (window.MzoScope.cccNameOf(m.unit.replace(/\s*ccc$/i, '')) || '') : '';
        o.ageKey = AGE.filter(function (a) { return o.age >= a.min && o.age <= a.max; })[0].key;
        return o;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      fillFilters();
    }

    function fillFilters() {
      var div = $('divisionFilter').value, unit = $('unitFilter').value;
      UI.fill('divisionFilter', UI.uniq(all, 'division'), 'All divisions');
      var r1 = all.filter(function (r) { return !div || r.division === div; });
      UI.fill('unitFilter', UI.uniq(r1, 'unit'), 'All units');
      var r2 = r1.filter(function (r) { return !unit || r.unit === unit; });
      UI.fill('vendorFilter', UI.uniq(r2, 'vendor'), 'All vendors');
    }
    function base(skipAge) {
      var q = f.q.toLowerCase(), div = $('divisionFilter').value, unit = $('unitFilter').value, ven = $('vendorFilter').value;
      return all.filter(function (r) {
        return (!div || r.division === div) && (!unit || r.unit === unit) && (!ven || r.vendor === ven) && (skipAge || !f.age || r.ageKey === f.age) &&
          (!q || r.order.indexOf(q) !== -1 || r.work.toLowerCase().indexOf(q) !== -1 || r.vendor.toLowerCase().indexOf(q) !== -1);
      });
    }
    function sum(rows) { var s = 0; for (var i = 0; i < rows.length; i++) s += rows[i].value; return s; }
    function overDays(k) { return OVER.filter(function (o) { return o[0] === k; })[0][2]; }

    function render() {
      var b = base(false), tot = sum(b), min = overDays(f.over), view = b.filter(function (r) { return r.age > min; });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(function (r) { return r.age > overDays(k); }), v = sum(rows);
        el.querySelector('.v').textContent = UI.inr(v);
        el.querySelector('.s').textContent = k ? UI.pct(v, tot) + ' · ' + UI.n(rows.length) + ' orders' : UI.n(rows.length) + ' orders';
        el.setAttribute('aria-pressed', String(f.over === k));
      });
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.inr(sum(all)) + ' outstanding';

      var g = {};
      view.forEach(function (r) {
        var o = g[r[dim]] || (g[r[dim]] = { name: r[dim], sub: dim === 'unit' ? r.division : dim === 'vendor' ? r.vcode : '', value: 0, y1: 0, n: 0 });
        o.value += r.value; o.n++; if (r.age > 365) o.y1 += r.value;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }), vtot = sum(view), max = Math.max.apply(null, list.map(function (x) { return x.value; }).concat([0]));
      UI.table('dimTable', {
        rows: list, sort: { key: 'value', dir: 'desc' }, limit: 40, resetPage: true, count: false, empty: 'Nothing outstanding for these filters.',
        selected: function (x) { return $(dim + 'Filter').value === x.name; },
        columns: [
          { key: 'name', label: { division: 'Division', unit: 'Unit', vendor: 'Vendor' }[dim], cls: 'wrap', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.sub ? '<span class="sub">' + UI.esc(x.sub) + '</span>' : ''); } },
          { key: 'value', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'y1', label: 'Over 1 year', num: true, fmt: UI.inr, hideSm: true },
          { key: 'n', label: 'Orders', num: true, fmt: UI.n, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.value; }, fmt: function (_, x) { return UI.bar(Math.max(0, x.value), max, UI.pct(x.value, vtot)); }, hideSm: true, width: '24%' }
        ],
        onRow: function (x) { pick(x.name); }
      });

      var ab = base(true).filter(function (r) { return r.age > min; }), atot = sum(ab), amax = 0;
      var arows = AGE.map(function (a) { var rs = ab.filter(function (r) { return r.ageKey === a.key; }), v = sum(rs); if (v > amax) amax = v; return { key: a.key, label: a.label, value: v, n: rs.length }; });
      UI.table('ageTable', {
        rows: arows, count: false, selected: function (x) { return x.key === f.age; },
        columns: [
          { key: 'label', label: 'Age', sortVal: function (x) { return x.key; } },
          { key: 'value', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'n', label: 'Orders', num: true, fmt: UI.n, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.value; }, fmt: function (_, x) { return UI.bar(Math.max(0, x.value), amax, UI.pct(x.value, atot)); }, width: '36%' }
        ],
        onRow: function (x) { f.age = f.age === x.key ? '' : x.key; render(); }
      });

      $('listCount').textContent = UI.n(view.length);
      window.__view = view;
      UI.table('listTable', { rows: view, sort: { key: 'value', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No orders match these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.over || f.age || ['divisionFilter', 'unitFilter', 'vendorFilter'].some(function (id) { return $(id).value; }));
    }

    var COLS = [
      { key: 'order', label: 'Order', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
      { key: 'work', label: 'Work', cls: 'wrap' },
      { key: 'vendor', label: 'Vendor', cls: 'wrap', hideSm: true },
      { key: 'unit', label: 'Unit', hideSm: true, fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r.division) + '</span>'; } },
      { key: 'created', label: 'Created', num: true, hideSm: true, sortVal: function (r) { return r.created ? r.created.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return r.rawDate; } },
      { key: 'value', label: 'Value', num: true, fmt: UI.inr, csv: function (r) { return r.value.toFixed(2); } },
      { key: 'age', label: 'Age', num: true, fmt: function (v) { return UI.age(v); }, csv: function (r) { return r.age; } }
    ];
    function detail(r) {
      UI.drawer('Order ' + r.order, r.unit + ' · ' + r.division, [
        ['Work', r.work], ['Vendor', r.vendor], ['Vendor code', r.vcode], ['Created', UI.fmtDate(r.created)], ['Balance value', '₹' + UI.n(Math.round(r.value))],
        ['Age', UI.age(r.age) + ' (' + UI.n(r.age) + ' days)'], ['Cost centre', r.costCentre], ['Plant', r.plant]
      ]);
    }

    function pick(name) {
      var id = dim + 'Filter';
      $(id).value = $(id).value === name ? '' : name;
      if (dim === 'division') { $('unitFilter').value = ''; if ($(id).value) setDim('unit', true); }
      fillFilters(); markAll(); render();
    }
    function setDim(d, quiet) {
      dim = d;
      [].forEach.call(document.querySelectorAll('#dimTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-d') === d)); });
      $('dimTable').__ui = null;
      if (!quiet) render();
    }
    function markAll() { ['divisionFilter', 'unitFilter', 'vendorFilter'].forEach(function (id) { UI.mark($(id)); }); }

    ['divisionFilter', 'unitFilter', 'vendorFilter'].forEach(function (id, i, arr) {
      $(id).addEventListener('change', function () { arr.slice(i + 1).forEach(function (x) { $(x).value = ''; }); fillFilters(); markAll(); render(); });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.over = f.over === k ? '' : k; render(); });
    $('dimTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setDim(t.getAttribute('data-d')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.over = ''; f.age = ''; $('q').value = '';
      ['divisionFilter', 'unitFilter', 'vendorFilter'].forEach(function (id) { $(id).value = ''; });
      fillFilters(); markAll(); setDim('division');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('om-advance.csv', [{ key: 'order', label: 'Order' }, { key: 'work', label: 'Work' }, { key: 'vendor', label: 'Vendor' }, { key: 'vcode', label: 'Vendor code' }, { key: 'unit', label: 'Unit' }, { key: 'division', label: 'Division' }].concat(COLS.slice(4)), window.__view || []);
    });

    function hubText(key, url) {
      var hub = window.mzoDataHub;
      var viaHub = hub ? Promise.resolve(hub.get(key)).catch(function () { return null; }) : Promise.resolve(null);
      return viaHub.then(function (d) { return d || fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return /\.json$/.test(url) ? r.json() : r.text(); }); });
    }
    var mapsP = Promise.all([hubText('CACHE_VENDORS', URLS.vendors).catch(function () { return ''; }), hubText('CACHE_COSTCENTER', URLS.costcenter).catch(function () { return []; })])
      .then(function (m) { maps(m[0], typeof m[1] === 'string' ? JSON.parse(m[1] || '[]') : m[1]); });
    function load(force) {
      var b = $('refreshBtn'); if (force) b.classList.add('spin');
      return Promise.all([mapsP, fetch(URLS.main, { cache: force ? 'no-store' : 'default' }).then(function (r) { if (!r.ok) throw new Error('Sheet HTTP ' + r.status); return r.text(); })])
        .then(function (res) { prepare(res[1]); markAll(); render(); })
        .catch(function (e) { if (!all.length) { $('meta').textContent = 'Could not load data'; $('listTable').innerHTML = $('dimTable').innerHTML = '<div class="ui-empty">' + UI.esc(e.message) + '</div>'; } else UI.toast(e.message); })
        .then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
