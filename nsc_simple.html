<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending connections (draft A) · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <script src="/lib/nsc_rows.js?v=2" defer></script>
  <style>
    .sp { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
    .sp-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 22px; }
    .sp-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .sp-head p { margin: 4px 0 0; color: var(--mzo-muted); font-size: 13.5px; }
    .sp-head .ui-select select { max-width: 260px; height: 36px; font-size: 13.5px; }

    .sp-ask { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-radius: 12px; border: 1px solid var(--mzo-border-strong); background: var(--mzo-surface); transition: border-color .12s, box-shadow .12s; }
    .sp-ask:focus-within { border-color: var(--mzo-accent); box-shadow: var(--mzo-ring); }
    .sp-ask .ui-i { color: var(--mzo-muted); width: 17px; height: 17px; }
    .sp-ask input { flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; background: none; color: var(--mzo-text); font: 14.5px var(--mzo-font); }
    .sp-ask input::placeholder { color: var(--mzo-faint); }
    .sp-ask input:focus-visible { outline: none; }
    .sp-answer { margin: 10px 2px 0; color: var(--mzo-text-2); font-size: 13.5px; line-height: 1.55; }
    .sp-answer.err { color: var(--mzo-muted); }

    .sp-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 26px 0 22px; }
    .sp-num { text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--mzo-border); background: var(--mzo-surface); cursor: pointer; transition: border-color .12s, background-color .12s; }
    .sp-num:hover { border-color: var(--mzo-border-strong); }
    .sp-num[aria-pressed="true"] { border-color: var(--mzo-text); box-shadow: inset 0 0 0 1px var(--mzo-text); }
    .sp-num b { display: block; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .sp-num span { display: block; margin-top: 6px; color: var(--mzo-text-2); font-size: 14px; }
    .sp-num small { display: block; margin-top: 2px; color: var(--mzo-muted); font-size: 12.5px; }

    .sp-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .sp-bar h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .sp-bar h2 small { margin-left: 6px; color: var(--mzo-muted); font-weight: 400; font-size: 13px; }
    .sp-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sp-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--mzo-surface-2); box-shadow: inset 0 0 0 1px var(--mzo-border); font-size: 12.5px; color: var(--mzo-text-2); }
    .sp-chip button { width: 18px; height: 18px; border: 0; border-radius: 50%; background: none; color: var(--mzo-muted); cursor: pointer; display: grid; place-items: center; }
    .sp-chip button:hover { background: var(--mzo-hover); color: var(--mzo-text); }

    .sp-list { border: 1px solid var(--mzo-border); border-radius: 12px; background: var(--mzo-surface); overflow: hidden; }
    .sp-row { display: grid; grid-template-columns: minmax(0, 1fr) 88px auto; align-items: center; gap: 14px; padding: 14px 14px 14px 18px; border-top: 1px solid var(--mzo-border); cursor: pointer; }
    .sp-row:first-child { border-top: 0; }
    .sp-row:hover { background: var(--mzo-row-hover); }
    .sp-row .l1 { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-row .l1 span { color: var(--mzo-muted); font-weight: 400; }
    .sp-row .l2 { margin-top: 3px; color: var(--mzo-muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-row .l2 em { font-style: normal; color: var(--mzo-text-2); }
    .sp-wait { text-align: right; font-variant-numeric: tabular-nums; }
    .sp-wait b { display: block; font-size: 18px; font-weight: 600; line-height: 1.1; }
    .sp-wait span { color: var(--mzo-muted); font-size: 11.5px; }
    .sp-wait span i { font-style: normal; }
    .sp-wait.warn b { color: var(--mzo-warn); }
    .sp-wait.bad b { color: var(--mzo-bad); }
    .sp-call { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--mzo-border-strong); background: var(--mzo-surface); color: var(--mzo-text); font: 500 13px var(--mzo-font); display: inline-flex; align-items: center; text-decoration: none; }
    .sp-call:hover { background: var(--mzo-hover); }
    .sp-call[aria-disabled="true"] { visibility: hidden; }
    .sp-more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--mzo-border); }
    .sp-foot { margin-top: 18px; text-align: center; color: var(--mzo-muted); font-size: 13px; }
    .sp-foot a { color: var(--mzo-accent); text-decoration: none; }
    .sp-draft { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-left: 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; vertical-align: 3px; background: var(--mzo-accent-soft); color: var(--mzo-accent); }
    @media (max-width: 640px) {
      .sp { padding: 20px 14px 64px; }
      .sp-nums { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .sp-num { padding: 12px; } .sp-num b { font-size: 24px; } .sp-num span { font-size: 12.5px; } .sp-num small { display: none; }
      .sp-row { grid-template-columns: minmax(0, 1fr) 64px; padding: 12px 12px 12px 14px; }
      .sp-call { display: none; }
      .sp-w { display: none; }
    }
  </style>
</head>
<body>
  <main class="sp">
    <header class="sp-head">
      <div>
        <h1>Pending connections <span class="sp-draft">Draft A</span></h1>
        <p id="meta">Loading…</p>
      </div>
      <span class="ui-select"><select id="office" aria-label="Office"><option value="">Malda Zone</option></select></span>
    </header>

    <form class="sp-ask" id="askForm" autocomplete="off">
      <svg class="ui-i"><use href="#ui-search"/></svg>
      <input id="ask" type="text" placeholder="Type what you want to see — e.g. pole cases in Itahar, or application 6000188039" aria-label="What do you want to see?" />
      <button type="submit" class="ui-btn primary">Show</button>
    </form>
    <div class="sp-answer" id="answer" hidden></div>

    <section class="sp-nums" aria-label="Summary">
      <button type="button" class="sp-num" data-show=""><b id="nAll">—</b><span>Waiting for connection</span><small id="nAllS">&nbsp;</small></button>
      <button type="button" class="sp-num" data-show="d30"><b id="nD30">—</b><span>Waiting over 30 days</span><small id="nD30S">&nbsp;</small></button>
      <button type="button" class="sp-num" data-show="pole"><b id="nPole">—</b><span>Need poles</span><small id="nPoleS">&nbsp;</small></button>
    </section>

    <div class="sp-bar">
      <h2>Oldest first <small id="count"></small></h2>
      <div class="ui-seg" id="show" role="group" aria-label="Show">
        <button type="button" data-show="" aria-pressed="true">All</button>
        <button type="button" data-show="d30" aria-pressed="false">Over 30 days</button>
        <button type="button" data-show="pole" aria-pressed="false">Need poles</button>
        <button type="button" data-show="nowo" aria-pressed="false">No work order</button>
      </div>
    </div>
    <div class="sp-chips" id="chips" hidden></div>
    <section class="sp-list" id="list"><div class="ui-empty">Loading…</div></section>
    <p class="sp-foot">Need the full breakdown? <a href="nsc.html" id="fullLink">Open the detailed NSC report</a></p>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var all = [], shown = 30, f = { office: '', show: '', q: '', cls: '', withheld: false };
    var SHOW = {
      '': function () { return true; },
      d30: function (r) { return (r.delay || 0) > 30; },
      pole: function (r) { return r.pole; },
      nowo: function (r) { return !r.wo; }
    };

    function officeMatch(r) {
      if (!f.office) return true;
      var t = f.office.slice(0, 2), v = f.office.slice(2);
      return t === 'r:' ? r._region === v : t === 'd:' ? r._divn === v : r._supp === v;
    }
    function base() {
      var q = f.q.toLowerCase();
      return all.filter(function (r) {
        return officeMatch(r) && (!f.cls || r.cls === f.cls) && (!f.withheld || r.withheld) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1 || r.phone.indexOf(q) !== -1);
      });
    }

    function fillOffices() {
      var tree = {};
      all.forEach(function (r) { if (!r._region) return; var R = tree[r._region] || (tree[r._region] = {}); var D = R[r._divn || '—'] || (R[r._divn || '—'] = {}); if (r._supp) D[r._supp] = 1; });
      var sc = window.MzoScope && window.MzoScope.getScope();
      var h = sc && !sc.unscoped ? '' : '<option value="">Malda Zone</option>', nb = '   ';
      Object.keys(tree).sort().forEach(function (r) {
        h += '<option value="r:' + UI.esc(r) + '">' + UI.esc(r) + ' region</option>';
        Object.keys(tree[r]).sort().forEach(function (d) {
          h += '<option value="d:' + UI.esc(d) + '">' + nb + UI.esc(d) + ' division</option>';
          Object.keys(tree[r][d]).sort().forEach(function (c) { h += '<option value="c:' + UI.esc(c) + '">' + nb + nb + UI.esc(c) + '</option>'; });
        });
      });
      $('office').innerHTML = h;
      if (sc && !sc.unscoped) {
        var pick = sc.level === 'ccc' && sc.cccs && sc.cccs.size === 1 ? 'c:' + Array.from(sc.cccs)[0] : sc.level === 'division' && sc.divisions && sc.divisions.size === 1 ? 'd:' + Array.from(sc.divisions)[0] : '';
        if (pick && [].some.call($('office').options, function (o) { return o.value === pick; })) $('office').value = pick;
      }
      f.office = $('office').value;
    }
    function officeLabel() { var o = $('office').selectedOptions[0]; return o ? o.textContent.trim() : 'Malda Zone'; }

    function render() {
      var b = base(), view = b.filter(SHOW[f.show]);
      var d30 = b.filter(SHOW.d30), pole = b.filter(SHOW.pole);
      var med = function (rows) { var s = rows.map(function (r) { return r.delay || 0; }).sort(function (x, y) { return x - y; }); return s.length ? s[Math.floor(s.length / 2)] : 0; };
      $('nAll').textContent = UI.n(b.length); $('nAllS').textContent = b.length ? 'Typical wait ' + UI.age(med(b)) : ' ';
      $('nD30').textContent = UI.n(d30.length); $('nD30S').textContent = UI.pct(d30.length, b.length) + ' of waiting';
      $('nPole').textContent = UI.n(pole.length); $('nPoleS').textContent = UI.n(pole.reduce(function (a, r) { return a + r.poles; }, 0)) + ' poles in all';
      // Big numbers light up only for a real filter; the segmented control always shows the current one.
      [].forEach.call(document.querySelectorAll('.sp-num'), function (el) { var v = el.getAttribute('data-show'); el.setAttribute('aria-pressed', String(v !== '' && v === f.show)); });
      [].forEach.call(document.querySelectorAll('#show button'), function (el) { el.setAttribute('aria-pressed', String(el.getAttribute('data-show') === f.show)); });

      // chips for filters that came from typing
      var chips = [];
      if (f.q) chips.push(['q', 'Search: ' + f.q]);
      if (f.cls) chips.push(['cls', (NSCRows.CLASS[f.cls] || f.cls) + ' only']);
      if (f.withheld) chips.push(['withheld', 'Rescued from withheld']);
      $('chips').hidden = !chips.length;
      $('chips').innerHTML = chips.map(function (c) { return '<span class="sp-chip">' + UI.esc(c[1]) + '<button type="button" data-clear="' + c[0] + '" aria-label="Remove">' + UI.icon('x') + '</button></span>'; }).join('');

      view.sort(function (x, y) { return (y.delay || 0) - (x.delay || 0); });
      $('count').textContent = UI.n(view.length) + ' · ' + officeLabel();
      var rows = view.slice(0, shown).map(function (r, i) {
        var d = r.delay || 0, cls = d > 90 ? 'bad' : d > 30 ? 'warn' : '';
        var bits = [r.appl, '<em>' + UI.esc(r.clsLabel) + '</em>'];
        if (r.pole) bits.push('<em>Needs ' + (r.poles || '') + (r.poles === 1 ? ' pole' : ' poles') + '</em>');
        bits.push(r.wo ? UI.esc(r.agency ? UI.title(r.agency) : 'Work order issued') : '<em>No work order yet</em>');
        if (r.meter) bits.push('Meter allotted');
        return '<div class="sp-row" data-i="' + i + '"><div><div class="l1">' + UI.esc(r.name || 'Application ' + r.appl) + ' <span>· ' + UI.esc(r._supp) + '</span></div><div class="l2">' + bits.join(' · ') + '</div></div>' +
          '<div class="sp-wait ' + cls + '"><b>' + UI.n(d) + '</b><span>days<i class="sp-w"> waiting</i></span></div>' +
          '<a class="sp-call" href="' + (r.phone ? 'tel:' + UI.esc(r.phone) : '#') + '"' + (r.phone ? '' : ' aria-disabled="true" tabindex="-1"') + '>Call</a></div>';
      }).join('');
      $('list').innerHTML = (rows || '<div class="ui-empty">Nobody is waiting here.</div>') + (view.length > shown ? '<div class="sp-more"><button type="button" class="ui-btn" id="more">Show 30 more</button></div>' : '');
      window.__view = view;
      var q = []; if (f.office) { var t = f.office.slice(0, 2); q.push((t === 'r:' ? 'region' : t === 'd:' ? 'division' : 'ccc') + '=' + encodeURIComponent(f.office.slice(2))); }
      if (f.show === 'd30') q.push('kpi=delay30'); else if (f.show === 'pole') q.push('kpi=pole');
      $('fullLink').setAttribute('href', 'nsc.html' + (q.length ? '?' + q.join('&') : ''));
    }

    function detail(r) {
      UI.drawer(r.name || 'Application ' + r.appl, [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Application', r.appl], ['Consumer ID', r.con], ['Phone', r.phone], ['Address', r.address],
        ['Waiting', UI.n(r.delay || 0) + ' days since payment'], ['Paid on', r.paid ? UI.fmtDate(r.paid) : ''],
        ['Class', r.clsLabel + (r.area ? ' · ' + r.area : '')], ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'],
        ['Poles needed', r.pole ? String(r.poles || 'Yes') : 'None'], ['Work order', r.wo ? (r.won || 'Issued') + (r.woDate ? ' · ' + UI.fmtDate(r.woDate) : '') : 'Not issued yet'],
        ['Agency', r.agency ? UI.title(r.agency) : ''], ['Meter', r.meter], ['Withheld before', r.withheld ? (r.reason || 'Yes') : ''], ['Inspection note', r.comment]
      ], '', r.phone ? '<a class="ui-btn sm" href="tel:' + UI.esc(r.phone) + '">Call</a>' : '');
    }

    /* ---------- typing: the assistant sets this page's filters ---------- */
    var VIEW_TO = { over_30_days: { show: 'd30' }, pole_cases: { show: 'pole' }, rescued_from_withheld: { withheld: true }, industrial: { cls: 'I' }, commercial_three_phase: { cls: 'C' } };
    function applyFromTool(input) {
      var cand = [['c:', input.ccc], ['d:', input.division], ['r:', input.region]];
      for (var i = 0; i < cand.length; i++) {
        var v = String(cand[i][1] || '').replace(/\s+(region|division|ccc)$/i, '').trim();
        if (!v) continue;
        var opt = [].filter.call($('office').options, function (o) { return o.value.toLowerCase() === (cand[i][0] + v).toLowerCase(); })[0];
        if (opt && !$('office').disabled) { $('office').value = opt.value; f.office = opt.value; UI.mark($('office')); break; }
      }
      f.show = ''; f.cls = ''; f.withheld = false; f.q = '';
      var m = VIEW_TO[input.view] || {};
      if (m.show) f.show = m.show; if (m.cls) f.cls = m.cls; if (m.withheld) f.withheld = true;
      if (input.search) f.q = String(input.search).trim();
      shown = 30; render();
    }
    function answer(text, err) { $('answer').hidden = !text; $('answer').textContent = text || ''; $('answer').className = 'sp-answer' + (err ? ' err' : ''); }
    function askAssistant(text) {
      // Plain numbers or names → just search, no model call.
      if (/^\d{6,}$/.test(text)) { f.q = text; render(); answer(''); return; }
      var msgs = [{ role: 'user', content: 'I am on the Pending NSC page. Set its filters for this request with open_report (report "nsc"); then reply in one short sentence. Request: ' + text }];
      var btn = $('askForm').querySelector('button'); btn.disabled = true; answer('Working on it…');
      var round = 0;
      (function step() {
        fetch('/api/assistant', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: msgs, context: { scope: (window.MzoScope && !window.MzoScope.isUnscoped()) ? window.MzoScope.getScope().label : '' } }) })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res.status !== 'success') { answer(res.code === 'not_configured' ? 'Typing requests needs the assistant. Use the office list and buttons below instead.' : (res.message || 'Could not understand that. Try the buttons below.'), true); return done(); }
            msgs.push({ role: 'assistant', content: res.content });
            var text2 = (res.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join(' ').trim();
            var uses = (res.content || []).filter(function (b) { return b.type === 'tool_use'; });
            if (res.stop_reason !== 'tool_use' || !uses.length || ++round > 3) { answer(text2 || ''); return done(); }
            msgs.push({ role: 'user', content: uses.map(function (u) {
              if (u.name === 'open_report' && u.input && u.input.report === 'nsc') { applyFromTool(u.input); return { type: 'tool_result', tool_use_id: u.id, content: 'Filters applied on the page. ' + UI.n(window.__view.length) + ' applications shown.' }; }
              return { type: 'tool_result', tool_use_id: u.id, content: 'Not available on this page. Use open_report with report "nsc" to set filters.', is_error: true };
            }) });
            step();
          })
          .catch(function () { answer('Could not reach the server.', true); done(); });
      })();
      function done() { btn.disabled = false; }
    }

    /* ---------- events ---------- */
    $('office').addEventListener('change', function () { f.office = this.value; UI.mark(this); shown = 30; render(); });
    document.addEventListener('click', function (e) {
      var s = e.target.closest('[data-show]');
      if (s) { var v = s.getAttribute('data-show'); f.show = (s.classList.contains('sp-num') && f.show === v) ? '' : v; shown = 30; render(); return; }
      var c = e.target.closest('[data-clear]');
      if (c) { var k = c.getAttribute('data-clear'); if (k === 'withheld') f.withheld = false; else f[k] = ''; render(); return; }
      if (e.target.closest('#more')) { shown += 30; render(); return; }
      var call = e.target.closest('.sp-call');
      if (call) { if (call.getAttribute('aria-disabled')) e.preventDefault(); return; }
      var row = e.target.closest('.sp-row');
      if (row) detail(window.__view[+row.getAttribute('data-i')]);
    });
    $('askForm').addEventListener('submit', function (e) { e.preventDefault(); var t = $('ask').value.trim(); if (t) askAssistant(t); });

    UI.load('CACHE_NSC_v5', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('list').innerHTML = '<div class="ui-empty">Could not load the NSC data.</div>'; } return; }
      all = NSCRows.parse(text);
      $('meta').textContent = 'Paid applications not yet connected' + (all.asOn ? ' · as on ' + UI.fmtDate(all.asOn) : '');
      fillOffices();
      render();
    });
  });
  </script>
</body>
</html>
