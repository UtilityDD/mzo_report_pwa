<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
  <script src="/mzo_present.js" defer></script>
  <title>Puja Reports - MZO Reports</title>
  <meta name="theme-color" content="#0f172a" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0c1222;
      --card-bg-dark: #151c2e;
      --border-dark: rgba(255, 255, 255, 0.08);
      --text-primary-dark: #f8fafc;
      --text-secondary-dark: #94a3b8;

      --bg-light: #f4f6fb;
      --card-bg-light: #ffffff;
      --border-light: rgba(15, 23, 42, 0.08);
      --text-primary-light: #0f172a;
      --text-secondary-light: #64748b;

      --puja-red: #dc2626;
      --puja-gold: #f59e0b;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      transition: background-color 0.2s ease;
    }

    body.light-theme {
      background-color: var(--bg-light);
      color: var(--text-primary-light);
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 8px 12px;
    }

    /* Minimal Sticky Header (No back button, app has floating back button) */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(12, 18, 34, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-dark);
      margin-bottom: 10px;
    }

    body.light-theme .page-header {
      background: rgba(244, 246, 251, 0.92);
      border-bottom-color: var(--border-light);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Diya Header Icon SVG */
    .puja-header-svg {
      width: 36px;
      height: 36px;
      object-fit: contain;
      transform: translateY(-2px);
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.85));
    }

    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    /* Compact Selector Rows Grid */
    .reports-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .report-card-row {
      background: var(--card-bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    body.light-theme .report-card-row {
      background: var(--card-bg-light);
      border-color: var(--border-light);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .report-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .report-icon {
      font-size: 14px;
      color: var(--puja-gold);
      width: 18px;
      text-align: center;
    }

    .year-pills-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .year-pill {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-dark);
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-secondary-dark);
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    body.light-theme .year-pill {
      border-color: var(--border-light);
      background: #f1f5f9;
      color: var(--text-secondary-light);
    }

    .year-pill:hover {
      background: rgba(245, 158, 11, 0.2);
      color: var(--puja-gold);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .year-pill.active {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0c1222;
      font-weight: 800;
      border-color: #fbbf24;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    body.light-theme .year-pill.active {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
    }

    /* Viewer Container & Loader Overlay */
    .viewer-box {
      background: var(--card-bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body.light-theme .viewer-box {
      background: var(--card-bg-light);
      border-color: var(--border-light);
    }

    .viewer-loader {
      position: absolute;
      top: 38px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background: rgba(12, 18, 34, 0.88);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      color: var(--text-primary-dark);
      font-size: 13px;
      font-weight: 600;
    }

    body.light-theme .viewer-loader {
      background: rgba(244, 246, 251, 0.88);
      color: var(--text-primary-light);
    }

    .viewer-loader.active {
      opacity: 1;
      visibility: visible;
    }

    .v-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(245, 158, 11, 0.2);
      border-top-color: var(--puja-gold);
      border-radius: 50%;
      animation: vSpin 0.8s linear infinite;
    }

    @keyframes vSpin {
      to { transform: rotate(360deg); }
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.5);
      border-bottom: 1px solid var(--border-dark);
    }

    body.light-theme .viewer-bar {
      background: #f8fafc;
      border-bottom-color: var(--border-light);
    }

    .viewer-name {
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .v-action-btn {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border-dark);
      background: rgba(148, 163, 184, 0.1);
      color: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    body.light-theme .v-action-btn {
      border-color: var(--border-light);
      background: #f1f5f9;
    }

    .v-action-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      color: var(--puja-gold);
    }

    .viewer-frame {
      width: 100%;
      height: 74vh;
      min-height: 500px;
      border: none;
      background: #ffffff;
    }

    @media (max-width: 600px) {
      .reports-selector-grid {
        grid-template-columns: 1fr;
      }
      .viewer-frame {
        height: 68vh;
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <!-- Minimal Header (No top back button, no theme button) -->
  <header class="page-header">
    <div class="header-left">
      <img src="icons/diya-cropped.svg" alt="Diya" class="puja-header-svg" />
      <span class="header-title">Puja Reports</span>
    </div>
  </header>

  <div class="container">
    <!-- Compact Report Selectors Grid -->
    <div class="reports-selector-grid">
      <!-- Format-I -->
      <div class="report-card-row">
        <div class="report-name-wrap">
          <i class="fas fa-gift report-icon"></i>
          <span>Format-I</span>
        </div>
        <div class="year-pills-wrap">
          <button class="year-pill" 
                  data-url="https://docs.google.com/spreadsheets/d/1EGhWifLAYcnX6ZKVxPxtpxafdCrk_ueR67ObR9vDUM8/edit?gid=0#gid=0" 
                  data-name="Format-I 2025">2025</button>
          <button class="year-pill active" 
                  data-url="https://docs.google.com/spreadsheets/d/e/2PACX-1vT4MqI8y1hron59lymFqAcv-s1GUtZbQrTagrXfmNgsg16Pad1at-5BcLZTfcRP00d7k8SExO4FV21p/pubhtml" 
                  data-name="Format-I 2026">2026</button>
        </div>
      </div>

      <!-- Format-II -->
      <div class="report-card-row">
        <div class="report-name-wrap">
          <i class="fas fa-file-alt report-icon"></i>
          <span>Format-II</span>
        </div>
        <div class="year-pills-wrap">
          <button class="year-pill" 
                  data-url="https://docs.google.com/spreadsheets/d/1Jh5-C7HXNoByxaGvzb8kBku1ov_HqwDS_wID-sS85Pk/edit?gid=0#gid=0" 
                  data-name="Format-II 2025">2025</button>
          <button class="year-pill" 
                  data-url="https://docs.google.com/spreadsheets/d/e/2PACX-1vSe6UXoMQ0CIYX38GKifEdQqulDRgZgknQUOo2f1wm6AID9ezqSRzsR17SLIC3pjaMsnf0ISbEZQTYz/pubhtml" 
                  data-name="Format-II 2026">2026</button>
        </div>
      </div>

      <!-- Hourly Load -->
      <div class="report-card-row">
        <div class="report-name-wrap">
          <i class="fas fa-clock report-icon"></i>
          <span>Hourly Load</span>
        </div>
        <div class="year-pills-wrap">
          <button class="year-pill" 
                  data-url="https://docs.google.com/spreadsheets/d/1lkQlOv4sWzSTIOKAkem-oJmEvA7RNTLT0w-tsKi-_kI/edit?gid=0#gid=0" 
                  data-name="Hourly Load 2025">2025</button>
          <button class="year-pill" 
                  data-url="https://docs.google.com/spreadsheets/d/1-9z4sry_mHbVg5jDFn5kkOHRtWqXwjqVD00ysOoxT3I/edit?gid=1276887615#gid=1276887615" 
                  data-name="Hourly Load 2026">2026</button>
        </div>
      </div>
    </div>

    <!-- Live Report Viewer -->
    <div class="viewer-box">
      <div class="viewer-bar">
        <div class="viewer-name" id="viewerTitle">
          <i class="fas fa-table" style="color:var(--puja-gold);"></i>
          <span>Format-I 2026</span>
        </div>
        <div class="viewer-actions">
          <button class="v-action-btn" id="reloadFrameBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
          <a class="v-action-btn" id="dlXlsxBtn" href="#" target="_blank" download title="Download Excel (.xlsx)">
            <i class="fas fa-file-excel" style="color:#10b981;"></i> Excel
          </a>
          <a class="v-action-btn" id="dlPdfBtn" href="#" target="_blank" download title="Download PDF (.pdf)">
            <i class="fas fa-file-pdf" style="color:#ef4444;"></i> PDF
          </a>
          <a class="v-action-btn" id="openExtBtn" href="https://docs.google.com/spreadsheets/d/e/2PACX-1vT4MqI8y1hron59lymFqAcv-s1GUtZbQrTagrXfmNgsg16Pad1at-5BcLZTfcRP00d7k8SExO4FV21p/pubhtml" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-external-link-alt"></i> Sheet
          </a>
        </div>
      </div>
      
      <!-- Loading Spinner Overlay -->
      <div class="viewer-loader" id="viewerLoader">
        <div class="v-spinner"></div>
        <span>Loading Sheet Data...</span>
      </div>

      <iframe id="reportFrame" class="viewer-frame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT4MqI8y1hron59lymFqAcv-s1GUtZbQrTagrXfmNgsg16Pad1at-5BcLZTfcRP00d7k8SExO4FV21p/pubhtml?widget=false&chrome=false" title="Report Viewer"></iframe>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Inherit user theme from localStorage
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'light') {
        document.body.classList.add('light-theme');
      }

      // Helper to generate XLSX and PDF download links from Google Sheet URL
      function getDownloadUrls(rawUrl) {
        if (!rawUrl) return { xlsx: '#', pdf: '#' };
        const str = String(rawUrl).trim();
        
        // Published sheet (/spreadsheets/d/e/PUB_ID/...)
        if (str.includes('/spreadsheets/d/e/')) {
          const match = str.match(/\/spreadsheets\/d\/e\/([^/]+)/);
          if (match && match[1]) {
            const pubId = match[1];
            return {
              xlsx: `https://docs.google.com/spreadsheets/d/e/${pubId}/pub?output=xlsx`,
              pdf: `https://docs.google.com/spreadsheets/d/e/${pubId}/pub?output=pdf`
            };
          }
        }
        
        // Regular edit/preview sheet (/spreadsheets/d/ID/...)
        const match = str.match(/\/spreadsheets\/d\/([^/]+)/);
        if (match && match[1]) {
          const id = match[1];
          const gidMatch = str.match(/gid=([0-9]+)/);
          const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : '';
          return {
            xlsx: `https://docs.google.com/spreadsheets/d/${id}/export?format=xlsx${gidParam}`,
            pdf: `https://docs.google.com/spreadsheets/d/${id}/export?format=pdf${gidParam}`
          };
        }
        
        return { xlsx: str, pdf: str };
      }

      function updateDownloadButtons(rawUrl) {
        const dl = getDownloadUrls(rawUrl);
        const dlXlsxBtn = document.getElementById('dlXlsxBtn');
        const dlPdfBtn = document.getElementById('dlPdfBtn');
        if (dlXlsxBtn) dlXlsxBtn.href = dl.xlsx;
        if (dlPdfBtn) dlPdfBtn.href = dl.pdf;
      }

      // Helper to clean embed URLs to hide toolbars/widgets/headers
      function cleanEmbedUrl(rawUrl) {
        if (!rawUrl) return '';
        let url = String(rawUrl).trim();
        if (url.includes('/pubhtml')) {
          if (!url.includes('chrome=false')) {
            url += (url.includes('?') ? '&' : '?') + 'widget=false&chrome=false';
          }
        } else if (url.includes('/edit')) {
          url = url.replace(/\/edit(#|\?|$)/, '/preview?rm=minimal$1');
          if (!url.includes('rm=minimal')) {
            url += (url.includes('?') ? '&' : '?') + 'rm=minimal';
          }
        }
        return url;
      }

      // Year Pill Selection & Viewer Updating
      const pills = document.querySelectorAll('.year-pill');
      const reportFrame = document.getElementById('reportFrame');
      const viewerTitle = document.getElementById('viewerTitle').querySelector('span');
      const openExtBtn = document.getElementById('openExtBtn');
      const reloadFrameBtn = document.getElementById('reloadFrameBtn');
      const viewerLoader = document.getElementById('viewerLoader');
      let loaderTimeout = null;

      function showLoader() {
        if (!viewerLoader) return;
        viewerLoader.classList.add('active');
        clearTimeout(loaderTimeout);
        // Fallback safety timeout (5 seconds max)
        loaderTimeout = setTimeout(() => {
          hideLoader();
        }, 5000);
      }

      function hideLoader() {
        if (!viewerLoader) return;
        clearTimeout(loaderTimeout);
        viewerLoader.classList.remove('active');
      }

      reportFrame.addEventListener('load', () => {
        hideLoader();
      });

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');

          const rawUrl = pill.getAttribute('data-url');
          const name = pill.getAttribute('data-name');
          const embedUrl = cleanEmbedUrl(rawUrl);

          if (name) viewerTitle.textContent = name;
          if (embedUrl) {
            showLoader();
            reportFrame.src = embedUrl;
            openExtBtn.href = rawUrl;
            updateDownloadButtons(rawUrl);
          }
        });
      });

      reloadFrameBtn.addEventListener('click', () => {
        const curSrc = reportFrame.src;
        showLoader();
        reportFrame.src = '';
        setTimeout(() => { reportFrame.src = curSrc; }, 100);
      });

      // Load initial active pill URL
      const activePill = document.querySelector('.year-pill.active');
      if (activePill) {
        const initialRaw = activePill.getAttribute('data-url');
        reportFrame.src = cleanEmbedUrl(initialRaw);
        openExtBtn.href = initialRaw;
        updateDownloadButtons(initialRaw);
      }
    });
  </script>
</body>

</html>
