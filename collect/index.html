<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DISHA Collect</title>
  <script src="/mzo_theme.js?v=8"></script>
  <script src="/mzo_pwa_icons.js"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=11" />
  <script src="/auth.js" defer></script>
  <style>
    .col-page { max-width: 960px; margin: 0 auto; padding: 20px 20px 88px; }
    .col-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .col-head h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
    .col-head p { margin: 4px 0 0; font-size: 13px; color: var(--mzo-muted); max-width: 46ch; }
    .col-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
    .col-tab {
      border: 1px solid var(--mzo-border); background: var(--mzo-surface); color: var(--mzo-muted);
      font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    }
    .col-tab.on { background: var(--mzo-fill); color: var(--mzo-on-fill); border-color: transparent; }
    .col-list { display: grid; gap: 8px; }
    .col-card {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start;
      padding: 14px; border-radius: 12px; border: 1px solid var(--mzo-border); background: var(--mzo-surface);
      cursor: pointer; text-align: left; width: 100%; color: inherit; font: inherit;
    }
    .col-card.due { border-color: color-mix(in srgb, var(--mzo-warn-mark) 45%, var(--mzo-border)); }
    .col-card.locked { opacity: 0.85; }
    .col-card h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .col-card .meta { margin-top: 4px; font-size: 12.5px; color: var(--mzo-muted); }
    .col-card .stamp { margin-top: 6px; font-size: 11.5px; color: var(--mzo-faint); }
    .col-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; border: 0; cursor: default;
      font-size: 11.5px; font-weight: 650; padding: 4px 8px; border-radius: 999px;
      background: var(--mzo-hover-soft); color: var(--mzo-muted); font-variant-numeric: tabular-nums;
    }
    button.chip { cursor: pointer; }
    .chip.clock { color: var(--mzo-text); }
    .chip.late { background: color-mix(in srgb, var(--mzo-warn-mark) 18%, transparent); color: var(--mzo-warn-mark); }
    .chip.locked { background: color-mix(in srgb, #b91c1c 14%, transparent); color: #b91c1c; }
    .chip.ok { background: color-mix(in srgb, #15803d 14%, transparent); color: #15803d; }
    .col-empty {
      padding: 28px 16px; text-align: center; color: var(--mzo-muted); font-size: 14px;
      border: 1px dashed var(--mzo-border); border-radius: 12px;
    }
    .col-form, .col-panel {
      display: none; margin-bottom: 18px; padding: 14px; border-radius: 12px;
      border: 1px solid var(--mzo-border); background: var(--mzo-surface);
    }
    .col-form.on, .col-panel.on { display: block; }
    .col-form > label, .col-form .col-lab, .col-panel .col-lab {
      display: block; font-size: 12px; font-weight: 600; color: var(--mzo-muted); margin: 12px 0 4px;
    }
    .col-form > label:first-child { margin-top: 0; }
    .col-form input[type="text"], .col-form input[type="datetime-local"], .col-form textarea, .col-form select,
    .fill-field input, .fill-field textarea, .fill-field select {
      width: 100%; box-sizing: border-box; border: 1px solid var(--mzo-border); border-radius: 8px;
      background: var(--mzo-bg); color: var(--mzo-text); padding: 8px 10px; font: inherit; font-size: 13.5px;
    }
    .col-quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .col-quick button {
      border: 1px solid var(--mzo-border); background: var(--mzo-bg); color: var(--mzo-text);
      font-size: 12px; font-weight: 650; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    }
    .col-quick button:hover { background: var(--mzo-hover-soft); }
    .col-quick .hint { width: 100%; font-size: 11.5px; color: var(--mzo-faint); font-weight: 500; }
    .col-offices {
      max-height: 220px; overflow: auto; border: 1px solid var(--mzo-border); border-radius: 8px; padding: 6px;
    }
    .col-offices label {
      display: flex; align-items: center; gap: 8px; margin: 0; padding: 5px 6px; font-weight: 500; color: var(--mzo-text);
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .col-offices label:hover { background: var(--mzo-hover-soft); }
    .col-offices .tier {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--mzo-faint); margin-left: auto;
    }
    .col-form-actions, .col-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    .col-bar { margin-top: 0; margin-bottom: 12px; }
    .col-btn {
      border: 0; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 650; cursor: pointer;
      background: var(--mzo-fill); color: var(--mzo-on-fill);
    }
    .col-btn.ghost { background: transparent; color: var(--mzo-muted); border: 1px solid var(--mzo-border); }
    .col-btn.sm { padding: 5px 10px; font-size: 12px; }
    .col-btn.warn { background: #b45309; color: #fff; }
    .col-btn:disabled { opacity: 0.5; cursor: default; }
    .col-err { margin-top: 8px; font-size: 13px; color: #b91c1c; }
    .col-ok { margin-top: 8px; font-size: 13px; color: #15803d; }
    .col-builder {
      border: 1px solid var(--mzo-border); border-radius: 10px; background: var(--mzo-bg); padding: 10px;
    }
    .col-builder-help { font-size: 12.5px; color: var(--mzo-muted); margin: 0 0 10px; line-height: 1.4; }
    .col-field {
      border: 1px solid var(--mzo-border); border-radius: 8px; background: var(--mzo-surface);
      padding: 8px; margin: 0 0 8px;
    }
    .col-field-row {
      display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(110px, 0.8fr) auto auto;
      gap: 6px; align-items: center;
    }
    .col-field-row input, .col-field-row select {
      width: 100%; box-sizing: border-box; border: 1px solid var(--mzo-border); border-radius: 6px;
      background: var(--mzo-bg); color: var(--mzo-text); padding: 6px 8px; font: inherit; font-size: 13px;
    }
    .col-field .req {
      display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--mzo-muted); white-space: nowrap;
    }
    .col-field .kids { margin: 8px 0 0 12px; padding-left: 10px; border-left: 2px solid var(--mzo-border); }
    .col-field .kids-h {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11.5px; font-weight: 650; color: var(--mzo-muted); margin-bottom: 6px;
    }
    .col-preview {
      margin-top: 10px; padding: 10px; border-radius: 8px; border: 1px dashed var(--mzo-border);
      font-size: 12.5px; color: var(--mzo-muted);
    }
    .col-preview strong { color: var(--mzo-text); }
    .col-preview ul { margin: 4px 0 0; padding-left: 18px; }
    .fill-group {
      border: 1px solid var(--mzo-border); border-radius: 10px; padding: 10px; margin: 0 0 10px; background: var(--mzo-bg);
    }
    .fill-group-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .fill-group-h strong { font-size: 13.5px; }
    .fill-item {
      border: 1px solid var(--mzo-border); border-radius: 8px; padding: 10px; margin: 0 0 8px; background: var(--mzo-surface);
    }
    .fill-item-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--mzo-muted); font-weight: 650; }
    .fill-field { margin: 0 0 10px; }
    .fill-field label { display: block; font-size: 12px; font-weight: 600; color: var(--mzo-muted); margin-bottom: 4px; }
    .fill-field .chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--mzo-text); }
    .tree-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center;
      padding: 10px 12px; border-top: 1px solid var(--mzo-border);
    }
    .tree-row:first-child { border-top: 0; }
    .tree-box { border: 1px solid var(--mzo-border); border-radius: 10px; overflow: hidden; background: var(--mzo-bg); }
    .view-only #listWrap { display: none; }
    @media (max-width: 900px) {
      .col-page { padding: 14px 12px 88px; }
      .col-card { grid-template-columns: 1fr; }
      .col-chips { justify-content: flex-start; }
      .col-field-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="ui-page col-page" id="app">
    <header class="col-head" id="mainHead">
      <div>
        <h1>DISHA Collect</h1>
        <p>Reports requested from your office. Shared draft per office — last writer is stamped.</p>
      </div>
      <button type="button" class="col-btn" id="newBtn" hidden>+ New request</button>
    </header>

    <form class="col-form" id="newForm" autocomplete="off">
      <label for="fTitle">Title</label>
      <input id="fTitle" type="text" required maxlength="200" placeholder="e.g. Tribal villages to electrify" />
      <label for="fDue">Submit by</label>
      <input id="fDue" type="datetime-local" required />
      <label for="fExt">Extend until (optional)</label>
      <input id="fExt" type="datetime-local" />
      <span class="col-lab">Offices</span>
      <div class="col-quick" id="officeQuick">
        <button type="button" data-pick="all">All</button>
        <button type="button" data-pick="none">Clear</button>
        <button type="button" data-pick="region">All RM</button>
        <button type="button" data-pick="division">All DM</button>
        <button type="button" data-pick="ccc">All SM</button>
        <span class="hint">RM = Region · DM = Division · SM = CCC / station</span>
      </div>
      <div class="col-offices" id="fOffices"></div>
      <span class="col-lab">Report format</span>
      <div class="col-builder">
        <p class="col-builder-help">Build the form assignees will fill. Use <b>List</b> for repeating groups (Block → Village → Para → Scheme).</p>
        <div id="schemaRoot"></div>
        <button type="button" class="col-btn ghost sm" id="addRootField" style="margin-top:4px">+ Add field</button>
        <div class="col-preview" id="schemaPreview"></div>
      </div>
      <div class="col-form-actions">
        <button type="submit" class="col-btn" id="fSave">Create request</button>
        <button type="button" class="col-btn ghost" id="fCancel">Cancel</button>
      </div>
      <div class="col-err" id="fErr" hidden></div>
    </form>

    <div id="listWrap">
      <div class="col-tabs" role="tablist">
        <button type="button" class="col-tab on" data-tab="inbox" role="tab">Inbox</button>
        <button type="button" class="col-tab" data-tab="mine" role="tab" id="mineTab" hidden>My requests</button>
      </div>
      <div class="col-list" id="list"></div>
    </div>

    <section class="col-panel" id="fillPanel">
      <div class="col-bar">
        <button type="button" class="col-btn ghost sm" id="fillBack">← Back</button>
        <div class="col-chips" id="fillChips"></div>
      </div>
      <h2 id="fillTitle" style="margin:0 0 4px;font-size:18px"></h2>
      <p class="meta" id="fillMeta" style="margin:0 0 12px;color:var(--mzo-muted);font-size:13px"></p>
      <div id="fillForm"></div>
      <div class="col-form-actions">
        <button type="button" class="col-btn" id="fillSave">Save draft</button>
        <button type="button" class="col-btn warn" id="fillSubmit">Submit</button>
      </div>
      <div class="col-err" id="fillErr" hidden></div>
      <div class="col-ok" id="fillOk" hidden></div>
    </section>

    <section class="col-panel" id="detailPanel">
      <div class="col-bar">
        <button type="button" class="col-btn ghost sm" id="detailBack">← Back</button>
        <button type="button" class="col-btn ghost sm" id="detailExport">Export JSON</button>
        <button type="button" class="col-btn ghost sm" id="detailExtend">Extend</button>
      </div>
      <h2 id="detailTitle" style="margin:0 0 4px;font-size:18px"></h2>
      <p class="meta" id="detailMeta" style="margin:0 0 12px;color:var(--mzo-muted);font-size:13px"></p>
      <div class="col-chips" id="detailChips" style="margin-bottom:12px"></div>
      <span class="col-lab">Offices</span>
      <div class="tree-box" id="detailTree"></div>
      <span class="col-lab">Add offices</span>
      <div class="col-quick" id="detailQuick">
        <button type="button" data-pick="all">All</button>
        <button type="button" data-pick="none">Clear</button>
        <button type="button" data-pick="region">All RM</button>
        <button type="button" data-pick="division">All DM</button>
        <button type="button" data-pick="ccc">All SM</button>
      </div>
      <div class="col-offices" id="detailOffices"></div>
      <div class="col-form-actions">
        <button type="button" class="col-btn sm" id="detailAdd">Add selected</button>
        <button type="button" class="col-btn ghost sm" id="detailRemove">Remove checked pending</button>
      </div>
      <div class="col-err" id="detailErr" hidden></div>
    </section>
  </main>

  <script src="/collect/collect_app.js?v=1"></script>
</body>
</html>
