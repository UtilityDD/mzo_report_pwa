<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Power news · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <style>
    .ui-page { max-width: 920px; }
    .day { padding: 12px 16px 6px; font-size: 12px; font-weight: 500; color: var(--mzo-muted); border-top: 1px solid var(--mzo-border); }
    .day:first-child { border-top: 0; }
    .art { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 12px 12px 16px; }
    .art + .art { border-top: 1px solid var(--mzo-border); }
    .art:hover { background: var(--mzo-row-hover); }
    .art a.t { color: var(--mzo-text); text-decoration: none; font-weight: 500; font-size: 14px; line-height: 1.4; }
    .art a.t:hover { text-decoration: underline; text-underline-offset: 2px; }
    .art .m { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--mzo-muted); }
    .art .m .sep::before { content: "·"; }
    .art p { margin: 4px 0 0; font-size: 12.5px; color: var(--mzo-text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .art .acts { display: flex; align-items: flex-start; gap: 2px; }
    #seg { flex-wrap: wrap; }
    #seg button span { margin-left: 5px; color: var(--mzo-faint); font-variant-numeric: tabular-nums; }
    #seg button[aria-pressed="true"] span { color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Power news</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn" id="syncBtn"><svg class="ui-i"><use href="#ui-refresh"/></svg>Fetch latest</button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search" style="max-width:none"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search headlines, sources or topics" autocomplete="off" /></label>
    </div>
    <div class="ui-filters"><div class="ui-seg" id="seg" role="group" aria-label="Section"></div></div>

    <section class="ui-panel">
      <div id="list"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CACHE = 'mzo_merged_news_v2';
    var SECTIONS = [['all', 'All'], ['state', 'State & Malda'], ['districts', 'District media'], ['bangla', 'Bangla'], ['national', 'National grid'], ['accidents', 'Safety']];
    var LABEL = { state: 'State & Malda', districts: 'District media', bangla: 'Bangla', national: 'National grid', general: 'Power sector' };
    var TOPICS = [
      [/wbsedcl|wbsetcl/i, 'WBSEDCL'], [/solar|photovoltaic/i, 'Solar'], [/tariff|power cost|electricity bill|billing/i, 'Tariff'],
      [/substation|transformer/i, 'Substation'], [/smart meter|prepaid meter/i, 'Smart meter'], [/outage|load shedding|blackout|tripping|power cut/i, 'Outage'],
      [/renewable|wind energy|clean energy|green energy/i, 'Renewables'], [/ntpc|coal|thermal power/i, 'Thermal'], [/transmission|national grid|pgcil/i, 'Transmission'],
      [/malda|raiganj|balurghat|dinajpur/i, 'Malda Zone']
    ];
    var ACCIDENT = ['electrocution', 'electrocuted', 'electrical accident', 'short circuit', 'electric shock', 'transformer blast', 'electric fire', 'power line death', 'high voltage death', 'live wire death',
      'বিদ্যুৎস্পৃষ্ট', 'শর্ট সার্কিট', 'বিদ্যুৎ দুর্ঘটনা', 'বিদ্যুৎস্পর্শ', 'বিদ্যুৎস্পৃষ্টে মৃত্যু'];
    var all = [], section = 'all';

    function clean(item) {
      var title = String(item.title || '').trim(), source = String(item.source || '').trim();
      if (!source && title.indexOf(' - ') !== -1) { var i = title.lastIndexOf(' - '); source = title.slice(i + 3).trim(); title = title.slice(0, i).trim(); }
      else if (source && title.slice(-(source.length + 3)) === ' - ' + source) title = title.slice(0, -(source.length + 3)).trim();
      var desc = String(item.description || '').trim();
      if (desc.indexOf('<a ') !== -1 || desc.indexOf('&lt;a') !== -1 || desc.toLowerCase() === title.toLowerCase()) desc = '';
      var text = (title + ' ' + desc).toLowerCase();
      var cat = item.category === 'english' ? 'state' : (item.category || 'general');
      return {
        title: title || 'Power sector update', source: source || 'News source', link: /^https?:\/\//i.test(item.link || '') ? item.link : '#', pubDate: item.pubDate || '', description: desc,
        category: cat, isAccident: !!item.isAccident || ACCIDENT.some(function (k) { return text.indexOf(k) !== -1; }),
        tags: TOPICS.filter(function (t) { return t[0].test(title); }).slice(0, 2).map(function (t) { return t[1]; })
      };
    }

    function ingest(items, save) {
      var seen = {}, out = [];
      items.forEach(function (raw) { var a = clean(raw), k = (a.link + '::' + a.title).toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(a); } });
      out.sort(function (a, b) { return new Date(b.pubDate || 0) - new Date(a.pubDate || 0); });
      all = out;
      if (save) { try { localStorage.setItem(CACHE, JSON.stringify(out)); } catch (e) {} }
      render();
    }

    function rel(d) {
      var t = new Date(d); if (isNaN(t)) return '';
      var m = Math.floor((Date.now() - t) / 6e4);
      if (m < 1) return 'Just now'; if (m < 60) return m + 'm ago';
      var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
      return t.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    }
    function dayLabel(d) {
      var t = new Date(d); if (isNaN(t)) return 'Earlier';
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var x = new Date(t); x.setHours(0, 0, 0, 0);
      var diff = Math.round((today - x) / 864e5);
      return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : UI.fmtDate(t);
    }

    function render() {
      var q = $('q').value.trim().toLowerCase();
      var counts = { all: all.length, accidents: 0 };
      all.forEach(function (a) { counts[a.category] = (counts[a.category] || 0) + 1; if (a.isAccident) counts.accidents++; });
      $('seg').innerHTML = SECTIONS.filter(function (s) { return s[0] === 'all' || s[0] === 'accidents' || counts[s[0]]; }).map(function (s) {
        return '<button type="button" data-s="' + s[0] + '" aria-pressed="' + (section === s[0]) + '">' + s[1] + '<span>' + (counts[s[0]] || 0) + '</span></button>';
      }).join('');
      var list = all.filter(function (a) {
        if (section === 'accidents' ? !a.isAccident : (section !== 'all' && a.category !== section)) return false;
        return !q || (a.title + ' ' + a.source + ' ' + (a.tags || []).join(' ')).toLowerCase().indexOf(q) !== -1;
      });
      if (!list.length) {
        $('list').innerHTML = '<div class="ui-empty">' + (q ? 'No headlines match “' + UI.esc($('q').value.trim()) + '”.' : section === 'accidents' ? 'No electrical accidents in the current feeds.' : 'Nothing in this section yet.') + '</div>';
        return;
      }
      var h = '', last = '';
      list.forEach(function (a) {
        var d = dayLabel(a.pubDate);
        if (d !== last) { h += '<div class="day">' + UI.esc(d) + '</div>'; last = d; }
        var meta = ['<span>' + UI.esc(a.source) + '</span>', a.pubDate ? '<span class="sep"></span><span>' + UI.esc(rel(a.pubDate)) + '</span>' : '', '<span class="sep"></span><span>' + UI.esc(LABEL[a.category] || 'Power sector') + '</span>']
          .concat((a.tags || []).map(function (t) { return '<span class="sep"></span><span>' + UI.esc(t) + '</span>'; })).join('');
        h += '<article class="art"><div><a class="t" href="' + UI.esc(a.link) + '" target="_blank" rel="noopener noreferrer">' + UI.esc(a.title) + '</a>' +
          '<div class="m">' + (a.isAccident ? '<span class="ui-badge bad">Safety</span>' : '') + meta + '</div>' +
          (a.description ? '<p>' + UI.esc(a.description) + '</p>' : '') + '</div>' +
          '<div class="acts"><button type="button" class="ui-btn icon sm ghost" data-copy="' + UI.esc(a.link) + '" title="Copy link" aria-label="Copy link"><svg class="ui-i"><use href="#ui-copy"/></svg></button></div></article>';
      });
      $('list').innerHTML = h;
    }

    function load(force) {
      var b = $('syncBtn'); b.classList.add('spin'); b.disabled = true;
      fetch(force ? '/api/news?force=1' : '/api/news')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d.status === 'ok' && Array.isArray(d.items)) {
            ingest(d.items, true);
            var t = new Date();
            $('meta').textContent = UI.n(all.length) + ' stories · Updated ' + t.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
            if (force) UI.toast('Feeds refreshed');
            return;
          }
          throw new Error('bad');
        })
        .catch(function () {
          var cached = null;
          try { cached = JSON.parse(localStorage.getItem(CACHE) || localStorage.getItem('mzo_merged_news') || 'null'); } catch (e) {}
          if (Array.isArray(cached) && cached.length) { ingest(cached, false); $('meta').textContent = UI.n(all.length) + ' stories · Offline copy'; }
          else if (!all.length) { $('meta').textContent = 'Could not reach the news feeds'; $('list').innerHTML = '<div class="ui-empty">Could not reach the news feeds. <button type="button" class="ui-btn sm" id="retry">Retry</button></div>'; }
        })
        .then(function () { b.classList.remove('spin'); b.disabled = false; });
    }

    $('seg').addEventListener('click', function (e) { var bt = e.target.closest('button'); if (bt) { section = bt.getAttribute('data-s'); render(); } });
    $('q').addEventListener('input', UI.debounce(render, 120));
    $('list').addEventListener('click', function (e) {
      var c = e.target.closest('[data-copy]');
      if (c) { UI.copy(c.getAttribute('data-copy')).then(function () { UI.toast('Link copied'); }); return; }
      if (e.target.id === 'retry') load(true);
    });
    $('syncBtn').addEventListener('click', function () { load(true); });

    // Paint the last copy first, then refresh.
    try { var c = JSON.parse(localStorage.getItem(CACHE) || 'null'); if (Array.isArray(c) && c.length) { all = c; render(); $('meta').textContent = UI.n(all.length) + ' stories'; } } catch (e) {}
    load(false);
  });
  </script>
</body>
</html>
