<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICDS connections · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>#projectHist .row { grid-template-columns: 150px minmax(0, 1fr) 56px; }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>ICDS connections</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="prio" role="group" aria-label="Priority">
          <button type="button" data-p="" aria-pressed="true">All</button>
          <button type="button" data-p="A+" aria-pressed="false">A+</button>
          <button type="button" data-p="A" aria-pressed="false">A</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Centre, AWC code or project" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="District"><option value="">All districts</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Centres without supply</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="nocc"><div class="k"><span class="ui-dot warn"></span>No CCC yet</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="mapped"><div class="k"><span class="ui-dot"></span>With CCC</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="meter"><div class="k"><span class="ui-dot ok"></span>Meter given</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office <small id="officeNote"></small></h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">District</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Poles required</h2></div>
          <div class="ui-panel-b"><div id="poleHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Top projects</h2></div>
          <div class="ui-panel-b"><div id="projectHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Centres <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var STATUS = { meter: { label: 'Meter given', cls: 'ok' }, mapped: { label: 'With CCC', cls: '' }, nocc: { label: 'No CCC yet', cls: 'warn' } };
    // Login scope uses zone region names; this sheet is by district.
    var DISTRICT_OF = { Malda: 'Malda', Raiganj: 'Uttar Dinajpur', Balurghat: 'Dakshin Dinajpur' };
    var POLES = [
      { key: 'p0', label: 'None' }, { key: 'p1', label: '1 pole' }, { key: 'p2', label: '2 poles' },
      { key: 'p3', label: '3 or more' }, { key: 'pn', label: 'Not assessed' }
    ];
    var all = [], texts = {}, f = { q: '', prio: '', status: '', pole: '', project: '' }, level = 'region', scope = null, firstPaint = true;

    function blankish(v) { return !String(v == null ? '' : v).trim() || /^(0|na|n\.a\.?|nil|n\/a|-)$/i.test(String(v).trim()); }
    function district(raw) {
      var u = String(raw || '').trim().toUpperCase();
      if (u.indexOf('DAKSHIN') !== -1 || u.indexOf('SOUTH') !== -1 || u === 'DD' || u.indexOf('BALURGHAT') !== -1) return 'Dakshin Dinajpur';
      if (u.indexOf('MALDA') !== -1) return 'Malda';
      if (u.indexOf('UTTAR') !== -1 || u.indexOf('NORTH') !== -1 || u === 'UD' || u.indexOf('RAIGANJ') !== -1) return 'Uttar Dinajpur';
      return UI.title(raw) || '';
    }
    function cccCode(raw) {
      var s = String(raw || '').trim().replace(/\.0+$/, '');
      if (s === '66111609') return '6611109';
      if (s === '66131101') return '6613101';
      var m = s.match(/\b(66[123]\d{4})\b/);
      if (m) return m[1];
      var d = s.replace(/\D/g, '');
      return d.length >= 7 && /^66[123]\d{4}$/.test(d.slice(0, 7)) ? d.slice(0, 7) : '';
    }
    // Cell M2 (UPDATE DATE, dd.mm.yyyy) is the sheet's "as on" date.
    function asOnOf(rows) {
      var raw = String((rows[0] || {})['UPDATE DATE'] || '').trim();
      var m = raw.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (!m) return '';
      var pad = function (x) { return String(x).padStart(2, '0'); }, y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      return pad(+m[1]) + '/' + pad(+m[2]) + '/' + y;
    }

    function ingest(list, prio) {
      return list.map(function (d) {
        var code = cccCode(d['CCC CODE']), o = code ? UI.office(code) : null, mapped = !!(o && o.ccc);
        var meter = blankish(d['METER NUMBER']) ? '' : String(d['METER NUMBER']).trim();
        var poles = String(d['NO OF POLE REQUIRED'] || '').trim(), pn = parseInt(poles, 10);
        var r = {
          prio: prio, awc: UI.title(d['AWC NAME']), awcCode: String(d['AWC CODE'] || '').trim(), project: UI.title(d.PROJECT),
          dist: district(d.DISTRICT), appl: blankish(d.APPL_NO) ? '' : String(d.APPL_NO).trim(), ownership: UI.title(d['BUILDING OWNERSHIP']),
          poles: poles, poleKey: isNaN(pn) ? 'pn' : pn >= 3 ? 'p3' : 'p' + pn, poleDone: String(d['POLE ERECTION COMPLETED(Y/N)'] || '').trim(),
          meter: meter, meterDate: d['METER INSTALL DATE'], remarks: String(d.REMARKS || '').trim(), code: code,
          _region: district(d.DISTRICT), _divn: mapped ? o.division : '', _supp: mapped ? o.ccc : '', CCC_CODE: mapped ? code : ''
        };
        r.st = meter ? 'meter' : mapped ? 'mapped' : 'nocc';
        r.search = [r.awc, r.awcCode, r.project, r.dist, r._divn, r._supp, r.appl].join(' ').toLowerCase();
        return r;
      }).filter(function (r) { return r.awc || r.awcCode; });
    }

    function combine() {
      // Parse each sheet once: ingest() and the "as on" cell both read it.
      var ap = texts.ap ? UI.csv(texts.ap) : [], a = texts.a ? UI.csv(texts.a) : [];
      var rows = ingest(ap, 'A+').concat(ingest(a, 'A'));
      if (window.MzoScope) { var scoped = window.MzoScope.filterRows(rows); if (scoped.length || !rows.length) rows = scoped; }
      all = rows;
      var asOn = asOnOf(ap) || asOnOf(a);
      if (asOn) { try { localStorage.setItem('mzo_icds_as_on', asOn); } catch (e) {} }
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn.split('/').reverse().join('-')) + ' · ' : '') + UI.n(all.length) + ' anganwadi centres';
      fillFilters();
      if (firstPaint) {
        firstPaint = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        tabs();
      }
      render();
    }

    function fillFilters() {
      UI.offices(all, 'All districts');
      if (!scope) {
        scope = UI.lockScope();
        var rf = $('regionFilter');
        if (rf.disabled && DISTRICT_OF[rf.value]) { var dv = DISTRICT_OF[rf.value]; rf.innerHTML = '<option value="' + dv + '">' + dv + '</option>'; rf.value = dv; }
      }
    }

    function base() {
      // Locked (login-scope) selects are already applied by MzoScope.filterRows; this sheet's district can differ from the CCC's region.
      var val = function (id) { return $(id).disabled ? '' : $(id).value; };
      var q = f.q.toLowerCase(), reg = val('regionFilter'), div = val('divisionFilter'), ccc = val('cccFilter');
      return all.filter(function (r) {
        return (!f.prio || r.prio === f.prio) && (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!q || r.search.indexOf(q) !== -1);
      });
    }
    function matchStatus(r, k) { return !k || (k === 'mapped' ? r.st !== 'nocc' : r.st === k); }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return matchStatus(r, f.status) && (!f.pole || r.poleKey === f.pole) && (!f.project || r.project === f.project); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = b.filter(function (r) { return matchStatus(r, k); }).length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = !k ? UI.n(b.filter(function (r) { return r.prio === 'A+'; }).length) + ' A+ · ' + UI.n(b.filter(function (r) { return r.prio === 'A'; }).length) + ' A'
          : UI.pct(c, b.length) + ' of centres';
        el.setAttribute('aria-pressed', String(f.status === k));
      });

      // Division and CCC count only centres with a mapped CCC code.
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      var rows = level === 'region' ? view : view.filter(function (r) { return r._supp; });
      rows.forEach(function (r) {
        var name = r[key] || 'Unknown';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, aplus: 0, mapped: 0, meter: 0 });
        g.n++; if (r.prio === 'A+') g.aplus++; if (r.st !== 'nocc') g.mapped++; if (r.st === 'meter') g.meter++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      $('officeNote').textContent = level === 'region' ? '' : 'Centres with a CCC';
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: level === 'region' ? 'No centres for these filters.' : 'No centres with a CCC code here yet.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'District', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Centres', num: true, fmt: UI.n },
          { key: 'aplus', label: 'A+', num: true, fmt: UI.n, hideSm: true },
          { key: 'meter', label: 'Meter given', num: true, fmt: UI.n },
          { key: 'rate', label: 'With CCC', hideSm: true, sortVal: function (g) { return g.n ? g.mapped / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.mapped, g.n, UI.pct(g.mapped, g.n)); }, width: '26%' }
        ],
        foot: list.length > 1 ? { n: rows.length, aplus: rows.filter(function (r) { return r.prio === 'A+'; }).length, meter: rows.filter(function (r) { return r.st === 'meter'; }).length, mapped: rows.filter(function (r) { return r.st !== 'nocc'; }).length, rate: 0 } : null,
        onRow: function (g) { drill(g.name); }
      });

      var hb = b.filter(function (r) { return matchStatus(r, f.status) && (!f.project || r.project === f.project); });
      UI.hist('poleHist', POLES.map(function (p) { return { key: p.key, label: p.label, value: hb.filter(function (r) { return r.poleKey === p.key; }).length }; }),
        { active: f.pole, onClick: function (row) { f.pole = f.pole === row.key ? '' : row.key; render(); } });
      var pj = {};
      b.filter(function (r) { return matchStatus(r, f.status) && (!f.pole || r.poleKey === f.pole); }).forEach(function (r) { if (r.project) pj[r.project] = (pj[r.project] || 0) + 1; });
      UI.hist('projectHist', Object.keys(pj).sort(function (x, y) { return pj[y] - pj[x]; }).slice(0, 7).map(function (p) { return { key: p, label: p, value: pj[p] }; }),
        { active: f.project, onClick: function (row) { f.project = f.project === row.key ? '' : row.key; render(); } });

      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'st', dir: 'asc' }, limit: 50, resetPage: true, empty: 'No centres match these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.prio || f.status || f.pole || f.project || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
      window.__view = view;
    }

    var ORDER = { nocc: 0, mapped: 1, meter: 2 };
    var COLS = [
      { key: 'awc', label: 'Centre', cls: 'wrap', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.awcCode) + '</span>'; } },
      { key: 'project', label: 'Project', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return v ? UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>' : '<span class="ui-muted">—</span><span class="sub">' + UI.esc(r.dist) + '</span>'; }, csv: function (r) { return r._supp; } },
      { key: 'prio', label: 'Priority', fmt: function (v) { return '<span class="ui-badge">' + UI.esc(v) + '</span>'; } },
      { key: 'poles', label: 'Poles', num: true, hideSm: true, sortVal: function (r) { var n = parseInt(r.poles, 10); return isNaN(n) ? -1 : n; }, fmt: function (v) { return v && !isNaN(parseInt(v, 10)) ? UI.esc(v) : '<span class="ui-muted">—</span>'; } },
      { key: 'st', label: 'Status', sortVal: function (r) { return ORDER[r.st]; }, fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer(r.awc || 'Centre ' + r.awcCode, [r.prio, STATUS[r.st].label, r._supp || r.dist].filter(Boolean).join(' · '), [
        ['AWC code', r.awcCode], ['Project', r.project], ['District', r.dist], ['CCC', r._supp], ['Division', r._divn], ['CCC code', r.code],
        ['Building', r.ownership], ['Application', r.appl], ['Poles required', r.poles], ['Pole erection', r.poleDone],
        ['Meter number', r.meter], ['Meter installed', r.meterDate && !UI.blank(r.meterDate) ? UI.fmtDate(r.meterDate) : ''], ['Remarks', r.remarks]
      ]);
    }

    function tabs() { [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); }); }
    function setLevel(l) { level = l; tabs(); render(); }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); }); }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }
    function drill(name) {
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); level = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); level = 'ccc'; }
      else set('cccFilter', $('cccFilter').value === name ? '' : name);
      fillFilters(); markAll(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); markAll(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('prio').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      f.prio = b.getAttribute('data-p');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.status = f.status === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.status = ''; f.pole = ''; f.project = ''; f.prio = ''; $('q').value = '';
      [].forEach.call(document.querySelectorAll('#prio button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-p') === '')); });
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { set(id, ''); });
      fillFilters(); markAll(); render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('icds-connections.csv', [{ key: 'awc', label: 'Centre' }, { key: 'awcCode', label: 'AWC code' }, { key: 'project', label: 'Project' }, { key: 'dist', label: 'District' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'prio', label: 'Priority' }, { key: 'appl', label: 'Application' }, { key: 'poles', label: 'Poles required' }, { key: 'meter', label: 'Meter number' }, COLS[5]], window.__view || []);
    });
    function reload(btn) {
      if (btn) btn.classList.add('spin');
      var hub = window.mzoDataHub;
      return Promise.all(['CACHE_ICDS_APLUS', 'CACHE_ICDS_A'].map(function (k) { return Promise.resolve(hub.waitForDataset(k, { forceCheck: true })).catch(function () {}); }))
        .then(function () { return Promise.all([hub._peek('CACHE_ICDS_APLUS'), hub._peek('CACHE_ICDS_A')]); })
        .then(function (t) { if (t[0] || t[1]) { texts.ap = t[0] || texts.ap; texts.a = t[1] || texts.a; combine(); } })
        .then(function () { if (btn) btn.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { reload(this); });

    // Same-day sheet edits matter here: always check the version (forceCheck).
    var failed = 0;
    [['CACHE_ICDS_APLUS', 'ap'], ['CACHE_ICDS_A', 'a']].forEach(function (k) {
      UI.load(k[0], function (text, info) {
        if (!text) {
          if (info && info.error && ++failed === 2 && !all.length) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; }
          return;
        }
        texts[k[1]] = text; combine();
      }, { forceCheck: true });
    });
  });
  </script>
</body>
</html>
