<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending NSC (draft C) · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <script src="/lib/nsc_rows.js?v=2" defer></script>
  <style>
    .cl-draft { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-left: 6px; border-radius: 6px; font-size: 11.5px; font-weight: 500; vertical-align: 3px; background: var(--mzo-accent-soft); color: var(--mzo-accent); }
    .ui-head { align-items: center; }

    /* Content */
    .cl-kpis .ui-stat { padding: 13px 14px 14px; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .cl-notes { margin: 0; padding: 0 0 8px; list-style: none; }
    .cl-notes li { padding: 10px 0; border-top: 1px solid var(--mzo-border); font-size: 13px; }
    .cl-notes li small { display: block; margin-top: 3px; color: var(--mzo-muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Pending NSC<span class="ui-badge ui-date" id="asOn">…</span><span class="cl-draft">Draft C</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <a class="ui-btn" id="uploadBtn" href="nsc/upload.html" hidden><svg class="ui-i"><use href="#ui-upload"/></svg>Upload</a>
        <button type="button" class="ui-btn" id="topBtn">Top delayed</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search by application, name or phone" title="Application no., name or phone" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
          <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
          <span class="ui-select"><select id="agencyFilter" aria-label="Agency"><option value="">All agencies</option></select></span>
        </div>
        <div class="ui-side-sec"><div aria-label="Agriculture" id="fAgri"></div></div>
        <div class="ui-side-sec"><div aria-label="Poles" id="fPole"></div></div>
        <div class="ui-side-sec"><div aria-label="Work order" id="fWo"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Delay since payment">
            <button type="button" role="tab" data-pane="fDelay" aria-pressed="true" aria-selected="true">Delay range</button>
            <button type="button" role="tab" data-pane="fDelay2" aria-pressed="false" aria-selected="false">Cumulative</button>
          </div>
          <div aria-label="Delay range" id="fDelay"></div>
          <div aria-label="Delay, cumulative" id="fDelay2" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats cl-kpis" id="kpis" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Total pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="nonpole"><div class="k">Non-pole</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="pole"><div class="k">Pole</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="withheld"><div class="k" title="Rescued from withheld">From withheld</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="ind"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="procb"><div class="k">Proc-B</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="com3"><div class="k">Com. 3-phase</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>Detailed analysis</h2>
            <div class="ui-actions">
              <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
              <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
            </div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var DELAY2 = [
      ['Within 3 days', [1]], ['More than 3 days', [2, 3, 4, 5, 6, 7, 8]], ['More than 7 days', [3, 4, 5, 6, 7, 8]], ['More than 15 days', [4, 5, 6, 7, 8]],
      ['More than 1 month', [5, 6, 7, 8]], ['More than 2 months', [6, 7, 8]], ['More than 6 months', [7, 8]], ['More than 1 year', [8]]
    ];
    var KPI = {
      '': function () { return true; },
      nonpole: function (r) { return !r.pole; }, pole: function (r) { return r.pole; }, withheld: function (r) { return r.withheld; },
      ind: function (r) { return r.cls === 'I'; }, procb: function (r) { return r.procB; }, com3: function (r) { return r.cls === 'C' && r.phase === 'III'; }
    };
    // Facets shown as radio lists in the left panel: [value, label, test]
    var FACETS = {
      agri: [['excl', 'Exclude agriculture', function (r) { return r.cls !== 'A'; }], ['only', 'Agriculture only', function (r) { return r.cls === 'A'; }]],
      pole: [['pole', 'Pole cases', function (r) { return r.pole; }], ['nonpole', 'Non-pole cases', function (r) { return !r.pole; }]],
      wo: [['issued', 'WO issued', function (r) { return r.wo; }], ['none', 'WO not issued', function (r) { return !r.wo; }]],
      delay: []  // filled from the data (DelayRange in DelaySerial order)
    };
    var TABS = [
      ['region', 'Region'], ['division', 'Division'], ['ccc', 'CCC'], ['consumer', 'Consumer'], ['delay', 'Delay range-1'], ['delay2', 'Delay range-2'],
      ['pole', 'Pole'], ['class', 'Class'], ['phase', 'Phase'], ['agency', 'Agency'], ['wo', 'WO'], ['followups', 'Follow-ups']
    ];
    var all = [], f = { q: '', kpi: '', agri: '', pole: '', wo: '', delay: '', delay2: '' }, tab = 'region', renderedTab = '', scope = null, lastTable = null;
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'agencyFilter'];
    var FACET_NAMES = ['agri', 'pole', 'wo', 'delay', 'delay2'];
    FACETS.delay2 = DELAY2.map(function (d) { return [d[0], d[0], function (r) { return d[1].indexOf(r.delaySerial) !== -1; }]; });

    function fillFilters() {
      UI.offices(all);
      UI.fill('agencyFilter', UI.uniq(all, 'agency').map(function (a) { return { value: a, label: UI.title(a) }; }), 'All agencies');
      UI.fill('classFilter', UI.uniq(all, 'cls').map(function (c) { return { value: c, label: NSCRows.CLASS[c] || c }; }), 'All classes');
      var ranges = {}; all.forEach(function (r) { if (r.delayRange) ranges[r.delayRange] = r.delaySerial; });
      FACETS.delay = [].concat(Object.keys(ranges).sort(function (a, b) { return ranges[a] - ranges[b]; }).map(function (k) { return [k, k, function (r) { return r.delayRange === k; }]; }));
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function facetTest(name) { var v = f[name]; if (!v) return null; var o = FACETS[name].filter(function (x) { return x[0] === v; })[0]; return o ? o[2] : null; }

    // All filters, optionally leaving one facet out (so that facet can count its own options).
    function filtered(skip) {
      var q = f.q.toLowerCase(), v = function (id) { return $(id).value; };
      var tests = FACET_NAMES.filter(function (n) { return n !== skip; }).map(facetTest).filter(Boolean);
      return all.filter(function (r) {
        if (v('regionFilter') && r._region !== v('regionFilter')) return false;
        if (v('divisionFilter') && r._divn !== v('divisionFilter')) return false;
        if (v('cccFilter') && r._supp !== v('cccFilter')) return false;
        if (v('agencyFilter') && r.agency !== v('agencyFilter')) return false;
        if (v('classFilter') && r.cls !== v('classFilter')) return false;
        for (var i = 0; i < tests.length; i++) if (!tests[i](r)) return false;
        if (q && r.appl.indexOf(q) === -1 && r.con.indexOf(q) === -1 && r.name.toLowerCase().indexOf(q) === -1 && r.phone.indexOf(q) === -1) return false;
        return true;
      });
    }

    function renderFacets() {
      [['agri', 'fAgri'], ['pole', 'fPole'], ['wo', 'fWo'], ['delay', 'fDelay'], ['delay2', 'fDelay2']].forEach(function (x) {
        var name = x[0], rows = filtered(name);
        UI.facet(x[1], FACETS[name].map(function (o) { return { value: o[0], label: o[1], count: rows.filter(o[2]).length }; }), f[name], function (v) { f[name] = v; render(); });
      });
      var active = (f.q ? 1 : 0) + FACET_NAMES.filter(function (n) { return f[n]; }).length +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active, { fDelay: f.delay, fDelay2: f.delay2 });
    }

    function notes() { try { return JSON.parse(localStorage.getItem('mzo_nsc_followups') || '{}') || {}; } catch (e) { return {}; } }

    function render() {
      var b = filtered(null);
      renderFacets();
      var med = function (rows) { var s = rows.map(function (r) { return r.delay || 0; }).sort(function (x, y) { return x - y; }); return s.length ? s[Math.floor(s.length / 2)] : 0; };
      [].forEach.call(document.querySelectorAll('#kpis .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(KPI[k]);
        el.querySelector('.v').textContent = UI.n(rows.length);
        el.querySelector('.s').textContent = k === '' ? 'Median ' + UI.age(med(b))
          : k === 'pole' ? UI.n(rows.reduce(function (a, r) { return a + r.poles; }, 0)) + ' poles'
          : UI.pct(rows.length, b.length) + ' of total';
        el.setAttribute('aria-pressed', String(f.kpi === k));
      });

      var view = b.filter(KPI[f.kpi]);
      var inView = new Set(view.map(function (r) { return r.appl; }));
      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'consumer' ? '<small>' + UI.n(view.length) + '</small>' : t[0] === 'followups' ? '<small>' + Object.keys(notes()).filter(function (a) { return inView.has(a); }).length + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');
      var kpiName = f.kpi ? document.querySelector('#kpis [data-k="' + f.kpi + '"] .k').getAttribute('title') || document.querySelector('#kpis [data-k="' + f.kpi + '"] .k').textContent : '';
      $('hint').textContent = (kpiName ? 'Showing ' + kpiName.toLowerCase() + ' only. ' : '') + (tab === 'delay2' ? 'Cumulative: an application can sit in more than one row.' : ['region', 'division', 'ccc'].indexOf(tab) !== -1 ? 'Click a row to open the next level.' : '');
      renderTab(view);
    }

    function groupTable(view, keyFn, label, order) {
      var groups = {}, total = view.length;
      view.forEach(function (r) { var k = keyFn(r); if (k == null) return; (Array.isArray(k) ? k : [k]).forEach(function (kk) { var g = groups[kk] || (groups[kk] = { name: kk, n: 0, poles: 0 }); g.n++; g.poles += r.poles; }); });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      if (order) list.sort(function (a, b) { return order.indexOf(a.name) - order.indexOf(b.name); });
      var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      lastTable = { title: label, cols: [label, 'Count', 'Pole count', '%'], rows: list.map(function (g) { return [g.name, g.n, g.poles, UI.pct(g.n, total)]; }) };
      return {
        rows: list, sort: order ? null : { key: 'n', dir: 'desc' }, count: false, empty: 'Nothing pending for these filters.',
        columns: [
          { key: 'name', label: label, fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
          { key: 'n', label: 'Count', num: true, fmt: UI.n },
          { key: 'poles', label: 'Pole count', num: true, fmt: UI.n },
          { key: 'pct', label: '%', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, total)); }, width: '30%' }
        ],
        foot: list.length > 1 && !order ? { n: total, poles: view.reduce(function (a, r) { return a + r.poles; }, 0), pct: 0 } : null
      };
    }

    function renderTab(view) {
      var cfg;
      if (tab === 'region') { cfg = groupTable(view, function (r) { return r._region || 'Unmapped'; }, 'Region'); cfg.onRow = function (g) { $('regionFilter').value = g.name; fillFilters(); tab = 'division'; render(); }; }
      else if (tab === 'division') { cfg = groupTable(view, function (r) { return r._divn || 'Unmapped'; }, 'Division'); cfg.onRow = function (g) { $('divisionFilter').value = g.name; fillFilters(); tab = 'ccc'; render(); }; }
      else if (tab === 'ccc') { cfg = groupTable(view, function (r) { return r._supp || 'Unmapped'; }, 'CCC'); cfg.onRow = function (g) { $('cccFilter').value = g.name; fillFilters(); tab = 'consumer'; render(); }; }
      else if (tab === 'delay') { var ord = {}; view.forEach(function (r) { if (r.delayRange) ord[r.delayRange] = r.delaySerial; }); cfg = groupTable(view, function (r) { return r.delayRange || null; }, 'Delay range', Object.keys(ord).sort(function (a, b) { return ord[a] - ord[b]; })); }
      else if (tab === 'delay2') { cfg = groupTable(view, function (r) { return DELAY2.filter(function (d) { return d[1].indexOf(r.delaySerial) !== -1; }).map(function (d) { return d[0]; }); }, 'Delay (cumulative)', DELAY2.map(function (d) { return d[0]; })); }
      else if (tab === 'pole') cfg = groupTable(view, function (r) { return r.pole ? 'Pole case' : 'Non-pole case'; }, 'Pole');
      else if (tab === 'class') cfg = groupTable(view, function (r) { return r.clsLabel; }, 'Class');
      else if (tab === 'phase') cfg = groupTable(view, function (r) { return r.phase === 'III' ? 'Three phase' : 'Single phase'; }, 'Phase');
      else if (tab === 'agency') cfg = groupTable(view, function (r) { return r.agency ? UI.title(r.agency) : 'WO not issued'; }, 'Agency');
      else if (tab === 'wo') cfg = groupTable(view, function (r) { return r.wo ? 'WO issued' : 'WO not issued'; }, 'Work order');
      else if (tab === 'consumer' || tab === 'followups') {
        var n = notes(), rows = tab === 'followups' ? view.filter(function (r) { return n[r.appl] && n[r.appl].length; }) : view;
        rows = rows.map(function (r) { r._notes = (n[r.appl] || []).length; return r; });
        lastTable = { title: tab === 'followups' ? 'Follow-ups' : 'Consumers', cols: ['Appl. no.', 'Class', 'Name', 'CCC', 'Delay (days)'], rows: rows.slice().sort(function (x, y) { return (y.delay || 0) - (x.delay || 0); }).map(function (r) { return [r.appl, r.cls, r.name, r._supp, r.delay || 0]; }) };
        cfg = {
          rows: rows, sort: { key: 'delay', dir: 'desc' }, limit: 50,
          empty: tab === 'followups' ? 'No follow-up notes for these applications. Notes are added on the Pending NSC page.' : 'No applications for these filters.',
          columns: [
            { key: 'appl', label: 'Appl. no.', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (r._notes ? ' <span class="ui-badge">' + r._notes + ' note' + (r._notes > 1 ? 's' : '') + '</span>' : ''); } },
            { key: 'cls', label: 'Class', fmt: function (v, r) { return UI.esc(r.clsLabel); } },
            { key: 'name', label: 'Name', cls: 'wrap', hideSm: true },
            { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
            { key: 'delay', label: 'Delay', num: true, fmt: function (v) { var d = v || 0; return '<span class="' + (d > 90 ? 'ui-delta bad' : '') + '">' + UI.n(d) + ' d</span>'; } },
            { key: 'agency', label: 'Agency', hideSm: true, cls: 'wrap', fmt: function (v) { return v ? UI.esc(UI.title(v)) : '<span class="ui-muted">WO not issued</span>'; } }
          ],
          onRow: detail
        };
      }
      if (renderedTab !== tab) { $('table').__ui = null; renderedTab = tab; } // new columns: fresh sort and paging
      UI.table('table', cfg);
    }

    function detail(r) {
      var n = (notes()[r.appl] || []).slice().sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
      var noteHtml = n.length ? '<h4 style="margin:14px 0 4px;font-size:13px;font-weight:600">Follow-ups</h4><ul class="cl-notes">' + n.map(function (x) { return '<li>' + UI.esc(x.note) + '<small>' + UI.esc(x.by || '') + (x.at ? ' · ' + UI.fmtDate(new Date(x.at)) : '') + '</small></li>'; }).join('') + '</ul>' : '';
      UI.drawer(r.name || 'Application ' + r.appl, [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Application', r.appl], ['Consumer ID', r.con], ['Phone', r.phone], ['Address', r.address],
        ['Delay', UI.n(r.delay || 0) + ' days (' + (r.delayRange || '—') + ')'], ['Paid on', r.paid ? UI.fmtDate(r.paid) : ''],
        ['Class', r.clsLabel + (r.area ? ' · ' + r.area : '')], ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'], ['Load', r.load ? UI.n(r.load) + ' W' : ''],
        ['Poles', r.pole ? String(r.poles || 'Yes') : 'Non-pole'], ['Work order', r.wo ? (r.won || 'Issued') + (r.woDate ? ' · ' + UI.fmtDate(r.woDate) : '') : 'Not issued'],
        ['Agency', r.agency ? UI.title(r.agency) : ''], ['Meter', r.meter], ['Withheld before', r.withheld ? (r.reason || 'Yes') : ''],
        ['Applicant', r.procB ? 'Promoter / developer (Proc-B)' : 'Individual'], ['Inspection note', r.comment]
      ], noteHtml, r.phone ? '<a class="ui-btn sm" href="tel:' + UI.esc(r.phone) + '">Call</a>' : '');
    }

    /* events */
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () { if (id === 'regionFilter') $('divisionFilter').value = ''; if (id !== 'cccFilter') $('cccFilter').value = ''; fillFilters(); render(); });
    });
    ['agencyFilter', 'classFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); if (f.q && tab !== 'consumer') tab = 'consumer'; render(); }, 180));
    $('kpis').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.kpi = f.kpi === k ? '' : k; render(); });
    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-drill-tab'); if (t) { tab = t.getAttribute('data-t'); render(); } });
    function clearAll() {
      f = { q: '', kpi: '', agri: '', pole: '', wo: '', delay: '', delay2: '' }; $('q').value = '';
      SELECTS.forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      tab = scope && (scope.level === 'division' || scope.level === 'ccc' || scope.level === 'codes') ? 'ccc' : 'region';
      fillFilters(); render();
    }
    $('topBtn').addEventListener('click', function () { tab = 'consumer'; f.kpi = ''; renderedTab = ''; render(); $('table').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = ['*Pending NSC — ' + lastTable.title + '*' + ($('asOn').textContent ? ' (as on ' + $('asOn').textContent + ')' : ''), lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
    });
    $('exportBtn').addEventListener('click', function () {
      if (!lastTable) return;
      UI.exportCsv('pending-nsc-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
    });
    UI.refresh('refreshBtn', 'CACHE_NSC_v5', function (t) { all = NSCRows.parse(t); fillFilters(); render(); });
    fetch('/api/nsc/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (m) { if (m && m.canUpload) $('uploadBtn').hidden = false; }).catch(function () {});

    UI.load('CACHE_NSC_v5', function (text, info) {
      if (!text) { if (info && info.error) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load the NSC data.</div>'; } return; }
      all = NSCRows.parse(text);
      $('asOn').textContent = all.asOn ? UI.fmtDate(all.asOn) : '';
      fillFilters();
      if (scope && (scope.level === 'division' || scope.level === 'ccc' || scope.level === 'codes')) tab = 'ccc'; else if (scope && scope.level === 'region') tab = 'division';
      render();
    });
  });
