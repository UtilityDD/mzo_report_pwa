<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline · MZO Reports</title>
  <!-- Shown by the service worker when a page was never saved; keep it free of network assets. -->
  <script>
    try { if ((localStorage.getItem('theme') || localStorage.getItem('mzo_theme')) === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <style>
    :root { --bg: #09090a; --surface: #161617; --border: #27272a; --text: #ececee; --muted: #8e8e96; --fill: #ececee; --on-fill: #0f0f10; }
    :root[data-theme="light"] { --bg: #f1f1f0; --surface: #fff; --border: #e7e7e5; --text: #18181b; --muted: #71717a; --fill: #18181b; --on-fill: #fff; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 380px; padding: 28px 24px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
    svg { display: block; margin-bottom: 16px; color: var(--muted); }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
    .row { display: flex; gap: 8px; }
    a, button { flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 36px; border-radius: 8px; font: 500 13.5px inherit; font-family: inherit;
      text-decoration: none; cursor: pointer; }
    a { background: var(--fill); color: var(--on-fill); border: 0; }
    button { background: none; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main class="card">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.3-1.7M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 10.7 5M12 20h.01"/>
    </svg>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Connect to the internet to open it, or go back to the reports you've already opened.</p>
    <div class="row">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/index.html">Home</a>
    </div>
  </main>
</body>
</html>
