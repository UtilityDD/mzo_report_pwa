<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly deposit vs disposal · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .wk-chart { position: relative; display: flex; align-items: stretch; gap: 2px; height: 180px; padding: 4px 0 0; }
    .wk-chart .col { position: relative; flex: 1 1 0; min-width: 2px; cursor: pointer; border-radius: 2px; }
    .wk-chart .col:hover { background: var(--mzo-row-hover); }
    .wk-chart .col b { position: absolute; left: 12%; right: 12%; border-radius: 2px; background: var(--mzo-chart); }
    .wk-chart .col b.up { background: var(--mzo-bad); opacity: .75; }
    .wk-chart .col b.down { background: var(--mzo-ok); opacity: .75; }
    .wk-chart .col.on b { opacity: 1; background: var(--mzo-text); }
    .wk-chart .base { position: absolute; left: 0; right: 0; height: 1px; background: var(--mzo-border-strong); pointer-events: none; }
    .wk-axis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--mzo-muted); }
    .wk-legend { font-size: 12.5px; color: var(--mzo-muted); }
    .wk-up { color: var(--mzo-bad); }
    .wk-down { color: var(--mzo-ok); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Weekly deposit vs disposal</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="cat" role="group" aria-label="Category">
          <button type="button" data-c="ALL" aria-pressed="true">All</button>
          <button type="button" data-c="DOM" aria-pressed="false">Domestic</button>
          <button type="button" data-c="COM" aria-pressed="false">Commercial</button>
          <button type="button" data-c="IND" aria-pressed="false">Industrial</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="weekFilter" aria-label="Week"><option value="">All weeks (average)</option></select></span>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-m="dep"><div class="k">Deposited</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-m="dis"><div class="k">Disposed</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-m="net"><div class="k">Backlog change</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-m="wit"><div class="k">Withheld</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-m="pend"><div class="k">Pending on Monday</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2 id="trendTitle">Backlog change by week</h2><span class="wk-legend" id="trendNote"></span></div>
      <div class="ui-panel-b">
        <div class="wk-chart" id="chart"></div>
        <div class="wk-axis"><span id="axisFrom"></span><span id="axisTo"></span></div>
      </div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office <small id="officeNote"></small></h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel" style="margin-top:0">
        <div class="ui-panel-h">
          <h2>Weeks</h2>
          <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
        </div>
        <div id="weekTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'CACHE_WEEKLY';
    var METRIC = {
      dep: { label: 'Deposited', title: 'Deposited by week' },
      dis: { label: 'Disposed', title: 'Disposed by week' },
      net: { label: 'Backlog change', title: 'Backlog change by week' },
      wit: { label: 'Withheld', title: 'Withheld by week' },
      pend: { label: 'Pending on Monday', title: 'Pending on Monday by week' }
    };
    var all = [], weeks = [], f = { cat: 'ALL', metric: 'net' }, level = 'region', scope = null;

    function num(row, base, cat) {
      var get = function (c) { return parseInt(row[base + ' (' + c + ')'], 10) || 0; };
      if (cat !== 'ALL') return get(cat);
      if (row[base + ' (All)'] != null) return get('All');
      return get('DOM') + get('COM') + get('IND');
    }

    function prepare(text) {
      var seen = {};
      all = UI.csv(text).filter(function (d) { return d['Date of report in Current Week']; }).map(function (d) {
        var dt = UI.date(d['Date of report in Current Week']);
        var o = UI.office(d['CCC Code']);
        var r = {
          raw: d, week: dt ? dt.getTime() : 0, weekDate: dt,
          _region: UI.regionName(d.Region) || o.region, _divn: UI.title(d.Division) || o.division,
          _supp: d.CCC || d.CCC1 || UI.title(d['CCC Name']), CCC_CODE: String(d['CCC Code'] || '').trim()
        };
        if (r.week) seen[r.week] = dt;
        return r;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      weeks = Object.keys(seen).map(Number).sort(function (a, b) { return b - a; });
      $('meta').textContent = weeks.length ? UI.n(weeks.length) + ' weeks · ' + UI.fmtDate(new Date(weeks[weeks.length - 1])) + ' to ' + UI.fmtDate(new Date(weeks[0])) : 'No weeks reported';
      UI.fill('weekFilter', weeks.map(function (w) { return { value: String(w), label: 'Week of ' + UI.fmtDate(new Date(w)) }; }), 'All weeks (average)');
      fillOffices();
    }

    function fillOffices() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      UI.mark($('weekFilter'));
    }

    function officeRows() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, cc = $('cccFilter').value;
      return all.filter(function (r) { return (!reg || r._region === reg) && (!div || r._divn === div) && (!cc || r._supp === cc); });
    }

    // Totals for a set of rows in the chosen category.
    function sum(rows) {
      var t = { last: 0, dep: 0, eff: 0, wit: 0, dis: 0, pend: 0 };
      rows.forEach(function (r) {
        var d = r.raw, c = f.cat;
        t.last += num(d, 'Pending as on Monday of Last Week', c);
        t.dep += num(d, 'Deposited in last week', c);
        t.eff += num(d, 'Conn. Eff.', c);
        t.wit += num(d, 'Withheld', c);
        t.dis += num(d, 'Total disposed', c);
        t.pend += num(d, 'Pending as on Monday of Current Week', c);
      });
      t.net = t.dep - t.dis;
      return t;
    }
    function scale(t, k) { var o = {}; Object.keys(t).forEach(function (x) { o[x] = k ? t[x] / k : 0; }); return o; }

    function fmt(v, avg) { return avg ? (Math.abs(v) < 100 ? v.toFixed(1) : UI.n(Math.round(v))) : UI.n(v); }
    function signed(v, avg) { var s = fmt(Math.abs(v), avg); return v > 0 ? '+' + s : v < 0 ? '−' + s : '0'; }

    function render() {
      var rows = officeRows(), wk = $('weekFilter').value, avg = !wk;
      var inWeek = wk ? rows.filter(function (r) { return String(r.week) === wk; }) : rows;
      var nWeeks = wk ? 1 : UI.uniq(rows.map(function (r) { return { w: r.week }; }), 'w').length || 1;
      var t = scale(sum(inWeek), nWeeks);

      var sub = {
        dep: avg ? 'Average per week' : 'In the week',
        dis: 'Effected ' + fmt(t.eff, avg) + ' · withheld ' + fmt(t.wit, avg),
        net: t.net > 0 ? 'Backlog grew' : t.net < 0 ? 'Backlog shrank' : 'No change',
        wit: UI.pct(t.wit, t.dis) + ' of disposed',
        pend: 'Last Monday ' + fmt(t.last, avg)
      };
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var m = el.getAttribute('data-m'), v = el.querySelector('.v');
        v.textContent = m === 'net' ? signed(t.net, avg) : fmt(t[m], avg);
        v.className = 'v' + (m === 'net' && t.net > 0 ? ' wk-up' : m === 'net' && t.net < 0 ? ' wk-down' : '');
        el.querySelector('.s').textContent = sub[m];
        el.setAttribute('aria-pressed', String(f.metric === m));
      });

      // Trend: every week for the current offices.
      var byWeek = {};
      rows.forEach(function (r) { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
      var series = weeks.slice().reverse().filter(function (w) { return byWeek[w]; }).map(function (w) { var s = sum(byWeek[w]); s.week = w; return s; });
      chart(series, wk);

      // Offices
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      inWeek.forEach(function (r) { (groups[r[key] || 'Unmapped'] = groups[r[key] || 'Unmapped'] || { rows: [], parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '' }).rows.push(r); });
      var list = Object.keys(groups).map(function (k) { var s = scale(sum(groups[k].rows), nWeeks); s.name = k; s.parent = groups[k].parent; return s; });
      $('officeNote').textContent = avg ? 'average per week' : 'week of ' + UI.fmtDate(new Date(+wk));
      var F = function (v) { return fmt(v, avg); };
      UI.table('officeTable', {
        rows: list, sort: { key: 'dep', dir: 'desc' }, count: false, empty: 'No reports for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'dep', label: 'Deposited', num: true, fmt: F },
          { key: 'dis', label: 'Disposed', num: true, fmt: F, hideSm: true },
          { key: 'net', label: 'Change', num: true, fmt: function (v) { return '<span class="' + (v > 0 ? 'wk-up' : v < 0 ? 'wk-down' : '') + '">' + signed(v, avg) + '</span>'; } },
          { key: 'wit', label: 'Withheld', num: true, fmt: F, hideSm: true },
          { key: 'pend', label: 'Pending', num: true, fmt: F }
        ],
        foot: list.length > 1 ? (function () { var s = t; return { dep: s.dep, dis: s.dis, net: s.net, wit: s.wit, pend: s.pend }; })() : null,
        onRow: level === 'ccc' ? null : function (g) { drill(g.name); }
      });

      // Week list
      var wl = series.slice().reverse();
      UI.table('weekTable', {
        rows: wl, sort: { key: 'week', dir: 'desc' }, limit: 26, resetPage: true, count: false, empty: 'No weeks.',
        selected: function (r) { return String(r.week) === wk; },
        columns: WEEK_COLS,
        onRow: function (r) { var s = $('weekFilter'); s.value = String(r.week) === wk ? '' : String(r.week); UI.mark(s); render(); }
      });
      window.__weeks = wl;
      $('clearBtn').hidden = !(wk || f.cat !== 'ALL' || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    var WEEK_COLS = [
      { key: 'week', label: 'Week of', fmt: function (v) { return '<span style="white-space:nowrap">' + UI.fmtDate(new Date(v)) + '</span>'; }, csv: function (r) { return UI.fmtDate(new Date(r.week)); } },
      { key: 'dep', label: 'Deposited', num: true, fmt: UI.n },
      { key: 'dis', label: 'Disposed', num: true, fmt: UI.n, hideSm: true },
      { key: 'net', label: 'Change', num: true, fmt: function (v) { return '<span class="' + (v > 0 ? 'wk-up' : v < 0 ? 'wk-down' : '') + '">' + signed(v, false) + '</span>'; }, csv: function (r) { return r.net; } },
      { key: 'pend', label: 'Pending', num: true, fmt: UI.n }
    ];

    function chart(series, wk) {
      var m = f.metric, vals = series.map(function (s) { return s[m]; });
      var maxPos = Math.max.apply(null, vals.concat([0])), maxNeg = Math.max.apply(null, vals.map(function (v) { return -v; }).concat([0]));
      var range = (maxPos + maxNeg) || 1, base = (maxNeg / range) * 100;
      $('trendTitle').textContent = METRIC[m].title;
      $('trendNote').textContent = m === 'net' ? 'Above the line: more deposited than disposed' : (series.length ? 'Peak ' + UI.n(maxPos) : '');
      $('chart').innerHTML = '<div class="base" style="bottom:' + base + '%"></div>' + series.map(function (s) {
        var v = s[m], h = (Math.abs(v) / range) * 100, cls = m === 'net' ? (v > 0 ? 'up' : v < 0 ? 'down' : '') : '';
        var pos = v >= 0 ? 'bottom:' + base + '%' : 'bottom:' + (base - h) + '%';
        var tip = UI.fmtDate(new Date(s.week)) + ' — deposited ' + UI.n(s.dep) + ', disposed ' + UI.n(s.dis) + ' (effected ' + UI.n(s.eff) + ', withheld ' + UI.n(s.wit) + '), pending ' + UI.n(s.pend);
        return '<div class="col' + (String(s.week) === wk ? ' on' : '') + '" data-w="' + s.week + '" title="' + UI.esc(tip) + '"><b class="' + cls + '" style="' + pos + ';height:' + Math.max(v ? 0.8 : 0, h) + '%"></b></div>';
      }).join('');
      $('axisFrom').textContent = series.length ? UI.fmtDate(new Date(series[0].week)) : '';
      $('axisTo').textContent = series.length ? UI.fmtDate(new Date(series[series.length - 1].week)) : '';
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillOffices(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); render();
      });
    });
    $('weekFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('chart').addEventListener('click', function (e) {
      var c = e.target.closest('.col'); if (!c) return;
      var s = $('weekFilter'), w = c.getAttribute('data-w');
      s.value = s.value === w ? '' : w; UI.mark(s); render();
    });
    $('cat').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      f.cat = b.getAttribute('data-c');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; f.metric = s.getAttribute('data-m'); render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      $('weekFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      f.cat = 'ALL';
      [].forEach.call(document.querySelectorAll('#cat button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-c') === 'ALL')); });
      fillOffices(); render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('weekly-deposit-disposal.csv', [WEEK_COLS[0], { key: 'last', label: 'Pending last Monday' }, WEEK_COLS[1], { key: 'eff', label: 'Connections effected' }, { key: 'wit', label: 'Withheld' }, WEEK_COLS[2], WEEK_COLS[3], WEEK_COLS[4]], window.__weeks || []);
    });
    UI.refresh('refreshBtn', KEY, function (t) { prepare(t); render(); });

    var first = true;
    UI.load(KEY, function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = $('weekTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
