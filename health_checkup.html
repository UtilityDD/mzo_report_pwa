<!DOCTYPE html>
<html lang="en">
<head>
  <script src="mzo_theme.js?v=1"></script>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
  <title>Health Check-up | MZO</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --card: #ffffff;
      --bg: #f8fafc;
    }
    body.dark-theme, [data-bs-theme="dark"] {
      --primary: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.15);
      --card: #111a2e;
      --bg: #0b1120;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
    }
    .header-title i {
      color: var(--primary);
    }
    .content-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    .status-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 460px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .status-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.12);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 18px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">
      <i class="fas fa-heart-pulse"></i>
      <span>Health Check-up Records</span>
    </div>
  </header>
  <main class="content-container">
    <div class="status-card">
      <div class="status-icon-wrap">
        <i class="fas fa-heart-pulse"></i>
      </div>
      <h2>Health Check-up Module</h2>
      <p>Data syncing for annual medical and occupational health check-up records across MZO distribution divisions is being synchronized.</p>
    </div>
  </main>
</body>
</html>
