<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NSC pipeline (draft B) · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <script src="/lib/nsc_rows.js?v=2" defer></script>
  <style>
    .pl-draft { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-left: 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; vertical-align: 3px; background: var(--mzo-accent-soft); color: var(--mzo-accent); }
    /* Stage flow */
    .pl-flow { background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .pl-mix { display: flex; height: 8px; gap: 2px; margin: 16px 16px 4px; border-radius: 4px; overflow: hidden; }
    .pl-mix i { display: block; height: 100%; min-width: 2px; }
    .pl-stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .pl-stage { position: relative; text-align: left; padding: 12px 16px 16px; border: 0; background: none; cursor: pointer; box-shadow: 1px 0 0 var(--mzo-border); }
    .pl-stage:last-child { box-shadow: none; }
    .pl-stage:hover { background: var(--mzo-row-hover); }
    .pl-stage[aria-pressed="true"] { background: var(--mzo-surface-2); }
    .pl-stage[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--mzo-text); }
    .pl-stage .k { display: flex; align-items: center; gap: 8px; color: var(--mzo-muted); font-size: 12.5px; }
    .pl-stage .k i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    .pl-stage .k em { font-style: normal; color: var(--mzo-faint); }
    .pl-stage .v { margin-top: 6px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .pl-stage .v small { margin-left: 6px; font-size: 12.5px; font-weight: 400; color: var(--mzo-muted); letter-spacing: 0; }
    .pl-stage .s { margin-top: 3px; color: var(--mzo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .pl-c0 { background: var(--mzo-text); } .pl-c1 { background: color-mix(in srgb, var(--mzo-text) 62%, var(--mzo-bg)); }
    .pl-c2 { background: color-mix(in srgb, var(--mzo-text) 36%, var(--mzo-bg)); } .pl-c3 { background: var(--mzo-accent); }
    /* Heat cells */
    .heat { display: block; margin: -9px -12px; padding: 9px 12px; border-radius: 0; cursor: pointer; background: color-mix(in srgb, var(--mzo-text) calc(var(--a, 0) * 16%), transparent); }
    .heat:hover { box-shadow: inset 0 0 0 1px var(--mzo-border-strong); }
    .heat.sel { box-shadow: inset 0 0 0 2px var(--mzo-text); }
    .heat small { color: var(--mzo-muted); margin-left: 4px; font-size: 11px; }
    .pl-grid { grid-template-columns: minmax(0, 2.3fr) minmax(0, 1fr); }
    @media (max-width: 1100px) { .pl-grid { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 900px) { .pl-stages { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pl-stage:nth-child(2) { box-shadow: none; } .pl-stage:nth-child(-n+2) { border-bottom: 1px solid var(--mzo-border); } }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>NSC pipeline <span class="pl-draft">Draft B</span></h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <a class="ui-btn" href="nsc.html">Detailed report</a>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, consumer ID or name" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="ageFilter" aria-label="Waiting"><option value="">Any wait</option><option value="30">Over 30 days</option><option value="90">Over 90 days</option><option value="180">Over 6 months</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="pl-flow" aria-label="Where applications are">
      <div class="pl-mix" id="mix"></div>
      <div class="pl-stages" id="stages"></div>
    </section>

    <div class="ui-grid pl-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Stuck where <small>click a cell to list it</small></h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division" aria-selected="true">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="matrix"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel">
        <div class="ui-panel-h"><h2>Agencies <small>open work orders</small></h2></div>
        <div id="agencies" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="listTitle">Applications <small id="count"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="apps"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var ST = NSCRows.STAGES, COLOR = { nowo: 'pl-c0', pole: 'pl-c1', ready: 'pl-c2', meter: 'pl-c3' };
    var all = [], f = { q: '', stage: '', agency: '', cell: null }, level = 'division', scope = null;

    function med(nums) { if (!nums.length) return null; var s = nums.slice().sort(function (a, b) { return a - b; }); return s[Math.floor(s.length / 2)]; }
    function fillFilters() {
      UI.offices(all);
      UI.fill('classFilter', UI.uniq(all, 'cls').map(function (c) { return { value: c, label: NSCRows.CLASS[c] || c }; }), 'All classes');
      if (!scope) scope = UI.lockScope();
    }

    // Office/class/age/search — the base every number on the page counts from.
    function base() {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, cls = $('classFilter').value, age = +$('ageFilter').value || 0;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!cls || r.cls === cls) && (!age || (r.delay || 0) > age) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base();
      // Stage flow
      var counts = {}; ST.forEach(function (s) { counts[s.key] = b.filter(function (r) { return r.stage === s.key; }); });
      $('mix').innerHTML = ST.map(function (s) { return counts[s.key].length ? '<i class="' + COLOR[s.key] + '" style="flex:' + counts[s.key].length + '" title="' + UI.esc(s.label) + ' ' + counts[s.key].length + '"></i>' : ''; }).join('');
      $('stages').innerHTML = ST.map(function (s, i) {
        var rows = counts[s.key];
        var since = s.key === 'nowo' ? rows.map(function (r) { return r.delay || 0; }) : rows.map(function (r) { return r.woDays; }).filter(function (x) { return x != null; });
        var m = med(since), oldest = since.length ? Math.max.apply(null, since) : null;
        return '<button type="button" class="pl-stage" data-stage="' + s.key + '" aria-pressed="' + (f.stage === s.key) + '"><div class="k"><i class="' + COLOR[s.key] + '"></i><em>' + (i + 1) + '</em>' + UI.esc(s.label) + '</div>' +
          '<div class="v">' + UI.n(rows.length) + '<small>' + UI.pct(rows.length, b.length) + '</small></div>' +
          '<div class="s">' + (m == null ? '&nbsp;' : (s.key === 'nowo' ? 'Paid ' : 'Work order ') + UI.age(m) + ' ago (median) · oldest ' + UI.age(oldest)) + '</div></button>';
      }).join('');

      // Matrix: office × stage
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      b.forEach(function (r) { var n = r[key] || 'Unmapped'; var g = groups[n] || (groups[n] = { name: n, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, o90: 0, delays: [] }); g.n++; g[r.stage] = (g[r.stage] || 0) + 1; if ((r.delay || 0) > 90) g.o90++; g.delays.push(r.delay || 0); });
      var list = Object.keys(groups).map(function (k) { var g = groups[k]; g.median = med(g.delays); return g; });
      var colMax = {}; ST.forEach(function (s) { colMax[s.key] = Math.max.apply(null, list.map(function (g) { return g[s.key] || 0; }).concat([1])); });
      var heat = function (stage) { return function (v, g) { v = v || 0; var sel = f.cell && f.cell.office === g.name && f.cell.stage === stage; return '<span class="heat' + (sel ? ' sel' : '') + '" data-cell="' + UI.esc(g.name) + '|' + stage + '" style="--a:' + (v / colMax[stage]).toFixed(2) + '">' + UI.n(v) + '</span>'; }; };
      UI.table('matrix', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'Nothing pending for these filters.',
        columns: [{ key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Pending', num: true, fmt: UI.n }]
          .concat(ST.map(function (s) { return { key: s.key, label: s.short, num: true, fmt: heat(s.key), sortVal: function (g) { return g[s.key] || 0; } }; }))
          .concat([{ key: 'o90', label: 'Over 90 d', num: true, fmt: UI.n, hideSm: true }, { key: 'median', label: 'Median wait', num: true, fmt: function (v) { return UI.age(v); }, hideSm: true }]),
        onRow: level === 'ccc' ? null : function (g, e) { if (e && e.target.closest('[data-cell]')) return; drill(g.name); }
      });

      // Agencies (work orders issued, not yet metered)
      var ag = {};
      b.filter(function (r) { return r.wo && r.stage !== 'meter'; }).forEach(function (r) { var n = r.agency ? UI.title(r.agency) : 'Not named'; var a = ag[n] || (ag[n] = { name: n, open: 0, pole: 0, days: [] }); a.open++; if (r.stage === 'pole') a.pole++; if (r.woDays != null) a.days.push(r.woDays); });
      var alist = Object.keys(ag).map(function (k) { var a = ag[k]; a.median = med(a.days); a.oldest = a.days.length ? Math.max.apply(null, a.days) : null; return a; });
      UI.table('agencies', {
        rows: alist, sort: { key: 'open', dir: 'desc' }, limit: 12, count: false, empty: 'No open work orders.',
        selected: function (a) { return a.name === f.agency; },
        columns: [{ key: 'name', label: 'Agency', cls: 'wrap' }, { key: 'open', label: 'Open', num: true, fmt: UI.n }, { key: 'pole', label: 'Pole work', num: true, fmt: UI.n, hideSm: true }, { key: 'median', label: 'Median age', num: true, fmt: function (v) { return UI.age(v); } }],
        onRow: function (a) { f.agency = f.agency === a.name ? '' : a.name; f.cell = null; render(); }
      });

      // Applications for the current selection
      var view = b.filter(function (r) {
        if (f.stage && r.stage !== f.stage) return false;
        if (f.cell && (r[key] || 'Unmapped') !== f.cell.office) return false;
        if (f.cell && r.stage !== f.cell.stage) return false;
        if (f.agency && (r.agency ? UI.title(r.agency) : 'Not named') !== f.agency) return false;
        if (f.agency && !(r.wo && r.stage !== 'meter')) return false;
        return true;
      });
      var bits = [];
      if (f.cell) bits.push(f.cell.office + ' · ' + ST.filter(function (s) { return s.key === f.cell.stage; })[0].label.toLowerCase());
      else if (f.stage) bits.push(ST.filter(function (s) { return s.key === f.stage; })[0].label);
      if (f.agency) bits.push(f.agency);
      $('listTitle').firstChild.textContent = (bits.length ? bits.join(' · ') : 'Applications') + ' ';
      $('count').textContent = UI.n(view.length);
      UI.table('apps', {
        rows: view, sort: { key: 'delay', dir: 'desc' }, limit: 40, resetPage: true, empty: 'No applications for this selection.',
        columns: APP_COLS, onRow: detail
      });
      $('clearBtn').hidden = !(f.q || f.stage || f.agency || f.cell || $('classFilter').value || $('ageFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
      window.__view = view;
    }

    var STAGE_LABEL = {}; ST.forEach(function (s) { STAGE_LABEL[s.key] = s.short; });
    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(r.name || v) + '</span><span class="sub">' + UI.esc(v) + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'stage', label: 'Stage', fmt: function (v) { return '<span class="ui-badge">' + UI.esc(STAGE_LABEL[v]) + '</span>'; }, csv: function (r) { return STAGE_LABEL[r.stage]; } },
      { key: 'delay', label: 'Since payment', num: true, fmt: function (v) { var d = v || 0; return '<span class="' + (d > 90 ? 'ui-delta bad' : '') + '">' + UI.n(d) + ' d</span>'; } },
      { key: 'woDays', label: 'Since work order', num: true, hideSm: true, sortVal: function (r) { return r.woDays == null ? -1 : r.woDays; }, fmt: function (v) { return v == null ? '<span class="ui-muted">—</span>' : UI.n(v) + ' d'; } },
      { key: 'poles', label: 'Poles', num: true, hideSm: true, fmt: function (v, r) { return r.pole ? UI.n(v || 0) : '<span class="ui-muted">—</span>'; } },
      { key: 'agency', label: 'Agency', hideSm: true, cls: 'wrap', fmt: function (v) { return v ? UI.esc(UI.title(v)) : '<span class="ui-muted">—</span>'; } }
    ];

    function detail(r) {
      UI.drawer(r.name || 'Application ' + r.appl, [STAGE_LABEL[r.stage], r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Application', r.appl], ['Consumer ID', r.con], ['Phone', r.phone], ['Address', r.address],
        ['Paid on', r.paid ? UI.fmtDate(r.paid) + ' (' + UI.n(r.delay || 0) + ' days ago)' : ''], ['Class', r.clsLabel + (r.area ? ' · ' + r.area : '')],
        ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'], ['Poles needed', r.pole ? String(r.poles || 'Yes') : 'None'],
        ['Work order', r.wo ? (r.won || 'Issued') + (r.woDate ? ' · ' + UI.fmtDate(r.woDate) : '') : 'Not issued yet'], ['Agency', r.agency ? UI.title(r.agency) : ''],
        ['Meter', r.meter], ['Withheld before', r.withheld ? (r.reason || 'Yes') : ''], ['Inspection note', r.comment]
      ], '', r.phone ? '<a class="ui-btn sm" href="tel:' + UI.esc(r.phone) + '">Call</a>' : '');
    }

    function setLevel(l) {
      level = l; f.cell = null;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      var el = $('matrix'); el.__ui = null;
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; fillFilters(); setLevel('division'); }
      else if (level === 'division') { $('divisionFilter').value = name; fillFilters(); setLevel('ccc'); }
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    /* events */
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () { if (id === 'regionFilter') $('divisionFilter').value = ''; if (id !== 'cccFilter') $('cccFilter').value = ''; fillFilters(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); }); f.cell = null; render(); });
    });
    ['classFilter', 'ageFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stages').addEventListener('click', function (e) { var s = e.target.closest('.pl-stage'); if (!s) return; var k = s.getAttribute('data-stage'); f.stage = f.stage === k ? '' : k; f.cell = null; render(); });
    $('matrix').addEventListener('click', function (e) {
      var c = e.target.closest('[data-cell]'); if (!c) return;
      e.stopPropagation();
      var p = c.getAttribute('data-cell').split('|');
      f.cell = f.cell && f.cell.office === p[0] && f.cell.stage === p[1] ? null : { office: p[0], stage: p[1] };
      f.stage = '';
      render();
      $('apps').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, true);
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f = { q: '', stage: '', agency: '', cell: null }; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'ageFilter'].forEach(function (id) { if (!$(id).disabled) { $(id).value = ''; UI.mark($(id)); } });
      fillFilters(); setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : 'division');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('nsc-pipeline.csv', [{ key: 'appl', label: 'Application' }, { key: 'name', label: 'Name' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }].concat(APP_COLS.slice(2).map(function (c) { return { key: c.key, label: c.label, csv: c.csv }; })), window.__view || []);
    });

    UI.load('CACHE_NSC_v5', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('apps').innerHTML = '<div class="ui-empty">Could not load the NSC data.</div>'; } return; }
      all = NSCRows.parse(text);
      var meds = med(all.map(function (r) { return r.delay || 0; }));
      $('meta').textContent = (all.asOn ? 'As on ' + UI.fmtDate(all.asOn) + ' · ' : '') + UI.n(all.length) + ' paid applications not yet connected · typical wait ' + UI.age(meds);
      fillFilters();
      if (scope && (scope.level === 'division' || scope.level === 'ccc')) setLevel('ccc'); else render();
    });
  });
  </script>
</body>
</html>
