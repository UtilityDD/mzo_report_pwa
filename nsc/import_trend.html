<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Import NSC trend snapshots · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=24" />
  <script src="/mzo_ui.js?v=21" defer></script>
</head>
<body>
  <main class="ui-page" style="max-width:720px;margin:40px auto;padding:0 16px">
    <header class="ui-head">
      <div>
        <h1>Import NSC trend snapshots</h1>
        <p class="ui-muted" id="meta">Loads the Nov 5–10 Working pack and posts summary-only days to the VM (skips duplicates).</p>
      </div>
    </header>
    <section class="ui-panel" style="padding:16px">
      <pre id="out" style="white-space:pre-wrap;font-size:13px;margin:0">Ready…</pre>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="ui-btn primary" id="go">Import (skip existing)</button>
        <a class="ui-btn" href="/nsc.html?view=trend">Open Pending NSC Trend</a>
      </div>
    </section>
  </main>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var out = document.getElementById('out');
    var go = document.getElementById('go');
    function log(s) { out.textContent = s; }
    async function run() {
      go.disabled = true;
      try {
        log('Loading pack…');
        var pack = await fetch('/nsc/packs/trend_2026-11-05_10.json', { credentials: 'same-origin' }).then(function (r) {
          if (!r.ok) throw new Error('Could not load pack (' + r.status + ')');
          return r.json();
        });
        log('Posting ' + (pack.items || []).length + ' day(s) to /api/nsc/snapshots/import …');
        var res = await fetch('/api/nsc/snapshots/import', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pack)
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error((data && data.message) || ('HTTP ' + res.status));
        log(JSON.stringify(data, null, 2));
        if (window.UI && UI.toast) UI.toast(data.message || 'Imported');
      } catch (e) {
        log('Failed: ' + ((e && e.message) || e));
        if (window.UI && UI.toast) UI.toast('Import failed');
      } finally {
        go.disabled = false;
      }
    }
    go.addEventListener('click', run);
    // Auto-run once when opened signed-in on the VM.
    fetch('/api/nsc/upload/meta', { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { log('Sign in on this host, then click Import.'); return; }
      return r.json().then(function (m) {
        if (!m || !m.enabled) { log('Snapshot import is only on the VM.'); return; }
        if (!m.canUpload) { log('Your account cannot upload NSC data.'); return; }
        log('Signed in. Importing…');
        run();
      });
    }).catch(function () { log('Sign in on this host, then click Import.'); });
  });
  </script>
</body>
</html>
