<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSC Upload</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #0b5cab;
      --ok: #166534;
      --bad: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, #e8eef6 0%, var(--bg) 40%);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    .muted { color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
    .meta {
      margin: 0 0 1rem;
      font-size: 0.88rem;
      color: var(--muted);
      display: none;
    }
    .meta.show { display: block; }
    .steps {
      margin: 0;
      padding: 0;
      list-style: decimal;
      padding-left: 1.25rem;
    }
    .steps li { margin: 0.85rem 0; }
    .steps label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.35rem; }
    #mirrorBox { display: none; margin: 0.75rem 0 0; }
    #mirrorBox.show { display: block; color: var(--bad); }
    input[type="file"], input[type="date"] { width: 100%; max-width: 320px; }
    button, .link-btn {
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .primary { background: var(--brand); color: #fff; }
    .primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .ghost { background: #e5e7eb; color: #111827; }
    .msg { margin-top: 1rem; padding: 0.85rem 1rem; border-radius: 8px; display: none; white-space: pre-wrap; }
    .msg.ok { display: block; background: #dcfce7; color: var(--ok); }
    .msg.err { display: block; background: #fee2e2; color: var(--bad); }
    .retry-box {
      display: none;
      margin: 0.75rem 0 0;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      font-size: 0.88rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .retry-box.show { display: block; }
    .manual-box {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #fca5a5;
      background: #fff1f2;
      border-radius: 10px;
    }
    .manual-box.show { display: block; }
    .manual-box strong { display: block; margin-bottom: 0.35rem; color: var(--bad); }
    .manual-box ol { margin: 0.25rem 0 0.5rem 1.15rem; padding: 0; font-size: 0.88rem; line-height: 1.4; }
    .manual-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      margin-top: 0.45rem;
    }
    .manual-label { font-size: 0.85rem; font-weight: 600; min-width: 7rem; }
    .locked { opacity: 0.7; }
    .progress-panel {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
    }
    .progress-panel.show { display: block; }
    .progress-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
    }
    .counts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      font-size: 0.9rem;
      margin-bottom: 0.85rem;
    }
    .counts .label { color: var(--muted); }
    .counts .val { font-weight: 700; font-variant-numeric: tabular-nums; }
    .bar-track {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 0.35rem 0 0.75rem;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0b5cab, #38bdf8);
      transition: width 0.2s ease;
    }
    .step-line {
      font-size: 0.88rem;
      color: var(--ink);
      margin: 0.25rem 0;
      font-variant-numeric: tabular-nums;
    }
    .step-line.done { color: var(--ok); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="panel">
      <h1>NSC Upload</h1>
      <p class="meta" id="metaBox"></p>

      <ol class="steps locked" id="uploadBlock">
        <li>
          <label for="reportDateInput">Date</label>
          <input id="reportDateInput" type="date" disabled required />
        </li>
        <li>
          <label for="fileInput">Excel file</label>
          <input id="fileInput" type="file" accept=".xlsx,.xlsb,.xls,.csv" disabled />
        </li>
        <li>
          <label>Publish</label>
          <div class="row">
            <button class="primary" id="uploadBtn" disabled>Upload</button>
            <a class="link-btn ghost" href="/nsc.html">NSC</a>
            <a class="link-btn ghost" href="/withheld.html">Withheld</a>
            <a class="link-btn ghost" href="/index.html">Home</a>
          </div>
        </li>
      </ol>
      <p class="muted" id="mirrorBox"></p>

      <div class="progress-panel" id="progressPanel">
        <div class="counts">
          <div><span class="label">NSC</span><br><span class="val" id="sentPending">0 / —</span></div>
          <div><span class="label">Withheld</span><br><span class="val" id="sentWithheld">0 / —</span></div>
        </div>
        <div class="muted" id="progressLabel">Waiting…</div>
        <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
        <div class="retry-box" id="retryBox"></div>
        <div class="step-line" id="stepProcess">1. Process</div>
        <div class="step-line" id="stepPending">2. NSC sheet</div>
        <div class="step-line" id="stepWithheld">3. Withheld sheet</div>
        <div class="step-line" id="stepFinish">4. Activate</div>
      </div>

      <div id="msg" class="msg"></div>

      <div class="manual-box" id="manualBox">
        <strong>Sheet write failed</strong>
        <p class="muted" id="manualHint" style="margin:0 0 0.35rem;"></p>
        <ol>
          <li>Download CSV</li>
          <li>Open the sheet → File → Import → Replace current sheet</li>
          <li>Click Activate</li>
        </ol>
        <div class="manual-row">
          <span class="manual-label">NSC</span>
          <a class="link-btn ghost" id="nscSheetLink" href="#" target="_blank" rel="noopener">Open sheet</a>
          <button type="button" class="ghost" id="dlNscCsv">CSV</button>
        </div>
        <div class="manual-row">
          <span class="manual-label">Withheld</span>
          <a class="link-btn ghost" id="whSheetLink" href="#" target="_blank" rel="noopener">Open sheet</a>
          <button type="button" class="ghost" id="dlWhCsv">CSV</button>
        </div>
        <div class="row">
          <button type="button" class="primary" id="activateAfterManual" disabled>Activate</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="/nsc/nsc_client_pipeline.js?v=110"></script>
  <script src="/mzo_data_hub.js"></script>
  <script src="/lib/sheet_mirror_client.js?v=109"></script>
  <script>
    const metaBox = document.getElementById('metaBox');
    const msg = document.getElementById('msg');
    const fileInput = document.getElementById('fileInput');
    const reportDateInput = document.getElementById('reportDateInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadBlock = document.getElementById('uploadBlock');
    const progressPanel = document.getElementById('progressPanel');
    const barFill = document.getElementById('barFill');
    const progressLabel = document.getElementById('progressLabel');
    const retryBox = document.getElementById('retryBox');
    const manualBox = document.getElementById('manualBox');
    const manualHint = document.getElementById('manualHint');
    const nscSheetLink = document.getElementById('nscSheetLink');
    const whSheetLink = document.getElementById('whSheetLink');
    const activateAfterManual = document.getElementById('activateAfterManual');
    const FALLBACK_NSC_SHEET =
      'https://docs.google.com/spreadsheets/d/1QnmPKSAtwmW-m1-gn4qmZBWanx9_Vwbk63XhwyQBiKU/edit';
    const FALLBACK_WH_SHEET =
      'https://docs.google.com/spreadsheets/d/12nS8GAQ1weIMWoEIeydcdKTKd-XwHNu9W07DKudGuOg/edit';
    const WITHHELD_CHUNK_ROWS = 600;

    let sheetScriptUrl = '';
    let withheldSheetScriptUrl = '';
    let nscSheetEditUrl = FALLBACK_NSC_SHEET;
    let withheldSheetEditUrl = FALLBACK_WH_SHEET;
    let lastJob = null;
    let progressState = {
      pendingTotal: 0,
      withheldTotal: 0,
      pendingSent: 0,
      withheldSent: 0,
      phase: 'idle',
      retryNote: ''
    };

    function toIsoDate(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function guessDateFromFileName(name) {
      const m = String(name || '').match(/(\d{2})[-_.](\d{2})[-_.](\d{4})/);
      if (!m) return null;
      return `${m[3]}-${m[2]}-${m[1]}`;
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString('en-IN');
    }

    reportDateInput.value = toIsoDate(new Date());

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const guessed = guessDateFromFileName(file.name);
      if (guessed) reportDateInput.value = guessed;
    });

    function showMsg(text, ok) {
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
      msg.textContent = text;
    }

    function hideRetryBox() {
      retryBox.classList.remove('show');
      retryBox.textContent = '';
      progressState.retryNote = '';
    }

    function showRetryBox(text) {
      retryBox.textContent = text;
      retryBox.classList.add('show');
    }

    function sheetLabel() {
      return progressState.phase === 'withheld' ? 'Withheld' : 'Working/Accepted';
    }

    function onSheetRetry(info) {
      const infoObj = info || {};
      if (infoObj.kind === 'restart') {
        if (progressState.phase === 'pending') progressState.pendingSent = 0;
        if (progressState.phase === 'withheld') progressState.withheldSent = 0;
        const tryNo = infoObj.tabTry || (infoObj.attempt || 0) + 1;
        const tryMax = infoObj.tabTries || 3;
        progressState.retryNote =
          'Restarting ' + sheetLabel() + ' (' + tryNo + '/' + tryMax + ')…';
        showRetryBox(progressState.retryNote);
        updateProgressUi();
        return;
      }
      const chunkPart =
        infoObj.chunkSeq != null ? ' chunk ' + (Number(infoObj.chunkSeq) + 1) : '';
      const waitSec = Math.max(1, Math.round((infoObj.waitMs || 1000) / 1000));
      progressState.retryNote =
        'Retry' +
        chunkPart +
        ' ' +
        (infoObj.attempt || 1) +
        '/' +
        (infoObj.maxAttempts || 8) +
        ' in ' +
        waitSec +
        's';
      showRetryBox(progressState.retryNote);
      updateProgressUi();
    }

    function downloadTextFile(filename, text) {
      const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    function nscCsvOf(job) {
      if (!job || !job.result) return '';
      const r = job.result;
      if (r.csv) return r.csv;
      return NSCClientPipeline.toCsv(r.published || []);
    }

    function withheldCsvOf(job) {
      if (!job || !job.result) return '';
      const r = job.result;
      if (r.withheldCsv) return r.withheldCsv;
      const cols = NSCClientPipeline.WITHHELD_COLUMNS;
      return NSCClientPipeline.toCsv(r.withheld || [], cols);
    }

    function hideManualBox() {
      manualBox.classList.remove('show');
      activateAfterManual.disabled = true;
    }

    function showManualFallback(failedPhase) {
      const job = lastJob;
      if (!job || !job.result) return;
      if (failedPhase === 'withheld') manualHint.textContent = 'Import Withheld CSV into Sheet1.';
      else if (failedPhase === 'pending') manualHint.textContent = 'Import NSC CSV into nsc_working.';
      else if (failedPhase === 'finish') manualHint.textContent = 'Sheets may already be updated. Click Activate.';
      else manualHint.textContent = '';
      nscSheetLink.href = nscSheetEditUrl || FALLBACK_NSC_SHEET;
      whSheetLink.href = withheldSheetEditUrl || FALLBACK_WH_SHEET;
      activateAfterManual.disabled = false;
      manualBox.classList.add('show');
    }

    function setStep(id, text, done) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('done', !!done);
    }

    function updateProgressUi() {
      const p = progressState;
      document.getElementById('sentPending').textContent =
        fmt(p.pendingSent) + ' / ' + fmt(p.pendingTotal);
      document.getElementById('sentWithheld').textContent =
        fmt(p.withheldSent) + ' / ' + fmt(p.withheldTotal);

      const total = p.pendingTotal + p.withheldTotal;
      const sent = p.pendingSent + p.withheldSent;
      let pct = total > 0 ? Math.round((sent / total) * 100) : 0;
      if (p.phase === 'process') pct = Math.max(pct, 2);
      if (p.phase === 'finish') pct = Math.max(pct, 98);
      if (p.phase === 'done') pct = 100;
      barFill.style.width = pct + '%';

      if (p.retryNote) {
        progressLabel.textContent = p.retryNote;
      } else if (p.phase === 'process') progressLabel.textContent = 'Processing…';
      else if (p.phase === 'pending') {
        progressLabel.textContent = 'NSC ' + fmt(p.pendingSent) + ' / ' + fmt(p.pendingTotal);
      } else if (p.phase === 'withheld') {
        progressLabel.textContent = 'Withheld ' + fmt(p.withheldSent) + ' / ' + fmt(p.withheldTotal);
      } else if (p.phase === 'finish') progressLabel.textContent = 'Activating…';
      else if (p.phase === 'done') progressLabel.textContent = 'Done';
      else progressLabel.textContent = 'Waiting…';
    }

    async function readJsonSafe(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        const trimmed = text.trim();
        if (/request entity too large/i.test(trimmed)) {
          throw new Error('Chunk too large to publish. Contact an admin.');
        }
        throw new Error('Upload failed. Please try again or contact an admin.');
      }
    }

    function renderAdminMeta(data) {
      const m = data.meta;
      if (!m) {
        metaBox.classList.remove('show');
        metaBox.textContent = '';
        return;
      }
      const s = m.stats || {};
      const nsc = m.publishedRows ?? s.publishedRows ?? '-';
      const wh = m.withheldRows ?? s.withheldRows ?? '-';
      const when = m.reportDate || s.today || m.uploadedAt || '-';
      metaBox.textContent = 'Last: ' + when + ' · NSC ' + fmt(nsc) + ' · Withheld ' + fmt(wh);
      metaBox.classList.add('show');
    }

    function hideAdminDetails() {
      metaBox.classList.remove('show');
      metaBox.textContent = '';
    }

    async function probeScript(url, expectedTab) {
      if (!url) return expectedTab + ': not configured';
      try {
        const res = await fetch(url, { credentials: 'omit' });
        const data = await res.json();
        if (!res.ok || data.status === 'error') {
          return expectedTab + ': error';
        }
        const tab = String(data.tab || '');
        if (tab && tab !== expectedTab) {
          return expectedTab + ': wrong tab';
        }
        return '';
      } catch (e) {
        return expectedTab + ': unreachable';
      }
    }

    async function updateMirrorStatus() {
      const el = document.getElementById('mirrorBox');
      if (!el) return;
      if (!sheetScriptUrl && !withheldSheetScriptUrl) {
        el.textContent = 'Sheet connection is off.';
        el.classList.add('show');
        return;
      }
      const parts = await Promise.all([
        probeScript(sheetScriptUrl, 'nsc_working'),
        probeScript(withheldSheetScriptUrl, 'Sheet1')
      ]);
      const bad = parts.filter(Boolean);
      if (bad.length) {
        el.textContent = bad.join(' · ');
        el.classList.add('show');
      } else {
        el.textContent = '';
        el.classList.remove('show');
      }
    }

    async function loadMeta() {
      try {
        const res = await fetch('/api/nsc/meta', { credentials: 'same-origin' });
        if (res.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();
        sheetScriptUrl = String(data.sheetScriptUrl || '').trim();
        withheldSheetScriptUrl = String(data.withheldSheetScriptUrl || '').trim();
        nscSheetEditUrl = String(data.nscSheetEditUrl || '').trim() || FALLBACK_NSC_SHEET;
        withheldSheetEditUrl = String(data.withheldSheetEditUrl || '').trim() || FALLBACK_WH_SHEET;
        nscSheetLink.href = nscSheetEditUrl;
        whSheetLink.href = withheldSheetEditUrl;
        await updateMirrorStatus();
        if (data.canUpload) {
          renderAdminMeta(data);
          uploadBlock.classList.remove('locked');
          fileInput.disabled = false;
          reportDateInput.disabled = false;
          uploadBtn.disabled = false;
        } else {
          hideAdminDetails();
          showMsg('You are not authorised to upload NSC. Please ask an admin.', false);
        }
      } catch (e) {
        showMsg('Failed to load upload page: ' + e.message, false);
      }
    }

    async function finishLiveActivate(job, done) {
      const result = job.result;
      const uploadId = job.uploadId;
      const reportDate = job.reportDate;
      progressState.phase = 'done';
      setStep('stepFinish', '4. Activate', true);
      updateProgressUi();
      hideManualBox();

      const m = (done && done.meta) || {};
      const s = m.stats || {};
      const reportLabel = m.reportDate || s.today || result.reportDateUsed || reportDate;
      const published = m.publishedRows ?? result.published.length;
      const withheld = m.withheldRows ?? result.withheld.length;
      const keptWithheld = !!(done && (done.withheldKept || (done.meta && done.meta.withheldKept)))
        || !(result.withheld && result.withheld.length);

      showMsg(
        'Published. ' + reportLabel +
          ' · NSC ' + fmt(published) +
          (keptWithheld
            ? ' · Withheld kept previous (' + fmt(withheld) + ')'
            : ' · Withheld ' + fmt(withheld)),
        true
      );

      await loadMeta();
      try {
        localStorage.removeItem('mzo_last_sync_date');
        localStorage.removeItem('mzoDataSynced');
        localStorage.removeItem('mzo_nsc_seen_version');
        localStorage.removeItem('mzo_nsc_dismissed_version');
        if (typeof mzoDataHub !== 'undefined' && typeof mzoDataHub.seedDataset === 'function') {
          const ver = (done && done.meta && (done.meta.supabaseUploadId || done.version)) || uploadId;
          await mzoDataHub.seedDataset('CACHE_NSC_v5', nscCsvOf(job), ver);
          if (typeof mzoDataHub.delete === 'function') {
            await mzoDataHub.delete('CACHE_NSC_PARSED_v5');
            await mzoDataHub.delete('CACHE_NSC_PARSED_v7');
          }
          if (!keptWithheld && result.withheld && result.withheld.length) {
            if (typeof mzoDataHub.delete === 'function') {
              await mzoDataHub.delete('CACHE_WITHHELD_PARSED_v4');
            }
            await mzoDataHub.seedDataset(
              'CACHE_WITHHELD_v4',
              withheldCsvOf(job),
              (done && done.withheldVersion) || ver
            );
          }
        }
      } catch (_) {}
      try {
        const ch = new BroadcastChannel('mzo-nsc');
        ch.postMessage({
          type: 'nsc-uploaded',
          reportDate: reportLabel,
          publishedRows: published,
          withheldRows: withheld,
          at: Date.now()
        });
        ch.close();
      } catch (_) {}
      try {
        const ch2 = new BroadcastChannel('mzo-withheld');
        if (!keptWithheld) {
          ch2.postMessage({
            type: 'withheld-uploaded',
            reportDate: reportLabel,
            withheldRows: withheld,
            at: Date.now()
          });
        }
        ch2.close();
      } catch (_) {}
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await readJsonSafe(res);
      if (!res.ok || data.status !== 'success') {
        throw new Error(data.message || ('Request failed (' + res.status + ')'));
      }
      return data;
    }

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        showMsg('Choose a file first.', false);
        return;
      }
      const reportDate = (reportDateInput.value || '').trim();
      if (!reportDate) {
        showMsg('Select the data date.', false);
        return;
      }
      if (!window.NSCClientPipeline || typeof NSCClientPipeline.processNscArrayBuffer !== 'function') {
        showMsg('Upload scripts failed to load. Refresh the page and try again.', false);
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Working…';
      progressPanel.classList.add('show');
      hideRetryBox();
      hideManualBox();
      lastJob = null;
      progressState = {
        pendingTotal: 0,
        withheldTotal: 0,
        pendingSent: 0,
        withheldSent: 0,
        phase: 'process',
        retryNote: ''
      };
      setStep('stepProcess', '1. Process', false);
      setStep('stepPending', '2. NSC sheet', false);
      setStep('stepWithheld', '3. Withheld sheet', false);
      setStep('stepFinish', '4. Activate', false);
      updateProgressUi();
      msg.className = 'msg';
      msg.textContent = '';

      try {
        const buffer = await file.arrayBuffer();
        const result = NSCClientPipeline.processNscArrayBuffer(buffer, reportDate, file.name);

        progressState.pendingTotal = result.published.length;
        progressState.withheldTotal = result.withheld.length;
        progressState.phase = 'pending';
        setStep('stepProcess', '1. Process', true);
        updateProgressUi();

        lastJob = {
          result,
          reportDate,
          originalName: file.name,
          uploadId: null,
          failedPhase: 'pending',
          keepPreviousWithheld: !(result.withheld && result.withheld.length)
        };

        const begin = await postJson('/api/nsc/publish/begin', {
          reportDate,
          reportDateUsed: result.reportDateUsed || '',
          originalName: file.name,
          sheetName: result.sheetName || '',
          publishedRows: result.published.length,
          withheldRows: result.withheld.length,
          stats: result.stats || {}
        });
        const uploadId = begin.uploadId;
        lastJob.uploadId = uploadId;
        const nscHeaders = (NSCClientPipeline.OUTPUT_COLUMNS || []);
        const withheldHeaders = (NSCClientPipeline.WITHHELD_COLUMNS || nscHeaders);
        const useSheet =
          !!(window.MzoSheetMirror) && !!sheetScriptUrl && !!withheldSheetScriptUrl;

        if (useSheet) {
          setStep('stepPending', '2. NSC sheet', false);
          await MzoSheetMirror.publishTab(
            sheetScriptUrl,
            'nsc',
            nscHeaders,
            result.published,
            (n) => {
              hideRetryBox();
              progressState.pendingSent += n;
              updateProgressUi();
            },
            'nsc_working',
            onSheetRetry
          );
          setStep('stepPending', '2. NSC sheet', true);

          const keepPreviousWithheld = !(result.withheld && result.withheld.length);
          progressState.phase = 'withheld';
          lastJob.failedPhase = 'withheld';
          lastJob.keepPreviousWithheld = keepPreviousWithheld;
          updateProgressUi();
          if (keepPreviousWithheld) {
            setStep('stepWithheld', '3. Withheld sheet (kept previous)', true);
          } else {
            setStep('stepWithheld', '3. Withheld sheet', false);
            await MzoSheetMirror.publishTab(
              withheldSheetScriptUrl,
              'withheld',
              withheldHeaders,
              result.withheld,
              (n) => {
                hideRetryBox();
                progressState.withheldSent += n;
                updateProgressUi();
              },
              'Sheet1',
              onSheetRetry,
              WITHHELD_CHUNK_ROWS
            );
            setStep('stepWithheld', '3. Withheld sheet', true);
          }
        } else {
          throw new Error('Sheet connection is not ready.');
        }

        hideRetryBox();
        lastJob.failedPhase = 'finish';
        progressState.phase = 'finish';
        setStep('stepFinish', '4. Activate', false);
        updateProgressUi();

        const done = await postJson('/api/nsc/publish/complete', {
          uploadId,
          reportDate,
          reportDateUsed: result.reportDateUsed || '',
          originalName: file.name,
          sheetName: result.sheetName || '',
          publishedRows: result.published.length,
          withheldRows: result.withheld.length,
          keepPreviousWithheld: !!(lastJob && lastJob.keepPreviousWithheld),
          stats: result.stats || {}
        });
        await finishLiveActivate(lastJob, done);
      } catch (e) {
        const raw = e.message || String(e);
        const friendly =
          window.MzoSheetMirror && typeof MzoSheetMirror.friendlyRetryMessage === 'function'
            ? MzoSheetMirror.friendlyRetryMessage(e)
            : raw;
        let failMsg = friendly || raw;
        if (/web page|echo 404|GET metadata|timed out|network|rate-limit|rate-limiting/i.test(raw + ' ' + friendly)) {
          failMsg = 'Sheet write failed. Import CSV below, then Activate.';
        } else if (/defective_meter_publish|Invalid action/i.test(raw)) {
          failMsg = 'Wrong Apps Script on this sheet.';
        }
        hideRetryBox();
        showMsg(failMsg, false);
        progressState.retryNote = '';
        progressLabel.textContent = 'Failed';
        if (lastJob && lastJob.result) {
          showManualFallback(lastJob.failedPhase || progressState.phase);
        }
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });

    document.getElementById('dlNscCsv').addEventListener('click', () => {
      const csv = nscCsvOf(lastJob);
      if (!csv) {
        showMsg('Process a file first.', false);
        return;
      }
      downloadTextFile('nsc_working.csv', csv);
    });
    document.getElementById('dlWhCsv').addEventListener('click', () => {
      const csv = withheldCsvOf(lastJob);
      if (!csv) {
        showMsg('Process a file first.', false);
        return;
      }
      downloadTextFile('withheld.csv', csv);
    });
    activateAfterManual.addEventListener('click', async () => {
      if (!lastJob || !lastJob.result) {
        showMsg('Process a file first.', false);
        return;
      }
      activateAfterManual.disabled = true;
      uploadBtn.disabled = true;
      try {
        const result = lastJob.result;
        const reportDate = lastJob.reportDate;
        if (!lastJob.uploadId) {
          const begin = await postJson('/api/nsc/publish/begin', {
            reportDate,
            reportDateUsed: result.reportDateUsed || '',
            originalName: lastJob.originalName || result.originalName || '',
            sheetName: result.sheetName || '',
            publishedRows: result.published.length,
            withheldRows: result.withheld.length,
            stats: result.stats || {}
          });
          lastJob.uploadId = begin.uploadId;
        }
        progressState.phase = 'finish';
        setStep('stepFinish', '4. Activate', false);
        updateProgressUi();
        const done = await postJson('/api/nsc/publish/complete', {
          uploadId: lastJob.uploadId,
          reportDate,
          reportDateUsed: result.reportDateUsed || '',
          originalName: lastJob.originalName || result.originalName || '',
          sheetName: result.sheetName || '',
          publishedRows: result.published.length,
          withheldRows: result.withheld.length,
          keepPreviousWithheld: !!(lastJob.keepPreviousWithheld || !(result.withheld && result.withheld.length)),
          stats: result.stats || {}
        });
        await finishLiveActivate(lastJob, done);
      } catch (err) {
        showMsg(
          ((err && err.message) || String(err)) + '\nTry Activate again.',
          false
        );
        activateAfterManual.disabled = false;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });

    loadMeta();
  </script>
</body>
</html>
