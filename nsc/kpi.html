<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KPI Dashboard</title>
  <link rel="stylesheet" href="styles.css?v=3" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="../mzo_data_hub.js?v=38"></script>
  <script src="../mzo_scope.js?v=4"></script>
  <script src="../mzo_presets_hub.js"></script>
</head>
<body class="kpi-page">
  <header class="header kpi-header">
    <div class="container kpi-header-inner">
      <h1>NSC KPIs</h1>
      <p class="subtitle">Updated: <span id="todayDateSubtitle">Loading…</span></p>
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <!-- Breakdown Modal -->
      <div class="modal" id="breakdownModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="breakdownModalTitle">Office Breakdown</h3>
            <span class="close" onclick="closeBreakdownModal()">&times;</span>
          </div>
          <div class="modal-body">
            <!-- Tab Navigation -->
            <div class="tab-nav">
              <button class="tab-link active" data-kpi-tab="region" onclick="openTab(event, 'RegionTab')">Region</button>
              <button class="tab-link" data-kpi-tab="division" onclick="openTab(event, 'DivisionTab')">Division</button>
              <button class="tab-link" data-kpi-tab="ccc" onclick="openTab(event, 'CCCTab')">CCC</button>
            </div>

            <!-- Tab Content -->
            <div id="RegionTab" class="tab-content" style="display: block;">
              <div class="kpi-table-wrapper">
                <table class="kpi-table" id="modalRegionTable">
                  <!-- Header and body will be populated by JS -->
                </table>
              </div>
            </div>

            <div id="DivisionTab" class="tab-content">
              <div class="kpi-table-wrapper">
                <table class="kpi-table" id="modalDivisionTable">
                  <!-- Header and body will be populated by JS -->
                </table>
              </div>
            </div>

            <div id="CCCTab" class="tab-content">
              <div class="kpi-table-wrapper">
                <table class="kpi-table" id="modalCCCTable">
                  <!-- Header and body will be populated by JS -->
                </table>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="control-panel kpi-filter-panel">
        <div class="checkbox-group" id="classCheckboxes">
          <!-- Checkboxes will be dynamically inserted here -->
        </div>
      </div>

      <div class="average-delay-cards" id="averageDelayCards">
        <!-- Average delay cards will be dynamically inserted here -->
      </div>

      <hr class="kpi-section-rule" />

      <h4 class="kpi-summary-title">KPI Summary</h4>

      <div class="kpi-table-wrapper">
        <!-- Region-wise Table -->
        <div class="kpi-block" id="kpiRegionBlock">
          <h5>Region-wise</h5>
          <table id="kpiRegionTable" class="kpi-table">
            <thead>
              <tr>
                <th data-sort="name">Region <span class="sort-icon"></span></th>
                <th data-sort="Qtn">Qtn Delay <span class="sort-icon"></span></th>
                <th data-sort="WO">WO Delay <span class="sort-icon"></span></th>
                <th data-sort="Conn">Conn Delay <span class="sort-icon"></span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="kpi-block" id="kpiDivisionBlock">
          <h5>Division-wise</h5>
          <table id="kpiDivisionTable" class="kpi-table">
            <thead>
              <tr>
                <th data-sort="name">Division <span class="sort-icon"></span></th>
                <th data-sort="Qtn">Qtn Delay <span class="sort-icon"></span></th>
                <th data-sort="WO">WO Delay <span class="sort-icon"></span></th>
                <th data-sort="Conn">Conn Delay <span class="sort-icon"></span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="kpi-block" id="kpiCCCBlock">
          <h5>CCC-wise</h5>
          <table id="kpiCCCTable" class="kpi-table">
            <thead>
              <tr>
                <th data-sort="name">CCC <span class="sort-icon"></span></th>
                <th data-sort="Qtn">Qtn Delay <span class="sort-icon"></span></th>
                <th data-sort="WO">WO Delay <span class="sort-icon"></span></th>
                <th data-sort="Conn">Conn Delay <span class="sort-icon"></span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="kpi.js"></script>
</body>
</html>
