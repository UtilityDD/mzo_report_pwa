<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NSC KPIs · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>.rk { margin-left: 6px; font-size: 11.5px; color: var(--mzo-faint); }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>NSC KPIs</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      </div>
    </header>

    <section class="ui-stats" style="--n:3" id="stats" aria-label="Average delays">
      <button type="button" class="ui-stat" data-k="qtn"><div class="k">Quotation delay</div><div class="v"><span class="ui-skel"></span></div><div class="s">Average days</div></button>
      <button type="button" class="ui-stat" data-k="wo"><div class="k">Work order delay</div><div class="v"><span class="ui-skel"></span></div><div class="s">Average days</div></button>
      <button type="button" class="ui-stat" data-k="conn"><div class="k">Connection delay</div><div class="v"><span class="ui-skel"></span></div><div class="s">Average days</div></button>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="tableTitle">By office</h2>
        <div class="ui-tabs" role="tablist" id="levelTabs">
          <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
          <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
          <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
        </div>
      </div>
      <div id="officeTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var all = [], metric = 'conn', level = 'region';
    var LABEL = { qtn: 'Quotation', wo: 'Work order', conn: 'Connection' };

    function prepare(text) {
      var map = new Map(), latest = 0;
      UI.csv(text).forEach(function (d) { var a = String(d.APPL_NO || '').trim().toLowerCase(); if (a) map.set(a, d); }); // one row per application (last wins)
      all = Array.from(map.values()).map(function (d) {
        var t = UI.date(d.TODAY); if (t && t.getTime() > latest) latest = t.getTime();
        var o = UI.office(d.CCC_CODE, d.SUPP_OFF);
        return {
          REGION: d.REGION, DIVN_NAME: d.DIVN_NAME, SUPP_OFF: d.SUPP_OFF, CCC_CODE: d.CCC_CODE,
          region: o.region || UI.regionName(d.REGION), division: o.division || UI.title(String(d.DIVN_NAME || '').replace(/\s*div(ision)?\.?$/i, '')), ccc: o.ccc || UI.title(d.SUPP_OFF || d.CCC_CODE),
          cls: String(d.CONN_CLASS || '').trim(),
          qtn: parseInt(d.DelayInQtn, 10) || 0, wo: parseInt(d.DelayInWO, 10) || 0, conn: parseInt(d.DelayInSC, 10) || 0
        };
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      $('meta').textContent = (latest ? 'Updated ' + UI.fmtDate(new Date(latest)) + ' · ' : '') + UI.n(all.length) + ' applications';
      var cls = {}; all.forEach(function (r) { if (r.cls) cls[r.cls] = 1; });
      UI.fill('classFilter', Object.keys(cls).sort(), 'All classes');
      var sc = window.MzoScope && window.MzoScope.getScope();
      if (sc && !sc.unscoped) {
        level = sc.level === 'region' ? 'division' : 'ccc';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) {
          var l = t.getAttribute('data-l');
          t.hidden = (l === 'region' && sc.level !== 'region') || (l === 'division' && (sc.level === 'ccc' || sc.level === 'codes'));
        });
      }
    }

    function avg(rows, k) { return rows.length ? rows.reduce(function (a, r) { return a + r[k]; }, 0) / rows.length : 0; }

    function render() {
      var cls = $('classFilter').value;
      var view = all.filter(function (r) { return !cls || r.cls === cls; });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        el.querySelector('.v').textContent = view.length ? avg(view, k).toFixed(1) : '—';
        el.setAttribute('aria-pressed', String(k === metric));
      });
      var key = level, groups = {};
      view.forEach(function (r) { var n = r[key] || 'Unmapped'; (groups[n] || (groups[n] = [])).push(r); });
      var rows = Object.keys(groups).map(function (n) {
        var g = groups[n];
        return { name: n, n: g.length, qtn: avg(g, 'qtn'), wo: avg(g, 'wo'), conn: avg(g, 'conn'), parent: level === 'ccc' ? g[0].division : level === 'division' ? g[0].region : '' };
      });
      var rank = {};
      ['qtn', 'wo', 'conn'].forEach(function (k) { var s = rows.map(function (r) { return r[k]; }).sort(function (a, b) { return a - b; }); rank[k] = function (v) { return s.indexOf(v) + 1; }; });
      var cell = function (k) { return function (v) { return v.toFixed(1) + '<span class="rk">#' + rank[k](v) + '</span>'; }; };
      $('tableTitle').textContent = 'By office · lowest ' + LABEL[metric].toLowerCase() + ' delay first';
      UI.table('officeTable', {
        rows: rows, sort: { key: metric, dir: 'asc' }, count: false, empty: 'No applications for this class.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (r.parent ? '<span class="sub">' + UI.esc(r.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Applications', num: true, fmt: UI.n },
          { key: 'qtn', label: 'Quotation (days)', num: true, fmt: cell('qtn') },
          { key: 'wo', label: 'Work order (days)', num: true, fmt: cell('wo') },
          { key: 'conn', label: 'Connection (days)', num: true, fmt: cell('conn') }
        ]
      });
    }

    $('classFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; metric = s.getAttribute('data-k'); var el = $('officeTable'); if (el.__ui) el.__ui.sort = { key: metric, dir: 'asc' }; render(); });
    $('levelTabs').addEventListener('click', function (e) {
      var t = e.target.closest('.ui-tab'); if (!t) return;
      level = t.getAttribute('data-l');
      [].forEach.call(this.querySelectorAll('.ui-tab'), function (x) { x.setAttribute('aria-selected', String(x === t)); });
      render();
    });

    UI.load('CACHE_NSC_v5', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = '<div class="ui-empty">Could not load NSC data.</div>'; } return; }
      prepare(text);
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      render();
    });
  });
  </script>
</body>
</html>
