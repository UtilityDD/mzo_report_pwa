<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upcoming DD · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <script src="/mzo_rows.js?v=6" defer></script>
  <style>
    .rem-hint {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--mzo-muted);
      border-bottom: 1px solid var(--mzo-border);
    }
    .dd-notes { padding: 4px 20px 24px; }
    .dd-notes h4 { margin: 8px 0 10px; font-size: 13px; font-weight: 600; }
    .dd-notes form { display: grid; gap: 8px; margin-bottom: 14px; }
    .dd-notes .row2 { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px; }
    .dd-notes select, .dd-notes input, .dd-notes textarea { width: 100%; }
    .dd-notes textarea { height: 64px; padding: 8px 10px; resize: vertical; }
    .dd-notes .ui-input { padding: 0 10px; }
    .dd-note { padding: 10px 0; border-top: 1px solid var(--mzo-border); font-size: 13px; }
    .dd-note .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
    .dd-note .h span { color: var(--mzo-muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
    .dd-note p { margin: 3px 0 0; color: var(--mzo-text-2); }
    .rd-copy { margin-left: auto; margin-right: 2px; }
    .ui-stat .s { font-size: 11px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Upcoming DD <span class="ui-badge ui-date" id="asOn"></span></h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Consumer ID, name or mobile" autocomplete="off" aria-label="Search consumers" title="Search consumers" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="DD due urgency" id="fDue"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Consumer class" id="fClass"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Outstanding amount" id="fOsd"></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" role="tablist" data-tabs>
            <button type="button" data-pane="tabPhase" aria-pressed="true" aria-selected="true">Phase</button>
            <button type="button" data-pane="tabGovt" aria-pressed="false" aria-selected="false">Govt</button>
          </div>
          <div id="tabPhase"><div id="fPhase"></div></div>
          <div id="tabGovt" hidden><div id="fGovt"></div></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">All consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="over"><div class="k"><span class="ui-dot bad"></span>DD overdue</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="week"><div class="k"><span class="ui-dot warn"></span>Due in 7 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="month"><div class="k">Due in 8–30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="clear"><div class="k"><span class="ui-dot ok"></span>Arrears cleared</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title" id="tableTitle">Detailed analysis</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="rem-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/1aUeVnSc-OmFqqrUdoZxv8v8659u52zlIWddnpJgU9Uk/gviz/tq?tqx=out:csv&gid=487034861';
    var NOTES_KEY = 'mzo_upcoming_dd_notes';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', P: 'Public' };
    var BUCKET = [
      { key: 'OVERDUE', label: 'Overdue' },
      { key: 'TODAY', label: 'Today' },
      { key: '7D', label: 'In 1–7 days' },
      { key: '15D', label: 'In 8–15 days' },
      { key: '30D', label: 'In 16–30 days' },
      { key: 'FUTURE', label: 'Later' },
      { key: 'CLEARED', label: 'Arrears cleared' }
    ];
    var OSD_BUCKETS = [
      { key: '', label: 'Any outstanding' },
      { key: '25000', label: 'Over ₹25,000' },
      { key: '50000', label: 'Over ₹50,000' },
      { key: '100000', label: 'Over ₹1 lakh' },
      { key: '200000', label: 'Over ₹2 lakh' }
    ];
    var STATUS = [
      'Visited - Promised Payment', 'Visited - Found Disconnected', 'Visited - Found Live (Unauthorized)',
      'Visited - Premises Closed/Not Found', 'Call Connected - Promised Payment', 'Call Connected - Disputed Bill', 'Paid / Cleared Arrears'
    ];
    var TABS = [
      { id: 'region', label: 'Region' },
      { id: 'division', label: 'Division' },
      { id: 'ccc', label: 'CCC' },
      { id: 'consumers', label: 'Consumers' },
      { id: 'due', label: 'Due Aging' },
      { id: 'class', label: 'Consumer Class' },
      { id: 'osd', label: 'Outstanding Slices' }
    ];

    var all = [], f = { q: '', stat: '', bucket: '', cls: '', phase: '', govt: '', osd: '' };
    var tab = 'region', scope = null;

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    function clearAll() {
      f.q = ''; f.stat = ''; f.bucket = ''; f.cls = ''; f.phase = ''; f.govt = ''; f.osd = '';
      $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
        if (!$(id).disabled) $(id).value = '';
      });
      fillFilters(); marks();
      syncUrl();
      render();
    }

    function ymd(s) {
      s = String(s || '').trim();
      if (!/^\d{8}$/.test(s)) return null;
      var d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
      return isNaN(d) ? null : d;
    }

    function rowsOf(text) { return MzoRows.build('upcoming_dd', text); }

    function prepare(t) {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      all = t.rows.map(function (d) {
        var code = d.ccc_code, osd = d.outstanding || 0;
        var dis = ymd(d.discon_dt), due = dis ? new Date(dis.getTime() + 180 * 864e5) : null, days = due ? Math.ceil((due - today) / 864e5) : null;
        var b = 'CLEARED';
        if (osd > 0) b = days == null || days < 0 ? 'OVERDUE' : days === 0 ? 'TODAY' : days <= 7 ? '7D' : days <= 15 ? '15D' : days <= 30 ? '30D' : 'FUTURE';
        return {
          con: d.con_id, name: UI.title(d.name), mobile: UI.blank(d.reg_mob_no) ? '' : d.reg_mob_no,
          address: d.address, cls: d.base_class || 'Other', phase: d.conn_phase || '1',
          govt: /^(y|yes|govt)/i.test(d.govt_stat) ? 'Y' : 'N', load: d.conn_load, meter: d.meter_no,
          code: code, CCC_CODE: code, _region: d._region, _divn: d._division, _supp: d._ccc, osd: osd, dis: dis, due: due, days: days, bucket: b
        };
      }).filter(function (r) { return r.con; });
      all.forEach(function (r) { r.search = (r.con + ' ' + r.name + ' ' + r.mobile + ' ' + r._supp).toLowerCase(); });
      var dues = all.filter(function (r) { return r.due; }).map(function (r) { return r.due.getTime(); });
      if (dues.length && $('asOn')) $('asOn').textContent = 'Due ' + UI.fmtDate(new Date(Math.min.apply(null, dues))) + ' – ' + UI.fmtDate(new Date(Math.max.apply(null, dues)));
      $('meta').textContent = 'Disconnection date + 180 days · ' + UI.n(all.length) + ' consumers';
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      if (!scope) scope = UI.lockScope();
      marks();
    }

    function marks() {
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    var STAT = {
      '': function () { return true; },
      over: function (r) { return r.bucket === 'OVERDUE'; },
      week: function (r) { return r.bucket === 'TODAY' || r.bucket === '7D'; },
      month: function (r) { return r.bucket === '15D' || r.bucket === '30D'; },
      clear: function (r) { return r.bucket === 'CLEARED'; }
    };

    function base(skip) {
      skip = skip || {};
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) &&
          (skip.cls || !f.cls || r.cls === f.cls) &&
          (skip.phase || !f.phase || r.phase === f.phase) &&
          (skip.govt || !f.govt || r.govt === f.govt) &&
          (skip.osd || !f.osd || r.osd >= +f.osd) &&
          (skip.bucket || !f.bucket || r.bucket === f.bucket) &&
          (!q || r.search.indexOf(q) !== -1);
      });
    }
    var sum = function (rows) { return rows.reduce(function (a, r) { return a + r.osd; }, 0); };

    function syncUrl() {
      var p = new URLSearchParams();
      if ($('regionFilter').value) p.set('region', $('regionFilter').value);
      if ($('divisionFilter').value) p.set('division', $('divisionFilter').value);
      if ($('cccFilter').value) p.set('ccc', $('cccFilter').value);
      if (f.q) p.set('q', f.q);
      if (f.stat) p.set('stat', f.stat);
      if (f.bucket) p.set('bucket', f.bucket);
      if (f.cls) p.set('class', f.cls);
      if (f.phase) p.set('phase', f.phase);
      if (f.govt) p.set('govt', f.govt);
      if (f.osd) p.set('osd', f.osd);
      if (tab !== 'region') p.set('tab', tab);
      var qs = p.toString();
      var url = location.pathname + (qs ? '?' + qs : '');
      if (location.search !== (qs ? '?' + qs : '')) history.replaceState(null, '', url);
    }

    function render() {
      var b = base(), view = b.filter(STAT[f.stat]);

      // Update KPI strip
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(STAT[k]);
        el.querySelector('.v').textContent = UI.n(rows.length);
        el.querySelector('.s').textContent = k === 'clear' ? UI.pct(rows.length, b.length) + ' of consumers' : UI.inr(sum(rows)) + ' outstanding';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      // Facets
      var forDue = base({ bucket: true }).filter(STAT[f.stat]);
      var dueItems = [{ value: '', label: 'All', count: forDue.length }].concat(BUCKET.map(function (bk) {
        return { value: bk.key, label: bk.label, count: forDue.filter(function (r) { return r.bucket === bk.key; }).length };
      }));
      UI.facet($('fDue'), dueItems, f.bucket, function (key) { f.bucket = key; syncUrl(); render(); });

      var forClass = base({ cls: true }).filter(STAT[f.stat]);
      var cc = {}; forClass.forEach(function (r) { cc[r.cls] = (cc[r.cls] || 0) + 1; });
      var classItems = [{ value: '', label: 'All classes', count: forClass.length }].concat(Object.keys(cc).sort(function (a, b) { return cc[b] - cc[a]; }).map(function (k) {
        return { value: k, label: CLASS[k] || k, count: cc[k] };
      }));
      UI.facet($('fClass'), classItems, f.cls, function (key) { f.cls = key; syncUrl(); render(); });

      var forOsd = base({ osd: true }).filter(STAT[f.stat]);
      var osdItems = OSD_BUCKETS.map(function (ob) {
        var min = +ob.key || 0;
        return { value: ob.key, label: ob.label, count: min ? forOsd.filter(function (r) { return r.osd >= min; }).length : forOsd.length };
      });
      UI.facet($('fOsd'), osdItems, f.osd, function (key) { f.osd = key; syncUrl(); render(); });

      var forPhase = base({ phase: true }).filter(STAT[f.stat]);
      UI.facet($('fPhase'), [
        { value: '', label: 'Any phase', count: forPhase.length },
        { value: '1', label: 'Single phase', count: forPhase.filter(function (r) { return r.phase === '1'; }).length },
        { value: '3', label: 'Three phase', count: forPhase.filter(function (r) { return r.phase === '3'; }).length }
      ], f.phase, function (key) { f.phase = key; syncUrl(); render(); });

      var forGovt = base({ govt: true }).filter(STAT[f.stat]);
      UI.facet($('fGovt'), [
        { value: '', label: 'Govt & Non-govt', count: forGovt.length },
        { value: 'N', label: 'Non-government', count: forGovt.filter(function (r) { return r.govt === 'N'; }).length },
        { value: 'Y', label: 'Government', count: forGovt.filter(function (r) { return r.govt === 'Y'; }).length }
      ], f.govt, function (key) { f.govt = key; syncUrl(); render(); });

      // Active filters counting
      var hasOffice = ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; });
      var nActive = (f.q ? 1 : 0) + (f.stat ? 1 : 0) + (f.bucket ? 1 : 0) + (f.cls ? 1 : 0) + (f.phase ? 1 : 0) + (f.govt ? 1 : 0) + (f.osd ? 1 : 0) + (hasOffice ? 1 : 0);
      setActive(nActive, { tabPhase: !!f.phase, tabGovt: !!f.govt });

      // Render Tabs
      var tabsEl = $('tabs');
      tabsEl.innerHTML = TABS.map(function (t) {
        var count = '';
        if (t.id === 'consumers') count = '<small>' + UI.n(view.length) + '</small>';
        return '<button type="button" class="ui-drill-tab" role="tab" data-tab="' + t.id + '" aria-selected="' + String(tab === t.id) + '">' + t.label + count + '</button>';
      }).join('');

      var totOsd = sum(view);
      var totN = view.length;
      var avgDef = totN ? Math.round(totOsd / totN) : 0;
      var overdueN = view.filter(STAT.over).length;
      window.__view = view;

      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(totN) + ' consumers · ' + UI.inr(totOsd) + ' OSD';
      renderReportHead(view);

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        renderOfficesTab(view, totOsd, totN);
      } else if (tab === 'consumers') {
        renderConsumersTab(view);
      } else if (tab === 'due') {
        renderDueTab(view, totOsd, totN);
      } else if (tab === 'class') {
        renderClassTab(view, totOsd, totN);
      } else if (tab === 'osd') {
        renderOsdTab(view, totOsd, totN);
      }
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; syncUrl(); render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillFilters(); marks(); syncUrl(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillFilters(); marks(); syncUrl(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; marks(); syncUrl(); render(); } });
      }
      if (f.stat) {
        var statMap = { over: 'DD overdue', week: 'Due in 7 days', month: 'Due in 8–30 days', clear: 'Arrears cleared' };
        active.push({ key: 'stat', label: 'Urgency: ' + (statMap[f.stat] || f.stat), clear: function () { f.stat = ''; syncUrl(); render(); } });
      }
      if (f.bucket) {
        var bk = BUCKET.filter(function (b) { return b.key === f.bucket; })[0];
        active.push({ key: 'bucket', label: 'Due: ' + (bk ? bk.label : f.bucket), clear: function () { f.bucket = ''; syncUrl(); render(); } });
      }
      if (f.cls) {
        active.push({ key: 'cls', label: 'Class: ' + (CLASS[f.cls] || f.cls), clear: function () { f.cls = ''; syncUrl(); render(); } });
      }
      if (f.osd) {
        var oMatch = OSD_BUCKETS.filter(function (o) { return o.key === f.osd; })[0];
        active.push({ key: 'osd', label: 'Outstanding: ' + (oMatch ? oMatch.label : f.osd), clear: function () { f.osd = ''; syncUrl(); render(); } });
      }
      if (f.phase) {
        active.push({ key: 'phase', label: 'Phase: ' + (f.phase === '1' ? 'Single phase' : 'Three phase'), clear: function () { f.phase = ''; syncUrl(); render(); } });
      }
      if (f.govt) {
        active.push({ key: 'govt', label: 'Govt: ' + (f.govt === 'Y' ? 'Government' : 'Non-government'), clear: function () { f.govt = ''; syncUrl(); render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '<div class="rh-all-clear"><span class="ui-dot ok"></span><span>Showing all upcoming DD consumers</span></div>';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    function renderOfficesTab(view, totOsd, totN) {
      var key = tab === 'region' ? '_region' : tab === 'division' ? '_divn' : '_supp', g = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var x = g[name] || (g[name] = { name: name, parent: tab === 'ccc' ? r._divn : tab === 'division' ? r._region : '', n: 0, over: 0, soon: 0, osd: 0, cleared: 0 });
        x.n++;
        x.osd += r.osd;
        if (r.bucket === 'OVERDUE') x.over++;
        if (STAT.week(r) || STAT.month(r)) x.soon++;
        if (r.bucket === 'CLEARED') x.cleared++;
      });
      var list = Object.keys(g).map(function (k) {
        var o = g[k];
        o.avg = o.n ? Math.round(o.osd / o.n) : 0;
        return o;
      });
      var max = Math.max.apply(null, list.map(function (x) { return x.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'osd', dir: 'desc' },
        count: false,
        empty: 'No consumers for these filters.',
        columns: [
          {
            key: 'name',
            label: tab === 'ccc' ? 'CCC' : tab === 'division' ? 'Division' : 'Region',
            fmt: function (v, x) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : '');
            }
          },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'over', label: 'Overdue', num: true, fmt: UI.n },
          { key: 'soon', label: 'Due ≤30 days', num: true, fmt: UI.n, hideSm: true },
          { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr },
          {
            key: 'share',
            label: 'Share',
            sortVal: function (x) { return x.osd; },
            fmt: function (_, x) { return UI.bar(x.osd, max, UI.pct(x.osd, totOsd)); },
            hideSm: true,
            width: '22%'
          },
          { key: 'cleared', label: 'Cleared', num: true, fmt: UI.n, hideSm: true },
          { key: 'avg', label: 'Avg default', num: true, fmt: UI.inr, hideSm: true }
        ],
        foot: list.length > 1 ? { n: totN, over: view.filter(STAT.over).length, soon: view.filter(function (r) { return STAT.week(r) || STAT.month(r); }).length, osd: totOsd, share: 0, cleared: view.filter(STAT.clear).length, avg: totN ? Math.round(totOsd / totN) : 0 } : null,
        onRow: function (x) {
          if (tab === 'region') {
            if ($('regionFilter').disabled) return;
            $('regionFilter').value = x.name; $('divisionFilter').value = ''; $('cccFilter').value = '';
            tab = 'division';
          } else if (tab === 'division') {
            if ($('divisionFilter').disabled) return;
            $('divisionFilter').value = x.name; $('cccFilter').value = '';
            tab = 'ccc';
          } else {
            $('cccFilter').value = x.name;
            tab = 'consumers';
          }
          fillFilters(); marks(); syncUrl(); render();
        }
      });
    }

    function dueCell(r) {
      if (r.bucket === 'CLEARED') return '<span class="ui-badge ok">Cleared</span>';
      if (r.days == null) return '<span class="ui-badge bad">No date</span>';
      if (r.days < 0) return '<span class="ui-badge bad">' + UI.n(-r.days) + 'd overdue</span>';
      if (r.days === 0) return '<span class="ui-badge warn">Today</span>';
      return '<span class="ui-badge' + (r.days <= 7 ? ' warn' : '') + '">in ' + r.days + 'd</span>';
    }

    var COLS = [
      { key: 'name', label: 'Consumer', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || r.con) + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'cls', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(CLASS[v] || v) + '<span class="sub">' + (r.phase === '3' ? 'Three phase' : 'Single phase') + (r.govt === 'Y' ? ' · Govt' : '') + '</span>'; }, csv: function (r) { return CLASS[r.cls] || r.cls; } },
      { key: 'dis', label: 'Disconnected', num: true, hideSm: true, sortVal: function (r) { return r.dis ? r.dis.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.dis ? UI.fmtDate(r.dis) : ''; } },
      { key: 'due', label: 'DD due', num: true, sortVal: function (r) { return r.due ? r.due.getTime() : 0; }, fmt: function (v, r) { return (v ? UI.fmtDate(v) : '—') + '<span class="sub">' + dueCell(r) + '</span>'; }, csv: function (r) { return r.due ? UI.fmtDate(r.due) : ''; } },
      { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr, csv: function (r) { return r.osd; } }
    ];

    function renderConsumersTab(view) {
      UI.table('table', {
        rows: view,
        sort: { key: 'osd', dir: 'desc' },
        limit: 50,
        resetPage: true,
        empty: 'No consumers match these filters.',
        columns: COLS,
        onRow: detail
      });
    }

    function renderDueTab(view, totOsd, totN) {
      var list = BUCKET.map(function (bk) {
        var sub = view.filter(function (r) { return r.bucket === bk.key; });
        var osd = sum(sub);
        var n = sub.length;
        return {
          key: bk.key, label: bk.label, n: n, osd: osd,
          pctN: UI.pct(n, totN), pctOsd: UI.pct(osd, totOsd),
          avg: n ? Math.round(osd / n) : 0
        };
      });
      var maxOsd = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'osd', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Due Urgency Bucket', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'pctN', label: '% Consumers', num: true },
          { key: 'osd', label: 'Total Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', fmt: function (_, o) { return UI.bar(o.osd, maxOsd, o.pctOsd); }, width: '24%', hideSm: true },
          { key: 'avg', label: 'Avg Default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          f.bucket = f.bucket === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function renderClassTab(view, totOsd, totN) {
      var cc = {};
      view.forEach(function (r) { cc[r.cls] = (cc[r.cls] || 0) + 1; });
      var list = Object.keys(cc).map(function (k) {
        var sub = view.filter(function (r) { return r.cls === k; });
        var osd = sum(sub);
        var n = sub.length;
        return {
          key: k, label: CLASS[k] || k, n: n, osd: osd,
          pctN: UI.pct(n, totN), pctOsd: UI.pct(osd, totOsd),
          avg: n ? Math.round(osd / n) : 0
        };
      });
      var maxOsd = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'osd', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Consumer Class', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'pctN', label: '% Consumers', num: true },
          { key: 'osd', label: 'Total Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', fmt: function (_, o) { return UI.bar(o.osd, maxOsd, o.pctOsd); }, width: '24%', hideSm: true },
          { key: 'avg', label: 'Avg Default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          f.cls = f.cls === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function renderOsdTab(view, totOsd, totN) {
      var list = OSD_BUCKETS.filter(function (ob) { return ob.key; }).map(function (ob) {
        var min = +ob.key;
        var sub = view.filter(function (r) { return r.osd >= min; });
        var osd = sum(sub);
        var n = sub.length;
        return {
          key: ob.key, label: ob.label, n: n, osd: osd,
          pctN: UI.pct(n, totN), pctOsd: UI.pct(osd, totOsd),
          avg: n ? Math.round(osd / n) : 0
        };
      });
      var maxOsd = Math.max.apply(null, list.map(function (o) { return o.osd; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'osd', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Outstanding Slice', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'pctN', label: '% Consumers', num: true },
          { key: 'osd', label: 'Total Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', fmt: function (_, o) { return UI.bar(o.osd, maxOsd, o.pctOsd); }, width: '24%', hideSm: true },
          { key: 'avg', label: 'Avg Default', num: true, fmt: UI.inr, hideSm: true }
        ],
        onRow: function (o) {
          f.osd = f.osd === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    /* Visit notes: kept on this device only (same store as before). */
    function notes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; } catch (e) { return {}; } }
    function detail(r) {
      var pairs = [
        ['Consumer ID', r.con], ['Mobile', r.mobile], ['Address', r.address], ['Class', (CLASS[r.cls] || r.cls) + ' · ' + (r.phase === '3' ? 'Three phase' : 'Single phase')],
        ['Government', r.govt === 'Y' ? 'Yes' : 'No'], ['Load', r.load], ['Meter', r.meter],
        ['Disconnected on', r.dis ? UI.fmtDate(r.dis) : ''], ['DD due (180 days)', r.due ? UI.fmtDate(r.due) : ''], ['Outstanding', UI.inr(r.osd)]
      ];
      UI.drawer(r.name || r.con, [r._supp, r._divn].filter(Boolean).join(' · '), pairs);
      var head = document.querySelector('#ui-drawer header'), btn = head ? head.querySelector('.rd-copy') : null;
      if (head && !btn) {
        btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ui-btn sm rd-copy';
        btn.innerHTML = UI.icon('copy') + 'Copy';
        head.insertBefore(btn, head.lastElementChild);
      }
      if (btn) {
        btn.onclick = function () {
          var text = '*Upcoming DD*\n' + pairs.filter(function (p) { return !UI.blank(p[1]); }).map(function (p) { return '*' + p[0] + ':* ' + p[1]; }).join('\n');
          UI.copy(text).then(function () { UI.toast('Details copied'); });
        };
      }
      var sec = document.querySelector('#ui-drawer section'), old = sec ? sec.querySelector('.dd-notes') : null;
      if (old) old.remove();
      if (sec) {
        var box = document.createElement('div');
        box.className = 'dd-notes';
        box.innerHTML = '<h4>Visit notes</h4><form><div class="row2"><input class="ui-input" type="date" name="date" required /><span class="ui-select"><select name="status">' +
          STATUS.map(function (s) { return '<option>' + UI.esc(s) + '</option>'; }).join('') + '</select></span></div>' +
          '<textarea class="ui-input" name="remarks" placeholder="Details (optional)"></textarea><div><button type="submit" class="ui-btn primary sm">Save note</button> <span class="ui-note">Saved on this device</span></div></form><div class="list"></div>';
        sec.appendChild(box);
        var form = box.querySelector('form');
        form.date.value = new Date().toISOString().slice(0, 10);
        var paint = function () {
          var list = notes()[r.con] || [];
          box.querySelector('.list').innerHTML = list.map(function (n) { return '<div class="dd-note"><div class="h">' + UI.esc(n.status) + '<span>' + UI.fmtDate(n.date) + '</span></div>' + (n.remarks ? '<p>' + UI.esc(n.remarks) + '</p>' : '') + '</div>'; }).join('') || '<p class="ui-note">No visit notes yet.</p>';
        };
        paint();
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var m = notes(); (m[r.con] || (m[r.con] = [])).unshift({ date: form.date.value, status: form.status.value, remarks: form.remarks.value.trim(), createdAt: new Date().toISOString() });
          try { localStorage.setItem(NOTES_KEY, JSON.stringify(m)); } catch (err) {}
          form.remarks.value = ''; paint(); UI.toast('Note saved');
        });
      }
    }

    // Office filters
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; }
        if (id === 'divisionFilter') $('cccFilter').value = '';
        fillFilters(); marks(); syncUrl(); render();
      });
    });

    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); syncUrl(); render(); }, 180));

    // Stats click toggles urgency filter
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var k = s.getAttribute('data-k');
      f.stat = f.stat === k ? '' : k;
      syncUrl(); render();
    });

    // Tab navigation
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-tab');
      syncUrl(); render();
    });

    // Copy summary action
    $('copyBtn').addEventListener('click', function () {
      var v = window.__view || [];
      var totOsd = sum(v);
      var text = 'Upcoming DD — ' + ($('tableTitle').textContent || 'Summary') + '\n' +
        'Consumers: ' + UI.n(v.length) + '\n' +
        'Total Outstanding: ' + UI.inr(totOsd) + '\n' +
        'Overdue: ' + UI.n(v.filter(STAT.over).length) + '\n' +
        'Due in ≤30 days: ' + UI.n(v.filter(function (r) { return STAT.week(r) || STAT.month(r); }).length) + '\n' +
        ($('regionFilter').value ? 'Region: ' + $('regionFilter').value + '\n' : '') +
        ($('divisionFilter').value ? 'Division: ' + $('divisionFilter').value + '\n' : '') +
        ($('cccFilter').value ? 'CCC: ' + $('cccFilter').value + '\n' : '');
      UI.copy(text).then(function () { UI.toast('Summary copied to clipboard'); });
    });

    // Export CSV
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('upcoming-dd-' + new Date().toISOString().slice(0, 10) + '.csv', [
        { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: 'mobile', label: 'Mobile' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' },
        COLS[3], { key: 'phase', label: 'Phase' },
        { key: 'govt', label: 'Govt', csv: function (r) { return r.govt === 'Y' ? 'Yes' : 'No'; } },
        COLS[4], COLS[5], COLS[6], { key: 'bucket', label: 'Bucket' }
      ], window.__view || []);
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      if (e.target.closest('#rhClearBtn')) { clearAll(); return; }
      var btn = e.target.closest('[data-rh-clear]');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
      if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
        currentActiveFilters[idx].clear();
      }
    });

    // Read deep link params on start
    function initParams() {
      var p = new URLSearchParams(location.search);
      if (p.has('region')) $('regionFilter').value = p.get('region');
      if (p.has('division')) $('divisionFilter').value = p.get('division');
      if (p.has('ccc')) $('cccFilter').value = p.get('ccc');
      if (p.has('q')) { f.q = p.get('q'); $('q').value = f.q; }
      if (p.has('stat')) f.stat = p.get('stat');
      if (p.has('bucket')) f.bucket = p.get('bucket');
      if (p.has('class')) f.cls = p.get('class');
      if (p.has('phase')) f.phase = p.get('phase');
      if (p.has('govt')) f.govt = p.get('govt');
      if (p.has('osd')) f.osd = p.get('osd');
      if (p.has('tab')) tab = p.get('tab');
    }

    function load() {
      var b = $('refreshBtn'); b.classList.add('spin');
      (window.mzoMirror ? mzoMirror.fetch : fetch)(CSV_URL, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(rowsOf)
        .then(function (t) {
          prepare(t);
          initParams();
          if (!new URLSearchParams(location.search).has('tab')) {
            if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
            else if (scope && scope.level === 'region') tab = 'division';
          }
          marks();
          render();
        })
        .catch(function (err) {
          console.error('Failed to load upcoming DD:', err);
          $('meta').textContent = 'Could not load the DD sheet';
          $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
        })
        .then(function () { b.classList.remove('spin'); });
    }

    $('refreshBtn').addEventListener('click', load);
    load();
  });
  </script>
</body>
</html>
