<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upcoming DD · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .dd-notes { padding: 4px 20px 24px; }
    .dd-notes h4 { margin: 8px 0 10px; font-size: 13px; font-weight: 600; }
    .dd-notes form { display: grid; gap: 8px; margin-bottom: 14px; }
    .dd-notes .row2 { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px; }
    .dd-notes select, .dd-notes input, .dd-notes textarea { width: 100%; }
    .dd-notes textarea { height: 64px; padding: 8px 10px; resize: vertical; }
    .dd-notes .ui-input { padding: 0 10px; }
    .dd-note { padding: 10px 0; border-top: 1px solid var(--mzo-border); font-size: 13px; }
    .dd-note .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
    .dd-note .h span { color: var(--mzo-muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
    .dd-note p { margin: 3px 0 0; color: var(--mzo-text-2); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Upcoming DD</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Consumer ID, name or mobile" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="phaseFilter" aria-label="Phase"><option value="">Any phase</option><option value="1">Single phase</option><option value="3">Three phase</option></select></span>
      <span class="ui-select"><select id="govtFilter" aria-label="Government"><option value="">Govt and non-govt</option><option value="Y">Government</option><option value="N">Non-government</option></select></span>
      <span class="ui-select"><select id="osdFilter" aria-label="Outstanding"><option value="">Any outstanding</option><option value="25000">Over ₹25,000</option><option value="50000">Over ₹50,000</option><option value="100000">Over ₹1 lakh</option><option value="200000">Over ₹2 lakh</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="over"><div class="k"><span class="ui-dot bad"></span>DD overdue</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="week"><div class="k"><span class="ui-dot warn"></span>Due in 7 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="month"><div class="k">Due in 8–30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="clear"><div class="k"><span class="ui-dot ok"></span>Arrears cleared</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>DD due</h2></div>
          <div class="ui-panel-b"><div id="dueHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By class</h2></div>
          <div class="ui-panel-b"><div id="classHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Consumers <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/1aUeVnSc-OmFqqrUdoZxv8v8659u52zlIWddnpJgU9Uk/gviz/tq?tqx=out:csv&gid=487034861';
    var NOTES_KEY = 'mzo_upcoming_dd_notes';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', P: 'Public' };
    var BUCKET = [
      { key: 'OVERDUE', label: 'Overdue' }, { key: 'TODAY', label: 'Today' }, { key: '7D', label: 'In 1–7 days' },
      { key: '15D', label: 'In 8–15 days' }, { key: '30D', label: 'In 16–30 days' }, { key: 'FUTURE', label: 'Later' }, { key: 'CLEARED', label: 'Arrears cleared' }
    ];
    var STATUS = ['Visited - Promised Payment', 'Visited - Found Disconnected', 'Visited - Found Live (Unauthorized)', 'Visited - Premises Closed/Not Found',
      'Call Connected - Promised Payment', 'Call Connected - Disputed Bill', 'Paid / Cleared Arrears'];
    var all = [], stat = '', bucket = '', level = 'region', scope = null;

    function ymd(s) { s = String(s || '').trim(); if (!/^\d{8}$/.test(s)) return null; var d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)); return isNaN(d) ? null : d; }

    // Only the fields this page shows are kept (the sheet also carries Aadhaar, PAN, email).
    function prepare(text) {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      all = UI.csv(text).map(function (r) {
        var code = String(r.CCC_CODE || r.OFFICE_CODE || '').trim(), o = UI.office(code), osd = parseFloat(r.OUTSTANDING) || 0;
        var dis = ymd(r.DISCON_DT), due = dis ? new Date(dis.getTime() + 180 * 864e5) : null, days = due ? Math.ceil((due - today) / 864e5) : null;
        var b = 'CLEARED';
        if (osd > 0) b = days == null || days < 0 ? 'OVERDUE' : days === 0 ? 'TODAY' : days <= 7 ? '7D' : days <= 15 ? '15D' : days <= 30 ? '30D' : 'FUTURE';
        return {
          con: String(r.CON_ID || r.CONSUMER_ID || '').trim(), name: UI.title(r.NAME || r.CONSUMER_NAME || ''), mobile: UI.blank(r.REG_MOB_NO) ? '' : String(r.REG_MOB_NO).trim(),
          address: r.ADDRESS, cls: String(r.BASE_CLASS || '').trim() || 'Other', phase: String(r.CONN_PHASE || '1').trim(),
          govt: /^(y|yes|govt)/i.test(String(r.GOVT_STAT || '')) ? 'Y' : 'N', load: r.CONN_LOAD, meter: r.METER_NO,
          code: code, CCC_CODE: code, _region: o.region, _divn: o.division, _supp: o.ccc, osd: osd, dis: dis, due: due, days: days, bucket: b
        };
      }).filter(function (r) { return r.con; });
      all.forEach(function (r) { r.search = (r.con + ' ' + r.name + ' ' + r.mobile + ' ' + r._supp).toLowerCase(); });
      if (window.MzoScope) all = MzoScope.filterRows(all);
      var dues = all.filter(function (r) { return r.due; }).map(function (r) { return r.due.getTime(); });
      $('meta').textContent = 'Disconnection date + 180 days' + (dues.length ? ' · ' + UI.fmtDate(new Date(Math.min.apply(null, dues))) + ' – ' + UI.fmtDate(new Date(Math.max.apply(null, dues))) : '') + ' · ' + UI.n(all.length) + ' consumers';
      UI.fill('classFilter', uniq(all, 'cls').map(function (c) { return { value: c, label: CLASS[c] || c }; }), 'All classes');
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      if (!scope) scope = UI.lockScope();
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'phaseFilter', 'govtFilter', 'osdFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    var STAT = {
      '': function () { return true; },
      over: function (r) { return r.bucket === 'OVERDUE'; },
      week: function (r) { return r.bucket === 'TODAY' || r.bucket === '7D'; },
      month: function (r) { return r.bucket === '15D' || r.bucket === '30D'; },
      clear: function (r) { return r.bucket === 'CLEARED'; }
    };
    function base() {
      var q = $('q').value.trim().toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value,
        cls = $('classFilter').value, ph = $('phaseFilter').value, gv = $('govtFilter').value, min = +$('osdFilter').value || 0;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!cls || r.cls === cls) &&
          (!ph || r.phase === ph) && (!gv || r.govt === gv) && r.osd >= min && (!q || r.search.indexOf(q) !== -1);
      });
    }
    var sum = function (rows) { return rows.reduce(function (a, r) { return a + r.osd; }, 0); };

    function render() {
      var b = base(), view = b.filter(function (r) { return STAT[stat](r) && (!bucket || r.bucket === bucket); });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(STAT[k]);
        el.querySelector('.v').textContent = UI.n(rows.length);
        el.querySelector('.s').textContent = k === 'clear' ? UI.pct(rows.length, b.length) + ' of consumers' : UI.inr(sum(rows)) + ' outstanding';
        el.setAttribute('aria-pressed', String(stat === k));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var x = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, over: 0, soon: 0, osd: 0 });
        x.n++; x.osd += r.osd; if (r.bucket === 'OVERDUE') x.over++; if (STAT.week(r) || STAT.month(r)) x.soon++;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }), max = Math.max.apply(null, list.map(function (x) { return x.osd; }).concat([0]));
      UI.table('officeTable', {
        rows: list, sort: { key: 'osd', dir: 'desc' }, count: false, empty: 'No consumers for these filters.',
        columns: [
          { key: 'name', label: { region: 'Region', division: 'Division', ccc: 'CCC' }[level], fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'over', label: 'Overdue', num: true, fmt: UI.n },
          { key: 'soon', label: 'Due ≤30 days', num: true, fmt: UI.n, hideSm: true },
          { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.osd; }, fmt: function (_, x) { return UI.bar(x.osd, max, UI.pct(x.osd, sum(view))); }, hideSm: true, width: '22%' }
        ],
        foot: list.length > 1 ? { n: view.length, over: view.filter(STAT.over).length, soon: view.filter(function (r) { return STAT.week(r) || STAT.month(r); }).length, osd: sum(view), share: 0 } : null,
        onRow: level === 'ccc' ? null : function (x) { drill(x.name); }
      });

      var sb = b.filter(STAT[stat]);
      UI.hist('dueHist', BUCKET.map(function (bk) { return { key: bk.key, label: bk.label, value: sb.filter(function (r) { return r.bucket === bk.key; }).length }; }),
        { active: bucket, onClick: function (row) { bucket = bucket === row.key ? '' : row.key; render(); } });
      var cc = {}; view.forEach(function (r) { cc[r.cls] = (cc[r.cls] || 0) + 1; });
      UI.hist('classHist', Object.keys(cc).sort(function (a, c) { return cc[c] - cc[a]; }).slice(0, 6).map(function (k) { return { key: k, label: CLASS[k] || k, value: cc[k] }; }),
        { active: $('classFilter').value, onClick: function (row) { $('classFilter').value = $('classFilter').value === row.key ? '' : row.key; UI.mark($('classFilter')); render(); } });

      $('listCount').textContent = UI.n(view.length);
      UI.table('listTable', { rows: view, sort: { key: 'osd', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No consumers match these filters.', columns: COLS, onRow: detail });
      window.__view = view;
      $('clearBtn').hidden = !($('q').value || stat || bucket || ['classFilter', 'phaseFilter', 'govtFilter'].some(function (id) { return $(id).value; }) || +$('osdFilter').value ||
        ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    function dueCell(r) {
      if (r.bucket === 'CLEARED') return '<span class="ui-badge ok">Cleared</span>';
      if (r.days == null) return '<span class="ui-badge bad">No date</span>';
      if (r.days < 0) return '<span class="ui-badge bad">' + UI.n(-r.days) + 'd overdue</span>';
      if (r.days === 0) return '<span class="ui-badge warn">Today</span>';
      return '<span class="ui-badge' + (r.days <= 7 ? ' warn' : '') + '">in ' + r.days + 'd</span>';
    }
    var COLS = [
      { key: 'name', label: 'Consumer', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || r.con) + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'cls', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(CLASS[v] || v) + '<span class="sub">' + (r.phase === '3' ? 'Three phase' : 'Single phase') + (r.govt === 'Y' ? ' · Govt' : '') + '</span>'; }, csv: function (r) { return CLASS[r.cls] || r.cls; } },
      { key: 'dis', label: 'Disconnected', num: true, hideSm: true, sortVal: function (r) { return r.dis ? r.dis.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.dis ? UI.fmtDate(r.dis) : ''; } },
      { key: 'due', label: 'DD due', num: true, sortVal: function (r) { return r.due ? r.due.getTime() : 0; }, fmt: function (v, r) { return (v ? UI.fmtDate(v) : '—') + '<span class="sub">' + dueCell(r) + '</span>'; }, csv: function (r) { return r.due ? UI.fmtDate(r.due) : ''; } },
      { key: 'osd', label: 'Outstanding', num: true, fmt: function (v) { return '₹' + UI.n(Math.round(v)); }, csv: function (r) { return r.osd; } }
    ];

    /* Visit notes: kept on this device only (same store as before). */
    function notes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; } catch (e) { return {}; } }
    function detail(r) {
      UI.drawer(r.name || r.con, [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Consumer ID', r.con], ['Mobile', r.mobile], ['Address', r.address], ['Class', (CLASS[r.cls] || r.cls) + ' · ' + (r.phase === '3' ? 'Three phase' : 'Single phase')],
        ['Government', r.govt === 'Y' ? 'Yes' : 'No'], ['Load', r.load], ['Meter', r.meter],
        ['Disconnected on', r.dis ? UI.fmtDate(r.dis) : ''], ['DD due (180 days)', r.due ? UI.fmtDate(r.due) : ''], ['Outstanding', '₹' + UI.n(Math.round(r.osd))]
      ]);
      var sec = document.querySelector('#ui-drawer section'), old = sec.querySelector('.dd-notes');
      if (old) old.remove();
      var box = document.createElement('div');
      box.className = 'dd-notes';
      box.innerHTML = '<h4>Visit notes</h4><form><div class="row2"><input class="ui-input" type="date" name="date" required /><span class="ui-select"><select name="status">' +
        STATUS.map(function (s) { return '<option>' + UI.esc(s) + '</option>'; }).join('') + '</select></span></div>' +
        '<textarea class="ui-input" name="remarks" placeholder="Details (optional)"></textarea><div><button type="submit" class="ui-btn primary sm">Save note</button> <span class="ui-note">Saved on this device</span></div></form><div class="list"></div>';
      sec.appendChild(box);
      var f = box.querySelector('form');
      f.date.value = new Date().toISOString().slice(0, 10);
      var paint = function () {
        var list = notes()[r.con] || [];
        box.querySelector('.list').innerHTML = list.map(function (n) { return '<div class="dd-note"><div class="h">' + UI.esc(n.status) + '<span>' + UI.fmtDate(n.date) + '</span></div>' + (n.remarks ? '<p>' + UI.esc(n.remarks) + '</p>' : '') + '</div>'; }).join('') || '<p class="ui-note">No visit notes yet.</p>';
      };
      paint();
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var m = notes(); (m[r.con] || (m[r.con] = [])).unshift({ date: f.date.value, status: f.status.value, remarks: f.remarks.value.trim(), createdAt: new Date().toISOString() });
        try { localStorage.setItem(NOTES_KEY, JSON.stringify(m)); } catch (err) {}
        f.remarks.value = ''; paint(); UI.toast('Note saved');
      });
    }

    function drill(name) {
      if (level === 'region') { if ($('regionFilter').disabled) return; $('regionFilter').value = name; $('divisionFilter').value = ''; $('cccFilter').value = ''; level = 'division'; }
      else { if ($('divisionFilter').disabled) return; $('divisionFilter').value = name; $('cccFilter').value = ''; level = 'ccc'; }
      fillFilters(); setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; }
        if (id === 'divisionFilter') $('cccFilter').value = '';
        fillFilters(); render();
      });
    });
    ['classFilter', 'phaseFilter', 'govtFilter', 'osdFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(render, 180));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); stat = stat === k ? '' : k; bucket = ''; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      $('q').value = ''; stat = ''; bucket = ''; ['classFilter', 'phaseFilter', 'govtFilter'].forEach(function (id) { $(id).value = ''; }); $('osdFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); setLevel('region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('upcoming-dd-' + new Date().toISOString().slice(0, 10) + '.csv', [{ key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: 'mobile', label: 'Mobile' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, COLS[3], { key: 'phase', label: 'Phase' },
        { key: 'govt', label: 'Govt', csv: function (r) { return r.govt === 'Y' ? 'Yes' : 'No'; } }, COLS[4], COLS[5], COLS[6], { key: 'bucket', label: 'Bucket' }], window.__view || []);
    });

    function load() {
      var b = $('refreshBtn'); b.classList.add('spin');
      fetch(CSV_URL, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (t) { prepare(t); render(); })
        .catch(function () { $('meta').textContent = 'Could not load the DD sheet'; $('listTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; })
        .then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', load);
    load();
  });
  </script>
</body>
</html>
