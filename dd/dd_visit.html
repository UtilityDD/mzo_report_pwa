<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DD visit · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .dv { padding: 4px 20px 28px; }
    .dv h4 { margin: 10px 0 10px; font-size: 13px; font-weight: 600; }
    .dv form { display: grid; gap: 8px; margin-bottom: 16px; }
    .dv .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dv .ui-input, .dv select { width: 100%; max-width: none; }
    .dv .ui-input { padding: 0 10px; }
    .dv textarea.ui-input { height: 64px; padding: 8px 10px; resize: vertical; }
    .dv label { display: grid; gap: 4px; font-size: 12px; color: var(--mzo-muted); }
    .dv-item { padding: 10px 0; border-top: 1px solid var(--mzo-border); font-size: 13px; }
    .dv-item .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dv-item .m { margin-top: 2px; font-size: 12px; color: var(--mzo-muted); }
    .dv-item p { margin: 4px 0 0; color: var(--mzo-text-2); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>DD visit</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Consumer ID, name, mobile or address" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="catFilter" aria-label="Area"><option value="">Rural and urban</option><option value="R">Rural</option><option value="U">Urban</option></select></span>
      <span class="ui-select"><select id="osdFilter" aria-label="Outstanding"><option value="">Any outstanding</option><option value="25000">Over ₹25,000</option><option value="50000">Over ₹50,000</option><option value="100000">Over ₹1 lakh</option><option value="200000">Over ₹2 lakh</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">DD consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="visited"><div class="k"><span class="ui-dot ok"></span>Visited</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Not visited</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="Paid"><div class="k">Paid after visit</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <div class="ui-stat"><div class="k">Off-sheet history</div><div class="v" id="sOff">—</div><div class="s">Visited, no longer on sheet</div></div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel">
        <div class="ui-panel-h"><h2>Visit outcome</h2></div>
        <div class="ui-panel-b"><div id="outcomeHist"></div></div>
      </section>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <div class="ui-tabs" role="tablist" id="listTabs">
          <button type="button" class="ui-tab" role="tab" data-v="sheet" aria-selected="true">Consumers <span id="cSheet"></span></button>
          <button type="button" class="ui-tab" role="tab" data-v="history">Visit history <span id="cHist"></span></button>
        </div>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var SYNC = 'https://script.google.com/macros/s/AKfycbxgrKdt--yXk4A3_jL8PS6Z5kYXohHVNA3GKxq2jss8TVgqfvJdff_jFDwjj8Gxcdv00Q/exec';
    var STORE = 'dd_visit_followups_v1';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', P: 'Public' };
    var OUTCOMES = ['Found Live', 'Found Disconnected', 'Premises Not Found', 'Using Power form other source', 'Paid'];
    var OUT_LABEL = { 'Using Power form other source': 'Power from other source' };
    var HIST_LABEL = { 'Found Live': 'Found live', 'Found Disconnected': 'Disconnected', 'Premises Not Found': 'Not found', 'Using Power form other source': 'Other source', Paid: 'Paid' };
    var all = [], visits = {}, stat = '', outcome = '', level = 'region', view = 'sheet', osdDate = '', scope = null;

    function isAdmin() { try { var p = JSON.parse(localStorage.getItem('mzo_user_profile') || '{}') || {}; return String(p.role || p.Role || '').trim().toLowerCase() === 'admin'; } catch (e) { return false; } }
    function loadLocal() { try { visits = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { visits = {}; } }
    function saveLocal() { try { localStorage.setItem(STORE, JSON.stringify(visits)); } catch (e) {} }
    function ymd(s) { s = String(s || '').trim(); return /^\d{8}$/.test(s) ? new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)) : null; }
    function osdOf(r) { return parseFloat(r.TOTAL_OSD || r.OUTSTANDING) || 0; }

    // Visit history: every record ever saved, newest timeline entry first. Older records have no history array.
    function history(rec) {
      if (!rec) return [];
      var list = Array.isArray(rec.history) ? rec.history.slice() : [];
      if (!list.length && rec.visitDate) list = [{ id: 'v_legacy_' + rec.conId, visitDate: rec.visitDate, visitByOffice: rec.visitBy || 'Official', visitorName: rec.visitorName || '', visitBy: rec.visitBy || '', status: rec.status || 'Visited', paidAmount: rec.paidAmount || '', paidDate: rec.paidDate || '', remarks: rec.remarks || '', createdAt: rec.updatedAt }];
      return list;
    }

    function prepare(text) {
      all = UI.csv(text).map(function (r) {
        var code = String(r.CCC_CODE || r.CCC || '').trim(), o = UI.office(code);
        if (!osdDate && r.OSD_DATE) osdDate = r.OSD_DATE;
        return {
          raw: r, con: String(r.CON_ID || r.CONSUMER_ID || '').trim(), inst: r.INST_NO, name: UI.title(r.NAME || ''), address: r.ADDRESS || '',
          mobile: UI.blank(r.REG_MOB_NO) ? '' : String(r.REG_MOB_NO).trim(), code: code, CCC_CODE: code, _region: o.region, _divn: o.division, _supp: o.ccc,
          cat: String(r.CATEGORY || '').trim(), cls: String(r.BASE_CLASS || '').trim() || 'Other', osd: osdOf(r), load: r.CONN_LOAD,
          dis: ymd(r.DISCON_DT || r.DISCONN_DATE)
        };
      }).filter(function (r) { return r.con; });
      all.forEach(function (r) { r.search = (r.con + ' ' + r.name + ' ' + r.mobile + ' ' + r.address).toLowerCase(); });
      if (window.MzoScope) all = MzoScope.filterRows(all);
      var d = ymd(osdDate);
      $('meta').textContent = (d ? 'Outstanding as on ' + UI.fmtDate(d) + ' · ' : '') + UI.n(all.length) + ' consumers';
      UI.fill('classFilter', uniq(all, 'cls').map(function (c) { return { value: c, label: CLASS[c] || c }; }), 'All classes');
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      if (!scope) scope = UI.lockScope();
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'catFilter', 'osdFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function base() {
      var q = $('q').value.trim().toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value,
        cls = $('classFilter').value, cat = $('catFilter').value, min = +$('osdFilter').value || 0;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!cls || r.cls === cls) &&
          (!cat || r.cat === cat) && r.osd >= min && (!q || r.search.indexOf(q) !== -1);
      });
    }
    function matchStat(r) {
      var rec = visits[r.con];
      if (stat === 'visited') return !!rec;
      if (stat === 'pending') return !rec;
      if (stat === 'Paid') return !!rec && rec.status === 'Paid';
      return true;
    }

    function render() {
      var b = base(), rows = b.filter(function (r) { return matchStat(r) && (!outcome || (visits[r.con] && visits[r.con].status === outcome)); });
      var visited = b.filter(function (r) { return visits[r.con]; }), paid = visited.filter(function (r) { return visits[r.con].status === 'Paid'; });
      var on = {}; all.forEach(function (r) { on[r.con] = 1; });
      var off = Object.keys(visits).filter(function (k) { return !on[k]; });
      var set = function (k, v, s) { var el = document.querySelector('#stats [data-k="' + k + '"]'); el.querySelector('.v').textContent = v; el.querySelector('.s').textContent = s; el.setAttribute('aria-pressed', String(stat === k)); };
      set('', UI.n(b.length), UI.inr(b.reduce(function (a, r) { return a + r.osd; }, 0)) + ' outstanding');
      set('visited', UI.n(visited.length), UI.pct(visited.length, b.length) + ' coverage');
      set('pending', UI.n(b.length - visited.length), UI.inr(b.filter(function (r) { return !visits[r.con]; }).reduce(function (a, r) { return a + r.osd; }, 0)) + ' outstanding');
      set('Paid', UI.n(paid.length), UI.inr(paid.reduce(function (a, r) { return a + (parseFloat(visits[r.con].paidAmount) || 0); }, 0)) + ' collected');
      $('sOff').textContent = UI.n(off.length);

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      b.forEach(function (r) {
        var name = r[key] || 'Unmapped', rec = visits[r.con];
        var x = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, v: 0, osd: 0, paid: 0 });
        x.n++; x.osd += r.osd; if (rec) { x.v++; if (rec.status === 'Paid') x.paid += parseFloat(rec.paidAmount) || 0; }
      });
      var list = Object.keys(g).map(function (k) { return g[k]; });
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No consumers for these filters.',
        columns: [
          { key: 'name', label: { region: 'Region', division: 'Division', ccc: 'CCC' }[level], fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'v', label: 'Visited', num: true, fmt: UI.n },
          { key: 'cov', label: 'Coverage', sortVal: function (x) { return x.n ? x.v / x.n : 0; }, fmt: function (_, x) { return UI.bar(x.v, x.n, UI.pct(x.v, x.n)); }, width: '24%' },
          { key: 'osd', label: 'Outstanding', num: true, fmt: UI.inr, hideSm: true },
          { key: 'paid', label: 'Recovered', num: true, fmt: function (v) { return v ? UI.inr(v) : '<span class="ui-muted">—</span>'; }, hideSm: true }
        ],
        foot: list.length > 1 ? { n: b.length, v: visited.length, cov: 0, osd: b.reduce(function (a, r) { return a + r.osd; }, 0), paid: paid.reduce(function (a, r) { return a + (parseFloat(visits[r.con].paidAmount) || 0); }, 0) } : null,
        onRow: level === 'ccc' ? null : function (x) { drill(x.name); }
      });

      UI.hist('outcomeHist', OUTCOMES.map(function (o) { return { key: o, label: HIST_LABEL[o] || o, value: visited.filter(function (r) { return visits[r.con].status === o; }).length }; }),
        { active: outcome, onClick: function (row) { outcome = outcome === row.key ? '' : row.key; if (outcome && view !== 'sheet') setView('sheet'); render(); } });

      // Visit history: every saved record (also consumers no longer on the sheet), matched on search and office filters.
      var q = $('q').value.trim().toLowerCase();
      var hist = Object.keys(visits).map(function (k) { var rec = visits[k], o = UI.office(rec.cccCode); return { rec: rec, con: k, name: UI.title(rec.consumerName || ''), _region: o.region, _divn: o.division, _supp: o.ccc, off: !on[k], date: UI.date(rec.visitDate), osd: parseFloat(rec.totalOsd) || 0 }; })
        .filter(function (h) {
          var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
          return (!reg || h._region === reg) && (!div || h._divn === div) && (!ccc || h._supp === ccc) && (!outcome || h.rec.status === outcome) &&
            (!q || (h.con + ' ' + h.name + ' ' + (h.rec.remarks || '') + ' ' + (h.rec.visitBy || '') + ' ' + (h.rec.visitorName || '')).toLowerCase().indexOf(q) !== -1);
        });
      $('cSheet').textContent = UI.n(rows.length); $('cHist').textContent = UI.n(hist.length);
      if (view === 'sheet') {
        UI.table('listTable', { rows: rows, sort: { key: 'osd', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No consumers match these filters.', columns: COLS, onRow: function (r) { detail(r.con); } });
        window.__export = { rows: rows, cols: EXPORT_SHEET };
      } else {
        UI.table('listTable', { rows: hist, sort: { key: 'date', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No visits recorded yet.', columns: HCOLS, onRow: function (h) { detail(h.con); } });
        window.__export = { rows: hist, cols: EXPORT_HIST };
      }
      $('clearBtn').hidden = !($('q').value || stat || outcome || ['classFilter', 'catFilter', 'osdFilter'].some(function (id) { return $(id).value; }) ||
        ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    function statusBadge(rec) {
      if (!rec) return '<span class="ui-badge">Not visited</span>';
      var cls = rec.status === 'Paid' ? 'ok' : rec.status === 'Found Live' ? 'bad' : rec.status === 'Found Disconnected' ? '' : 'warn';
      return '<span class="ui-badge ' + cls + '">' + UI.esc(OUT_LABEL[rec.status] || rec.status || 'Visited') + '</span>';
    }
    var COLS = [
      { key: 'name', label: 'Consumer', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || r.con) + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'cls', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(CLASS[v] || v) + '<span class="sub">' + (r.cat === 'U' ? 'Urban' : 'Rural') + '</span>'; } },
      { key: 'osd', label: 'Outstanding', num: true, fmt: function (v) { return '₹' + UI.n(Math.round(v)); } },
      { key: 'visit', label: 'Visit', sortVal: function (r) { var x = visits[r.con]; return x ? (x.visitDate || '1') : ''; }, fmt: function (_, r) { var x = visits[r.con]; return statusBadge(x) + (x && x.visitDate ? '<span class="sub">' + UI.fmtDate(x.visitDate) + '</span>' : ''); } }
    ];
    var HCOLS = [
      { key: 'name', label: 'Consumer', fmt: function (v, h) { return '<span class="ui-strong">' + UI.esc(v || h.con) + '</span><span class="sub">' + UI.esc(h.con) + (h.off ? ' · off sheet' : '') + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, h) { return UI.esc(v || h.rec.cccCode || '—') + '<span class="sub">' + UI.esc(h._divn) + '</span>'; } },
      { key: 'date', label: 'Last visit', num: true, sortVal: function (h) { return h.date ? h.date.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; } },
      { key: 'by', label: 'Visited by', hideSm: true, sortVal: function (h) { return h.rec.visitBy || ''; }, fmt: function (_, h) { return UI.esc(h.rec.visitBy || '—') + (h.rec.visitorName ? '<span class="sub">' + UI.esc(h.rec.visitorName) + '</span>' : ''); } },
      { key: 'st', label: 'Outcome', sortVal: function (h) { return h.rec.status || ''; }, fmt: function (_, h) { return statusBadge(h.rec) + (h.rec.status === 'Paid' && h.rec.paidAmount ? '<span class="sub">₹' + UI.n(h.rec.paidAmount) + '</span>' : ''); } },
      { key: 'n', label: 'Visits', num: true, hideSm: true, sortVal: function (h) { return history(h.rec).length; }, fmt: function (_, h) { return UI.n(history(h.rec).length); } }
    ];
    var EXPORT_SHEET = [
      { label: 'CON_ID', csv: function (r) { return r.con; } }, { label: 'INST_NO', csv: function (r) { return r.inst; } }, { label: 'CONSUMER_NAME', csv: function (r) { return r.raw.NAME; } },
      { label: 'ADDRESS', csv: function (r) { return r.address; } }, { label: 'CCC_CODE', csv: function (r) { return r.code; } }, { label: 'REGION', csv: function (r) { return r._region; } },
      { label: 'DIVISION', csv: function (r) { return r._divn; } }, { label: 'CATEGORY', csv: function (r) { return r.cat; } }, { label: 'TOTAL_OSD', csv: function (r) { return r.osd; } },
      { label: 'LOAD_KW', csv: function (r) { return r.load; } }, { label: 'DISCON_DATE', csv: function (r) { return r.raw.DISCON_DT || ''; } }, { label: 'MOBILE', csv: function (r) { return r.mobile; } },
      { label: 'VISIT_STATUS', csv: function (r) { return visits[r.con] ? visits[r.con].status : 'Pending'; } }, { label: 'VISIT_DATE', csv: function (r) { return visits[r.con] ? visits[r.con].visitDate : ''; } },
      { label: 'VISITED_BY', csv: function (r) { return visits[r.con] ? visits[r.con].visitBy : ''; } }, { label: 'VISITOR_NAME', csv: function (r) { return visits[r.con] ? visits[r.con].visitorName : ''; } },
      { label: 'PAID_AMOUNT', csv: function (r) { return visits[r.con] ? visits[r.con].paidAmount : ''; } }, { label: 'REMARKS', csv: function (r) { return visits[r.con] ? visits[r.con].remarks : ''; } }
    ];
    var EXPORT_HIST = ['conId', 'instNo', 'consumerName', 'address', 'cccCode', 'category', 'totalOsd', 'mobile', 'visitDate', 'visitBy', 'visitorName', 'status', 'paidAmount', 'paidDate', 'remarks']
      .map(function (k) { return { label: k.replace(/([A-Z])/g, '_$1').toUpperCase(), csv: function (h) { return h.rec[k]; } }; });

    /* Row drawer: details, the uneditable visit timeline and a new-visit form */
    function detail(con) {
      var r = all.filter(function (x) { return x.con === con; })[0], rec = visits[con];
      if (!r && !rec) return;
      var c = r || { con: con, name: UI.title(rec.consumerName || 'Off-sheet consumer'), address: rec.address, mobile: rec.mobile, code: rec.cccCode, osd: parseFloat(rec.totalOsd) || 0, inst: rec.instNo, cat: rec.category, cls: '', raw: {} };
      UI.drawer(c.name || con, [c._supp || c.code, c._divn].filter(Boolean).join(' · '), [
        ['Consumer ID', con], ['Installation', c.inst], ['Mobile', c.mobile], ['Address', c.address],
        ['Class', c.cls ? (CLASS[c.cls] || c.cls) : ''], ['Outstanding', '₹' + UI.n(Math.round(c.osd))], ['Disconnected on', c.dis ? UI.fmtDate(c.dis) : ''], ['Load', c.load != null && c.load !== '' ? (parseFloat(c.load) || 0) + ' kW' : '']
      ]);
      var sec = document.querySelector('#ui-drawer section'), old = sec.querySelector('.dv');
      if (old) old.remove();
      var box = document.createElement('div'); box.className = 'dv';
      var today = new Date().toISOString().slice(0, 10);
      box.innerHTML = '<h4>Add a visit</h4><form>' +
        '<div class="two"><label>Visit date<input class="ui-input" type="date" name="date" value="' + today + '" required /></label>' +
        '<label>Visited by<span class="ui-select"><select name="by"><option>ZM Office</option><option>RM Office</option><option selected>DM Office</option><option>CCC</option><option value="Other">Other</option></select></span></label></div>' +
        '<input class="ui-input" name="byOther" placeholder="Office or level" hidden />' +
        '<div class="two"><label>Visitor name<input class="ui-input" name="who" required /></label>' +
        '<label>Outcome<span class="ui-select"><select name="st">' + OUTCOMES.map(function (o) { return '<option value="' + UI.esc(o) + '">' + UI.esc(OUT_LABEL[o] || o) + '</option>'; }).join('') + '</select></span></label></div>' +
        '<div class="two" data-paid hidden><label>Amount paid (₹)<input class="ui-input" type="number" name="amt" min="0" /></label><label>Paid on<input class="ui-input" type="date" name="pdate" value="' + today + '" /></label></div>' +
        '<textarea class="ui-input" name="remarks" placeholder="Remarks"></textarea>' +
        '<div><button type="submit" class="ui-btn primary sm">Save visit</button></div></form><h4>Visit timeline</h4><div class="tl"></div>';
      sec.appendChild(box);
      var f = box.querySelector('form');
      f.by.addEventListener('change', function () { f.byOther.hidden = f.by.value !== 'Other'; });
      f.st.addEventListener('change', function () { var p = f.st.value === 'Paid'; box.querySelector('[data-paid]').hidden = !p; f.amt.required = p; f.pdate.required = p; });
      var paint = function () {
        var list = history(visits[con]).slice().reverse(), admin = isAdmin();
        box.querySelector('.tl').innerHTML = list.map(function (it, i) {
          return '<div class="dv-item"><div class="h">' + statusBadge(it) + '<span class="ui-note">' + UI.fmtDate(it.visitDate) + '</span></div>' +
            '<div class="m">' + UI.esc(it.visitByOffice || it.visitBy || 'Office') + (it.visitorName ? ' · ' + UI.esc(it.visitorName) : '') +
            (it.status === 'Paid' && it.paidAmount ? ' · Paid ₹' + UI.n(it.paidAmount) + (it.paidDate ? ' on ' + UI.fmtDate(it.paidDate) : '') : '') + '</div>' +
            (it.remarks ? '<p>' + UI.esc(it.remarks) + '</p>' : '') +
            (admin ? '<button type="button" class="ui-btn ghost sm" data-del="' + UI.esc(it.id || i) + '" style="margin-top:4px;color:var(--mzo-bad)">Delete</button>' : '') + '</div>';
        }).join('') || '<p class="ui-note">No visits recorded yet.</p>';
      };
      paint();
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var who = f.who.value.trim(); if (!who) { f.who.focus(); return; }
        var office = f.by.value === 'Other' ? (f.byOther.value.trim() || 'Official') : f.by.value, st = f.st.value, existing = visits[con];
        var entry = { id: 'v_' + Date.now() + '_' + Math.floor(Math.random() * 1000), visitDate: f.date.value, visitByOffice: office, visitorName: who, visitBy: office, status: st,
          paidAmount: st === 'Paid' ? f.amt.value : '', paidDate: st === 'Paid' ? f.pdate.value : '', remarks: f.remarks.value.trim(), createdAt: new Date().toISOString() };
        var hist = history(existing); hist.push(entry);
        var rec = {
          conId: con, instNo: r ? r.inst : (existing ? existing.instNo : ''), consumerName: r ? r.raw.NAME : (existing ? existing.consumerName : ''),
          address: r ? r.address : (existing ? existing.address : ''), cccCode: r ? r.code : (existing ? existing.cccCode : ''), category: r ? r.cat : (existing ? existing.category : ''),
          totalOsd: r ? (r.raw.TOTAL_OSD || r.raw.OUTSTANDING) : (existing ? existing.totalOsd : '0'), mobile: r ? r.mobile : (existing ? existing.mobile : ''),
          visitDate: entry.visitDate, visitBy: office, visitorName: who, status: st, paidAmount: entry.paidAmount, paidDate: entry.paidDate, remarks: entry.remarks,
          updatedAt: new Date().toISOString(), reportOsdDate: osdDate, history: hist
        };
        visits[con] = rec; saveLocal();                 // 1. local first: the note shows at once
        f.who.value = ''; f.remarks.value = ''; paint(); render();
        UI.toast('Visit saved');
        setTimeout(function () { push(rec); }, 100);   // 2. then the shared sheet
      });
      box.querySelector('.tl').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-del]'); if (!btn || !isAdmin()) return;
        var rec = visits[con]; if (!rec || !confirm('Delete this visit entry?')) return;
        var id = btn.getAttribute('data-del');
        rec.history = history(rec).filter(function (it, i) { return String(it.id || i) !== id; });
        if (rec.history.length) {
          var last = rec.history[rec.history.length - 1];
          rec.visitDate = last.visitDate; rec.visitBy = last.visitByOffice || last.visitBy; rec.visitorName = last.visitorName; rec.status = last.status;
          rec.paidAmount = last.paidAmount; rec.paidDate = last.paidDate; rec.remarks = last.remarks;
        } else delete visits[con];
        saveLocal(); paint(); render(); UI.toast('Entry deleted');
        if (visits[con]) push(visits[con]);
      });
    }
    function push(rec) {
      fetch(SYNC, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'SAVE_DD_VISIT', data: rec }) }).catch(function () {});
    }
    function pullRemote() {
      fetch(SYNC + '?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
        if (!j || j.status !== 'success' || !j.data) return;
        Object.keys(j.data).forEach(function (k) { var rr = j.data[k], lr = visits[k]; if (!lr || new Date(rr.updatedAt || 0) > new Date(lr.updatedAt || 0)) visits[k] = rr; });
        saveLocal(); if (all.length) render();
      }).catch(function () {});
    }

    function drill(name) {
      if (level === 'region') { if ($('regionFilter').disabled) return; $('regionFilter').value = name; $('divisionFilter').value = ''; $('cccFilter').value = ''; level = 'division'; }
      else { if ($('divisionFilter').disabled) return; $('divisionFilter').value = name; $('cccFilter').value = ''; level = 'ccc'; }
      fillFilters(); setLevel(level);
    }
    function setLevel(l) { level = l; [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); }); render(); }
    function setView(v) { view = v; [].forEach.call(document.querySelectorAll('#listTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-v') === v)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () { if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; } if (id === 'divisionFilter') $('cccFilter').value = ''; fillFilters(); render(); });
    });
    ['classFilter', 'catFilter', 'osdFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(render, 180));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('button.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); stat = stat === k ? '' : k; setView('sheet'); render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('listTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) { setView(t.getAttribute('data-v')); render(); } });
    $('clearBtn').addEventListener('click', function () {
      $('q').value = ''; stat = ''; outcome = ''; ['classFilter', 'catFilter', 'osdFilter'].forEach(function (id) { $(id).value = ''; });
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); setLevel('region');
    });
    $('exportBtn').addEventListener('click', function () { var ex = window.__export; if (ex) UI.exportCsv('dd-visit-' + (view === 'history' ? 'history-' : '') + new Date().toISOString().slice(0, 10) + '.csv', ex.cols, ex.rows); });
    $('refreshBtn').addEventListener('click', function () {
      var bt = this; bt.classList.add('spin');
      Promise.resolve(window.mzoDataHub.waitForDataset('CACHE_DD_VISIT', { forceCheck: true })).catch(function () {})
        .then(function () { return window.mzoDataHub._peek('CACHE_DD_VISIT'); }).then(function (t) { if (t) { prepare(t); render(); } pullRemote(); })
        .then(function () { bt.classList.remove('spin'); });
    });

    loadLocal();
    UI.load('CACHE_DD_VISIT', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('listTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text); render();
    }).then(pullRemote);
  });
  </script>
</body>
</html>
