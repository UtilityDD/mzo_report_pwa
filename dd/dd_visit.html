<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DD visit · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=7" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .rem-hint {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--mzo-muted);
      border-bottom: 1px solid var(--mzo-border);
    }
    .dv { padding: 4px 20px 28px; }
    .dv h4 { margin: 10px 0 10px; font-size: 13px; font-weight: 600; }
    .dv form { display: grid; gap: 8px; margin-bottom: 16px; }
    .dv .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dv .ui-input, .dv select { width: 100%; max-width: none; }
    .dv .ui-input { padding: 0 10px; }
    .dv textarea.ui-input { height: 64px; padding: 8px 10px; resize: vertical; }
    .dv label { display: grid; gap: 4px; font-size: 12px; color: var(--mzo-muted); }
    .dv-item { padding: 10px 0; border-top: 1px solid var(--mzo-border); font-size: 13px; }
    .dv-item .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dv-item .m { margin-top: 2px; font-size: 12px; color: var(--mzo-muted); }
    .dv-item p { margin: 4px 0 0; color: var(--mzo-text-2); }
    .rd-copy { margin-left: auto; margin-right: 2px; }
    .ui-stat .s { font-size: 11px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>DD visit <span class="ui-badge ui-date" id="asOn"></span></h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Consumer ID, name or mobile" autocomplete="off" aria-label="Search consumers" title="Search consumers" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Visit status" id="fStat"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Visit outcome" id="fOutcome"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Consumer class" id="fClass"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Outstanding amount" id="fOsd"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Area" id="fCat"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">DD consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="visited"><div class="k"><span class="ui-dot ok"></span>Visited</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Not visited</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="Paid"><div class="k">Paid after visit</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="off"><div class="k">Off-sheet history</div><div class="v" id="sOff">—</div><div class="s">Visited, no longer on sheet</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title" id="tableTitle">Detailed analysis</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="rem-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var SYNC = 'https://script.google.com/macros/s/AKfycbxgrKdt--yXk4A3_jL8PS6Z5kYXohHVNA3GKxq2jss8TVgqfvJdff_jFDwjj8Gxcdv00Q/exec';
    var STORE = 'dd_visit_followups_v1';
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCKEl95dh4kyG-QPJbFJ5x7U7yo7h5bJGuMewsMr2hjMAlCj7UWxqvL_a-2hdyQd-laI8BAX3hU5_T/pub?gid=0&single=true&output=csv';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', P: 'Public' };
    var OUTCOMES = ['Found Live', 'Found Disconnected', 'Premises Not Found', 'Using Power form other source', 'Paid'];
    var OUT_LABEL = { 'Using Power form other source': 'Power from other source' };
    var HIST_LABEL = { 'Found Live': 'Found live', 'Found Disconnected': 'Disconnected', 'Premises Not Found': 'Not found', 'Using Power form other source': 'Other source', Paid: 'Paid' };
    var OSD_BUCKETS = [
      { key: '', label: 'Any outstanding' },
      { key: '25000', label: 'Over ₹25,000' },
      { key: '50000', label: 'Over ₹50,000' },
      { key: '100000', label: 'Over ₹1 lakh' },
      { key: '200000', label: 'Over ₹2 lakh' }
    ];
    var TABS = [
      { id: 'region', label: 'Region' },
      { id: 'division', label: 'Division' },
      { id: 'ccc', label: 'CCC' },
      { id: 'consumers', label: 'Consumers' },
      { id: 'history', label: 'Visit History' },
      { id: 'outcomes', label: 'Outcomes' },
      { id: 'class', label: 'Consumer Class' },
      { id: 'osd', label: 'Outstanding Slices' }
    ];

    var all = [], visits = {}, onSheet = {};
    var f = { q: '', stat: '', outcome: '', cls: '', cat: '', osd: '' };
    var tab = 'region', osdDate = '', scope = null;

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    function clearAll() {
      f.q = ''; f.stat = ''; f.outcome = ''; f.cls = ''; f.cat = ''; f.osd = '';
      $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
        if (!$(id).disabled) $(id).value = '';
      });
      fillFilters(); marks();
      syncUrl();
      render();
    }

    function isAdmin() {
      try {
        var p = JSON.parse(localStorage.getItem('mzo_user_profile') || '{}') || {};
        return String(p.role || p.Role || '').trim().toLowerCase() === 'admin';
      } catch (e) { return false; }
    }
    function loadLocal() {
      try { visits = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { visits = {}; }
    }
    function saveLocal() {
      try { localStorage.setItem(STORE, JSON.stringify(visits)); } catch (e) {}
    }
    function ymd(s) {
      s = String(s || '').trim();
      return /^\d{8}$/.test(s) ? new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)) : null;
    }
    function osdOf(d) { return d.total_osd != null ? d.total_osd : d.outstanding || 0; }
    function text(v) { return v == null ? '' : String(v); }

    function history(rec) {
      if (!rec) return [];
      var list = Array.isArray(rec.history) ? rec.history.slice() : [];
      if (!list.length && rec.visitDate) {
        list = [{
          id: 'v_legacy_' + rec.conId, visitDate: rec.visitDate, visitByOffice: rec.visitBy || 'Official',
          visitorName: rec.visitorName || '', visitBy: rec.visitBy || '', status: rec.status || 'Visited',
          paidAmount: rec.paidAmount || '', paidDate: rec.paidDate || '', remarks: rec.remarks || '', createdAt: rec.updatedAt
        }];
      }
      return list;
    }

    function prepare(t) {
      osdDate = t.first('osd_date') || '';
      onSheet = {};
      t.all.forEach(function (d) { if (d.con_id) onSheet[d.con_id] = 1; });
      all = t.rows.map(function (d) {
        var code = d.ccc_code;
        return {
          raw: { NAME: d.name, DISCON_DT: d.discon_dt, TOTAL_OSD: text(d.total_osd), OUTSTANDING: text(d.outstanding) },
          con: d.con_id, inst: d.inst_no, name: UI.title(d.name), address: d.address,
          mobile: UI.blank(d.reg_mob_no) ? '' : d.reg_mob_no, code: code, CCC_CODE: code, _region: d._region, _divn: d._division, _supp: d._ccc,
          cat: d.category, cls: d.base_class || 'Other', osd: osdOf(d), load: d.conn_load,
          dis: ymd(d.discon_dt)
        };
      }).filter(function (r) { return r.con; });
      all.forEach(function (r) { r.search = (r.con + ' ' + r.name + ' ' + r.mobile + ' ' + r.address).toLowerCase(); });
      var d = ymd(osdDate);
      if (d && $('asOn')) $('asOn').textContent = 'As on ' + UI.fmtDate(d);
      $('meta').textContent = (d ? 'Outstanding as on ' + UI.fmtDate(d) + ' · ' : '') + UI.n(all.length) + ' consumers';
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k]) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', uniq(all, '_region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r._region === reg; });
      UI.fill('divisionFilter', uniq(r1, '_divn'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r._divn === div; });
      UI.fill('cccFilter', uniq(r2, '_supp'), 'All CCCs');
      if (!scope) scope = UI.lockScope();
      marks();
    }

    function marks() {
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function base(skip) {
      skip = skip || {};
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) &&
          (skip.cls || !f.cls || r.cls === f.cls) &&
          (skip.cat || !f.cat || r.cat === f.cat) &&
          (skip.osd || !f.osd || r.osd >= +f.osd) &&
          (!q || r.search.indexOf(q) !== -1);
      });
    }

    function visitOffice(rec) {
      var o = UI.office(rec.cccCode);
      return { _region: o.region, _divn: o.division, _supp: o.ccc, CCC_CODE: String(rec.cccCode || '').trim() };
    }
    function myVisits() {
      var S = window.MzoScope, keys = Object.keys(visits);
      if (!S || !S.matchRow || S.isUnscoped()) return keys;
      return keys.filter(function (k) { return S.matchRow(visitOffice(visits[k])); });
    }
    function matchStat(r) {
      var rec = visits[r.con];
      if (f.stat === 'visited') return !!rec;
      if (f.stat === 'pending') return !rec;
      if (f.stat === 'Paid') return !!rec && rec.status === 'Paid';
      return true;
    }

    function syncUrl() {
      var p = new URLSearchParams();
      if ($('regionFilter').value) p.set('region', $('regionFilter').value);
      if ($('divisionFilter').value) p.set('division', $('divisionFilter').value);
      if ($('cccFilter').value) p.set('ccc', $('cccFilter').value);
      if (f.q) p.set('q', f.q);
      if (f.stat) p.set('stat', f.stat);
      if (f.outcome) p.set('outcome', f.outcome);
      if (f.cls) p.set('class', f.cls);
      if (f.cat) p.set('cat', f.cat);
      if (f.osd) p.set('osd', f.osd);
      if (tab !== 'region') p.set('tab', tab);
      var qs = p.toString();
      var url = location.pathname + (qs ? '?' + qs : '');
      if (location.search !== (qs ? '?' + qs : '')) history.replaceState(null, '', url);
    }

    function render() {
      var b = base({});
      var rows = b.filter(function (r) {
        return matchStat(r) && (!f.outcome || (visits[r.con] && visits[r.con].status === f.outcome));
      });
      var visited = b.filter(function (r) { return visits[r.con]; });
      var paid = visited.filter(function (r) { return visits[r.con].status === 'Paid'; });
      var on = onSheet, mine = myVisits();
      var off = mine.filter(function (k) { return !on[k]; });

      // Update KPI stats
      var set = function (k, v, s) {
        var el = document.querySelector('#stats [data-k="' + k + '"]');
        if (!el) return;
        el.querySelector('.v').textContent = v;
        el.querySelector('.s').textContent = s;
        el.setAttribute('aria-pressed', String(f.stat === k));
      };
      set('', UI.n(b.length), UI.inr(b.reduce(function (a, r) { return a + r.osd; }, 0)) + ' outstanding');
      set('visited', UI.n(visited.length), UI.pct(visited.length, b.length) + ' coverage');
      set('pending', UI.n(b.length - visited.length), UI.inr(b.filter(function (r) { return !visits[r.con]; }).reduce(function (a, r) { return a + r.osd; }, 0)) + ' outstanding');
      set('Paid', UI.n(paid.length), UI.inr(paid.reduce(function (a, r) { return a + (parseFloat(visits[r.con].paidAmount) || 0); }, 0)) + ' collected');
      $('sOff').textContent = UI.n(off.length);

      // Facets
      var statFacets = [
        { value: '', label: 'All consumers', count: b.length },
        { value: 'visited', label: 'Visited', count: visited.length },
        { value: 'pending', label: 'Not visited', count: b.length - visited.length },
        { value: 'Paid', label: 'Paid after visit', count: paid.length }
      ];
      UI.facet($('fStat'), statFacets, f.stat, function (v) { f.stat = v; syncUrl(); render(); });

      var forOutcome = base({}).filter(matchStat);
      var visInRows = forOutcome.filter(function (r) { return visits[r.con]; });
      var outcomeItems = [{ value: '', label: 'All outcomes', count: forOutcome.length }].concat(OUTCOMES.map(function (o) {
        return { value: o, label: HIST_LABEL[o] || o, count: visInRows.filter(function (r) { return visits[r.con].status === o; }).length };
      }));
      UI.facet($('fOutcome'), outcomeItems, f.outcome, function (key) { f.outcome = key; syncUrl(); render(); });

      var forClass = base({ cls: true }).filter(function (r) {
        return matchStat(r) && (!f.outcome || (visits[r.con] && visits[r.con].status === f.outcome));
      });
      var cc = {}; forClass.forEach(function (r) { cc[r.cls] = (cc[r.cls] || 0) + 1; });
      var classItems = [{ value: '', label: 'All classes', count: forClass.length }].concat(Object.keys(cc).sort(function (x, y) { return cc[y] - cc[x]; }).map(function (k) {
        return { value: k, label: CLASS[k] || k, count: cc[k] };
      }));
      UI.facet($('fClass'), classItems, f.cls, function (key) { f.cls = key; syncUrl(); render(); });

      var forOsd = base({ osd: true }).filter(function (r) {
        return matchStat(r) && (!f.outcome || (visits[r.con] && visits[r.con].status === f.outcome));
      });
      var osdItems = OSD_BUCKETS.map(function (ob) {
        var min = +ob.key || 0;
        return { value: ob.key, label: ob.label, count: min ? forOsd.filter(function (r) { return r.osd >= min; }).length : forOsd.length };
      });
      UI.facet($('fOsd'), osdItems, f.osd, function (key) { f.osd = key; syncUrl(); render(); });

      var forCat = base({ cat: true }).filter(function (r) {
        return matchStat(r) && (!f.outcome || (visits[r.con] && visits[r.con].status === f.outcome));
      });
      var catItems = [
        { value: '', label: 'Rural & Urban', count: forCat.length },
        { value: 'R', label: 'Rural', count: forCat.filter(function (r) { return r.cat === 'R'; }).length },
        { value: 'U', label: 'Urban', count: forCat.filter(function (r) { return r.cat === 'U'; }).length }
      ];
      UI.facet($('fCat'), catItems, f.cat, function (key) { f.cat = key; syncUrl(); render(); });

      // Active filters count
      var hasOffice = ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; });
      var nActive = (f.q ? 1 : 0) + (f.stat ? 1 : 0) + (f.outcome ? 1 : 0) + (f.cls ? 1 : 0) + (f.cat ? 1 : 0) + (f.osd ? 1 : 0) + (hasOffice ? 1 : 0);
      setActive(nActive);

      // Render Tabs
      var q = f.q.toLowerCase();
      var hist = mine.map(function (k) {
        var rec = visits[k], o = UI.office(rec.cccCode);
        return { rec: rec, con: k, name: UI.title(rec.consumerName || ''), _region: o.region, _divn: o.division, _supp: o.ccc, off: !on[k], date: UI.date(rec.visitDate), osd: parseFloat(rec.totalOsd) || 0 };
      }).filter(function (h) {
        var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
        return (!reg || h._region === reg) && (!div || h._divn === div) && (!ccc || h._supp === ccc) && (!f.outcome || h.rec.status === f.outcome) &&
          (!q || (h.con + ' ' + h.name + ' ' + (h.rec.remarks || '') + ' ' + (h.rec.visitBy || '') + ' ' + (h.rec.visitorName || '')).toLowerCase().indexOf(q) !== -1);
      });

      var tabsEl = $('tabs');
      tabsEl.innerHTML = TABS.map(function (t) {
        var count = '';
        if (t.id === 'consumers') count = '<small>' + UI.n(rows.length) + '</small>';
        else if (t.id === 'history') count = '<small>' + UI.n(hist.length) + '</small>';
        return '<button type="button" class="ui-drill-tab" role="tab" data-tab="' + t.id + '" aria-selected="' + String(tab === t.id) + '">' + t.label + count + '</button>';
      }).join('');

      var totOsd = rows.reduce(function (a, r) { return a + r.osd; }, 0);
      var totPaid = paid.reduce(function (a, r) { return a + (parseFloat(visits[r.con].paidAmount) || 0); }, 0);
      $('hint').innerHTML = '<span class="ui-strong">' + UI.n(rows.length) + '</span> consumers · Outstanding: <span class="ui-strong">' + UI.inr(totOsd) + '</span> · Visited: <span class="ui-strong">' + UI.n(visited.length) + '</span> (' + UI.pct(visited.length, b.length) + ') · Recovered: <span class="ui-strong">' + UI.inr(totPaid) + '</span>';

      window.__exportRows = tab === 'history' ? hist : rows;
      window.__exportCols = tab === 'history' ? EXPORT_HIST : EXPORT_SHEET;

      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(rows.length) + ' consumers · ' + UI.inr(totOsd) + ' OSD';
      renderReportHead(rows);

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        renderOfficesTab(b, visited, paid);
      } else if (tab === 'consumers') {
        renderConsumersTab(rows);
      } else if (tab === 'history') {
        renderHistoryTab(hist);
      } else if (tab === 'outcomes') {
        renderOutcomesTab(b, visInRows);
      } else if (tab === 'class') {
        renderClassTab(b);
      } else if (tab === 'osd') {
        renderOsdTab(b);
      }
    }

    var currentActiveFilters = [];
    function renderReportHead(rows) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; syncUrl(); render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillFilters(); marks(); syncUrl(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillFilters(); marks(); syncUrl(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; marks(); syncUrl(); render(); } });
      }
      if (f.stat) {
        var stLabel = f.stat === 'visited' ? 'Visited' : 'Not visited';
        active.push({ key: 'stat', label: 'Status: ' + stLabel, clear: function () { f.stat = ''; syncUrl(); render(); } });
      }
      if (f.outcome) {
        active.push({ key: 'outcome', label: 'Outcome: ' + (OUT_LABEL[f.outcome] || f.outcome), clear: function () { f.outcome = ''; syncUrl(); render(); } });
      }
      if (f.cls) {
        active.push({ key: 'cls', label: 'Class: ' + (CLASS[f.cls] || f.cls), clear: function () { f.cls = ''; syncUrl(); render(); } });
      }
      if (f.osd) {
        var oMatch = OSD_BUCKETS.filter(function (o) { return o.key === f.osd; })[0];
        active.push({ key: 'osd', label: 'Outstanding: ' + (oMatch ? oMatch.label : f.osd), clear: function () { f.osd = ''; syncUrl(); render(); } });
      }
      if (f.cat) {

      var b = base({});
      var visited = b.filter(function (r) { return visits[r.con]; });
      var paid = visited.filter(function (r) { return visits[r.con].status === 'Paid'; });
      var totOsd = b.reduce(function (a, r) { return a + r.osd; }, 0);
      var totPaid = paid.reduce(function (a, r) { return a + (parseFloat(visits[r.con].paidAmount) || 0); }, 0);
      var text = 'DD Visit — ' + ($('tableTitle').textContent || 'Summary') + '\n' +
        'Consumers: ' + UI.n(b.length) + '\n' +
        'Total Outstanding: ' + UI.inr(totOsd) + '\n' +
        'Visited: ' + UI.n(visited.length) + ' (' + UI.pct(visited.length, b.length) + ')\n' +
        'Recovered: ' + UI.inr(totPaid) + '\n' +
        ($('regionFilter').value ? 'Region: ' + $('regionFilter').value + '\n' : '') +
        ($('divisionFilter').value ? 'Division: ' + $('divisionFilter').value + '\n' : '') +
        ($('cccFilter').value ? 'CCC: ' + $('cccFilter').value + '\n' : '');
      UI.copy(text).then(function () { UI.toast('Summary copied to clipboard'); });
    });

    // Export CSV
    $('exportBtn').addEventListener('click', function () {
      var rows = window.__exportRows || [];
      var cols = window.__exportCols || EXPORT_SHEET;
      UI.exportCsv('dd-visit-' + (tab === 'history' ? 'history-' : '') + new Date().toISOString().slice(0, 10) + '.csv', cols, rows);
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      if (e.target.closest('#rhClearBtn')) { clearAll(); return; }
      var btn = e.target.closest('[data-rh-clear]');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
      if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
        currentActiveFilters[idx].clear();
      }
    });

    function forgetStoredCopies() {
      var hub = window.mzoDataHub;
      if (hub && hub.delete) Promise.resolve().then(function () { return hub.delete('CACHE_DD_VISIT'); }).catch(function () {});
      try { ['mzo_hub_ver_CACHE_DD_VISIT', 'mzo_hub_fetched_CACHE_DD_VISIT', 'mzo_rows_schema_dd_visit'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
      try {
        var req = indexedDB.open('MZORows', 1);
        req.onupgradeneeded = function () { if (!req.result.objectStoreNames.contains('rows')) req.result.createObjectStore('rows'); };
        req.onsuccess = function () {
          var d = req.result;
          try { var tx = d.transaction('rows', 'readwrite'); tx.objectStore('rows').delete('dd_visit'); tx.oncomplete = tx.onerror = tx.onabort = function () { d.close(); }; } catch (e) { d.close(); }
        };
      } catch (e) {}
    }

    // Read deep link params on start
    function initParams() {
      var p = new URLSearchParams(location.search);
      if (p.has('region')) $('regionFilter').value = p.get('region');
      if (p.has('division')) $('divisionFilter').value = p.get('division');
      if (p.has('ccc')) $('cccFilter').value = p.get('ccc');
      if (p.has('q')) { f.q = p.get('q'); $('q').value = f.q; }
      if (p.has('stat')) f.stat = p.get('stat');
      if (p.has('outcome')) f.outcome = p.get('outcome');
      if (p.has('class')) f.cls = p.get('class');
      if (p.has('cat')) f.cat = p.get('cat');
      if (p.has('osd')) f.osd = p.get('osd');
      if (p.has('tab')) tab = p.get('tab');
    }

    function load() {
      return fetch(CSV_URL, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('sheet ' + r.status); return r.text(); })
        .then(function (text) { return MzoRows.build('dd_visit', text); })
        .then(function (t) {
          prepare(t);
          initParams();
          if (!new URLSearchParams(location.search).has('tab')) {
            if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
            else if (scope && scope.level === 'region') tab = 'division';
          }
          marks();
          render();
        })
        .catch(function (err) {
          console.error('Failed to load DD visit:', err);
          if (!all.length) {
            $('meta').textContent = 'Could not load data';
            $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
          }
        });
    }

    $('refreshBtn').addEventListener('click', function () {
      var bt = this; bt.classList.add('spin');
      load().then(pullRemote).then(function () { bt.classList.remove('spin'); });
    });

    forgetStoredCopies();
    loadLocal();
    load().then(pullRemote);
  });
  </script>
</body>
</html>
