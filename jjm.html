<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JJM connections · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>JJM connections</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary"></section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office <small id="officeNote"></small></h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Where connections stand</h2></div>
          <div class="ui-panel-b"><div id="mixHist"></div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    // Sheet columns (matched loosely: headers carry long descriptions and letters A–F).
    var M = [
      { k: 'total', label: 'Deposited by PHE', short: 'Deposited', re: /TOTAL NO CONNECTION/i, dot: '' },
      { k: 'done', label: 'Connected', short: 'Connected', re: /ALREADY DONE/i, dot: 'ok' },
      { k: 'wip', label: 'Work in progress', short: 'In progress', re: /^work in progress/i, dot: '' },
      { k: 'notReady', label: 'PHE not ready', short: 'PHE not ready', re: /PHE NOT READY/i, dot: 'warn' },
      { k: 'phe', label: 'PHE issue', short: 'PHE issue', re: /ISSUED OF PHE|ISSUES? OF PHE/i, dot: 'bad' },
      { k: 'row', label: 'Right of way', short: 'Right of way', re: /OBJECTION FOR POLE/i, dot: 'bad' }
    ];
    var all = [], level = 'region', f = { m: '' }, scope = null;
    // Spellings used in this sheet → office names used everywhere else.
    var ALIAS = { 'MOKDAMPUR': 'Mokdumpur', 'BAISNABNAGAR': 'Baishnabnagar', 'H.C. PUR': 'Harishchandrapur', 'HC PUR': 'Harishchandrapur', 'BAMANGOLA': 'Bamongola',
      'KALIAGANJ': 'Kaliyaganj', 'KARANDEGHI': 'Karandighi', 'GOALPOKHAR': 'Goalpokher', 'KUMARGUNJ': 'Kumarganj', 'KUSHMUNDI': 'Kusmandi' };
    function region(raw) { var u = String(raw || '').toUpperCase(); return u.indexOf('MALDA') !== -1 ? 'Malda' : u.indexOf('UTTAR') !== -1 ? 'Raiganj' : u.indexOf('DAK') !== -1 ? 'Balurghat' : UI.title(raw); }

    function prepare(text) {
      var rows = UI.csv(text);
      var head = Object.keys(rows[0] || {}), col = {};
      M.forEach(function (m) { col[m.k] = head.filter(function (h) { return m.re.test(h); })[0]; });
      var S = window.MzoScope;
      all = rows.filter(function (d) { return String(d['CCC NAME'] || '').trim(); }).map(function (d) {
        var name = String(d['CCC NAME']).trim(), o = S ? S.parentOfCcc(ALIAS[name.toUpperCase()] || name) : null;
        var div = S && S.divisionNameOf ? S.divisionNameOf(d.DIVISION) : '';
        var r = {
          _region: o ? o.region : region(d['REGION NAME']), _divn: o ? o.division : (div || ''), _supp: o ? o.ccc : UI.title(name),
          sheetDivision: UI.title(d.DIVISION)
        };
        M.forEach(function (m) { r[m.k] = parseFloat(col[m.k] ? d[col[m.k]] : 0) || 0; });
        r.blocked = r.phe + r.row;
        return r;
      });
      if (window.MzoScope) { var scoped = window.MzoScope.filterRows(all); if (scoped.length || !all.length) all = scoped; }
      $('meta').textContent = 'As updated by RMs · ' + UI.n(all.length) + ' CCCs';
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }
    function base() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) { return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc); });
    }
    function sum(rows, k) { return rows.reduce(function (a, r) { return a + r[k]; }, 0); }

    function render() {
      var b = base(), tot = {};
      M.forEach(function (m) { tot[m.k] = sum(b, m.k); });
      tot.blocked = tot.phe + tot.row;

      var stats = [
        { k: '', label: 'Deposited by PHE', v: tot.total, s: UI.n(b.length) + ' CCCs' },
        { k: 'done', label: 'Connected', dot: 'ok', v: tot.done, s: UI.pct(tot.done, tot.total) + ' of deposited' },
        { k: 'wip', label: 'Work in progress', v: tot.wip, s: UI.pct(tot.wip, tot.total) + ' of deposited' },
        { k: 'notReady', label: 'PHE not ready', dot: 'warn', v: tot.notReady, s: 'WBSEDCL work complete' },
        { k: 'blocked', label: 'Blocked', dot: 'bad', v: tot.blocked, s: 'PHE ' + UI.n(tot.phe) + ' · Right of way ' + UI.n(tot.row) }
      ];
      $('stats').innerHTML = stats.map(function (s) {
        return '<button type="button" class="ui-stat" data-k="' + s.k + '" aria-pressed="' + (f.m === s.k) + '"><div class="k">' + (s.dot !== undefined ? '<span class="ui-dot ' + s.dot + '"></span>' : '') + UI.esc(s.label) + '</div><div class="v">' + UI.n(s.v) + '</div><div class="s">' + UI.esc(s.s) + '</div></button>';
      }).join('');

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      b.forEach(function (r) {
        var name = r[key] || 'Other';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', total: 0, done: 0, wip: 0, notReady: 0, phe: 0, row: 0, blocked: 0 });
        ['total', 'done', 'wip', 'notReady', 'phe', 'row', 'blocked'].forEach(function (k) { g[k] += r[k]; });
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      if (f.m) list = list.filter(function (g) { return g[f.m] > 0; });
      $('officeNote').textContent = f.m ? 'with ' + (f.m === 'blocked' ? 'blocked connections' : M.filter(function (m) { return m.k === f.m; })[0].short.toLowerCase()) : '';
      var el = $('officeTable');
      if (el.__ui) el.__ui.sort = { key: f.m || 'total', dir: 'desc' };
      var cnt = function (v) { return v ? UI.n(v) : '<span class="ui-muted">0</span>'; };
      UI.table('officeTable', {
        rows: list, sort: { key: f.m || 'total', dir: 'desc' }, count: false, empty: 'Nothing here for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'total', label: 'Deposited', num: true, fmt: cnt },
          { key: 'done', label: 'Connected', num: true, fmt: cnt },
          { key: 'wip', label: 'In progress', num: true, fmt: cnt, hideSm: true },
          { key: 'notReady', label: 'PHE not ready', num: true, fmt: cnt, hideSm: true },
          { key: 'blocked', label: 'Blocked', num: true, fmt: cnt },
          { key: 'rate', label: 'Done', hideSm: true, sortVal: function (g) { return g.total ? g.done / g.total : 0; }, fmt: function (_, g) { return UI.bar(g.done, g.total, UI.pct(g.done, g.total)); }, width: '22%' }
        ],
        foot: list.length > 1 ? (function () { var t = { rate: 0 }; ['total', 'done', 'wip', 'notReady', 'blocked'].forEach(function (k) { t[k] = list.reduce(function (a, g) { return a + g[k]; }, 0); }); return t; })() : null,
        onRow: level === 'ccc' ? null : function (g) { drill(g.name); }
      });

      UI.hist('mixHist', M.slice(1).map(function (m) { return { key: m.k, label: m.short, value: tot[m.k] }; }),
        { active: f.m === 'blocked' ? null : f.m, onClick: function (row) { f.m = f.m === row.key ? '' : row.key; render(); } });
      $('clearBtn').hidden = !(f.m || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
      window.__list = list;
    }

    function tabs() { [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); }); }
    function setLevel(l) { level = l; tabs(); render(); }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); }); }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }
    function drill(name) {
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); level = 'division'; }
      else { set('divisionFilter', name); set('cccFilter', ''); level = 'ccc'; }
      fillFilters(); markAll(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); markAll(); render();
      });
    });
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.m = f.m === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () { f.m = ''; ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { set(id, ''); }); fillFilters(); markAll(); render(); });
    $('exportBtn').addEventListener('click', function () {
      var rows = base();
      UI.exportCsv('jjm-connections.csv', [{ key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }].concat(M.map(function (m) { return { key: m.k, label: m.label }; })), rows);
    });
    UI.refresh('refreshBtn', 'CACHE_JJM', function (t) { prepare(t); render(); });

    var first = true;
    UI.load('CACHE_JJM', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        tabs();
      }
      render();
    });
  });
  </script>
</body>
</html>
