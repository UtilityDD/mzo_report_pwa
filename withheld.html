<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Withheld NSC · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    /* Reasons are long: let them wrap instead of truncating */
    #fReason .ui-opt { height: auto; min-height: 27px; padding-block: 4px; align-items: flex-start; line-height: 1.35; }
    #fReason .ui-opt i { margin-top: 2px; }
    #fReason .ui-opt span { white-space: normal; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div><h1>Withheld NSC<span class="ui-badge ui-date" id="asOn">…</span></h1></div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h"><h2>Filters<small id="activeLabel"></small></h2><button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button></div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Application, name or phone" aria-label="Search by application, name or phone" autocomplete="off" /></label>
        </div>
        <div class="ui-side-sec"><div id="fSrc" aria-label="Source"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Group">
            <button type="button" role="tab" data-pane="fReason" aria-pressed="true" aria-selected="true">Reason</button>
            <button type="button" role="tab" data-pane="fYear" aria-pressed="false" aria-selected="false">Year</button>
            <button type="button" role="tab" data-pane="fClass" aria-pressed="false" aria-selected="false">Class</button>
          </div>
          <div id="fReason" aria-label="Reason"></div>
          <div id="fYear" aria-label="Withheld in" hidden></div>
          <div id="fClass" aria-label="Class" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Withheld</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="d7"><div class="k">Last 7 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="d30"><div class="k">Last 30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="d90"><div class="k">Last 90 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="invalid"><div class="k"><span class="ui-dot bad"></span>No valid reason</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>Detailed report</h2>
            <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
          </div>
          <div id="drill"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'CACHE_WITHHELD_v4';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', S: 'Street light', J: 'Public', P: 'Public', W: 'Water works', T: 'Temporary' };
    var INVALID = ['', 'Not Specified', 'LT Infrastructure required', 'Earthing Not Completed', 'WBSEDCL is unable to provide connection', 'n', 'N', 'NO', 'Y',
      'Dependent on other application', 'Particulars of capacitor bank(if installed) not Found', 'Meter and Main Switch should be separated', 'YES', 'y', 'no',
      'Location of installation of Transformer need to be identified clearly', 'yes'];
    var NO_REASON = 'No valid reason';
    var all = [], asOn = null, f = { q: '', src: '', stat: '', year: '', cls: '', reason: '' }, shown = '';
    var dr = UI.drill({ el: 'drill', root: 'Malda Zone', onChange: render });
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function prepare(text) {
      var rows = Array.isArray(text) ? text : UI.csv(text), today = null, seen = {};
      all = [];
      rows.forEach(function (d) {
        var appl = String(d.APPL_NO || '').trim();
        if (!appl) return;
        var t = UI.date(d.TODAY); if (t && (!today || t > today)) today = t;
        var reason = String(d.SCN_WITHELD_REASON || '').trim();
        var invalid = INVALID.indexOf(reason) !== -1;
        var r = {
          appl: appl, name: UI.blank(d.NAME) ? '' : UI.title(d.NAME), phone: UI.blank(d.PHONE_NO) ? '' : d.PHONE_NO,
          _region: UI.regionName(d.REGION), _divn: UI.title(d.DIVN_NAME), _supp: UI.title(d.SUPP_OFF), CCC_CODE: String(d.CCC_CODE || '').trim(),
          cls: String(d.CONN_CLASS || '').trim().toUpperCase(), phase: String(d.APPLIED_PHASE || '').trim().toUpperCase(),
          paid: UI.date(d.COLL_DATE), withheld: UI.date(d.SCN_WITHELD_DATE),
          reason: reason || 'Not specified', invalid: invalid, group: invalid ? NO_REASON : reason,
          portal: d.IS_PORTAL_APPL === 'Y' ? 'Y' : 'N'
        };
        r.label = CLASS[r.cls] || r.cls || '—';
        r.year = r.withheld ? String(r.withheld.getFullYear()) : '';
        // Count each application once; the last row wins.
        if (seen[appl] != null) all[seen[appl]] = r; else { seen[appl] = all.length; all.push(r); }
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      if (today && (!asOn || today > asOn)) asOn = today;
      all.forEach(function (r) { r.ago = r.withheld && asOn ? Math.floor((asOn - r.withheld) / 864e5) : null; });
      paintMeta();
    }
    function paintMeta() { $('asOn').textContent = asOn ? 'As on ' + UI.fmtDate(asOn) : UI.n(all.length) + ' applications'; }

    var STAT = {
      d7: function (r) { return r.ago != null && r.ago >= 0 && r.ago <= 7; },
      d30: function (r) { return r.ago != null && r.ago >= 0 && r.ago <= 30; },
      d90: function (r) { return r.ago != null && r.ago >= 0 && r.ago <= 90; },
      invalid: function (r) { return r.invalid; }
    };

    // A year key is "2024", or "<=2016" for that year and earlier.
    function inYear(r, y) { return y.indexOf('<=') === 0 ? !!r.year && r.year <= y.slice(2) : r.year === y; }
    // Every panel filter; `skip` leaves one facet out so it can count its own options.
    function base(skip) {
      var q = f.q.toLowerCase();
      return all.filter(function (r) {
        return (skip === 'src' || !f.src || r.portal === f.src) && dr.match(r) &&
          (skip === 'cls' || !f.cls || r.cls === f.cls) && (skip === 'reason' || !f.reason || r.group === f.reason) && (skip === 'year' || !f.year || inYear(r, f.year)) &&
          (!q || r.appl.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1 || r.phone.indexOf(q) !== -1);
      });
    }

    function tally(rows, k) { var c = {}; rows.forEach(function (r) { if (r[k]) c[r[k]] = (c[r[k]] || 0) + 1; }); return c; }
    function byCount(c, keep) { var keys = Object.keys(c); if (keep && keys.indexOf(keep) === -1) keys.push(keep); return keys.sort(function (a, b) { return (c[b] || 0) - (c[a] || 0); }); }
    function facets() {
      var sr = tally(base('src'), 'portal');
      UI.facet('fSrc', [{ value: 'Y', label: 'Portal', count: sr.Y || 0 }, { value: 'N', label: 'Offline', count: sr.N || 0 }], f.src, function (v) { f.src = v; render(); });
      var rs = tally(base('reason'), 'group');
      UI.facet('fReason', byCount(rs, f.reason).map(function (k) { return { value: k, label: k, count: rs[k] || 0 }; }), f.reason, function (v) { f.reason = v; render(); });
      var yr = tally(base('year'), 'year'), years = Object.keys(yr).sort().reverse(), rowsY = years.slice(0, 9).map(function (y) { return { value: y, label: y, count: yr[y] }; });
      if (years.length > 9) rowsY.push({ value: '<=' + years[9], label: years[9] + ' and earlier', count: years.slice(9).reduce(function (a, y) { return a + yr[y]; }, 0) });
      if (f.year && !rowsY.some(function (o) { return o.value === f.year; })) rowsY.push({ value: f.year, label: f.year.replace('<=', '') + (f.year.indexOf('<=') === 0 ? ' and earlier' : ''), count: 0 });
      UI.facet('fYear', rowsY, f.year, function (v) { f.year = v; render(); });
      var cl = tally(base('cls'), 'cls');
      UI.facet('fClass', byCount(cl, f.cls).map(function (c) { return { value: c, label: CLASS[c] || c, count: cl[c] || 0 }; }), f.cls, function (v) { f.cls = v; render(); });
      var on = (f.q ? 1 : 0) + ['src', 'reason', 'year', 'cls'].filter(function (k) { return f[k]; }).length;
      setActive(on, { fReason: f.reason, fYear: f.year, fClass: f.cls });
    }
    function render() {
      var b = base();
      facets();
      var view = b.filter(function (r) { return !f.stat || STAT[f.stat](r); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? b.filter(STAT[k]).length : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? UI.pct(c, b.length) + ' of withheld' : UI.pct(b.filter(function (r) { return r.portal === 'Y'; }).length, b.length) + ' from the portal';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      // Detailed report: offices down the path, then the applications
      if (dr.level() !== shown) { $('table').__ui = null; shown = dr.level(); }
      if (dr.isList()) {
        UI.table('table', { rows: view, sort: { key: 'withheld', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      } else {
        var groups = {};
        view.forEach(function (r) {
          var k = dr.key(r), g = groups[k] || (groups[k] = { name: k, parent: dr.parent(r), row: r, n: 0, d30: 0, portal: 0, invalid: 0 });
          g.n++; if (STAT.d30(r)) g.d30++; if (r.portal === 'Y') g.portal++; if (r.invalid) g.invalid++;
        });
        var list = Object.keys(groups).map(function (k) { return groups[k]; }), max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
        UI.table('table', {
          rows: list, sort: { key: 'n', dir: 'desc' }, count: false,
          empty: 'Nothing withheld for these filters.',
          columns: [
            { key: 'name', label: dr.label(), fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Withheld', num: true, fmt: UI.n },
            { key: 'd30', label: 'Last 30 days', num: true, fmt: UI.n },
            { key: 'invalid', label: 'No valid reason', num: true, fmt: UI.n, hideSm: true },
            { key: 'portal', label: 'Portal', num: true, hideSm: true, sortVal: function (g) { return g.n ? g.portal / g.n : 0; }, fmt: function (v, g) { return UI.pct(v, g.n); } },
            { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '24%' }
          ],
          foot: list.length > 1 ? { n: view.length, d30: view.filter(STAT.d30).length, invalid: view.filter(STAT.invalid).length, portal: view.filter(function (r) { return r.portal === 'Y'; }).length } : null,
          onRow: function (g) { dr.open(g.name, g.row); }
        });
      }
      dr.paint({ list: view.length });
      window.__view = view;
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + (r.portal === 'Y' ? 'Portal' : 'Offline') + '</span>'; } },
      { key: 'name', label: 'Name', cls: 'wrap', hideSm: true },
      { key: 'phone', label: 'Phone', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'label', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + (r.phase === 'III' ? 'Three phase' : 'Single phase') + '</span>'; } },
      { key: 'withheld', label: 'Withheld on', num: true, sortVal: function (r) { return r.withheld ? r.withheld.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return UI.fmtDate(r.withheld); } },
      { key: 'reason', label: 'Reason', cls: 'wrap', fmt: function (v, r) { return r.invalid ? '<span class="ui-badge bad">' + UI.esc(v) + '</span>' : UI.esc(v); } }
    ];

    function detail(r) {
      UI.drawer('Application ' + r.appl, [r._supp, r._divn, r._region].filter(Boolean).join(' · '), [
        ['Name', r.name], ['Phone', r.phone], ['Class', r.label + (r.cls && r.label !== r.cls ? ' (' + r.cls + ')' : '')], ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'],
        ['Source', r.portal === 'Y' ? 'Portal' : 'Offline'], ['Paid on', r.paid ? UI.fmtDate(r.paid) : ''], ['Withheld on', r.withheld ? UI.fmtDate(r.withheld) : ''],
        ['Withheld for', r.ago != null ? UI.age(r.ago) : ''], ['Reason', r.reason + (r.invalid ? ' (not a valid reason)' : '')], ['CCC code', r.CCC_CODE]
      ]);
    }

    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim().toLowerCase(); render(); }, 180));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    function clearAll() {
      f.q = ''; f.stat = ''; f.year = ''; f.src = ''; f.cls = ''; f.reason = ''; $('q').value = '';
      render();
    }
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('withheld-nsc.csv', [
        { key: 'appl', label: 'Application' }, { key: 'name', label: 'Name' }, { key: 'phone', label: 'Phone' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'cls', label: 'Class' }, { key: 'phase', label: 'Phase' },
        { key: 'paid', label: 'Paid on', csv: function (r) { return r.paid ? UI.fmtDate(r.paid) : ''; } }].concat(APP_COLS.slice(5))
        .concat([{ key: 'portal', label: 'Source', csv: function (r) { return r.portal === 'Y' ? 'Portal' : 'Offline'; } }]), window.__view || []);
    });

    UI.refresh('refreshBtn', KEY, function (t) { prepare(t); render(); });

    // A fresh NSC upload (nsc/upload.html) asks this page to reload its dump.
    try {
      new BroadcastChannel('mzo-withheld').onmessage = function (ev) {
        if (ev && ev.data && ev.data.type === 'withheld-uploaded') { try { localStorage.setItem('mzo_withheld_pending_refresh', '1'); } catch (e) {} location.reload(); }
      };
    } catch (e) {}

    // "As on": the later of the dump's TODAY and the NSC upload report date.
    fetch('/api/nsc/meta?ts=' + Date.now(), { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var m = (j && j.meta) || {}, d = UI.date(m.reportDate) || UI.date((m.stats || {}).today);
      if (d && (!asOn || d > asOn)) {
        asOn = d;
        if (all.length) { all.forEach(function (r) { r.ago = r.withheld ? Math.floor((asOn - r.withheld) / 864e5) : null; }); paintMeta(); render(); }
      }
    }).catch(function () {});

    var pending = false;
    try { pending = localStorage.getItem('mzo_withheld_pending_refresh') === '1'; } catch (e) {}
    var start = pending
      ? Promise.resolve(window.mzoDataHub.refresh(KEY)).catch(function () {}).then(function () { try { localStorage.removeItem('mzo_withheld_pending_refresh'); } catch (e) {} })
      : Promise.resolve();
    start.then(function () {
      UI.load(KEY, function (text, info) {
        if (!text) { if (info && info.error) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
        var firstPaint = !all.length;
        prepare(text);
        if (firstPaint) dr.fromParams(new URLSearchParams(location.search), all); // ?region= ?division= ?ccc=
        render();
      });
    });
  });
  </script>
</body>
</html>
