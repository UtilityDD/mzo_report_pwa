<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTR records · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=12" />
  <script src="/mzo_presets_hub.js?v=89"></script>
  <script src="/mzo_ui.js?v=10" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .ui-side-sec-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--mzo-muted); margin-bottom: 6px; }
    .ui-check-group { display: grid; gap: 3px; }
    .ui-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--mzo-text-2);
      cursor: pointer;
      user-select: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .ui-check-label:hover {
      background: var(--mzo-hover);
      color: var(--mzo-text);
    }
    .ui-check-label input[type="checkbox"] {
      accent-color: var(--mzo-accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
      margin: 0;
      flex: none;
    }
    .ui-check-label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ui-check-label small { color: var(--mzo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .sub { display: block; font-size: 11.5px; color: var(--mzo-muted); margin-top: 2px; }

    /* Overview Executive Cards */
    .dtr-ov-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .dtr-card {
      background: var(--mzo-surface-2);
      border: 1px solid var(--mzo-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dtr-card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--mzo-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dtr-metric-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed var(--mzo-border);
      font-size: 13px;
    }
    .dtr-metric-row:last-child {
      border-bottom: none;
    }
    .dtr-metric-label {
      color: var(--mzo-text-2);
    }
    .dtr-metric-val {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--mzo-text);
    }

    /* Capacity bar matrix */
    .dtr-matrix-box {
      padding: 0 16px 16px;
    }
    .dtr-matrix-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--mzo-text);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dtr-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }
    .dtr-matrix-cell {
      padding: 10px;
      border-radius: 8px;
      background: var(--mzo-surface-2);
      border: 1px solid var(--mzo-border);
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .dtr-matrix-cell:hover {
      background: var(--mzo-hover);
      border-color: var(--mzo-border-strong);
    }
    .dtr-matrix-cell.active {
      border-color: var(--mzo-accent);
      background: var(--mzo-surface);
    }
    .dtr-cell-k {
      font-size: 11.5px;
      color: var(--mzo-muted);
      font-weight: 500;
    }
    .dtr-cell-v {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 0;
      font-variant-numeric: tabular-nums;
      color: var(--mzo-text);
    }
    .dtr-cell-s {
      font-size: 11px;
      color: var(--mzo-muted);
    }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>DTR records<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <a href="/dtr/load.html" class="ui-btn sm" title="Open DTR peak load measurement tool"><svg class="ui-i"><use href="#ui-arrow"/></svg>Peak load</a>
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search DTR, location or feeder" autocomplete="off" aria-label="Search DTR, location or feeder" title="DTR code, location, feeder or substation" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
          <span class="ui-select"><select id="ssFilter" aria-label="Substation"><option value="">All substations</option></select></span>
          <span class="ui-select"><select id="fdrFilter" aria-label="Feeder"><option value="">All feeders</option></select></span>
          <span class="ui-select"><select id="capaFilter" aria-label="Capacity"><option value="">All capacities</option></select></span>
          <span class="ui-select"><select id="catFilter" aria-label="Category"><option value="">All categories</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Quick filters</div>
          <div class="ui-check-group">
            <label class="ui-check-label"><input type="checkbox" id="chkLarge" /><span>100 kVA &amp; above</span><small id="cntLarge"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkMedium" /><span>63 kVA standard</span><small id="cntMedium"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkSmall" /><span>25 kVA &amp; below</span><small id="cntSmall"></small></label>
          </div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Facets">
            <button type="button" role="tab" data-pane="fCapa" aria-pressed="true" aria-selected="true">Capacity</button>
            <button type="button" role="tab" data-pane="fCat" aria-pressed="false" aria-selected="false">Category</button>
            <button type="button" role="tab" data-pane="fDivn" aria-pressed="false" aria-selected="false">Division</button>
          </div>
          <div aria-label="Capacity rating" id="fCapa"></div>
          <div aria-label="DTR category" id="fCat" hidden></div>
          <div aria-label="Division" id="fDivn" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary"></section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    var all = [];
    var tab = 'overview';
    var lastTable = null;

    var TABS = [
      ['overview', 'Overview & Profile'],
      ['region', 'Region'],
      ['division', 'Division'],
      ['ccc', 'CCC'],
      ['ss', 'Substation'],
      ['feeder', 'Feeder'],
      ['capacity', 'Capacity'],
      ['dtrs', 'DTR list']
    ];

    var KPI_STATS = [
      { key: '', label: 'Total DTRs', dot: '' },
      { key: 'totalCap', label: 'Total Capacity', dot: 'c1' },
      { key: 'avgCap', label: 'Avg DTR Size', dot: 'c2' },
      { key: 'large', label: '100 kVA & Above', dot: 'c4' },
      { key: 'medium', label: '63 kVA Units', dot: 'c5' },
      { key: 'small', label: '25 kVA & Below', dot: 'c6' }
    ];

    var KPI_MAP = {
      '': { label: 'All DTRs', test: function () { return true; } },
      'totalCap': { label: 'All transformers', test: function () { return true; } },
      'avgCap': { label: 'All transformers', test: function () { return true; } },
      'large': { label: '100 kVA & above', test: function (r) { return r.capa >= 100; } },
      'medium': { label: '63 kVA units', test: function (r) { return r.capa === 63; } },
      'small': { label: '25 kVA & below', test: function (r) { return r.capa <= 25; } }
    };

    var f = {
      q: '',
      region: '',
      division: '',
      ccc: '',
      ss: '',
      fdr: '',
      capa: '',
      cat: '',
      chkLarge: false,
      chkMedium: false,
      chkSmall: false,
      facetCapa: '',
      facetCat: '',
      facetDivn: '',
      kpi: ''
    };

    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter', 'ssFilter', 'fdrFilter', 'capaFilter', 'catFilter'];

    function clean(str) {
      return (str == null ? '' : String(str)).trim();
    }

    // The sheet's CAT column is the area category (as on feeders): R rural, U urban, M mixed. Codes not
    // listed here show as written.
    var CAT_NAME = { R: 'Rural', U: 'Urban', M: 'Mixed' };
    function catLabel(c) { return CAT_NAME[c] ? CAT_NAME[c] + ' (' + c + ')' : c || 'Not set'; }
    // Categories in these rows, most DTRs first: [[code, count]] ('' = not set).
    function catCounts(rows) {
      var m = {};
      rows.forEach(function (r) { m[r.cat] = (m[r.cat] || 0) + 1; });
      return Object.keys(m).map(function (c) { return [c, m[c]]; }).sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0]); });
    }

    function fmtCapa(kva) {
      if (kva == null || isNaN(kva)) return '0 kVA';
      if (kva >= 1000) {
        var mva = (kva / 1000).toFixed(2).split('.'); // toFixed keeps the old rounding; UI.n adds Indian grouping
        return UI.n(+mva[0]) + '.' + mva[1] + ' MVA';
      }
      return UI.n(Math.round(kva)) + ' kVA';
    }

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    $('stats').innerHTML = KPI_STATS.map(function (o) {
      return '<button type="button" class="ui-stat" data-k="' + o.key + '">' +
        '<div class="k">' + (o.dot ? '<span class="ui-dot ' + o.dot + '"></span>' : '') + UI.esc(o.label) + '</div>' +
        '<div class="v"><span class="ui-skel"></span></div>' +
        '<div class="s">&nbsp;</div>' +
        '</button>';
    }).join('');

    function build(t) {
      all = t.rows.map(function (d) {
        var capaVal = parseFloat(d.capa_kv) || 0;
        var r = {
          dtrCode: clean(d.dtr_code),
          location: clean(d.loc_name),
          capa: capaVal,
          cat: UI.blank(d.cat) ? '' : clean(d.cat),
          fdrName: clean(d.fdr_name),
          fdrCode: clean(d.fdr_code),
          ssName: clean(d.ss_name),
          ssCode: clean(d.ss_code),
          ccc: clean(d.supp_off).replace(/\s+/g, ' '),
          division: clean(d.divn_name).replace(/\s+/g, ' '),
          region: d._region || UI.regionName(clean(d.region).replace(/\s+/g, ' ')),
          _region: d._region || UI.regionName(clean(d.region)),
          _divn: d._division || clean(d.divn_name),
          _supp: d._ccc || clean(d.supp_off)
        };
        r.search = (r.dtrCode + ' ' + r.location + ' ' + r.fdrName + ' ' + r.ssName + ' ' + r.ccc + ' ' + r.division + ' ' + r.cat + ' ' + r.capa).toLowerCase();
        return r;
      });

      fillFilters();
    }

    function fillFilters() {
      var reg = $('regionFilter').value;
      var div = $('divisionFilter').value;
      var ccc = $('cccFilter').value;
      var ss = $('ssFilter').value;

      var regions = {};
      all.forEach(function (r) { if (r.region) regions[r.region] = 1; });
      UI.fill('regionFilter', Object.keys(regions).sort(), 'All regions');

      var r1 = all.filter(function (r) { return !reg || r.region === reg; });
      var divs = {};
      r1.forEach(function (r) { if (r.division) divs[r.division] = 1; });
      UI.fill('divisionFilter', Object.keys(divs).sort(), 'All divisions');

      var r2 = r1.filter(function (r) { return !div || r.division === div; });
      var cccs = {};
      r2.forEach(function (r) { if (r.ccc) cccs[r.ccc] = 1; });
      UI.fill('cccFilter', Object.keys(cccs).sort(), 'All CCCs');

      var r3 = r2.filter(function (r) { return !ccc || r.ccc === ccc; });
      var sss = {};
      r3.forEach(function (r) { if (r.ssName) sss[r.ssName] = 1; });
      UI.fill('ssFilter', Object.keys(sss).sort(), 'All substations');

      var r4 = r3.filter(function (r) { return !ss || r.ssName === ss; });
      var fdrs = {};
      r4.forEach(function (r) { if (r.fdrName) fdrs[r.fdrName] = 1; });
      UI.fill('fdrFilter', Object.keys(fdrs).sort(), 'All feeders');

      var capas = {};
      all.forEach(function (r) { if (r.capa) capas[r.capa] = 1; });
      var capaList = Object.keys(capas).map(Number).sort(function (a, b) { return a - b; }).map(function (c) {
        return { value: String(c), label: c + ' kVA' };
      });
      UI.fill('capaFilter', capaList, 'All capacities');

      var cats = {};
      all.forEach(function (r) { if (r.cat) cats[r.cat] = 1; });
      UI.fill('catFilter', Object.keys(cats).sort().map(function (c) { return { value: c, label: catLabel(c) }; }), 'All categories');

      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function filtered(skip) {
      var q = f.q.toLowerCase(), v = function (id) { return $(id).value; };
      return all.filter(function (r) {
        if (v('regionFilter') && r.region !== v('regionFilter')) return false;
        if (v('divisionFilter') && r.division !== v('divisionFilter')) return false;
        if (v('cccFilter') && r.ccc !== v('cccFilter')) return false;
        if (v('ssFilter') && r.ssName !== v('ssFilter')) return false;
        if (v('fdrFilter') && r.fdrName !== v('fdrFilter')) return false;
        if (v('capaFilter') && String(r.capa) !== v('capaFilter')) return false;
        if (v('catFilter') && r.cat !== v('catFilter')) return false;

        if (skip !== 'checkboxes') {
          if (f.chkLarge && r.capa < 100) return false;
          if (f.chkMedium && r.capa !== 63) return false;
          if (f.chkSmall && r.capa > 25) return false;
        }

        if (skip !== 'capa' && f.facetCapa && String(r.capa) !== f.facetCapa) return false;
        if (skip !== 'cat' && f.facetCat && r.cat !== f.facetCat) return false;
        if (skip !== 'divn' && f.facetDivn && r.division !== f.facetDivn) return false;

        if (q && r.search.indexOf(q) === -1) return false;

        return true;
      });
    }

    function renderFacets() {
      var bCapa = filtered('capa');
      var capas = {};
      bCapa.forEach(function (r) { if (r.capa) capas[r.capa] = (capas[r.capa] || 0) + 1; });
      var capaItems = Object.keys(capas).map(Number).sort(function (a, b) { return a - b; }).map(function (c) {
        return { value: String(c), label: c + ' kVA', count: capas[c] };
      });
      UI.facet($('fCapa'), capaItems, f.facetCapa, function (val) {
        f.facetCapa = val;
        render();
      });

      var bCat = filtered('cat');
      var cats = {};
      bCat.forEach(function (r) { if (r.cat) cats[r.cat] = (cats[r.cat] || 0) + 1; });
      var catItems = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; }).map(function (c) {
        return { value: c, label: catLabel(c), count: cats[c] };
      });
      UI.facet($('fCat'), catItems, f.facetCat, function (val) {
        f.facetCat = val;
        render();
      });

      var bDivn = filtered('divn');
      var divs = {};
      bDivn.forEach(function (r) { if (r.division) divs[r.division] = (divs[r.division] || 0) + 1; });
      var divItems = Object.keys(divs).sort(function (a, b) { return divs[b] - divs[a]; }).map(function (d) {
        return { value: d, label: d, count: divs[d] };
      });
      UI.facet($('fDivn'), divItems, f.facetDivn, function (val) {
        f.facetDivn = val;
        render();
      });
    }

    function render() {
      var b = filtered();

      var nOn = (f.q ? 1 : 0) +
        (f.chkLarge ? 1 : 0) + (f.chkMedium ? 1 : 0) + (f.chkSmall ? 1 : 0) +
        (f.facetCapa ? 1 : 0) + (f.facetCat ? 1 : 0) + (f.facetDivn ? 1 : 0) + (f.kpi ? 1 : 0);
      SELECTS.forEach(function (id) { if ($(id).value) nOn++; });

      setActive(nOn, {
        fCapa: !!f.facetCapa,
        fCat: !!f.facetCat,
        fDivn: !!f.facetDivn
      });

      var bChk = filtered('checkboxes');
      $('cntLarge').textContent = UI.n(bChk.filter(function (r) { return r.capa >= 100; }).length);
      $('cntMedium').textContent = UI.n(bChk.filter(function (r) { return r.capa === 63; }).length);
      $('cntSmall').textContent = UI.n(bChk.filter(function (r) { return r.capa <= 25; }).length);

      renderFacets();

      var totCount = b.length;
      var totCap = b.reduce(function (s, r) { return s + r.capa; }, 0);
      var avgCap = totCount ? (totCap / totCount).toFixed(1) : '0';

      var largeN = b.filter(function (r) { return r.capa >= 100; }).length;
      var medN = b.filter(function (r) { return r.capa === 63; }).length;
      var smallN = b.filter(function (r) { return r.capa <= 25; }).length;

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        if (k === '') {
          el.querySelector('.v').textContent = UI.n(totCount);
          el.querySelector('.s').textContent = 'Installed transformers';
        } else if (k === 'totalCap') {
          el.querySelector('.v').textContent = fmtCapa(totCap);
          el.querySelector('.s').textContent = 'Cumulative rating';
        } else if (k === 'avgCap') {
          el.querySelector('.v').textContent = avgCap + ' kVA';
          el.querySelector('.s').textContent = 'Average per unit';
        } else if (k === 'large') {
          el.querySelector('.v').textContent = UI.n(largeN);
          el.querySelector('.s').textContent = UI.pct(largeN, totCount) + ' of total units';
        } else if (k === 'medium') {
          el.querySelector('.v').textContent = UI.n(medN);
          el.querySelector('.s').textContent = UI.pct(medN, totCount) + ' of total units';
        } else if (k === 'small') {
          el.querySelector('.v').textContent = UI.n(smallN);
          el.querySelector('.s').textContent = UI.pct(smallN, totCount) + ' of total units';
        }
        el.setAttribute('aria-pressed', String(f.kpi === k));
      });

      if (all.length) $('asOn').textContent = UI.n(all.length) + ' DTRs registered';

      var view = f.kpi && KPI_MAP[f.kpi] ? b.filter(KPI_MAP[f.kpi].test) : b;

      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'dtrs' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';
      var hintText = (kpiTitle ? 'Showing ' + kpiTitle.toLowerCase() + '.' : '');
      $('hint').textContent = hintText;

      renderReportHead(view);
      renderTab(view, b);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';

      $('rhTitle').textContent = tabLabel + (kpiTitle ? ' · ' + kpiTitle : '');

      var viewCap = view.reduce(function (s, r) { return s + (r.capa || 0); }, 0);
      var allCap = all.reduce(function (s, r) { return s + (r.capa || 0); }, 0);

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> DTRs · ' + fmtCapa(allCap);
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' DTRs · ' + fmtCapa(viewCap);
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('regionFilter').value) {
        currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { $('regionFilter').value = ''; $('divisionFilter').value = ''; $('cccFilter').value = ''; $('ssFilter').value = ''; $('fdrFilter').value = ''; fillFilters(); } });
      }
      if ($('divisionFilter').value) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { $('divisionFilter').value = ''; $('cccFilter').value = ''; $('ssFilter').value = ''; $('fdrFilter').value = ''; fillFilters(); } });
      }
      if ($('cccFilter').value) {
        currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { $('cccFilter').value = ''; $('ssFilter').value = ''; $('fdrFilter').value = ''; fillFilters(); } });
      }
      if ($('ssFilter').value) {
        currentActiveFilters.push({ label: 'Substation', value: $('ssFilter').value, clear: function () { $('ssFilter').value = ''; $('fdrFilter').value = ''; fillFilters(); } });
      }
      if ($('fdrFilter').value) {
        currentActiveFilters.push({ label: 'Feeder', value: $('fdrFilter').value, clear: function () { $('fdrFilter').value = ''; fillFilters(); } });
      }
      if ($('capaFilter').value) {
        currentActiveFilters.push({ label: 'Capacity', value: $('capaFilter').value + ' kVA', clear: function () { $('capaFilter').value = ''; fillFilters(); } });
      }
      if ($('catFilter').value) {
        currentActiveFilters.push({ label: 'Category', value: catLabel($('catFilter').value), clear: function () { $('catFilter').value = ''; fillFilters(); } });
      }
      if (f.chkLarge) {
        currentActiveFilters.push({ label: 'Quick', value: '≥ 100 kVA', clear: function () { f.chkLarge = false; $('chkLarge').checked = false; } });
      }
      if (f.chkMedium) {
        currentActiveFilters.push({ label: 'Quick', value: '63 kVA', clear: function () { f.chkMedium = false; $('chkMedium').checked = false; } });
      }
      if (f.chkSmall) {
        currentActiveFilters.push({ label: 'Quick', value: '≤ 25 kVA', clear: function () { f.chkSmall = false; $('chkSmall').checked = false; } });
      }
      if (f.facetCapa) {
        currentActiveFilters.push({ label: 'Rating facet', value: f.facetCapa + ' kVA', clear: function () { f.facetCapa = ''; } });
      }
      if (f.facetCat) {
        currentActiveFilters.push({ label: 'Category facet', value: f.facetCat, clear: function () { f.facetCat = ''; } });
      }
      if (f.facetDivn) {
        currentActiveFilters.push({ label: 'Division facet', value: f.facetDivn, clear: function () { f.facetDivn = ''; } });
      }
      if (f.kpi && KPI_MAP[f.kpi]) {
        currentActiveFilters.push({ label: 'KPI', value: KPI_MAP[f.kpi].label, clear: function () { f.kpi = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    function renderTab(view, b) {
      var el = $('table');
      if (tab === 'overview') {
        renderOverview(b, el);
      } else if (tab === 'region') {
        UI.table(el, groupTable(b, function (r) { return r.region; }, 'Region', null, null, null, function (name) {
          $('regionFilter').value = name;
          tab = 'division';
          fillFilters();
          render();
        }));
      } else if (tab === 'division') {
        UI.table(el, groupTable(b, function (r) { return r.division; }, 'Division', null, null, function (r) { return r.region; }, function (name) {
          $('divisionFilter').value = name;
          tab = 'ccc';
          fillFilters();
          render();
        }));
      } else if (tab === 'ccc') {
        UI.table(el, groupTable(b, function (r) { return r.ccc; }, 'CCC Name', null, null, function (r) { return r.division; }, function (name) {
          $('cccFilter').value = name;
          tab = 'ss';
          fillFilters();
          render();
        }));
      } else if (tab === 'ss') {
        UI.table(el, groupTable(b, function (r) { return r.ssName; }, 'Substation Name', null, null, function (r) { return r.ccc; }, function (name) {
          $('ssFilter').value = name;
          tab = 'feeder';
          fillFilters();
          render();
        }));
      } else if (tab === 'feeder') {
        UI.table(el, groupTable(b, function (r) { return r.fdrName; }, 'Feeder Name', null, null, function (r) { return r.ssName; }, function (name) {
          $('fdrFilter').value = name;
          tab = 'dtrs';
          fillFilters();
          render();
        }));
      } else if (tab === 'capacity') {
        renderCapacityTable(b, el);
      } else if (tab === 'dtrs') {
        renderDTRList(view, el);
      }
    }

    function renderOverview(b, el) {
      var total = b.length;
      if (total === 0) {
        el.innerHTML = '<div class="ui-empty">No distribution transformers match the selected filters.</div>';
        lastTable = null;
        return;
      }

      var totCap = b.reduce(function (s, r) { return s + r.capa; }, 0);
      var avgCap = (totCap / total).toFixed(1);

      var capaMap = {};
      b.forEach(function (r) { capaMap[r.capa] = (capaMap[r.capa] || 0) + 1; });
      var sortedCapas = Object.entries(capaMap).map(function (e) { return [Number(e[0]), e[1]]; }).sort(function (a, b) { return a[0] - b[0]; });

      var catList = catCounts(b);

      var ssMap = {};
      b.forEach(function (r) {
        if (!ssMap[r.ssName]) ssMap[r.ssName] = { name: r.ssName, dtrs: 0, cap: 0, div: r.division };
        ssMap[r.ssName].dtrs++;
        ssMap[r.ssName].cap += r.capa;
      });
      var topSubstations = Object.values(ssMap).sort(function (a, b) { return b.cap - a.cap; }).slice(0, 5);

      var html = '<div class="dtr-ov-grid">';

      // Card 1: Capacity & Size
      html += '<div class="dtr-card">' +
        '<div class="dtr-card-title">Transformer Capacity Profile <span class="ui-dot c1"></span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Total installed DTRs</span><span class="dtr-metric-val">' + UI.n(total) + '</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Total capacity</span><span class="dtr-metric-val">' + fmtCapa(totCap) + '</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Average transformer rating</span><span class="dtr-metric-val">' + avgCap + ' kVA</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Substations served</span><span class="dtr-metric-val">' + Object.keys(ssMap).length + '</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Feeders connected</span><span class="dtr-metric-val">' + new Set(b.map(function (r) { return r.fdrName; })).size + '</span></div>' +
        '</div>';

      // Card 2: Rating Brackets
      var largeCount = b.filter(function (r) { return r.capa >= 100; }).length;
      var medCount = b.filter(function (r) { return r.capa === 63; }).length;
      var smallCount = b.filter(function (r) { return r.capa <= 25; }).length;
      html += '<div class="dtr-card">' +
        '<div class="dtr-card-title">Capacity Sizing Brackets <span class="ui-dot c2"></span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Large (≥ 100 kVA)</span><span class="dtr-metric-val">' + UI.n(largeCount) + ' (' + UI.pct(largeCount, total) + ')</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Standard (63 kVA)</span><span class="dtr-metric-val">' + UI.n(medCount) + ' (' + UI.pct(medCount, total) + ')</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Small (≤ 25 kVA)</span><span class="dtr-metric-val">' + UI.n(smallCount) + ' (' + UI.pct(smallCount, total) + ')</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Most common rating</span><span class="dtr-metric-val">' + (sortedCapas.slice().sort(function (a, b) { return b[1] - a[1]; })[0] ? sortedCapas.slice().sort(function (a, b) { return b[1] - a[1]; })[0][0] + ' kVA' : '—') + '</span></div>' +
        '<div class="dtr-metric-row"><span class="dtr-metric-label">Largest rating</span><span class="dtr-metric-val">' + (sortedCapas[sortedCapas.length - 1] ? sortedCapas[sortedCapas.length - 1][0] + ' kVA' : '—') + '</span></div>' +
        '</div>';

      // Card 3: area categories, as the sheet codes them
      html += '<div class="dtr-card">' +
        '<div class="dtr-card-title">Area Category Mix <span class="ui-dot c4"></span></div>' +
        catList.map(function (c) {
          return '<div class="dtr-metric-row"><span class="dtr-metric-label">' + UI.esc(catLabel(c[0])) + '</span><span class="dtr-metric-val">' + UI.n(c[1]) + ' (' + UI.pct(c[1], total) + ')</span></div>';
        }).join('') +
        '</div>';

      html += '</div>';

      // Capacity Matrix (Interactive Grid of Ratings)
      html += '<div class="dtr-matrix-box">' +
        '<div class="dtr-matrix-title"><span>Capacity Rating Distribution</span><small style="color:var(--mzo-muted)">Click any rating to filter</small></div>' +
        '<div class="dtr-matrix-grid">';
      sortedCapas.forEach(function (item) {
        var kva = item[0], count = item[1];
        var isSel = f.facetCapa === String(kva) || $('capaFilter').value === String(kva);
        html += '<div class="dtr-matrix-cell' + (isSel ? ' active' : '') + '" data-capa="' + kva + '">' +
          '<div class="dtr-cell-k">' + kva + ' kVA</div>' +
          '<div class="dtr-cell-v">' + UI.n(count) + '</div>' +
          '<div class="dtr-cell-s">' + UI.pct(count, total) + '</div>' +
          '</div>';
      });
      html += '</div></div>';

      // Top Substations by Capacity
      if (topSubstations.length) {
        html += '<div style="padding:0 16px 16px">' +
          '<div style="font-size:12px;font-weight:600;color:var(--mzo-muted);text-transform:uppercase;margin-bottom:8px">Top Substations by Installed Capacity</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
          topSubstations.map(function (s) {
            return '<div style="padding:6px 12px;background:var(--mzo-surface-2);border:1px solid var(--mzo-border);border-radius:6px;font-size:12.5px">' +
              '<strong>' + UI.esc(s.name) + '</strong> (' + UI.esc(s.div) + ') · <span style="color:var(--mzo-accent)">' + fmtCapa(s.cap) + '</span> · ' + UI.n(s.dtrs) + ' DTRs' +
              '</div>';
          }).join('') +
          '</div></div>';
      }

      el.innerHTML = html;

      el.querySelectorAll('.dtr-matrix-cell').forEach(function (cell) {
        cell.addEventListener('click', function () {
          var c = this.getAttribute('data-capa');
          f.capa = c;
          $('capaFilter').value = c;
          tab = 'dtrs';
          render();
        });
      });

      lastTable = {
        title: 'Transformer infrastructure overview',
        cols: ['Metric', 'Value'],
        rows: [
          ['Total DTRs', total],
          ['Total Capacity', fmtCapa(totCap)],
          ['Average Capacity', avgCap + ' kVA'],
          ['Large (≥100 kVA)', largeCount],
          ['Standard (63 kVA)', medCount],
          ['Small (≤25 kVA)', smallCount],
          ['Substations Served', Object.keys(ssMap).length]
        ].concat(catList.map(function (c) { return [catLabel(c[0]), c[1]]; }))
      };
    }

    function groupTable(b, keyFn, label, order, dots, subKeyFn, onRowAction) {
      var groups = {}, totalCount = b.length, totalCapacity = b.reduce(function (s, r) { return s + r.capa; }, 0);
      b.forEach(function (r) {
        var k = keyFn(r);
        if (k == null || k === '') k = 'Unknown';
        (Array.isArray(k) ? k : [k]).forEach(function (kk) {
          var g = groups[kk] || (groups[kk] = { name: kk, sub: subKeyFn ? subKeyFn(r) : '', n: 0, cap: 0 });
          g.n++;
          g.cap += r.capa;
        });
      });

      var list = Object.keys(groups).map(function (k) {
        var g = groups[k];
        g.avg = g.n ? (g.cap / g.n).toFixed(1) : 0;
        g.pctCount = UI.pct(g.n, totalCount);
        g.pctCap = UI.pct(g.cap, totalCapacity);
        return g;
      });

      if (order) {
        list.sort(function (a, b) {
          var ia = order.indexOf(a.name), ib = order.indexOf(b.name);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });
      } else {
        list.sort(function (a, b) { return b.cap - a.cap; });
      }

      var maxCount = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      var maxCap = Math.max.apply(null, list.map(function (g) { return g.cap; }).concat([0]));

      lastTable = {
        title: label,
        cols: [label, 'DTRs', 'Capacity (kVA)', 'Capacity (MVA)', 'Avg kVA', '% Share (Count)', '% Share (Capacity)'],
        rows: list.map(function (g) {
          return [
            g.name + (g.sub ? ' (' + g.sub + ')' : ''),
            g.n,
            Math.round(g.cap),
            fmtCapa(g.cap),
            g.avg,
            g.pctCount,
            g.pctCap
          ];
        })
      };

      return {
        rows: list,
        sort: order ? null : { key: 'cap', dir: 'desc' },
        count: false,
        empty: 'No transformers match these filters.',
        columns: [
          {
            key: 'name',
            label: label,
            cls: 'wrap',
            fmt: function (v, g) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span>' +
                (g.sub ? '<span class="sub">' + UI.esc(g.sub) + '</span>' : '');
            }
          },
          {
            key: 'n',
            label: 'DTRs',
            num: true,
            fmt: function (v) {
              return '<span class="ui-strong">' + UI.n(v) + '</span>' + UI.bar(v, maxCount, UI.pct(v, totalCount));
            }
          },
          {
            key: 'cap',
            label: 'Capacity',
            num: true,
            fmt: function (v) {
              return '<span class="ui-strong">' + fmtCapa(v) + '</span>' + UI.bar(v, maxCap, UI.pct(v, totalCapacity), 2);
            }
          },
          {
            key: 'avg',
            label: 'Avg Rating',
            num: true,
            hideSm: true,
            fmt: function (v) { return v + ' kVA'; }
          },
          {
            key: 'pctCap',
            label: 'Share',
            num: true,
            hideSm: true,
            fmt: function (v) { return v; }
          }
        ],
        foot: list.length > 1 ? {
          name: 'Total',
          n: totalCount,
          cap: totalCapacity,
          avg: totalCount ? (totalCapacity / totalCount).toFixed(1) : 0,
          pctCap: '100%'
        } : null,
        onRow: onRowAction ? function (g) { onRowAction(g.name); } : null
      };
    }

    function renderCapacityTable(b, el) {
      var groups = {}, totalCount = b.length, totalCapacity = b.reduce(function (s, r) { return s + r.capa; }, 0);
      var cats = catCounts(b).slice(0, 4).map(function (c) { return c[0]; });
      b.forEach(function (r) {
        var k = r.capa || 0;
        var g = groups[k] || (groups[k] = { capa: k, n: 0, cap: 0, byCat: {} });
        g.n++;
        g.cap += k;
        g.byCat[r.cat] = (g.byCat[r.cat] || 0) + 1;
      });
      var catCols = cats.map(function (c) {
        return {
          key: 'cat_' + c,
          label: CAT_NAME[c] || catLabel(c),
          num: true,
          hideSm: true,
          sortVal: function (g) { return g.byCat[c] || 0; },
          fmt: function (_, g) { var v = g.byCat[c] || 0; return v ? UI.n(v) : '<span class="ui-muted">0</span>'; }
        };
      });
      var foot = { capa: 'Total', n: totalCount, cap: totalCapacity, byCat: {} };
      catCounts(b).forEach(function (c) { foot.byCat[c[0]] = c[1]; foot['cat_' + c[0]] = c[1]; });

      var list = Object.values(groups).sort(function (a, b) { return a.capa - b.capa; });
      var maxCount = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      var maxCap = Math.max.apply(null, list.map(function (g) { return g.cap; }).concat([0]));

      lastTable = {
        title: 'Capacity rating breakdown',
        cols: ['Rating (kVA)', 'DTR Count', 'Total Capacity (MVA)', '% Count Share', '% Capacity Share'].concat(cats.map(function (c) { return (CAT_NAME[c] || catLabel(c)) + ' DTRs'; })),
        rows: list.map(function (g) {
          return [g.capa + ' kVA', g.n, fmtCapa(g.cap), UI.pct(g.n, totalCount), UI.pct(g.cap, totalCapacity)].concat(cats.map(function (c) { return g.byCat[c] || 0; }));
        })
      };

      UI.table(el, {
        rows: list,
        count: false,
        empty: 'No capacity records match.',
        columns: [
          {
            key: 'capa',
            label: 'Rating',
            fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + (typeof v === 'number' ? ' kVA' : '') + '</span>'; }
          },
          {
            key: 'n',
            label: 'DTR Count',
            num: true,
            fmt: function (v) {
              return '<span class="ui-strong">' + UI.n(v) + '</span>' + UI.bar(v, maxCount, UI.pct(v, totalCount));
            }
          },
          {
            key: 'cap',
            label: 'Cumulative Capacity',
            num: true,
            fmt: function (v) {
              return '<span class="ui-strong">' + fmtCapa(v) + '</span>' + UI.bar(v, maxCap, UI.pct(v, totalCapacity), 2);
            }
          },
        ].concat(catCols),
        foot: list.length > 1 ? foot : null,
        onRow: function (g) {
          f.capa = String(g.capa);
          $('capaFilter').value = String(g.capa);
          tab = 'dtrs';
          render();
        }
      });
    }

    function renderDTRList(view, el) {
      lastTable = {
        title: 'DTR register',
        cols: ['DTR Code', 'Location', 'Capacity', 'Category', 'CCC', 'Division', 'Substation', 'Feeder'],
        rows: view.map(function (r) {
          return [
            r.dtrCode,
            r.location,
            r.capa + ' kVA',
            catLabel(r.cat),
            r.ccc,
            r.division,
            r.ssName,
            r.fdrName
          ];
        })
      };

      UI.table(el, {
        rows: view,
        sort: { key: 'dtrCode', dir: 'asc' },
        limit: 50,
        resetPage: true,
        empty: 'No distribution transformers match these filters.',
        columns: [
          {
            key: 'dtrCode',
            label: 'DTR Code & Location',
            cls: 'wrap',
            fmt: function (v, r) {
              return '<span class="ui-strong" style="color:var(--mzo-accent)">' + UI.esc(v || '—') + '</span>' +
                '<span class="sub">' + UI.esc(r.location || 'Unknown location') + '</span>';
            }
          },
          {
            key: 'capa',
            label: 'Capacity',
            num: true,
            fmt: function (v, r) {
              return '<span class="ui-strong">' + v + ' kVA</span>' +
                '<span class="sub">' + UI.esc(catLabel(r.cat)) + '</span>';
            }
          },
          {
            key: 'ccc',
            label: 'Office & Division',
            cls: 'wrap',
            fmt: function (v, r) {
              return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r.division) + '</span>';
            }
          },
          {
            key: 'ssName',
            label: 'Substation & Feeder',
            cls: 'wrap',
            hideSm: true,
            fmt: function (v, r) {
              return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r.fdrName || '—') + '</span>';
            }
          }
        ],
        onRow: openDTRDrawer
      });
    }

    function openDTRDrawer(r) {
      var pairs = [
        ['DTR Code', r.dtrCode || '—'],
        ['Location Name', r.location || '—'],
        ['Capacity Rating', r.capa + ' kVA'],
        ['Area category', r.cat ? catLabel(r.cat) : '—'],
        ['Substation Name', r.ssName || '—'],
        ['Substation Code', r.ssCode || '—'],
        ['11 kV Feeder Name', r.fdrName || '—'],
        ['11 kV Feeder Code', r.fdrCode || '—'],
        ['CCC / Supply Office', r.ccc || '—'],
        ['Division Name', r.division || '—'],
        ['Region Name', r.region || '—']
      ];

      var extraHtml = '<div style="margin-top:16px">' +
        '<div style="font-size:12px;font-weight:600;color:var(--mzo-muted);text-transform:uppercase;margin-bottom:8px">Operations &amp; Measurement</div>' +
        '<a href="/dtr/load.html?dtr=' + encodeURIComponent(r.dtrCode) + '" style="display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;background:var(--mzo-surface-2);border:1px solid var(--mzo-border);color:var(--mzo-accent);font-size:13px;text-decoration:none;font-weight:500">' +
        '<svg class="ui-i"><use href="#ui-arrow"/></svg>Record / View Peak Load' +
        '</a>' +
        '</div>';

      var actionsHtml = '<button type="button" class="ui-btn sm" id="copyDTRBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy DTR</button>';

      UI.drawer(
        'DTR ' + r.dtrCode,
        [r.location, r.capa + ' kVA', r.ccc, r.division].filter(Boolean).join(' · '),
        pairs,
        extraHtml,
        actionsHtml
      );

      var copyBtn = document.getElementById('copyDTRBtn');
      if (copyBtn) {
        copyBtn.onclick = function () {
          var text = 'DTR CODE: ' + r.dtrCode + '\n' +
            'Location: ' + r.location + '\n' +
            'Capacity: ' + r.capa + ' kVA (' + r.cat + ')\n' +
            'Feeder: ' + r.fdrName + ' (' + r.ssName + ')\n' +
            'Office: ' + r.ccc + ', ' + r.division + ', ' + r.region;
          UI.copy(text).then(function () { UI.toast('DTR details copied'); });
        };
      }
    }

    function clearAll() {
      f.q = '';
      f.chkLarge = false;
      f.chkMedium = false;
      f.chkSmall = false;
      f.facetCapa = '';
      f.facetCat = '';
      f.facetDivn = '';
      f.kpi = '';
      $('q').value = '';
      $('chkLarge').checked = false;
      $('chkMedium').checked = false;
      $('chkSmall').checked = false;
      SELECTS.forEach(function (id) { $(id).value = ''; });
      fillFilters();
      render();
    }

    // Event listeners
    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      render();
    }, 150));

    ['regionFilter', 'divisionFilter', 'cccFilter', 'ssFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; $('ssFilter').value = ''; $('fdrFilter').value = ''; }
        if (id === 'divisionFilter') { $('cccFilter').value = ''; $('ssFilter').value = ''; $('fdrFilter').value = ''; }
        if (id === 'cccFilter') { $('ssFilter').value = ''; $('fdrFilter').value = ''; }
        if (id === 'ssFilter') { $('fdrFilter').value = ''; }
        fillFilters();
        render();
      });
    });

    ['fdrFilter', 'capaFilter', 'catFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        SELECTS.forEach(function (selId) { UI.mark($(selId)); });
        render();
      });
    });

    ['chkLarge', 'chkMedium', 'chkSmall'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        f[id] = this.checked;
        render();
      });
    });

    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var k = s.getAttribute('data-k');
      f.kpi = f.kpi === k ? '' : k;
      render();
    });

    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-t');
      render();
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });

    $('copyBtn').addEventListener('click', function () {
      if (!lastTable || !lastTable.rows.length) {
        UI.toast('Nothing to copy');
        return;
      }
      var t = lastTable.cols.join('\t') + '\n' +
        lastTable.rows.map(function (r) { return r.join('\t'); }).join('\n');
      UI.copy(t).then(function () { UI.toast(lastTable.title + ' copied'); });
    });

    $('exportBtn').addEventListener('click', function () {
      if (!lastTable || !lastTable.rows.length) {
        UI.toast('Nothing to export');
        return;
      }
      var cols = lastTable.cols.map(function (c, i) {
        return { key: i, label: c };
      });
      UI.exportCsv('dtr-' + tab + '.csv', cols, lastTable.rows);
    });

    // Initial Load & Refresh
    MzoRows.load('dtr_records', function (t, info) {
      if (!t) {
        if (info && info.error) $('table').innerHTML = '<div class="ui-empty">Could not load DTR data. Please refresh.</div>';
        return;
      }
      build(t);
      render();
    }, { scope: false, forceCheck: true });

    MzoRows.refresh('refreshBtn', 'dtr_records', function (t) {
      build(t);
      render();
    });

  });
  </script>
</body>
</html>
