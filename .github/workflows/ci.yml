name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS syntax (files and inline scripts) and JSON
        run: node scripts/tools/check_syntax.js

      - name: vercel.json, version.json and manifest.json parse
        run: |
          node -e '
            for (const f of ["vercel.json", "version.json", "manifest.json"]) {
              JSON.parse(require("fs").readFileSync(f, "utf8"));
              console.log("ok", f);
            }'

      - name: sw.js CACHE_NAME matches version.json cache
        run: |
          node -e '
            const fs = require("fs");
            const m = fs.readFileSync("sw.js", "utf8").match(/const CACHE_NAME = ["\x27]([^"\x27]+)["\x27]/);
            const v = JSON.parse(fs.readFileSync("version.json", "utf8"));
            if (!m) { console.error("::error file=sw.js::CACHE_NAME not found"); process.exit(1); }
            if (m[1] !== v.cache) {
              console.error(`::error file=sw.js::CACHE_NAME is ${m[1]} but version.json cache is ${v.cache}; bump both together`);
              process.exit(1);
            }
            console.log("ok", m[1], "version", v.version);'

      - name: VM shell scripts parse
        run: for f in vm/deploy/*.sh vm/dev/*.sh; do bash -n "$f" && echo "ok $f"; done

  # The offline test suites (scripts/tools/run_tests.js): fixtures, local mocks and temp folders only,
  # no network to Google, Supabase or the VM. The migrations guard runs in check_syntax.js above.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vm/sync/package-lock.json

      - name: Install packages (app and vm/sync)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund --ignore-scripts --prefix vm/sync

      - name: npm test
        run: npm test

  # The suites that need PocketBase start their own throwaway one (vm/dev/lib/local-pb.js: temp --dir,
  # a copy of the migrations, --automigrate=false) from the release in vm/pocketbase/VERSION.
  pocketbase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vm/sync/package-lock.json

      - name: Install packages (app and vm/sync)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund --ignore-scripts --prefix vm/sync

      - name: PocketBase (vm/pocketbase/VERSION, checksum-verified)
        run: |
          v=$(tr -d '[:space:]' < vm/pocketbase/VERSION)
          zip=pocketbase_${v}_linux_amd64.zip
          base=https://github.com/pocketbase/pocketbase/releases/download/v$v
          mkdir -p "$RUNNER_TEMP/pb" && cd "$RUNNER_TEMP/pb"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep " $zip\$" checksums.txt | sha256sum -c -
          unzip -q "$zip" pocketbase
          echo "PB_BIN=$RUNNER_TEMP/pb/pocketbase" >> "$GITHUB_ENV"

      - name: PocketBase suites (user store, sync types, data editor)
        run: npm test -- --pb --only pocketbase

      - name: No migration file was written into the repo
        run: |
          git status --porcelain vm/pocketbase/pb_migrations
          test -z "$(git status --porcelain vm/pocketbase/pb_migrations)"
