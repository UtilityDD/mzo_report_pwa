<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DISHA Login · Distribution Insights</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DISHA" />
  <script>
    /* DISHA theme early paint (no flash) */
    (function () {
      var d = document.documentElement, pref = 'system', t;
      try {
        pref = localStorage.getItem('mzo_theme_pref') || '';
        if (!pref) { t = localStorage.getItem('theme') || localStorage.getItem('mzo_theme'); pref = (t === 'light' || t === 'dark' || t === 'ppt') ? t : 'system'; }
      } catch (e) {}
      t = pref === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : ((pref === 'dark' || pref === 'ppt') ? pref : 'light');
      d.setAttribute('data-mzo-theme', t);
      d.setAttribute('data-theme-pref', pref);
      d.classList.toggle('dark-theme', t === 'dark');
      d.classList.toggle('light-theme', t === 'light' || t === 'ppt');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#09090a' : '#f1f1f0');
    })();
  </script>
  <script src="/mzo_pwa_icons.js"></script>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=21" />
  <script src="/mzo_app_update.js?v=89"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.initGoogleIdentityServices && window.initGoogleIdentityServices()"></script>
  <style>
    /* DISHA Login — Graphite design system (tokens from /mzo_theme.css) */
    html.ui, html.ui body { height: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      --text-title: var(--mzo-text); --text-desc: var(--mzo-muted);
      --input-border: var(--mzo-border-strong); --input-bg: var(--mzo-surface);
      min-height: 100%; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--mzo-canvas) !important; color: var(--mzo-text);
      font: 13.5px/1.5 var(--mzo-font); position: relative;
    }

    /* Top-right theme switcher */
    .login-top-bar {
      position: fixed; top: 14px; right: 16px; z-index: 20;
      display: flex; align-items: center; gap: 6px;
    }
    .theme-toggle-btn {
      width: 36px; height: 36px; border-radius: 9px;
      border: 1px solid var(--mzo-border); background: var(--mzo-surface); color: var(--mzo-muted);
      display: grid; place-items: center; cursor: pointer;
      transition: background-color .14s, color .14s, border-color .14s;
      user-select: none; -webkit-user-select: none;
    }
    .theme-toggle-btn:hover { background: var(--mzo-hover); color: var(--mzo-text); border-color: var(--mzo-border-strong); }
    .theme-toggle-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .theme-ico-sun { display: none; }
    .theme-ico-moon { display: block; }
    html[data-mzo-theme="dark"] .theme-ico-sun { display: block; }
    html[data-mzo-theme="dark"] .theme-ico-moon { display: none; }

    .login-container, .pending-approval-card {
      width: 100%; max-width: 360px; display: flex; flex-direction: column;
      background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 18px;
      padding: 38px 28px 34px; box-shadow: var(--mzo-shadow-pop);
    }
    .login-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; }
    .login-app-icon {
      width: 88px; height: 88px;
      background: #fff; border: none; box-shadow: none;
      display: flex; align-items: center; justify-content: center;
      padding: 0; border-radius: 20px; overflow: hidden;
    }
    .login-app-icon img { width: 88px; height: 88px; object-fit: contain; }
    .login-logo-dark { display: none !important; }
    .login-logo-light { display: block !important; }
    html[data-mzo-theme="dark"] .login-logo-light { display: none !important; }
    html[data-mzo-theme="dark"] .login-logo-dark { display: block !important; }

    .google-btn-wrap { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .google-signin-btn {
      width: 100%; height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 11px;
      border-radius: 11px; border: 1px solid var(--mzo-border-strong);
      background: var(--mzo-fill); color: var(--mzo-on-fill);
      font: 600 14px var(--mzo-font); cursor: pointer;
      transition: background-color .14s, transform .08s, box-shadow .14s;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .google-signin-btn:hover { background: var(--mzo-fill-hover); box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    .google-signin-btn:active { transform: translateY(1px); }
    .google-icon-plate {
      width: 26px; height: 26px; border-radius: 7px; background: #ffffff;
      display: grid; place-items: center; flex: none;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .google-icon { width: 16px; height: 16px; display: block; }

    .error-msg {
      margin-top: 2px; padding: 9px 12px; border-radius: 8px;
      background: var(--mzo-bad-soft); color: var(--mzo-bad);
      font-size: 12.5px; font-weight: 500; text-align: center; line-height: 1.4;
    }
    .error-msg:empty { display: none; }

    /* Pending approval */
    .pending-approval-card { align-items: flex-start; gap: 12px; }
    .pending-approval-card h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    .pending-approval-card p { margin: 0; color: var(--mzo-muted); font-size: 13px; }
    .user-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--mzo-surface-2); box-shadow: inset 0 0 0 1px var(--mzo-border); font-size: 12.5px; }
    .pending-actions { display: flex; gap: 8px; margin-top: 6px; width: 100%; }
    .btn-check-status, .btn-switch-account { flex: 1; height: 38px; border-radius: 8px; font: 500 13px var(--mzo-font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background-color .12s; }
    .btn-check-status { border: 0; background: var(--mzo-fill); color: var(--mzo-on-fill); }
    .btn-check-status:hover { background: var(--mzo-fill-hover); }
    .btn-switch-account { border: 1px solid var(--mzo-border-strong); background: var(--mzo-surface); color: var(--mzo-text); }
    .btn-switch-account:hover { background: var(--mzo-hover); }
    .pending-status-msg { font-size: 12.5px; min-height: 18px; }

    /* Modern theme-consistent post-login loading transition */
    #auth-transition {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; background: var(--mzo-canvas);
      opacity: 0; transition: opacity .22s cubic-bezier(.2, .7, .2, 1);
    }
    #auth-transition[hidden] { display: none; }
    #auth-transition.active { opacity: 1; }
    .auth-stage {
      width: 100%; max-width: 340px;
      background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 16px;
      padding: 30px 26px 26px; box-shadow: var(--mzo-shadow-pop);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      transform: translateY(4px) scale(.985);
      transition: transform .24s cubic-bezier(.2, .7, .2, 1);
    }
    #auth-transition.active .auth-stage { transform: translateY(0) scale(1); }

    .auth-orb {
      position: relative; width: 76px; height: 76px;
      display: grid; place-items: center;
    }
    .auth-ring-svg {
      position: absolute; inset: 0; width: 76px; height: 76px;
      transform: rotate(-90deg);
    }
    .auth-ring-track { fill: none; stroke: var(--mzo-border); stroke-width: 2.5; }
    .auth-ring-spin {
      fill: none; stroke: var(--mzo-accent); stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 64 160;
      transform-origin: 50% 50%;
      animation: auth-ring-rotate 1.15s cubic-bezier(.45, .05, .55, .95) infinite;
      transition: stroke-dasharray .35s ease, stroke .25s ease;
    }
    #auth-transition.success .auth-ring-spin {
      animation: none;
      stroke: var(--mzo-ok-mark);
      stroke-dasharray: 224 0;
    }
    @keyframes auth-ring-rotate { to { transform: rotate(360deg); } }

    .auth-orb-core {
      width: 58px; height: 58px; border-radius: 15px;
      background: #fff; border: 1px solid var(--mzo-border);
      display: flex; align-items: center; justify-content: center;
      padding: 4px; position: relative; overflow: hidden;
    }
    .auth-orb-core img { width: 100%; height: 100%; object-fit: contain; }
    .auth-check-badge {
      position: absolute; right: -2px; bottom: -2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--mzo-ok-mark); color: #ffffff;
      border: 2px solid var(--mzo-surface);
      display: grid; place-items: center;
      transform: scale(0); opacity: 0;
      transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s ease;
    }
    #auth-transition.success .auth-check-badge { transform: scale(1); opacity: 1; }

    .auth-copy { text-align: center; display: flex; flex-direction: column; gap: 4px; }
    .auth-copy h3 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--mzo-text); }
    .auth-copy p { margin: 0; font-size: 12.5px; color: var(--mzo-muted); }

    .auth-progress {
      width: 100%; height: 3px; border-radius: 999px;
      background: var(--mzo-surface-2); overflow: hidden; position: relative;
    }
    .auth-progress-bar {
      height: 100%; width: 0; border-radius: 999px;
      background: var(--mzo-accent);
      transition: width .35s cubic-bezier(.2, .7, .2, 1), background-color .25s ease;
    }
    #auth-transition.success .auth-progress-bar {
      width: 100% !important;
      background: var(--mzo-ok-mark);
    }

    @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
</head>
<body>

  <div class="login-top-bar">
    <button type="button" class="theme-toggle-btn" id="loginThemeBtn" title="Switch theme" aria-label="Switch theme">
      <svg class="theme-ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="theme-ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="login-container" id="loginCard">
    <div class="login-header">
      <div class="login-app-icon" aria-hidden="true">
        <img class="login-logo-light" src="/icons/disha-app-mark.png?v=309" alt="DISHA" width="128" height="128" />
        <img class="login-logo-dark" src="/icons/disha-app-mark.png?v=309" alt="DISHA" width="128" height="128" />
      </div>
    </div>

    <div class="google-btn-wrap" id="googleBtnContainer">
      <!-- Official GIS Button Mount -->
      <div id="g_id_signin_mount" style="display:none; width: 100%; justify-content: center;"></div>
      <!-- Styled Action Button -->
      <button type="button" class="google-signin-btn" id="googleFallbackBtn">
        <span class="google-icon-plate" aria-hidden="true">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </span>
        <span>Continue with Google</span>
      </button>

      <div class="error-msg" id="errorMsg" role="alert"></div>

    </div>
  </div>

  <!-- Pending Admin Approval Card -->
  <div class="pending-approval-card" id="pendingApprovalCard" style="display:none;">
    <h3>Waiting for approval</h3>
    <p id="pendingDesc">An administrator needs to approve your account and set your office.</p>
    
    <div class="user-pill">
      <span id="pendingEmail">user@example.com</span>
      <span id="pendingName" style="color: var(--text-desc); font-size: 11px;"></span>
    </div>

    <div class="pending-actions">
      <button type="button" class="btn-check-status" id="btnCheckStatus">
        <span id="checkStatusSpinner"></span>Check status
      </button>
      <button type="button" class="btn-switch-account" id="btnSwitchAccount">
        Back to sign in
      </button>
    </div>

    <div class="pending-status-msg" id="pendingStatusMsg"></div>
  </div>

  <div id="auth-transition" aria-live="polite" aria-busy="false" hidden>
    <div class="auth-stage">
      <div class="auth-orb" aria-hidden="true">
        <svg class="auth-ring-svg" viewBox="0 0 76 76">
          <circle class="auth-ring-track" cx="38" cy="38" r="35.5" />
          <circle class="auth-ring-spin" cx="38" cy="38" r="35.5" />
        </svg>
        <div class="auth-orb-core" id="authOrbCore">
          <img class="login-logo-light" src="/icons/disha-app-mark.png?v=309" alt="DISHA" width="48" height="48" />
          <img class="login-logo-dark" src="/icons/disha-app-mark.png?v=309" alt="DISHA" width="48" height="48" />
        </div>
        <span class="auth-check-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        </span>
      </div>
      <div class="auth-copy">
        <h3 id="authTitle">Signing in to DISHA</h3>
        <p id="authSubtitle">Verifying your Google account…</p>
      </div>
      <div class="auth-progress" aria-hidden="true">
        <div class="auth-progress-bar" id="authProgressBar"></div>
      </div>
    </div>
  </div>

  <script>
    const errorMsg = document.getElementById('errorMsg');
    const authTransition = document.getElementById('auth-transition');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const authProgressBar = document.getElementById('authProgressBar');

    // Theme toggle on login screen
    function toggleLoginTheme() {
      var html = document.documentElement;
      var cur = html.getAttribute('data-mzo-theme') || (window.MzoTheme ? window.MzoTheme.get() : 'dark');
      var next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-mzo-theme', next);
      html.setAttribute('data-theme-pref', next);
      html.setAttribute('data-bs-theme', next);
      html.classList.toggle('light-theme', next === 'light');
      html.classList.toggle('dark-theme', next === 'dark');
      html.classList.toggle('light', next === 'light');
      html.classList.toggle('dark', next === 'dark');
      if (document.body) {
        document.body.classList.toggle('light-theme', next === 'light');
        document.body.classList.toggle('dark-theme', next === 'dark');
        document.body.classList.toggle('light', next === 'light');
        document.body.classList.toggle('dark', next === 'dark');
      }
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', next === 'dark' ? '#09090a' : '#f1f1f0');
      try {
        localStorage.setItem('theme', next);
        localStorage.setItem('mzo_theme', next);
        localStorage.setItem('mzo_theme_pref', next);
        localStorage.setItem('collectionDashboardTheme', next);
      } catch (e) {}
      if (window.MzoTheme && typeof window.MzoTheme.apply === 'function') {
        window.MzoTheme.apply(next);
      }
    }
    document.getElementById('loginThemeBtn')?.addEventListener('click', toggleLoginTheme);

    // Clean up legacy saved PIN if any
    try { localStorage.removeItem('mzo_saved_pin'); } catch (e) {}

    let authStageTimer = [];

    function setAuthProgress(pct) {
      if (authProgressBar) authProgressBar.style.width = pct + '%';
    }

    function setAuthCopy(title, subtitle) {
      if (authTitle) authTitle.textContent = title;
      if (authSubtitle) authSubtitle.textContent = subtitle || '';
    }

    function clearAuthStageTimers() {
      if (Array.isArray(authStageTimer)) {
        authStageTimer.forEach(clearTimeout);
      }
      authStageTimer = [];
    }

    function showAuthTransition(initialTitle, initialSubtitle) {
      if (!authTransition) return;
      clearAuthStageTimers();
      authTransition.hidden = false;
      authTransition.classList.remove('success');
      authTransition.setAttribute('aria-busy', 'true');
      setAuthCopy(initialTitle || 'Signing in to DISHA', initialSubtitle || 'Verifying your Google account…');
      setAuthProgress(26);
      requestAnimationFrame(() => authTransition.classList.add('active'));

      const stages = [
        { at: 500, title: 'Signing in to DISHA', subtitle: 'Checking officer access & scope…', pct: 54 },
        { at: 1200, title: 'Almost there', subtitle: 'Preparing your DISHA workspace…', pct: 82 }
      ];
      stages.forEach(stage => {
        const t = setTimeout(() => {
          if (!authTransition.classList.contains('active') || authTransition.classList.contains('success')) return;
          setAuthCopy(stage.title, stage.subtitle);
          setAuthProgress(stage.pct);
        }, stage.at);
        authStageTimer.push(t);
      });
    }

    function hideAuthTransition() {
      if (!authTransition) return;
      clearAuthStageTimers();
      authTransition.classList.remove('active', 'success');
      authTransition.setAttribute('aria-busy', 'false');
      setTimeout(() => {
        if (!authTransition.classList.contains('active')) {
          authTransition.hidden = true;
          setAuthProgress(18);
        }
      }, 300);
    }

    function completeAuthTransition(profileName) {
      clearAuthStageTimers();
      if (!authTransition) return;
      authTransition.classList.add('success');
      const greet = profileName ? `Welcome, ${profileName}` : 'Welcome back';
      setAuthCopy(greet, 'Opening DISHA…');
      setAuthProgress(100);
    }

    // --- Google Sign-In & Pending Approval Logic ---
    let authConfig = { googleClientId: '' };

    function showPendingApproval(email, name, requestedAt, message) {
      document.getElementById('loginCard').style.display = 'none';
      const card = document.getElementById('pendingApprovalCard');
      card.style.display = 'flex';
      document.getElementById('pendingEmail').textContent = email || 'user@example.com';
      document.getElementById('pendingName').textContent = name ? ` (${name})` : '';
      if (message) document.getElementById('pendingDesc').textContent = message;
      sessionStorage.setItem('mzo_pending_email', email);
    }

    function hidePendingApproval() {
      document.getElementById('pendingApprovalCard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'flex';
      document.getElementById('pendingStatusMsg').textContent = '';
      sessionStorage.removeItem('mzo_pending_email');
    }

    document.getElementById('btnSwitchAccount')?.addEventListener('click', hidePendingApproval);

    document.getElementById('btnCheckStatus')?.addEventListener('click', async () => {
      const email = sessionStorage.getItem('mzo_pending_email') || document.getElementById('pendingEmail').textContent;
      const msgEl = document.getElementById('pendingStatusMsg');
      msgEl.style.color = 'var(--mzo-muted)';
      msgEl.textContent = 'Checking status…';

      try {
        const res = await fetch(`/api/auth/pending-status?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.status === 'success' && data.user_status === 'active') {
          msgEl.style.color = 'var(--mzo-ok)';
          msgEl.textContent = 'Approved. Signing you in…';
          setTimeout(() => {
            hidePendingApproval();
            window.location.reload();
          }, 1200);
        } else if (data.user_status === 'rejected') {
          msgEl.style.color = 'var(--mzo-bad)';
          msgEl.textContent = 'Access request was not approved by the administrator.';
        } else {
          msgEl.textContent = `Still pending review (Checked at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })})`;
        }
      } catch (e) {
        msgEl.style.color = 'var(--mzo-bad)';
        msgEl.textContent = 'Could not verify status. Please retry.';
      }
    });

    async function handleGoogleAuthPayload(body) {
      if (errorMsg) errorMsg.textContent = '';
      showAuthTransition('Signing in to DISHA', 'Verifying your Google account…');
      setAuthProgress(38);

      try {
        const response = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(body)
        });
        const data = await response.json();

        if (response.ok && data.status === 'success') {
          sessionStorage.removeItem('mzo_pending_email');
          localStorage.setItem('mzo_authenticated', 'true');
          localStorage.setItem('mzo_user_profile', JSON.stringify(data.profile));
          document.getElementById('loginInstallBtn')?.classList.add('hidden');
          completeAuthTransition(data.profile?.Name || data.profile?.Username);
          setTimeout(() => { window.location.href = nextUrl(); }, 680);
        } else if (data.status === 'pending') {
          hideAuthTransition();
          showPendingApproval(data.email, data.name, data.requested_at, data.message);
        } else {
          hideAuthTransition();
          errorMsg.textContent = data.message || 'Google sign-in declined.';
        }
      } catch (err) {
        hideAuthTransition();
        errorMsg.textContent = 'Connection error during Google Sign-In.';
      }
    }

    // Where to go after signing in: ?next= when it is a path on this site (never another origin, a
    // protocol-relative //host, a backslash trick or the login page itself), else the shell.
    function nextUrl() {
      var n = new URLSearchParams(location.search).get('next') || '';
      if (/^\/(?![\/\\])/.test(n)) {
        try {
          var u = new URL(n, location.origin);
          // The absolute URL, not the path: a path such as /.//host normalises to //host, which a browser
          // would read as another origin.
          if (u.origin === location.origin && !/^\/login\.html$/i.test(u.pathname)) return u.href;
        } catch (e) {}
      }
      return '/app.html';
    }

    // Google GIS Credential Handler (JWT One-Tap or GIS Button)
    window.handleGoogleCredentialResponse = function(response) {
      if (response && response.credential) {
        handleGoogleAuthPayload({ credential: response.credential });
      }
    };

    let googleTokenClient = null;

    window.initGoogleIdentityServices = function() {
      if (!authConfig.googleClientId || !window.google?.accounts) return;

      // 1. Initialize OAuth 2.0 Token Client (Opens official Google account selection popup)
      if (window.google.accounts.oauth2 && !googleTokenClient) {
        try {
          googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: authConfig.googleClientId,
            scope: 'email profile openid',
            prompt: 'select_account',
            callback: async (tokenResponse) => {
              if (tokenResponse && tokenResponse.access_token) {
                handleGoogleAuthPayload({ accessToken: tokenResponse.access_token });
              } else if (tokenResponse && tokenResponse.error) {
                console.warn('[Google Auth] OAuth token response error:', tokenResponse);
                if (tokenResponse.error !== 'access_denied' && errorMsg) {
                  errorMsg.textContent = 'Google sign-in could not complete. Please try again.';
                }
              }
            },
            error_callback: (err) => {
              console.warn('[Google Auth] OAuth popup error:', err);
              if (errorMsg && err?.type !== 'popup_closed') {
                errorMsg.textContent = 'Google sign-in popup could not open. Please allow pop-ups for this site and try again.';
              }
            }
          });
        } catch (err) {
          console.warn('[Google Auth] OAuth2 init error:', err);
        }
      }

      // 2. Initialize GIS ID Services (One-Tap / fallback)
      if (window.google.accounts.id) {
        try {
          google.accounts.id.initialize({
            client_id: authConfig.googleClientId,
            callback: window.handleGoogleCredentialResponse,
            auto_select: false
          });
        } catch (err) {
          console.warn('[Google Auth] GIS init error:', err);
        }
      }
    };

    let authConfigLoaded = false;
    let authConfigPromise = null;

    function loadAuthConfig() {
      if (authConfigLoaded && authConfig.googleClientId) {
        return Promise.resolve(authConfig);
      }
      if (!authConfigPromise) {
        authConfigPromise = fetch('/api/auth/config')
          .then(r => r.json())
          .then(cfg => {
            if (cfg && typeof cfg === 'object') authConfig = cfg;
            authConfigLoaded = true;
            window.initGoogleIdentityServices();
            return authConfig;
          })
          .catch(() => {
            authConfigLoaded = true;
            return authConfig;
          })
          .finally(() => {
            authConfigPromise = null;
          });
      }
      return authConfigPromise;
    }

    // Load auth config on startup
    loadAuthConfig();

    // Periodic check to ensure GIS mounts once script is cached
    window.addEventListener('load', () => {
      setTimeout(() => window.initGoogleIdentityServices(), 300);
      setTimeout(() => window.initGoogleIdentityServices(), 1200);
    });

    function openGoogleSignInPrompt() {
      window.initGoogleIdentityServices();
      if (googleTokenClient) {
        try {
          googleTokenClient.requestAccessToken({ prompt: 'select_account' });
          return true;
        } catch (err) {
          console.warn('[Google Auth] requestAccessToken error:', err);
        }
      }
      if (authConfig.googleClientId && window.google?.accounts?.id) {
        google.accounts.id.prompt((notification) => {
          if ((notification.isNotDisplayed() || notification.isSkippedMoment()) && errorMsg) {
            errorMsg.textContent = 'Google sign-in did not open. Please allow pop-ups for this site and try again.';
          }
        });
        return true;
      }
      return false;
    }

    async function triggerGoogleSignIn() {
      if (errorMsg) errorMsg.textContent = '';
      if (openGoogleSignInPrompt()) return;

      await loadAuthConfig();
      if (openGoogleSignInPrompt()) return;

      if (!authConfig.googleClientId) {
        if (errorMsg) {
          errorMsg.textContent = 'Google Sign-In is not configured on this server (missing GOOGLE_CLIENT_ID).';
        }
        return;
      }

      if (!window.google?.accounts && errorMsg) {
        errorMsg.textContent = 'Google Identity Services is still loading. Please try again in a moment.';
      }
    }

    // Google sign in button click
    document.getElementById('googleFallbackBtn')?.addEventListener('click', triggerGoogleSignIn);

    // Check if there was an active pending email in sessionStorage
    const lastPendingEmail = sessionStorage.getItem('mzo_pending_email');
    if (lastPendingEmail && localStorage.getItem('mzo_authenticated') !== 'true') {
      showPendingApproval(lastPendingEmail);
    }

    // A saved flag without a live session used to bounce login ↔ home forever.
    if (localStorage.getItem('mzo_authenticated') === 'true') {
      const cardInstallBtn = document.getElementById('loginInstallBtn');
      if (cardInstallBtn) cardInstallBtn.classList.add('hidden');
      showAuthTransition('Welcome back', 'Restoring your DISHA workspace…');
      setAuthProgress(55);
      fetch('/api/session-check', { credentials: 'same-origin' })
        .then((res) => {
          if (res.ok) {
            completeAuthTransition();
            setTimeout(() => { window.location.href = nextUrl(); }, 320);
            return;
          }
          localStorage.removeItem('mzo_authenticated');
          hideAuthTransition();
        })
        .catch(() => {
          localStorage.removeItem('mzo_authenticated');
          hideAuthTransition();
        });
    }

    // Optional one-tap install (no modal). Chrome/Edge native prompt only.
    (function initPwaInstallOnLogin() {
      var deferredPrompt = null;
      var cardInstallBtn = document.getElementById('loginInstallBtn');
      var cardInstallLabel = document.getElementById('loginInstallBtnLabel');
      function isLoggedIn() {
        return localStorage.getItem('mzo_authenticated') === 'true';
      }
      function isStandaloneApp() {
        return window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.navigator.standalone === true;
      }
      function hideInstallUi() {
        if (cardInstallBtn) cardInstallBtn.classList.add('hidden');
      }
      if (isLoggedIn() || isStandaloneApp()) {
        hideInstallUi();
        return;
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        if (e && e.preventDefault) e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        hideInstallUi();
      });
      if (cardInstallBtn) {
        cardInstallBtn.addEventListener('click', async function (e) {
          if (e && e.preventDefault) e.preventDefault();
          if (cardInstallLabel) cardInstallLabel.textContent = 'Installing…';
          if ('serviceWorker' in navigator) {
            try {
              await navigator.serviceWorker.register('/sw.js');
              await navigator.serviceWorker.ready;
            } catch (err) {}
          }
          if (deferredPrompt) {
            try {
              await deferredPrompt.prompt();
              await deferredPrompt.userChoice;
            } catch (err) {}
            deferredPrompt = null;
          }
          if (cardInstallLabel) cardInstallLabel.textContent = 'Install DISHA app';
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
    })();
  </script>
</body>
