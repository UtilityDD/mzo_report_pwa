<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feeder outage · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Feeder outage</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <span class="ui-select"><select id="monthPick" aria-label="Month"><option value="">All months</option></select></span>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Feeder, substation or code" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="ssFilter" aria-label="Substation"><option value="">All substations</option></select></span>
      <span class="ui-select"><select id="catFilter" aria-label="Category"><option value="">All categories</option><option value="R">Rural</option><option value="U">Urban</option><option value="M">Mixed</option></select></span>
      <span class="ui-select"><select id="natFilter" aria-label="Nature"><option value="">All natures</option><option value="A">Agri</option><option value="O">Others</option><option value="I">Industrial</option><option value="__blank">Not set</option></select></span>
      <span class="ui-select"><select id="schemeFilter" aria-label="Scheme"><option value="">All schemes</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <div class="ui-stat"><div class="k">Feeders</div><div class="v" id="sFeeders"><span class="ui-skel"></span></div><div class="s" id="sFeedersS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Avg daily outage</div><div class="v" id="sDaily"><span class="ui-skel"></span></div><div class="s" id="sDailyS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Monthly range</div><div class="v" id="sRange"><span class="ui-skel"></span></div><div class="s" id="sRangeS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Yearly average</div><div class="v" id="sYear"><span class="ui-skel"></span></div><div class="s" id="sYearS">&nbsp;</div></div>
      <button type="button" class="ui-stat" id="concernStat" title="1 h a day, 30+ outages, or 50% and 2 h above last month"><div class="k"><span class="ui-dot bad"></span>Concern</div><div class="v" id="sConcern"><span class="ui-skel"></span></div><div class="s">1 h/day · 30+ trips · rising</div></button>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="cutTitle">Outage hours per feeder</h2>
        <div class="ui-tabs" role="tablist" id="levelTabs">
          <button type="button" class="ui-tab" role="tab" data-l="all" aria-selected="true">All</button>
            <button type="button" class="ui-tab" role="tab" data-l="region">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ss">Substation</button>
            <button type="button" class="ui-tab" role="tab" data-l="feeder">Feeder</button>
        </div>
      </div>
      <div class="ui-panel-b"><div id="chart"><div class="ui-empty">Loading…</div></div><p class="ui-note" id="chartNote" style="margin:8px 0 0"></p></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="tableTitle">Feeders</h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="feederTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var CAT = { R: 'Rural', U: 'Urban', M: 'Mixed' }, NAT = { A: 'Agri', O: 'Others', I: 'Industrial' };
    var all = [], monthPick = '', concernOnly = false, level = 'all', scope = null;

    function mean(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
    function mLabel(m) { return (MON[+String(m).slice(4, 6) - 1] || m) + ' ' + String(m).slice(0, 4); }
    function mShort(m) { return (MON[+String(m).slice(4, 6) - 1] || m) + ' ' + String(m).slice(2, 4); }
    function dim(m) { return new Date(+String(m).slice(0, 4), +String(m).slice(4, 6), 0).getDate() || 30; }
    function fmtH(n) { return isFinite(n) ? n.toFixed(1) + ' h' : '—'; }
    function fmtDaily(h) { if (!isFinite(h)) return '—'; var min = h * 60; return min >= 90 ? h.toFixed(1) + ' h' : Math.round(min) + ' min'; }
    function pick(row, name) {
      if (row[name] != null && String(row[name]).trim() !== '') return String(row[name]).trim();
      var want = name.toLowerCase().replace(/[^a-z0-9]+/g, '');
      for (var k in row) if (k.toLowerCase().replace(/[^a-z0-9]+/g, '') === want && String(row[k]).trim()) return String(row[k]).trim();
      return '';
    }

    function normalize(raw) {
      var month = pick(raw, 'REPORT MONTH').replace(/\D/g, '').slice(0, 6), feeder = pick(raw, 'FEEDER NAME');
      if (month.length < 6 || !feeder) return null;
      var circle = pick(raw, 'CIRCLE NAME'), divRaw = pick(raw, 'DIVISION NAME');
      var region = (window.MzoScope && MzoScope.regionNameOf(circle)) || UI.title(circle);
      var division = (window.MzoScope && MzoScope.divisionNameOf(divRaw)) || UI.title(divRaw);
      var minutes = parseFloat(pick(raw, 'TOTAL DURATION OF OUTAGE OVER 5 MIN').replace(/,/g, '')) || 0;
      var count = parseFloat(pick(raw, 'TOTAL COUNT OF OUTAGE OVER 5 MIN').replace(/,/g, '')) || 0;
      var hours = minutes / 60, days = dim(month), ss = pick(raw, 'SUBSTATION NAME'), code = pick(raw, 'FEEDER CODE');
      return {
        month: month, feeder: feeder, substation: ss, code: code, category: pick(raw, 'FEEDER CATEGORY').toUpperCase(),
        nature: pick(raw, 'NATURE OF FEEDER').toUpperCase(), scheme: pick(raw, 'FEEDER FLAG'),
        region: region, division: division, REGION_NORM: region, DIVISION_NORM: division,
        count: count, hours: hours, days: days, daily: hours / days,
        search: (feeder + ' ' + ss + ' ' + code + ' ' + division).toLowerCase()
      };
    }

    function fillFilters() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', UI.uniq(all, 'region'), 'All regions');
      var r1 = all.filter(function (r) { return !reg || r.region === reg; });
      UI.fill('divisionFilter', UI.uniq(r1, 'division'), 'All divisions');
      var r2 = r1.filter(function (r) { return !div || r.division === div; });
      UI.fill('ssFilter', UI.uniq(r2, 'substation'), 'All substations');
      UI.fill('schemeFilter', UI.uniq(all, 'scheme'), 'All schemes');
      if (!scope) scope = UI.lockScope();
      ['regionFilter', 'divisionFilter', 'ssFilter', 'catFilter', 'natFilter', 'schemeFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function base() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ss = $('ssFilter').value,
        cat = $('catFilter').value, nat = $('natFilter').value, sch = $('schemeFilter').value, q = $('q').value.trim().toLowerCase();
      return all.filter(function (r) {
        return (!reg || r.region === reg) && (!div || r.division === div) && (!ss || r.substation === ss) && (!cat || r.category === cat) &&
          (nat === '__blank' ? !r.nature : (!nat || r.nature === nat)) && (!sch || r.scheme === sch) && (!q || r.search.indexOf(q) !== -1);
      });
    }

    function feederKey(r) { return r.code || (r.feeder + '|' + r.substation + '|' + r.division); }
    // One record per feeder with its months; concern judged on the last month in view.
    function feeders(rows) {
      var map = {};
      rows.forEach(function (r) {
        var key = feederKey(r);
        var f = map[key] || (map[key] = { key: key, feeder: r.feeder, code: r.code, substation: r.substation, division: r.division, region: r.region, category: r.category, nature: r.nature, scheme: r.scheme, months: [] });
        if (!f.months.some(function (m) { return m.month === r.month; })) f.months.push(r);
      });
      return Object.keys(map).map(function (k) {
        var f = map[k];
        f.months.sort(function (a, b) { return a.month.localeCompare(b.month); });
        var slice = monthPick ? f.months.filter(function (m) { return m.month === monthPick; }) : f.months;
        if (!slice.length) return null;
        var last = slice[slice.length - 1], idx = f.months.indexOf(last), prev = idx > 0 ? f.months[idx - 1] : null;
        var year = f.months[f.months.length - 1].month.slice(0, 4), hrs = f.months.map(function (m) { return m.hours; });
        var reasons = [];
        if (last.daily >= 1) reasons.push('1 h/day');
        if (last.count >= 30) reasons.push('30+ trips');
        if (prev && prev.hours > 0 && last.hours >= prev.hours * 1.5 && last.hours - prev.hours >= 2) reasons.push('rising');
        f.daily = mean(slice.map(function (m) { return m.daily; }));
        f.monthly = mean(slice.map(function (m) { return m.hours; }));
        f.count = mean(slice.map(function (m) { return m.count; }));
        f.min = Math.min.apply(null, hrs); f.max = Math.max.apply(null, hrs);
        f.range = f.months.length < 2 ? null : f.max - f.min;
        f.year = mean(f.months.filter(function (m) { return m.month.slice(0, 4) === year; }).map(function (m) { return m.hours; }));
        f.trend = prev && prev.hours > 0 ? (last.hours - prev.hours) / prev.hours : null;
        f.reasons = reasons; f.concern = reasons.length > 0;
        return f;
      }).filter(Boolean);
    }

    function groupKey(f, l) { return l === 'region' ? f.region : l === 'division' ? f.division : l === 'ss' ? f.substation : f.key; }
    function groups(list) {
      var map = {};
      list.forEach(function (f) {
        var k = groupKey(f, level) || 'Unmapped';
        var g = map[k] || (map[k] = { key: k, name: k, parent: level === 'division' ? f.region : level === 'ss' ? f.division : '', members: [] });
        g.members.push(f);
      });
      return Object.keys(map).map(function (k) {
        var g = map[k], by = {};
        g.members.forEach(function (f) { f.months.forEach(function (m) { (by[m.month] || (by[m.month] = [])).push(m); }); });
        var months = Object.keys(by).sort().map(function (m) { var h = mean(by[m].map(function (r) { return r.hours; })); return { month: m, hours: h, daily: h / dim(m), count: mean(by[m].map(function (r) { return r.count; })) }; });
        var use = monthPick ? months.filter(function (m) { return m.month === monthPick; }) : months; if (!use.length) use = months;
        var last = use[use.length - 1], idx = months.indexOf(last), prev = idx > 0 ? months[idx - 1] : null, hrs = months.map(function (m) { return m.hours; });
        var year = last ? last.month.slice(0, 4) : '';
        g.feeders = g.members.length;
        g.daily = mean(use.map(function (m) { return m.daily; }));
        g.monthly = mean(use.map(function (m) { return m.hours; }));
        g.count = mean(use.map(function (m) { return m.count; }));
        g.min = Math.min.apply(null, hrs); g.max = Math.max.apply(null, hrs); g.range = hrs.length < 2 ? null : g.max - g.min;
        g.year = mean(months.filter(function (m) { return m.month.slice(0, 4) === year; }).map(function (m) { return m.hours; }));
        g.trend = prev && prev.hours > 0 ? (last.hours - prev.hours) / prev.hours : null;
        g.concern = g.members.filter(function (f) { return f.concern; }).length;
        return g;
      });
    }

    function trendCell(v) {
      if (v == null) return '<span class="ui-muted">—</span>';
      var p = Math.round(v * 100);
      if (Math.abs(p) < 1) return '<span class="ui-delta flat">flat</span>';
      return '<span class="ui-delta ' + (p > 0 ? 'bad' : 'ok') + '">' + (p > 0 ? '+' : '−') + Math.abs(p) + '%</span>';
    }
    function rangeCell(_, r) { return r.range == null ? '—' : r.min.toFixed(1) + '–' + r.max.toFixed(1) + ' h'; }

    function avgByMonth(rows, months) {
      var by = {};
      rows.forEach(function (r) { (by[r.month] || (by[r.month] = [])).push(r.hours); });
      return months.map(function (m) { return by[m] ? +mean(by[m]).toFixed(2) : null; });
    }

    function render() {
      var b = base(), list = feeders(b);
      // Stats
      var bMonths = UI.uniq(b, 'month');
      var stats = bMonths.map(function (m) { return mean(b.filter(function (r) { return r.month === m; }).map(function (r) { return r.hours; })); });
      $('sFeeders').textContent = UI.n(list.length);
      $('sFeedersS').textContent = monthPick ? mLabel(monthPick) : bMonths.length + ' month' + (bMonths.length === 1 ? '' : 's');
      $('sDaily').textContent = list.length ? fmtDaily(mean(list.map(function (f) { return f.daily; }))) : '—';
      $('sDailyS').textContent = 'per feeder' + (monthPick ? ' · ' + mLabel(monthPick) : '');
      if (stats.length >= 2) { $('sRange').textContent = Math.min.apply(null, stats).toFixed(1) + '–' + Math.max.apply(null, stats).toFixed(1) + ' h'; $('sRangeS').textContent = 'lowest to highest month'; }
      else { var hs = list.map(function (f) { return f.monthly; }); $('sRange').textContent = hs.length ? Math.min.apply(null, hs).toFixed(1) + '–' + Math.max.apply(null, hs).toFixed(1) + ' h' : '—'; $('sRangeS').textContent = 'across feeders'; }
      var yr = (monthPick || bMonths[bMonths.length - 1] || '').slice(0, 4), ym = bMonths.filter(function (m) { return m.slice(0, 4) === yr; });
      $('sYear').textContent = ym.length ? fmtH(mean(ym.map(function (m) { return stats[bMonths.indexOf(m)]; }))) : '—';
      $('sYearS').textContent = yr ? yr + ' · ' + ym.length + ' month' + (ym.length === 1 ? '' : 's') : '';
      $('sConcern').textContent = UI.n(list.filter(function (f) { return f.concern; }).length);
      $('concernStat').setAttribute('aria-pressed', String(concernOnly));

      var view = concernOnly ? list.filter(function (f) { return f.concern; }) : list;
      var keep = concernOnly ? new Set(view.map(function (f) { return f.key; })) : null;
      var viewRows = keep ? b.filter(function (r) { return keep.has(feederKey(r)); }) : b;

      // Chart: average outage hours per feeder by month, for the chosen cut
      var ms = UI.uniq(viewRows, 'month'), series = [], capped = false, total = 0;
      if (level === 'all') {
        var reg = $('regionFilter').value, div = $('divisionFilter').value, ss = $('ssFilter').value;
        series = [{ label: ss || div || reg || 'All feeders', values: avgByMonth(viewRows, ms), strong: true }];
      } else {
        var by = {};
        viewRows.forEach(function (r) {
          var k = level === 'region' ? r.region : level === 'division' ? r.division : level === 'ss' ? r.substation : feederKey(r);
          (by[k] || (by[k] = { label: level === 'feeder' ? r.feeder : k, rows: [] })).rows.push(r);
        });
        var gs = Object.keys(by).map(function (k) { return { label: by[k].label, values: avgByMonth(by[k].rows, ms), score: mean(by[k].rows.map(function (r) { return r.hours; })) }; });
        gs.sort(function (a, c) { return c.score - a.score; });
        total = gs.length;
        var cap = level === 'ss' || level === 'feeder' ? 12 : gs.length;
        capped = gs.length > cap; gs = gs.slice(0, cap).reverse();
        if (gs.length) gs[gs.length - 1].strong = true;
        series = gs;
      }
      var narrow = ($('chart').clientWidth || 800) < 560;
      UI.line('chart', { labels: ms.map(function (m) { return narrow ? (MON[+m.slice(4, 6) - 1] || m) : mShort(m); }), series: series, fmt: function (v) { return v.toFixed(1) + ' h'; }, axis: function (v) { return v.toFixed(v < 10 && v % 1 ? 1 : 0) + ' h'; }, title: 'Outage hours per feeder' });
      $('chartNote').textContent = (level === 'feeder' ? 'Each line is one feeder’s outage hours in the month.' : 'Average outage hours per feeder in the month.') + (capped ? ' Showing the 12 highest of ' + total + '; the table lists all.' : '');
      $('cutTitle').textContent = 'Outage hours per feeder' + (concernOnly ? ' · concern only' : '');

      // Table for the same cut
      var cutRows = level === 'all' || level === 'feeder' ? view : groups(view);
      var feederCols = [
        { key: 'feeder', label: 'Feeder', fmt: function (v, f) { var meta = [CAT[f.category], NAT[f.nature], f.scheme].filter(Boolean).join(' · '); return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (f.concern ? ' <span class="ui-badge bad">' + UI.esc(f.reasons.join(', ')) + '</span>' : '') + (meta ? '<span class="sub">' + UI.esc(meta) + '</span>' : ''); }, csv: function (f) { return f.feeder; } },
        { key: 'substation', label: 'Substation', fmt: function (v, f) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(f.division) + '</span>'; }, csv: function (f) { return f.substation; } },
        { key: 'daily', label: 'Daily', num: true, fmt: fmtDaily, csv: function (f) { return (f.daily * 60).toFixed(0) + ' min'; } },
        { key: 'monthly', label: 'Per month', num: true, fmt: fmtH, csv: function (f) { return f.monthly.toFixed(1); } },
        { key: 'count', label: 'Outages', num: true, fmt: function (v) { return UI.n(Math.round(v)); }, csv: function (f) { return Math.round(f.count); } },
        { key: 'range', label: 'Range', num: true, hideSm: true, fmt: rangeCell, sortVal: function (f) { return f.range == null ? -1 : f.range; }, csv: function (f) { return f.range == null ? '' : f.min.toFixed(1) + '-' + f.max.toFixed(1); } },
        { key: 'year', label: 'Year avg', num: true, hideSm: true, fmt: fmtH, csv: function (f) { return f.year.toFixed(1); } },
        { key: 'trend', label: 'vs prev', num: true, fmt: trendCell, sortVal: function (f) { return f.trend == null ? -9 : f.trend; }, csv: function (f) { return f.trend == null ? '' : Math.round(f.trend * 100) + '%'; } }
      ];
      var groupCols = [
        { key: 'name', label: level === 'region' ? 'Region' : level === 'division' ? 'Division' : 'Substation', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
        { key: 'feeders', label: 'Feeders', num: true, fmt: UI.n },
        { key: 'concern', label: 'Concern', num: true, fmt: function (v) { return v ? '<span class="ui-delta bad">' + UI.n(v) + '</span>' : '<span class="ui-muted">0</span>'; } },
        { key: 'daily', label: 'Daily', num: true, fmt: fmtDaily },
        { key: 'monthly', label: 'Per month', num: true, fmt: fmtH },
        { key: 'count', label: 'Outages', num: true, fmt: function (v) { return UI.n(Math.round(v)); }, hideSm: true },
        { key: 'range', label: 'Range', num: true, hideSm: true, fmt: rangeCell, sortVal: function (g) { return g.range == null ? -1 : g.range; } },
        { key: 'year', label: 'Year avg', num: true, hideSm: true, fmt: fmtH },
        { key: 'trend', label: 'vs prev', num: true, fmt: trendCell, sortVal: function (g) { return g.trend == null ? -9 : g.trend; } }
      ];
      var grouped = !(level === 'all' || level === 'feeder');
      var cols = grouped ? groupCols : feederCols;
      $('tableTitle').textContent = (grouped ? { region: 'Regions', division: 'Divisions', ss: 'Substations' }[level] : 'Feeders') + ' · ' + UI.n(cutRows.length);
      var cfg = {
        rows: cutRows, sort: { key: 'daily', dir: 'desc' }, limit: 50, resetPage: true, empty: 'Nothing in this view.', columns: cols,
        onRow: function (r) { grouped ? drill(r.key) : detail(r); }
      };
      UI.table('feederTable', cfg);
      window.__export = { cols: cols, rows: cutRows };
      $('clearBtn').hidden = !($('q').value || concernOnly || monthPick || ['regionFilter', 'divisionFilter', 'ssFilter', 'catFilter', 'natFilter', 'schemeFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    function detail(f) {
      var hist = f.months.slice().reverse().map(function (m) { return [mLabel(m.month), fmtH(m.hours) + ' · ' + UI.n(m.count) + ' outages · ' + fmtDaily(m.daily) + '/day']; });
      UI.drawer(f.feeder, [f.substation, f.division].filter(Boolean).join(' · '), [
        ['Feeder code', f.code], ['Category', CAT[f.category] || f.category], ['Nature', NAT[f.nature] || f.nature], ['Scheme', f.scheme],
        ['Concern', f.concern ? f.reasons.join(', ') : 'No']
      ].concat(hist));
    }

    function drill(key) {
      var id = level === 'region' ? 'regionFilter' : level === 'division' ? 'divisionFilter' : 'ssFilter';
      if ($(id).disabled) return;
      $(id).value = key;
      if (level === 'region') { $('divisionFilter').value = ''; $('ssFilter').value = ''; }
      if (level === 'division') $('ssFilter').value = '';
      fillFilters();
      setLevel(level === 'region' ? 'division' : level === 'division' ? 'ss' : 'feeder');
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }

    function prepare(text) {
      if (!/REPORT MONTH/i.test(String(text || '').slice(0, 2000))) { $('meta').textContent = 'Feeder outage sheet did not load'; return false; }
      var rows = UI.csv(text).map(normalize).filter(Boolean);
      if (window.MzoScope) { try { rows = MzoScope.filterRows(rows); } catch (e) {} }
      all = rows;
      var ms = UI.uniq(all, 'month'), latest = ms[ms.length - 1];
      $('meta').textContent = 'Outages over 5 min · ' + (ms.length ? (ms.length === 1 ? mLabel(latest) : mLabel(ms[0]) + ' – ' + mLabel(latest)) : 'no rows in your scope');
      if (/^\d{6}$/.test(latest || '')) {
        var y = +latest.slice(0, 4), m = +latest.slice(4, 6), d = new Date(Date.UTC(y, m, 0)).getUTCDate();
        try { localStorage.setItem('mzo_feeder_outage_as_on', String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0') + '/' + y); } catch (e) {}
      }
      var cur = $('monthPick').value;
      $('monthPick').innerHTML = '<option value="">All months</option>' + ms.slice().reverse().map(function (x) { return '<option value="' + x + '">' + mLabel(x) + '</option>'; }).join('');
      if (cur && ms.indexOf(cur) !== -1) $('monthPick').value = cur; else monthPick = '';
      fillFilters();
      return true;
    }

    /* events */
    ['regionFilter', 'divisionFilter', 'ssFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('ssFilter').value = ''; }
        if (id === 'divisionFilter') $('ssFilter').value = '';
        fillFilters(); render();
      });
    });
    ['catFilter', 'natFilter', 'schemeFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('monthPick').addEventListener('change', function () { monthPick = this.value; UI.mark(this); render(); });
    $('q').addEventListener('input', UI.debounce(render, 160));
    $('concernStat').addEventListener('click', function () { concernOnly = !concernOnly; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      $('q').value = ''; concernOnly = false; monthPick = ''; $('monthPick').value = ''; UI.mark($('monthPick'));
      ['regionFilter', 'divisionFilter', 'ssFilter', 'catFilter', 'natFilter', 'schemeFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); setLevel('all');
    });
    $('exportBtn').addEventListener('click', function () {
      var ex = window.__export; if (!ex) return;
      UI.exportCsv('feeder-outage.csv', ex.cols.map(function (c) { return { key: c.key, label: c.label, csv: c.csv || function (r) { var v = r[c.key]; return typeof v === 'number' ? +v.toFixed(2) : v; } }; }), ex.rows);
    });

    // Google's published CSV has no ETag: always check so a same-day replace is picked up (docs/reports.md).
    function load(force) {
      var hub = window.mzoDataHub, b = $('refreshBtn');
      if (!hub) { $('meta').textContent = 'Data hub is not available'; return; }
      b.classList.add('spin');
      Promise.resolve(hub._peek('CACHE_FEEDER_OUTAGE')).catch(function () { return null; }).then(function (c) {
        if (c && !force && prepare(c)) render();
        return Promise.resolve(hub.waitForDataset('CACHE_FEEDER_OUTAGE', { forceCheck: true })).catch(function () {})
          .then(function () { return hub._peek('CACHE_FEEDER_OUTAGE'); })
          .then(function (f) {
            if (f && (force || f !== c)) { if (prepare(f)) render(); }
            else if (!f && !c) { $('meta').textContent = 'Could not load data'; $('feederTable').innerHTML = $('chart').innerHTML = '<div class="ui-empty">Could not load data.</div>'; }
          });
      }).then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
