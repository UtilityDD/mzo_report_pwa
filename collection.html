<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .co-day { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mzo-muted); }
    .co-day select { height: 28px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Collection</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="bulk" role="group" aria-label="Bulk consumers">
          <button type="button" data-b="with" aria-pressed="true">With bulk</button>
          <button type="button" data-b="without" aria-pressed="false">Without bulk</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" aria-label="Summary">
      <div class="ui-stat"><div class="k" id="kFy">This financial year</div><div class="v" id="sFy"><span class="ui-skel"></span></div><div class="s" id="sFyS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k" id="kMonth">This month</div><div class="v" id="sMonth"><span class="ui-skel"></span></div><div class="s" id="sMonthS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">This week</div><div class="v" id="sWeek"><span class="ui-skel"></span></div><div class="s" id="sWeekS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k" id="kDay">Latest day</div><div class="v" id="sDay"><span class="ui-skel"></span></div><div class="s" id="sDayS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Monthly average</div><div class="v" id="sAvg"><span class="ui-skel"></span></div><div class="s" id="sAvgS">&nbsp;</div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="trendTitle">Trend</h2>
        <div class="ui-seg" id="scale" role="group" aria-label="Time scale">
          <button type="button" data-s="month" aria-pressed="true">Monthly</button>
          <button type="button" data-s="week" aria-pressed="false">Weekly</button>
          <button type="button" data-s="day" aria-pressed="false">Daily</button>
        </div>
      </div>
      <div class="ui-panel-b"><div id="trend"><div class="ui-empty">Loading…</div></div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="tableTitle">Offices</h2>
        <div class="ui-actions">
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
          <label class="co-day ui-select">Up to day <select id="upto" aria-label="Compare up to day"></select></label>
          <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
        </div>
      </div>
      <div id="officeTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var FY_MONTHS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
    var all = [], bulk = 'with', scale = 'month', level = 'region', scope = null, upto = 0, maxDate = null, minDate = null;

    function ymd(s) { s = String(s || '').trim(); if (s.length < 8) return null; var d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)); return isNaN(d) ? null : d; }
    function fyStart(d) { return new Date(d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1, 3, 1); }
    function fyLabel(y) { return 'FY ' + String(y).slice(2) + '–' + String(y + 1).slice(2); }
    function axis(v) { var a = Math.abs(v); if (a >= 1e7) return +(v / 1e7).toFixed(a >= 1e8 ? 0 : 1) + ' Cr'; if (a >= 1e5) return +(v / 1e5).toFixed(a >= 1e6 ? 0 : 1) + ' L'; return UI.n(Math.round(v)); }
    function pctChange(now, then) { if (!then) return null; return (now - then) / then * 100; }
    function dpct(v) {
      if (v == null || !isFinite(v)) return '<span class="ui-delta flat">—</span>';
      return '<span class="ui-delta ' + (Math.abs(v) < 0.05 ? 'flat' : v > 0 ? 'ok' : 'bad') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%</span>';
    }

    function prepare(text) {
      var rows = UI.csv(text);
      all = [];
      rows.forEach(function (r) {
        var d = ymd(r.PAYMENT_DT), code = String(r.CCC_CODE || '').trim();
        if (!d || !code) return;
        var o = UI.office(code), isBulk = /0000$/.test(code);
        all.push({
          date: d, t: d.getTime(), code: code,
          amount: (parseFloat(r['AMOUNT PAID']) || 0) * 1e5, // sheet is in lakhs
          count: parseInt(r.COUNT, 10) || 0,
          _region: o.region || 'Unmapped', _divn: isBulk ? (o.region || '') + ' bulk' : (o.division || 'Unmapped'),
          _supp: isBulk ? (o.region || '') + ' bulk' : (o.ccc || code), CCC_CODE: code, bulk: isBulk
        });
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      var ts = all.map(function (r) { return r.t; });
      maxDate = ts.length ? new Date(Math.max.apply(null, ts)) : null;
      minDate = ts.length ? new Date(Math.min.apply(null, ts)) : null;
      $('meta').textContent = maxDate ? 'Payments ' + UI.fmtDate(minDate) + ' – ' + UI.fmtDate(maxDate) : 'No payments';
      var days = ''; for (var i = 1; i <= 31; i++) days += '<option value="' + i + '">' + i + '</option>';
      $('upto').innerHTML = days;
      upto = maxDate ? maxDate.getDate() : 31;
      $('upto').value = String(upto);
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }

    function view() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        return (bulk === 'with' || !r.bulk) && (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc);
      });
    }
    var sum = function (rows) { var a = 0, c = 0; rows.forEach(function (r) { a += r.amount; c += r.count; }); return { amt: a, cnt: c }; };
    var inMonth = function (r, y, m, day) { return r.date.getFullYear() === y && r.date.getMonth() === m && (!day || r.date.getDate() <= day); };

    // Latest day that has data in a month, capped at `limit` (matches the old "match days" rule).
    function lastDay(rows, y, m, limit) {
      var best = 0;
      rows.forEach(function (r) { if (r.date.getFullYear() === y && r.date.getMonth() === m) { var d = r.date.getDate(); if (d <= limit && d > best) best = d; } });
      return best || null;
    }

    function render() {
      var v = view();
      if (!maxDate) return;
      var latest = new Date(Math.max.apply(null, v.length ? v.map(function (r) { return r.t; }) : [maxDate.getTime()]));
      var fs = fyStart(latest), fy = sum(v.filter(function (r) { return r.date >= fs; }));
      var cy = latest.getFullYear(), cm = latest.getMonth();
      var pm = new Date(cy, cm - 1, 1), ly = new Date(cy - 1, cm, 1);
      var cDay = lastDay(v, cy, cm, upto) || upto;
      var month = sum(v.filter(function (r) { return inMonth(r, cy, cm, cDay); }));
      var prev = sum(v.filter(function (r) { return inMonth(r, pm.getFullYear(), pm.getMonth(), cDay); }));
      var weekStart = new Date(latest); weekStart.setDate(latest.getDate() - ((latest.getDay() + 6) % 7)); weekStart.setHours(0, 0, 0, 0);
      var week = sum(v.filter(function (r) { return r.date >= weekStart && r.date <= latest; }));
      var day = sum(v.filter(function (r) { return r.t === latest.getTime(); }));
      var months = {}; v.forEach(function (r) { months[r.date.getFullYear() * 12 + r.date.getMonth()] = 1; });
      var nMonths = Object.keys(months).length || 1;

      $('kFy').textContent = fyLabel(fs.getFullYear());
      $('sFy').textContent = UI.inr(fy.amt); $('sFyS').textContent = UI.n(fy.cnt) + ' payments';
      $('kMonth').textContent = MON[cm] + ' to day ' + cDay;
      $('sMonth').textContent = UI.inr(month.amt); $('sMonthS').innerHTML = 'vs ' + MON[pm.getMonth()] + ' ' + dpct(pctChange(month.amt, prev.amt));
      $('sWeek').textContent = UI.inr(week.amt); $('sWeekS').textContent = 'From ' + UI.fmtDate(weekStart);
      $('kDay').textContent = UI.fmtDate(latest);
      $('sDay').textContent = UI.inr(day.amt); $('sDayS').textContent = UI.n(day.cnt) + ' payments';
      $('sAvg').textContent = UI.inr(sum(v).amt / nMonths); $('sAvgS').textContent = 'Over ' + nMonths + ' months';

      drawTrend(v, latest);
      drawTable(v, latest, cDay);
      $('clearBtn').hidden = !(($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
    }

    function drawTrend(v, latest) {
      var scopeLabel = $('cccFilter').value || ($('divisionFilter').value ? $('divisionFilter').value + ' division' : $('regionFilter').value ? $('regionFilter').value + ' region' : 'Malda Zone');
      if (scale === 'month') {
        var fyNow = fyStart(latest).getFullYear(), byM = {};
        v.forEach(function (r) { var k = r.date.getFullYear() * 12 + r.date.getMonth(); byM[k] = (byM[k] || 0) + r.amount; });
        var series = [];
        [fyNow - 2, fyNow - 1, fyNow].forEach(function (f) {
          var vals = FY_MONTHS.map(function (_, i) { var m = (i + 3) % 12, y = i < 9 ? f : f + 1, k = y * 12 + m; return byM[k] != null ? byM[k] : null; });
          if (vals.some(function (x) { return x != null; })) series.push({ label: fyLabel(f), values: vals, strong: f === fyNow });
        });
        $('trendTitle').textContent = 'Monthly collection · ' + scopeLabel;
        UI.line('trend', { labels: FY_MONTHS, series: series, fmt: UI.inr, axis: axis, title: 'Monthly collection' });
        return;
      }
      var buckets = {}, labels = [], vals = [], n = scale === 'week' ? 26 : 60, step = scale === 'week' ? 7 : 1;
      var end = new Date(latest); end.setHours(0, 0, 0, 0);
      if (scale === 'week') end.setDate(end.getDate() - ((end.getDay() + 6) % 7));
      v.forEach(function (r) {
        var d = new Date(r.date); d.setHours(0, 0, 0, 0);
        if (scale === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        buckets[d.getTime()] = (buckets[d.getTime()] || 0) + r.amount;
      });
      for (var i = n - 1; i >= 0; i--) {
        var d = new Date(end); d.setDate(end.getDate() - i * step);
        labels.push(d.getDate() + ' ' + MON[d.getMonth()]);
        vals.push(buckets[d.getTime()] != null ? buckets[d.getTime()] : (scale === 'day' ? null : 0));
      }
      $('trendTitle').textContent = (scale === 'week' ? 'Weekly collection, last 26 weeks' : 'Daily collection, last 60 days') + ' · ' + scopeLabel;
      // UI.line thins crowded axis labels itself; the tooltip keeps the full date.
      UI.line('trend', { labels: labels, series: [{ label: scale === 'week' ? 'Week starting' : 'Day', values: vals, strong: true }], fmt: UI.inr, axis: axis, title: 'Collection' });
    }

    function drawTable(v, latest, cDay) {
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp';
      var cy = latest.getFullYear(), cm = latest.getMonth(), pm = new Date(cy, cm - 1, 1), ly = new Date(cy - 1, cm, 1), fs = fyStart(latest);
      var pDay = lastDay(v, pm.getFullYear(), pm.getMonth(), cDay), lDay = lastDay(v, ly.getFullYear(), ly.getMonth(), cDay);
      var g = {};
      v.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var o = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', fy: 0, cur: 0, prev: 0, ly: 0 });
        if (r.date >= fs) o.fy += r.amount;
        if (inMonth(r, cy, cm, cDay)) o.cur += r.amount;
        if (inMonth(r, pm.getFullYear(), pm.getMonth(), pDay || cDay)) o.prev += r.amount;
        if (inMonth(r, ly.getFullYear(), ly.getMonth(), lDay || cDay)) o.ly += r.amount;
      });
      var rows = Object.keys(g).map(function (k) { var o = g[k]; o.mom = pctChange(o.cur, o.prev); o.yoy = pctChange(o.cur, o.ly); return o; });
      var tot = rows.reduce(function (a, o) { a.fy += o.fy; a.cur += o.cur; a.prev += o.prev; a.ly += o.ly; return a; }, { fy: 0, cur: 0, prev: 0, ly: 0 });
      tot.mom = pctChange(tot.cur, tot.prev); tot.yoy = pctChange(tot.cur, tot.ly);
      window.__rows = rows;
      $('tableTitle').textContent = MON[cm] + ' 1–' + cDay + ' compared';
      var amt = function (x) { return UI.inr(x); };
      UI.table('officeTable', {
        rows: rows, sort: { key: 'fy', dir: 'desc' }, count: false, empty: 'No collection for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (val, o) { return '<span class="ui-strong">' + UI.esc(val) + '</span>' + (o.parent ? '<span class="sub">' + UI.esc(o.parent) + '</span>' : ''); } },
          { key: 'fy', label: fyLabel(fs.getFullYear()), num: true, fmt: amt },
          { key: 'cur', label: MON[cm] + ' ' + cy, num: true, fmt: amt },
          { key: 'prev', label: MON[pm.getMonth()] + ' ' + pm.getFullYear(), num: true, fmt: amt, hideSm: true },
          { key: 'mom', label: 'vs last month', num: true, sortVal: function (o) { return o.mom == null ? -1e9 : o.mom; }, fmt: function (x) { return dpct(x); } },
          { key: 'ly', label: MON[ly.getMonth()] + ' ' + ly.getFullYear(), num: true, fmt: amt, hideSm: true },
          { key: 'yoy', label: 'vs last year', num: true, sortVal: function (o) { return o.yoy == null ? -1e9 : o.yoy; }, fmt: function (x) { return dpct(x); }, hideSm: true }
        ],
        foot: rows.length > 1 ? tot : null,
        onRow: function (o) { if (level === 'ccc') monthly(o.name); else drill(o.name); }
      });
    }

    // Last 12 months for one CCC
    function monthly(name) {
      var rows = view().filter(function (r) { return r._supp === name; }), by = {};
      rows.forEach(function (r) { var k = r.date.getFullYear() * 12 + r.date.getMonth(); var o = by[k] || (by[k] = { amt: 0, cnt: 0 }); o.amt += r.amount; o.cnt += r.count; });
      var keys = Object.keys(by).map(Number).sort(function (a, b) { return b - a; }).slice(0, 12);
      var any = rows[0] || {};
      UI.drawer(name, [any._divn, any._region].filter(Boolean).join(' · '), keys.map(function (k) { return [MON[k % 12] + ' ' + Math.floor(k / 12), UI.inr(by[k].amt) + '  ·  ' + UI.n(by[k].cnt) + ' payments']; }));
    }

    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillFilters(); marks(); setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function marks() { ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); }); }
    function seg(id, attr, val) { [].forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === val)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); marks(); render();
      });
    });
    $('bulk').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; bulk = b.getAttribute('data-b'); seg('bulk', 'data-b', bulk); render(); });
    $('scale').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; scale = b.getAttribute('data-s'); seg('scale', 'data-s', scale); render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('upto').addEventListener('change', function () { upto = +this.value; render(); });
    $('clearBtn').addEventListener('click', function () {
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); marks(); setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      var r = function (k) { return function (o) { return Math.round(o[k]); }; };
      var p = function (k) { return function (o) { return o[k] == null || !isFinite(o[k]) ? '' : o[k].toFixed(1); }; };
      UI.exportCsv('collection-' + level + '.csv', [
        { key: 'name', label: 'Office' }, { key: 'parent', label: 'Parent' }, { key: 'fy', label: 'FY collection (Rs)', csv: r('fy') },
        { key: 'cur', label: 'This month (Rs)', csv: r('cur') }, { key: 'prev', label: 'Last month same days (Rs)', csv: r('prev') }, { key: 'mom', label: 'Change vs last month %', csv: p('mom') },
        { key: 'ly', label: 'Same month last year (Rs)', csv: r('ly') }, { key: 'yoy', label: 'Change vs last year %', csv: p('yoy') }
      ], window.__rows || []);
    });
    UI.refresh('refreshBtn', 'CACHE_COLLECTION', function (t) { prepare(t); render(); });

    var first = true;
    UI.load('CACHE_COLLECTION', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = $('trend').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        var d = new URLSearchParams(location.search).get('division');
        if (d && !$('divisionFilter').disabled) { var m = [].filter.call($('divisionFilter').options, function (o) { return o.value.toLowerCase() === d.toLowerCase(); })[0]; if (m) { $('divisionFilter').value = m.value; fillFilters(); marks(); level = 'ccc'; } }
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
