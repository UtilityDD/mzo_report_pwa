<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bharat Net · DISHA</title>
  <script src="/mzo_theme.js?v=7"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=9" />
  <script src="/mzo_ui.js?v=9" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-kpis .ui-stat { padding: 13px 14px 14px; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Bharat Net<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="topBtn">Pending GPs</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="GP, application, account, meter" autocomplete="off" aria-label="Search applications" title="Search by GP, application, account or meter" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Status" id="fStatus"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Connected month" id="fMonth"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats cl-kpis" id="kpis" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Applications</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="given"><div class="k"><span class="ui-dot ok"></span>Connected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <div class="ui-stat" id="statRecent"><div class="k" id="recentK">Recent month</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">Detailed analysis</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var ROWS = 'bharatnet_connections';
    var STATUS = { given: { label: 'Connected', cls: 'ok' }, pending: { label: 'Pending', cls: 'warn' } };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var TABS = [
      ['region', 'Region'], ['division', 'Division'], ['ccc', 'CCC'],
      ['applications', 'Applications'], ['timeline', 'Timeline']
    ];
    var all = [], f = { q: '', status: '', month: '' }, tab = 'region', renderedTab = '', scope = null, lastTable = null, lastList = null, first = true;
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function roman(s) { return String(s || '').replace(/\b(Ii|Iii|Iv|Vi|Vii)\b/g, function (m) { return m.toUpperCase(); }); }

    // Cell N2 (UPADTE DATE / UPDATE DATE, dd.mm.yyyy) is the sheet's "as on" date: read from every row
    // (t.first), so a scoped login that does not have the sheet's first row still sees it.
    function asOnOf(t) {
      var raw = t.first('upadte_date') || '';
      var m = raw.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (!m) return '';
      var pad = function (x) { return String(x).padStart(2, '0'); }, y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      return pad(+m[1]) + '/' + pad(+m[2]) + '/' + y;
    }

    // t.rows: uniform rows of schema/bharatnet_connections.json (the sheet's header variants as one
    // field each, canonical _region/_division/_ccc), already scoped to the login by MzoRows.
    function prepare(t) {
      var asOn = asOnOf(t);
      all = t.rows.filter(function (d) { return d.appl_no || d.cont_account; }).map(function (d) {
        var r = {
          appl: d.appl_no, account: d.cont_account,
          name: [d.first_name, d.last_name].filter(Boolean).join(' ').replace(/,\s*$/, ''),
          street: d.street, street3: d.street_3, pin: d.postl_code, phone: d.telephone,
          meter: d.meter_number, moveIn: UI.date(d.move_in_date), code: d.ccc_code,
          gp: roman(UI.title(d.street.replace(/^THE\s+PRADHAN\s+/i, '').replace(/\s+VILL.*$/i, ''))) || d.street,
          _region: d._region || 'Unmapped',
          _divn: d._division || 'Unmapped',
          _supp: d._ccc || UI.title((d.ccc_name || '').replace(/\s+CCC$/i, '')) || 'Unmapped',
          CCC_CODE: d.ccc_code,
          st: d.meter_number ? 'given' : 'pending'
        };
        r.monthKey = r.moveIn ? r.moveIn.getFullYear() * 100 + r.moveIn.getMonth() : null;
        r.monthLabel = r.moveIn ? MON[r.moveIn.getMonth()] + ' ' + r.moveIn.getFullYear() : '';
        r.search = [r.gp, r.street, r.appl, r.account, r.name, r.meter, r.phone, r._supp, r._divn, r._region].join(' ').toLowerCase();
        return r;
      });
      if (asOn) { try { localStorage.setItem('mzo_bharatnet_as_on', asOn); } catch (e) {} }
      var dateStr = asOn ? UI.fmtDate(asOn.split('/').reverse().join('-')) : '';
      $('asOn').textContent = dateStr || (UI.n(all.length) + ' GPs');
      $('asOn').title = (dateStr ? 'As on ' + dateStr + ' · ' : '') + UI.n(all.length) + ' Gram panchayat applications';
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }

    function filtered(skip) {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, cc = $('cccFilter').value;
      return all.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (cc && r._supp !== cc) return false;
        if (q && r.search.indexOf(q) === -1) return false;
        if (skip !== 'status' && f.status && r.st !== f.status) return false;
        if (skip !== 'month' && f.month !== '' && r.monthKey !== f.month) return false;
        return true;
      });
    }

    function renderFacets() {
      var b = filtered('all');
      var cGiven = b.filter(function (r) { return r.st === 'given'; }).length;
      var cPend = b.filter(function (r) { return r.st === 'pending'; }).length;

      var stOpts = [
        { value: 'given', label: 'Connected', count: cGiven, dot: 'ok' },
        { value: 'pending', label: 'Pending', count: cPend, dot: 'warn' }
      ];
      UI.facet('fStatus', stOpts, f.status, function (v) {
        f.status = v;
        if (f.status === 'pending') f.month = '';
        render();
      });

      // Months facet
      var bMonth = filtered('month').filter(function (r) { return r.st === 'given' && r.monthKey != null; });
      var mc = {};
      bMonth.forEach(function (r) { mc[r.monthKey] = (mc[r.monthKey] || 0) + 1; });
      var sortedKeys = Object.keys(mc).map(Number).sort(function (x, y) { return y - x; });
      var monthOpts = sortedKeys.map(function (k) {
        return { value: k, label: MON[k % 100] + ' ' + Math.floor(k / 100), count: mc[k] };
      });
      UI.facet('fMonth', monthOpts, f.month, function (v) {
        f.month = v ? +v : '';
        if (f.month !== '') f.status = 'given';
        render();
      });

      var active = (f.q ? 1 : 0) + (f.status ? 1 : 0) + (f.month !== '' ? 1 : 0) +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active);
    }

    function render() {
      renderFacets();
      var b = filtered('all'); // panel filters (offices + q)
      var total = b.length;
      var cGiven = b.filter(function (r) { return r.st === 'given'; }).length;
      var cPend = b.filter(function (r) { return r.st === 'pending'; }).length;

      var stats = [
        { k: '', label: 'Applications', v: total, s: UI.n(UI.uniq(b, '_supp').length) + ' CCCs' },
        { k: 'given', label: 'Connected', dot: 'ok', v: cGiven, s: UI.pct(cGiven, total) + ' connected' },
        { k: 'pending', label: 'Pending', dot: 'warn', v: cPend, s: UI.pct(cPend, total) + ' of applications' }
      ];
      [].forEach.call(document.querySelectorAll('#kpis .ui-stat[data-k]'), function (el, i) {
        var s = stats[i];
        if (!s) return;
        el.querySelector('.v').textContent = UI.n(s.v);
        el.querySelector('.s').textContent = s.s;
        el.setAttribute('aria-pressed', String(f.status === s.k));
      });

      // Recent month stats card
      var withDate = b.filter(function (r) { return r.monthKey != null; });
      var recentKey = withDate.length ? Math.max.apply(null, withDate.map(function (r) { return r.monthKey; })) : null;
      var recentCount = recentKey ? withDate.filter(function (r) { return r.monthKey === recentKey; }).length : 0;
      var recentLabel = recentKey ? MON[recentKey % 100] + ' ' + Math.floor(recentKey / 100) : '—';
      $('recentK').textContent = recentKey ? recentLabel : 'Recent month';
      $('statRecent').querySelector('.v').textContent = recentCount ? UI.n(recentCount) : '—';
      $('statRecent').querySelector('.s').textContent = recentCount ? 'Energized in ' + recentLabel : 'No energizations';

      var view = filtered(''); // all active filters combined
      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'applications' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var stTitle = f.status === 'given' ? 'connected applications' : f.status === 'pending' ? 'pending applications' : '';
      var mTitle = f.month !== '' ? 'connected in ' + MON[f.month % 100] + ' ' + Math.floor(f.month / 100) : '';
      var filterDesc = [stTitle, mTitle].filter(Boolean).join(' and ');
      $('hint').textContent = (filterDesc ? 'Showing ' + filterDesc + ' only.' : '');

      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(view.length) + ' applications · ' + UI.n(cGiven) + ' connected (' + UI.pct(cGiven, view.length || 1) + ')';
      renderReportHead(view);

      renderTab(view, b);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (f.q) {
        active.push({ key: 'q', label: 'Search: ' + f.q, clear: function () { f.q = ''; $('q').value = ''; render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { set('regionFilter', ''); set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { set('cccFilter', ''); render(); } });
      }
      if (f.status) {
        var stLabel = (STATUS[f.status] && STATUS[f.status].label) || f.status;
        active.push({ key: 'status', label: 'Status: ' + stLabel, clear: function () { f.status = ''; render(); } });
      }
      if (f.month !== '') {
        var mLabel = MON[f.month % 100] + ' ' + Math.floor(f.month / 100);
        active.push({ key: 'month', label: 'Month: ' + mLabel, clear: function () { f.month = ''; render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    function renderTab(view, b) {
      lastTable = null;
      lastList = null;
      var cfg = null;

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        var key = tab === 'region' ? '_region' : tab === 'division' ? '_divn' : '_supp', groups = {};
        view.forEach(function (r) {
          var name = r[key] || 'Unmapped';
          var g = groups[name] || (groups[name] = {
            name: name,
            parent: tab === 'ccc' ? r._divn : tab === 'division' ? r._region : '',
            n: 0, given: 0, pending: 0
          });
          g.n++;
          g[r.st]++;
        });
        var list = Object.keys(groups).map(function (k) { return groups[k]; });
        var label = tab === 'ccc' ? 'CCC' : tab === 'division' ? 'Division' : 'Region';
        var sumN = view.length, sumGiven = view.filter(function (r) { return r.st === 'given'; }).length;
        var sumPend = view.filter(function (r) { return r.st === 'pending'; }).length;

        lastTable = {
          title: label,
          cols: [label, 'Applications', 'Connected', 'Pending', 'Completion %'],
          rows: list.slice().sort(function (a, b) { return b.pending - a.pending; }).map(function (g) {
            return [g.name, g.n, g.given, g.pending, UI.pct(g.given, g.n)];
          })
        };

        cfg = {
          rows: list, sort: { key: 'pending', dir: 'desc' }, count: false, empty: 'No applications for these filters.',
          columns: [
            { key: 'name', label: label, fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Applications', num: true, fmt: UI.n },
            { key: 'given', label: 'Connected', num: true, hideSm: true, fmt: UI.n },
            { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
            { key: 'rate', label: 'Connected', sortVal: function (g) { return g.n ? g.given / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.given, g.n, UI.pct(g.given, g.n), 2); }, width: '28%' }
          ],
          foot: list.length > 1 ? { n: sumN, given: sumGiven, pending: sumPend, rate: 0 } : null,
          onRow: tab === 'ccc' ? null : function (g) { drill(tab, g.name); },
          selected: tab === 'ccc' ? function (g) { return $('cccFilter').value === g.name; } : null
        };
      }
      else if (tab === 'timeline') {
        var withDate = view.filter(function (r) { return r.monthKey != null; }), mc = {};
        withDate.forEach(function (r) { mc[r.monthKey] = (mc[r.monthKey] || 0) + 1; });
        var months = Object.keys(mc).map(Number).sort(function (x, y) { return y - x; }).map(function (k) {
          return { key: k, label: MON[k % 100] + ' ' + Math.floor(k / 100), count: mc[k] };
        });
        var maxCount = Math.max.apply(null, months.map(function (m) { return m.count; }).concat([0]));
        var totalGiven = withDate.length || 1;
        lastTable = {
          title: 'Timeline',
          cols: ['Month', 'Connected GPs', 'Share of total'],
          rows: months.map(function (m) { return [m.label, m.count, UI.pct(m.count, totalGiven)]; })
        };
        cfg = {
          rows: months, sort: null, count: false, empty: 'No connections with move-in date.',
          columns: [
            { key: 'label', label: 'Month', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
            { key: 'count', label: 'Connected GPs', num: true, fmt: UI.n },
            { key: 'share', label: 'Share', sortVal: function (m) { return m.count; }, fmt: function (_, m) { return UI.bar(m.count, maxCount, UI.pct(m.count, totalGiven), 2); }, width: '36%' }
          ],
          foot: months.length > 1 ? { label: 'Total connected', count: withDate.length } : null,
          onRow: function (m) {
            f.month = f.month === m.key ? '' : m.key;
            if (f.month !== '') f.status = 'given';
            render();
          }
        };
      }
      else {
        // Applications list
        lastList = view;
        lastTable = {
          title: 'Applications',
          cols: ['Gram panchayat', 'Application no.', 'Account', 'Region', 'Division', 'CCC', 'Meter', 'Connected on', 'Status'],
          rows: view.map(function (r) { return [r.gp, r.appl, r.account, r._region, r._divn, r._supp, r.meter || '', r.moveIn ? UI.fmtDate(r.moveIn) : '', STATUS[r.st].label]; })
        };
        cfg = {
          rows: view, sort: { key: 'st', dir: 'desc' }, limit: 50, resetPage: true,
          empty: 'No applications match these filters.',
          columns: APP_COLS,
          onRow: detail
        };
      }

      var k = tab + ':' + f.status + ':' + f.month;
      if (renderedTab !== k) { $('table').__ui = null; renderedTab = k; }
      UI.table('table', cfg);
    }

    var APP_COLS = [
      { key: 'gp', label: 'Gram panchayat', cls: 'wrap', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.appl) + '</span>'; } },
      { key: 'account', label: 'Account', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'meter', label: 'Meter', hideSm: true, fmt: function (v) { return v ? UI.esc(v) : '<span class="ui-muted">—</span>'; } },
      { key: 'moveIn', label: 'Connected on', num: true, hideSm: true, sortVal: function (r) { return r.moveIn ? r.moveIn.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '<span class="ui-muted">—</span>'; }, csv: function (r) { return r.moveIn ? UI.fmtDate(r.moveIn) : ''; } },
      { key: 'st', label: 'Status', sortVal: function (r) { return r.st === 'pending' ? 1 : 0; }, fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer(r.gp || 'Application ' + r.appl, [STATUS[r.st].label, r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Gram panchayat / Street', r.gp], ['Application', r.appl], ['Account', r.account], ['Consumer name', r.name],
        ['Address', r.street], ['Street 3', r.street3], ['Postal code', r.pin], ['Telephone', r.phone],
        ['Meter number', r.meter || 'Not allotted'], ['Connected on', r.moveIn ? UI.fmtDate(r.moveIn) : 'Pending'],
        ['Region', r._region], ['Division', r._divn], ['CCC', r._supp], ['CCC code', r.code]
      ], '', '<button type="button" class="ui-btn sm" data-copy-detail>Copy details</button>');
      var copyBtn = document.querySelector('[data-copy-detail]');
      if (copyBtn) {
        copyBtn.onclick = function () {
          var lines = [
            'Gram Panchayat: ' + r.gp,
            'Application No: ' + r.appl,
            'Account: ' + r.account,
            'Status: ' + STATUS[r.st].label + (r.meter ? ' (Meter: ' + r.meter + ')' : ''),
            'Connected On: ' + (r.moveIn ? UI.fmtDate(r.moveIn) : 'Pending'),
            'Office: ' + [r._supp, r._divn, r._region].filter(Boolean).join(', '),
            'Address: ' + [r.street, r.street3, r.pin].filter(Boolean).join(', ')
          ];
          UI.copy(lines.join('\n')).then(function () { UI.toast('Application details copied'); });
        };
      }
    }

    function drill(level, name) {
      if (name === 'Unmapped') return;
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); tab = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); tab = 'ccc'; }
      else { set('cccFilter', $('cccFilter').value === name ? '' : name); tab = 'applications'; }
      fillFilters(); render();
    }

    /* ---------- URL params (Ask, shared links) ---------- */
    // ?region= ?division= ?ccc= ?q= ?status=given|pending ?month= ?tab=
    function applyUrl() {
      var p = new URLSearchParams(location.search), pick = function (id, v) {
        var el = $(id); if (!v || el.disabled) return false;
        var m = [].filter.call(el.options, function (o) { return o.value && o.value.toLowerCase() === String(v).trim().toLowerCase(); })[0];
        if (m) { el.value = m.value; fillFilters(); return true; } return false;
      };
      pick('regionFilter', p.get('region')); pick('divisionFilter', p.get('division')); pick('cccFilter', p.get('ccc'));
      if (p.get('q')) { f.q = p.get('q').trim(); $('q').value = f.q; }
      var st = String(p.get('status') || '').trim();
      if (st === 'given' || st === 'pending') f.status = st;
      if (p.get('month')) f.month = +p.get('month');
      if (TABS.some(function (t) { return t[0] === p.get('tab'); })) tab = p.get('tab');
    }

    /* ---------- events ---------- */
    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      if (f.q && tab !== 'applications') tab = 'applications';
      render();
    }, 180));
    $('kpis').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat[data-k]'); if (!s) return;
      var k = s.getAttribute('data-k');
      f.status = f.status === k ? '' : k;
      if (f.status === 'pending') f.month = '';
      render();
    });
    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-drill-tab'); if (t) { tab = t.getAttribute('data-t'); render(); } });
    $('topBtn').addEventListener('click', function () {
      tab = 'applications'; f.status = 'pending'; renderedTab = ''; render();
      $('table').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    function clearAll() {
      f.q = ''; f.status = ''; f.month = '';
      $('q').value = '';
      SELECTS.forEach(function (id) { set(id, ''); });
      tab = scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region';
      fillFilters(); render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var clearBtn = e.target.closest('#rhClearBtn');
      if (clearBtn) { clearAll(); return; }
      var chipBtn = e.target.closest('[data-rh-clear]');
      if (chipBtn) {
        var idx = parseInt(chipBtn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
        }
      }
    });
    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = ['*Bharat Net — ' + lastTable.title + '*' + (f.status ? ' (' + STATUS[f.status].label + ')' : ''), lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
    });
    $('exportBtn').addEventListener('click', function () {
      if (lastList) {
        UI.exportCsv('bharat-net.csv', [
          { key: 'gp', label: 'Gram panchayat' }, { key: 'appl', label: 'Application' }, { key: 'account', label: 'Account' },
          { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' },
          { key: 'meter', label: 'Meter' }, { key: 'moveIn', label: 'Connected on', csv: function (r) { return r.moveIn ? UI.fmtDate(r.moveIn) : ''; } },
          { key: 'st', label: 'Status', csv: function (r) { return STATUS[r.st].label; } }
        ], lastList);
        return;
      }
      if (!lastTable) return;
      UI.exportCsv('bharat-net-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
    });

    MzoRows.refresh('refreshBtn', ROWS, function (t) { prepare(t); render(); });

    MzoRows.load(ROWS, function (t, info) {
      if (!t) { if (info && info.error && !all.length) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc'; else if (scope && scope.level === 'region') tab = 'division';
        applyUrl();
      }
      render();
    });
  });
  </script>
</body>
</html>
