<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bharat Net · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Bharat Net</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="GP, application, account or meter" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:3" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Applications</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="given"><div class="k"><span class="ui-dot ok"></span>Connected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Connected by month</h2></div>
          <div class="ui-panel-b"><div id="monthHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var STATUS = { given: { label: 'Connected', cls: 'ok' }, pending: { label: 'Pending', cls: 'warn' } };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var all = [], f = { q: '', status: '', month: '' }, level = 'region', scope = null;

    function roman(s) { return String(s || '').replace(/\b(Ii|Iii|Iv|Vi|Vii)\b/g, function (m) { return m.toUpperCase(); }); }
    function pick(row, keys) {
      for (var i = 0; i < keys.length; i++) { var v = row[keys[i]]; if (v != null && String(v).trim() !== '') return String(v).trim(); }
      return '';
    }

    // Cell N2 (UPADTE DATE / UPDATE DATE, dd.mm.yyyy) is the sheet's "as on" date.
    function asOnOf(rows) {
      var first = rows[0] || {}, key = Object.keys(first).filter(function (k) { return /upadte\s*date|update\s*date/i.test(k); })[0];
      var raw = key ? String(first[key] || '').trim() : '';
      var m = raw.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (!m) return '';
      var pad = function (x) { return String(x).padStart(2, '0'); }, y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      return pad(+m[1]) + '/' + pad(+m[2]) + '/' + y;
    }

    function prepare(text) {
      var rows = UI.csv(text), asOn = asOnOf(rows);
      all = rows.filter(function (d) { return pick(d, ['Appl No', 'Appl No.', 'APPLICATION NO']) || pick(d, ['Cont.Account', 'Cont Account']); }).map(function (d, i) {
        var code = pick(d, ['CCC CODE', 'CCC_CODE']), name = pick(d, ['CCC NAME', 'CCC']);
        var o = UI.office(code, name);
        var meter = pick(d, ['METER NUMBER', 'Meter Number', 'METER']);
        var moveIn = pick(d, ['MOVE IN DATE', 'Move In Date']);
        var street = pick(d, ['Street']);
        var r = {
          id: i, appl: pick(d, ['Appl No', 'Appl No.', 'APPLICATION NO']), account: pick(d, ['Cont.Account', 'Cont Account', 'Account']),
          name: [pick(d, ['First Name']), pick(d, ['Last Name'])].filter(Boolean).join(' ').replace(/,\s*$/, ''),
          street: street, street3: pick(d, ['Street 3']), pin: pick(d, ['Postl Code', 'Postal Code', 'PIN']), phone: pick(d, ['Telephone']),
          meter: meter, moveIn: UI.date(moveIn), code: code,
          gp: roman(UI.title(street.replace(/^THE\s+PRADHAN\s+/i, '').replace(/\s+VILL.*$/i, ''))) || street,
          _region: o.region, _divn: o.division, _supp: o.ccc || UI.title(name.replace(/\s+CCC$/i, '')), CCC_CODE: code, 'CCC NAME': name,
          st: meter ? 'given' : 'pending'
        };
        r.monthKey = r.moveIn ? r.moveIn.getFullYear() * 100 + r.moveIn.getMonth() : null;
        r.search = [r.gp, r.street, r.appl, r.account, r.name, r.meter, r.phone, r._supp, r._divn].join(' ').toLowerCase();
        return r;
      });
      if (window.MzoScope) { var scoped = window.MzoScope.filterRows(all); if (scoped.length || !all.length) all = scoped; }
      if (asOn) { try { localStorage.setItem('mzo_bharatnet_as_on', asOn); } catch (e) {} }
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn.split('/').reverse().join('-')) + ' · ' : '') + UI.n(all.length) + ' applications';
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }

    function base() {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!q || r.search.indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base(), given = b.filter(function (r) { return r.st === 'given'; }).length;
      var view = b.filter(function (r) { return (!f.status || r.st === f.status) && (f.month === '' || r.monthKey === f.month); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = !k ? b.length : k === 'given' ? given : b.length - given;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = !k ? 'Gram panchayat connections' : UI.pct(c, b.length) + ' of applications';
        el.setAttribute('aria-pressed', String(f.status === k));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, given: 0, pending: 0 });
        g.n++; g[r.st]++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      var tg = view.filter(function (r) { return r.st === 'given'; }).length;
      UI.table('officeTable', {
        rows: list, sort: { key: 'pending', dir: 'desc' }, count: false, empty: 'No applications for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Applications', num: true, fmt: UI.n, hideSm: true },
          { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
          { key: 'rate', label: 'Connected', sortVal: function (g) { return g.n ? g.given / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.given, g.n, UI.pct(g.given, g.n)); }, width: '30%' }
        ],
        foot: list.length > 1 ? { n: view.length, pending: view.length - tg, given: tg, rate: 0 } : null,
        onRow: function (g) { drill(g.name); }
      });

      var months = {};
      b.forEach(function (r) { if (r.monthKey != null) months[r.monthKey] = (months[r.monthKey] || 0) + 1; });
      var keys = Object.keys(months).map(Number).sort(function (x, y) { return x - y; }).slice(-8);
      if (keys.length) {
        UI.hist('monthHist', keys.map(function (k) { return { key: k, label: MON[k % 100] + ' ' + Math.floor(k / 100), value: months[k] }; }),
          { active: f.month === '' ? null : f.month, onClick: function (row) { f.month = f.month === row.key ? '' : row.key; render(); } });
      } else {
        $('monthHist').className = ''; $('monthHist').innerHTML = '<div class="ui-empty">No connections recorded yet.</div>';
      }

      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'st', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.status || f.month !== '' || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
      window.__view = view;
    }

    var APP_COLS = [
      { key: 'gp', label: 'Gram panchayat', cls: 'wrap', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.appl) + '</span>'; } },
      { key: 'account', label: 'Account', hideSm: true },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'meter', label: 'Meter', hideSm: true, fmt: function (v) { return v ? UI.esc(v) : '<span class="ui-muted">—</span>'; } },
      { key: 'moveIn', label: 'Connected on', num: true, hideSm: true, sortVal: function (r) { return r.moveIn ? r.moveIn.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '<span class="ui-muted">—</span>'; }, csv: function (r) { return r.moveIn ? UI.fmtDate(r.moveIn) : ''; } },
      { key: 'st', label: 'Status', sortVal: function (r) { return r.st === 'pending' ? 1 : 0; }, fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer(r.gp || 'Application ' + r.appl, [STATUS[r.st].label, r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Application', r.appl], ['Account', r.account], ['Name', r.name], ['Street / GP', r.street], ['Street 3', r.street3],
        ['PIN', r.pin], ['Telephone', r.phone], ['Meter number', r.meter], ['Connected on', r.moveIn ? UI.fmtDate(r.moveIn) : ''],
        ['Region', r._region], ['CCC code', r.code]
      ]);
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); }); }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }
    function drill(name) {
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); level = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); level = 'ccc'; }
      else set('cccFilter', $('cccFilter').value === name ? '' : name);
      fillFilters(); markAll(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter' && !$('divisionFilter').disabled) $('divisionFilter').value = '';
        if (id !== 'cccFilter' && !$('cccFilter').disabled) $('cccFilter').value = '';
        fillFilters(); markAll(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.status = f.status === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.status = ''; f.month = ''; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); markAll(); render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('bharat-net.csv', [{ key: 'appl', label: 'Application' }, { key: 'gp', label: 'Gram panchayat' }, { key: 'account', label: 'Account' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'meter', label: 'Meter' }].concat(APP_COLS.slice(4)), window.__view || []);
    });
    UI.refresh('refreshBtn', 'CACHE_BHARATNET', function (t) { prepare(t); render(); });

    var first = true;
    UI.load('CACHE_BHARATNET', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
