<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket closure KPI · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>.ui-grid > .ui-panel { margin-top: 0; }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Docket closure KPI</h1>
        <p id="meta">Closed dockets, Jan 2023 – Jun 2025</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="bulk" role="group" aria-label="Bulk dockets">
          <button type="button" data-b="" aria-pressed="true">All</button>
          <button type="button" data-b="ex" aria-pressed="false">Excluding bulk</button>
          <button type="button" data-b="only" aria-pressed="false">Bulk only</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="probFilter" aria-label="Problem"><option value="">All problems</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" aria-label="Summary">
      <div class="ui-stat"><div class="k">Closed dockets</div><div class="v" id="sN"><span class="ui-skel"></span></div><div class="s" id="sNS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Average closure</div><div class="v" id="sAvg"><span class="ui-skel"></span></div><div class="s">All dockets</div></div>
      <div class="ui-stat"><div class="k">Technical</div><div class="v" id="sTech"><span class="ui-skel"></span></div><div class="s" id="sTechS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Non-technical</div><div class="v" id="sNon"><span class="ui-skel"></span></div><div class="s" id="sNonS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Fastest CCC</div><div class="v" id="sBest" style="font-size:18px;line-height:1.5"><span class="ui-skel"></span></div><div class="s" id="sBestS">&nbsp;</div></div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:600px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By problem</h2>
          <button type="button" class="ui-btn sm icon" id="exportBtn" aria-label="Export CSV" title="Export CSV"><svg class="ui-i"><use href="#ui-download"/></svg></button>
        </div>
        <div id="probTable" style="--max-h:600px"><div class="ui-empty">Loading…</div></div>
      </section>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThi-zr48XGYbnQO7YR8xmhVQZV2Wb3t05wTN2kqM254DXNOr5wfeBWNIhywNk2egvpYeSte2EWLLvD/pub?gid=0&single=true&output=csv';
    var BULK = { '6610000': 1, '6620000': 1, '6630000': 1 };
    var all = [], bulk = '', level = 'region', scope = null;

    // Closure time in days → "35h 39m" or "4d 6h"
    function dur(days) {
      if (days == null || !isFinite(days)) return '—';
      var m = Math.round(days * 1440);
      if (m < 60 * 48) return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
      var h = Math.round(m / 60);
      return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
    }
    function agg(rows) { var n = 0, s = 0; rows.forEach(function (r) { n += r.n; s += r.sum; }); return { n: n, avg: n ? s / n : null }; }

    function prepare(text) {
      all = UI.csv(text).filter(function (d) { return d.ccc_code; }).map(function (d) {
        var code = String(d.ccc_code).trim(), o = UI.office(code), isBulk = !!BULK[code];
        return {
          tech: d.DESCRIPTION === 'B', prob: String(d.prob_type || '').trim(), code: code, bulk: isBulk,
          n: Number(d['Count of doc_no']) || 0, sum: Number(d['Sum of Diff']) || 0,
          _region: o.region, _divn: isBulk ? 'Bulk' : o.division, _supp: isBulk ? 'Bulk · ' + o.region : o.ccc, CCC_CODE: code
        };
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      var probs = {}; all.forEach(function (r) { if (r.prob) probs[r.prob] = 1; });
      UI.fill('probFilter', Object.keys(probs).sort(), 'All problems');
      fillOffices();
    }
    function fillOffices() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }
    function base(skipProb) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, prob = $('probFilter').value;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (skipProb || !prob || r.prob === prob) &&
          (!bulk || (bulk === 'only' ? r.bulk : !r.bulk));
      });
    }

    function render() {
      var b = base(false), t = agg(b), te = agg(b.filter(function (r) { return r.tech; })), nt = agg(b.filter(function (r) { return !r.tech; }));
      $('sN').textContent = UI.n(t.n); $('sNS').textContent = UI.n(te.n) + ' technical · ' + UI.n(nt.n) + ' other';
      $('sAvg').textContent = dur(t.avg);
      $('sTech').textContent = dur(te.avg); $('sTechS').textContent = UI.n(te.n) + ' dockets';
      $('sNon').textContent = dur(nt.avg); $('sNonS').textContent = UI.n(nt.n) + ' dockets';
      var byCcc = {}; b.forEach(function (r) { if (r.bulk || !r._supp) return; var o = byCcc[r._supp] || (byCcc[r._supp] = []); o.push(r); });
      var best = null; Object.keys(byCcc).forEach(function (k) { var a = agg(byCcc[k]); if (a.n >= 20 && (!best || a.avg < best.avg)) best = { name: k, avg: a.avg, n: a.n }; });
      $('sBest').textContent = best ? best.name : '—'; $('sBestS').textContent = best ? dur(best.avg) + ' average' : ' ';

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      b.forEach(function (r) { var name = r[key] || 'Unmapped'; (g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', rows: [] })).rows.push(r); });
      var list = Object.keys(g).map(function (k) {
        var o = g[k], a = agg(o.rows), at = agg(o.rows.filter(function (r) { return r.tech; })), an = agg(o.rows.filter(function (r) { return !r.tech; }));
        return { name: o.name, parent: o.parent, n: a.n, avg: a.avg, tech: at.avg, non: an.avg };
      });
      var dcol = function (key, label, hide) { return { key: key, label: label, num: true, hideSm: hide, sortVal: function (x) { return x[key] == null ? 1e9 : x[key]; }, fmt: dur }; };
      UI.table('officeTable', {
        rows: list, sort: { key: 'avg', dir: 'asc' }, count: false, empty: 'No dockets for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          dcol('avg', 'Average'), dcol('tech', 'Technical', true), dcol('non', 'Non-technical', true)
        ],
        foot: list.length > 1 ? { n: t.n, avg: t.avg, tech: te.avg, non: nt.avg } : null,
        onRow: level === 'ccc' ? null : function (x) { drill(x.name); }
      });

      var pb = base(true), pg = {};
      pb.forEach(function (r) { (pg[r.prob || '—'] || (pg[r.prob || '—'] = [])).push(r); });
      var plist = Object.keys(pg).map(function (k) { var a = agg(pg[k]); return { prob: k, n: a.n, avg: a.avg, tech: pg[k][0].tech }; });
      window.__probs = plist;
      UI.table('probTable', {
        rows: plist, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No dockets.',
        selected: function (x) { return x.prob === $('probFilter').value; },
        columns: [
          { key: 'prob', label: 'Problem', cls: 'wrap', fmt: function (v, x) { return UI.esc(v) + '<span class="sub">' + (x.tech ? 'Technical' : 'Non-technical') + '</span>'; } },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          dcol('avg', 'Average')
        ],
        onRow: function (x) { $('probFilter').value = $('probFilter').value === x.prob ? '' : x.prob; UI.mark($('probFilter')); render(); }
      });
      $('clearBtn').hidden = !(bulk || $('probFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillOffices(); markAll(); setLevel(level);
    }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter', 'probFilter'].forEach(function (id) { UI.mark($(id)); }); }
    function setBulk(v, quiet) { bulk = v; [].forEach.call(document.querySelectorAll('#bulk button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-b') === v)); }); if (!quiet) render(); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); markAll(); render();
      });
    });
    $('probFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('bulk').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setBulk(b.getAttribute('data-b')); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      ['regionFilter', 'divisionFilter', 'cccFilter', 'probFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillOffices(); markAll(); setBulk('', true);
      setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('docket-closure-by-problem.csv', [{ key: 'prob', label: 'Problem' }, { key: 'tech', label: 'Type', csv: function (x) { return x.tech ? 'Technical' : 'Non-technical'; } }, { key: 'n', label: 'Dockets' }, { key: 'avg', label: 'Average closure (days)', csv: function (x) { return x.avg == null ? '' : x.avg.toFixed(3); } }], window.__probs || []);
    });

    function load(force) {
      var b = $('refreshBtn'); if (force) b.classList.add('spin');
      return fetch(URL_CSV, { cache: force ? 'no-store' : 'default' }).then(function (r) { if (!r.ok) throw new Error('Sheet HTTP ' + r.status); return r.text(); })
        .then(function (t) {
          prepare(t);
          if (!load.done) {
            load.done = true;
            if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
            [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (x) { x.setAttribute('aria-selected', String(x.getAttribute('data-l') === level)); });
            markAll();
          }
          render();
        })
        .catch(function (e) { if (!all.length) { $('officeTable').innerHTML = '<div class="ui-empty">' + UI.esc(e.message) + '</div>'; } else UI.toast(e.message); })
        .then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
