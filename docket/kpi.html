
<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket closure KPI · DISHA</title>
  <script src="/mzo_theme.js?v=7"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=9" />
  <script src="/mzo_ui.js?v=9" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .rem-hint {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--mzo-muted);
      border-bottom: 1px solid var(--mzo-border);
    }
    .rd-copy { margin-left: auto; margin-right: 2px; }
    .ui-stat .s { font-size: 11px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Docket closure KPI <span class="ui-badge ui-date" id="asOn">Jan 2023 – Jun 2025</span></h1>
        <p id="meta">Closed dockets analysis</p>
      </div>
      <div class="ui-actions">
        <a class="ui-btn sm" href="/docket.html" id="openLink">Open dockets</a>
        <div class="ui-seg" id="bulk" role="group" aria-label="Bulk dockets">
          <button type="button" data-b="" aria-pressed="true">All</button>
          <button type="button" data-b="ex" aria-pressed="false">Excl. bulk</button>
          <button type="button" data-b="only" aria-pressed="false">Bulk only</button>
        </div>
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search problem, CCC or division" autocomplete="off" aria-label="Search problems" title="Search problems" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
          <span class="ui-select"><select id="probFilter" aria-label="Problem"><option value="">All problems</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Docket classification" id="fType"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Closure speed bracket" id="fBracket"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Top problem types" id="fTopProb"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-t=""><div class="k">Closed dockets</div><div class="v" id="sN"><span class="ui-skel"></span></div><div class="s" id="sNS">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t=""><div class="k">Average closure</div><div class="v" id="sAvg"><span class="ui-skel"></span></div><div class="s">All dockets</div></button>
          <button type="button" class="ui-stat" data-t="tech"><div class="k">Technical</div><div class="v" id="sTech"><span class="ui-skel"></span></div><div class="s" id="sTechS">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t="nontech"><div class="k">Non-technical</div><div class="v" id="sNon"><span class="ui-skel"></span></div><div class="s" id="sNonS">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-t=""><div class="k">Fastest CCC</div><div class="v" id="sBest" style="font-size:17px;line-height:1.4"><span class="ui-skel"></span></div><div class="s" id="sBestS">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title" id="tableTitle">Detailed analysis</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="rem-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var BULK = { '6610000': 1, '6620000': 1, '6630000': 1 };
    var BRACKETS = [
      { key: 'b0', label: 'Under 24 hours', test: function (a) { return a < 1; } },
      { key: 'b1', label: '1–2 days', test: function (a) { return a >= 1 && a < 2; } },
      { key: 'b2', label: '2–4 days', test: function (a) { return a >= 2 && a < 4; } },
      { key: 'b3', label: '4–7 days', test: function (a) { return a >= 4 && a < 7; } },
      { key: 'b4', label: 'Over 7 days', test: function (a) { return a >= 7; } }
    ];
    var TABS = [
      { id: 'region', label: 'Region' },
      { id: 'division', label: 'Division' },
      { id: 'ccc', label: 'CCC Ranking' },
      { id: 'problems', label: 'Problems' },
      { id: 'brackets', label: 'Speed Brackets' },
      { id: 'extremes', label: 'Fastest & Slowest' }
    ];

    var all = [], bulk = '', fType = '', fBracket = '', q = '';
    var tab = 'region', scope = null;

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    function clearAll() {
      fType = ''; fBracket = ''; q = ''; bulk = '';
      $('q').value = ''; $('probFilter').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
        if (!$(id).disabled) $(id).value = '';
      });
      setBulk('', true);
      fillOffices(); markAll();
      syncUrl();
      render();
    }

    // Closure time in days → "35h 39m" or "4d 6h"
    function dur(days) {
      if (days == null || !isFinite(days)) return '—';
      var m = Math.round(days * 1440);
      if (m < 60 * 48) return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
      var h = Math.round(m / 60);
      return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
    }
    function agg(rows) {
      var n = 0, s = 0;
      rows.forEach(function (r) { n += r.n; s += r.sum; });
      return { n: n, sum: s, avg: n ? s / n : null };
    }

    function prepare(t) {
      all = t.rows.filter(function (d) { return d.ccc_code; }).map(function (d) {
        var code = d.ccc_code, isBulk = !!BULK[code];
        var n = d.count_of_doc_no || 0, sum = d.sum_of_diff || 0;
        return {
          tech: d.description === 'B', prob: d.prob_type || 'Unspecified', code: code, bulk: isBulk,
          n: n, sum: sum, avg: n ? sum / n : null,
          _region: d._region, _divn: isBulk ? 'Bulk' : d._division, _supp: isBulk ? 'Bulk · ' + d._region : d._ccc, CCC_CODE: code
        };
      });
      var probs = {};
      all.forEach(function (r) { if (r.prob) probs[r.prob] = 1; });
      UI.fill('probFilter', Object.keys(probs).sort(), 'All problems');
      fillOffices();
    }

    function fillOffices() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }
    function markAll() {
      ['regionFilter', 'divisionFilter', 'cccFilter', 'probFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function base(skipProb, skipType, skipBracket) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, prob = $('probFilter').value;
      var query = q.toLowerCase();
      var bDef = fBracket ? BRACKETS.filter(function (b) { return b.key === fBracket; })[0] : null;

      return all.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (ccc && r._supp !== ccc) return false;
        if (!skipProb && prob && r.prob !== prob) return false;
        if (!skipType && fType === 'tech' && !r.tech) return false;
        if (!skipType && fType === 'nontech' && r.tech) return false;
        if (!skipBracket && bDef && (r.avg == null || !bDef.test(r.avg))) return false;
        if (bulk && (bulk === 'only' ? !r.bulk : r.bulk)) return false;
        if (query && r.prob.toLowerCase().indexOf(query) === -1 && String(r._supp || '').toLowerCase().indexOf(query) === -1 && String(r._divn || '').toLowerCase().indexOf(query) === -1) return false;
        return true;
      });
    }

    function syncUrl() {
      var p = new URLSearchParams();
      if ($('regionFilter').value) p.set('region', $('regionFilter').value);
      if ($('divisionFilter').value) p.set('division', $('divisionFilter').value);
      if ($('cccFilter').value) p.set('ccc', $('cccFilter').value);
      if ($('probFilter').value) p.set('prob', $('probFilter').value);
      if (q) p.set('q', q);
      if (fType) p.set('type', fType);
      if (fBracket) p.set('bracket', fBracket);
      if (bulk) p.set('bulk', bulk);
      if (tab !== 'region') p.set('tab', tab);
      var qs = p.toString();
      var url = location.pathname + (qs ? '?' + qs : '');
      if (location.search !== (qs ? '?' + qs : '')) history.replaceState(null, '', url);
    }

    function render() {
      var b = base(false, false, false);
      var t = agg(b);
      var te = agg(b.filter(function (r) { return r.tech; }));
      var nt = agg(b.filter(function (r) { return !r.tech; }));

      // KPI cards update
      $('sN').textContent = UI.n(t.n);
      $('sNS').textContent = UI.n(te.n) + ' technical · ' + UI.n(nt.n) + ' other';
      $('sAvg').textContent = dur(t.avg);
      $('sTech').textContent = dur(te.avg);
      $('sTechS').textContent = UI.n(te.n) + ' dockets';
      $('sNon').textContent = dur(nt.avg);
      $('sNonS').textContent = UI.n(nt.n) + ' dockets';

      var byCcc = {};
      b.forEach(function (r) {
        if (r.bulk || !r._supp) return;
        var o = byCcc[r._supp] || (byCcc[r._supp] = []);
        o.push(r);
      });
      var best = null;
      Object.keys(byCcc).forEach(function (k) {
        var a = agg(byCcc[k]);
        if (a.n >= 20 && (!best || a.avg < best.avg)) best = { name: k, avg: a.avg, n: a.n };
      });
      $('sBest').textContent = best ? best.name : '—';
      $('sBestS').textContent = best ? dur(best.avg) + ' avg (' + UI.n(best.n) + ' dockets)' : ' ';

      // Facets
      var bForType = base(false, true, false);
      var typeItems = [
        { value: '', label: 'All types', count: bForType.reduce(function (a, r) { return a + r.n; }, 0) },
        { value: 'tech', label: 'Technical', count: bForType.filter(function (r) { return r.tech; }).reduce(function (a, r) { return a + r.n; }, 0) },
        { value: 'nontech', label: 'Non-technical', count: bForType.filter(function (r) { return !r.tech; }).reduce(function (a, r) { return a + r.n; }, 0) }
      ];
      UI.facet($('fType'), typeItems, fType, function (v) { fType = v; syncUrl(); render(); });

      var bForBracket = base(false, false, true);
      var bracketItems = [{ value: '', label: 'Any speed', count: bForBracket.reduce(function (a, r) { return a + r.n; }, 0) }].concat(BRACKETS.map(function (bk) {
        var cnt = bForBracket.filter(function (r) { return r.avg != null && bk.test(r.avg); }).reduce(function (a, r) { return a + r.n; }, 0);
        return { value: bk.key, label: bk.label, count: cnt };
      }));
      UI.facet($('fBracket'), bracketItems, fBracket, function (v) { fBracket = v; syncUrl(); render(); });

      var bForProb = base(true, false, false);
      var pc = {};
      bForProb.forEach(function (r) {
        if (r.prob) pc[r.prob] = (pc[r.prob] || 0) + r.n;
      });
      var topProbs = Object.keys(pc).sort(function (x, y) { return pc[y] - pc[x]; }).slice(0, 8);
      var curProb = $('probFilter').value;
      if (curProb && topProbs.indexOf(curProb) === -1) topProbs.push(curProb);
      var topProbItems = [{ value: '', label: 'All problems', count: bForProb.reduce(function (a, r) { return a + r.n; }, 0) }].concat(topProbs.map(function (p) {
        return { value: p, label: p, count: pc[p] || 0 };
      }));
      UI.facet($('fTopProb'), topProbItems, $('probFilter').value, function (v) {
        $('probFilter').value = v;
        UI.mark($('probFilter'));
        syncUrl(); render();
      });

      // Active filters count
      var hasOffice = ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; });
      var nActive = (q ? 1 : 0) + ($('probFilter').value ? 1 : 0) + (fType ? 1 : 0) + (fBracket ? 1 : 0) + (bulk ? 1 : 0) + (hasOffice ? 1 : 0);
      setActive(nActive);

      // Render Tabs
      var tabsEl = $('tabs');
      tabsEl.innerHTML = TABS.map(function (it) {
        return '<button type="button" class="ui-drill-tab" role="tab" data-tab="' + it.id + '" aria-selected="' + String(tab === it.id) + '">' + it.label + '</button>';
      }).join('');

      $('hint').innerHTML = '<span class="ui-strong">' + UI.n(t.n) + '</span> closed dockets · Overall average: <span class="ui-strong">' + dur(t.avg) + '</span> · Technical: <span class="ui-strong">' + dur(te.avg) + '</span> (' + UI.n(te.n) + ') · Non-technical: <span class="ui-strong">' + dur(nt.avg) + '</span> (' + UI.n(nt.n) + ')';

      window.__view = b;

      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(t.n) + ' dockets · ' + dur(t.avg) + ' avg';
      renderReportHead(b);

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        renderOfficesTab(b, t, te, nt);
      } else if (tab === 'problems') {
        renderProblemsTab(b);
      } else if (tab === 'brackets') {
        renderBracketsTab(b, t);
      } else if (tab === 'extremes') {
        renderExtremesTab(b);
      }
    }

    var currentActiveFilters = [];
    function renderReportHead(b) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      if (q) {
        active.push({ key: 'q', label: 'Search: ' + q, clear: function () { q = ''; $('q').value = ''; syncUrl(); render(); } });
      }
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillOffices(); markAll(); syncUrl(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillOffices(); markAll(); syncUrl(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; markAll(); syncUrl(); render(); } });
      }
      var prVal = $('probFilter').value;
      if (prVal) {
        active.push({ key: 'prob', label: 'Problem: ' + prVal, clear: function () { $('probFilter').value = ''; UI.mark($('probFilter')); syncUrl(); render(); } });
      }
      if (fType) {
        var tLabel = fType === 'tech' ? 'Technical' : 'Non-technical';
        active.push({ key: 'type', label: 'Type: ' + tLabel, clear: function () { fType = ''; syncUrl(); render(); } });
      }
      if (fBracket) {
        var bkMatch = BRACKETS.filter(function (bk) { return bk.key === fBracket; })[0];
        active.push({ key: 'bracket', label: 'Speed: ' + (bkMatch ? bkMatch.label : fBracket), clear: function () { fBracket = ''; syncUrl(); render(); } });
      }
      if (bulk) {
        var bLabel = bulk === 'ex' ? 'Excl. bulk' : 'Bulk only';
        active.push({ key: 'bulk', label: 'Bulk: ' + bLabel, clear: function () { setBulk('', true); syncUrl(); render(); } });
      }
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    var dcol = function (key, label, hide) {
      return {
        key: key,
        label: label,
        num: true,
        hideSm: hide,
        sortVal: function (x) { return x[key] == null ? 1e9 : x[key]; },
        fmt: dur
      };
    };

    function renderOfficesTab(b, t, te, nt) {
      var key = tab === 'region' ? '_region' : tab === 'division' ? '_divn' : '_supp', g = {};
      b.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        (g[name] || (g[name] = { name: name, parent: tab === 'ccc' ? r._divn : tab === 'division' ? r._region : '', rows: [] })).rows.push(r);
      });
      var list = Object.keys(g).map(function (k) {
        var o = g[k], a = agg(o.rows), at = agg(o.rows.filter(function (r) { return r.tech; })), an = agg(o.rows.filter(function (r) { return !r.tech; }));
        return { name: o.name, parent: o.parent, n: a.n, avg: a.avg, tech: at.avg, non: an.avg, rows: o.rows };
      });
      var maxN = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'avg', dir: 'asc' },
        count: false,
        empty: 'No dockets for these filters.',
        columns: [
          {
            key: 'name',
            label: tab === 'ccc' ? 'CCC' : tab === 'division' ? 'Division' : 'Region',
            fmt: function (v, x) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : '');
            }
          },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          {
            key: 'share',
            label: 'Share',
            sortVal: function (x) { return x.n; },
            fmt: function (_, x) { return UI.bar(x.n, maxN, UI.pct(x.n, t.n)); },
            hideSm: true,
            width: '20%'
          },
          dcol('avg', 'Average closure'),
          dcol('tech', 'Technical', true),
          dcol('non', 'Non-technical', true)
        ],
        foot: list.length > 1 ? { n: t.n, avg: t.avg, tech: te.avg, non: nt.avg } : null,
        onRow: function (x) {
          if (tab === 'region') {
            if ($('regionFilter').disabled) return;
            $('regionFilter').value = x.name; $('divisionFilter').value = ''; $('cccFilter').value = '';
            tab = 'division';
          } else if (tab === 'division') {
            if ($('divisionFilter').disabled) return;
            $('divisionFilter').value = x.name; $('cccFilter').value = '';
            tab = 'ccc';
          } else {
            showCccDrawer(x);
            return;
          }
          fillOffices(); markAll(); syncUrl(); render();
        }
      });
    }

    function showCccDrawer(x) {
      var pairs = [
        ['CCC Name', x.name], ['Division', x.parent], ['Closed dockets', UI.n(x.n)],
        ['Average closure', dur(x.avg)], ['Technical closure avg', dur(x.tech)], ['Non-technical closure avg', dur(x.non)]
      ];
      var probMap = {};
      (x.rows || []).forEach(function (r) {
        var o = probMap[r.prob] || (probMap[r.prob] = { prob: r.prob, tech: r.tech, n: 0, sum: 0 });
        o.n += r.n; o.sum += r.sum;
      });
      var pList = Object.keys(probMap).map(function (k) {
        var o = probMap[k]; o.avg = o.n ? o.sum / o.n : null; return o;
      }).sort(function (a, b) { return b.n - a.n; });

      var extraHtml = '<div style="margin-top:16px"><h4 style="font-size:13px;font-weight:600;margin-bottom:8px">Top problems at ' + UI.esc(x.name) + '</h4>' +
        '<table class="ui-table" style="font-size:12px;width:100%">' +
        '<thead><tr><th>Problem</th><th style="text-align:right">Dockets</th><th style="text-align:right">Avg closure</th></tr></thead>' +
        '<tbody>' + pList.slice(0, 10).map(function (p) {
          return '<tr><td>' + UI.esc(p.prob) + ' <span class="sub">' + (p.tech ? 'Tech' : 'Non-tech') + '</span></td><td style="text-align:right">' + UI.n(p.n) + '</td><td style="text-align:right">' + dur(p.avg) + '</td></tr>';
        }).join('') + '</tbody></table></div>';

      UI.drawer(x.name, x.parent, pairs, extraHtml);
      var head = document.querySelector('#ui-drawer header'), btn = head ? head.querySelector('.rd-copy') : null;
      if (head && !btn) {
        btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ui-btn sm rd-copy';
        btn.innerHTML = UI.icon('copy') + 'Copy';
        head.insertBefore(btn, head.lastElementChild);
      }
      if (btn) {
        btn.onclick = function () {
          var text = '*Docket closure KPI: ' + x.name + '*\n' + pairs.map(function (p) { return '*' + p[0] + ':* ' + p[1]; }).join('\n');
          UI.copy(text).then(function () { UI.toast('Details copied'); });
        };
      }
    }

    function renderProblemsTab(b) {
      var pg = {};
      b.forEach(function (r) {
        (pg[r.prob || '—'] || (pg[r.prob || '—'] = [])).push(r);
      });
      var plist = Object.keys(pg).map(function (k) {
        var a = agg(pg[k]);
        return { prob: k, n: a.n, avg: a.avg, tech: pg[k][0].tech };
      });
      var maxN = Math.max.apply(null, plist.map(function (x) { return x.n; }).concat([0]));
      var totN = plist.reduce(function (a, x) { return a + x.n; }, 0);

      UI.table('table', {
        rows: plist,
        sort: { key: 'n', dir: 'desc' },
        count: false,
        empty: 'No dockets.',
        selected: function (x) { return x.prob === $('probFilter').value; },
        columns: [
          {
            key: 'prob',
            label: 'Problem',
            cls: 'wrap',
            fmt: function (v, x) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + (x.tech ? 'Technical' : 'Non-technical') + '</span>';
            }
          },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          {
            key: 'share',
            label: 'Share',
            sortVal: function (x) { return x.n; },
            fmt: function (_, x) { return UI.bar(x.n, maxN, UI.pct(x.n, totN)); },
            width: '24%',
            hideSm: true
          },
          dcol('avg', 'Average closure')
        ],
        onRow: function (x) {
          $('probFilter').value = $('probFilter').value === x.prob ? '' : x.prob;
          UI.mark($('probFilter'));
          syncUrl(); render();
        }
      });
    }

    function renderBracketsTab(b, t) {
      var list = BRACKETS.map(function (bk) {
        var sub = b.filter(function (r) { return r.avg != null && bk.test(r.avg); });
        var a = agg(sub);
        var teA = agg(sub.filter(function (r) { return r.tech; }));
        return {
          key: bk.key, label: bk.label, n: a.n, avg: a.avg,
          pct: UI.pct(a.n, t.n), techPct: UI.pct(teA.n, a.n)
        };
      });
      var maxN = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'n', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Closure Speed Bracket', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          { key: 'pct', label: '% Share', num: true },
          { key: 'share', label: 'Distribution', fmt: function (_, o) { return UI.bar(o.n, maxN, o.pct); }, width: '24%', hideSm: true },
          { key: 'techPct', label: 'Technical share', num: true, hideSm: true },
          dcol('avg', 'Average duration')
        ],
        onRow: function (o) {
          fBracket = fBracket === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function renderExtremesTab(b) {
      var byCcc = {};
      b.forEach(function (r) {
        if (r.bulk || !r._supp) return;
        var o = byCcc[r._supp] || (byCcc[r._supp] = { name: r._supp, divn: r._divn, region: r._region, rows: [] });
        o.rows.push(r);
      });
      var qualifying = Object.keys(byCcc).map(function (k) {
        var o = byCcc[k], a = agg(o.rows), at = agg(o.rows.filter(function (r) { return r.tech; }));
        return { name: o.name, divn: o.divn, region: o.region, n: a.n, avg: a.avg, tech: at.avg, rows: o.rows };
      }).filter(function (x) { return x.n >= 20; });

      var fastest = qualifying.slice().sort(function (a, b) { return a.avg - b.avg; }).slice(0, 10).map(function (x, i) { x.rank = 'Fastest #' + (i + 1); x.tone = 'ok'; return x; });
      var slowest = qualifying.slice().sort(function (a, b) { return b.avg - a.avg; }).slice(0, 10).map(function (x, i) { x.rank = 'Slowest #' + (i + 1); x.tone = 'bad'; return x; });

      var list = fastest.concat(slowest);

      UI.table('table', {
        rows: list,
        sort: { key: 'avg', dir: 'asc' },
        count: false,
        columns: [
          {
            key: 'rank',
            label: 'Category',
            fmt: function (v, x) {
              return '<span class="ui-badge ' + x.tone + '">' + UI.esc(v) + '</span>';
            }
          },
          {
            key: 'name',
            label: 'CCC',
            fmt: function (v, x) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + UI.esc(x.divn) + ' · ' + UI.esc(x.region) + '</span>';
            }
          },
          { key: 'n', label: 'Closed Dockets', num: true, fmt: UI.n },
          dcol('avg', 'Average closure'),
          dcol('tech', 'Technical avg', true)
        ],
        onRow: showCccDrawer
      });
    }

    function setBulk(v, quiet) {
      bulk = v;
      [].forEach.call(document.querySelectorAll('#bulk button'), function (x) {
        x.setAttribute('aria-pressed', String(x.getAttribute('data-b') === v));
      });
      if (!quiet) { syncUrl(); render(); }
    }

    // Office filters
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); markAll(); syncUrl(); render();
      });
    });

    $('probFilter').addEventListener('change', function () {
      UI.mark(this); syncUrl(); render();
    });

    $('q').addEventListener('input', UI.debounce(function () {
      q = this.value.trim(); syncUrl(); render();
    }, 160));

    // Stats click toggles technical/non-technical
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var t = s.getAttribute('data-t');
      fType = fType === t ? '' : t;
      syncUrl(); render();
    });

    // Bulk toggle
    $('bulk').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) setBulk(b.getAttribute('data-b'));
    });

    // Tab navigation
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-tab');
      syncUrl(); render();
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var clearBtn = e.target.closest('#rhClearBtn');
      if (clearBtn) { clearAll(); return; }
      var chipBtn = e.target.closest('[data-rh-clear]');
      if (chipBtn) {
        var idx = parseInt(chipBtn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
        }
      }
    });

    // Copy summary action
    $('copyBtn').addEventListener('click', function () {
      var b = base(false, false, false);
      var t = agg(b);
      var te = agg(b.filter(function (r) { return r.tech; }));
      var nt = agg(b.filter(function (r) { return !r.tech; }));
      var text = 'Docket Closure KPI — ' + ($('tableTitle').textContent || 'Summary') + '\n' +
        'Closed Dockets: ' + UI.n(t.n) + '\n' +
        'Overall Avg Closure: ' + dur(t.avg) + '\n' +
        'Technical: ' + dur(te.avg) + ' (' + UI.n(te.n) + ' dockets)\n' +
        'Non-technical: ' + dur(nt.avg) + ' (' + UI.n(nt.n) + ' dockets)\n' +
        (bulk ? 'Bulk: ' + bulk + '\n' : '') +
        ($('regionFilter').value ? 'Region: ' + $('regionFilter').value + '\n' : '') +
        ($('divisionFilter').value ? 'Division: ' + $('divisionFilter').value + '\n' : '') +
        ($('cccFilter').value ? 'CCC: ' + $('cccFilter').value + '\n' : '');
      UI.copy(text).then(function () { UI.toast('Summary copied to clipboard'); });
    });

    // Export CSV
    $('exportBtn').addEventListener('click', function () {
      var b = base(false, false, false);
      UI.exportCsv('docket-closure-kpi.csv', [
        { key: 'name', label: 'CCC', csv: function (r) { return r._supp; } },
        { key: 'divn', label: 'DIVISION', csv: function (r) { return r._divn; } },
        { key: 'region', label: 'REGION', csv: function (r) { return r._region; } },
        { key: 'prob', label: 'PROBLEM', csv: function (r) { return r.prob; } },
        { key: 'tech', label: 'TYPE', csv: function (r) { return r.tech ? 'Technical' : 'Non-technical'; } },
        { key: 'n', label: 'DOCKETS', csv: function (r) { return r.n; } },
        { key: 'avg', label: 'AVERAGE_DAYS', csv: function (r) { return r.avg == null ? '' : r.avg.toFixed(3); } }
      ], b);
    });

    // Open dockets link handler
    $('openLink').addEventListener('click', function (e) {
      if (window.parent !== window && typeof window.parent.openPage === 'function') {
        e.preventDefault();
        window.parent.openPage('docket.html', 'Docket calls');
      }
    });

    MzoRows.refresh('refreshBtn', 'docket_kpi', function (t) {
      prepare(t);
      render();
    });

    // Read deep link params on start
    function initParams() {
      var p = new URLSearchParams(location.search);
      if (p.has('region')) $('regionFilter').value = p.get('region');
      if (p.has('division')) $('divisionFilter').value = p.get('division');
      if (p.has('ccc')) $('cccFilter').value = p.get('ccc');
      if (p.has('prob')) $('probFilter').value = p.get('prob');
      if (p.has('q')) { q = p.get('q'); $('q').value = q; }
      if (p.has('type')) fType = p.get('type');
      if (p.has('bracket')) fBracket = p.get('bracket');
      if (p.has('bulk')) setBulk(p.get('bulk'), true);
      if (p.has('tab')) tab = p.get('tab');
    }

    var first = true;
    MzoRows.load('docket_kpi', function (t, info) {
      if (!t) {
        if (info && info.error && !all.length) {
          $('meta').textContent = 'Could not load data';
          $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
        }
        return;
      }
      prepare(t);
      if (first) {
        first = false;
        initParams();
        if (!new URLSearchParams(location.search).has('tab')) {
          if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
          else if (scope && scope.level === 'region') tab = 'division';
        }
      }
      markAll();
      render();
    });
  });
  </script>
</body>
</html>
