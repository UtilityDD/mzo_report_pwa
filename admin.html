<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <script src="mzo_theme.js?v=3"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Structure Management</title>
    <style>
        body { margin: 0; font: 13px/1.5 var(--mzo-font); background: var(--mzo-bg); color: var(--mzo-text); }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 28px 72px; }
        .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
        .header p { margin: 3px 0 0; font-size: 13px; color: var(--mzo-muted); }
        .main-content { padding: 0; }
        .structure-editor { display: flex; flex-direction: column; gap: 16px; }
        .section-card, .structure-card { background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
        .section-header, .structure-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 50px; padding: 9px 12px 9px 16px; border-bottom: 1px solid var(--mzo-border); font-size: 14px; font-weight: 600; }
        .section-body { padding: 0; }
        .structure-body { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
        .toolbar-inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12.5px; font-weight: 500; color: var(--mzo-text-2); margin-bottom: 4px; }
        .form-group input, .form-group textarea, .search-input {
          width: 100%; height: 32px; padding: 0 10px; font: 13px var(--mzo-font);
          border: 1px solid var(--mzo-border-strong); border-radius: 7px;
          background: var(--mzo-input); color: var(--mzo-text); outline: none;
        }
        .form-group textarea { height: auto; min-height: 110px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
        .form-group input:focus, .form-group textarea:focus, .search-input:focus { border-color: var(--mzo-accent); box-shadow: var(--mzo-ring); }
        input::placeholder, textarea::placeholder { color: var(--mzo-faint); }
        .search-input { width: 240px; }
        .btn {
          height: 32px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          font: 500 13px var(--mzo-font); white-space: nowrap; cursor: pointer;
          border-radius: 7px; border: 1px solid var(--mzo-border-strong);
          background: var(--mzo-surface); color: var(--mzo-text);
          transition: background-color .12s, border-color .12s;
        }
        .btn:hover { background: var(--mzo-hover); }
        .btn-primary, .btn-success { background: var(--mzo-fill); border-color: var(--mzo-fill); color: var(--mzo-on-fill); }
        .btn-primary:hover, .btn-success:hover { background: var(--mzo-fill-hover); border-color: var(--mzo-fill-hover); }
        .btn-danger { color: var(--mzo-bad); }
        .btn-danger:hover { background: var(--mzo-bad-soft); }
        .toolbar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0; margin-top: 8px; background: var(--mzo-bg); border-top: 1px solid var(--mzo-border); }
        .notification { padding: 10px 14px; margin: 0 0 16px; border-radius: 8px; font-weight: 500; display: none; }
        .notification.success { background: var(--mzo-ok-soft); color: var(--mzo-ok); }
        .notification.error { background: var(--mzo-bad-soft); color: var(--mzo-bad); }
        .loader { text-align: center; padding: 40px 16px; color: var(--mzo-muted); }
        .table-wrap { overflow-x: auto; }
        .user-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
        .user-table th, .user-table td { padding: 9px 12px; border-bottom: 1px solid var(--mzo-border); text-align: left; vertical-align: middle; }
        .user-table th:first-child, .user-table td:first-child { padding-left: 16px; }
        .user-table th { position: sticky; top: 0; background: var(--mzo-surface); font-size: 12px; font-weight: 500; color: var(--mzo-muted); white-space: nowrap; }
        .user-table tbody tr:hover td { background: var(--mzo-row-hover); }
        .user-table tbody tr:last-child td { border-bottom: 0; }
        .user-table .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .user-table .actions .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
        .muted { color: var(--mzo-muted); }
        .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--mzo-surface-2); color: var(--mzo-text-2); box-shadow: inset 0 0 0 1px var(--mzo-border); }
        .badge-admin { background: var(--mzo-fill); color: var(--mzo-on-fill); box-shadow: none; }
        .modal-overlay { position: fixed; inset: 0; background: var(--mzo-scrim); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-card { width: min(760px, 100%); max-height: 90vh; overflow-y: auto; background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 12px; box-shadow: var(--mzo-shadow-pop); }
        .modal-header { position: sticky; top: 0; z-index: 1; background: var(--mzo-surface); padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--mzo-border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { margin: 0; font-size: 15px; font-weight: 600; }
        .modal-body { padding: 18px 20px; display: grid; gap: 14px; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid var(--mzo-border); display: flex; justify-content: flex-end; gap: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap: 14px; }
        .form-grid .span-2 { grid-column: 1 / -1; }
        @media (max-width: 760px) {
            .container { padding: 16px 14px 56px; }
            .section-header, .toolbar-inline { flex-direction: column; align-items: stretch; }
            .search-input { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
        }
</style>
  <link rel="stylesheet" href="mzo_theme.css?v=5" />
</head>
<body>

<div class="container">
    <div class="header">
        <div><h1>Structure</h1><p>Estimate structures and portal users</p></div>
    </div>

    <div id="notification" class="notification"></div>

    <div class="main-content">
        <div class="section-card">
            <div class="section-header">
                <span>Users</span>
                <div class="toolbar-inline">
                    <input type="text" id="userSearch" class="search-input" placeholder="Search users..." oninput="filterUsers()">
                    <button class="btn btn-secondary" onclick="refreshUsers()">Refresh</button>
                    <button class="btn btn-primary" onclick="openUserModal()">Add user</button>
                </div>
            </div>
            <div class="section-body">
                <div class="table-wrap">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>SS Auth</th>
                                <th>Division / CCC</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="6" class="muted">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="loader" class="loader">
            <p>Loading structures...</p>
        </div>
        <div id="structure-editor" class="structure-editor" style="display: none;">
            <!-- Structure cards will be rendered here by JavaScript -->
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" onclick="addNewStructure()">Add structure</button>
        <button class="btn btn-success" onclick="saveAllChanges()">Save changes</button>
    </div>
</div>

<div id="userModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="userModalTitle">Add user</h2>
            <button class="btn btn-danger" type="button" onclick="closeUserModal()">Close</button>
        </div>
        <form id="userForm" onsubmit="saveUser(event)">
            <input type="hidden" id="userFormMode" value="create">
            <input type="hidden" id="originalUsername">
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="usernameInput">Username *</label>
                        <input type="text" id="usernameInput" required>
                    </div>
                    <div class="form-group">
                        <label for="pinInput">PIN</label>
                        <input type="password" id="pinInput" autocomplete="new-password" placeholder="Leave blank to keep the current PIN">
                    </div>
                    <div class="form-group">
                        <label for="nameInput">Full Name</label>
                        <input type="text" id="nameInput">
                    </div>
                    <div class="form-group">
                        <label for="roleInput">Role</label>
                        <input type="text" id="roleInput" placeholder="admin or blank for user">
                    </div>
                    <div class="form-group span-2">
                        <label for="ssAuthInput">SS Authorization</label>
                        <input type="text" id="ssAuthInput" placeholder="Y, all, or comma-separated SS names">
                    </div>
                    <div class="form-group">
                        <label for="dtrAuthInput">DTR Auth</label>
                        <input type="text" id="dtrAuthInput">
                    </div>
                    <div class="form-group">
                        <label for="ddAuthInput">DD Auth</label>
                        <input type="text" id="ddAuthInput">
                    </div>
                    <div class="form-group">
                        <label for="nscAuthInput">NSC Auth</label>
                        <input type="text" id="nscAuthInput">
                    </div>
                    <div class="form-group">
                        <label for="nscUploadAuthInput">NSC Raw Upload</label>
                        <select id="nscUploadAuthInput">
                            <option value="">No</option>
                            <option value="Y">Yes — can upload</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="siAuthInput">SI Auth</label>
                        <input type="text" id="siAuthInput" placeholder="view or edit">
                    </div>
                    <div class="form-group span-2">
                        <label for="siDivisionsInput">SI Divisions</label>
                        <input type="text" id="siDivisionsInput" placeholder="ALL or Malda,Chanchal,Gazole">
                    </div>
                    <div class="form-group">
                        <label for="zoneCodeInput">Zone Code</label>
                        <input type="text" id="zoneCodeInput">
                    </div>
                    <div class="form-group">
                        <label for="regionCodeInput">Region Code</label>
                        <input type="text" id="regionCodeInput">
                    </div>
                    <div class="form-group">
                        <label for="divisionCodeInput">Division Code</label>
                        <input type="text" id="divisionCodeInput">
                    </div>
                    <div class="form-group">
                        <label for="cccCodeInput">CCC Code</label>
                        <input type="text" id="cccCodeInput">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="closeUserModal()">Cancel</button>
                <button class="btn btn-primary" type="submit">Save User</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_URL_GET = '/api/structures'; // Read structures from CSV via API
    const API_URL_UPDATE = '/api/structures/update'; // Update endpoint (saves to CSV)
    let structureData = [];
    let usersData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadStructures();
        loadUsers();
    });

    async function loadStructures() {
        showLoader(true);
        try {
            const response = await fetch(API_URL_GET);
            if (!response.ok) throw new Error('Failed to fetch structures from the server.');
            const rawStructures = await response.json();

            // Materials / labour arrive as "index:qty;index:qty" (e.g. "1:1;3:1;5:3")
            const parsePairs = (v) => {
                if (Array.isArray(v)) return v;
                if (typeof v !== 'string' || !v) return [];
                return v.split(';')
                    .map(pair => {
                        const parts = pair.split(':');
                        if (parts.length < 2) return null;
                        return { index: parseInt(parts[0].trim(), 10), qty: parseFloat(parts[1].trim()) };
                    })
                    .filter(item => item && !isNaN(item.index) && !isNaN(item.qty));
            };

            // Convert API data to the JSON structure used by the editor
            structureData = rawStructures.map(s => {
                const materials = parsePairs(s.materials);
                const labour = parsePairs(s.labour);

                // Parse voltage - pipe separated "33 kV|11 kV"
                let voltage = [];
                if (typeof s.voltage === 'string') {
                    voltage = s.voltage.split('|').map(v => v.trim()).filter(v => v);
                } else if (Array.isArray(s.voltage)) {
                    voltage = s.voltage;
                }

                return {
                    id: s.id,
                    name: s.name,
                    description: s.description,
                    voltage: voltage,
                    materials: materials,
                    labour: labour
                };
            });

            renderEditor();

        } catch (error) {
            showNotification(error.message, 'error');
            console.error(error);
        } finally {
            showLoader(false);
        }
    }

    function renderEditor() {
        const editor = document.getElementById('structure-editor');
        editor.innerHTML = '';
        structureData.forEach((structure, index) => {
            const card = document.createElement('div');
            card.className = 'structure-card';
            card.dataset.index = index;
            card.innerHTML = `
                <div class="structure-header">
                    <span>ID: ${escapeHtml(structure.id)}</span>
                    <button class="btn btn-danger" onclick="deleteStructure(${index})">Delete</button>
                </div>
                <div class="structure-body">
                    <div class="form-group">
                        <label>ID (unique, no spaces)</label>
                        <input type="text" data-field="id" value="${escapeHtml(structure.id)}">
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" data-field="name" value="${escapeHtml(structure.name)}">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" data-field="description" value="${escapeHtml(structure.description)}">
                    </div>
                    <div class="form-group">
                        <label>Voltage (comma-separated)</label>
                        <input type="text" data-field="voltage" value="${escapeHtml(Array.isArray(structure.voltage) ? structure.voltage.join(', ') : (structure.voltage || ''))}">
                    </div>
                    <div class="form-group">
                        <label>Materials (JSON format)</label>
                        <textarea data-field="materials">${escapeHtml(JSON.stringify(structure.materials, null, 2))}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Labour (JSON format)</label>
                        <textarea data-field="labour">${escapeHtml(JSON.stringify(structure.labour, null, 2))}</textarea>
                    </div>
                </div>
            `;
            editor.appendChild(card);
        });
    }

    function addNewStructure() {
        const newStructure = {
            id: `new_structure_${Date.now()}`,
            name: "New Structure",
            description: "",
            voltage: [],
            materials: [],
            labour: []
        };
        structureData.unshift(newStructure); // Add to the beginning of the array
        renderEditor();
        window.scrollTo(0, 0);
    }

    function deleteStructure(index) {
        if (confirm('Are you sure you want to delete this structure? This action cannot be undone.')) {
            structureData.splice(index, 1);
            renderEditor();
        }
    }

    async function loadUsers() {
        try {
            const response = await fetch('/api/admin/users');
            const result = await response.json();
            if (!response.ok || result.status !== 'success') {
                throw new Error(result.message || 'Failed to load users.');
            }
            usersData = result.users || [];
            renderUsers(usersData);
        } catch (error) {
            renderUsers([]);
            showNotification(`Users load failed: ${error.message}`, 'error');
        }
    }

    function renderUsers(list) {
        const tbody = document.getElementById('usersTableBody');
        if (!tbody) return;
        if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="6" class="muted">No users found.</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(user => {
            const username = escapeHtml(user.Username || '');
            const name = escapeHtml(user.Name || '');
            const roleBadge = (user.role || '').trim().toLowerCase() === 'admin'
                ? '<span class="badge badge-admin">Admin</span>'
                : '<span class="badge badge-user">User</span>';
            const ssAuth = escapeHtml(user['ss-autho'] || '-');
            const mapping = [user.division_code, user.ccc_code].filter(Boolean).map(escapeHtml).join(' / ') || '-';
            return `
                <tr>
                    <td><strong>${username}</strong></td>
                    <td>${name || '<span class="muted">No name</span>'}</td>
                    <td>${roleBadge}</td>
                    <td>${ssAuth}</td>
                    <td>${mapping}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary" type="button" onclick="openUserModal('${escapeHtml(jsQuote(user.Username || ''))}')">Edit</button>
                            <button class="btn btn-danger" type="button" onclick="deleteUser('${escapeHtml(jsQuote(user.Username || ''))}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function filterUsers() {
        const query = (document.getElementById('userSearch')?.value || '').trim().toLowerCase();
        if (!query) {
            renderUsers(usersData);
            return;
        }
        const filtered = usersData.filter(user =>
            [
                user.Username,
                user.Name,
                user.role,
                user['ss-autho'],
                user['dtr-autho'],
                user['dd-autho'],
                user['nsc-autho'],
                user['nsc-upload-autho'],
                user.division_code,
                user.ccc_code
            ].some(value => String(value || '').toLowerCase().includes(query))
        );
        renderUsers(filtered);
    }

    function openUserModal(username = '') {
        const form = document.getElementById('userForm');
        form.reset();
        document.getElementById('userFormMode').value = username ? 'update' : 'create';
        document.getElementById('originalUsername').value = username || '';
        document.getElementById('userModalTitle').textContent = username ? `Edit User: ${username}` : 'Add New User';
        document.getElementById('usernameInput').disabled = !!username;

        if (username) {
            const user = usersData.find(u => String(u.Username || '') === username);
            if (!user) {
                showNotification('User not found.', 'error');
                return;
            }
            document.getElementById('usernameInput').value = user.Username || '';
            document.getElementById('pinInput').value = '';
            document.getElementById('nameInput').value = user.Name || '';
            document.getElementById('roleInput').value = user.role || '';
            document.getElementById('ssAuthInput').value = user['ss-autho'] || '';
            document.getElementById('dtrAuthInput').value = user['dtr-autho'] || '';
            document.getElementById('ddAuthInput').value = user['dd-autho'] || '';
            document.getElementById('nscAuthInput').value = user['nsc-autho'] || '';
            const nscUploadEl = document.getElementById('nscUploadAuthInput');
            if (nscUploadEl) {
                const up = String(user['nsc-upload-autho'] || '').trim().toLowerCase();
                nscUploadEl.value = ['y', 'yes', '1', 'true', 'upload'].includes(up) ? 'Y' : '';
            }
            document.getElementById('siAuthInput').value = user['si-autho'] || 'view';
            document.getElementById('siDivisionsInput').value = user['si-divisions'] || '';
            document.getElementById('zoneCodeInput').value = user.zone_code || '';
            document.getElementById('regionCodeInput').value = user.region_code || '';
            document.getElementById('divisionCodeInput').value = user.division_code || '';
            document.getElementById('cccCodeInput').value = user.ccc_code || '';
        }

        document.getElementById('userModal').classList.add('active');
    }

    function closeUserModal() {
        document.getElementById('userModal').classList.remove('active');
    }

    async function saveUser(event) {
        event.preventDefault();
        const mode = document.getElementById('userFormMode').value;
        const username = document.getElementById('usernameInput').value.trim();
        const pin = document.getElementById('pinInput').value.trim();
        if (!username || (mode === 'create' && !pin)) {
            showNotification('Username and PIN are required.', 'error');
            return;
        }

        const payload = {
            Username: username,
            ...(pin ? { PIN: pin } : {}),
            Name: document.getElementById('nameInput').value.trim(),
            role: document.getElementById('roleInput').value.trim(),
            'ss-autho': document.getElementById('ssAuthInput').value.trim(),
            'dtr-autho': document.getElementById('dtrAuthInput').value.trim(),
            'dd-autho': document.getElementById('ddAuthInput').value.trim(),
            'nsc-autho': document.getElementById('nscAuthInput').value.trim(),
            'nsc-upload-autho': document.getElementById('nscUploadAuthInput').value.trim(),
            'si-autho': document.getElementById('siAuthInput').value.trim() || 'view',
            'si-divisions': document.getElementById('siDivisionsInput').value.trim(),
            zone_code: document.getElementById('zoneCodeInput').value.trim(),
            region_code: document.getElementById('regionCodeInput').value.trim(),
            division_code: document.getElementById('divisionCodeInput').value.trim(),
            ccc_code: document.getElementById('cccCodeInput').value.trim()
        };

        try {
            const response = await fetch(
                mode === 'create' ? '/api/admin/users/create' : '/api/admin/users/update',
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }
            );
            const result = await response.json();
            if (!response.ok || result.status !== 'success') {
                throw new Error(result.message || 'Failed to save user.');
            }
            closeUserModal();
            await loadUsers();
            showNotification(result.message || 'User saved successfully.', 'success');
        } catch (error) {
            showNotification(error.message, 'error');
        }
    }

    async function deleteUser(username) {
        if (!username) return;
        if (!confirm(`Delete user '${username}'? This cannot be undone.`)) return;
        try {
            const response = await fetch('/api/admin/users/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Username: username })
            });
            const result = await response.json();
            if (!response.ok || result.status !== 'success') {
                throw new Error(result.message || 'Failed to delete user.');
            }
            await loadUsers();
            showNotification(result.message || 'User deleted successfully.', 'success');
        } catch (error) {
            showNotification(error.message, 'error');
        }
    }

    async function refreshUsers() {
        try {
            const response = await fetch('/api/admin/sync', { method: 'POST' });
            const result = await response.json();
            if (!response.ok || result.status !== 'success') {
                throw new Error(result.message || 'Failed to refresh users.');
            }
            await loadUsers();
            showNotification(result.message || 'Users refreshed.', 'success');
        } catch (error) {
            showNotification(error.message, 'error');
        }
    }

    async function saveAllChanges() {
        if (!collectDataFromUI()) {
            return; // Stop if data collection failed (e.g., invalid JSON)
        }

        showLoader(true, 'Saving...');
        try {
            const response = await fetch(API_URL_UPDATE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // Convert the UI data back to the CSV format before sending
                body: JSON.stringify(structureData.map(s => {
                    const materialsStr = s.materials.map(m => `${m.index}:${m.qty}`).join(';');
                    const labourStr = s.labour.map(l => `${l.index}:${l.qty}`).join(';');
                    return {
                        id: s.id,
                        name: s.name,
                        description: s.description,
                        voltage: Array.isArray(s.voltage) ? s.voltage.join('|') : '',
                        materials: materialsStr,
                        labour: labourStr
                    };
                }))
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || 'Server returned an error.');
            }

            showNotification(result.message, 'success');
            loadStructures(); // Reload to confirm changes

        } catch (error) {
            showNotification(`Save failed: ${error.message}`, 'error');
            console.error(error);
        } finally {
            showLoader(false);
        }
    }

    function collectDataFromUI() {
        const cards = document.querySelectorAll('.structure-card');
        const newStructureData = [];
        let allValid = true;

        cards.forEach(card => {
            const index = parseInt(card.dataset.index, 10);
            const structure = { ...structureData[index] }; // Create a copy

            // --- Text and simple inputs ---
            structure.id = card.querySelector('[data-field="id"]').value.trim();
            structure.name = card.querySelector('[data-field="name"]').value.trim();
            structure.description = card.querySelector('[data-field="description"]').value.trim();
            
            // --- Voltage array ---
            const voltageString = card.querySelector('[data-field="voltage"]').value;
            structure.voltage = typeof voltageString === 'string' ? voltageString.split(',').map(v => v.trim()).filter(Boolean) : [];

            // --- JSON Textareas (Materials & Labour) ---
            let field = 'materials';
            try {
                structure.materials = JSON.parse(card.querySelector('[data-field="materials"]').value);
                field = 'labour';
                structure.labour = JSON.parse(card.querySelector('[data-field="labour"]').value);
                newStructureData.push(structure);
            } catch (e) {
                allValid = false;
                alert(`Invalid JSON format in structure with ID '${structure.id}'. Please correct it before saving.\n\nError: ${e.message}`);
                card.querySelector(`[data-field="${field}"]`).style.border = '2px solid var(--mzo-bad)';
            }
        });

        if (allValid) {
            // The order might have changed, so we use the new array
            structureData = newStructureData;
            return true;
        }
        return false;
    }

    // --- UI Helpers ---
    function showLoader(show, text = 'Loading...') {
        const loader = document.getElementById('loader');
        const editor = document.getElementById('structure-editor');
        if (show) {
            loader.innerHTML = `<p>${text}</p>`;
            loader.style.display = 'block';
            editor.style.display = 'none';
        } else {
            loader.style.display = 'none';
            editor.style.display = 'block';
        }
    }

    function showNotification(message, type = 'success') {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.className = `notification ${type}`;
        notification.style.display = 'block';

        setTimeout(() => {
            notification.style.display = 'none';
        }, 5000);
    }

    function closeModalOnOverlay(event) {
        if (event.target.classList.contains('modal-overlay')) {
            event.target.classList.remove('active');
        }
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function jsQuote(value) {
        return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

</script>

</body>
</html>
