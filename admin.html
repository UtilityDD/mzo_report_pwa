<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <script src="mzo_theme.js?v=9"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Structure Management</title>
    <style>
        body { margin: 0; font: 13px/1.5 var(--mzo-font); background: var(--mzo-bg); color: var(--mzo-text); }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 28px 72px; }
        .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
        .header p { margin: 3px 0 0; font-size: 13px; color: var(--mzo-muted); }
        .main-content { padding: 0; }
        .structure-editor { display: flex; flex-direction: column; gap: 16px; }
        .section-card, .structure-card { background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
        .section-header, .structure-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 50px; padding: 9px 12px 9px 16px; border-bottom: 1px solid var(--mzo-border); font-size: 14px; font-weight: 600; }
        .section-body { padding: 0; }
        .structure-body { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
        .toolbar-inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12.5px; font-weight: 500; color: var(--mzo-text-2); margin-bottom: 4px; }
        .form-group input, .form-group textarea, .search-input {
          width: 100%; height: 32px; padding: 0 10px; font: 13px var(--mzo-font);
          border: 1px solid var(--mzo-border-strong); border-radius: 7px;
          background: var(--mzo-input); color: var(--mzo-text); outline: none;
        }
        .form-group textarea { height: auto; min-height: 110px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
        .form-group input:focus, .form-group textarea:focus, .search-input:focus { border-color: var(--mzo-accent); box-shadow: var(--mzo-ring); }
        input::placeholder, textarea::placeholder { color: var(--mzo-faint); }
        .search-input { width: 240px; }
        .btn {
          height: 32px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          font: 500 13px var(--mzo-font); white-space: nowrap; cursor: pointer;
          border-radius: 7px; border: 1px solid var(--mzo-border-strong);
          background: var(--mzo-surface); color: var(--mzo-text);
          transition: background-color .12s, border-color .12s;
        }
        .btn:hover { background: var(--mzo-hover); }
        .btn-primary, .btn-success { background: var(--mzo-fill); border-color: var(--mzo-fill); color: var(--mzo-on-fill); }
        .btn-primary:hover, .btn-success:hover { background: var(--mzo-fill-hover); border-color: var(--mzo-fill-hover); }
        .btn-danger { color: var(--mzo-bad); }
        .btn-danger:hover { background: var(--mzo-bad-soft); }
        .toolbar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0; margin-top: 8px; background: var(--mzo-bg); border-top: 1px solid var(--mzo-border); }
        .notification { padding: 10px 14px; margin: 0 0 16px; border-radius: 8px; font-weight: 500; display: none; }
        .notification.success { background: var(--mzo-ok-soft); color: var(--mzo-ok); }
        .notification.error { background: var(--mzo-bad-soft); color: var(--mzo-bad); }
        .loader { text-align: center; padding: 40px 16px; color: var(--mzo-muted); }
        .muted { color: var(--mzo-muted); }
        .users-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px 12px 12px 16px; background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 10px; color: var(--mzo-text-2); }
        .users-note b { font-weight: 600; color: var(--mzo-text); }
        a.btn { text-decoration: none; }
        @media (max-width: 760px) {
            .container { padding: 16px 14px 56px; }
            .section-header, .toolbar-inline { flex-direction: column; align-items: stretch; }
            .search-input { width: 100%; }
        }
</style>
  <link rel="stylesheet" href="mzo_theme.css?v=22" />
  <script src="/mzo_ui.js?v=19" defer></script>
</head>
<body>

<div class="container">
    <div class="header">
        <div><h1>Structure</h1><p>Estimate structures: materials and labour per structure</p></div>
    </div>

    <div id="notification" class="notification"></div>

    <div class="main-content">
        <div class="users-note" id="usersNote">
            <span>Portal users, their offices and permissions are managed in <b>Administration &rarr; Users</b>.</span>
            <a class="btn" id="usersLink" href="/admin_users.html?tab=users" target="mzo-admin">Open Users</a>
        </div>

        <div id="loader" class="loader">
            <p>Loading structures...</p>
        </div>
        <div id="structure-editor" class="structure-editor" style="display: none;">
            <!-- Structure cards will be rendered here by JavaScript -->
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" onclick="addNewStructure()">Add structure</button>
        <button class="btn btn-success" onclick="saveAllChanges()">Save changes</button>
    </div>
</div>

<script>
    const API_URL_GET = '/api/structures'; // Read structures from CSV via API
    const API_URL_UPDATE = '/api/structures/update'; // Update endpoint (saves to CSV)
    let structureData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadStructures();
        wireUsersLink();
    });

    async function loadStructures() {
        showLoader(true);
        try {
            const response = await fetch(API_URL_GET);
            if (!response.ok) throw new Error('Failed to fetch structures from the server.');
            const rawStructures = await response.json();

            // Materials / labour arrive as "index:qty;index:qty" (e.g. "1:1;3:1;5:3")
            const parsePairs = (v) => {
                if (Array.isArray(v)) return v;
                if (typeof v !== 'string' || !v) return [];
                return v.split(';')
                    .map(pair => {
                        const parts = pair.split(':');
                        if (parts.length < 2) return null;
                        return { index: parseInt(parts[0].trim(), 10), qty: parseFloat(parts[1].trim()) };
                    })
                    .filter(item => item && !isNaN(item.index) && !isNaN(item.qty));
            };

            // Convert API data to the JSON structure used by the editor
            structureData = rawStructures.map(s => {
                const materials = parsePairs(s.materials);
                const labour = parsePairs(s.labour);

                // Parse voltage - pipe separated "33 kV|11 kV"
                let voltage = [];
                if (typeof s.voltage === 'string') {
                    voltage = s.voltage.split('|').map(v => v.trim()).filter(v => v);
                } else if (Array.isArray(s.voltage)) {
                    voltage = s.voltage;
                }

                return {
                    id: s.id,
                    name: s.name,
                    description: s.description,
                    voltage: voltage,
                    materials: materials,
                    labour: labour
                };
            });

            renderEditor();

        } catch (error) {
            showNotification(error.message, 'error');
            console.error(error);
        } finally {
            showLoader(false);
        }
    }

    function renderEditor() {
        const editor = document.getElementById('structure-editor');
        editor.innerHTML = '';
        structureData.forEach((structure, index) => {
            const card = document.createElement('div');
            card.className = 'structure-card';
            card.dataset.index = index;
            card.innerHTML = `
                <div class="structure-header">
                    <span>ID: ${escapeHtml(structure.id)}</span>
                    <button class="btn btn-danger" onclick="deleteStructure(${index})">Delete</button>
                </div>
                <div class="structure-body">
                    <div class="form-group">
                        <label>ID (unique, no spaces)</label>
                        <input type="text" data-field="id" value="${escapeHtml(structure.id)}">
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" data-field="name" value="${escapeHtml(structure.name)}">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" data-field="description" value="${escapeHtml(structure.description)}">
                    </div>
                    <div class="form-group">
                        <label>Voltage (comma-separated)</label>
                        <input type="text" data-field="voltage" value="${escapeHtml(Array.isArray(structure.voltage) ? structure.voltage.join(', ') : (structure.voltage || ''))}">
                    </div>
                    <div class="form-group">
                        <label>Materials (JSON format)</label>
                        <textarea data-field="materials">${escapeHtml(JSON.stringify(structure.materials, null, 2))}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Labour (JSON format)</label>
                        <textarea data-field="labour">${escapeHtml(JSON.stringify(structure.labour, null, 2))}</textarea>
                    </div>
                </div>
            `;
            editor.appendChild(card);
        });
    }

    function addNewStructure() {
        const newStructure = {
            id: `new_structure_${Date.now()}`,
            name: "New Structure",
            description: "",
            voltage: [],
            materials: [],
            labour: []
        };
        structureData.unshift(newStructure); // Add to the beginning of the array
        renderEditor();
        window.scrollTo(0, 0);
    }

    function deleteStructure(index) {
        if (confirm('Are you sure you want to delete this structure? This action cannot be undone.')) {
            structureData.splice(index, 1);
            renderEditor();
        }
    }

    // Users live in Administration -> Users. Inside the admin window this page is the Structure tab's
    // frame, so the link switches tabs there; elsewhere it opens (or reuses) the admin window.
    function wireUsersLink() {
        const link = document.getElementById('usersLink');
        if (!link) return;
        let host = null;
        try {
            if (window.parent !== window && typeof window.parent.switchTab === 'function'
                && /\/admin_users\.html$/.test(window.parent.location.pathname)) host = window.parent;
        } catch (e) { host = null; }
        if (!host) return;
        link.removeAttribute('target');
        link.addEventListener('click', (e) => { e.preventDefault(); host.switchTab('usersTab'); });
    }

    async function saveAllChanges() {
        if (!collectDataFromUI()) {
            return; // Stop if data collection failed (e.g., invalid JSON)
        }

        showLoader(true, 'Saving...');
        try {
            const response = await fetch(API_URL_UPDATE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // Convert the UI data back to the CSV format before sending
                body: JSON.stringify(structureData.map(s => {
                    const materialsStr = s.materials.map(m => `${m.index}:${m.qty}`).join(';');
                    const labourStr = s.labour.map(l => `${l.index}:${l.qty}`).join(';');
                    return {
                        id: s.id,
                        name: s.name,
                        description: s.description,
                        voltage: Array.isArray(s.voltage) ? s.voltage.join('|') : '',
                        materials: materialsStr,
                        labour: labourStr
                    };
                }))
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || 'Server returned an error.');
            }

            showNotification(result.message, 'success');
            loadStructures(); // Reload to confirm changes

        } catch (error) {
            showNotification(`Save failed: ${error.message}`, 'error');
            console.error(error);
        } finally {
            showLoader(false);
        }
    }

    function collectDataFromUI() {
        const cards = document.querySelectorAll('.structure-card');
        const newStructureData = [];
        let allValid = true;

        cards.forEach(card => {
            const index = parseInt(card.dataset.index, 10);
            const structure = { ...structureData[index] }; // Create a copy

            // --- Text and simple inputs ---
            structure.id = card.querySelector('[data-field="id"]').value.trim();
            structure.name = card.querySelector('[data-field="name"]').value.trim();
            structure.description = card.querySelector('[data-field="description"]').value.trim();
            
            // --- Voltage array ---
            const voltageString = card.querySelector('[data-field="voltage"]').value;
            structure.voltage = typeof voltageString === 'string' ? voltageString.split(',').map(v => v.trim()).filter(Boolean) : [];

            // --- JSON Textareas (Materials & Labour) ---
            let field = 'materials';
            try {
                structure.materials = JSON.parse(card.querySelector('[data-field="materials"]').value);
                field = 'labour';
                structure.labour = JSON.parse(card.querySelector('[data-field="labour"]').value);
                newStructureData.push(structure);
            } catch (e) {
                allValid = false;
                alert(`Invalid JSON format in structure with ID '${structure.id}'. Please correct it before saving.\n\nError: ${e.message}`);
                card.querySelector(`[data-field="${field}"]`).style.border = '2px solid var(--mzo-bad)';
            }
        });

        if (allValid) {
            // The order might have changed, so we use the new array
            structureData = newStructureData;
            return true;
        }
        return false;
    }

    // --- UI Helpers ---
    function showLoader(show, text = 'Loading...') {
        const loader = document.getElementById('loader');
        const editor = document.getElementById('structure-editor');
        if (show) {
            loader.innerHTML = `<p>${text}</p>`;
            loader.style.display = 'block';
            editor.style.display = 'none';
        } else {
            loader.style.display = 'none';
            editor.style.display = 'block';
        }
    }

    function showNotification(message, type = 'success') {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.className = `notification ${type}`;
        notification.style.display = 'block';

        setTimeout(() => {
            notification.style.display = 'none';
        }, 5000);
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

</script>

</body>
</html>
