<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Losses · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Losses</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">Malda Zone</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="period" aria-label="Month"><option>Month</option></select></span>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <div class="ui-stat"><div class="k">AT&amp;C loss</div><div class="v" id="sAtc"><span class="ui-skel"></span></div><div class="s" id="sAtcS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Distribution loss</div><div class="v" id="sDist"><span class="ui-skel"></span></div><div class="s" id="sDistS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Collection efficiency</div><div class="v" id="sCe"><span class="ui-skel"></span></div><div class="s" id="sCeS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Energy input</div><div class="v" id="sIn"><span class="ui-skel"></span></div><div class="s" id="sInS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Energy collected</div><div class="v" id="sCol"><span class="ui-skel"></span></div><div class="s" id="sColS">&nbsp;</div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="trendTitle">Trend</h2>
        <div class="ui-seg" id="metric" role="group" aria-label="Metric">
          <button type="button" data-m="atc" aria-pressed="true">AT&amp;C loss</button>
          <button type="button" data-m="dist" aria-pressed="false">Distribution loss</button>
          <button type="button" data-m="ce" aria-pressed="false">Collection eff.</button>
        </div>
      </div>
      <div class="ui-panel-b"><div id="trend"><div class="ui-empty">Loading…</div></div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="tableTitle">Offices</h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="offices"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var FY_MONTHS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];

    // Sheet row names → offices. Regions and divisions use the sheet's total rows.
    var TREE = {
      Malda: { row: 'MALDA REGION', divs: {
        Malda: { row: 'Malda Div Total', cccs: ['RATHBARI', 'FULBARI', 'MOKDAMPUR', 'KALIACHAK', 'SUJAPUR', 'MOTHABARI', 'MATHURAPUR', 'BAISNABNAGAR', 'GOLAPGANJ'] },
        Gazole: { row: 'Gazole Div Total', cccs: ['OLD MALDA', 'AIHO', 'GAZOLE', 'BAMANGOLA', 'PANDUA'] },
        Chanchal: { row: 'Chanchal Div Total', cccs: ['SAMSI', 'PARANPUR', 'CHANCHAL', 'H.C. PUR', 'BHALUKA', 'MALATIPUR', 'KUSHIDA'] }
      }},
      Raiganj: { row: 'U/DINAJPUR REGION', divs: {
        Raiganj: { row: 'Raiganj Div Total', cccs: ['RAIGANJ', 'KALIAGANJ', 'HEMTABAD', 'BIRNAGAR', 'ITAHAR', 'KARANDEGHI'] },
        Islampur: { row: 'Islampur Div Total', cccs: ['DALKHOLA', 'KANKI', 'GOALPOKHAR', 'ISLAMPUR', 'CHOPRA'] }
      }},
      Balurghat: { row: 'D/DINAJPUR REGION', divs: {
        Balurghat: { row: 'Balurghat Div Total', cccs: ['BALURGHAT', 'HILI', 'KUMARGUNJ', 'TAPAN', 'PATIRAM'] },
        Buniadpur: { row: 'Buniadpur Div Total', cccs: ['BUNIADPUR', 'HARIRAMPUR', 'GANGARAMPUR', 'KUSHMUNDI'] }
      }}
    };
    var NAME = { 'H.C. PUR': 'Harishchandrapur', MOKDAMPUR: 'Mokdumpur', BAISNABNAGAR: 'Baishnabnagar', KARANDEGHI: 'Karandighi', KUMARGUNJ: 'Kumarganj', KUSHMUNDI: 'Kushmandi', BAMANGOLA: 'Bamongola', GOALPOKHAR: 'Goalpokhar' };
    function cccLabel(raw) { return NAME[raw] || UI.title(raw); }

    var data = {}, periods = [], metric = 'atc', targets = {}, asOn = '';
    function pctNum(v) { var x = parseFloat(String(v || '').replace('%', '')); return isFinite(x) ? x : null; }
    function num(v) { var x = parseFloat(v); return isFinite(x) ? x : null; }
    function pk(y, m) { return y * 100 + m; }
    function fy(y, m) { return m >= 4 ? y : y - 1; }

    function prepare(main, target) {
      data = {}; var seen = {};
      UI.csv(main).forEach(function (r) {
        var y = parseInt(r.YEAR, 10), m = parseInt(r.MONTH, 10), name = String(r.CCC || '').trim();
        if (!name || !y || !m) return;
        if (!asOn && r['Update On']) asOn = r['Update On'];
        var k = pk(y, m); seen[k] = 1;
        (data[name] || (data[name] = {}))[k] = {
          atc: pctNum(r['CUM. AT&C LOSS']), dist: pctNum(r['CUM. DIST. LOSS']), ce: pctNum(r['COLL. EFF.']),
          input: num(r['CUM. INPUT (MU)']), demand: num(r['CUM. DEMAND(MU)']), coll: num(r['CUM. COLLEC. (MU)'])
        };
      });
      periods = Object.keys(seen).map(Number).sort(function (a, b) { return b - a; });
      targets = {};
      UI.csv(target || '').forEach(function (r) { var n = String(r.CCC || '').trim(); if (n) targets[n] = { atc: pctNum(r['CUM. AT&C LOSS']), dist: pctNum(r['CUM. DIST. LOSS']) }; });
      var p = periods[0];
      $('meta').textContent = (p ? 'Cumulative to ' + MON[p % 100 - 1] + ' ' + Math.floor(p / 100) : '') + (asOn ? ' · Updated ' + UI.fmtDate(asOn) : '');
      $('period').innerHTML = periods.map(function (k) { return '<option value="' + k + '">' + MON[k % 100 - 1] + ' ' + Math.floor(k / 100) + '</option>'; }).join('');
      fillOffices();
    }

    function fillOffices() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', Object.keys(TREE), 'Malda Zone');
      var divs = reg ? Object.keys(TREE[reg].divs) : [];
      UI.fill('divisionFilter', divs, 'All divisions');
      $('divisionFilter').parentNode.hidden = !reg;
      var cccs = reg && div && TREE[reg].divs[div] ? TREE[reg].divs[div].cccs : [];
      UI.fill('cccFilter', cccs.map(function (c) { return { value: c, label: cccLabel(c) }; }), 'All CCCs');
      $('cccFilter').parentNode.hidden = !div;
    }

    // Current selection → { row, label, children: [{ row, label, drill }] }
    function selection() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      if (ccc && reg && div && TREE[reg] && TREE[reg].divs[div]) {
        // Scope locking may pin a canonical name (e.g. Mokdumpur); map it back to the sheet's row name.
        var raw = TREE[reg].divs[div].cccs.filter(function (c) { return c === ccc || cccLabel(c).toLowerCase() === ccc.toLowerCase(); })[0];
        if (raw) ccc = raw;
      } else ccc = '';
      if (ccc) {
        return { row: ccc, label: cccLabel(ccc), level: 'CCC', childLevel: 'CCCs in ' + div, children: TREE[reg].divs[div].cccs.map(function (c) { return { row: c, label: cccLabel(c), sel: c === ccc }; }) };
      }
      if (div) return { row: TREE[reg].divs[div].row, label: div + ' division', childLevel: 'CCCs', children: TREE[reg].divs[div].cccs.map(function (c) { return { row: c, label: cccLabel(c), drill: c }; }) };
      if (reg) return { row: TREE[reg].row, label: reg + ' region', childLevel: 'Divisions', children: Object.keys(TREE[reg].divs).map(function (d) { return { row: TREE[reg].divs[d].row, label: d, drill: d }; }) };
      return { row: 'MALDA ZONE', label: 'Malda Zone', childLevel: 'Regions', children: Object.keys(TREE).map(function (r) { return { row: TREE[r].row, label: r, drill: r }; }) };
    }

    function at(row, k) { return data[row] && data[row][k] || null; }
    function lastMarch(k) { var y = Math.floor(k / 100), m = k % 100; return pk(m >= 4 ? y : y - 1, 3); }
    function lastYear(k) { return k - 100; }
    function delta(now, then, lowerIsBetter) {
      if (now == null || then == null) return '<span class="ui-delta flat">—</span>';
      var d = now - then, good = lowerIsBetter ? d < 0 : d > 0;
      if (Math.abs(d) < 0.005) return '<span class="ui-delta flat">0.00</span>';
      return '<span class="ui-delta ' + (good ? 'ok' : 'bad') + '">' + (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2) + '</span>';
    }
    function fmtPct(v) { return v == null ? '—' : v.toFixed(2) + '%'; }

    function render() {
      var k = +$('period').value || periods[0], sel = selection(), cur = at(sel.row, k);
      var mar = at(sel.row, lastMarch(k)), ly = at(sel.row, lastYear(k)), tg = targets[sel.row] || {};
      var set = function (id, v, sub) { $(id).textContent = v; $(id + 'S').innerHTML = sub; };
      var monthLabel = MON[k % 100 - 1];
      set('sAtc', fmtPct(cur && cur.atc), (tg.atc != null ? 'Target ' + tg.atc.toFixed(2) + '% · ' : '') + 'vs Mar ' + delta(cur && cur.atc, mar && mar.atc, true));
      set('sDist', fmtPct(cur && cur.dist), (tg.dist != null ? 'Target ' + tg.dist.toFixed(2) + '% · ' : '') + 'vs Mar ' + delta(cur && cur.dist, mar && mar.dist, true));
      set('sCe', fmtPct(cur && cur.ce), 'vs ' + monthLabel + ' last year ' + delta(cur && cur.ce, ly && ly.ce, false));
      set('sIn', cur && cur.input != null ? UI.n(cur.input) + ' MU' : '—', cur && cur.demand != null ? 'Billed ' + UI.n(cur.demand) + ' MU' : '&nbsp;');
      set('sCol', cur && cur.coll != null ? UI.n(cur.coll) + ' MU' : '—', ly && ly.coll != null ? monthLabel + ' last year ' + UI.n(ly.coll) + ' MU' : '&nbsp;');

      // Trend: last three financial years, April → March
      var fyNow = fy(Math.floor(k / 100), k % 100), series = [];
      [fyNow - 2, fyNow - 1, fyNow].forEach(function (f) {
        var vals = FY_MONTHS.map(function (_, i) { var m = (i + 3) % 12 + 1, y = m >= 4 ? f : f + 1, v = at(sel.row, pk(y, m)); return v ? v[metric] : null; });
        if (vals.some(function (v) { return v != null; })) series.push({ label: 'FY ' + String(f).slice(2) + '–' + String(f + 1).slice(2), values: vals, strong: f === fyNow });
      });
      var mLabel = { atc: 'AT&C loss', dist: 'Distribution loss', ce: 'Collection efficiency' }[metric];
      $('trendTitle').textContent = mLabel + ' · ' + sel.label;
      UI.line('trend', { labels: FY_MONTHS, series: series, fmt: fmtPct, axis: function (v) { return v.toFixed(0) + '%'; }, zero: false, title: mLabel });

      // Offices one level down
      $('tableTitle').textContent = sel.childLevel + ' · ' + monthLabel + ' ' + Math.floor(k / 100);
      var rows = sel.children.map(function (c) {
        var v = at(c.row, k) || {}, m = at(c.row, lastMarch(k)) || {}, l = at(c.row, lastYear(k)) || {}, t = targets[c.row] || {};
        return { label: c.label, drill: c.drill, sel: c.sel, atc: v.atc, dMar: v.atc != null && m.atc != null ? v.atc - m.atc : null, dLy: v.atc != null && l.atc != null ? v.atc - l.atc : null, target: t.atc, dist: v.dist, ce: v.ce, input: v.input };
      });
      window.__rows = rows;
      var d2 = function (v) { return v == null ? '<span class="ui-muted">—</span>' : '<span class="ui-delta ' + (Math.abs(v) < 0.005 ? 'flat' : v > 0 ? 'bad' : 'ok') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '</span>'; };
      UI.table('offices', {
        rows: rows, sort: { key: 'atc', dir: 'desc' }, count: false, empty: 'No data for this month.',
        selected: function (r) { return r.sel; },
        columns: [
          { key: 'label', label: 'Office', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
          { key: 'atc', label: 'AT&C loss', num: true, fmt: fmtPct },
          { key: 'dMar', label: 'vs Mar', num: true, fmt: d2 },
          { key: 'dLy', label: 'vs last year', num: true, fmt: d2, hideSm: true },
          { key: 'target', label: 'Target', num: true, fmt: fmtPct, hideSm: true },
          { key: 'dist', label: 'Dist. loss', num: true, fmt: fmtPct },
          { key: 'ce', label: 'Coll. eff.', num: true, fmt: fmtPct, hideSm: true },
          { key: 'input', label: 'Input (MU)', num: true, fmt: function (v) { return v == null ? '—' : UI.n(v); }, hideSm: true }
        ],
        onRow: function (r) { if (r.drill) drill(r.drill); }
      });
    }

    function drill(name) {
      if (!$('regionFilter').value) $('regionFilter').value = name;
      else if (!$('divisionFilter').value) $('divisionFilter').value = name;
      else $('cccFilter').value = name;
      fillOffices(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
      render();
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); });
        render();
      });
    });
    $('period').addEventListener('change', render);
    $('metric').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      metric = b.getAttribute('data-m');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('losses.csv', [{ key: 'label', label: 'Office' }, { key: 'atc', label: 'AT&C loss %' }, { key: 'dMar', label: 'Change vs March (pts)' }, { key: 'dLy', label: 'Change vs last year (pts)' }, { key: 'target', label: 'Target %' }, { key: 'dist', label: 'Distribution loss %' }, { key: 'ce', label: 'Collection efficiency %' }, { key: 'input', label: 'Input (MU)' }], window.__rows || []);
    });

    // Loss sheet is pasted by hand; always revalidate so a same-day paste shows (docs/reports.md).
    function load(force) {
      var hub = window.mzoDataHub, b = $('refreshBtn');
      if (force) b.classList.add('spin');
      return Promise.all([hub._peek('CACHE_LOSS'), hub._peek('CACHE_LOSS_TARGET')]).then(function (c) {
        if (c[0] && !force) { prepare(c[0], c[1]); scopeLock(); render(); }
        return Promise.all([hub.waitForDataset('CACHE_LOSS', { forceCheck: true }).catch(function () {}), hub.waitForDataset('CACHE_LOSS_TARGET', { forceCheck: true }).catch(function () {})])
          .then(function () { return Promise.all([hub._peek('CACHE_LOSS'), hub._peek('CACHE_LOSS_TARGET')]); })
          .then(function (f) { if (f[0] && (force || f[0] !== c[0] || f[1] !== c[1])) { prepare(f[0], f[1]); scopeLock(); render(); } else if (!f[0] && !c[0]) { $('meta').textContent = 'Could not load data'; $('offices').innerHTML = $('trend').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } });
      }).then(function () { b.classList.remove('spin'); });
    }
    // First paint: pin the login scope, then open ?region= / ?division= / ?ccc= (the deepest one wins).
    var locked = false;
    function scopeLock() {
      if (locked) return; locked = true;
      if (UI.lockScope()) fillOffices();
      var params = new URLSearchParams(location.search);
      var want = function (k) { return String(params.get(k) || '').trim().toLowerCase().replace(/\s+(division|region)$/, ''); };
      var wr = want('region'), wd = want('division'), wc = want('ccc'), hit = null;
      Object.keys(TREE).forEach(function (r) {
        if (wr && !hit && UI.regionName(wr) === r) hit = { r: r };
        Object.keys(TREE[r].divs).forEach(function (d) {
          if (wd && d.toLowerCase() === wd && (!hit || !hit.d)) hit = { r: r, d: d };
          TREE[r].divs[d].cccs.forEach(function (c) { if (wc && (c.toLowerCase() === wc || cccLabel(c).toLowerCase() === wc)) hit = { r: r, d: d, c: c }; });
        });
      });
      if (hit) {
        [['regionFilter', hit.r], ['divisionFilter', hit.d], ['cccFilter', hit.c]].forEach(function (x) {
          if (x[1] && !$(x[0]).disabled) $(x[0]).value = x[1];
          fillOffices();
        });
      }
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
