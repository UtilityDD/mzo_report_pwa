<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loss analysis · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=23" />
  <script src="/mzo_ui.js?v=20" defer></script>
  <script src="/mzo_data_hub.js?v=93" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=20" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-kpis .ui-stat { padding: 13px 14px 14px; text-align: left; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .loss-chart-box { padding: 16px 16px 20px; border-bottom: 1px solid var(--mzo-border); }
    .loss-chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .loss-chart-head h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--mzo-text); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Losses<span class="ui-badge ui-date" id="asOn">…</span></h1>
        <p id="meta" style="display:none"></p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <div class="ui-seg" id="topMetric" role="group" aria-label="Metric">
          <button type="button" data-m="atc" aria-pressed="true">AT&amp;C</button>
          <button type="button" data-m="dist" aria-pressed="false">Dist. loss</button>
          <button type="button" data-m="ce" aria-pressed="false">Coll. eff.</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search CCC or division" autocomplete="off" aria-label="Search offices" title="Search CCCs or divisions" /></label>
          <span class="ui-select"><select id="period" aria-label="Month"><option>Month</option></select></span>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">Malda Zone</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Metric" id="fMetric"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Performance vs March" id="fPerf"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Loss intensity" id="fBand"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats cl-kpis" id="kpis" aria-label="Summary">
          <button type="button" class="ui-stat" data-m="atc"><div class="k">AT&amp;C loss</div><div class="v" id="sAtc"><span class="ui-skel"></span></div><div class="s" id="sAtcS">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-m="dist"><div class="k">Distribution loss</div><div class="v" id="sDist"><span class="ui-skel"></span></div><div class="s" id="sDistS">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-m="ce"><div class="k">Collection efficiency</div><div class="v" id="sCe"><span class="ui-skel"></span></div><div class="s" id="sCeS">&nbsp;</div></button>
          <div class="ui-stat"><div class="k">Energy input</div><div class="v" id="sIn"><span class="ui-skel"></span></div><div class="s" id="sInS">&nbsp;</div></div>
          <div class="ui-stat"><div class="k">Energy collected</div><div class="v" id="sCol"><span class="ui-skel"></span></div><div class="s" id="sColS">&nbsp;</div></div>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
            <div id="scopeTrail" class="ui-scope-trail-host"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="chartContainer" class="loss-chart-box" hidden>
            <div class="loss-chart-head">
              <h3 id="trendTitle">Trend</h3>
            </div>
            <div id="trendChart"></div>
          </div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var FY_MONTHS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];

    // Sheet row names → offices. Regions and divisions use the sheet's total rows.
    var TREE = {
      Malda: { row: 'MALDA REGION', divs: {
        Malda: { row: 'Malda Div Total', cccs: ['RATHBARI', 'FULBARI', 'MOKDAMPUR', 'KALIACHAK', 'SUJAPUR', 'MOTHABARI', 'MATHURAPUR', 'BAISNABNAGAR', 'GOLAPGANJ'] },
        Gazole: { row: 'Gazole Div Total', cccs: ['OLD MALDA', 'AIHO', 'GAZOLE', 'BAMANGOLA', 'PANDUA'] },
        Chanchal: { row: 'Chanchal Div Total', cccs: ['SAMSI', 'PARANPUR', 'CHANCHAL', 'H.C. PUR', 'BHALUKA', 'MALATIPUR', 'KUSHIDA'] }
      }},
      'Uttar Dinajpur': { row: 'U/DINAJPUR REGION', divs: {
        Raiganj: { row: 'Raiganj Div Total', cccs: ['RAIGANJ', 'KALIAGANJ', 'HEMTABAD', 'BIRNAGAR', 'ITAHAR', 'KARANDEGHI'] },
        Islampur: { row: 'Islampur Div Total', cccs: ['DALKHOLA', 'KANKI', 'GOALPOKHAR', 'ISLAMPUR', 'CHOPRA'] }
      }},
      'Dakshin Dinajpur': { row: 'D/DINAJPUR REGION', divs: {
        Balurghat: { row: 'Balurghat Div Total', cccs: ['BALURGHAT', 'HILI', 'KUMARGUNJ', 'TAPAN', 'PATIRAM'] },
        Buniadpur: { row: 'Buniadpur Div Total', cccs: ['BUNIADPUR', 'HARIRAMPUR', 'GANGARAMPUR', 'KUSHMUNDI'] }
      }}
    };
    var NAME = { 'H.C. PUR': 'Harishchandrapur', MOKDAMPUR: 'Mokdumpur', BAISNABNAGAR: 'Baishnabnagar', KARANDEGHI: 'Karandighi', KUMARGUNJ: 'Kumarganj', KUSHMUNDI: 'Kushmandi', BAMANGOLA: 'Bamongola', GOALPOKHAR: 'Goalpokhar' };
    function cccLabel(raw) {
      var c = window.MzoOffices && window.MzoOffices.parseCccName(raw);
      return c && c.level === 'ccc' ? c.ccc : NAME[raw] || UI.title(raw);
    }

    var data = {}, periods = [], metric = 'atc', targets = {}, asOn = '';
    function pctNum(v) { var x = parseFloat(String(v || '').replace('%', '')); return isFinite(x) ? x : null; }
    function pk(y, m) { return y * 100 + m; }
    function fy(y, m) { return m >= 4 ? y : y - 1; }

    // main / target: uniform rows of schema/loss_report.json and schema/loss_targets.json, unscoped
    // (the sheet holds zone, region, division-total and CCC rows; the selects pin the login's office).
    function prepare(main, target) {
      data = {}; var seen = {};
      asOn = main.first('update_on') || ''; // one cell of the sheet (J2)
      main.all.forEach(function (r) {
        var y = Math.trunc(r.year), m = Math.trunc(r.month), name = r.ccc;
        if (!name || !y || !m) return;
        var k = pk(y, m); seen[k] = 1;
        (data[name] || (data[name] = {}))[k] = {
          atc: pctNum(r.cum_at_c_loss), dist: pctNum(r.cum_dist_loss), ce: pctNum(r.coll_eff),
          input: r.cum_input_mu, demand: r.cum_demand_mu, coll: r.cum_collec_mu
        };
      });
      periods = Object.keys(seen).map(Number).sort(function (a, b) { return b - a; });
      targets = {};
      (target ? target.all : []).forEach(function (r) { if (r.ccc) targets[r.ccc] = { atc: pctNum(r.cum_at_c_loss), dist: pctNum(r.cum_dist_loss) }; });
      var p = periods[0];
      var metaEl = $('meta');
      if (metaEl) metaEl.textContent = (p ? 'Cumulative to ' + MON[p % 100 - 1] + ' ' + Math.floor(p / 100) : '') + (asOn ? ' · Updated ' + UI.fmtDate(asOn) : '');
      var asOnEl = $('asOn');
      if (asOnEl) asOnEl.textContent = asOn ? UI.fmtDate(asOn) : (p ? MON[p % 100 - 1] + ' ' + Math.floor(p / 100) : '…');
      $('period').innerHTML = periods.map(function (k) { return '<option value="' + k + '">' + MON[k % 100 - 1] + ' ' + Math.floor(k / 100) + '</option>'; }).join('');
      fillOffices();
    }

    function fillOffices() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value;
      UI.fill('regionFilter', Object.keys(TREE), 'Malda Zone');
      var divs = reg ? Object.keys(TREE[reg].divs) : [];
      UI.fill('divisionFilter', divs, 'All divisions');
      $('divisionFilter').parentNode.hidden = !reg;
      var cccs = reg && div && TREE[reg].divs[div] ? TREE[reg].divs[div].cccs : [];
      UI.fill('cccFilter', cccs.map(function (c) { return { value: c, label: cccLabel(c) }; }), 'All CCCs');
      $('cccFilter').parentNode.hidden = !div;
    }

    var TABS = [
      ['trend', 'Trend Chart'],
      ['region', 'Region'],
      ['division', 'Division'],
      ['ccc', 'CCC'],
      ['targets', 'Target Gap'],
      ['energy', 'Energy Balance']
    ];
    var tab = 'trend', renderedTab = '', lastTable = null, lastRows = null, f = { q: '', perf: '', band: '' }, scope = null;
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function allRegions() {
      return Object.keys(TREE).map(function (r) {
        return { row: TREE[r].row, label: r, name: r, level: 'Region' };
      });
    }

    function allDivisions() {
      var list = [];
      var selReg = $('regionFilter').value;
      Object.keys(TREE).forEach(function (r) {
        if (selReg && r !== selReg) return;
        Object.keys(TREE[r].divs).forEach(function (d) {
          list.push({ row: TREE[r].divs[d].row, label: d, name: d, region: r, level: 'Division' });
        });
      });
      return list;
    }

    function allCccs() {
      var list = [];
      var selReg = $('regionFilter').value, selDiv = $('divisionFilter').value;
      Object.keys(TREE).forEach(function (r) {
        if (selReg && r !== selReg) return;
        Object.keys(TREE[r].divs).forEach(function (d) {
          if (selDiv && d !== selDiv) return;
          TREE[r].divs[d].cccs.forEach(function (c) {
            list.push({ row: c, label: cccLabel(c), name: cccLabel(c), ccc: c, region: r, division: d, level: 'CCC' });
          });
        });
      });
      return list;
    }

    // Current selection → { row, label, children: [{ row, label, drill }] }
    function selection() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      if (ccc && reg && div && TREE[reg] && TREE[reg].divs[div]) {
        var raw = TREE[reg].divs[div].cccs.filter(function (c) { return c === ccc || cccLabel(c).toLowerCase() === ccc.toLowerCase(); })[0];
        if (raw) ccc = raw;
      } else ccc = '';
      if (ccc) {
        return { row: ccc, label: cccLabel(ccc), level: 'CCC', childLevel: 'CCCs in ' + div, children: TREE[reg].divs[div].cccs.map(function (c) { return { row: c, label: cccLabel(c), sel: c === ccc, region: reg, division: div, level: 'CCC' }; }) };
      }
      if (div) return { row: TREE[reg].divs[div].row, label: div + ' division', level: 'Division', childLevel: 'CCCs in ' + div, children: TREE[reg].divs[div].cccs.map(function (c) { return { row: c, label: cccLabel(c), drill: c, region: reg, division: div, level: 'CCC' }; }) };
      if (reg) return { row: TREE[reg].row, label: reg + ' region', level: 'Region', childLevel: 'Divisions in ' + reg, children: Object.keys(TREE[reg].divs).map(function (d) { return { row: TREE[reg].divs[d].row, label: d, drill: d, region: reg, division: d, level: 'Division' }; }) };
      return { row: 'MALDA ZONE', label: 'Malda Zone', level: 'Zone', childLevel: 'Regions in Malda Zone', children: Object.keys(TREE).map(function (r) { return { row: TREE[r].row, label: r, drill: r, region: r, level: 'Region' }; }) };
    }

    function at(row, k) { return data[row] && data[row][k] || null; }
    function lastMarch(k) { var y = Math.floor(k / 100), m = k % 100; return pk(m >= 4 ? y : y - 1, 3); }
    function lastYear(k) { return k - 100; }
    function delta(now, then, lowerIsBetter) {
      if (now == null || then == null) return '<span class="ui-delta flat">—</span>';
      var d = now - then, good = lowerIsBetter ? d < 0 : d > 0;
      if (Math.abs(d) < 0.005) return '<span class="ui-delta flat">0.00</span>';
      return '<span class="ui-delta ' + (good ? 'ok' : 'bad') + '">' + (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2) + '</span>';
    }
    function deltaNum(v) {
      if (v == null) return '<span class="ui-muted">—</span>';
      var good = v < 0;
      return '<span class="ui-delta ' + (Math.abs(v) < 0.005 ? 'flat' : good ? 'ok' : 'bad') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '</span>';
    }
    function deltaText(now, then, lowerIsBetter) {
      if (now == null || then == null) return '—';
      var d = now - then, good = lowerIsBetter ? d < 0 : d > 0;
      return (d > 0 ? '+' : '') + d.toFixed(2) + ' pts (' + (good ? 'Improved' : 'Deteriorated') + ')';
    }
    function fmtPct(v) { return v == null ? '—' : v.toFixed(2) + '%'; }

    function renderFacets() {
      // Metric facet
      var mOpts = [
        { value: 'atc', label: 'AT&C loss', dot: metric === 'atc' ? 'ok' : '' },
        { value: 'dist', label: 'Distribution loss', dot: metric === 'dist' ? 'ok' : '' },
        { value: 'ce', label: 'Collection efficiency', dot: metric === 'ce' ? 'ok' : '' }
      ];
      UI.facet('fMetric', mOpts, metric, function (v) {
        if (!v) return;
        metric = v;
        syncMetricButtons();
        render();
      });

      // Performance vs March facet (calculated on all CCCs)
      var k = +$('period').value || periods[0];
      var cccs = allCccs();
      var cBetter = 0, cWorse = 0;
      cccs.forEach(function (c) {
        var cur = at(c.row, k), mar = at(c.row, lastMarch(k));
        if (cur && mar && cur.atc != null && mar.atc != null) {
          if (cur.atc <= mar.atc) cBetter++; else cWorse++;
        }
      });
      var perfOpts = [
        { value: 'better', label: 'Improved vs March', count: cBetter, dot: 'ok' },
        { value: 'worse', label: 'Deteriorated vs March', count: cWorse, dot: 'warn' }
      ];
      UI.facet('fPerf', perfOpts, f.perf, function (v) { f.perf = v; render(); });

      // Loss intensity band facet
      var bLow = 0, bMid = 0, bHigh = 0;
      cccs.forEach(function (c) {
        var cur = at(c.row, k);
        if (cur && cur.atc != null) {
          if (cur.atc < 15) bLow++;
          else if (cur.atc <= 25) bMid++;
          else bHigh++;
        }
      });
      var bandOpts = [
        { value: 'low', label: '< 15% (Low loss)', count: bLow, dot: 'ok' },
        { value: 'mid', label: '15% – 25% (Moderate)', count: bMid },
        { value: 'high', label: '> 25% (High hotspot)', count: bHigh, dot: 'warn' }
      ];
      UI.facet('fBand', bandOpts, f.band, function (v) { f.band = v; render(); });

      var active = (f.q ? 1 : 0) + (f.perf ? 1 : 0) + (f.band ? 1 : 0) +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active);
    }

    function syncMetricButtons() {
      [].forEach.call(document.querySelectorAll('#topMetric button, #kpis .ui-stat[data-m]'), function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-m') === metric));
      });
    }

    function render() {
      renderFacets();
      syncMetricButtons();

      var k = +$('period').value || periods[0], sel = selection(), cur = at(sel.row, k);
      var mar = at(sel.row, lastMarch(k)), ly = at(sel.row, lastYear(k)), tg = targets[sel.row] || {};
      var setVal = function (id, v, sub) { var el = $(id); if (el) el.textContent = v; var sEl = $(id + 'S'); if (sEl) sEl.innerHTML = sub; };
      var monthLabel = MON[k % 100 - 1] + ' ' + Math.floor(k / 100);

      setVal('sAtc', fmtPct(cur && cur.atc), (tg.atc != null ? 'Target ' + tg.atc.toFixed(2) + '% · ' : '') + 'vs Mar ' + delta(cur && cur.atc, mar && mar.atc, true));
      setVal('sDist', fmtPct(cur && cur.dist), (tg.dist != null ? 'Target ' + tg.dist.toFixed(2) + '% · ' : '') + 'vs Mar ' + delta(cur && cur.dist, mar && mar.dist, true));
      setVal('sCe', fmtPct(cur && cur.ce), 'vs ' + MON[k % 100 - 1] + ' last year ' + delta(cur && cur.ce, ly && ly.ce, false));
      setVal('sIn', cur && cur.input != null ? UI.n(cur.input) + ' MU' : '—', cur && cur.demand != null ? 'Billed ' + UI.n(cur.demand) + ' MU' : '&nbsp;');
      setVal('sCol', cur && cur.coll != null ? UI.n(cur.coll) + ' MU' : '—', ly && ly.coll != null ? MON[k % 100 - 1] + ' last year ' + UI.n(ly.coll) + ' MU' : '&nbsp;');

      var cccsList = allCccs();
      var divsList = allDivisions();
      tab = UI.snapOfficeTab(tab);
      $('tabs').innerHTML = UI.filterOfficeTabs(TABS).map(function (t) {
        var extra = '';
        if (t[0] === 'ccc') extra = '<small>' + cccsList.length + '</small>';
        else if (t[0] === 'division') extra = '<small>' + divsList.length + '</small>';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');
      UI.scopeTrail('scopeTrail');

      var mLabel = { atc: 'AT&C loss', dist: 'Distribution loss', ce: 'Collection efficiency' }[metric];
      var filterDesc = [f.perf ? (f.perf === 'better' ? 'Improved vs March' : 'Deteriorated vs March') : '', f.band ? (f.band === 'low' ? '<15% loss' : f.band === 'mid' ? '15-25% loss' : '>25% loss') : '', f.q ? 'Search: "' + f.q + '"' : ''].filter(Boolean).join(' · ');
      var regVal = $('regionFilter').value, divVal = $('divisionFilter').value;
      var officeScope = divVal ? divVal + ' division' : regVal ? regVal + ' region' : 'Malda Zone';

      $('hint').textContent = [filterDesc ? 'Showing ' + filterDesc : '',
        tab === 'trend' ? mLabel + ' multi-year trend for ' + sel.label + ' (April to March).'
          : tab === 'targets' ? 'WBSEDCL approved target variance and gaps for ' + monthLabel + '.'
          : ['region', 'division', 'ccc'].indexOf(tab) !== -1 ? '' : 'Energy flow accounting in Million Units (MU): Input, Billing, Collection and Losses.'].filter(Boolean).join(' · ');

      renderReportHead(k, sel, mLabel, monthLabel);
      renderTab(k, sel, mLabel, monthLabel);
    }

    var currentActiveFilters = [];
    function renderReportHead(k, sel, mLabel, monthLabel) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';

      $('rhTitle').textContent = tabLabel + ' · ' + mLabel + ' (' + monthLabel + ')';

      var officeScope = sel.label || 'Malda Zone';
      $('rhCount').innerHTML = 'Scope: <b>' + UI.esc(officeScope) + '</b> · ' + UI.esc(monthLabel);

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('regionFilter').value && !$('regionFilter').disabled) {
        currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { set('regionFilter', ''); set('divisionFilter', ''); set('cccFilter', ''); fillOffices(); } });
      }
      if ($('divisionFilter').value && !$('divisionFilter').disabled) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { set('divisionFilter', ''); set('cccFilter', ''); fillOffices(); } });
      }
      if ($('cccFilter').value && !$('cccFilter').disabled) {
        currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { set('cccFilter', ''); fillOffices(); } });
      }
      if (f.perf) {
        currentActiveFilters.push({ label: 'Performance', value: f.perf === 'better' ? 'Improved vs Mar' : 'Deteriorated vs Mar', clear: function () { f.perf = ''; } });
      }
      if (f.band) {
        currentActiveFilters.push({ label: 'Loss band', value: f.band === 'low' ? '<15% loss' : f.band === 'mid' ? '15–25% loss' : '>25% loss', clear: function () { f.band = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');

    function set(id, v) { if (!$(id).disabled) $(id).value = v; }

    function drill(level, name) {
      if (level === 'region') {
        set('regionFilter', name);
        set('divisionFilter', '');
        set('cccFilter', '');
        tab = 'division';
      } else if (level === 'division') {
        if (!$('regionFilter').value) {
          Object.keys(TREE).forEach(function (r) {
            if (TREE[r].divs[name]) set('regionFilter', r);
          });
        }
        set('divisionFilter', name);
        set('cccFilter', '');
        tab = 'ccc';
      } else {
        set('cccFilter', $('cccFilter').value === name ? '' : name);
      }
      fillOffices();
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
      render();
    }

    function clearAll() {
      f.q = ''; f.perf = ''; f.band = '';
      $('q').value = '';
      SELECTS.forEach(function (id) { set(id, ''); });
      fillOffices();
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
      tab = scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region';
      render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillOffices(); ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); });
        render();
      });
    });
    $('period').addEventListener('change', render);
    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      if (f.q && tab !== 'ccc' && tab !== 'targets' && tab !== 'energy' && tab !== 'division') tab = 'ccc';
      render();
    }, 180));

    $('topMetric').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      metric = b.getAttribute('data-m');
      syncMetricButtons();
      render();
    });
    $('kpis').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-stat[data-m]'); if (!b) return;
      metric = b.getAttribute('data-m');
      syncMetricButtons();
      render();
    });
    $('tabs').addEventListener('click', function (e) {
      var t = e.target.closest('.ui-drill-tab'); if (t) { tab = t.getAttribute('data-t'); render(); }
    });

    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = ['*Losses — ' + lastTable.title + '*', lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
    });
    $('exportBtn').addEventListener('click', function () {
      if (!lastTable) return;
      UI.exportCsv('losses-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
    });

    // Loss sheet is pasted by hand; always revalidate so a same-day paste shows (docs/reports.md).
    // Paint from the cached rows at once, again when newer rows (or the targets) arrive.
    var ROWS = { scope: false, forceCheck: true }, main = null, target = null;
    function paint() { if (!main) return; prepare(main, target); scopeLock(); render(); }
    function load() {
      MzoRows.load('loss_report', function (t, info) {
        if (t) { main = t; paint(); }
        else if (info && info.error && !main) {
          $('meta').textContent = 'Could not load data';
          $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
        }
      }, ROWS);
      MzoRows.load('loss_targets', function (t) { if (t) { target = t; paint(); } }, ROWS);
    }
    function refresh() {
      var b = $('refreshBtn');
      b.classList.add('spin');
      Promise.all([MzoRows.get('loss_report', ROWS).catch(function () { return null; }), MzoRows.get('loss_targets', ROWS).catch(function () { return null; })])
        .then(function (r) { if (r[0]) main = r[0]; if (r[1]) target = r[1]; paint(); })
        .then(function () { b.classList.remove('spin'); }, function () { b.classList.remove('spin'); });
    }

    // First paint: pin the login scope, then open ?region= / ?division= / ?ccc= (the deepest one wins).
    var locked = false;
    function scopeLock() {
      if (locked) return; locked = true;
      scope = UI.lockScope();
      if (scope) fillOffices();
      var params = new URLSearchParams(location.search);
      var want = function (k) { return String(params.get(k) || '').trim().toLowerCase().replace(/\s+(division|region)$/, ''); };
      var wr = want('region'), wd = want('division'), wc = want('ccc'), hit = null;
      Object.keys(TREE).forEach(function (r) {
        if (wr && !hit && UI.regionName(wr) === r) hit = { r: r };
        Object.keys(TREE[r].divs).forEach(function (d) {
          if (wd && d.toLowerCase() === wd && (!hit || !hit.d)) hit = { r: r, d: d };
          TREE[r].divs[d].cccs.forEach(function (c) { if (wc && (c.toLowerCase() === wc || cccLabel(c).toLowerCase() === wc)) hit = { r: r, d: d, c: c }; });
        });
      });
      if (hit) {
        [['regionFilter', hit.r], ['divisionFilter', hit.d], ['cccFilter', hit.c]].forEach(function (x) {
          if (x[1] && !$(x[0]).disabled) $(x[0]).value = x[1];
          fillOffices();
        });
      }
      if (params.get('metric')) {
        var m = params.get('metric').toLowerCase();
        if (m === 'atc' || m === 'dist' || m === 'ce') metric = m;
      }
      if (params.get('period')) {
        var p = +params.get('period');
        if (periods.indexOf(p) !== -1) $('period').value = p;
      }
      if (TABS.some(function (t) { return t[0] === params.get('tab'); })) {
        tab = params.get('tab');
      } else {
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
        else if (scope && scope.level === 'region') tab = 'division';
        else tab = 'region';
      }
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    $('refreshBtn').addEventListener('click', refresh);
    load();
  });
  </script>
</body>
</html>
