<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter utilization · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .mono { font-family: var(--mzo-mono); font-size: 12.5px; letter-spacing: .02em; }
    #makeHist .row { grid-template-columns: 150px minmax(0, 1fr) 64px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Meter utilization</h1>
        <p id="meta">Loading meters…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="phase" role="group" aria-label="Phase">
          <button type="button" data-p="" aria-pressed="true">All</button>
          <button type="button" data-p="1PH" aria-pressed="false">1-phase</button>
          <button type="button" data-p="3PH" aria-pressed="false">3-phase</button>
        </div>
        <button type="button" class="ui-btn sm" id="exportSummary"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Meter serial number (Enter to look up)" autocomplete="off" spellcheck="false" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="typeFilter" aria-label="Meter type"><option value="">All meter types</option><option value="smart">Smart only</option><option value="normal">Non-smart only</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
      <div class="ui-stat"><div class="k">Issued</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k"><span class="ui-dot ok"></span>Used for new connections</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k"><span class="ui-dot ok"></span>Used for replacement</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k"><span class="ui-dot warn"></span>In hand</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>In hand for</h2></div>
          <div class="ui-panel-b"><div id="ageHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>In hand by make</h2></div>
          <div class="ui-panel-b"><div id="makeHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Meters in hand <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmzya-jypjfu9nN5QWuRJ6sbIgrqQ7Wa1eAx6Wfoepft2UpNwBC4a_rd4uJ6VpLhNu7FnjDBa8mJxW/pub?output=csv';
    var GIDS = ['1335293243', '1053803476', '1638328510', '329630218'];
    var METER_PARSED_KEY = 'CACHE_METER_PARSED_v1';
    var METER_RAW_KEYS = ['CACHE_METER_ERP', 'CACHE_METER_MASTER', 'CACHE_METER_CRM', 'CACHE_METER_ISU'];
    var REGION_LABEL = { 'MALDA': 'Malda', 'UTTAR DINAJPUR': 'Raiganj', 'DAKSHIN DINAJPUR': 'Balurghat' };
    var STATUS = { 'utilized-nsc': { label: 'New connection', cls: 'ok' }, 'utilized-replacement': { label: 'Replacement', cls: 'ok' }, 'meter-in-hand': { label: 'In hand', cls: 'warn' } };
    var AGE = [
      { key: 'a0', label: 'Under a month', max: 30 }, { key: 'a1', label: '1–3 months', max: 91 }, { key: 'a2', label: '3–6 months', max: 182 },
      { key: 'a3', label: '6–12 months', max: 365 }, { key: 'a4', label: 'Over a year', max: Infinity }, { key: 'an', label: 'Date unknown', max: -1 }
    ];

    // Office codes → names (ERP cost centres). Division "booking" codes 1111111… map to the division.
    var OFFICES = '6610000 MALDA REGION|1111111 MALDA DIV.|6611000 MALDA DIVISION|6611101 MANIKCHAK CCC|6611102 GOLAPGANJ CCC|6611103 BAISHNABNAGAR CCC|6611104 KALIACHAK CCC|6611105 MOTHABARI CCC|6611106 SUJAPUR CCC|6611107 RATHBARI CCC|6611108 FULBARI CCC|6611109 MOKDUMPUR CCC|2222222 CHANCHAL DIV.|6612000 CHANCHAL DIVISION|6612101 BHALUKA CCC|6612102 SAMSI CCC|6612103 PARANPUR CCC|6612104 CHANCHAL CCC|6612105 MALATIPUR CCC|6612106 HARISHCHANDRAPUR CCC|6612107 KUSHIDA CCC|3333333 GAZOLE DIV.|6613000 GAZOLE DIVISION|6613101 GAZOL CCC|6613102 AIHO. CCC|6613103 PANDUA CCC|6613104 BAMONGOLA CCC|6613105 OLD MALDA CCC|6620000 UTTAR DINAJPUR REGION|4444444 RAIGANJ  DIV.|6621000 RAIGANJ  DIVISION|6621101 ITAHAR CCC|6621102 HEMTABAD CCC|6621103 KALIYAGANJ CCC|6621104 RAIGANJ CCC|6621105 BIRNAGAR CCC|6621106 KARANDIGHI CCC|5555555 ISLAMPUR DIV.|6622000 ISLAMPUR DIVISION|6622101 ISLAMPUR CCC|6622102 CHOPRA CCC|6622103 DALKHOLA CCC|6622104 GOALPOKHER CCC|6622105 KANKI CCC|6630000 DAKSHIN DINAJPUR REGION|6666666 BALURGHAT DIV.|6631000 BALURGHAT DIVISION|6631101 BALURGHAT CCC|6631102 TAPAN CCC|6631103 KUMARGANJ CCC|6631104 HILI CCC|6631105 PATIRAM CCC|7777777 BUNIADPUR DIV.|6632000 BUNIADPUR DIVISION|6632101 BUNIADPUR CCC|6632102 KUSMANDI CCC|6632103 HARIRAMPUR CCC|6632104 GANGARAMPUR CCC';
    var officeDetails = {};

    var allERP = [], masterLookup = {}, replacementLookup = {}, dates = { erp: '', rep: '', nsc: '' };
    var f = { q: '', phase: '', type: '', age: '', make: '' }, level = 'region', scope = null;

    /* ---------- hierarchy (same rules the page has always used) ---------- */
    function canonicalDivisionName(raw) {
      var s = String(raw == null ? '' : raw).trim();
      if (!s || /^unknown$/i.test(s)) return s;
      if (window.MzoScope && window.MzoScope.divisionNameOf) { var c = window.MzoScope.divisionNameOf(s); if (c) return c; }
      return s.replace(/\s+/g, ' ').replace(/\s+(DIVISIOIN|DIVISION|DIVN|DIV)\.?\s*$/i, '').trim() || s;
    }
    function regionNameForCode(c) {
      c = String(c || '');
      if (c.indexOf('661') === 0 || c === '1111111' || c === '2222222' || c === '3333333') return 'MALDA';
      if (c.indexOf('662') === 0 || c === '4444444' || c === '5555555') return 'UTTAR DINAJPUR';
      if (c.indexOf('663') === 0 || c === '6666666' || c === '7777777') return 'DAKSHIN DINAJPUR';
      return '';
    }
    function buildHierarchy() {
      var DIVCODE = { '66111': '1111111', '66121': '2222222', '66131': '3333333', '66211': '4444444', '66221': '5555555', '66311': '6666666', '66321': '7777777' };
      OFFICES.split('|').forEach(function (line) {
        var code = line.slice(0, 7), name = line.slice(8).replace(/\s+/g, ' ').trim()
          .replace(/\bDIV\.$/i, 'DIVISION').replace(/\bGAZOL CCC\b/i, 'GAZOLE CCC').replace(/\bAIHO\.\s*CCC\b/i, 'AIHO CCC');
        var type = / REGION$/.test(name) ? 'region' : /DIVISION$/.test(name) ? 'division' : /CCC$/.test(name) ? 'ccc' : 'unknown';
        officeDetails[code] = { name: type === 'division' ? canonicalDivisionName(name) : name, type: type, code: code, region: '', division: '' };
      });
      Object.keys(officeDetails).forEach(function (k) {
        var o = officeDetails[k];
        if (o.type === 'ccc') {
          var dc = DIVCODE[o.code.slice(0, 5)];
          if (dc && officeDetails[dc]) { o.division = canonicalDivisionName(officeDetails[dc].name); o.region = regionNameForCode(dc); }
          else o.region = regionNameForCode(o.code);
        } else if (o.type === 'division') { o.region = regionNameForCode(o.code); o.division = canonicalDivisionName(o.name); o.name = o.division; }
        else if (o.type === 'region') { o.region = regionNameForCode(o.code) || o.name.replace(/\s+REGION$/i, ''); }
      });
    }
    function parseOfficeCode(raw) {
      var s = String(raw || '').trim();
      if (!s) return '';
      var m = s.toUpperCase().match(/66[123]\d{4}/);
      return m ? m[0] : s.replace(/^C3/i, '').substring(0, 7);
    }

    /* ---------- parse the four sheets (shape kept for CACHE_METER_PARSED_v1) ---------- */
    function processData(erp, master, crm, isu) {
      masterLookup = {}; replacementLookup = {};
      master.forEach(function (d) { var m = String(d.METER_NO || d.METER_NUMBER || '').trim(); if (m) masterLookup[m] = { conId: d.CON_ID || d.CONS_ID || '', instNo: d.INST_NO || d.INSTALLATION || '' }; });
      crm.forEach(function (d) { var m = String(d.METER_NUMBER || d.METER_NO || '').trim(); if (m) replacementLookup[m] = { conId: d.CON_ID || d.CONS_ID || '' }; });
      isu.forEach(function (d) {
        var o = String(d.METER_NO || '').trim(), n2 = String(d.REPLACED_BY || '').trim(), c = d.CON_ID || d.CONS_ID || '';
        if (o) replacementLookup[o] = { conId: c };
        if (n2) replacementLookup[n2] = { conId: c };
      });
      allERP = erp.map(function (d) {
        var meter = String(d['Serial Number'] || '').trim(), code = parseOfficeCode(d['Cost Center'] || d['CCC CODE']);
        var off = officeDetails[code] || { name: code || 'Unknown', region: 'Unknown', division: 'Unknown' };
        var phase = String(d.Phase || '').trim(); if (phase === '1') phase = '1PH'; if (phase === '3') phase = '3PH';
        return {
          meter: meter, cccCode: code, cccName: off.name, officeType: off.type || 'unknown', region: off.region,
          division: canonicalDivisionName(off.division) || off.division,
          status: replacementLookup[meter] ? 'utilized-replacement' : masterLookup[meter] ? 'utilized-nsc' : 'meter-in-hand',
          make: d['Meter Make'] || 'Unknown', phase: phase || 'Unknown', entryDate: d['Entry Date'] || 'Unknown',
          isSmart: String(d['Meter Category'] || '').toUpperCase().indexOf('SMART METER') !== -1
        };
      });
      // Latest dates: ERP entry; replacement (ISU / burnt-meter CRM); new connection (other CRM types).
      var maxErp = 0, maxRep = 0, maxNsc = 0;
      var dmy = function (s) { var p = String(s || '').split(/[./-]/); return p.length === 3 ? +new Date(+p[2], p[1] - 1, +p[0]) || 0 : 0; };
      var ymd = function (s) { if (!s || /^\(null\)/.test(s)) return 0; var p = String(s).split(' ')[0].split(/[./-]/); return p.length === 3 ? +new Date(+p[0], p[1] - 1, +p[2]) || 0 : 0; };
      var compact = function (s) { s = String(s || ''); return s.length === 8 ? +new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)) || 0 : 0; };
      erp.forEach(function (r) { maxErp = Math.max(maxErp, dmy(r['Entry Date'])); });
      isu.forEach(function (r) { maxRep = Math.max(maxRep, compact(r.REPLACEMENT_DT), compact(r.TRAN_DT)); });
      crm.forEach(function (r) {
        var t = r.PROB_TYPE || '', v = ymd(r.METER_INSTALL_DATE || r.SERV_CONN_DATE);
        if (t === 'Meter Burnt Problem') maxRep = Math.max(maxRep, v);
        else if (t && t !== 'Load Enhancement') maxNsc = Math.max(maxNsc, v);
      });
      var fmt = function (t) { if (!t) return 'N/A'; var d = new Date(t); return String(d.getDate()).padStart(2, '0') + '-' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + '-' + d.getFullYear(); };
      dates = { erp: fmt(maxErp), rep: fmt(maxRep), nsc: fmt(maxNsc) };
    }

    function bundleVersion() { return METER_RAW_KEYS.map(function (k) { try { return localStorage.getItem('mzo_hub_ver_' + k) || ''; } catch (e) { return ''; } }).join('|'); }
    function saveParsed() {
      var hub = window.mzoDataHub;
      if (!hub || !hub.set) return Promise.resolve();
      return hub.set(METER_PARSED_KEY, { allERP: allERP, masterLookup: masterLookup, replacementLookup: replacementLookup, erpDateText: dates.erp, repDateText: dates.rep, nscDateText: dates.nsc })
        .then(function () { try { localStorage.setItem('mzo_hub_ver_' + METER_PARSED_KEY, bundleVersion()); } catch (e) {} }).catch(function () {});
    }
    function applyParsed(p) {
      allERP = (p.allERP || []).map(function (r) { return r && r.region && / REGION$/i.test(r.region) ? Object.assign({}, r, { region: r.region.replace(/\s+REGION$/i, '') }) : r; });
      masterLookup = p.masterLookup || {}; replacementLookup = p.replacementLookup || {};
      dates = { erp: p.erpDateText || '', rep: p.repDateText || '', nsc: p.nscDateText || '' };
    }

    /* ---------- view model ---------- */
    var rows = [];
    // allERP stays unfiltered (it is what saveParsed caches); the login scope applies to the view rows only.
    function prepare() {
      var S = window.MzoScope, now = Date.now(), cccCache = {};
      rows = (S ? S.filterRows(allERP) : allERP).map(function (d) {
        var ccc = '';
        if (d.officeType === 'ccc') {
          ccc = cccCache[d.cccCode] || (cccCache[d.cccCode] = (S && S.cccNameOf && S.cccNameOf(d.cccCode)) || UI.title(String(d.cccName || '').replace(/\s*CCC$/i, '')));
        }
        var e = UI.date(d.entryDate), days = e ? Math.max(0, Math.floor((now - e.getTime()) / 864e5)) : null;
        return {
          src: d, meter: d.meter, status: d.status, phase: d.phase, smart: d.isSmart, make: UI.title(d.make).replace(/\s+/g, ' ').replace(/ Li Mited/, ' Limited'),
          _region: REGION_LABEL[String(d.region || '').toUpperCase()] || UI.title(d.region), _divn: d.division && !/^unknown$/i.test(d.division) ? d.division : '', _supp: ccc,
          entry: e, days: days, ageKey: days == null ? 'an' : AGE.filter(function (b) { return b.max >= 0 && days <= b.max; })[0].key
        };
      });
      var meta = 'ERP stock to ' + (dates.erp || '—') + ' · replacements to ' + (dates.rep || '—') + ' · new connections to ' + (dates.nsc || '—');
      $('meta').textContent = meta.replace(/-/g, ' ');
      fillFilters();
    }

    function fillFilters() {
      UI.offices(rows);
      if (!scope) scope = UI.lockScope();
    }

    function base() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, out = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        if (reg && r._region !== reg) continue;
        if (div && r._divn !== div) continue;
        if (ccc && r._supp !== ccc) continue;
        if (f.phase && r.phase !== f.phase) continue;
        if (f.type === 'smart' && !r.smart) continue;
        if (f.type === 'normal' && r.smart) continue;
        out.push(r);
      }
      return out;
    }

    function render() {
      var b = base(), c = { nsc: 0, rep: 0, hand: 0 };
      b.forEach(function (r) { if (r.status === 'utilized-nsc') c.nsc++; else if (r.status === 'utilized-replacement') c.rep++; else c.hand++; });
      var stats = document.querySelectorAll('#stats .ui-stat');
      var put = function (i, v, s) { stats[i].querySelector('.v').textContent = UI.n(v); stats[i].querySelector('.s').textContent = s; };
      put(0, b.length, UI.pct(c.nsc + c.rep, b.length) + ' used');
      put(1, c.nsc, UI.pct(c.nsc, b.length) + ' of issued');
      put(2, c.rep, UI.pct(c.rep, b.length) + ' of issued');
      put(3, c.hand, UI.pct(c.hand, b.length) + ' of issued');

      // Offices — division/region bookings are not CCCs, so the CCC tab skips them.
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {}, now = Date.now();
      b.forEach(function (r) {
        var name = r[key]; if (!name) { if (level === 'ccc') return; name = 'Unmapped'; }
        var g = groups[name] || (groups[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', issued: 0, nsc: 0, rep: 0, hand: 0, first: 0 });
        g.issued++;
        if (r.status === 'utilized-nsc') g.nsc++; else if (r.status === 'utilized-replacement') g.rep++; else g.hand++;
        if (r.entry && (!g.first || r.entry.getTime() < g.first)) g.first = r.entry.getTime();
      });
      var list = Object.keys(groups).map(function (k) {
        var g = groups[k], months = 1;
        if (g.first) { var a = new Date(g.first), t = new Date(now); months = Math.max(1, (t.getFullYear() - a.getFullYear()) * 12 + (t.getMonth() - a.getMonth())); }
        g.used = g.nsc + g.rep; g.perMonth = Math.round((g.used / months) * 10) / 10; g.rate = g.issued ? g.used / g.issued : 0;
        return g;
      });
      window.__summary = list;
      var tot = list.reduce(function (t, g) { t.issued += g.issued; t.nsc += g.nsc; t.rep += g.rep; t.hand += g.hand; t.perMonth += g.perMonth; t.used += g.used; return t; }, { issued: 0, nsc: 0, rep: 0, hand: 0, perMonth: 0, used: 0 });
      tot.perMonth = Math.round(tot.perMonth * 10) / 10; tot.rate = tot.issued ? tot.used / tot.issued : 0;
      UI.table('officeTable', {
        rows: list, sort: { key: 'hand', dir: 'desc' }, count: false, empty: 'No meters for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'issued', label: 'Issued', num: true, fmt: UI.n, hideSm: true },
          { key: 'nsc', label: 'New conn.', num: true, fmt: UI.n, hideSm: true },
          { key: 'rep', label: 'Replacement', num: true, fmt: UI.n, hideSm: true },
          { key: 'perMonth', label: 'Used / month', num: true, fmt: function (v) { return UI.n(v >= 100 ? Math.round(v) : v); }, hideSm: true },
          { key: 'hand', label: 'In hand', num: true, fmt: UI.n },
          { key: 'rate', label: 'Used', fmt: function (_, g) { return UI.bar(g.used, g.issued, UI.pct(g.used, g.issued)); }, width: '20%' }
        ],
        foot: list.length > 1 ? tot : null,
        onRow: function (g) { drill(g.name); },
        selected: function (g) { return level === 'ccc' && $('cccFilter').value === g.name; }
      });

      // In-hand meters
      var hand = b.filter(function (r) { return r.status === 'meter-in-hand'; });
      UI.hist('ageHist', AGE.map(function (a) { return { key: a.key, label: a.label, value: hand.filter(function (r) { return r.ageKey === a.key && (!f.make || r.make === f.make); }).length }; }).filter(function (x) { return x.key !== 'an' || x.value; }),
        { active: f.age, onClick: function (row) { f.age = f.age === row.key ? '' : row.key; render(); } });
      var mk = {};
      hand.forEach(function (r) { if (!f.age || r.ageKey === f.age) mk[r.make] = (mk[r.make] || 0) + 1; });
      UI.hist('makeHist', Object.keys(mk).sort(function (x, y) { return mk[y] - mk[x]; }).slice(0, 6).map(function (k) { return { key: k, label: k, value: mk[k] }; }),
        { active: f.make, onClick: function (row) { f.make = f.make === row.key ? '' : row.key; render(); } });

      var q = f.q.toUpperCase();
      var view = hand.filter(function (r) { return (!f.age || r.ageKey === f.age) && (!f.make || r.make === f.make) && (!q || r.meter.toUpperCase().indexOf(q) !== -1); });
      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'days', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No meters in hand for these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.phase || f.type || f.age || f.make || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
      window.__view = view;
    }

    var COLS = [
      { key: 'meter', label: 'Meter', fmt: function (v, r) { return '<span class="mono ui-strong">' + UI.esc(v) + '</span>' + (r.smart ? '<span class="sub">Smart meter</span>' : ''); } },
      { key: 'entry', label: 'Received', num: true, hideSm: true, sortVal: function (r) { return r.entry ? r.entry.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.src.entryDate; } },
      { key: 'days', label: 'In hand for', num: true, sortVal: function (r) { return r.days == null ? -1 : r.days; }, fmt: function (v) { return v == null ? '—' : UI.age(v); }, csv: function (r) { return r.days == null ? '' : r.days + ' days'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r._divn || '—') + '<span class="sub">' + UI.esc(v ? r._divn : (r._divn ? 'Division store' : '')) + '</span>'; }, csv: function (r) { return r._supp || r._divn; } },
      { key: 'make', label: 'Make', hideSm: true, cls: 'wrap' },
      { key: 'phase', label: 'Phase', fmt: function (v) { return '<span class="ui-badge">' + UI.esc(v === '1PH' ? '1-phase' : v === '3PH' ? '3-phase' : v) + '</span>'; } }
    ];

    function detail(r) {
      var d = r.src, s = STATUS[d.status] || STATUS['meter-in-hand'], c = d.status === 'utilized-nsc' ? masterLookup[d.meter] || {} : d.status === 'utilized-replacement' ? replacementLookup[d.meter] || {} : {};
      UI.drawer('Meter ' + d.meter, [s.label, r._supp || r._divn].filter(Boolean).join(' · '), [
        ['Status', s.label], ['Consumer ID', c.conId], ['Installation no.', c.instNo], ['Received on', r.entry ? UI.fmtDate(r.entry) : d.entryDate],
        ['In hand for', d.status === 'meter-in-hand' && r.days != null ? UI.age(r.days) : ''], ['Region', r._region], ['Division', r._divn], ['CCC', r._supp],
        ['Cost centre', d.cccCode], ['Make', r.make], ['Phase', d.phase === '1PH' ? '1-phase' : d.phase === '3PH' ? '3-phase' : d.phase], ['Smart meter', r.smart ? 'Yes' : 'No']
      ]);
    }
    function lookup() {
      var q = $('q').value.trim().toUpperCase();
      if (!q) return;
      var hit = rows.filter(function (r) { return r.meter.toUpperCase() === q; })[0];
      if (hit) detail(hit); else UI.toast('Meter ' + q + ' is not in the ERP list');
    }

    function tabs() { [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); }); }
    function setLevel(l) { level = l; tabs(); render(); }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter', 'typeFilter'].forEach(function (x) { UI.mark($(x)); }); }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }
    function drill(name) {
      if (name === 'Unmapped') return;
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); level = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); level = 'ccc'; }
      else set('cccFilter', $('cccFilter').value === name ? '' : name);
      fillFilters(); markAll(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); markAll(); render();
      });
    });
    $('typeFilter').addEventListener('change', function () { f.type = this.value; UI.mark(this); render(); });
    $('phase').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      f.phase = b.getAttribute('data-p');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 200));
    $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); lookup(); } });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.phase = ''; f.type = ''; f.age = ''; f.make = ''; $('q').value = ''; $('typeFilter').value = '';
      [].forEach.call(document.querySelectorAll('#phase button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-p') === '')); });
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { set(id, ''); });
      fillFilters(); markAll(); render();
    });
    $('exportSummary').addEventListener('click', function () {
      var stamp = new Date().toISOString().slice(0, 10), ph = f.phase === '1PH' ? '1Ph' : f.phase === '3PH' ? '3Ph' : 'Total';
      UI.exportCsv('meter_utilization_' + level + '_' + ph + '_' + stamp + '.csv', [
        { key: 'name', label: 'Name' }, { key: 'issued', label: 'Issued' }, { key: 'nsc', label: 'Utilized_NSC' }, { key: 'rep', label: 'Utilized_Rep' },
        { key: 'perMonth', label: 'Avg_Monthly_Util' }, { key: 'hand', label: 'In_Hand' }, { key: 'rate', label: 'Utilization_Percent', csv: function (g) { return (g.rate * 100).toFixed(1) + '%'; } }
      ], window.__summary || []);
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('meters_in_hand.csv', [{ key: 'meter', label: 'Meter_Number' }].concat(COLS.slice(1).map(function (c) { return { key: c.key, label: c.label, csv: c.csv }; })), window.__view || []);
    });

    /* ---------- load: parsed bundle first, then raw sheets ---------- */
    function fail() { $('meta').textContent = 'Could not load meter data'; $('officeTable').innerHTML = $('appTable').innerHTML = '<div class="ui-empty">Could not load meter data.</div>'; }
    function firstRender() {
      prepare();
      if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
      tabs(); render();
    }
    function revalidate() {
      var hub = window.mzoDataHub;
      if (!hub) return;
      Promise.all(METER_RAW_KEYS.map(function (k) { return hub.waitForDataset(k); }))
        .then(function (res) { if (res.some(function (r) { return r === 'updated'; })) location.reload(); }).catch(function () {});
    }
    function fromRaw(texts) {
      processData(UI.csv(texts[0] || ''), UI.csv(texts[1] || ''), UI.csv(texts[2] || ''), UI.csv(texts[3] || ''));
      if (!allERP.length) return fail();
      firstRender();
      saveParsed();
    }
    buildHierarchy();
    (function init() {
      var hub = window.mzoDataHub;
      if (!hub) {
        Promise.all(GIDS.map(function (g) { return fetch(BASE_URL + '&gid=' + g).then(function (r) { return r.text(); }); })).then(fromRaw).catch(fail);
        return;
      }
      var parsedVer = '';
      try { parsedVer = localStorage.getItem('mzo_hub_ver_' + METER_PARSED_KEY) || ''; } catch (e) {}
      var bundle = bundleVersion();
      Promise.resolve(bundle && parsedVer === bundle ? hub._peek(METER_PARSED_KEY) : null).catch(function () { return null; })
        .then(function (parsed) {
          if (parsed && Array.isArray(parsed.allERP) && parsed.allERP.length) { applyParsed(parsed); firstRender(); revalidate(); return; }
          return Promise.all(METER_RAW_KEYS.map(function (k) { return hub._peek(k); })).then(function (peeked) {
            if (peeked[0]) return peeked;
            $('meta').textContent = 'Downloading meter lists…';
            return Promise.all(METER_RAW_KEYS.map(function (k) { return hub.waitForDataset(k); }))
              .then(function () { return Promise.all(METER_RAW_KEYS.map(function (k) { return hub._peek(k); })); });
          }).then(function (texts) { fromRaw(texts); revalidate(); });
        })
        .catch(function (e) { console.error(e); fail(); });
    })();
  });
  </script>
</body>
</html>
