<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter utilization · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=12" />
  <script src="/mzo_ui.js?v=10" defer></script>
  <script src="/mzo_data_hub.js?v=93" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <script src="/mzo_view.js?v=1" defer></script>
  <style>
    .ui-head { align-items: center; }
    .mono { font-family: var(--mzo-mono); font-size: 12.5px; letter-spacing: .02em; }
    .cl-kpis .ui-stat { padding: 13px 14px 14px; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Meter utilization<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="topBtn">Oldest in hand</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Meter serial number" autocomplete="off" spellcheck="false" aria-label="Meter serial number (Enter to look up)" title="Meter serial number (Enter to look up)" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec"><div aria-label="Phase" id="fPhase"></div></div>
        <div class="ui-side-sec"><div aria-label="Meter type" id="fType"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Received and make">
            <button type="button" role="tab" data-pane="fAge" aria-pressed="true" aria-selected="true">Received</button>
            <button type="button" role="tab" data-pane="fMake" aria-pressed="false" aria-selected="false">Make</button>
          </div>
          <div aria-label="Received" id="fAge"></div>
          <div aria-label="Make" id="fMake" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats cl-kpis" id="kpis" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Issued</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="used"><div class="k"><span class="ui-dot ok"></span>Used</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="nsc"><div class="k" title="Used for new connections">New connection</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="rep"><div class="k" title="Used for replacement">Replacement</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="hand"><div class="k"><span class="ui-dot warn"></span>In hand</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="old"><div class="k" title="In hand for over 6 months"><span class="ui-dot bad"></span>In hand 6m+</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEYS = ['meter_erp', 'meter_master', 'meter_crm', 'meter_isu'];
    var STATUS = { 'utilized-nsc': { label: 'New connection', cls: 'ok' }, 'utilized-replacement': { label: 'Replacement', cls: 'ok' }, 'meter-in-hand': { label: 'In hand', cls: 'warn' } };
    var AGE = [
      { key: 'a0', label: 'Under a month', max: 30 }, { key: 'a1', label: '1–3 months', max: 91 }, { key: 'a2', label: '3–6 months', max: 182 },
      { key: 'a3', label: '6–12 months', max: 365 }, { key: 'a4', label: 'Over a year', max: Infinity }, { key: 'an', label: 'Date unknown', max: -1 }
    ];
    var OLD_DAYS = 182;

    var T = {}, masterLookup = {}, replacementLookup = {}, dates = { erp: '', rep: '', nsc: '' };

    // The cost centre as the drawer shows it: the 7-digit office code inside an SAP cost centre
    // (C366111050 → 6611105, C366110000 → 6611000).
    function parseOfficeCode(raw) {
      var s = String(raw || '').trim();
      if (!s) return '';
      var m = s.toUpperCase().match(/66[123]\d{4}/);
      return m ? m[0] : s.replace(/^C3/i, '').substring(0, 7);
    }

    /* ---------- the four sheets (uniform rows; MzoRows scopes meter_erp to the login) ---------- */
    // Status lookups and the "to" dates use every row: the master, CRM and ISU sheets have no offices,
    // and the dates in the header are the sheets' own.
    function processData() {
      masterLookup = {}; replacementLookup = {};
      T.meter_master.all.forEach(function (d) { if (d.meter_no) masterLookup[d.meter_no] = { conId: d.con_id, instNo: d.inst_no }; });
      T.meter_crm.all.forEach(function (d) { if (d.meter_number) replacementLookup[d.meter_number] = { conId: d.con_id }; });
      T.meter_isu.all.forEach(function (d) {
        if (d.meter_no) replacementLookup[d.meter_no] = { conId: d.con_id };
        if (d.replaced_by) replacementLookup[d.replaced_by] = { conId: d.con_id };
      });
      // Latest dates: ERP entry; replacement (ISU / burnt-meter CRM); new connection (other CRM types).
      var maxErp = 0, maxRep = 0, maxNsc = 0;
      var day = function (iso) { return iso ? +new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) || 0 : 0; };
      var compact = function (s) { return s.length === 8 ? +new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)) || 0 : 0; };
      T.meter_erp.all.forEach(function (d) { maxErp = Math.max(maxErp, day(d.entry_date)); });
      T.meter_isu.all.forEach(function (d) { maxRep = Math.max(maxRep, compact(d.replacement_dt), compact(d.tran_dt)); });
      T.meter_crm.all.forEach(function (d) {
        var t = d.prob_type, v = day(d.meter_install_date || d.serv_conn_date);
        if (t === 'Meter Burnt Problem') maxRep = Math.max(maxRep, v);
        else if (t && t !== 'Load Enhancement') maxNsc = Math.max(maxNsc, v);
      });
      dates = { erp: maxErp ? UI.fmtDate(new Date(maxErp)) : '', rep: maxRep ? UI.fmtDate(new Date(maxRep)) : '', nsc: maxNsc ? UI.fmtDate(new Date(maxNsc)) : '' };
    }

    /* ---------- the precomputed view (VM): the same rows and statuses, joined once per sync ---------- */
    // vm/sync/lib/views/meter_utilization.js runs the joins above on the server: the page gets the
    // meter_erp rows with each meter's status and the three dates, and the drawer's consumer ids
    // when it first opens (the ids part). Anywhere else the four sheets load as before.
    var VIEW = null, VIEW_STATUS = { n: 'utilized-nsc', r: 'utilized-replacement', h: 'meter-in-hand' }, idsP = null, idsReady = false;
    function fromView(v) {
      var all = new Array(v.rows), fields = v.fields, st = v.status;
      // where each field comes from: -1 serial, -2 entry date, k ≥ 0 the row's tuple
      var src = fields.map(function (name) { return name === 'serial_number' ? -1 : name === 'entry_date' ? -2 : v.columns.indexOf(name); });
      for (var i = 0; i < v.rows; i++) {
        var t = v.tuples[v.tuple[i]], d = {};
        for (var k = 0; k < fields.length; k++) {
          var at = src[k];
          d[fields[k]] = at === -1 ? v.serial[i] : at === -2 ? v.entryDates[v.entry[i]] : at >= 0 ? t[at] : '';
        }
        d._mu_status = VIEW_STATUS[st.charAt(i)];
        all[i] = d;
      }
      return { all: all, rows: MzoRows.scope(all) };
    }
    function processView() {
      masterLookup = {}; replacementLookup = {}; idsP = null; idsReady = false;
      var day = function (x) { return x ? UI.fmtDate(new Date(x[0], x[1] - 1, x[2])) : ''; };
      dates = { erp: day(VIEW.dates.erp), rep: day(VIEW.dates.rep), nsc: day(VIEW.dates.nsc) };
    }
    // The drawer's consumer ids: the view's ids part, else the three lookup sheets as before.
    function loadIds() {
      if (idsP) return idsP;
      idsP = MzoView.load('meter_utilization', function (x) {
        masterLookup = {}; replacementLookup = {};
        Object.keys(x.nsc).forEach(function (m) { masterLookup[m] = { conId: x.nsc[m][0], instNo: x.nsc[m][1] }; });
        Object.keys(x.rep).forEach(function (m) { replacementLookup[m] = { conId: x.rep[m] }; });
      }, { part: 'ids', noPaint: true }).then(function (ok) {
        if (ok) return;
        return Promise.all(KEYS.slice(1).map(function (k) { return MzoRows.get(k).then(function (t) { T[k] = t; }); })).then(function () {
          masterLookup = {}; replacementLookup = {};
          T.meter_master.all.forEach(function (d) { if (d.meter_no) masterLookup[d.meter_no] = { conId: d.con_id, instNo: d.inst_no }; });
          T.meter_crm.all.forEach(function (d) { if (d.meter_number) replacementLookup[d.meter_number] = { conId: d.con_id }; });
          T.meter_isu.all.forEach(function (d) {
            if (d.meter_no) replacementLookup[d.meter_no] = { conId: d.con_id };
            if (d.replaced_by) replacementLookup[d.replaced_by] = { conId: d.con_id };
          });
        });
      }).then(function () { idsReady = true; }, function () { idsP = null; });
      return idsP;
    }

    /* ---------- view model ---------- */
    var all = [], makes = {};
    // One view row per ERP meter in the login's scope. Offices are the canonical ones; a division
    // store (cost centre of a division) has no CCC.
    function prepare() {
      var now = Date.now();
      all = T.meter_erp.rows.map(function (d) {
        var meter = d.serial_number, phase = d.phase;
        if (phase === '1') phase = '1PH'; if (phase === '3') phase = '3PH';
        var status = d._mu_status || (replacementLookup[meter] ? 'utilized-replacement' : masterLookup[meter] ? 'utilized-nsc' : 'meter-in-hand');
        var mk = d.meter_make || 'Unknown', make = makes[mk] || (makes[mk] = UI.title(mk).replace(/\s+/g, ' ').replace(/ Li Mited/, ' Limited'));
        var e = d.entry_date ? UI.date(d.entry_date) : null, days = e ? Math.max(0, Math.floor((now - e.getTime()) / 864e5)) : null;
        var hand = status === 'meter-in-hand';
        return {
          src: { meter: meter, status: status, phase: phase || 'Unknown', cccCode: parseOfficeCode(d.cost_center), entryDate: d.entry_date || 'Unknown' },
          meter: meter, status: status, hand: hand, phase: phase || 'Unknown', smart: d.meter_category.toUpperCase().indexOf('SMART METER') !== -1, make: make,
          _region: d._region || 'Unknown', _divn: d._division, _supp: d._ccc,
          entry: e, days: days, handDays: hand ? days : null, old: hand && days != null && days > OLD_DAYS,
          ageKey: days == null ? 'an' : AGE.filter(function (b) { return b.max >= 0 && days <= b.max; })[0].key
        };
      });
      $('asOn').textContent = dates.erp || '';
      $('asOn').title = 'ERP stock to ' + (dates.erp || '—') + ' · replacements to ' + (dates.rep || '—') + ' · new connections to ' + (dates.nsc || '—');
      fillFilters();
    }

    var PHASE_LABEL = { '1PH': '1-phase', '3PH': '3-phase' };
    var AGE_LABEL = {}; AGE.forEach(function (a) { AGE_LABEL[a.key] = a.label; });
    var KPI = {
      '': function () { return true; },
      used: function (r) { return !r.hand; }, nsc: function (r) { return r.status === 'utilized-nsc'; }, rep: function (r) { return r.status === 'utilized-replacement'; },
      hand: function (r) { return r.hand; }, old: function (r) { return r.old; }
    };
    // Facets shown as radio lists in the left panel: [value, label, test]
    var FACETS = {
      phase: [['1PH', '1-phase', function (r) { return r.phase === '1PH'; }], ['3PH', '3-phase', function (r) { return r.phase === '3PH'; }]],
      type: [['smart', 'Smart meters', function (r) { return r.smart; }], ['normal', 'Non-smart meters', function (r) { return !r.smart; }]],
      age: AGE.map(function (a) { return [a.key, a.label, function (r) { return r.ageKey === a.key; }]; }),
      make: []  // filled from the data
    };
    var TABS = [
      ['region', 'Region'], ['division', 'Division'], ['ccc', 'CCC'], ['meters', 'Meters'], ['status', 'Status'],
      ['age', 'Received'], ['make', 'Make'], ['phase', 'Phase'], ['type', 'Meter type']
    ];
    var f = { q: '', kpi: '', phase: '', type: '', age: '', make: '' }, tab = 'region', renderedTab = '', scope = null, lastTable = null, lastList = null, firstData = true;
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];
    var FACET_NAMES = ['phase', 'type', 'age', 'make'];

    function fillFilters() {
      UI.offices(all);
      var mk = {}; all.forEach(function (r) { mk[r.make] = (mk[r.make] || 0) + 1; });
      FACETS.make = Object.keys(mk).sort(function (a, b) { return mk[b] - mk[a]; }).map(function (k) { return [k, k, function (r) { return r.make === k; }]; });
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }

    function facetTest(name) { var v = f[name]; if (!v) return null; var o = FACETS[name].filter(function (x) { return x[0] === v; })[0]; return o ? o[2] : null; }

    // All panel filters, optionally leaving one facet out (so that facet can count its own options).
    function filtered(skip) {
      var q = f.q.toUpperCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      var tests = FACET_NAMES.filter(function (n) { return n !== skip; }).map(facetTest).filter(Boolean);
      return all.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (ccc && r._supp !== ccc) return false;
        for (var i = 0; i < tests.length; i++) if (!tests[i](r)) return false;
        if (q && String(r.meter).toUpperCase().indexOf(q) === -1) return false;
        return true;
      });
    }

    function renderFacets() {
      [['phase', 'fPhase'], ['type', 'fType'], ['age', 'fAge'], ['make', 'fMake']].forEach(function (x) {
        var name = x[0], rows = filtered(name);
        var opts = FACETS[name].map(function (o) { return { value: o[0], label: o[1], count: rows.filter(o[2]).length }; });
        if (name === 'age') opts = opts.filter(function (o) { return o.value !== 'an' || o.count || f.age === 'an'; });
        UI.facet(x[1], opts, f[name], function (v) { f[name] = v; render(); });
      });
      var active = (f.q ? 1 : 0) + FACET_NAMES.filter(function (n) { return f[n]; }).length +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active, { fAge: f.age, fMake: f.make });
    }

    // Months between the earliest receipt and today (at least one): the base for "used / month".
    function monthsSince(t) {
      if (!t) return 1;
      var a = new Date(t), n = new Date();
      return Math.max(1, (n.getFullYear() - a.getFullYear()) * 12 + (n.getMonth() - a.getMonth()));
    }
    function tally(rows) {
      var c = { issued: rows.length, nsc: 0, rep: 0, hand: 0, old: 0, first: 0 };
      rows.forEach(function (r) {
        if (r.status === 'utilized-nsc') c.nsc++; else if (r.status === 'utilized-replacement') c.rep++; else c.hand++;
        if (r.old) c.old++;
        if (r.entry && (!c.first || r.entry.getTime() < c.first)) c.first = r.entry.getTime();
      });
      c.used = c.nsc + c.rep;
      c.perMonth = Math.round((c.used / monthsSince(c.first)) * 10) / 10;
      c.rate = c.issued ? c.used / c.issued : 0;
      return c;
    }
    function oneDec(v) { return UI.n(v >= 100 ? Math.round(v) : Math.round(v * 10) / 10); }

    function render() {
      var b = filtered(null), c = tally(b);
      renderFacets();
      // KPI analysis: shares, pace of use and how long the stock in hand lasts at that pace.
      var cover = c.perMonth ? c.hand / c.perMonth : 0;
      var sub = {
        '': oneDec(c.perMonth) + ' used / month',
        used: UI.pct(c.used, c.issued) + ' of issued',
        nsc: UI.pct(c.nsc, c.used) + ' of used',
        rep: UI.pct(c.rep, c.used) + ' of used',
        hand: c.hand ? (c.perMonth ? '≈ ' + oneDec(cover) + ' months of use' : UI.pct(c.hand, c.issued) + ' of issued') : 'None in hand',
        old: UI.pct(c.old, c.hand) + ' of in hand'
      };
      [].forEach.call(document.querySelectorAll('#kpis .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        el.querySelector('.v').textContent = UI.n(k === '' ? c.issued : k === 'used' ? c.used : c[k]);
        el.querySelector('.s').textContent = sub[k];
        el.setAttribute('aria-pressed', String(f.kpi === k));
      });

      var view = b.filter(KPI[f.kpi]);
      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'meters' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');
      var kEl = f.kpi ? document.querySelector('#kpis [data-k="' + f.kpi + '"] .k') : null;
      var kpiName = kEl ? kEl.getAttribute('title') || kEl.textContent : '';
      $('hint').textContent = (kpiName ? 'Showing ' + kpiName.toLowerCase() + ' only. ' : '') +
        (tab === 'ccc' ? 'Meters booked to a division store have no CCC and are left out here. ' : '') +
        (tab === 'age' ? 'Age since the meter was received in ERP.' : '');
      renderReportHead(view);
      renderTab(view);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
      var kEl = f.kpi ? document.querySelector('#kpis [data-k="' + f.kpi + '"] .k') : null;
      var kpiName = kEl ? kEl.getAttribute('title') || kEl.textContent : '';

      $('rhTitle').textContent = tabLabel + (kpiName ? ' · ' + kpiName : '');

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> meters';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' meters';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('regionFilter').value && !$('regionFilter').disabled) {
        currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { set('regionFilter', ''); set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); } });
      }
      if ($('divisionFilter').value && !$('divisionFilter').disabled) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); } });
      }
      if ($('cccFilter').value && !$('cccFilter').disabled) {
        currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { set('cccFilter', ''); fillFilters(); } });
      }
      if (f.kpi && kpiName) {
        currentActiveFilters.push({ label: 'KPI', value: kpiName, clear: function () { f.kpi = ''; } });
      }
      if (f.phase) {
        currentActiveFilters.push({ label: 'Phase', value: f.phase === '1' ? 'Single phase' : 'Three phase', clear: function () { f.phase = ''; } });
      }
      if (f.type) {
        currentActiveFilters.push({ label: 'Type', value: f.type === 'smart' ? 'Smart meter' : 'Normal meter', clear: function () { f.type = ''; } });
      }
      if (f.age) {
        var ab = AGE.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Received', value: ab ? ab.label : f.age, clear: function () { f.age = ''; } });
      }
      if (f.make) {
        currentActiveFilters.push({ label: 'Make', value: f.make, clear: function () { f.make = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    // One row per group. With no KPI selected (and not on Status) the row is a utilization line
    // (issued, used, in hand, used %); with a KPI selected it is a plain count and share.
    function groupTable(view, keyFn, label, opts) {
      opts = opts || {};
      var util = !f.kpi && !opts.count, groups = {}, total = view.length;
      view.forEach(function (r) {
        var k = keyFn(r); if (k == null) return;
        var g = groups[k] || (groups[k] = { name: k, parent: opts.parent ? opts.parent(r) || '' : '', rows: [] });
        g.rows.push(r);
      });
      var list = Object.keys(groups).map(function (k) { var g = groups[k], t = tally(g.rows); t.name = g.name; t.parent = g.parent; t.n = g.rows.length; return t; });
      if (opts.order) list.sort(function (a, b) { return opts.order.indexOf(a.name) - opts.order.indexOf(b.name); });
      var nameCol = { key: 'name', label: label, fmt: function (v, g) { return (opts.dots && opts.dots[v] ? '<span class="ui-dot ' + opts.dots[v] + '" style="margin-right:8px"></span>' : '') + '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } };
      if (util) {
        var tot = tally(view.filter(function (r) { return keyFn(r) != null; }));
        lastTable = { title: label, cols: [label, 'Issued', 'New conn.', 'Replacement', 'Used / month', 'In hand', 'In hand 6m+', 'Used %'],
          rows: list.map(function (g) { return [g.name, g.issued, g.nsc, g.rep, g.perMonth, g.hand, g.old, UI.pct(g.used, g.issued)]; }) };
        return {
          rows: list, sort: opts.order ? null : { key: 'hand', dir: 'desc' }, count: false, empty: 'No meters for these filters.',
          columns: [
            nameCol,
            { key: 'issued', label: 'Issued', num: true, fmt: UI.n, hideSm: true },
            { key: 'nsc', label: 'New conn.', num: true, fmt: UI.n, hideSm: true },
            { key: 'rep', label: 'Replacement', num: true, fmt: UI.n, hideSm: true },
            { key: 'perMonth', label: 'Used / month', num: true, fmt: oneDec, hideSm: true },
            { key: 'hand', label: 'In hand', num: true, fmt: UI.n },
            { key: 'old', label: '6m+', num: true, hideSm: true, fmt: function (v) { return v ? '<span class="ui-delta bad">' + UI.n(v) + '</span>' : '0'; } },
            { key: 'rate', label: 'Used', fmt: function (_, g) { return UI.bar(g.used, g.issued, UI.pct(g.used, g.issued), 2); }, width: '20%' }
          ],
          foot: list.length > 1 ? tot : null
        };
      }
      var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      lastTable = { title: label, cols: [label, 'Count', '%'], rows: list.map(function (g) { return [g.name, g.n, UI.pct(g.n, total)]; }) };
      return {
        rows: list, sort: opts.order ? null : { key: 'n', dir: 'desc' }, count: false, empty: 'No meters for these filters.',
        columns: [
          nameCol,
          { key: 'n', label: 'Count', num: true, fmt: UI.n },
          { key: 'pct', label: '%', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, total)); }, width: '30%' }
        ],
        foot: list.length > 1 ? { n: list.reduce(function (a, g) { return a + g.n; }, 0), pct: 0 } : null
      };
    }

    function drill(level, name) {
      if (name === 'Unmapped' || name === 'Unknown') return;
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); tab = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); tab = 'ccc'; }
      else { set('cccFilter', name); tab = 'meters'; }
      fillFilters(); render();
    }

    function renderTab(view) {
      var cfg, mode = f.kpi ? 'count' : 'util';
      lastList = null;
      if (tab === 'region') { cfg = groupTable(view, function (r) { return r._region || 'Unmapped'; }, 'Region'); cfg.onRow = function (g) { drill('region', g.name); }; }
      else if (tab === 'division') { cfg = groupTable(view, function (r) { return r._divn || 'Unmapped'; }, 'Division', { parent: function (r) { return r._region; } }); cfg.onRow = function (g) { drill('division', g.name); }; }
      else if (tab === 'ccc') {
        cfg = groupTable(view, function (r) { return r._supp || null; }, 'CCC', { parent: function (r) { return r._divn; } });
        cfg.onRow = function (g) { drill('ccc', g.name); };
        cfg.selected = function (g) { return $('cccFilter').value === g.name; };
      }
      else if (tab === 'status') { mode = 'count'; cfg = groupTable(view, function (r) { return STATUS[r.status].label; }, 'Status', { count: true, order: ['New connection', 'Replacement', 'In hand'], dots: { 'New connection': 'ok', 'Replacement': 'ok', 'In hand': 'warn' } }); }
      else if (tab === 'age') cfg = groupTable(view, function (r) { return AGE_LABEL[r.ageKey]; }, 'Received', { order: AGE.map(function (a) { return a.label; }) });
      else if (tab === 'make') cfg = groupTable(view, function (r) { return r.make; }, 'Make');
      else if (tab === 'phase') cfg = groupTable(view, function (r) { return PHASE_LABEL[r.phase] || r.phase; }, 'Phase');
      else if (tab === 'type') cfg = groupTable(view, function (r) { return r.smart ? 'Smart meter' : 'Non-smart meter'; }, 'Meter type');
      else {
        mode = 'list';
        lastList = view;
        lastTable = { title: 'Meters', cols: ['Meter', 'Status', 'Received', 'In hand (days)', 'CCC', 'Make', 'Phase'],
          rows: view.slice().sort(function (x, y) { return (y.handDays == null ? -1 : y.handDays) - (x.handDays == null ? -1 : x.handDays); })
            .map(function (r) { return [r.meter, STATUS[r.status].label, r.entry ? UI.fmtDate(r.entry) : '', r.handDays == null ? '' : r.handDays, r._supp || r._divn || '', r.make, PHASE_LABEL[r.phase] || r.phase]; }) };
        cfg = { rows: view, sort: { key: 'handDays', dir: 'desc' }, limit: 50, empty: 'No meters for these filters.', columns: COLS, onRow: detail };
      }
      var key = tab + ':' + mode;
      if (renderedTab !== key) { $('table').__ui = null; renderedTab = key; } // new columns: fresh sort and paging
      UI.table('table', cfg);
    }

    var COLS = [
      { key: 'meter', label: 'Meter', fmt: function (v, r) { return '<span class="mono ui-strong">' + UI.esc(v) + '</span>' + (r.smart ? '<span class="sub">Smart meter</span>' : ''); } },
      { key: 'status', label: 'Status', fmt: function (v) { var s = STATUS[v]; return '<span class="ui-badge ' + s.cls + '">' + UI.esc(s.label) + '</span>'; }, csv: function (r) { return STATUS[r.status].label; } },
      { key: 'entry', label: 'Received', num: true, hideSm: true, sortVal: function (r) { return r.entry ? r.entry.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.src.entryDate; } },
      { key: 'handDays', label: 'In hand for', num: true, sortVal: function (r) { return r.handDays == null ? -1 : r.handDays; }, fmt: function (v, r) { return v == null ? '<span class="ui-muted">—</span>' : '<span class="' + (r.old ? 'ui-delta bad' : '') + '">' + UI.esc(UI.age(v)) + '</span>'; }, csv: function (r) { return r.handDays == null ? '' : r.handDays + ' days'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r._divn || '—') + '<span class="sub">' + UI.esc(v ? r._divn : (r._divn ? 'Division store' : '')) + '</span>'; }, csv: function (r) { return r._supp || r._divn; } },
      { key: 'make', label: 'Make', hideSm: true, cls: 'wrap' },
      { key: 'phase', label: 'Phase', hideSm: true, fmt: function (v) { return '<span class="ui-badge">' + UI.esc(PHASE_LABEL[v] || v) + '</span>'; }, csv: function (r) { return PHASE_LABEL[r.phase] || r.phase; } }
    ];

    /* ---------- detail drawer ---------- */
    function detail(r) {
      if (VIEW && !idsReady) {
        loadIds().then(function () { if (idsReady) detail(r); else UI.toast('Could not load meter data.'); });
        return;
      }
      var d = r.src, s = STATUS[d.status] || STATUS['meter-in-hand'], c = d.status === 'utilized-nsc' ? masterLookup[d.meter] || {} : d.status === 'utilized-replacement' ? replacementLookup[d.meter] || {} : {};
      UI.drawer('Meter ' + d.meter, [s.label, r._supp || r._divn].filter(Boolean).join(' · '), [
        ['Status', s.label], ['Consumer ID', c.conId], ['Installation no.', c.instNo], ['Received on', r.entry ? UI.fmtDate(r.entry) : d.entryDate],
        ['In hand for', r.handDays != null ? UI.age(r.handDays) : ''], ['Region', r._region], ['Division', r._divn], ['CCC', r._supp],
        ['Cost centre', d.cccCode], ['Make', r.make], ['Phase', PHASE_LABEL[d.phase] || d.phase], ['Smart meter', r.smart ? 'Yes' : 'No']
      ]);
    }
    function lookup() {
      var q = $('q').value.trim().toUpperCase();
      if (!q) return;
      var hit = all.filter(function (r) { return String(r.meter).toUpperCase() === q; })[0];
      if (hit) detail(hit); else UI.toast('Meter ' + q + ' is not in the ERP list');
    }

    /* ---------- URL params (Ask, shared links) ---------- */
    // ?region= ?division= ?ccc= ?q= ?kpi=used|nsc|rep|hand|old
    function applyUrl() {
      var p = new URLSearchParams(location.search), pick = function (id, v) {
        var el = $(id); if (!v || el.disabled) return false;
        var m = [].filter.call(el.options, function (o) { return o.value && o.value.toLowerCase() === String(v).trim().toLowerCase(); })[0];
        if (m) { el.value = m.value; fillFilters(); return true; } return false;
      };
      if (pick('regionFilter', p.get('region'))) tab = 'division';
      if (pick('divisionFilter', p.get('division'))) tab = 'ccc';
      if (pick('cccFilter', p.get('ccc'))) tab = 'meters';
      var k = String(p.get('kpi') || '').toLowerCase();
      if (/old|6m|aged/.test(k)) f.kpi = 'old';
      else if (/hand|stock/.test(k)) f.kpi = 'hand';
      else if (/rep/.test(k)) f.kpi = 'rep';
      else if (/nsc|new/.test(k)) f.kpi = 'nsc';
      else if (/used|util/.test(k)) f.kpi = 'used';
      if (p.get('q')) { f.q = p.get('q').trim(); $('q').value = f.q; tab = 'meters'; }
    }

    /* ---------- events ---------- */
    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); if (f.q && tab !== 'meters') tab = 'meters'; render(); }, 200));
    $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); lookup(); } });
    $('kpis').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.kpi = f.kpi === k ? '' : k; render(); });
    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-drill-tab'); if (t) { tab = t.getAttribute('data-t'); render(); } });
    function homeTab() { return scope && (scope.level === 'division' || scope.level === 'ccc' || scope.level === 'codes') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region'; }
    function clearAll() {
      f = { q: '', kpi: '', phase: '', type: '', age: '', make: '' }; $('q').value = '';
      SELECTS.forEach(function (id) { set(id, ''); });
      tab = homeTab();
      fillFilters(); render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });
    $('topBtn').addEventListener('click', function () { tab = 'meters'; f.kpi = 'hand'; renderedTab = ''; render(); $('table').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = ['*Meter utilization — ' + lastTable.title + '*' + ($('asOn').textContent ? ' (ERP to ' + $('asOn').textContent + ')' : ''), lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
    });
    // Meters exports every meter in view with its details; group tabs export the table.
    $('exportBtn').addEventListener('click', function () {
      if (lastList) {
        UI.exportCsv('meter-utilization-meters.csv', [{ key: 'meter', label: 'Meter_Number' }].concat(COLS.slice(1).map(function (c) { return { key: c.key, label: c.label, csv: c.csv }; }),
          [{ key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: 'smart', label: 'Smart meter', csv: function (r) { return r.smart ? 'Yes' : 'No'; } }]),
          lastList.slice().sort(function (x, y) { return (y.handDays == null ? -1 : y.handDays) - (x.handDays == null ? -1 : x.handDays); }));
        return;
      }
      if (!lastTable) return;
      UI.exportCsv('meter-utilization-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
    });

    /* ---------- load: the four datasets through MzoRows (cached rows first) ---------- */
    function fail() { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load meter data.</div>'; }
    var queued = false, failed = {};
    // Paint when all four are in; newer rows of any of them repaint (once per batch of arrivals).
    function build() {
      queued = false;
      if (!VIEW && KEYS.some(function (k) { return !T[k]; })) return;
      if (!T.meter_erp.rows.length && failed.meter_erp) return fail();
      if (VIEW) processView(); else processData();
      prepare();
      if (firstData) { firstData = false; tab = homeTab(); applyUrl(); }
      render();
    }
    function queue() { if (!queued) { queued = true; setTimeout(build, 0); } }
    function loadSheets() {
      KEYS.forEach(function (k) {
        MzoRows.load(k, function (t, info) {
          if (t) T[k] = t;
          else if (info && info.error && !T[k]) { failed[k] = true; T[k] = { rows: [], all: [] }; }
          queue();
        });
      });
    }
    function useView(v) { VIEW = v; T = { meter_erp: fromView(v) }; queue(); }
    if (window.MzoView) {
      MzoView.load('meter_utilization', useView).then(function (ok) {
        if (ok) return;
        VIEW = null; T = {};
        loadSheets();
      });
    } else loadSheets();
    // Refresh: a forced version check of all four (reads only).
    $('refreshBtn').addEventListener('click', function () {
      var btn = this; btn.classList.add('spin');
      if (VIEW) {
        MzoView.load('meter_utilization', function (v) { VIEW = v; T = { meter_erp: fromView(v) }; }, { noPaint: true })
          .then(function (ok) {
            if (!ok) { VIEW = null; T = {}; loadSheets(); return; } // no view now: the four sheets, as before
            build(); UI.toast('Meter data is up to date');
          })
          .then(function () { btn.classList.remove('spin'); }, function () { btn.classList.remove('spin'); });
        return;
      }
      Promise.all(KEYS.map(function (k) { return MzoRows.get(k, { forceCheck: true }).then(function (t) { if (t) T[k] = t; }, function () {}); }))
        .then(function () { build(); UI.toast('Meter data is up to date'); })
        .then(function () { btn.classList.remove('spin'); }, function () { btn.classList.remove('spin'); });
    });
    // The page used to keep its own parsed copy of the four sheets; MzoRows keeps the rows now.
    try { localStorage.removeItem('mzo_hub_ver_CACHE_METER_PARSED_v1'); } catch (e) {}
    if (window.mzoDataHub && mzoDataHub.delete) Promise.resolve().then(function () { return mzoDataHub.delete('CACHE_METER_PARSED_v1'); }).catch(function () {});
  });
  </script>
</body>
