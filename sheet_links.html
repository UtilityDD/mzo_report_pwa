<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <script src="mzo_theme.js?v=9"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheet links</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { font: 13px/1.5 var(--mzo-font); background: var(--mzo-bg); color: var(--mzo-text); }
    .sheet-container { max-width: 900px; margin: 0 auto; padding: 24px 28px 72px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 16px; }
    .head h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
    .head p { margin: 3px 0 0; color: var(--mzo-muted); }
    .bar { position: relative; flex: 0 1 280px; }
    .bar svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; fill: none; stroke: var(--mzo-faint); stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
    input { width: 100%; height: 32px; padding: 0 10px 0 32px; border: 1px solid var(--mzo-border-strong); border-radius: 7px; background: var(--mzo-input); color: var(--mzo-text); font: 13px var(--mzo-font); outline: none; }
    input:focus { border-color: var(--mzo-accent); box-shadow: var(--mzo-ring); }
    input::placeholder { color: var(--mzo-faint); }
    .wrap { background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
    th { position: sticky; top: 0; z-index: 1; text-align: left; padding: 9px 12px; font-size: 12px; font-weight: 500; color: var(--mzo-muted); background: var(--mzo-surface); border-bottom: 1px solid var(--mzo-border); }
    td { padding: 9px 12px; border-bottom: 1px solid var(--mzo-border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--mzo-row-hover); }
    td.n, th.n { width: 3rem; padding-left: 16px; color: var(--mzo-muted); }
    td.when, th.when { white-space: nowrap; color: var(--mzo-muted); }
    td.act, th.act { width: 3rem; text-align: right; padding-right: 12px; }
    a.name { color: var(--mzo-text); text-decoration: none; font-weight: 500; }
    a.name:hover { color: var(--mzo-accent); text-decoration: underline; text-underline-offset: 2px; }
    button.copy { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--mzo-muted); cursor: pointer; }
    button.copy:hover { background: var(--mzo-hover); color: var(--mzo-text); }
    button.copy.done { color: var(--mzo-ok); }
    button.copy svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .empty { padding: 32px 16px; color: var(--mzo-muted); text-align: center; }
    .tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; line-height: 20px; color: var(--mzo-text-2); background: var(--mzo-surface-2); box-shadow: inset 0 0 0 1px var(--mzo-border); white-space: nowrap; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) { .sheet-container { padding: 16px 14px 56px; } .bar { flex-basis: 100%; } td.n, th.n { display: none; } td:nth-child(2), th:nth-child(2) { padding-left: 16px; } }
</style>
  <link rel="stylesheet" href="mzo_theme.css?v=23" />
</head>
<body>
  <div class="sheet-container">
    <div class="head">
      <div><h1>Sheet links</h1><p>Google Sheets behind each report</p></div>
      <label class="bar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Find a sheet" aria-label="Find a sheet" /></label>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th class="n">#</th>
            <th>Sheet</th>
            <th class="when">Updated</th>
            <th class="act"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No matching sheet.</div>
    </div>
  </div>
  <script src="mzo_data_hub.js?v=93"></script>
  <script src="/mzo_ui.js?v=20"></script>
  <script src="/mzo_rows.js?v=7"></script>
  <script src="/mzo_view.js?v=1"></script>
  <script>
    function allowed() {
      let profile = {};
      try { profile = JSON.parse(localStorage.getItem('mzo_user_profile') || '{}') || {}; } catch (e) { profile = {}; }
      if (!profile.Username && !profile.username) return false;
      if (String(profile.role || '').toLowerCase() === 'admin') return true;
      const flag = String(profile['sheets-autho'] != null ? profile['sheets-autho'] : (profile.sheets_autho || '')).trim().toLowerCase();
      return flag === 'list' || flag === 'edit' || flag === 'y' || flag === 'all';
    }
    if (!allowed()) location.replace('/app.html');

    function sheetOpenUrl(raw) {
      const url = String(raw || '');
      if (url.indexOf('docs.google.com/spreadsheets') === -1) return '';
      try {
        const parsed = new URL(url);
        const gid = parsed.searchParams.get('gid') || ((parsed.hash.match(/gid=(\d+)/) || [])[1] || '');
        const published = parsed.pathname.indexOf('/spreadsheets/d/e/') !== -1;
        const match = parsed.pathname.match(/\/spreadsheets\/d\/(?:e\/)?([^/]+)/);
        if (!match) return '';
        if (published) return 'https://docs.google.com/spreadsheets/d/e/' + match[1] + '/pubhtml' + (gid ? '?gid=' + encodeURIComponent(gid) : '');
        const edit = 'https://docs.google.com/spreadsheets/d/' + match[1] + '/edit';
        return gid ? edit + '?gid=' + encodeURIComponent(gid) + '#gid=' + gid : edit;
      } catch (e) { return ''; }
    }

    function formatWhen(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      const pad = function (n) { return String(n).padStart(2, '0'); };
      const asText = function (day, month, year) {
        if (!day || !month || !year) return '';
        const y = year < 100 ? 2000 + year : year;
        return pad(day) + '/' + pad(month) + '/' + y;
      };
      const slash = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
      if (slash && !/^\d{4}-/.test(s)) return asText(+slash[1], +slash[2], +slash[3]);
      const d = new Date(s);
      if (!Number.isNaN(d.getTime()) && (/[A-Za-z]/.test(s) || s.indexOf('T') !== -1 || /^\d{4}-/.test(s))) {
        return asText(d.getDate(), d.getMonth() + 1, d.getFullYear());
      }
      return '';
    }

    function dateFromVersion(ver) {
      const s = String(ver || '').trim();
      if (!s) return '';
      const report = s.split('|').map(function (p) { return p.trim(); }).find(function (p) {
        return /^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(p);
      });
      if (report) return formatWhen(report);
      const modified = s.match(/^m:([^|]+)/);
      if (modified) return formatWhen(modified[1]);
      const iso = s.match(/\d{4}-\d{2}-\d{2}T[0-9:.]+Z?/);
      if (iso) return formatWhen(iso[0]);
      return '';
    }

    const datasets = Array.isArray(window.MZO_DATASETS) ? window.MZO_DATASETS : [];
    const sheetFallback = {
      CACHE_NSC_v5: 'https://docs.google.com/spreadsheets/d/1QnmPKSAtwmW-m1-gn4qmZBWanx9_Vwbk63XhwyQBiKU/edit',
      CACHE_WITHHELD_v4: 'https://docs.google.com/spreadsheets/d/12nS8GAQ1weIMWoEIeydcdKTKd-XwHNu9W07DKudGuOg/edit'
    };
    const extras = [
      { name: 'Consumers', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT4ufTMHJGTUqNSqFSzz0q2x-ShM_WHlfSRxT4tVqA6GcaMK5g38PDLmcJR4JXuxLi-tKafW-Yxwdo/pub?gid=0&single=true&output=csv' },
      { name: 'Smart Meter', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjwUI4EUgEABlcggpdOS-WSPKY8my-5T0cLxT4h8tNz_IreQy6jUYKBnB5yc0n-fcs8FpVbwo6Qay/pub?gid=327926255&single=true&output=tsv' },
      { name: 'Upcoming DD', url: 'https://docs.google.com/spreadsheets/d/1aUeVnSc-OmFqqrUdoZxv8v8659u52zlIWddnpJgU9Uk/gviz/tq?tqx=out:csv&gid=487034861' },
      { name: 'DD Visit', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCKEl95dh4kyG-QPJbFJ5x7U7yo7h5bJGuMewsMr2hjMAlCj7UWxqvL_a-2hdyQd-laI8BAX3hU5_T/pub?gid=0&single=true&output=csv' },
      { name: 'DD Summary', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRawhIW9ICZmzuThsL5opfI40WY6upCg5kFzoFXi2UJPR-svO6_cByXy5Y3u_p-2La_tH8SxhFfl29B/pub?gid=220026293&single=true&output=csv' },
      { name: 'Accident Reports', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrrGeyElvh8i8QzTl25Ej7_RJZ9FJ0jicG3tAhguLEvky178oKZ8-QADKcBceUQ5CFjn7hd9eECVJ6/pub?output=csv' },
      { name: 'DTR Records', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZPPnIF-T7wgii6J35a-3Wz7RC86Zq-eMSQud795CVJV-92Vy9oJjO6TDpjpgiLNAVPcVn6X_keILV/pub?gid=2125422147&single=true&output=csv' },
      { name: 'Peak Load', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZPPnIF-T7wgii6J35a-3Wz7RC86Zq-eMSQud795CVJV-92Vy9oJjO6TDpjpgiLNAVPcVn6X_keILV/pub?gid=1835924766&single=true&output=csv' },
      { name: 'Substation Upkeeping', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSHoWw-c-KCfsYrkQs67uWaKdag1WXVQobLkngEK-bvbky_LMF6RWg-BwgVYA-5f3RcR4u6rQA5XWhH/pub?gid=422662764&single=true&output=csv' },
      { name: 'PRT / Transformer', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtpueyQwlq63VP2Tm2_vITV31jKBSceDGJQVJtYeqVVDBSg3QAHzLKrv60i6Z9oODXXzOE-fdfMb8b/pub?gid=0&single=true&output=csv' },
      { name: 'O&M Advance', key: 'OM_ADVANCE', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQPBYq0ZQpaAnu0Mp_qN5oGvklgIpjolyRPf3LfSojRaN-GBBBXKHslR9ue1DOv1432oP2PzYznUUmn/pub?gid=512034300&single=true&output=csv' }
    ];

    const skipSheet = {
      CACHE_VENDORS: 1,
      CACHE_LOSS_TARGET: 1
    };
    const byName = new Set();
    const rows = [];
    datasets.forEach(function (d) {
      // Uploaded on DISHA instead of kept in a sheet (CMO grievances): link the report page that takes the upload.
      const sheet = sheetOpenUrl(d.url) || sheetFallback[d.key] || '';
      const href = sheet || (d.uploadedOn ? new URL(d.uploadedOn, location.href).href : '');
      if (skipSheet[d.key] || !href || byName.has(d.label)) return;
      byName.add(d.label);
      rows.push({ key: d.key, name: d.label, href: href, updated: '', dates: {}, fixed: d.key === 'CACHE_JJM' ? 'As updated by RMs' : '', uploaded: !sheet });
    });
    extras.forEach(function (item) {
      const href = sheetOpenUrl(item.url);
      if (!href || byName.has(item.name)) return;
      byName.add(item.name);
      rows.push({ key: item.key || '', name: item.name, href: href, updated: '', dates: {}, fixed: '' });
    });
    rows.sort(function (a, b) { return a.name.localeCompare(b.name); });
    rows.forEach(function (row, i) { row.n = i + 1; });

    // A row's "Updated" date can come from several places. It shows the best one known so far, in this
    // order, so the result does not depend on which request finishes first:
    //   data      the dataset's own as-on date, read from its rows by the rule of its page (AS_ON below)
    //   report    the NSC report date (/api/nsc/meta)
    //   stored    the version this device stored for the dataset (DataHub)
    //   mirror    VM mirror: the date behind the copy's version (its meta, or the source's Last-Modified)
    //   meta      a date from the dataset's meta without a report date (NSC upload, defective, stock)
    //   versions  the server's version list (/api/hub/versions)
    const SOURCES = ['data', 'report', 'stored', 'mirror', 'meta', 'versions'];
    function best(row) {
      if (row.fixed) return row.fixed;
      const s = SOURCES.find(function (k) { return row.dates[k]; });
      return s ? row.dates[s] : '';
    }
    function offer(key, source, text) {
      const row = key && rows.find(function (r) { return r.key === key; });
      if (!row) return;
      if (text) row.dates[source] = text; else delete row.dates[source];
      const next = best(row);
      if (next === row.updated) return;
      row.updated = next;
      paint();
    }
    rows.forEach(function (row) {
      if (row.key) row.dates.stored = dateFromVersion(localStorage.getItem('mzo_hub_ver_' + row.key) || '');
      row.updated = best(row);
    });

    const body = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const q = document.getElementById('q');

    function paint() {
      const query = (q.value || '').trim().toLowerCase();
      body.textContent = '';
      let shown = 0;
      rows.forEach(function (row) {
        if (query && row.name.toLowerCase().indexOf(query) === -1) return;
        shown += 1;
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="n">' + row.n + '</td>' +
          '<td><a class="name" target="_blank" rel="noopener"></a></td>' +
          '<td class="when"></td>' +
          '<td class="act"><button type="button" class="copy" title="Copy link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg></button></td>';
        tr.querySelector('a').href = row.href;
        tr.querySelector('a').textContent = row.name;
        if (row.uploaded) tr.querySelector('a').insertAdjacentHTML('afterend', ' <span class="tag" title="No Google sheet: the export is uploaded on DISHA">Uploaded on DISHA</span>');
        tr.querySelector('.when').textContent = row.updated || '—';
        tr.querySelector('.copy').setAttribute('data-href', row.href);
        tr.querySelector('.copy').setAttribute('aria-label', 'Copy sheet link for ' + row.name);
        body.appendChild(tr);
      });
      empty.hidden = shown !== 0;
    }

    // VM mirror: the hub stores content hashes as versions, so a date that today comes from the stored
    // version is taken from where that version came from: the dataset's meta (report date or upload
    // time), or the source's Last-Modified (manifest sourceModifiedAt). It ranks below the stored
    // version and above the meta and version-list dates (SOURCES).
    function mirrorDates() {
      const hub = window.mzoDataHub;
      if (!hub || typeof hub.mirrorManifest !== 'function') return;
      hub.mirrorManifest(false).then(function (idx) {
        if (!idx) return;
        const metas = {};
        rows.forEach(function (row) {
          const d = datasets.find(function (x) { return x.key === row.key; });
          const hit = d && idx.hub[d.key];
          if (!hit || row.fixed) return;
          if (dateFromVersion(localStorage.getItem('mzo_hub_ver_' + d.key) || '')) return;
          let when;
          if (d.versionUrl) {
            if (!metas[d.versionUrl]) {
              metas[d.versionUrl] = fetch(d.versionUrl, { credentials: 'same-origin' })
                .then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; });
            }
            when = metas[d.versionUrl].then(function (m) {
              // In mirror mode `version` is the copy's hash; liveVersions keeps the value it replaced.
              const field = d.versionField || 'version';
              const live = (m && m.liveVersions) || {};
              const v = m && (live[field] || live.version || m[field] || m.version);
              return v ? dateFromVersion('v:' + v) : '';
            });
          } else {
            when = Promise.resolve(hit.e.sourceModifiedAt ? formatWhen(hit.e.sourceModifiedAt) : '');
          }
          when.then(function (text) { offer(row.key, 'mirror', text); });
        });
      }).catch(function () {});
    }

    q.addEventListener('input', paint);
    body.addEventListener('click', function (e) {
      const btn = e.target.closest('.copy');
      if (!btn) return;
      e.preventDefault();
      const href = btn.getAttribute('data-href') || '';
      const mark = function () {
        btn.classList.add('done');
        setTimeout(function () { btn.classList.remove('done'); }, 1200);
      };
      const fallback = function () {
        const area = document.createElement('textarea');
        area.value = href;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.left = '-9999px';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); } catch (err) {}
        area.remove();
        mark();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        let settled = false;
        navigator.clipboard.writeText(href).then(function () {
          settled = true;
          mark();
        }).catch(function () {
          settled = true;
          fallback();
        });
        setTimeout(function () { if (!settled) fallback(); }, 400);
      } else {
        fallback();
      }
    });
    paint();
    mirrorDates();

    fetch('/api/hub/versions', { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        // Mirror mode: versions are the copies' hashes; liveVersions keeps the dated ones they replaced.
        const versions = Object.assign({}, data && data.versions, data && data.liveVersions);
        Object.keys(versions).forEach(function (key) {
          offer(key, 'versions', dateFromVersion(versions[key]));
        });
      })
      .catch(function () {});

    fetch('/api/nsc/meta', { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        const meta = (data && data.meta) || {};
        const reportWhen = meta.reportDate || (meta.stats && meta.stats.today) || '';
        ['CACHE_NSC_v5', 'CACHE_WITHHELD_v4'].forEach(function (key) {
          offer(key, 'report', formatWhen(reportWhen));
          offer(key, 'meta', reportWhen ? '' : formatWhen(meta.uploadedAt || ''));
        });
      })
      .catch(function () {});

    fetch('/api/defective/meta', { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        const meta = (data && data.uploadMeta) || {};
        const when = formatWhen(meta.uploadedAt || meta.reportAsOn || (data && data.version) || '');
        offer('CACHE_DEFECTIVE', 'meta', when);
        offer('CACHE_DEFECTIVE_DETAILS', 'meta', when);
      })
      .catch(function () {});

    fetch('/api/stock/meta', { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        const meta = (data && data.meta) || {};
        offer('CACHE_STOCK_METADATA', 'meta', formatWhen(meta.reportDate || (meta.stats && meta.stats.today) || ''));
      })
      .catch(function () {});

    // ---- as-on rules: the dataset's own date, from its uniform rows (docs/uniform-data.md) ----
    // Each rule is the one the dataset's page uses for its "As on" date, over every row of the sheet
    // (t.all / t.first: not only the login's offices), so this column shows the date the page shows.
    // A rule returns dd/mm/yyyy, or '' when the rows hold no date.
    const pad = function (n) { return String(n).padStart(2, '0'); };
    function dmy(d) { return d && !isNaN(d.getTime()) ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : ''; }
    function newest(t, dateOf) {
      let last = null;
      t.all.forEach(function (r) { const d = dateOf(r); if (d && (!last || d > last)) last = d; });
      return dmy(last);
    }
    function hasColumn(t, name) { return t.columns.some(function (c) { return c.name === name && c.source_name; }); }
    // bharatnet.html / icds.html asOnOf(): one cell (N2 / M2), dd.mm.yyyy
    function cellDate(t, field) {
      const m = String(t.first(field) || '').match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      return m ? pad(+m[1]) + '/' + pad(+m[2]) + '/' + (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : '';
    }
    // disconnection.html actionDate(): PAID/DISCON DATE, dd.mm.yyyy; blank, #N/A or 0 is no action
    function actionDate(r) {
      const iso = r.paid_discon_date;
      const s = iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : r.paid_discon_date_raw || '';
      if (s === '' || s.toLowerCase() === '#n/a' || s === '0') return null;
      const p = s.split('.');
      if (p.length !== 3) return null;
      const d = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
      return isNaN(d.getTime()) ? null : d;
    }
    // docket.html when(): "dd/mm/yyyy hh:mm:ss" (seconds sometimes dotted)
    function docketWhen(s) {
      const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[.:](\d{1,2})(?:[.:](\d{1,2}))?)?/);
      return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : null;
    }
    // collection.html ymd(): PAYMENT_DT, a yyyymmdd number
    function paymentDate(v) {
      const s = v == null ? '' : String(v).trim();
      if (s.length < 8) return null;
      const d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
      return isNaN(d) ? null : d;
    }
    // pmsgy.html asOnOf(): the newest Last Action Date of an application (not the glossary row)
    function pmsgyAsOn(t) {
      if (!hasColumn(t, 'application_number')) return '';
      return newest(t, function (r) { const f = r.sl_no; return f && !/^logic$/i.test(f) && r.application_number ? UI.date(r.last_action_date) : null; });
    }
    // feeder_outage.html prepare(): the last day of the newest REPORT MONTH (yyyymm) of a feeder row
    function feederAsOn(t) {
      if (!hasColumn(t, 'report_month')) return '';
      let last = '';
      t.all.forEach(function (r) { const m = r.report_month.replace(/\D/g, '').slice(0, 6); if (m.length === 6 && r.feeder_name && m > last) last = m; });
      if (!last) return '';
      const y = +last.slice(0, 4), m = +last.slice(4, 6);
      return pad(new Date(Date.UTC(y, m, 0)).getUTCDate()) + '/' + pad(m) + '/' + y;
    }
    // registry key → [uniform rows key, rule]
    const AS_ON = {
      CACHE_DISCONNECTION: ['disconnection', function (t) { return newest(t, actionDate); }], // disconnection.html
      CACHE_DOCKET: ['docket_calls', function (t) { return newest(t, function (r) { return r.doc_no ? docketWhen(r.doc_crn_dt) : null; }); }], // docket.html
      CACHE_CAPEX: ['capex_details', function (t) { // capex_all.html: the newest Reporting Date of a line
        return hasColumn(t, 'net_balance_value') ? newest(t, function (r) { return r.project_id || r.material_code ? UI.date(r.reporting_date) : null; }) : '';
      }],
      CACHE_PENDING_MC: ['pending_mc', function (t) { return newest(t, function (r) { return r.region || r.appl_no ? UI.date(r.report_date) : null; }); }], // pending_mc.html
      CACHE_CMO: ['cmo_grievances', function (t) { return dmy(UI.date(t.first('report_date'))); }], // cmo.html: the first row's Report Date
      CACHE_COLLECTION: ['collection_report', function (t) { return newest(t, function (r) { return r.ccc_code ? paymentDate(r.payment_dt) : null; }); }], // collection.html
      CACHE_BHARATNET: ['bharatnet_connections', function (t) { return cellDate(t, 'upadte_date'); }],
      CACHE_ICDS_APLUS: ['icds_a_plus', function (t) { return cellDate(t, 'update_date'); }],
      CACHE_ICDS_A: ['icds_a', function (t) { return cellDate(t, 'update_date'); }],
      CACHE_PMSGY_MALDA: ['pmsgy_malda', pmsgyAsOn],
      CACHE_PMSGY_UD: ['pmsgy_uttar_dinajpur', pmsgyAsOn],
      CACHE_PMSGY_DD: ['pmsgy_dakshin_dinajpur', pmsgyAsOn],
      CACHE_LOSS: ['loss_report', function (t) { return dmy(UI.date(t.first('update_on'))); }], // loss.html: cell J2
      CACHE_FEEDER_OUTAGE: ['feeder_outage', feederAsOn],
      OM_ADVANCE: ['onm_advance', function (t) { return newest(t, function (r) { return r.order_number ? UI.date(r.creation_date) : null; }); }] // advance_onm.html
    };
    // ---- end of as-on rules ----

    function offerData(key, text) {
      offer(key, 'data', text);
      if (key === 'CACHE_FEEDER_OUTAGE' && text) { try { localStorage.setItem('mzo_feeder_outage_as_on', text); } catch (e) {} }
    }
    function loadRows(keys) {
      keys.forEach(function (key) {
        if (!window.MzoRows || !rows.some(function (r) { return r.key === key; })) return;
        MzoRows.load(AS_ON[key][0], function (t) { offerData(key, t ? AS_ON[key][1](t) : ''); }, { scope: false });
      });
    }
    // VM: these same rules, run on the server once per sync (vm/sync/lib/views/sheet_links_dates.js), so
    // the page downloads 15 dates instead of 15 datasets; a dataset the view lacks loads as before.
    if (window.MzoView) {
      let viewed = {};
      MzoView.load('sheet_links_dates', function (v) {
        viewed = v.dates || {};
        Object.keys(viewed).forEach(function (key) { if (AS_ON[key]) offerData(key, viewed[key]); });
      }).then(function (ok) {
        loadRows(Object.keys(AS_ON).filter(function (key) { return !ok || !(key in viewed); }));
      });
    } else loadRows(Object.keys(AS_ON));
  </script>
</body>
</html>
