<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending master card · DISHA</title>
  <script src="/mzo_theme.js?v=7"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=9" />
  <script src="/mzo_ui.js?v=10" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .mc-copy { margin-left: auto; }
    #ui-drawer header .mc-copy + [data-x] { margin-left: 4px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div><h1>Pending master card<span class="ui-badge ui-date" id="asOn">…</span></h1></div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="syncBtn" hidden><svg class="ui-i"><use href="#ui-sync"/></svg>Sync sheet</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h"><h2>Filters<small id="activeLabel"></small></h2><button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button></div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Application, consumer ID or name" aria-label="Search by application, consumer ID or name" autocomplete="off" /></label>
        </div>
        <div class="ui-side-sec"><div id="fPhase" aria-label="Phase"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Group">
            <button type="button" role="tab" data-pane="fAge" aria-pressed="true" aria-selected="true">Days since meter</button>
            <button type="button" role="tab" data-pane="fClass" aria-pressed="false" aria-selected="false">Class</button>
          </div>
          <div id="fAge" aria-label="Days since meter installed"></div>
          <div id="fClass" aria-label="Class" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="WithinMonth"><div class="k"><span class="ui-dot ok"></span>Within 30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="Delayed"><div class="k"><span class="ui-dot bad"></span>90 days or more</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="Industrial"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed report</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="drill"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'CACHE_PENDING_MC', ROWS = 'pending_mc';
    var CLASS = { D: 'Domestic', C: 'Commercial', I: 'Industrial', A: 'Agriculture', T: 'Temporary', J: 'Public', P: 'Public', W: 'Water works' };
    var AGE = [
      { key: 'a0', label: 'Up to 7 days', max: 7, dot: 'ok' },
      { key: 'a1', label: '8–30 days', max: 30, dot: 'ok' },
      { key: 'a2', label: '31–60 days', max: 60, dot: 'warn' },
      { key: 'a3', label: '61–89 days', max: 89, dot: 'warn' },
      { key: 'a4', label: '90 days or more', max: Infinity, dot: 'bad' }
    ];
    var STAT = {
      WithinMonth: function (r) { return r.days != null && r.days <= 30; },
      Delayed: function (r) { return r.days != null && r.days >= 90; },
      Industrial: function (r) { return r.cls === 'I'; }
    };
    var all = [], f = { q: '', stat: '', age: '', cls: '', phase: '' }, shown = '';
    // Region → Division → CCC → Agency → applications
    var dr = UI.drill({ el: 'drill', root: 'Malda Zone', onChange: render, levels: [
      { k: 'region', label: 'Region', field: '_region' }, { k: 'division', label: 'Division', field: '_divn' },
      { k: 'ccc', label: 'CCC', field: '_supp' }, { k: 'agency', label: 'Agency', field: 'agency' }] });
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function keep(d) { return d.region || d.appl_no; }

    // t.rows: uniform rows of schema/pending_mc.json (snake_case, numbers, ISO dates, canonical
    // _region/_division/_ccc), already scoped to the login by MzoRows.
    function prepare(t) {
      var latest = null;
      t.all.forEach(function (d) { var rep = keep(d) && UI.date(d.report_date); if (rep && (!latest || rep > latest)) latest = rep; }); // the sheet's date, not the scope's
      all = t.rows.filter(keep).map(function (d) {
        var rep = UI.date(d.report_date), inst = UI.date(d.meter_installation_date);
        var r = {
          appl: d.appl_no, con: d.con_id,
          name: [d.fname, d.lname].filter(function (x) { return !UI.blank(x); }).map(UI.title).join(' '),
          address: [d.addr1, d.addr2].filter(function (x) { return !UI.blank(x); }).join(', '),
          _region: d._region || UI.regionName(d.region), _divn: d._division || UI.title(d.division), _supp: d._ccc || d.ccc, CCC_CODE: d.substr_a_supp_off_7_7,
          cls: d.class.toUpperCase(), desc: UI.blank(d.desc) ? '' : UI.title(d.desc),
          phase: d.phase.toUpperCase(), load: d.load || 0,
          tariff: UI.blank(d.tariff_class) ? '' : d.tariff_class, type: UI.blank(d.prob_type) ? '' : d.prob_type,
          agency: UI.blank(d.wo_assignee_type) ? 'Individual' : UI.title(d.wo_assignee_type),
          wo: UI.blank(d.wo_no) ? '' : d.wo_no, woStatus: d.wo_status === 'C' ? 'Completed' : '',
          collected: d.coll_date, installed: inst, report: rep,
          area: d.catg === 'U' ? 'Urban' : d.catg === 'R' ? 'Rural' : ''
        };
        r.days = rep && inst ? Math.round((rep - inst) / 864e5) : null;
        r.ageKey = r.days == null ? '' : AGE.filter(function (b) { return r.days <= b.max; })[0].key;
        r.label = CLASS[r.cls] || r.desc || r.cls || '—';
        return r;
      });
      $('asOn').textContent = latest ? 'As on ' + UI.fmtDate(latest) : UI.n(all.length) + ' pending';
    }

    // Every panel filter; `skip` leaves one facet out so it can count its own options.
    function base(skip) {
      var q = f.q.toLowerCase();
      return all.filter(function (r) {
        return dr.match(r) &&
          (skip === 'cls' || !f.cls || r.cls === f.cls) && (skip === 'phase' || !f.phase || r.phase === f.phase) && (skip === 'age' || !f.age || r.ageKey === f.age) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }

    function facets() {
      var cnt = function (rows, fn) { return rows.filter(fn).length; };
      var ph = base('phase'), ag = base('age'), cl = base('cls');
      UI.facet('fPhase', [{ value: 'I', label: 'Single phase', count: cnt(ph, function (r) { return r.phase === 'I'; }) }, { value: 'III', label: 'Three phase', count: cnt(ph, function (r) { return r.phase === 'III'; }) }], f.phase, function (v) { f.phase = v; render(); });
      UI.facet('fAge', AGE.map(function (a) { return { value: a.key, label: a.label, dot: a.dot, count: cnt(ag, function (r) { return r.ageKey === a.key; }) }; }), f.age, function (v) { f.age = v; render(); });
      var cls = {}, names = {}; cl.forEach(function (r) { cls[r.cls] = (cls[r.cls] || 0) + 1; names[r.cls] = r.label; });
      var keys = Object.keys(cls).filter(Boolean); if (f.cls && keys.indexOf(f.cls) === -1) keys.push(f.cls);
      UI.facet('fClass', keys.sort(function (a, b) { return (cls[b] || 0) - (cls[a] || 0); }).map(function (c) { return { value: c, label: names[c] || CLASS[c] || c, count: cls[c] || 0 }; }), f.cls, function (v) { f.cls = v; render(); });
      var on = (f.q ? 1 : 0) + ['phase', 'age', 'cls'].filter(function (k) { return f[k]; }).length;
      setActive(on, { fAge: f.age, fClass: f.cls });
    }
    function render() {
      var b = base();
      facets();
      var view = b.filter(function (r) { return !f.stat || STAT[f.stat](r); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? b.filter(STAT[k]).length : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? UI.pct(c, b.length) + ' of pending' : 'Across ' + UI.uniq(b, '_supp').length + ' CCCs';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      // Detailed report: offices and agencies down the path, then the applications
      if (dr.level() !== shown) { $('table').__ui = null; shown = dr.level(); }
      if (dr.isList()) {
        UI.table('table', { rows: view, sort: { key: 'days', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      } else {
        var groups = {}, isAgency = dr.level() === 'agency';
        view.forEach(function (r) {
          var k = dr.key(r), g = groups[k] || (groups[k] = { name: k, parent: dr.parent(r), row: r, n: 0, late: 0 });
          g.n++; if (STAT.Delayed(r)) g.late++;
        });
        var list = Object.keys(groups).map(function (k) { return groups[k]; }), max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
        UI.table('table', {
          rows: list, sort: { key: 'n', dir: 'desc' }, count: isAgency, limit: isAgency ? 50 : 0,
          empty: 'Nothing pending for these filters.',
          columns: [
            { key: 'name', label: dr.label(), cls: isAgency ? 'wrap' : '', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Pending', num: true, fmt: UI.n },
            { key: 'late', label: '90+ days', num: true, fmt: UI.n },
            { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '30%' }
          ],
          foot: list.length > 1 ? { n: view.length, late: view.filter(STAT.Delayed).length } : null,
          onRow: function (g) { dr.open(g.name, g.row); }
        });
      }
      dr.paint({ list: view.length });
      renderReportHead(view);
      window.__view = view;
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var label = dr.isList() ? 'Applications' : dr.label() + ' wise report';
      var kpiLabels = { WithinMonth: 'Within 30 days', Delayed: '90 days or more', Industrial: 'Industrial' };
      var kpiLabel = f.stat && kpiLabels[f.stat] ? kpiLabels[f.stat] : '';

      $('rhTitle').textContent = label + (kpiLabel ? ' · ' + kpiLabel : '');

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> applications';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' applications';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if (f.phase) {
        currentActiveFilters.push({ label: 'Phase', value: f.phase === 'III' ? 'Three phase' : 'Single phase', clear: function () { f.phase = ''; } });
      }
      if (f.age) {
        var ab = AGE.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Age', value: ab ? ab.label : f.age, clear: function () { f.age = ''; } });
      }
      if (f.cls) {
        currentActiveFilters.push({ label: 'Class', value: CLASS[f.cls] || f.cls, clear: function () { f.cls = ''; } });
      }
      if (f.stat && kpiLabels[f.stat]) {
        currentActiveFilters.push({ label: 'KPI', value: kpiLabels[f.stat], clear: function () { f.stat = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'name', label: 'Name', hideSm: true, cls: 'wrap' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'label', label: 'Class', hideSm: true, fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + (r.phase === 'III' ? 'Three phase' : r.phase === 'I' ? 'Single phase' : '') + '</span>'; } },
      { key: 'load', label: 'Load', num: true, hideSm: true, fmt: function (v) { return v ? UI.n(v) : '—'; } },
      { key: 'agency', label: 'Agency', hideSm: true, cls: 'wrap' },
      { key: 'installed', label: 'Meter installed', num: true, hideSm: true, sortVal: function (r) { return r.installed ? r.installed.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return UI.fmtDate(r.installed); } },
      { key: 'days', label: 'Days', num: true, sortVal: function (r) { return r.days == null ? -1 : r.days; }, fmt: function (v) { return v == null ? '—' : (v >= 90 ? '<span class="ui-badge bad">' + UI.n(v) + '</span>' : v > 30 ? '<span class="ui-badge warn">' + UI.n(v) + '</span>' : UI.n(v)); }, csv: function (r) { return r.days == null ? '' : r.days; } }
    ];

    var current = null;
    function pairs(r) {
      return [
        ['Consumer ID', r.con], ['Name', r.name], ['Address', r.address], ['Class', r.label + (r.area ? ' · ' + r.area : '')],
        ['Phase', r.phase === 'III' ? 'Three phase' : r.phase === 'I' ? 'Single phase' : ''], ['Load', r.load ? UI.n(r.load) : ''], ['Tariff', r.tariff],
        ['Connection type', r.type], ['Collected on', UI.blank(r.collected) ? '' : UI.fmtDate(r.collected)], ['Meter installed', UI.fmtDate(r.installed)],
        ['Days pending', r.days == null ? '' : UI.n(r.days)], ['Agency', r.agency], ['Work order', r.wo + (r.woStatus ? ' · ' + r.woStatus : '')],
        ['Region', r._region], ['Division', r._divn], ['CCC', r._supp], ['Report date', UI.fmtDate(r.report)]
      ];
    }
    function detail(r) {
      current = r;
      UI.drawer('Application ' + (r.appl || '—'), [r._supp, r._divn].filter(Boolean).join(' · '), pairs(r), '',
        '<button type="button" class="ui-btn sm" data-mc-copy>' + UI.icon('copy') + 'Copy</button>');
    }
    document.addEventListener('click', function (e) {
      if (!current || !e.target.closest('[data-mc-copy]')) return;
      var lines = ['*Pending master card — ' + current.appl + '*'].concat(pairs(current).filter(function (p) { return !UI.blank(p[1]); }).map(function (p) { return p[0] + ': ' + p[1]; }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Details copied'); });
    });

    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    function clearAll() {
      f.q = ''; f.stat = ''; f.age = ''; f.cls = ''; f.phase = ''; $('q').value = '';
      render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('pending-master-card.csv', [
        { key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' },
        { key: 'label', label: 'Class' }, { key: 'phase', label: 'Phase' }, { key: 'load', label: 'Load' }, { key: 'agency', label: 'Agency' },
        { key: 'wo', label: 'Work order' }].concat(APP_COLS.slice(6)), window.__view || []);
    });

    function reload(t) { if (t) { prepare(t); render(); } }
    MzoRows.refresh('refreshBtn', ROWS, reload);

    // Sync from the Google Sheet (authorised users only)
    fetch('/api/pending-mc/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) { if (m && (m.canSync || m.isAdmin)) $('syncBtn').hidden = false; }).catch(function () {});
    $('syncBtn').addEventListener('click', function () {
      if (!confirm('Pull the latest pending master cards from the Google Sheet now?')) return;
      var b = this; b.disabled = true; b.classList.add('spin');
      fetch('/api/pending-mc/sync', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' } })
        .then(function (r) { return r.json().catch(function () { return { status: 'error', message: r.status === 401 ? 'Session expired. Sign in again.' : 'HTTP ' + r.status }; }); })
        .then(function (d) {
          if (d.status !== 'success') throw new Error(d.message || 'Sync failed');
          try { localStorage.removeItem('mzo_hub_ver_' + KEY); localStorage.removeItem('mzo_hub_ver_CACHE_PENDING_MC_PARSED'); } catch (e) {}
          return Promise.resolve(window.mzoDataHub.delete('CACHE_PENDING_MC_PARSED')).catch(function () {})
            .then(function () { return MzoRows.reload(ROWS); });
        })
        .then(function (t) { reload(t); UI.toast('Synced from the sheet'); })
        .catch(function (e) { UI.toast(e.message || 'Sync failed'); })
        .then(function () { b.disabled = false; b.classList.remove('spin'); });
    });

    // Deep links: ?kpiFilter=Delayed|Industrial|WithinMonth, ?region=, ?division=, ?ccc= (open the report there)
    var params = new URLSearchParams(location.search), first = true;
    MzoRows.load(ROWS, function (t, info) {
      if (!t) { if (info && info.error) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        var k = params.get('kpiFilter'); if (STAT[k]) f.stat = k;
        dr.fromParams(params, all);
      }
      render();
    });
  });
  </script>
</body>
</html>
