<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safety inspection · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .si-desc { max-width: 380px; white-space: normal; color: var(--mzo-text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Safety inspection</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="countBy" role="group" aria-label="Count by">
          <button type="button" data-g="Site ID" aria-pressed="true">By site</button>
          <button type="button" data-g="Inspection ID" aria-pressed="false">By inspection</button>
        </div>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Location, issue or inspector" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="catFilter" aria-label="Issue type"><option value="">All issue types</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Inspected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="done"><div class="k"><span class="ui-dot ok"></span>Rectified</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="open"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <div class="ui-stat"><div class="k">Per week</div><div class="v" id="sWeek"><span class="ui-skel"></span></div><div class="s" id="sWeekS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">This week</div><div class="v" id="sNow"><span class="ui-skel"></span></div><div class="s" id="sNowS">&nbsp;</div></div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel">
        <div class="ui-panel-h"><h2>Pending by issue</h2></div>
        <div class="ui-panel-b"><div id="catHist"></div></div>
      </section>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2>Monthly progress</h2><span class="ui-note" id="weekNote"></span></div>
      <div class="ui-panel-b"><div id="weekChart"><div class="ui-empty">Loading…</div></div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="listTitle">Pending items <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var raw = [], all = [], groupBy = 'Site ID', status = 'open', level = 'region', weeks = 1, scope = null;

    function category(d) {
      var s = String(d || '').toLowerCase();
      if (s.indexOf('spacer') !== -1) return 'Spacer';
      if (s.indexOf('lt kiosk') !== -1) return 'LT kiosk';
      if (s.indexOf('ht 11 kv') !== -1) return 'HT 11 kV';
      if (s.indexOf('ht 33 kv') !== -1) return 'HT 33 kV';
      if (s.indexOf('lt') !== -1 || s.indexOf('low tension') !== -1) return 'Other LT';
      return 'Other';
    }
    function monday(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var day = x.getDay(); x.setDate(x.getDate() - day + (day === 0 ? -6 : 1)); return x; }

    function build() {
      var seen = {};
      all = raw.filter(function (r) { var k = r[groupBy]; if (seen[k]) return false; seen[k] = 1; return true; }).map(function (r) {
        var m = String(r.Office || '').match(/\((\d+)\)\s*$/), code = m ? m[1] : '';
        var o = UI.office(code);
        var done = UI.date(r['Rectification done on']);
        var x = {
          office: UI.title(String(r.Office || '').replace(/\s*\(\d+\)\s*$/, '')), code: code,
          _region: o.region, _divn: o.division, _supp: o.ccc, CCC_CODE: code,
          location: String(r.Location || '').trim(), text: String(r.Description || '').trim(), cat: category(r.Description),
          by: String(r['Inspection By'] || '').trim(), entered: UI.date(r['Entered on']), inspected: UI.date(r['Inspected on']),
          doneBy: String(r['Rectification done by'] || '').trim(), doneOn: done, remarks: String(r.Remarks || '').trim(),
          state: String(r.Status || '').trim(), site: r['Site ID'], insp: r['Inspection ID'], image: String(r.Image || '').trim()
        };
        x.done = !!done;
        x.days = x.done ? null : UI.days(x.entered);
        x.search = (x.location + ' ' + x.text + ' ' + x.by + ' ' + x.office).toLowerCase();
        return x;
      });
      if (window.MzoScope) all = MzoScope.filterRows(all);
      var dates = [];
      all.forEach(function (x) { if (x.entered) dates.push(x.entered.getTime()); if (x.doneOn) dates.push(x.doneOn.getTime()); });
      var lo = dates.length ? Math.min.apply(null, dates) : 0, hi = dates.length ? Math.max.apply(null, dates) : 0;
      weeks = Math.max(1, (hi - lo) / 864e5 / 7);
      $('meta').textContent = (lo ? UI.fmtDate(new Date(lo)) + ' – ' + UI.fmtDate(new Date(hi)) + ' · ' : '') + UI.n(all.length) + (groupBy === 'Site ID' ? ' sites' : ' inspections');
      var cats = {}; all.forEach(function (x) { cats[x.cat] = 1; });
      UI.fill('catFilter', Object.keys(cats).sort(), 'All issue types');
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      ['regionFilter', 'divisionFilter', 'cccFilter', 'catFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    function base() {
      var q = $('q').value.trim().toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, cat = $('catFilter').value;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!cat || r.cat === cat) && (!q || r.search.indexOf(q) !== -1);
      });
    }
    var STATUS = { '': function () { return true; }, done: function (r) { return r.done; }, open: function (r) { return !r.done; } };

    function render() {
      var b = base(), view = b.filter(STATUS[status]);
      var thisMon = monday(new Date()), nextMon = new Date(thisMon.getTime() + 7 * 864e5);
      [].forEach.call(document.querySelectorAll('#stats button.ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = b.filter(STATUS[k]).length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k === 'done' ? UI.pct(c, b.length) + ' complete' : k === 'open' ? UI.pct(c, b.length) + ' still open' : (groupBy === 'Site ID' ? 'Unique sites' : 'All inspections');
        el.setAttribute('aria-pressed', String(status === k));
      });
      var nowN = b.filter(function (r) { return r.entered && r.entered >= thisMon && r.entered < nextMon; }).length;
      $('sWeek').textContent = (b.length / weeks).toFixed(1);
      $('sWeekS').textContent = 'inspected · ' + (b.filter(STATUS.done).length / weeks).toFixed(1) + ' rectified';
      $('sNow').textContent = UI.n(nowN);
      $('sNowS').textContent = 'from ' + UI.fmtDate(thisMon);

      // Offices
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      b.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var x = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, done: 0, week: 0, last: null });
        x.n++; if (r.done) x.done++;
        if (r.entered) { if (r.entered >= thisMon && r.entered < nextMon) x.week++; if (!x.last || r.entered > x.last) x.last = r.entered; }
      });
      var list = Object.keys(g).map(function (k) { var x = g[k]; x.open = x.n - x.done; x.perWk = x.n / weeks; return x; });
      var tot = { n: b.length, done: b.filter(STATUS.done).length, week: nowN };
      tot.open = tot.n - tot.done;
      UI.table('officeTable', {
        rows: list, sort: { key: 'open', dir: 'desc' }, count: false, empty: 'No inspections for these filters.',
        columns: [
          { key: 'name', label: { region: 'Region', division: 'Division', ccc: 'CCC' }[level], fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Inspected', num: true, fmt: UI.n },
          { key: 'open', label: 'Pending', num: true, fmt: UI.n },
          { key: 'rate', label: 'Rectified', sortVal: function (x) { return x.n ? x.done / x.n : 0; }, fmt: function (_, x) { return UI.bar(x.done, x.n, UI.pct(x.done, x.n, 0)); }, width: '24%' },
          { key: 'week', label: 'This week', num: true, fmt: UI.n, hideSm: true },
          { key: 'perWk', label: 'Per week', num: true, fmt: function (v) { return v.toFixed(1); }, hideSm: true },
          { key: 'last', label: 'Last inspection', num: true, hideSm: true, sortVal: function (x) { return x.last ? x.last.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; } }
        ],
        foot: list.length > 1 ? { n: tot.n, open: tot.open, done: tot.done, rate: 0, week: tot.week, perWk: tot.n / weeks, last: null } : null,
        onRow: function (x) { drill(x.name); }
      });

      var cats = {};
      b.filter(STATUS.open).forEach(function (r) { cats[r.cat] = (cats[r.cat] || 0) + 1; });
      UI.hist('catHist', Object.keys(cats).sort(function (a, c) { return cats[c] - cats[a]; }).map(function (k) { return { key: k, label: k, value: cats[k] }; }),
        { active: $('catFilter').value, onClick: function (row) { $('catFilter').value = $('catFilter').value === row.key ? '' : row.key; UI.mark($('catFilter')); render(); } });

      // Monthly: inspected (by entry date) and rectified (by rectification date), whole span
      var w = {}, mk = function (d) { return d.getFullYear() * 100 + d.getMonth() + 1; };
      b.forEach(function (r) {
        if (r.entered) { var k1 = mk(r.entered); (w[k1] || (w[k1] = { i: 0, r: 0 })).i++; }
        if (r.doneOn) { var k2 = mk(r.doneOn); (w[k2] || (w[k2] = { i: 0, r: 0 })).r++; }
      });
      var present = Object.keys(w).map(Number).sort(function (a, c) { return a - c; }), keys = [];
      if (present.length) for (var k = present[0]; k <= present[present.length - 1]; k = k % 100 === 12 ? k + 89 : k + 1) { keys.push(k); if (!w[k]) w[k] = { i: 0, r: 0 }; }
      var MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var narrow = ($('weekChart').clientWidth || 900) < 560;
      var lab = keys.map(function (k) { return MN[k % 100 - 1] + (narrow ? '' : ' ' + String(Math.floor(k / 100)).slice(2)); });
      $('weekNote').textContent = keys.length ? keys.length + ' months' : '';
      UI.line('weekChart', {
        labels: lab, // UI.line thins crowded labels; blanking them here also blanked the tooltip
        series: [{ label: 'Rectified', values: keys.map(function (k) { return w[k].r; }) }, { label: 'Inspected', values: keys.map(function (k) { return w[k].i; }), strong: true }],
        fmt: UI.n, axis: function (v) { return UI.n(v); }, title: 'Monthly progress'
      });

      $('listTitle').firstChild.textContent = (status === 'open' ? 'Pending items ' : status === 'done' ? 'Rectified items ' : 'All items ');
      $('listCount').textContent = UI.n(view.length);
      UI.table('listTable', { rows: view, sort: status === 'done' ? { key: 'doneOn', dir: 'desc' } : { key: 'days', dir: 'desc' }, limit: 50, resetPage: true, empty: 'Nothing here.', columns: status === 'open' ? COLS.slice(0, 6) : COLS, onRow: detail });
      window.__view = view;
      $('clearBtn').hidden = !($('q').value || $('catFilter').value || status !== 'open' || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    var COLS = [
      { key: 'location', label: 'Location', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.cat) + '</span>'; } },
      { key: 'text', label: 'Issue', hideSm: true, fmt: function (v) { return '<div class="si-desc">' + UI.esc(v || '—') + '</div>'; } },
      { key: 'office', label: 'Office', fmt: function (v, r) { return UI.esc(r._supp || v) + '<span class="sub">' + UI.esc(r._divn || r._region) + '</span>'; } },
      { key: 'by', label: 'Inspected by', hideSm: true },
      { key: 'entered', label: 'Entered', num: true, hideSm: true, sortVal: function (r) { return r.entered ? r.entered.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.entered ? UI.fmtDate(r.entered) : ''; } },
      { key: 'days', label: 'Status', num: true, sortVal: function (r) { return r.done ? -1 : (r.days || 0); }, fmt: function (v, r) { return r.done ? '<span class="ui-badge ok">Rectified</span>' : '<span class="ui-badge ' + (v >= 30 ? 'bad' : 'warn') + '">' + UI.age(v) + '</span>'; }, csv: function (r) { return r.done ? 'Rectified' : 'Pending ' + r.days + ' days'; } },
      { key: 'doneOn', label: 'Rectified on', num: true, hideSm: true, sortVal: function (r) { return r.doneOn ? r.doneOn.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (r) { return r.doneOn ? UI.fmtDate(r.doneOn) : ''; } }
    ];

    function detail(r) {
      UI.drawer(r.location || 'Inspection', [r._supp || r.office, r._divn].filter(Boolean).join(' · '), [
        ['Status', r.done ? 'Rectified' : 'Pending for ' + UI.age(r.days)], ['Issue', r.text], ['Issue type', r.cat],
        ['Inspected by', r.by], ['Inspected on', r.inspected ? UI.fmtDate(r.inspected) : ''], ['Entered on', r.entered ? UI.fmtDate(r.entered) : ''],
        ['Rectified by', r.doneBy], ['Rectified on', r.doneOn ? UI.fmtDate(r.doneOn) : ''], ['Remarks', r.remarks], ['App status', r.state],
        ['Site ID', r.site], ['Inspection ID', r.insp], ['Photo', r.image], ['Office', r.office]
      ]);
    }

    function drill(name) {
      if (level === 'region') { if ($('regionFilter').disabled) return; $('regionFilter').value = name; $('divisionFilter').value = ''; $('cccFilter').value = ''; level = 'division'; }
      else if (level === 'division') { if ($('divisionFilter').disabled) return; $('divisionFilter').value = name; $('cccFilter').value = ''; level = 'ccc'; }
      else { if ($('cccFilter').disabled) return; $('cccFilter').value = $('cccFilter').value === name ? '' : name; }
      fillFilters(); setLevel(level);
    }
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') { $('divisionFilter').value = ''; $('cccFilter').value = ''; }
        if (id === 'divisionFilter') $('cccFilter').value = '';
        fillFilters(); render();
      });
    });
    $('catFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('q').addEventListener('input', UI.debounce(render, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('button.ui-stat'); if (s) { status = s.getAttribute('data-k'); render(); } });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('countBy').addEventListener('click', function (e) {
      var bt = e.target.closest('button'); if (!bt) return;
      groupBy = bt.getAttribute('data-g');
      [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === bt)); });
      build(); render();
    });
    $('clearBtn').addEventListener('click', function () {
      $('q').value = ''; $('catFilter').value = ''; status = 'open';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); setLevel('region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('safety-inspection.csv', [{ key: 'location', label: 'Location' }, { key: 'text', label: 'Issue' }, { key: 'cat', label: 'Issue type' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: 'office', label: 'Office' }, { key: 'by', label: 'Inspected by' }]
        .concat(COLS.slice(4)).concat([{ key: 'doneBy', label: 'Rectified by' }, { key: 'remarks', label: 'Remarks' }]), window.__view || []);
    });
    UI.refresh('refreshBtn', 'CACHE_SAFETY_v2', function (t) { raw = UI.csv(t); build(); render(); });

    UI.load('CACHE_SAFETY_v2', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('listTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      raw = UI.csv(text); build(); render();
    });
  });
  </script>
</body>
</html>
