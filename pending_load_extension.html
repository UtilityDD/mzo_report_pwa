<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending load extension · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <script src="/mzo_rows.js?v=6" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div><h1>Pending load extension<span class="ui-badge ui-date" id="asOn">…</span></h1></div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="syncBtn" hidden><svg class="ui-i"><use href="#ui-sync"/></svg>Sync sheet</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h"><h2>Filters<small id="activeLabel"></small></h2><button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button></div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Application, consumer ID or name" aria-label="Search by application, consumer ID or name" autocomplete="off" /></label>
        </div>
        <div class="ui-side-sec"><div id="fPhase" aria-label="Phase"></div></div>
        <div class="ui-side-sec"><div id="fWo" aria-label="Work order"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Group">
            <button type="button" role="tab" data-pane="fAge" aria-pressed="true" aria-selected="true">Waiting</button>
            <button type="button" role="tab" data-pane="fClass" aria-pressed="false" aria-selected="false">Class</button>
          </div>
          <div id="fAge" aria-label="Waiting time"></div>
          <div id="fClass" aria-label="Class" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k="all"><div class="k">Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="y1"><div class="k"><span class="ui-dot bad"></span>Over a year</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="ind"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="ph3"><div class="k">Three phase</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="big"><div class="k">Above 10 kW</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed report</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="drill"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CLASS = { D: 'Domestic', C: 'Commercial', I: 'Industrial', A: 'Agriculture', P: 'Public', GS: 'Govt. supply', W: 'Water works', X: 'Other' };
    var AGE = [
      { key: 'a0', label: 'Under 3 months', max: 2, dot: 'ok' },
      { key: 'a1', label: '3–6 months', max: 5, dot: 'warn' },
      { key: 'a2', label: '6–12 months', max: 11, dot: 'warn' },
      { key: 'a3', label: '1–2 years', max: 23, dot: 'bad' },
      { key: 'a4', label: '2–5 years', max: 59, dot: 'bad' },
      { key: 'a5', label: 'Over 5 years', max: Infinity, dot: 'bad' }
    ];
    var all = [], f = { q: '', cls: '', phase: '', wo: '', stat: '', age: '' }, shown = '';
    var dr = UI.drill({ el: 'drill', root: 'Malda Zone', onChange: render });
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    // Fixed-charge revenue held up by the delay (same formula the team has used).
    function loss(r) {
      if (r.applied <= r.curr) return 0;
      var rate = r.cls === 'I' ? 75 : (r.cls === 'C' || r.cls === 'A') ? 60 : 30;
      return Math.round(((r.applied - r.curr) * rate * r.age) / 850);
    }

    // t.rows: uniform rows of schema/load_extension.json (snake_case, numbers, ISO dates, canonical
    // _region/_division/_ccc), already scoped to the login by MzoRows.
    function prepare(t) {
      var asOn = t.first('report_date'); // one value for the whole sheet: read it before the scope
      all = t.rows.filter(function (d) { return d.appl_no || d.con_id; }).map(function (d) {
        var r = {
          appl: d.appl_no, con: d.con_id, name: UI.blank(d.name) ? '' : UI.title(d.name),
          address: d.address, code: d.ccc_code,
          _region: d._region, _divn: d._division, _supp: d._ccc, CCC_CODE: d.ccc_code,
          cls: d.conn_class.toUpperCase(), phase: d.conn_phase.toUpperCase(),
          applied: d.load_applied || 0, curr: d.curr_load || 0,
          age: Math.trunc(d.age_months) || 0, collected: d.collection_date,
          wo: UI.blank(d.won_assigned) ? '' : d.won_assigned, assignee: UI.blank(d.wo_assignee) ? '' : UI.title(d.wo_assignee),
          category: d.conn_category === 'U' ? 'Urban' : d.conn_category === 'R' ? 'Rural' : ''
        };
        r.loss = loss(r);
        r.ageKey = AGE.filter(function (b) { return r.age <= b.max; })[0].key;
        return r;
      });
      $('asOn').textContent = asOn ? 'As on ' + UI.fmtDate(asOn) : UI.n(all.length) + ' applications';
    }

    var STAT = {
      all: function () { return true; },
      y1: function (r) { return r.age >= 12; },
      ind: function (r) { return r.cls === 'I'; },
      ph3: function (r) { return r.phase === 'III'; },
      big: function (r) { return r.applied > 10000; }
    };

    // Rows matching every panel filter; `skip` leaves one facet out so it can count its own options.
    function base(skip) {
      var q = f.q.toLowerCase();
      return all.filter(function (r) {
        return dr.match(r) &&
          (skip === 'cls' || !f.cls || r.cls === f.cls) && (skip === 'phase' || !f.phase || r.phase === f.phase) &&
          (skip === 'wo' || !f.wo || (f.wo === 'yes' ? !!r.assignee : !r.assignee)) && (skip === 'age' || !f.age || r.ageKey === f.age) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }
    function facets() {
      var cnt = function (rows, fn) { return rows.filter(fn).length; };
      var ph = base('phase'), wo = base('wo'), ag = base('age'), cl = base('cls');
      UI.facet('fPhase', [{ value: 'I', label: 'Single phase', count: cnt(ph, function (r) { return r.phase === 'I'; }) }, { value: 'III', label: 'Three phase', count: cnt(ph, function (r) { return r.phase === 'III'; }) }], f.phase, function (v) { f.phase = v; render(); });
      UI.facet('fWo', [{ value: 'yes', label: 'Work order issued', count: cnt(wo, function (r) { return !!r.assignee; }) }, { value: 'no', label: 'Work order not issued', count: cnt(wo, function (r) { return !r.assignee; }) }], f.wo, function (v) { f.wo = v; render(); });
      UI.facet('fAge', AGE.map(function (a) { return { value: a.key, label: a.label, dot: a.dot, count: cnt(ag, function (r) { return r.ageKey === a.key; }) }; }), f.age, function (v) { f.age = v; render(); });
      var cls = {}; cl.forEach(function (r) { cls[r.cls] = (cls[r.cls] || 0) + 1; });
      var keys = Object.keys(cls); if (f.cls && keys.indexOf(f.cls) === -1) keys.push(f.cls);
      UI.facet('fClass', keys.sort(function (a, b) { return (cls[b] || 0) - (cls[a] || 0); }).map(function (c) { return { value: c, label: CLASS[c] || c, count: cls[c] || 0 }; }), f.cls, function (v) { f.cls = v; render(); });
      var on = (f.q ? 1 : 0) + ['phase', 'wo', 'age', 'cls'].filter(function (k) { return f[k]; }).length;
      setActive(on, { fAge: f.age, fClass: f.cls });
    }

    function render() {
      var b = base();
      facets();
      var view = b.filter(function (r) { return !f.stat || STAT[f.stat](r); });
      var sum = function (rows) { return rows.reduce(function (a, r) { return a + r.loss; }, 0); };

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(STAT[k]);
        el.querySelector('.v').textContent = UI.n(rows.length);
        el.querySelector('.s').textContent = (k === 'all' ? 'Est. loss ' : UI.pct(rows.length, b.length) + ' · ') + UI.inr(sum(rows));
        el.setAttribute('aria-pressed', String(f.stat === k || (k === 'all' && !f.stat)));
      });

      // Detailed report: offices down the path, then the applications
      if (dr.level() !== shown) { $('table').__ui = null; shown = dr.level(); }
      if (dr.isList()) {
        UI.table('table', { rows: view, sort: { key: 'age', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      } else {
        var groups = {};
        view.forEach(function (r) {
          var k = dr.key(r), g = groups[k] || (groups[k] = { name: k, parent: dr.parent(r), row: r, n: 0, y1: 0, loss: 0 });
          g.n++; if (r.age >= 12) g.y1++; g.loss += r.loss;
        });
        var list = Object.keys(groups).map(function (k) { return groups[k]; }), max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
        UI.table('table', {
          rows: list, sort: { key: 'n', dir: 'desc' }, count: false,
          empty: 'No pending applications for these filters.',
          columns: [
            { key: 'name', label: dr.label(), fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Pending', num: true, fmt: UI.n },
            { key: 'y1', label: 'Over a year', num: true, fmt: UI.n },
            { key: 'loss', label: 'Est. loss', num: true, fmt: UI.inr, hideSm: true },
            { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '28%' }
          ],
          foot: list.length > 1 ? { n: view.length, y1: view.filter(STAT.y1).length, loss: sum(view) } : null,
          onRow: function (g) { dr.open(g.name, g.row); }
        });
      }
      dr.paint({ list: view.length });
      renderReportHead(view);
      window.__view = view;
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var label = dr.isList() ? 'Applications' : dr.label() + ' wise report';
      var kpiLabels = { y1: 'Over a year', ind: 'Industrial', ph3: 'Three phase', big: 'Above 10 kW' };
      var kpiLabel = f.stat && kpiLabels[f.stat] ? kpiLabels[f.stat] : '';

      $('rhTitle').textContent = label + (kpiLabel ? ' · ' + kpiLabel : '');

      var viewLoss = view.reduce(function (s, r) { return s + (r.loss || 0); }, 0);
      var allLoss = all.reduce(function (s, r) { return s + (r.loss || 0); }, 0);

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> · Est. loss ' + UI.inr(allLoss);
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' · Est. loss ' + UI.inr(viewLoss);
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if (f.phase) {
        currentActiveFilters.push({ label: 'Phase', value: f.phase === 'III' ? 'Three phase' : 'Single phase', clear: function () { f.phase = ''; } });
      }
      if (f.wo) {
        currentActiveFilters.push({ label: 'Work order', value: f.wo === 'yes' ? 'Issued' : 'Not issued', clear: function () { f.wo = ''; } });
      }
      if (f.age) {
        var ab = AGE.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Age', value: ab ? ab.label : f.age, clear: function () { f.age = ''; } });
      }
      if (f.cls) {
        currentActiveFilters.push({ label: 'Class', value: CLASS[f.cls] || f.cls, clear: function () { f.cls = ''; } });
      }
      if (f.stat && kpiLabels[f.stat]) {
        currentActiveFilters.push({ label: 'KPI', value: kpiLabels[f.stat], clear: function () { f.stat = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'name', label: 'Name', hideSm: true, cls: 'wrap' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'cls', label: 'Class', fmt: function (v, r) { return UI.esc(CLASS[v] || v) + '<span class="sub">' + (r.phase === 'III' ? 'Three phase' : 'Single phase') + '</span>'; }, hideSm: true },
      { key: 'applied', label: 'Load now → applied', num: true, fmt: function (v, r) { return UI.n(r.curr) + ' → <span class="ui-strong">' + UI.n(v) + '</span>'; }, csv: function (r) { return r.curr + ' -> ' + r.applied; } },
      { key: 'age', label: 'Waiting', num: true, fmt: function (v) { return UI.age(v * 30.4); }, csv: function (r) { return r.age + ' months'; } },
      { key: 'loss', label: 'Est. loss', num: true, fmt: UI.inr, hideSm: true },
      { key: 'assignee', label: 'Work order', hideSm: true, fmt: function (v, r) { return v ? UI.esc(v) : '<span class="ui-muted">Not issued</span>'; } }
    ];

    function detail(r) {
      UI.drawer('Application ' + (r.appl || '—'), [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Consumer ID', r.con], ['Name', r.name], ['Address', r.address], ['Class', (CLASS[r.cls] || r.cls) + (r.category ? ' · ' + r.category : '')],
        ['Phase', r.phase === 'III' ? 'Three phase' : 'Single phase'], ['Current load', UI.n(r.curr)], ['Applied load', UI.n(r.applied)],
        ['Collected on', UI.fmtDate(r.collected)], ['Waiting', UI.age(r.age * 30.4)], ['Est. fixed-charge loss', UI.inr(r.loss)],
        ['Work order', r.wo], ['Assigned to', r.assignee || 'Not issued'], ['CCC code', r.code]
      ]);
    }

    /* events */
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = (k === 'all' || f.stat === k) ? '' : k; render(); });
    function clearAll() {
      f.q = ''; f.stat = ''; f.age = ''; f.cls = ''; f.phase = ''; f.wo = ''; $('q').value = '';
      render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('pending-load-extension.csv', [{ key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }]
        .concat(APP_COLS.slice(3).map(function (c) { return { key: c.key, label: c.label, csv: c.csv }; })), window.__view || []);
    });
    MzoRows.refresh('refreshBtn', 'load_extension', function (t) { prepare(t); render(); });

    // Sync from the Google Sheet (authorised users only)
    fetch('/api/load-extension/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) { if (m && (m.canSync || m.isAdmin)) $('syncBtn').hidden = false; }).catch(function () {});
    $('syncBtn').addEventListener('click', function () {
      if (!confirm('Pull the latest pending load extensions from the Google Sheet now?')) return;
      var b = this; b.disabled = true; b.classList.add('spin');
      fetch('/api/load-extension/sync', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json().catch(function () { return { status: 'error', message: 'HTTP ' + r.status }; }); })
        .then(function (d) {
          if (d.status !== 'success') throw new Error(d.message || 'Sync failed');
          try { localStorage.removeItem('mzo_hub_ver_CACHE_LOAD_EXT'); } catch (e) {}
          return MzoRows.reload('load_extension');
        })
        .then(function (t) { if (t) { prepare(t); render(); } UI.toast('Synced from the sheet'); })
        .catch(function (e) { UI.toast(e.message || 'Sync failed'); })
        .then(function () { b.disabled = false; b.classList.remove('spin'); });
    });

    // Deep links: ?region= ?division= ?ccc= (open the report there), ?q=, ?kpi=kpiAgeing1y
    var params = new URLSearchParams(location.search);
    var first = true;
    MzoRows.load('load_extension', function (t, info) {
      if (!t) { if (info && info.error) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        dr.fromParams(params, all);
        if (params.get('q')) { f.q = params.get('q').trim(); $('q').value = f.q; }
        var k = String(params.get('kpi') || '');
        if (/^y1$|1y|year/i.test(k)) f.stat = 'y1'; else if (/ind/i.test(k)) f.stat = 'ind'; else if (/ph3|three/i.test(k)) f.stat = 'ph3'; else if (/big|10/i.test(k)) f.stat = 'big';
      }
      render();
    });
  });
  </script>
</body>
</html>
