<!DOCTYPE html>
<html lang="en" class="ui">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disconnection tracker · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=23" />
  <script src="/mzo_ui.js?v=20" defer></script>
  <script src="/mzo_data_hub.js?v=93" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=20" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <script src="/auth.js" defer></script>
  <style>
    .dc-base {
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--mzo-muted);
    }

    .ui-stat .v .pct {
      margin-left: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--mzo-muted);
    }

    .dc-legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--mzo-muted);
    }

    .dc-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dc-act {
      display: grid;
      gap: 4px;
    }

    .dc-act .row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 72px;
      align-items: center;
      gap: 12px;
      height: 26px;
      font-size: 12.5px;
    }

    .dc-act .row>span:first-child {
      color: var(--mzo-text-2);
      white-space: nowrap;
    }

    .dc-act .row>span:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--mzo-muted);
      white-space: nowrap;
    }

    .dc-act i {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--mzo-chart-soft);
    }

    .dc-act i b {
      height: 100%;
    }

    .dc-act i b.p {
      background: var(--mzo-ok-mark);
    }

    .dc-act i b.d {
      background: var(--mzo-bad-mark);
    }

    .dc-list-h .right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ui-table td.num {
      white-space: nowrap;
    }

    .dc-note-cell {
      max-width: 420px;
    }

    .dc-note-cell .t {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;
    }

    /* Drawer */
    .dc-sum {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 16px 20px 4px;
      border: 1px solid var(--mzo-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .dc-sum>div {
      padding: 10px 12px;
      box-shadow: 1px 0 0 var(--mzo-border);
    }

    .dc-sum .k {
      font-size: 12px;
      color: var(--mzo-muted);
    }

    .dc-sum .v {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .dc-fu {
      padding: 4px 20px 28px;
    }

    .dc-fu-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 0 8px;
      border-top: 1px solid var(--mzo-border);
    }

    .dc-fu-h h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dc-fu-list {
      margin: 0 0 12px;
    }

    .dc-fu-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--mzo-border);
    }

    .dc-fu-item:first-child {
      padding-top: 2px;
    }

    .dc-fu-item .n {
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dc-fu-item .m {
      margin-top: 3px;
      font-size: 12px;
      color: var(--mzo-muted);
    }

    .dc-fu-empty {
      padding: 4px 0 12px;
      font-size: 12.5px;
      color: var(--mzo-muted);
    }

    .dc-fu textarea.ui-input {
      display: block;
      width: 100%;
      height: auto;
      min-height: 68px;
      padding: 8px 10px;
      line-height: 1.45;
      resize: vertical;
    }

    .dc-fu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .dc-fu-err {
      font-size: 12.5px;
      color: var(--mzo-bad);
    }

    @media (max-width: 760px) {
      .dc-sum {
        margin: 12px 16px 4px;
      }

      .dc-fu {
        padding: 4px 16px 24px;
      }

      .dc-note-cell {
        max-width: 220px;
      }
    }
    .dc-status { margin: 8px 16px 0; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .dc-prog { width: 140px; height: 6px; background: var(--mzo-border); border-radius: 99px; overflow: hidden; }
    .dc-prog b { display: block; height: 100%; width: 0; background: var(--mzo-brand); transition: width .3s ease; }
    #table tbody tr { cursor: pointer; transition: background 0.15s; }
    #table tbody tr:hover { background: var(--mzo-surface-sunken, rgba(0, 0, 0, 0.03)); }
  </style>
</head>

<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Disconnection tracker<span class="ui-badge ui-date" id="asOn">…</span></h1>
        <p id="headerSub">OSD baseline: <strong id="baseDateVal">3 Nov 2026</strong> &nbsp;·&nbsp; DB2 collections through: <strong id="payUpdateVal">5 Nov 2026</strong></p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side"
          aria-expanded="false"><svg class="ui-i">
            <use href="#ui-filter" />
          </svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="crmSyncBtn" hidden title="Direct extraction from IBM DB2"><svg class="ui-i"><use href="#ui-sync"/></svg>Sync from DB2</button>
        <button type="button" class="ui-btn" id="crmPaySyncBtn" hidden title="Sync daily payment collections from IBM DB2"><svg class="ui-i"><use href="#ui-sync"/></svg>Sync Payments</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg
            class="ui-i">
            <use href="#ui-refresh" />
          </svg></button>
      </div>
    </header>

    <div class="dc-status ui-note" id="status" hidden><span id="statusText"></span><div class="dc-prog"><b id="statusBar"></b></div></div>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2><button type="button" class="ui-btn ghost sm"
            id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i">
              <use href="#ui-search" />
            </svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Consumer ID, name or address"
              aria-label="Search by consumer ID, name or address" autocomplete="off" /></label>
        </div>
        <div class="ui-side-sec">
          <div id="fOsd" aria-label="Outstanding"></div>
        </div>
        <div class="ui-side-sec">
          <div id="fClass" aria-label="Class"></div>
        </div>
        <p class="dc-base" id="base" hidden></p>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Status">
          <button type="button" class="ui-stat" data-k="all">
            <div class="k">Consumers</div>
            <div class="v"><span class="ui-skel"></span></div>
            <div class="s">&nbsp;</div>
          </button>
          <button type="button" class="ui-stat" data-k="Fully Paid">
            <div class="k"><span class="ui-dot ok"></span>Fully paid</div>
            <div class="v"><span class="ui-skel"></span></div>
            <div class="s">&nbsp;</div>
          </button>
          <button type="button" class="ui-stat" data-k="Partially Paid">
            <div class="k"><span class="ui-dot"></span>Part paid</div>
            <div class="v"><span class="ui-skel"></span></div>
            <div class="s">&nbsp;</div>
          </button>
          <button type="button" class="ui-stat" data-k="Disconnected">
            <div class="k"><span class="ui-dot bad"></span>Disconnected</div>
            <div class="v"><span class="ui-skel"></span></div>
            <div class="s">&nbsp;</div>
          </button>
          <button type="button" class="ui-stat" data-k="No Action Taken">
            <div class="k"><span class="ui-dot warn"></span>No action</div>
            <div class="v"><span class="ui-skel"></span></div>
            <div class="s">&nbsp;</div>
          </button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <svg class="ui-i">
                    <use href="#ui-panel" />
                  </svg>
                  <span id="rhTitle">Detailed report</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="right" style="display:flex;align-items:center;gap:8px">
                <div class="ui-seg" id="fuRange" role="group" aria-label="Follow-up range" hidden>
                  <button type="button" data-r="recent" aria-pressed="false">Last 7 days</button>
                  <button type="button" data-r="all" aria-pressed="true">All</button>
                </div>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i">
                    <use href="#ui-download" />
                  </svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="drill"></div>
          <div id="table">
            <div class="ui-empty">Loading…</div>
          </div>
          <div id="followTable" hidden></div>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>Recent activity</h2>
            <div class="dc-legend"><span><i class="ui-dot ok"></i>Paid</span><span><i
                  class="ui-dot bad"></i>Disconnected</span></div>
          </div>
          <div class="ui-panel-b">
            <div id="activity" class="dc-act"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="ui-drawer" id="drawer" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <header>
        <div>
          <h3 id="dTitle"></h3>
          <p id="dSub"></p>
        </div>
        <button type="button" class="ui-btn icon ghost" data-close aria-label="Close"><svg class="ui-i">
            <use href="#ui-x" />
          </svg></button>
      </header>
      <div id="dBody"></div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var ROWS = 'disconnection';
      var GOOGLE_CSV = '/api/disconnection/dataset';
      var paymentsMap = {}, lastTableDoc = null;

      function formatCleanDate(val) {
        if (!val) return '—';
        if (val instanceof Date) return UI.fmtDate(val);
        var s = String(val).trim();
        if (/^\d{8}$/.test(s)) {
          var y = parseInt(s.slice(0, 4), 10), m = parseInt(s.slice(4, 6), 10) - 1, d = parseInt(s.slice(6, 8), 10);
          var dt = new Date(y, m, d);
          return isNaN(dt.getTime()) ? s : UI.fmtDate(dt);
        }
        var p = s.split(/[./-]/);
        if (p.length === 3 && p[0].length <= 2 && p[2].length === 4) {
          var dt2 = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
          return isNaN(dt2.getTime()) ? s : UI.fmtDate(dt2);
        }
        var dt3 = new Date(s);
        return isNaN(dt3.getTime()) ? s : UI.fmtDate(dt3);
      }

      function loadPayments() {
        // Same origin only: off the VM the server fetches the VM's copy itself.
        fetch('/api/disconnection/payments', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (json) {
            if (json) {
              if (json.consumers) paymentsMap = json.consumers;
              var payDt = json.latestPaymentDate || json.lastPaymentDate;
              if (payDt && $('payUpdateVal')) $('payUpdateVal').textContent = formatCleanDate(payDt);
              var bDt = json.cutoffDate || json.cutoffDateFormatted;
              if (bDt && $('baseDateVal')) $('baseDateVal').textContent = formatCleanDate(bDt);
              if (lastTableDoc) {
                prepare(lastTableDoc);
                render({ keepPage: true });
              }
              refreshOpenDrawer();
            }
          })
          .catch(function () {});
      }
      loadPayments();
      var STATUS = {
        'Fully Paid': { label: 'Fully paid', cls: 'ok' },
        'Partially Paid': { label: 'Part paid', cls: '' },
        'Disconnected': { label: 'Disconnected', cls: 'bad' },
        'No Action Taken': { label: 'No action', cls: 'warn' }
      };

      var all = [], shown = '';
      // Detailed report: Region → Division → CCC → consumers (or their follow-ups)
      var dr = UI.drill({ el: 'drill', root: 'Malda Zone', lists: [{ k: 'list', label: 'Consumers' }, { k: 'followups', label: 'Follow-ups' }], onChange: function () { render(); } });
      var f = { q: '', status: 'all', osd: 0, cls: '' };
      var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });
      var followupRecentOnly = false, haveData = false;

      var metaP = fetch('/api/disconnection/meta', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });

      /* ------------------------------------------------------------------ parsing */

      // Google export sometimes prepends a blank comma-row before the real header (used by the fallback).
      function normalizeCsv(text) {
        text = String(text || '').replace(/^﻿/, '');
        var lines = text.split(/\r?\n/);
        var idx = lines.findIndex(function (l) { var u = l.toUpperCase(); return u.indexOf('CCC_CODE') !== -1 && (u.indexOf('NOTOSD') !== -1 || u.indexOf('CON_ID') !== -1); });
        return idx <= 0 ? text : lines.slice(idx).join('\n');
      }
      function parseAmount() {
        for (var i = 0; i < arguments.length; i++) {
          var raw = arguments[i];
          if (raw == null) continue;
          var s = String(raw).trim().replace(/,/g, '');
          if (!s || /^#?n\/?a$/i.test(s)) continue;
          var n = parseFloat(s);
          if (!isNaN(n)) return n;
        }
        return 0;
      }
      function osdDate(raw) {
        var s = String(raw || '').trim();
        if (!s || /^#?n\/?a$/i.test(s) || s === '0') return '';
        var m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
        if (!m) return '';
        var y = m[3]; if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
        return m[1].padStart(2, '0') + '.' + m[2].padStart(2, '0') + '.' + y;
      }
      // DOM and IND/COM base OSD dates live on the first data row (DOM BASE DATE, IND&COM BASE DATE):
      // t.all, so a scoped login sees them too. Else the first and last date-like cells of that row.
      function baseDates(t) {
        var row = t.all[0];
        if (!row) return { dom: '', ind: '' };
        var dom = osdDate(row.dom_base_date), ind = osdDate(row.ind_com_base_date);
        if (!dom || !ind) {
          var tail = t.columns.map(function (c) { return osdDate(row[c.name]); }).filter(Boolean);
          if (!dom && tail[0]) dom = tail[0];
          if (!ind && tail.length) ind = tail[tail.length - 1];
        }
        return { dom: dom, ind: ind };
      }

      // Canonical office of the row; a region's 0000 code is its bulk account.
      function office(row) {
        var o = { region: row._region, division: row._division, ccc: row._ccc };
        if (o.region && !o.division && /0000$/.test(row.ccc_code)) return { region: o.region, division: 'Bulk', ccc: o.region + ' region bulk' };
        if (!o.ccc && row.unit_name) o.ccc = UI.title(String(row.unit_name).replace(/ CCC$/i, '').trim()); // only if the schema pins UNIT_NAME again
        return o;
      }
      // A uniform value, or the cell text that did not parse (the old rules still apply to it).
      function rawOf(row, k) { var v = row[k]; return v != null && v !== '' ? String(v) : row[k + '_raw'] || ''; }

      // PAID/DISCON DATE (dd.mm.yyyy in the sheet; blank, #N/A or 0: none) → { str, obj } or null.
      function actionDate(row) {
        var iso = row.paid_discon_date;
        var dateStr = iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : row.paid_discon_date_raw || '';
        if (dateStr === '' || dateStr.toLowerCase() === '#n/a' || dateStr === '0') return null;
        var p = dateStr.split('.');
        if (p.length !== 3) return null;
        var d = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
        return isNaN(d.getTime()) ? null : { str: dateStr, obj: d };
      }

      // t.rows: uniform rows of schema/disconnection.json, already scoped to the login by MzoRows.
      function prepare(t) {
        var base = baseDates(t), maxDate = null;
        // "As on" is the latest action date in the whole sheet (t.all), as before, for every login.
        t.all.forEach(function (row) { var a = actionDate(row); if (a && (!maxDate || a.obj > maxDate)) maxDate = a.obj; });
        all = t.rows.map(function (row) {
          var code = row.ccc_code;
          var o = office(row);
          var osd = row.notosd != null ? row.notosd : parseAmount(row.notosd_raw);
          var paid = row.final_paid_amount != null ? row.final_paid_amount : parseAmount(row.final_paid_amount_raw);
          var act = actionDate(row), hasDate = !!act, dateStr = act ? act.str : '', dateObj = act ? act.obj : null;
          var paidStr = rawOf(row, 'final_paid_amount');
          var hasPaid = paidStr !== '' && paidStr.toLowerCase() !== '#n/a' && paidStr !== '0';

          var norm = String(row.con_id || '').replace(/^0+/, '');
          var pInfo = paymentsMap && (paymentsMap[norm] || paymentsMap[row.con_id]);
          if (pInfo && pInfo.totalPaid > 0) {
            paid = pInfo.totalPaid;
            hasPaid = true;
            if (pInfo.lastDateFormatted) {
              hasDate = true;
              dateStr = pInfo.lastDateFormatted;
              var pts = dateStr.split('.');
              if (pts.length === 3) dateObj = new Date(parseInt(pts[2], 10), parseInt(pts[1], 10) - 1, parseInt(pts[0], 10));
            }
          }

          var status = !hasDate ? 'No Action Taken' : !hasPaid ? 'Disconnected' : paid >= osd ? 'Fully Paid' : 'Partially Paid';
          return {
            id: row.con_id || 'synthetic-' + t.all.indexOf(row),
            name: row.name,
            display: UI.title(row.name.replace(/,\s*$/, '')),
            address: row.address,
            CCC_CODE: code, cccCode: code,
            _region: o.region || 'Unmapped', _divn: o.division || 'Unmapped', _supp: o.ccc || 'Unmapped',
            osd: osd, paid: paid,
            balance: Math.max(0, osd - paid),
            dateStr: hasDate ? dateStr : '', dateObj: dateObj,
            remarks: row.remarks || '', // no REMARKS / TARIFF CLASS column in the sheet today (schema notes)
            status: status,
            classDesc: row.class_desc,
            tariff: row.tariff_class || '',
            meter: UI.blank(row.meter_no) ? '' : row.meter_no,
            mru: UI.blank(row.mru) ? '' : row.mru,
            dispute: UI.blank(row.bill_dispute) ? '' : row.bill_dispute,
            govt: UI.blank(row.govt_stat) ? '' : row.govt_stat
          };
        });
        haveData = true;
        $('asOn').textContent = UI.n(all.length) + ' consumers';
        if (base.dom || base.ind) {
          var domStr = formatCleanDate(base.dom);
          var indStr = formatCleanDate(base.ind);
          var bStr = domStr === indStr || !indStr ? domStr : ('Dom ' + domStr + ', Ind ' + indStr);
          if ($('baseDateVal')) $('baseDateVal').textContent = bStr;
        }
      }

      /* ------------------------------------------------------------------ filters */

      // Office path and panel filters (outstanding, class, search): the base every number is counted on.
      // `skip` leaves one facet out so it can count its own options.
      function base(skip) {
        var q = f.q.toLowerCase();
        var cls = skip === 'cls' ? '' : f.cls, osd = skip === 'osd' ? 0 : f.osd;
        return all.filter(function (c) {
          if (!dr.match(c)) return false;
          if (cls && c.classDesc !== cls) return false;
          if (osd && !(c.osd > osd)) return false;
          if (q && !(c.id.toLowerCase().indexOf(q) !== -1 || c.name.toLowerCase().indexOf(q) !== -1 || c.address.toLowerCase().indexOf(q) !== -1 ||
            c._supp.toLowerCase().indexOf(q) !== -1 || c._divn.toLowerCase().indexOf(q) !== -1 || c._region.toLowerCase().indexOf(q) !== -1 ||
            c.remarks.toLowerCase().indexOf(q) !== -1)) return false;
          return true;
        });
      }
      // The status cards filter the breakdowns and lists only.
      function narrow(rows) {
        return f.status === 'all' ? rows : rows.filter(function (c) { return c.status === f.status; });
      }

      /* ------------------------------------------------------------------ render */

      function amount(v) { return UI.inr(v); }
      function rupees(v) { return '₹' + UI.n(Math.round(v || 0)); }
      function setStat(el, count, total, sub) {
        el.querySelector('.v').innerHTML = UI.n(count) + (total != null ? '<span class="pct">' + (count ? UI.pct(count, total) : '0%') + '</span>' : '');
        if (sub != null) el.querySelector('.s').textContent = sub;
      }

      function renderStats(b) {
        var t = { 'Fully Paid': [0, 0], 'Partially Paid': [0, 0], 'Disconnected': [0, 0], 'No Action Taken': [0, 0] }, osd = 0;
        b.forEach(function (c) {
          osd += c.osd;
          var s = t[c.status]; s[0]++;
          s[1] += (c.status === 'Fully Paid' || c.status === 'Partially Paid') ? c.paid : c.osd;
        });
        [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
          var k = el.getAttribute('data-k');
          if (k === 'all') setStat(el, b.length, null, amount(osd) + ' outstanding');

      }

        return ids;
      }

      }
      function flushFollowupOutbox() {
        if (followupFlushing || !followupScriptUrl) return Promise.resolve();
        followupFlushing = true;
        if (!canDeleteFollowup()) writeFollowupOutbox(readFollowupOutbox().filter(function (j) { return j && j.op !== 'delete'; }));
        var queue = readFollowupOutbox(), index = 0;
        var step = function () {
          if (index >= queue.length) return Promise.resolve();
          var job = queue[index];
          return postFollowupJob(job).then(function () {
            writeFollowupOutbox(readFollowupOutbox().filter(function (i) { return !(i && i.op === job.op && i.id === job.id); }));
            if (job.op === 'add') {
              var store = readFollowupStore(), list = store[fuKey(job.conId)] || [];
              list.forEach(function (e) { if (e && e.id === job.id) e.sync = 'ok'; });
              if (list.length) store[fuKey(job.conId)] = list;
              writeFollowupStore(store);
            }
            index += 1;
            return step();
          });
        };
        return step().catch(function () { }).finally(function () {
          followupFlushing = false;
          var seen = new Set(queue.map(function (j) { return j && (j.op + '\n' + j.id); }));
          if (readFollowupOutbox().some(function (j) { return j && !seen.has(j.op + '\n' + j.id); })) flushFollowupOutbox();
        });
      }
      function pullFollowupComments() {
        if (followupPulling || !followupScriptUrl) return Promise.resolve();
        followupPulling = true;
        var url = followupScriptUrl + (followupScriptUrl.indexOf('?') >= 0 ? '&' : '?') + 'list=1&t=' + Date.now();
        return scriptCall(url, { method: 'GET' })
          .then(function (d) {
            if (!Array.isArray(d.comments)) return;
            applyRemoteFollowups(d);
            maybeRefreshFollowups();
          })
          .catch(function () { })
          .finally(function () { followupPulling = false; });
      }
      // A pull merges the follow-up list into what is on screen (board, tab count, the list's notes
      // column); it never reloads the consumer rows, so the numbers paint without waiting for it.
      function maybeRefreshFollowups() {
        if (haveData) {
          if (dr.level() === 'list' && JSON.stringify(countNotes()) !== JSON.stringify(noteCounts)) renderConsumers(lastView, true);
          renderFollowupBoard(lastView); renderStats(base());
        }
        if (!openConsumerId || $('drawer').hidden) return;
        var fp = fuFingerprint(openConsumerId);
        if (fp === followupShownFp) return;
        followupShownFp = fp;
        var host = $('fuList');
        if (!host) return;
        host.innerHTML = fuListHtml(openConsumerId);
        $('fuCount').textContent = fuCountLabel(openConsumerId);
        var badge = $('fuUpdated');
        if (badge) { badge.hidden = false; clearTimeout(followupUpdatedTimer); followupUpdatedTimer = setTimeout(function () { badge.hidden = true; }, 2200); }
      }
      function startFollowupSync() {
        if (followupPollTimer) return;
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible' || !followupScriptUrl) return;
          pullFollowupComments(); flushFollowupOutbox();
        });
        metaP.then(function (m) {
          followupScriptUrl = m && m.sheetScriptUrl ? String(m.sheetScriptUrl).trim() : '';
          if (!followupScriptUrl) return;
          enqueueUnsyncedFollowups();
          flushFollowupOutbox();
          pullFollowupComments();
          followupPollTimer = setInterval(function () {
            if (document.visibilityState === 'hidden') return;
            pullFollowupComments(); flushFollowupOutbox();
          }, FOLLOWUP_POLL_MS);
        });
      }

      /* ------------------------------------------------------------------ drawer */

      function fuListHtml(id) {
        var items = getFollowups(id);
        if (!items.length) return '<div class="dc-fu-empty">No follow-up yet.</div>';
        var del = canDeleteFollowup();
        return items.map(function (e) {
          return '<div class="dc-fu-item"><div><div class="n">' + UI.esc(e.note) + '</div><div class="m">' + UI.esc(quietLine(e)) + '</div></div>' +
            (del ? '<button type="button" class="ui-btn icon sm ghost" data-del="' + UI.esc(e.id) + '" aria-label="Delete follow-up" title="Delete"><svg class="ui-i"><use href="#ui-x"/></svg></button>' : '') + '</div>';
        }).join('');
      }

      function renderDrawer(c, opts) {
        opts = opts || {};
        var s = STATUS[c.status] || STATUS['No Action Taken'];
        $('dTitle').textContent = c.display || c.id;
        $('dSub').textContent = c.id + ' · ' + [c._supp, c._divn].filter(function (x) { return x && x !== 'Unmapped'; }).join(', ');
        var exact = function (v) { return '₹' + Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
        var normId = String(c.id || '').replace(/^0+/, '');
        var payInfo = paymentsMap && (paymentsMap[normId] || paymentsMap[c.id]);
        var paymentHistoryHtml = '';
        if (payInfo && payInfo.items && payInfo.items.length) {
          paymentHistoryHtml =
            '<section style="margin:12px 20px 8px;padding:12px;border-radius:8px;background:var(--mzo-surface-sunken, #f8fafc);border:1px solid var(--mzo-border);">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<h4 style="margin:0;font-size:12.5px;font-weight:600;">DB2 Collection History (' + payInfo.items.length + ')</h4>' +
            '<span class="ui-badge ok" style="font-size:11px;">Total: ' + exact(payInfo.totalPaid) + '</span>' +
            '</div>' +
            '<div style="overflow-x:auto;">' +
            '<table class="ui-table" style="font-size:11.5px;width:100%;">' +
            '<thead><tr><th>Date</th><th>Amount</th><th>Receipt No</th><th>Mode</th><th>Col Type</th></tr></thead>' +
            '<tbody>' +
            payInfo.items.map(function (it) {
              return '<tr>' +
                '<td>' + UI.esc(it.date || it.dateRaw) + '</td>' +
                '<td style="font-weight:600;">' + exact(it.amount) + '</td>' +
                '<td><code style="font-size:11px;">' + UI.esc(it.receipt || '—') + '</code></td>' +
                '<td><span class="ui-badge sm">' + UI.esc(it.mode || '—') + '</span></td>' +
                '<td><span class="ui-badge sm quiet">' + UI.esc(it.colType || 'Revenue') + '</span></td>' +
                '</tr>';
            }).join('') +
            '</tbody></table></div></section>';
        }

        var bal = Math.max(0, c.osd - (c.paid || 0));
        var pairs = [
          ['Address', c.address], ['Office', [c._region, c._divn, c._supp].join(' › ')], ['CCC code', c.cccCode],
          ['Class', c.classDesc ? UI.title(c.classDesc) : ''], ['Tariff', c.tariff], ['Meter', c.meter], ['MRU', c.mru],
          ['Bill dispute', c.dispute], ['Govt. status', c.govt], ['Remarks', c.remarks]
        ].filter(function (p) { return !UI.blank(p[1]); });
        var composer = fuCanSave(c.id)
          ? '<textarea id="fuNote" class="ui-input" rows="3" maxlength="' + FOLLOWUP_NOTE_MAX + '" placeholder="What happened on this visit or call">' + UI.esc(opts.draft || '') + '</textarea>' +
          '<div class="dc-fu-row"><span class="dc-fu-err" id="fuErr">' + UI.esc(opts.error || '') + '</span><button type="button" class="ui-btn primary sm" id="fuSave">Save follow-up</button></div>'
          : '<div class="dc-fu-empty">This row has no consumer number, so a follow-up cannot be saved.</div>';
        $('dBody').innerHTML =
          '<div class="dc-sum">' +
          '<div><div class="k">Status</div><div class="v"><span class="ui-badge ' + s.cls + '">' + s.label + '</span></div></div>' +
          '<div><div class="k">Outstanding</div><div class="v">' + exact(c.osd) + '</div></div>' +
          '<div><div class="k">' + (c.status === 'Disconnected' ? 'Disconnected on' : 'Total Paid') + '</div><div class="v">' + (c.status === 'Disconnected' ? UI.esc(c.dateObj ? UI.fmtDate(c.dateObj) : '—') : (c.paid > 0 ? exact(c.paid) : '—')) + '</div></div>' +
          (c.paid > 0 && bal > 0 ? '<div><div class="k">Balance Due</div><div class="v" style="color:var(--mzo-danger, #ef4444);">' + exact(bal) + '</div></div>' : '') +
          '</div>' +
          (c.dateObj && c.status !== 'Disconnected' ? '<p class="ui-note" style="margin:8px 20px 0">Latest Payment: ' + UI.fmtDate(c.dateObj) + '</p>' : '') +
          (opts.missing ? '<p class="ui-note" style="margin:8px 20px 0">This consumer number is not in the current file. Follow-ups stay with this number.</p>' : '') +
          paymentHistoryHtml +
          '<dl class="ui-dl">' + pairs.map(function (p) { return '<dt>' + UI.esc(p[0]) + '</dt><dd>' + UI.esc(p[1]) + '</dd>'; }).join('') + '</dl>' +
          '<section class="dc-fu"><div class="dc-fu-h"><h4>Follow-ups <span class="ui-badge ok" id="fuUpdated" hidden>Updated</span></h4><span class="ui-note" id="fuCount">' + UI.esc(fuCountLabel(c.id)) + '</span></div>' +
          '<div class="dc-fu-list" id="fuList">' + fuListHtml(c.id) + '</div>' + composer + '</section>';
        if (opts.focusNote && $('fuNote')) $('fuNote').focus();
        followupShownFp = fuFingerprint(c.id);
      }

      function openDrawer(c) {
        drawerConsumer = c;
        openConsumerId = fuKey(c.id);
        renderDrawer(c, { draft: '' });
        $('drawer').hidden = false;
        $('drawer').querySelector('section').scrollTop = 0;
        pullFollowupComments();
      }
      function closeDrawer() { $('drawer').hidden = true; openConsumerId = null; drawerConsumer = null; }
      function refreshOpenDrawer() {
        if (!openConsumerId || !drawerConsumer || $('drawer').hidden) return;
        var draft = $('fuNote') ? $('fuNote').value : '';
        var fresh = all.filter(function (r) { return fuKey(r.id) === openConsumerId; })[0];
        if (fresh) drawerConsumer = fresh;
        renderDrawer(drawerConsumer, { draft: draft, missing: !fresh });
      }
      function saveFollowup() {
        if (!drawerConsumer) return;
        var text = $('fuNote') ? $('fuNote').value : '';
        if (!String(text).trim()) { renderDrawer(drawerConsumer, { draft: text, focusNote: true, error: 'Write a short report first.' }); return; }
        try {
          if (!addFollowup(drawerConsumer.id, text).ok) { renderDrawer(drawerConsumer, { draft: text, focusNote: true, error: 'Write a short report first.' }); return; }
        } catch (e) { renderDrawer(drawerConsumer, { draft: text, focusNote: true, error: 'Could not save on this device.' }); return; }
        renderDrawer(drawerConsumer, { draft: '', focusNote: true });
        renderConsumers(lastView, true);
        renderFollowupBoard(lastView);
        renderStats(base());
        setTimeout(function () { flushFollowupOutbox(); }, 0);
      }
      function removeFollowup(entryId) {
        if (!canDeleteFollowup() || !drawerConsumer || !entryId) return;
        if (!window.confirm('Remove this follow-up?')) return;
        var draft = $('fuNote') ? $('fuNote').value : '';
        try { deleteFollowup(drawerConsumer.id, entryId); }
        catch (e) { renderDrawer(drawerConsumer, { draft: draft, error: 'Could not update follow-ups on this device.' }); return; }
        renderDrawer(drawerConsumer, { draft: draft, focusNote: true });
        renderConsumers(lastView, true);
        renderFollowupBoard(lastView);
        renderStats(base());
      }

      $('drawer').addEventListener('click', function (e) {
        if (e.target === $('drawer') || e.target.closest('[data-close]')) { closeDrawer(); return; }
        if (e.target.closest('#fuSave')) { e.preventDefault(); saveFollowup(); return; }
        var del = e.target.closest('[data-del]');
        if (del) { e.preventDefault(); removeFollowup(del.getAttribute('data-del')); }
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });

      /* ------------------------------------------------------------------ events */

      $('q').addEventListener('input', UI.debounce(function () {
        f.q = this.value.trim();
        render();
        if (f.q) { var hit = all.filter(function (c) { return c.id === f.q; })[0]; if (hit) openDrawer(hit); }
      }, 180));
      $('stats').addEventListener('click', function (e) {
        var s = e.target.closest('.ui-stat'); if (!s) return;
        var k = s.getAttribute('data-k');
        followupRecentOnly = false;
        f.status = (k === 'all' || f.status === k) ? 'all' : k;
        render();
      });
      $('fuRange').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        followupRecentOnly = b.getAttribute('data-r') === 'recent';
        render({ keepPage: true });
      });
      function clearAll() {
        f.q = ''; f.status = 'all'; f.osd = 0; f.cls = ''; followupRecentOnly = false; $('q').value = '';
        render();
      }
      $('rhFiltersBar').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-rh-clear]');
        if (btn) {
          var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
          if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
            currentActiveFilters[idx].clear();
            render();
          }
          return;
        }
        if (e.target.closest('#rhClearBtn')) {
          clearAll();
        }
      });
      $('exportBtn').addEventListener('click', function () {
        if (!lastView.length) { UI.toast('Nothing to export'); return; }
        var where = dr.where();
        UI.exportCsv('disconnection-' + (where ? where.toLowerCase().replace(/\s+/g, '-') : 'all') + '.csv', [
          { key: 'id', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: 'address', label: 'Address' },
          { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: 'cccCode', label: 'CCC code' }, { key: '_supp', label: 'CCC' },
          { key: 'classDesc', label: 'Class' }, { key: 'tariff', label: 'Tariff' }, { key: 'osd', label: 'Outstanding OSD' }, { key: 'paid', label: 'Paid amount' },
          { key: 'dateStr', label: 'Paid/discon date' }, { key: 'status', label: 'Status' }, { key: 'remarks', label: 'Remarks' }
        ], lastView);
      });

      function reparse(t) { if (!t || brokenHeader(t)) return; prepare(t); render({ keepPage: true }); refreshOpenDrawer(); }

      MzoRows.refresh('refreshBtn', ROWS, reparse);

      // Sync buttons authorization
      metaP.then(function (m) {
        if (!m) return;
        if ($('crmSyncBtn')) $('crmSyncBtn').hidden = !(m.canCrmSync || m.canSync);
        if ($('crmPaySyncBtn')) $('crmPaySyncBtn').hidden = !(m.canCrmSync || m.canSync);
      });

      // Direct CRM Extraction & Sync from IBM DB2
      if ($('crmSyncBtn')) {
        $('crmSyncBtn').addEventListener('click', function () {
          if (!confirm('Directly extract the latest Disconnection Tracker list from IBM DB2 and update cloud VM cache?\n\nThis queries DB2 and publishes the updated baseline directly to the Oracle Cloud VM.\n(সরাসরি IBM DB2 থেকে ডিসকানেকশন ট্র্যাকার ডেটা এক্সট্র্যাক্ট করে ক্লাউড ক্যাশে আপডেট করবেন?)')) return;
          var b = this; b.disabled = true; b.classList.add('spin');
          var st = $('status'), stText = $('statusText'), stBar = $('statusBar');
          if (st) {
            st.hidden = false;
            stText.textContent = 'Extracting disconnection records from IBM DB2 and uploading to VM...';
            stBar.style.width = '35%';
          }

          fetch('/api/disconnection/crm-sync', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' }
          })
            .then(function (r) {
              return r.text().then(function (t) {
                var d; try { d = JSON.parse(t); } catch (e) { throw new Error(r.status === 401 ? 'Session expired. Please sign in again.' : 'Server returned HTTP ' + r.status); }
                if (!r.ok || d.status !== 'success') throw new Error(d.message || 'HTTP ' + r.status);
                return d;
              });
            })
            .then(function (res) {
              b.disabled = false; b.classList.remove('spin');
              if (st) {
                stBar.style.width = '100%';
                stText.textContent = res.message || 'DB2 Sync complete!';
              }
              UI.toast(res.message || 'Disconnection data extracted from DB2 and updated!');
              setTimeout(function () {
                if (st) st.hidden = true;
                MzoRows.reload(ROWS).then(reparse);
              }, 1200);
            })
            .catch(function (err) {
              b.disabled = false; b.classList.remove('spin');
              if (st) st.hidden = true;
              alert('DB2 Sync failed: ' + (err.message || err));
            });
        });
      }

      // Direct Payment Collection Sync from IBM DB2 (ISUDATA.WBSEDCL_DAILY_COLLECTIONS)
      if ($('crmPaySyncBtn')) {
        $('crmPaySyncBtn').addEventListener('click', function () {
          if (!confirm('Directly collect the latest daily payments from IBM DB2 and update payment status on the Oracle Cloud VM?\n\nThis queries DB2 daily collections across divisions and updates OSD balances directly on the VM.\n(সরাসরি IBM DB2 থেকে দৈনিক কালেকশন ডেটা নিয়ে VM-এ পেমেন্ট স্ট্যাটাস আপডেট করবেন?)')) return;
          var b = this; b.disabled = true; b.classList.add('spin');
          var st = $('status'), stText = $('statusText'), stBar = $('statusBar');
          if (st) {
            st.hidden = false;
            stText.textContent = 'Querying daily collections from IBM DB2 across divisions and updating VM...';
            stBar.style.width = '35%';
          }

          fetch('/api/disconnection/payment-sync', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' }
          })
            .then(function (r) {
              return r.text().then(function (t) {
                var d; try { d = JSON.parse(t); } catch (e) { throw new Error(r.status === 401 ? 'Session expired. Please sign in again.' : 'Server returned HTTP ' + r.status); }
                if (!r.ok || d.status !== 'success') throw new Error(d.message || 'HTTP ' + r.status);
                return d;
              });
            })
            .then(function (res) {
              b.disabled = false; b.classList.remove('spin');
              if (st) {
                stBar.style.width = '100%';
                stText.textContent = res.message || 'Payment sync complete!';
              }
              UI.toast(res.message || 'Payments collected from DB2 and updated on VM!');
              setTimeout(function () {
                if (st) st.hidden = true;
                loadPayments();
                MzoRows.reload(ROWS).then(reparse);
              }, 1200);
            })
            .catch(function (err) {
              b.disabled = false; b.classList.remove('spin');
              if (st) st.hidden = true;
              alert('Payment Sync failed: ' + (err.message || err));
            });
        });
      }

      // Numbers and dates from meta while the consumer file downloads.
      metaP.then(function (m) {
        var s = m && m.stats;
        if (s) {
          if (s.baseDate && $('baseDateVal')) $('baseDateVal').textContent = formatCleanDate(s.baseDate);
          if (s.lastPaymentDate && $('payUpdateVal')) $('payUpdateVal').textContent = formatCleanDate(s.lastPaymentDate);
          if (s.totalConsumers && !haveData) $('asOn').textContent = UI.n(s.totalConsumers) + ' consumers';
        }
        if (haveData || !s || !(s.totalConsumers > 0)) return;
        var t = s.totalConsumers, map = { 'Fully Paid': s.fullyPaid, 'Partially Paid': s.partiallyPaid, 'Disconnected': s.disconnected, 'No Action Taken': s.noAction };
        [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
          var k = el.getAttribute('data-k');
          if (k === 'all') setStat(el, t, null, UI.inr(s.totalOSD || 0) + ' outstanding');
          else if (map[k]) setStat(el, map[k].count || 0, t, UI.inr(map[k].amount || 0) + (k === 'Fully Paid' || k === 'Partially Paid' ? ' paid' : ' due'));
        });
      });

      /* ------------------------------------------------------------------ boot */

      var params = new URLSearchParams(location.search), first = true, rescued = false;
      function onData(t) {
        lastTableDoc = t;
        prepare(t);
        if (first) {
          first = false;
          dr.fromParams(params, all); // ?region= ?division= ?ccc=
          var st = params.get('status');
          if (st === 'noAction' || st === 'No Action Taken') f.status = 'No Action Taken';
          else if (st === 'disconnected' || st === 'Disconnected') f.status = 'Disconnected';
          else if (st === 'partiallyPaid' || st === 'Partially Paid') f.status = 'Partially Paid';
          else if (st === 'fullyPaid' || st === 'Fully Paid') f.status = 'Fully Paid';
          if (params.get('followups') === '1') dr.go('followups', true);
          render();
        } else {
          render({ keepPage: true });
          refreshOpenDrawer();
        }
      }
      // A blank row above the sheet's header leaves the rows without any of their columns.
      function brokenHeader(t) {
        var miss = {};
        t.issues.forEach(function (x) { if (x.check === 'header.missing') miss[x.column] = 1; });
        return !!(miss.con_id && miss.ccc_code);
      }
      // The server's dataset route (same origin; off the VM the server fetches the VM's copy)
      function fallback() {
        return metaP.then(function (m) {
          var target = (m && m.datasetUrl) || (m && m.csvUrl) || GOOGLE_CSV;
          return (window.mzoMirror ? mzoMirror.fetch : fetch)(target, { credentials: 'same-origin' });
        })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(function (text) { return fetch('/schema/' + ROWS + '.json', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (schema) { return MzoRows._compute(normalizeCsv(text), { key: ROWS, version: 'fallback', format: 'csv', schema: schema }); }); })
          .then(function (out) { var t = MzoRows.fromDoc(ROWS, JSON.parse(out.json), 'local'); if (brokenHeader(t)) throw new Error('no header'); onData(t); })
          .catch(function () {
            if (haveData) return;
            $('asOn').textContent = 'No data';
            $('table').innerHTML = '<div class="ui-empty">Could not load disconnection dataset from VM. <button type="button" class="ui-btn sm" onclick="location.reload()">Retry</button></div>';
          });
      }
      MzoRows.load(ROWS, function (t, info) {
        if (t && !brokenHeader(t)) onData(t);
        else if (t && !rescued) { rescued = true; fallback(); }
        else if (!t && info && info.error && !haveData) fallback();
      });
      startFollowupSync();
    });
  </script>
</body>

</html>
