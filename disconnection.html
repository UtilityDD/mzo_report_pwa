<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disconnection tracker · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <script src="/auth.js" defer></script>
  <style>
    .dc-base { padding: 10px 14px; font-size: 12px; line-height: 1.5; color: var(--mzo-muted); }
    .ui-stat .v .pct { margin-left: 6px; font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--mzo-muted); }
    .dc-legend { display: flex; gap: 14px; font-size: 12px; color: var(--mzo-muted); }
    .dc-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dc-act { display: grid; gap: 4px; }
    .dc-act .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px; align-items: center; gap: 12px; height: 26px; font-size: 12.5px; }
    .dc-act .row > span:first-child { color: var(--mzo-text-2); white-space: nowrap; }
    .dc-act .row > span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--mzo-muted); white-space: nowrap; }
    .dc-act i { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--mzo-chart-soft); }
    .dc-act i b { height: 100%; }
    .dc-act i b.p { background: var(--mzo-ok); }
    .dc-act i b.d { background: var(--mzo-bad); }
    .dc-list-h .right { display: flex; align-items: center; gap: 8px; }
    .ui-table td.num { white-space: nowrap; }
    .dc-note-cell { max-width: 420px; }
    .dc-note-cell .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }

    /* Drawer */
    .dc-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 16px 20px 4px; border: 1px solid var(--mzo-border); border-radius: 8px; overflow: hidden; }
    .dc-sum > div { padding: 10px 12px; box-shadow: 1px 0 0 var(--mzo-border); }
    .dc-sum .k { font-size: 12px; color: var(--mzo-muted); }
    .dc-sum .v { margin-top: 2px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .dc-fu { padding: 4px 20px 28px; }
    .dc-fu-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0 8px; border-top: 1px solid var(--mzo-border); }
    .dc-fu-h h4 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .dc-fu-list { margin: 0 0 12px; }
    .dc-fu-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--mzo-border); }
    .dc-fu-item:first-child { padding-top: 2px; }
    .dc-fu-item .n { font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .dc-fu-item .m { margin-top: 3px; font-size: 12px; color: var(--mzo-muted); }
    .dc-fu-empty { padding: 4px 0 12px; font-size: 12.5px; color: var(--mzo-muted); }
    .dc-fu textarea.ui-input { display: block; width: 100%; height: auto; min-height: 68px; padding: 8px 10px; line-height: 1.45; resize: vertical; }
    .dc-fu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
    .dc-fu-err { font-size: 12.5px; color: var(--mzo-bad); }
    @media (max-width: 760px) {
      .dc-sum { margin: 12px 16px 4px; }
      .dc-fu { padding: 4px 16px 24px; }
      .dc-note-cell { max-width: 220px; }
    }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div><h1>Disconnection tracker<span class="ui-badge ui-date" id="asOn">…</span></h1></div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="syncBtn" hidden><svg class="ui-i"><use href="#ui-sync"/></svg>Sync sheet</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h"><h2>Filters<small id="activeLabel"></small></h2><button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button></div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Consumer ID, name or address" aria-label="Search by consumer ID, name or address" autocomplete="off" /></label>
        </div>
        <div class="ui-side-sec"><div id="fOsd" aria-label="Outstanding"></div></div>
        <div class="ui-side-sec"><div id="fClass" aria-label="Class"></div></div>
        <p class="dc-base" id="base" hidden></p>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Status">
          <button type="button" class="ui-stat" data-k="all"><div class="k">Consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="Fully Paid"><div class="k"><span class="ui-dot ok"></span>Fully paid</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="Partially Paid"><div class="k"><span class="ui-dot"></span>Part paid</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="Disconnected"><div class="k"><span class="ui-dot bad"></span>Disconnected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="No Action Taken"><div class="k"><span class="ui-dot warn"></span>No action</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h dc-list-h">
            <h2>Detailed report</h2>
            <div class="right">
              <div class="ui-seg" id="fuRange" role="group" aria-label="Follow-up range" hidden>
                <button type="button" data-r="recent" aria-pressed="false">Last 7 days</button>
                <button type="button" data-r="all" aria-pressed="true">All</button>
              </div>
              <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
            </div>
          </div>
          <div id="drill"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
          <div id="followTable" hidden></div>
        </section>

        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Recent activity</h2><div class="dc-legend"><span><i class="ui-dot ok"></i>Paid</span><span><i class="ui-dot bad"></i>Disconnected</span></div></div>
          <div class="ui-panel-b"><div id="activity" class="dc-act"></div></div>
        </section>
      </div>
    </div>
  </main>

  <div class="ui-drawer" id="drawer" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <header>
        <div><h3 id="dTitle"></h3><p id="dSub"></p></div>
        <button type="button" class="ui-btn icon ghost" data-close aria-label="Close"><svg class="ui-i"><use href="#ui-x"/></svg></button>
      </header>
      <div id="dBody"></div>
    </section>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var HUB_KEY = 'CACHE_DISCONNECTION';
    var GOOGLE_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkl9m38XuD5aewajE7Fc0hucP9DWz1UwEqJZeu5wELWZivSEEXWrhl7RiHFSezGeGiGdDB53s1bWit/pub?gid=0&single=true&output=csv';
    var STATUS = {
      'Fully Paid': { label: 'Fully paid', cls: 'ok' },
      'Partially Paid': { label: 'Part paid', cls: '' },
      'Disconnected': { label: 'Disconnected', cls: 'bad' },
      'No Action Taken': { label: 'No action', cls: 'warn' }
    };

    var all = [], shown = '';
    // Detailed report: Region → Division → CCC → consumers (or their follow-ups)
    var dr = UI.drill({ el: 'drill', root: 'Malda Zone', lists: [{ k: 'list', label: 'Consumers' }, { k: 'followups', label: 'Follow-ups' }], onChange: function () { render(); } });
    var f = { q: '', status: 'all', osd: 0, cls: '' };
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });
    var followupRecentOnly = false, haveData = false;

    var metaP = fetch('/api/disconnection/meta', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });

    /* ------------------------------------------------------------------ parsing */

    // Google export sometimes prepends a blank comma-row before the real header.
    function normalizeCsv(text) {
      text = String(text || '').replace(/^﻿/, '');
      var lines = text.split(/\r?\n/);
      var idx = lines.findIndex(function (l) { var u = l.toUpperCase(); return u.indexOf('CCC_CODE') !== -1 && (u.indexOf('NOTOSD') !== -1 || u.indexOf('CON_ID') !== -1); });
      return idx <= 0 ? text : lines.slice(idx).join('\n');
    }
    function parseAmount() {
      for (var i = 0; i < arguments.length; i++) {
        var raw = arguments[i];
        if (raw == null) continue;
        var s = String(raw).trim().replace(/,/g, '');
        if (!s || /^#?n\/?a$/i.test(s)) continue;
        var n = parseFloat(s);
        if (!isNaN(n)) return n;
      }
      return 0;
    }
    function csvLine(line) {
      var out = [], cur = '', q = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
        else if (ch === ',' && !q) { out.push(cur); cur = ''; }
        else cur += ch;
      }
      out.push(cur);
      return out;
    }
    function osdDate(raw) {
      var s = String(raw || '').trim();
      if (!s || /^#?n\/?a$/i.test(s) || s === '0') return '';
      var m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (!m) return '';
      var y = m[3]; if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
      return m[1].padStart(2, '0') + '.' + m[2].padStart(2, '0') + '.' + y;
    }
    // DOM and IND/COM base OSD dates live on the first data row.
    function baseDates(text) {
      var lines = normalizeCsv(text).split(/\r?\n/).filter(function (l) { return l.trim(); });
      if (lines.length < 2) return { dom: '', ind: '' };
      var h = csvLine(lines[0]).map(function (x) { return String(x || '').replace(/\s+/g, ' ').trim(); });
      var row = csvLine(lines[1]);
      var v = h.findIndex(function (x) { return /^dom(\s|&)*com\s*base date$/i.test(x) || /^dom base date$/i.test(x); });
      var w = h.findIndex(function (x) { return /^ind/i.test(x) && /base date/i.test(x); });
      if (v < 0) v = 21; if (w < 0) w = 22;
      var dom = osdDate(row[v]) || osdDate(row[21]), ind = osdDate(row[w]) || osdDate(row[22]);
      if (!dom || !ind) {
        var tail = row.map(osdDate).filter(Boolean);
        if (!dom && tail[0]) dom = tail[0];
        if (!ind && tail.length) ind = tail[tail.length - 1];
      }
      return { dom: dom, ind: ind };
    }

    function office(code, unitName) {
      var o = UI.office(code);
      var c = String(code || '').trim();
      if (o.region && !o.division && /0000$/.test(c)) return { region: o.region, division: 'Bulk', ccc: o.region + ' region bulk' };
      if (!o.ccc && unitName) o = { region: o.region, division: o.division, ccc: UI.title(String(unitName).replace(/ CCC$/i, '').trim()) };
      return o;
    }

    function prepare(text) {
      var base = baseDates(text), maxDate = null;
      var rows = UI.csv(normalizeCsv(text));
      all = rows.map(function (row, idx) {
        var code = String(row.CCC_CODE || '').trim();
        var o = office(code, row.UNIT_NAME);
        var osd = parseAmount(row.NOTOSD, row.NOTOSD_UPD);
        var paid = parseAmount(row['FINAL PAID AMOUNT']);
        var dateStr = String(row['PAID/DISCON DATE'] || '').trim();
        var hasDate = dateStr !== '' && dateStr.toLowerCase() !== '#n/a' && dateStr !== '0';
        var dateObj = null;
        if (hasDate) {
          var p = dateStr.split('.');
          if (p.length === 3) {
            dateObj = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
            if (isNaN(dateObj.getTime())) { hasDate = false; dateObj = null; }
            else if (!maxDate || dateObj > maxDate) maxDate = dateObj;
          } else hasDate = false;
        }
        var paidStr = String(row['FINAL PAID AMOUNT'] || '').trim();
        var hasPaid = paidStr !== '' && paidStr.toLowerCase() !== '#n/a' && paidStr !== '0';
        var status = !hasDate ? 'No Action Taken' : !hasPaid ? 'Disconnected' : paid >= osd ? 'Fully Paid' : 'Partially Paid';
        return {
          id: String(row.CON_ID || ('synthetic-' + idx)).trim(),
          name: String(row.NAME || '').trim(),
          display: UI.title(String(row.NAME || '').trim().replace(/,\s*$/, '')),
          address: String(row.ADDRESS || '').trim(),
          CCC_CODE: code, cccCode: code,
          _region: o.region || 'Unmapped', _divn: o.division || 'Unmapped', _supp: o.ccc || 'Unmapped',
          osd: osd, paid: paid,
          dateStr: hasDate ? dateStr : '', dateObj: dateObj,
          remarks: String(row.REMARKS || '').trim(),
          status: status,
          classDesc: String(row.CLASS_DESC || '').trim(),
          tariff: String(row['TARIFF CLASS'] || '').trim(),
          meter: UI.blank(row.METER_NO) ? '' : String(row.METER_NO).trim(),
          mru: UI.blank(row.MRU) ? '' : String(row.MRU).trim(),
          dispute: UI.blank(row['BILL DISPUTE']) ? '' : String(row['BILL DISPUTE']).trim(),
          govt: UI.blank(row['GOVT STAT']) ? '' : String(row['GOVT STAT']).trim()
        };
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      haveData = true;
      $('asOn').textContent = maxDate ? 'As on ' + UI.fmtDate(maxDate) : UI.n(all.length) + ' consumers';
      var fmt = function (s) { return s ? UI.fmtDate(s) : '—'; };
      $('base').textContent = 'OSD base date: domestic ' + fmt(base.dom) + ', industrial and commercial ' + fmt(base.ind) + '.';
      $('base').hidden = !(base.dom || base.ind);
    }

    /* ------------------------------------------------------------------ filters */

    // Office path and panel filters (outstanding, class, search): the base every number is counted on.
    // `skip` leaves one facet out so it can count its own options.
    function base(skip) {
      var q = f.q.toLowerCase();
      var cls = skip === 'cls' ? '' : f.cls, osd = skip === 'osd' ? 0 : f.osd;
      return all.filter(function (c) {
        if (!dr.match(c)) return false;
        if (cls && c.classDesc !== cls) return false;
        if (osd && !(c.osd > osd)) return false;
        if (q && !(c.id.toLowerCase().indexOf(q) !== -1 || c.name.toLowerCase().indexOf(q) !== -1 || c.address.toLowerCase().indexOf(q) !== -1 ||
          c._supp.toLowerCase().indexOf(q) !== -1 || c._divn.toLowerCase().indexOf(q) !== -1 || c._region.toLowerCase().indexOf(q) !== -1 ||
          c.remarks.toLowerCase().indexOf(q) !== -1)) return false;
        return true;
      });
    }
    // The status cards filter the breakdowns and lists only.
    function narrow(rows) {
      return f.status === 'all' ? rows : rows.filter(function (c) { return c.status === f.status; });
    }

    /* ------------------------------------------------------------------ render */

    function amount(v) { return UI.inr(v); }
    function rupees(v) { return '₹' + UI.n(Math.round(v || 0)); }
    function setStat(el, count, total, sub) {
      el.querySelector('.v').innerHTML = UI.n(count) + (total != null ? '<span class="pct">' + (count ? UI.pct(count, total) : '0%') + '</span>' : '');
      if (sub != null) el.querySelector('.s').textContent = sub;
    }

    function renderStats(b) {
      var t = { 'Fully Paid': [0, 0], 'Partially Paid': [0, 0], 'Disconnected': [0, 0], 'No Action Taken': [0, 0] }, osd = 0;
      b.forEach(function (c) {
        osd += c.osd;
        var s = t[c.status]; s[0]++;
        s[1] += (c.status === 'Fully Paid' || c.status === 'Partially Paid') ? c.paid : c.osd;
      });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        if (k === 'all') setStat(el, b.length, null, amount(osd) + ' outstanding');
        else setStat(el, t[k][0], b.length, amount(t[k][1]) + (k === 'Fully Paid' || k === 'Partially Paid' ? ' paid' : ' due'));
        el.setAttribute('aria-pressed', String(f.status === k));
      });
    }

    function renderReport(view, keepPage) {
      var lv = dr.level();
      if (lv !== shown) { $('table').__ui = null; shown = lv; keepPage = false; }
      if (lv !== 'followups') followupRecentOnly = false;
      $('table').hidden = lv === 'followups';
      $('followTable').hidden = lv !== 'followups';
      $('fuRange').hidden = lv !== 'followups';
      $('exportBtn').hidden = lv === 'followups';
      [].forEach.call(document.querySelectorAll('#fuRange button'), function (b) { b.setAttribute('aria-pressed', String((b.getAttribute('data-r') === 'recent') === followupRecentOnly)); });
      if (lv === 'list') { renderConsumers(view, keepPage); return; }
      if (lv === 'followups') return; // drawn by renderFollowupBoard
      var groups = {};
      view.forEach(function (c) {
        var k = dr.key(c), g = groups[k] || (groups[k] = { name: k, parent: dr.parent(c), row: c, n: 0, osd: 0, paid: 0, discon: 0, none: 0 });
        g.n++; g.osd += c.osd;
        if (c.status === 'Fully Paid' || c.status === 'Partially Paid') g.paid++;
        else if (c.status === 'Disconnected') g.discon++;
        else g.none++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      var tot = list.reduce(function (a, g) { a.n += g.n; a.osd += g.osd; a.paid += g.paid; a.discon += g.discon; a.none += g.none; return a; }, { n: 0, osd: 0, paid: 0, discon: 0, none: 0, act: 0 });
      UI.table('table', {
        rows: list, sort: { key: 'osd', dir: 'desc' }, count: false,
        empty: 'No consumers for these filters.',
        columns: [
          { key: 'name', label: dr.label(), fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Consumers', num: true, fmt: UI.n },
          { key: 'osd', label: 'OSD', num: true, fmt: amount },
          { key: 'paid', label: 'Paid', num: true, fmt: UI.n, hideSm: true },
          { key: 'discon', label: 'Disconn.', num: true, fmt: UI.n, hideSm: true },
          { key: 'none', label: 'No action', num: true, fmt: UI.n },
          { key: 'act', label: 'Action taken', width: '22%', hideSm: true, sortVal: function (g) { return g.n ? (g.paid + g.discon) / g.n : 0; }, fmt: function (_, g) { var a = g.paid + g.discon; return UI.bar(a, g.n, a ? UI.pct(a, g.n) : '0%'); } }
        ],
        foot: list.length > 1 ? tot : null,
        onRow: function (g) { dr.open(g.name, g.row); }
      });
    }

    function renderActivity(view) {
      var days = {};
      view.forEach(function (c) {
        if (!c.dateObj || c.status === 'No Action Taken') return;
        var k = c.dateObj.getFullYear() * 10000 + (c.dateObj.getMonth() + 1) * 100 + c.dateObj.getDate();
        var d = days[k] || (days[k] = { k: k, d: c.dateObj, p: 0, x: 0 });
        if (c.status === 'Disconnected') d.x++; else d.p++;
      });
      var list = Object.keys(days).map(function (k) { return days[k]; }).sort(function (a, b) { return b.k - a.k; }).slice(0, 10);
      if (!list.length) { $('activity').innerHTML = '<div class="ui-empty" style="padding:20px 0">No payments or disconnections recorded.</div>'; return; }
      var max = Math.max.apply(null, list.map(function (d) { return d.p + d.x; }));
      var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      $('activity').innerHTML = list.map(function (d) {
        return '<div class="row" title="' + UI.fmtDate(d.d) + ': ' + UI.n(d.p) + ' paid, ' + UI.n(d.x) + ' disconnected"><span>' + d.d.getDate() + ' ' + MON[d.d.getMonth()] + '</span>' +
          '<i><b class="p" style="width:' + (d.p / max * 100) + '%"></b><b class="d" style="width:' + (d.x / max * 100) + '%"></b></i>' +
          '<span>' + UI.n(d.p) + ' · ' + UI.n(d.x) + '</span></div>';
      }).join('');
    }

    function facets() {
      var bo = base('osd'), sum = function (min) { return bo.filter(function (c) { return c.osd > min; }).length; };
      UI.facet('fOsd', [{ value: 3000, label: 'OSD above ₹3,000', count: sum(3000) }, { value: 5000, label: 'OSD above ₹5,000', count: sum(5000) }], f.osd, function (v) { f.osd = +v || 0; render(); });
      var cls = {}; base('cls').forEach(function (c) { if (c.classDesc) cls[c.classDesc] = (cls[c.classDesc] || 0) + 1; });
      var keys = Object.keys(cls); if (f.cls && keys.indexOf(f.cls) === -1) keys.push(f.cls);
      UI.facet('fClass', keys.sort(function (a, b) { return (cls[b] || 0) - (cls[a] || 0); }).map(function (k) { return { value: k, label: UI.title(k), count: cls[k] || 0 }; }), f.cls, function (v) { f.cls = v; render(); });

    /* ------------------------------------------------------------------ follow-ups
       Same storage, outbox and Apps Script contract as before:
       store mzo_discon_followups, outbox mzo_discon_followup_outbox, sheetScriptUrl from
       /api/disconnection/meta, pull every 15 s while visible. A saved note paints and the
       box clears before the network write. Only an admin can delete. */

    var FOLLOWUP_STORE_KEY = 'mzo_discon_followups';
    var FOLLOWUP_OUTBOX_KEY = 'mzo_discon_followup_outbox';

    }
    function readFollowupOutbox() {
      try { var raw = localStorage.getItem(FOLLOWUP_OUTBOX_KEY); var d = raw ? JSON.parse(raw) : []; return Array.isArray(d) ? d : []; } catch (e) { return []; }
    }
    function writeFollowupOutbox(list) {
      var jobs = Array.isArray(list) ? list : [];
      if (!jobs.length) { localStorage.removeItem(FOLLOWUP_OUTBOX_KEY); return; }
      localStorage.setItem(FOLLOWUP_OUTBOX_KEY, JSON.stringify(jobs.slice(-300)));
    }
    function hiddenFollowupIds(queue) {
      var ids = new Set();
      (queue || readFollowupOutbox()).forEach(function (j) { if (j && j.op === 'delete' && j.id) ids.add(j.id); });
      return ids;
    }
    function enqueueFollowup(job) {
      if (!job || !job.id || !job.op) return;
      var q = readFollowupOutbox();
      if (q.some(function (i) { return i && i.op === job.op && i.id === job.id; })) return;
      q.push(job); writeFollowupOutbox(q);
    }
    function getFollowups(id) {
      var key = fuKey(id); if (!key) return [];
      var list = readFollowupStore()[key]; if (!Array.isArray(list)) return [];
      var hidden = hiddenFollowupIds();
      return list.filter(function (e) { return e && typeof e.note === 'string' && e.note.trim() && !hidden.has(e.id); })
        .slice().sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
    }
    function recentFollowupIds() {
      var cutoff = Date.now() - 7 * 864e5, hidden = hiddenFollowupIds(), ids = new Set(), store = readFollowupStore();
      Object.keys(store).forEach(function (conId) {
        var key = fuKey(conId);
        (store[conId] || []).forEach(function (e) { if (!e || hidden.has(e.id)) return; var at = Date.parse(e.at); if (!isNaN(at) && at >= cutoff) ids.add(key); });
      });
      return ids;
    }
    function profile() { try { return JSON.parse(localStorage.getItem('mzo_user_profile') || '{}') || {}; } catch (e) { return {}; } }
    function canDeleteFollowup() { var p = profile(); return String(p.role || p.Role || '').trim().toLowerCase() === 'admin'; }
    function currentUserName() {
      var p = profile(), n = String(p.Name || p.name || '').trim();
      return n ? n.slice(0, 80) : String(p.Username || p.username || '').trim().slice(0, 80);
    }
    function fuDate(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
    function quietLine(e) { var n = String(e && e.by || '').trim(), d = fuDate(e && e.at); return n && d ? n + ' · ' + d : (n || d); }
    function newFollowupId() { return (window.crypto && typeof crypto.randomUUID === 'function') ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function fuFingerprint(id) { return getFollowups(id).map(function (e) { return e.id; }).sort().join('|'); }
    function fuCountLabel(id) { var n = getFollowups(id).length; return !n ? '' : n === 1 ? '1 report' : n + ' reports'; }

    function addFollowup(id, note) {
      var key = fuKey(id), text = String(note || '').trim().slice(0, FOLLOWUP_NOTE_MAX);
      if (!fuCanSave(key) || !text) return { ok: false };
      var store = readFollowupStore(), list = Array.isArray(store[key]) ? store[key] : [];
      var entry = { id: newFollowupId(), at: new Date().toISOString(), by: currentUserName(), note: text, sync: followupScriptUrl ? 'pending' : 'local' };
      list.push(entry); store[key] = list; writeFollowupStore(store);

      return { ok: true };
    }
    // Remove one note id from every consumer's list (a note can only live under one consumer).
    function dropFromStore(store, entryId) {
      Object.keys(store).forEach(function (k) {
        store[k] = (store[k] || []).filter(function (e) { return e && e.id !== entryId; });
        if (!store[k].length) delete store[k];
      });
    }
    function deleteFollowup(id, entryId) {
      if (!canDeleteFollowup()) return;

      var store = readFollowupStore();
      dropFromStore(store, entryId);
      writeFollowupStore(store);
      // A note that never reached the sheet just leaves the outbox; a synced one queues a delete.
      var queue = readFollowupOutbox(), isPendingAdd = function (j) { return j && j.op === 'add' && j.id === entryId; };
      var pendingAdd = queue.some(isPendingAdd), kept = queue.filter(function (j) { return !isPendingAdd(j); });
      if (!pendingAdd && followupScriptUrl) kept.push({ op: 'delete', id: entryId, conId: key });

    }
    // Apps Script call with a 20 s timeout; resolves to the parsed JSON when the script answers success/ok.
    function scriptCall(url, init) {

    }
    function applyRemoteFollowups(data) {

      var deleted = new Set(Array.isArray(data && data.deletedIds) ? data.deletedIds.map(String) : []);
      var store = readFollowupStore(), queue = readFollowupOutbox(), remoteIds = new Set();
      comments.forEach(function (row) {
        var id = String(row && row.id || '').trim();
        var conId = fuKey(row && (row.conId || row.con_id));
        var note = String(row && row.note || '').trim().slice(0, FOLLOWUP_NOTE_MAX);
        if (!id || !conId || !note || deleted.has(id)) return;
        remoteIds.add(id);
        if (queue.some(function (j) { return j && j.op === 'delete' && j.id === id; })) return;
        dropFromStore(store, id);
        var list = store[conId] || [];
        list.push({ id: id, at: String(row.at || ''), by: String(row.by || '').slice(0, 80), note: note, sync: 'ok' });
        store[conId] = list;
        queue = queue.filter(function (j) { return !(j && j.op === 'add' && j.id === id); });
      });
      deleted.forEach(function (id) {
        dropFromStore(store, id);

      });
      queue = queue.filter(function (j) { return !j || j.op !== 'delete' || !(deleted.has(j.id) || !remoteIds.has(j.id)); });

    }
    function postFollowupJob(job) {

    function flushFollowupOutbox() {

          if (job.op === 'add') {

            list.forEach(function (e) { if (e && e.id === job.id) e.sync = 'ok'; });

    // A pull refreshes the follow-up list only; it never reloads the consumer CSV.
    function maybeRefreshFollowups() {

      if (!openConsumerId || $('drawer').hidden) return;
      var fp = fuFingerprint(openConsumerId);
      if (fp === followupShownFp) return;
      followupShownFp = fp;
      var host = $('fuList');
      if (!host) return;
      host.innerHTML = fuListHtml(openConsumerId);

    /* ------------------------------------------------------------------ drawer */

    function saveFollowup() {
      if (!drawerConsumer) return;

      if (del) { e.preventDefault(); removeFollowup(del.getAttribute('data-del')); }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });

    /* ------------------------------------------------------------------ events */

    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      render();
      if (f.q) { var hit = all.filter(function (c) { return c.id === f.q; })[0]; if (hit) openDrawer(hit); }
    }, 180));
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat'); if (!s) return;
      var k = s.getAttribute('data-k');
      followupRecentOnly = false;
      f.status = (k === 'all' || f.status === k) ? 'all' : k;
      render();
    });
    $('fuRange').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      followupRecentOnly = b.getAttribute('data-r') === 'recent';
      render({ keepPage: true });
    });
    function clearAll() {
      f.q = ''; f.status = 'all'; f.osd = 0; f.cls = ''; followupRecentOnly = false; $('q').value = '';
      render();
    }
    $('exportBtn').addEventListener('click', function () {
      if (!lastView.length) { UI.toast('Nothing to export'); return; }
      var where = dr.where();
      UI.exportCsv('disconnection-' + (where ? where.toLowerCase().replace(/\s+/g, '-') : 'all') + '.csv', [
        { key: 'id', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: 'address', label: 'Address' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: 'cccCode', label: 'CCC code' }, { key: '_supp', label: 'CCC' },
        { key: 'classDesc', label: 'Class' }, { key: 'tariff', label: 'Tariff' }, { key: 'osd', label: 'Outstanding OSD' }, { key: 'paid', label: 'Paid amount' },
        { key: 'dateStr', label: 'Paid/discon date' }, { key: 'status', label: 'Status' }, { key: 'remarks', label: 'Remarks' }
      ], lastView);
    });

    function reparse(text) { if (!text) return; prepare(text); render({ keepPage: true }); refreshOpenDrawer(); }

    UI.refresh('refreshBtn', HUB_KEY, reparse);

    // Sync from the Google Sheet to the cloud cache (Admin, dm1, disconnection-sync-autho).
    metaP.then(function (m) { if (m && m.canSync) $('syncBtn').hidden = false; });
    $('syncBtn').addEventListener('click', function () {
      if (!confirm('Sync the latest disconnection data from the Google Sheet to the cloud cache?\n\n(গুগল শিট থেকে ক্লাউড ক্যাশে নতুন ডেটা সিঙ্ক করবেন?)')) return;
      var b = this; b.disabled = true; b.classList.add('spin');
      fetch('/api/disconnection/sync', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' } })
        .then(function (r) {
          return r.text().then(function (t) {
            var d; try { d = JSON.parse(t); } catch (e) { throw new Error(r.status === 401 ? 'Session expired. Please sign in again.' : 'Server returned HTTP ' + r.status); }
            if (!r.ok || d.status !== 'success') throw new Error(d.message || 'HTTP ' + r.status);
            return d;
          });
        })
        .then(function (d) {
          UI.toast(d.message || 'Synced from the sheet');
          return window.mzoDataHub.refresh(HUB_KEY).then(function () { return window.mzoDataHub._peek(HUB_KEY); }).then(reparse);
        })
        .catch(function (e) { alert('Sync failed: ' + (e.message || e)); })
        .then(function () { b.disabled = false; b.classList.remove('spin'); });
    });

    // Numbers from meta while the consumer file downloads.
    metaP.then(function (m) {
      var s = m && m.stats;
      if (haveData || !s || !(s.totalConsumers > 0)) return;
      var t = s.totalConsumers, map = { 'Fully Paid': s.fullyPaid, 'Partially Paid': s.partiallyPaid, 'Disconnected': s.disconnected, 'No Action Taken': s.noAction };
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        if (k === 'all') setStat(el, t, null, UI.inr(s.totalOSD || 0) + ' outstanding');
        else if (map[k]) setStat(el, map[k].count || 0, t, UI.inr(map[k].amount || 0) + (k === 'Fully Paid' || k === 'Partially Paid' ? ' paid' : ' due'));
      });
    });

    /* ------------------------------------------------------------------ boot */

    var params = new URLSearchParams(location.search), first = true;
    function onData(text) {
      prepare(text);
      if (first) {
        first = false;
        dr.fromParams(params, all); // ?region= ?division= ?ccc=
        var st = params.get('status');
        if (st === 'noAction' || st === 'No Action Taken') f.status = 'No Action Taken';
        else if (st === 'disconnected' || st === 'Disconnected') f.status = 'Disconnected';
        else if (st === 'partiallyPaid' || st === 'Partially Paid') f.status = 'Partially Paid';
        if (params.get('followups') === '1') dr.go('followups', true);
        render();
      } else {
        render({ keepPage: true });
        refreshOpenDrawer();
      }
    }
    // Last resort when the hub has no body: meta csvUrl (Supabase Storage) or the published sheet.
    function fallback() {
      return metaP.then(function (m) { return fetch((m && m.csvUrl) || GOOGLE_CSV); })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(onData)
        .catch(function () {
          $('asOn').textContent = 'No data';
          $('table').innerHTML = '<div class="ui-empty">Could not load data. <button type="button" class="ui-btn sm" onclick="location.reload()">Retry</button></div>';
        });
    }
    UI.load(HUB_KEY, function (text, info) {
      if (text) onData(text);
      else if (info && info.error && !haveData) fallback();
    });
    startFollowupSync();
  });
  </script>
</body>
</html>
