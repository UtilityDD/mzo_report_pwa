<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Click Executive Briefing | MZO Reports</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="mzo_scope.js?v=2"></script>
  <style>
    :root {
      --bg-dark: #0b1120;
      --bg-card: #151e32;
      --bg-card-hover: #1c2742;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-primary: #4f46e5;
      --accent-secondary: #06b6d4;
      --critical-color: #ef4444;
      --critical-bg: rgba(239, 68, 68, 0.12);
      --critical-border: rgba(239, 68, 68, 0.35);
      --high-color: #f97316;
      --high-bg: rgba(249, 115, 22, 0.12);
      --high-border: rgba(249, 115, 22, 0.35);
      --watch-color: #eab308;
      --watch-bg: rgba(234, 179, 8, 0.12);
      --watch-border: rgba(234, 179, 8, 0.35);
      --radius: 10px;
    }

    body.light-theme {
      --bg-dark: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(0, 0, 0, 0.08);
      --critical-bg: rgba(254, 226, 226, 0.65);
      --high-bg: rgba(255, 237, 213, 0.65);
      --watch-bg: rgba(254, 249, 195, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 50px;
    }

    /* Container */
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* Header Bar (No separate back button) */
    .briefing-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .title-block {
      display: flex;
      flex-direction: column;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .main-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .main-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .scope-select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .btn-action-primary {
      background: #15803d;
      color: #ffffff;
      border: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(21, 128, 61, 0.3);
      transition: all 0.15s ease;
    }

    .btn-action-primary:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }

    .btn-action-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action-secondary:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    /* KPI Summary Ribbon */
    .kpi-ribbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .kpi-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .kpi-chip-info {
      display: flex;
      flex-direction: column;
    }

    .kpi-chip-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .kpi-chip-value {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.2;
      margin-top: 1px;
    }

    .kpi-chip-icon {
      font-size: 20px;
      opacity: 0.85;
    }

    .kpi-chip.critical { border-left: 3px solid var(--critical-color); }
    .kpi-chip.critical .kpi-chip-value { color: var(--critical-color); }
    .kpi-chip.critical .kpi-chip-icon { color: var(--critical-color); }

    .kpi-chip.high { border-left: 3px solid var(--high-color); }
    .kpi-chip.high .kpi-chip-value { color: var(--high-color); }
    .kpi-chip.high .kpi-chip-icon { color: var(--high-color); }

    .kpi-chip.watch { border-left: 3px solid var(--watch-color); }
    .kpi-chip.watch .kpi-chip-value { color: var(--watch-color); }
    .kpi-chip.watch .kpi-chip-icon { color: var(--watch-color); }

    .kpi-chip.info { border-left: 3px solid var(--accent-secondary); }
    .kpi-chip.info .kpi-chip-value { color: var(--accent-secondary); font-size: 1rem; }
    .kpi-chip.info .kpi-chip-icon { color: var(--accent-secondary); }

    /* Tabulated Layout Styles */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .table-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
    }

    .table-title {
      font-size: 0.88rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-title.critical { color: var(--critical-color); }
    .table-title.high { color: var(--high-color); }
    .table-title.watch { color: var(--watch-color); }

    .table-count-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--border-color);
      color: var(--text-muted);
    }

    .briefing-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.84rem;
    }

    .briefing-table th {
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-color);
    }

    body.light-theme .briefing-table th {
      background: #f1f5f9;
      color: #64748b;
    }

    .briefing-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      color: var(--text-main);
    }

    .briefing-table tbody tr:last-child td {
      border-bottom: none;
    }

    .briefing-table tbody tr {
      transition: background 0.12s ease;
    }

    .briefing-table tbody tr:hover {
      background: var(--bg-card-hover);
    }

    /* Column Specifics */
    .col-priority {
      width: 140px;
    }

    .col-topic {
      width: 240px;
      font-weight: 600;
    }

    .col-metric {
      width: 130px;
      text-align: right;
    }

    .col-hotspots {
      min-width: 260px;
    }

    .col-action {
      width: 100px;
      text-align: right;
    }

    /* Priority Indicator Tag */
    .priority-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .priority-tag.critical { color: var(--critical-color); }
    .priority-tag.high { color: var(--high-color); }
    .priority-tag.watch { color: var(--watch-color); }

    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .priority-tag.critical .tag-dot { background: var(--critical-color); box-shadow: 0 0 6px rgba(239, 68, 68, 0.6); }
    .priority-tag.high .tag-dot { background: var(--high-color); box-shadow: 0 0 6px rgba(249, 115, 22, 0.6); }
    .priority-tag.watch .tag-dot { background: var(--watch-color); box-shadow: 0 0 6px rgba(234, 179, 8, 0.6); }

    /* Topic Cell */
    .domain-badge {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .topic-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* Metric Cell */
    .metric-num {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .metric-num.critical { color: var(--critical-color); }
    .metric-num.high { color: var(--high-color); }
    .metric-num.watch { color: var(--watch-color); }

    .metric-scope {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Hotspots Cell */
    .hotspots-flow {
      font-size: 0.81rem;
      line-height: 1.45;
      color: var(--text-main);
    }

    .hotspots-flow b {
      font-weight: 700;
      color: var(--text-main);
    }

    .hotspots-flow .sep {
      color: var(--text-muted);
      margin: 0 4px;
      opacity: 0.5;
    }

    /* Action Link */
    .btn-view-link {
      background: rgba(79, 70, 229, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-view-link:hover {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      transform: translateX(1px);
    }

    body.light-theme .btn-view-link {
      background: #eef2ff;
      color: #4338ca;
      border-color: #c7d2fe;
    }

    body.light-theme .btn-view-link:hover {
      background: #4338ca;
      color: #ffffff;
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border-color);
      border-top-color: #fbbf24;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .briefing-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15);
      z-index: 10090;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .briefing-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive: Mobile Stacked Tabular Cards */
    @media (max-width: 768px) {
      .briefing-nav {
        flex-direction: column;
        align-items: flex-start;
      }
      .nav-right {
        width: 100%;
        justify-content: flex-start;
      }
      .scope-select {
        flex: 1;
      }
      .briefing-table thead {
        display: none;
      }
      .briefing-table, .briefing-table tbody, .briefing-table tr, .briefing-table td {
        display: block;
        width: 100%;
      }
      .briefing-table tr {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-color);
      }
      .briefing-table td {
        padding: 4px 0;
        border: none;
      }
      .col-metric {
        text-align: left;
        margin-top: 4px;
      }
      .col-action {
        text-align: left;
        margin-top: 8px;
      }
      .btn-view-link {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="page-container">
    <!-- Top Navigation Bar (No separate back button) -->
    <header class="briefing-nav">
      <div class="title-block">
        <h1 class="main-title">1-Click Executive Briefing</h1>
        <span class="main-subtitle">Priority bottlenecks & revenue risk assessment</span>
      </div>

      <div class="nav-right">
        <select id="divisionScopeSelect" class="scope-select" title="Filter by Division Scope">
          <option value="all">🌐 All Malda Zone (MZO)</option>
          <option value="Malda">Malda Division</option>
          <option value="Chanchal">Chanchal Division</option>
          <option value="Gazole">Gazole Division</option>
          <option value="Raiganj">Raiganj Division</option>
          <option value="Islampur">Islampur Division</option>
          <option value="Balurghat">Balurghat Division</option>
          <option value="Buniadpur">Buniadpur Division</option>
        </select>

        <button type="button" class="btn-action-primary" id="btnCopyWhatsApp" title="Copy clean WhatsApp briefing digest">
          <i class="fab fa-whatsapp"></i> <span>Copy WhatsApp Briefing</span>
        </button>

        <button type="button" class="btn-action-secondary" id="btnRefreshBriefing" title="Refresh latest data">
          <i class="fas fa-sync-alt"></i> <span>Refresh</span>
        </button>

        <button type="button" class="btn-action-secondary" id="btnThemeToggle" title="Toggle Light/Dark Theme">
          <i class="fas fa-sun" id="themeIcon"></i>
        </button>
      </div>
    </header>

    <!-- KPI Summary Ribbon -->
    <section class="kpi-ribbon" id="kpiRibbon">
      <div class="kpi-chip critical">
        <div class="kpi-chip-info">
          <span class="kpi-chip-label">Critical Action</span>
          <span class="kpi-chip-value" id="kpiCriticalCount">3</span>
        </div>
        <div class="kpi-chip-icon"><i class="fas fa-triangle-exclamation"></i></div>
      </div>

      <div class="kpi-chip high">
        <div class="kpi-chip-info">
          <span class="kpi-chip-label">High Priority</span>
          <span class="kpi-chip-value" id="kpiHighCount">3</span>
        </div>
        <div class="kpi-chip-icon"><i class="fas fa-circle-exclamation"></i></div>
      </div>

      <div class="kpi-chip watch">
        <div class="kpi-chip-info">
          <span class="kpi-chip-label">Watch / Advisory</span>
          <span class="kpi-chip-value" id="kpiWatchCount">2</span>
        </div>
        <div class="kpi-chip-icon"><i class="fas fa-eye"></i></div>
      </div>

      <div class="kpi-chip info">
        <div class="kpi-chip-info">
          <span class="kpi-chip-label">Scope & Status</span>
          <span class="kpi-chip-value" id="kpiScopeStatus">Malda Zone</span>
        </div>
        <div class="kpi-chip-icon"><i class="fas fa-calendar-check"></i></div>
      </div>
    </section>

    <!-- Main Briefing Tabulated Content -->
    <main id="briefingContent">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading operational priority alerts...</p>
      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="briefingToast" class="briefing-toast"></div>

  <script>
    (function () {
      'use strict';

      let briefingData = null;
      let activeDivision = 'all';

      // Initialize theme from localStorage
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        updateThemeIcon(true);
      } else {
        updateThemeIcon(false);
      }

      function updateThemeIcon(isLight) {
        const icon = document.getElementById('themeIcon');
        if (icon) {
          icon.className = isLight ? 'fas fa-moon' : 'fas fa-sun';
        }
      }

      document.getElementById('btnThemeToggle')?.addEventListener('click', () => {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeIcon(isLight);
      });

      // Division scope selector
      document.getElementById('divisionScopeSelect')?.addEventListener('change', (e) => {
        activeDivision = e.target.value;
        renderBriefing();
      });

      // Refresh button
      document.getElementById('btnRefreshBriefing')?.addEventListener('click', () => {
        loadData(true);
      });

      // Copy WhatsApp Briefing button
      document.getElementById('btnCopyWhatsApp')?.addEventListener('click', () => {
        copyWhatsAppDigest();
      });

      // Fetch briefing data from server
      async function loadData(force = false) {
        const contentEl = document.getElementById('briefingContent');
        if (force && contentEl) {
          contentEl.innerHTML = `
            <div class="loading-state">
              <div class="spinner"></div>
              <p>Refreshing operational data...</p>
            </div>
          `;
        }

        try {
          const res = await fetch('/api/executive/briefing', { credentials: 'same-origin' });
          if (res.ok) {
            const json = await res.json();
            if (json && json.briefing) {
              briefingData = json.briefing;
              renderBriefing();
              return;
            }
          }
          throw new Error('Invalid server response');
        } catch (err) {
          console.error('[Briefing Page] Load error:', err);
          if (contentEl) {
            contentEl.innerHTML = `
              <div class="loading-state">
                <i class="fas fa-triangle-exclamation" style="font-size: 30px; color: #ef4444; margin-bottom: 10px;"></i>
                <p>Failed to load executive briefing data.</p>
                <button type="button" class="btn-action-primary" style="margin-top: 12px;" onclick="location.reload()">Retry</button>
              </div>
            `;
          }
        }
      }

      function getDivisionStat(item, divName) {
        if (!item || !item.divisions || !divName || divName === 'all') return null;
        if (item.divisions[divName] !== undefined) return item.divisions[divName];
        const upper = `${divName.toUpperCase()} DIVISION`;
        if (item.divisions[upper] !== undefined) return item.divisions[upper];
        return null;
      }

      function renderBriefing() {
        if (!briefingData || !briefingData.items) return;

        const isDivMode = (activeDivision && activeDivision !== 'all');
        const asOn = briefingData.asOn || 'Latest';

        // Update KPI ribbon
        const summary = briefingData.summaryCounts || {};
        document.getElementById('kpiCriticalCount').textContent = summary.critical || 0;
        document.getElementById('kpiHighCount').textContent = summary.high || 0;
        document.getElementById('kpiWatchCount').textContent = summary.watch || 0;
        document.getElementById('kpiScopeStatus').textContent = isDivMode ? `${activeDivision} Div` : `${asOn}`;

        const items = briefingData.items;

        const groups = [
          {
            priority: 'critical',
            title: 'Critical Action Items (Immediate Intervention)',
            icon: 'fa-triangle-exclamation',
            class: 'critical'
          },
          {
            priority: 'high',
            title: 'High Priority Bottlenecks (Urgent Action)',
            icon: 'fa-circle-exclamation',
            class: 'high'
          },
          {
            priority: 'watch',
            title: 'Operational Watch & Follow-up',
            icon: 'fa-eye',
            class: 'watch'
          }
        ];

        let html = '';

        groups.forEach(g => {
          const groupItems = items.filter(i => i.priority === g.priority);
          if (groupItems.length === 0) return;

          html += `
            <div class="table-container">
              <div class="table-header-bar">
                <div class="table-title ${g.class}">
                  <i class="fas ${g.icon}"></i>
                  <span>${g.title}</span>
                </div>
                <span class="table-count-badge">${groupItems.length} Item${groupItems.length > 1 ? 's' : ''}</span>
              </div>
              <table class="briefing-table">
                <thead>
                  <tr>
                    <th class="col-priority">Domain & Status</th>
                    <th class="col-topic">Operational Bottleneck</th>
                    <th class="col-metric">Metric</th>
                    <th class="col-hotspots">${isDivMode ? 'Field CCC Hotspots' : 'Division Distribution'}</th>
                    <th class="col-action">Action</th>
                  </tr>
                </thead>
                <tbody>
          `;

          groupItems.forEach((item) => {
            let metricDisplay = item.metric;
            let scopeLabel = 'MZO Zone';
            let titleText = item.title;
            let hotspotsText = '';

            if (isDivMode) {
              scopeLabel = `${activeDivision} Div`;
              const divVal = getDivisionStat(item, activeDivision);
              const cccList = (item.divisionCccs && item.divisionCccs[activeDivision]) ? item.divisionCccs[activeDivision] : [];

              if (item.id === 'mc-delayed-90' || item.id === 'mc-industrial-pending') {
                const cnt = (typeof divVal === 'number') ? divVal : (divVal?.total || 0);
                metricDisplay = cnt.toLocaleString();
                titleText = `${item.title} (${cnt.toLocaleString()} pending)`;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.count.toLocaleString()})`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'No critical concentration recorded.';
                }
              } else if (item.id === 'discon-no-action') {
                const noAct = (divVal && typeof divVal === 'object') ? (divVal.noAction || 0) : 0;
                const osd = (divVal && typeof divVal === 'object') ? (divVal.osd || 0) : 0;
                const cr = (osd / 10000000).toFixed(2);
                metricDisplay = `₹${cr} Cr`;
                titleText = `OSD Defaulters (${noAct.toLocaleString()} without action)`;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.count.toLocaleString()} · ₹${c.amountCr} Cr)`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'Under review in division.';
                }
              } else if (item.id === 'defective-over-10m') {
                const o10 = (divVal && typeof divVal === 'object') ? (divVal.over10 || 0) : 0;
                metricDisplay = o10.toLocaleString();
                titleText = `Defective > 10 Months (${o10.toLocaleString()} meters)`;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.over10.toLocaleString()})`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'Replacement drive scheduled.';
                }
              } else if (item.id === 'load-ext-ageing-1y') {
                const cnt = (typeof divVal === 'number') ? divVal : (divVal?.total || 0);
                metricDisplay = cnt.toLocaleString();
                titleText = `Pending Load Extension (${cnt.toLocaleString()} apps)`;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.count.toLocaleString()})`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'Verification in progress.';
                }
              } else if (item.id === 'defective-3phase-ind') {
                const ph3 = (divVal && typeof divVal === 'object') ? (divVal.ph3 || 0) : 0;
                metricDisplay = ph3.toLocaleString();
                titleText = `3-Phase & Industrial Defective (${ph3.toLocaleString()})`;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.ph3 || 0})`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'Commercial meters under review.';
                }
              } else if (item.id === 'nsc-delayed-30') {
                const cnt = (typeof divVal === 'number') ? divVal : (divVal || 0);
                metricDisplay = cnt.toLocaleString();
                titleText = `Pending NSC > 30 Days (${cnt.toLocaleString()} apps)`;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.count.toLocaleString()})`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'No critical delay concentration in division.';
                }
              } else if (item.id === 'nsc-withheld') {
                titleText = item.title;
                hotspotsText = (item.hotspots || []).map(h => `<b>${h.division}</b>: ${h.count.toLocaleString()}`).join('<span class="sep">·</span>');
              } else if (item.id === 'discon-partially-paid') {
                titleText = item.title;
                if (cccList.length > 0) {
                  hotspotsText = cccList.slice(0, 5).map(c => `<b>${c.name}</b> (${c.count.toLocaleString()})`).join('<span class="sep">·</span>');
                } else {
                  hotspotsText = 'Installment monitoring active.';
                }
              }
            } else {
              // Zone-wide mode
              metricDisplay = item.metric;
              scopeLabel = 'Malda Zone';
              titleText = item.title;
              if (item.hotspots && item.hotspots.length > 0) {
                hotspotsText = item.hotspots.slice(0, 5).map(h => {
                  const amt = h.amount ? ` · ₹${h.amount}` : '';
                  return `<b>${h.division}</b> (${h.count.toLocaleString()}${amt})`;
                }).join('<span class="sep">·</span>');
              } else {
                hotspotsText = 'Zone-wide operational assessment.';
              }
            }

            html += `
              <tr>
                <td class="col-priority">
                  <span class="priority-tag ${item.priority}">
                    <span class="tag-dot"></span>
                    <span>${item.domain}</span>
                  </span>
                </td>
                <td class="col-topic">
                  <div class="topic-name">${titleText}</div>
                </td>
                <td class="col-metric">
                  <div class="metric-num ${item.priority}">${metricDisplay}</div>
                  <div class="metric-scope">(${scopeLabel})</div>
                </td>
                <td class="col-hotspots">
                  <div class="hotspots-flow">${hotspotsText}</div>
                </td>
                <td class="col-action">
                  <button type="button" class="btn-view-link" data-idx="${items.indexOf(item)}">
                    <span>View</span>
                    <i class="fas fa-arrow-right"></i>
                  </button>
                </td>
              </tr>
            `;
          });

          html += `
                </tbody>
              </table>
            </div>
          `;
        });

        const contentEl = document.getElementById('briefingContent');
        if (contentEl) {
          contentEl.innerHTML = html;

          // Wire up deep-links
          contentEl.querySelectorAll('.btn-view-link').forEach(btn => {
            btn.addEventListener('click', function () {
              const idx = parseInt(this.getAttribute('data-idx'));
              if (!isNaN(idx) && items[idx]) {
                navigateToReport(items[idx]);
              }
            });
          });
        }
      }

      function navigateToReport(item) {
        if (!item || !item.deepLink) return;

        let link = item.deepLink;
        if (activeDivision && activeDivision !== 'all') {
          const sep = link.includes('?') ? '&' : '?';
          link += `${sep}division=${encodeURIComponent(activeDivision)}`;
        }

        if (window.parent && window.parent !== window && typeof window.parent.openPage === 'function') {
          window.parent.openPage(link, item.pageTitle || 'Report', item.datasetKey);
        } else {
          window.location.href = link;
        }
      }

      function copyWhatsAppDigest() {
        if (!briefingData || !briefingData.items) return;

        const asOn = briefingData.asOn || 'Latest';
        const isDivMode = (activeDivision && activeDivision !== 'all');
        const scopeHeader = isDivMode ? `${activeDivision.toUpperCase()} DIVISION` : 'MALDA ZONE (MZO)';

        let text = `⚡ *MZO EXECUTIVE BRIEFING: ${scopeHeader}* ⚡\n📅 *As on:* ${asOn} | WBSEDCL Malda Zone\n\n`;

        const criticals = briefingData.items.filter(i => i.priority === 'critical');
        const highs = briefingData.items.filter(i => i.priority === 'high');
        const watches = briefingData.items.filter(i => i.priority === 'watch');

        function formatItemText(item) {
          let line = `• *${item.domain}:* `;
          if (isDivMode) {
            const divVal = getDivisionStat(item, activeDivision);
            const cccList = (item.divisionCccs && item.divisionCccs[activeDivision]) ? item.divisionCccs[activeDivision] : [];
            if (item.id === 'mc-delayed-90') {
              const cnt = (typeof divVal === 'number') ? divVal : (divVal?.total || 0);
              line += `${cnt.toLocaleString()} master cards pending.`;
            } else if (item.id === 'discon-no-action') {
              const noAct = (divVal && typeof divVal === 'object') ? (divVal.noAction || 0) : 0;
              const osd = (divVal && typeof divVal === 'object') ? (divVal.osd || 0) : 0;
              line += `${noAct.toLocaleString()} defaulters, ₹${(osd / 10000000).toFixed(2)} Cr unaddressed.`;
            } else if (item.id === 'defective-over-10m') {
              const o10 = (divVal && typeof divVal === 'object') ? (divVal.over10 || 0) : 0;
              line += `${o10.toLocaleString()} meters defective > 10m.`;
            } else if (item.id === 'load-ext-ageing-1y') {
              const cnt = (typeof divVal === 'number') ? divVal : (divVal?.total || 0);
              line += `${cnt.toLocaleString()} pending load extensions (> 1y).`;
            } else if (item.id === 'nsc-delayed-30') {
              const cnt = (typeof divVal === 'number') ? divVal : (divVal || 0);
              line += `${cnt.toLocaleString()} applications delayed > 30 days.`;
            } else {
              line += `${item.title}`;
            }

            if (cccList.length > 0) {
              const topCccs = cccList.slice(0, 4).map(c => `${c.name}: ${c.count}`).join(', ');
              line += ` (Top CCCs: ${topCccs})`;
            }
          } else {
            line += `${item.title}: ${item.metric}`;
            if (item.hotspots && item.hotspots.length > 0) {
              const topDivs = item.hotspots.slice(0, 3).map(h => `${h.division}: ${h.count}`).join(', ');
              line += ` (Top: ${topDivs})`;
            }
          }
          return line;
        }

        if (criticals.length > 0) {
          text += `🔴 *CRITICAL ACTION:*\n`;
          criticals.forEach(c => { text += `${formatItemText(c)}\n`; });
          text += `\n`;
        }

        if (highs.length > 0) {
          text += `🟠 *HIGH PRIORITY:*\n`;
          highs.forEach(h => { text += `${formatItemText(h)}\n`; });
          text += `\n`;
        }

        if (watches.length > 0) {
          text += `🟡 *OPERATIONAL WATCH:*\n`;
          watches.forEach(w => { text += `${formatItemText(w)}\n`; });
          text += `\n`;
        }

        text += `🔗 *Portal:* https://mzo-reports.vercel.app`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('✅ Briefing copied to clipboard!');
          }).catch(() => {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('✅ Briefing copied to clipboard!');
        } catch (_) {
          alert('Copy failed. Please copy manually.');
        }
        document.body.removeChild(ta);
      }

      function showToast(msg) {
        let toast = document.getElementById('briefingToast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'briefingToast';
          toast.className = 'briefing-toast';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3500);
      }

      // Initial load
      loadData();
    })();
  </script>
</body>

</html>
