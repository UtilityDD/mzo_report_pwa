<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Briefing · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <style>
    .bf-group { padding: 14px 16px 6px; font-size: 12px; font-weight: 500; color: var(--mzo-muted); display: flex; align-items: center; gap: 8px; }
    .bf-group:not(:first-child) { border-top: 1px solid var(--mzo-border); }
    .bf-row {
      display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 20px; align-items: center; gap: 12px;
      padding: 11px 12px 11px 16px; cursor: pointer; border-top: 1px solid var(--mzo-border);
    }
    .bf-group + .bf-row { border-top: 0; }
    .bf-row:hover { background: var(--mzo-row-hover); }
    .bf-row .t { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
    .bf-row .d { margin-top: 2px; font-size: 12.5px; color: var(--mzo-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bf-row .d b { font-weight: 500; color: var(--mzo-text-2); }
    .bf-row .m { text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bf-row .m small { display: block; font-size: 11.5px; font-weight: 400; color: var(--mzo-muted); }
    .bf-row .ui-i { color: var(--mzo-faint); }
    .bf-clear .bf-row { padding-top: 9px; padding-bottom: 9px; }
    .bf-clear .bf-row .t { font-weight: 400; font-size: 13px; color: var(--mzo-text-2); }
    .bf-clear .bf-row .d { display: none; }
    .bf-clear .bf-row .m { font-weight: 400; color: var(--mzo-muted); font-size: 13px; }
    .bf-skel { padding: 14px 16px; display: grid; gap: 14px; }
    @media (max-width: 760px) { .bf-row { grid-template-columns: 10px minmax(0, 1fr) auto; } .bf-row > .ui-i { display: none; } }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Briefing</h1>
        <p id="meta">Malda Zone</p>
      </div>
      <div class="ui-actions">
        <span class="ui-select" id="scopeWrap" hidden><select id="scope" aria-label="Division"></select></span>
        <button type="button" class="ui-btn" id="copyBtn" disabled><svg class="ui-i"><use href="#ui-copy"/></svg>Copy summary</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <section class="ui-stats" style="--n:4" aria-label="Summary">
      <div class="ui-stat"><div class="k"><span class="ui-dot bad"></span>Critical</div><div class="v" id="sCritical"><span class="ui-skel"></span></div></div>
      <div class="ui-stat"><div class="k"><span class="ui-dot warn"></span>High priority</div><div class="v" id="sHigh"><span class="ui-skel"></span></div></div>
      <div class="ui-stat"><div class="k"><span class="ui-dot"></span>Watch</div><div class="v" id="sWatch"><span class="ui-skel"></span></div></div>
      <div class="ui-stat"><div class="k"><span class="ui-dot ok"></span>All clear</div><div class="v" id="sClear"><span class="ui-skel"></span></div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2>Needs attention</h2><span class="ui-note" id="scopeNote"></span></div>
      <div id="open"><div class="bf-skel"><span class="ui-skel" style="width:60%"></span><span class="ui-skel" style="width:45%"></span><span class="ui-skel" style="width:52%"></span></div></div>
    </section>

    <section class="ui-panel" id="clearPanel" hidden>
      <div class="ui-panel-h"><h2>All clear</h2><span class="ui-note">Nothing outstanding</span></div>
      <div id="clear" class="bf-clear"></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var data = null, division = '';
    var PRI = { critical: { label: 'Critical', dot: 'bad' }, high: { label: 'High priority', dot: 'warn' }, watch: { label: 'Watch', dot: '' } };
    var $ = function (id) { return document.getElementById(id); };

    function num(v) { return typeof v === 'number' ? v : (v && typeof v === 'object' ? (v.total || 0) : (Number(v) || 0)); }
    function isZero(metric) { var d = String(metric == null ? '' : metric).replace(/[^\d.]/g, ''); return !d || Number(d) === 0; }
    function divStat(item, div) {
      if (!item.divisions || !div) return undefined;
      if (item.divisions[div] !== undefined) return item.divisions[div];
      var up = div.toUpperCase() + ' DIVISION';
      return item.divisions[up];
    }

    // What one row shows, for the zone or for one division.
    function view(item) {
      if (!division) {
        var hs = (item.hotspots || []).filter(function (h) { return h.count > 0; }).slice(0, 4);
        return {
          metric: item.metric,
          zero: isZero(item.metric),
          detail: hs.map(function (h) { return '<b>' + UI.esc(h.division) + '</b> ' + UI.n(h.count) + (h.amount ? ' · ₹' + UI.esc(h.amount) : ''); }).join(' &nbsp;·&nbsp; ')
        };
      }
      var v = divStat(item, division), cccs = (item.divisionCccs && item.divisionCccs[division]) || [];
      var metric, field = 'count';
      if (item.id === 'discon-no-action') metric = UI.inr(v && v.osd || 0);
      else if (item.id === 'defective-over-10m') { metric = UI.n(v && v.over10 || 0); field = 'over10'; }
      else if (item.id === 'defective-3phase-ind') { metric = UI.n(v && v.ph3 || 0); field = 'ph3'; }
      else if (v === undefined) metric = '—';
      else metric = UI.n(num(v));
      return {
        metric: metric,
        zero: metric === '—' || isZero(metric),
        detail: cccs.slice(0, 4).map(function (c) { return '<b>' + UI.esc(c.name) + '</b> ' + UI.n(c[field] || c.count || 0); }).join(' &nbsp;·&nbsp; ')
      };
    }

    function row(item, v) {
      var p = PRI[item.priority] || PRI.watch;
      return '<div class="bf-row" role="link" tabindex="0" data-id="' + UI.esc(item.id) + '">' +
        '<span class="ui-dot ' + (v.zero ? 'ok' : p.dot) + '"></span>' +
        '<div><div class="t">' + UI.esc(item.title) + '</div><div class="d">' + (v.detail || UI.esc(item.domain)) + '</div></div>' +
        '<div class="m">' + UI.esc(v.metric) + '</div>' +
        '<svg class="ui-i"><use href="#ui-chev"/></svg></div>';
    }

    function render() {
      if (!data) return;
      var items = data.items || [], open = '', clear = '', counts = { critical: 0, high: 0, watch: 0, clear: 0 };
      ['critical', 'high', 'watch'].forEach(function (pri) {
        var rows = '';
        items.filter(function (i) { return i.priority === pri; }).forEach(function (item) {
          var v = view(item);
          if (v.zero) { counts.clear++; clear += row(item, v); }
          else { counts[pri]++; rows += row(item, v); }
        });
        if (rows) open += '<div class="bf-group">' + PRI[pri].label + '</div>' + rows;
      });
      $('sCritical').textContent = counts.critical;
      $('sHigh').textContent = counts.high;
      $('sWatch').textContent = counts.watch;
      $('sClear').textContent = counts.clear;
      $('open').innerHTML = open || '<div class="ui-empty">Nothing needs attention right now.</div>';
      $('clear').innerHTML = clear;
      $('clearPanel').hidden = !clear;
      $('scopeNote').textContent = division ? division + ' division' : 'Malda Zone';
      $('copyBtn').disabled = false;
    }

    function setupScope() {
      var divs = {};
      (data.items || []).forEach(function (i) { Object.keys(i.divisions || {}).forEach(function (d) { divs[UI.title(d.replace(/\s+division$/i, ''))] = 1; }); });
      var list = Object.keys(divs).sort();
      $('scopeWrap').hidden = !list.length;
      if (list.length) UI.fill('scope', list, 'All divisions');
    }

    function load(force) {
      var btn = $('refreshBtn');
      if (force) btn.classList.add('spin');
      fetch('/api/executive/briefing', { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          data = j && j.briefing;
          if (!data) throw new Error('empty');
          var at = data.generatedAt ? new Date(data.generatedAt) : null;
          $('meta').textContent = 'Malda Zone' + (at && !isNaN(at) ? ' · Updated ' + UI.fmtDate(at) + ', ' + at.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : '');
          setupScope();
          render();
        })
        .catch(function () {
          $('open').innerHTML = '<div class="ui-empty">Could not load the briefing. <button type="button" class="ui-btn sm" onclick="location.reload()">Retry</button></div>';
          ['sCritical', 'sHigh', 'sWatch', 'sClear'].forEach(function (id) { $(id).textContent = '—'; });
        })
        .then(function () { btn.classList.remove('spin'); });
    }

    function openItem(id) {
      var item = (data.items || []).filter(function (i) { return i.id === id; })[0];
      if (!item || !item.deepLink) return;
      var link = item.deepLink;
      if (division) link += (link.indexOf('?') === -1 ? '?' : '&') + 'division=' + encodeURIComponent(division);
      if (window.parent !== window && typeof window.parent.openPage === 'function') window.parent.openPage(link, item.pageTitle || item.title);
      else location.href = link;
    }

    function summary() {
      var scope = division ? division.toUpperCase() + ' DIVISION' : 'MALDA ZONE';
      var lines = ['*MZO briefing — ' + scope + '*', UI.fmtDate(new Date()), ''];
      ['critical', 'high', 'watch'].forEach(function (pri) {
        var its = (data.items || []).filter(function (i) { return i.priority === pri; }).map(function (i) { return [i, view(i)]; }).filter(function (x) { return !x[1].zero; });
        if (!its.length) return;
        lines.push('*' + PRI[pri].label + '*');
        its.forEach(function (x) { lines.push('• ' + x[0].title + ': ' + x[1].metric + (x[1].detail ? ' (' + x[1].detail.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ') + ')' : '')); });
        lines.push('');
      });
      lines.push('https://mzo-reports.vercel.app');
      return lines.join('\n');
    }

    document.addEventListener('click', function (e) {
      var r = e.target.closest('.bf-row');
      if (r) openItem(r.getAttribute('data-id'));
    });
    document.addEventListener('keydown', function (e) {
      var r = e.target.closest && e.target.closest('.bf-row');
      if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openItem(r.getAttribute('data-id')); }
    });
    $('scope').addEventListener('change', function () { division = this.value; UI.mark(this); render(); });
    $('refreshBtn').addEventListener('click', function () { load(true); });
    $('copyBtn').addEventListener('click', function () { UI.copy(summary()).then(function () { UI.toast('Summary copied'); }); });

    load(false);
  });
  </script>
</body>
</html>
