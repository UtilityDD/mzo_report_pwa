<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMO grievances · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <style>
    .cmo-desc { max-width: 420px; white-space: normal; color: var(--mzo-text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>CMO grievances</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Name, phone, police station or text" autocomplete="off" /></label>
      <span class="ui-select"><select id="district" aria-label="District"><option value="">All districts</option></select></span>
      <span class="ui-select"><select id="owner" aria-label="Pending with"><option value="">Pending with anyone</option></select></span>
      <span class="ui-select"><select id="category" aria-label="Category"><option value="">All categories</option></select></span>
      <span class="ui-select"><select id="age" aria-label="Age">
        <option value="0">Any age</option><option value="1">1 month+</option><option value="2">2 months+</option><option value="3">3 months+</option>
        <option value="6">6 months+</option><option value="10">10 months+</option><option value="12">1 year+</option>
      </select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k="all"><div class="k">Grievances</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="old"><div class="k"><span class="ui-dot bad"></span>Pending 3 months+</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="disposed"><div class="k"><span class="ui-dot ok"></span>Disposed / with HQ</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2 id="groupTitle">Pending with</h2>
          <div class="ui-tabs" role="tablist" id="groupTabs">
            <button type="button" class="ui-tab" role="tab" data-g="owner" aria-selected="true">Officer</button>
            <button type="button" class="ui-tab" role="tab" data-g="ps">Police station</button>
          </div>
        </div>
        <div id="groupTable" style="--max-h:460px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By district</h2></div>
          <div class="ui-panel-b"><div id="districtHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By category</h2></div>
          <div class="ui-panel-b"><div id="categoryHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Grievances <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var DISTRICTS = ['Malda', 'Uttar Dinajpur', 'Dakshin Dinajpur'];
    var DISPOSED = 'Disposed / pending with HQ';
    var CAT_SHORT = {
      'Power-Electricity Connection/ Transmission Line & Service related Issues': 'Connection',
      'Power-Electricity Bill Payment issues': 'Bill payment',
      'Appoinment, Remuneration, Transfer/Posting & Other Issues of Contractual Employees': 'Contractual staff',
      'Non-Descriptive Issues': 'Non-descriptive',
      'Corruption by Public Servant': 'Corruption'
    };
    var all = [], status = 'pending', group = 'owner';

    function catLabel(c) { return CAT_SHORT[c] || c || 'Other'; }
    function clean(v) { return UI.blank(v) || /^none$|^not known$/i.test(String(v).trim()) ? '' : String(v).trim(); }

    function prepare(text) {
      var asOn = '';
      all = UI.csv(text).filter(function (d) { return DISTRICTS.indexOf(String(d.District || '').trim()) !== -1; }).map(function (d) {
        if (!asOn && d['Report Date']) asOn = d['Report Date'];
        var owner = String(d['Pending With'] || '').trim(), days = parseInt(d['Grievance Since'], 10);
        return {
          district: String(d.District).trim(), ps: clean(d['Police Station']) || 'Not known', owner: owner,
          disposed: owner === DISPOSED, days: isFinite(days) ? days : null,
          name: clean(d.Name) || clean(String(d['Applicant Name & Mobile Number'] || '').replace(/[\d\s\-+]{8,}$/, '')),
          phone: clean(d.Phone), applicant: d['Applicant Name & Mobile Number'], received: d['Received Date & Time'],
          block: clean(d['Block/ Municipality']), gp: clean(d['GP/ Ward']), category: String(d['Grievance Category'] || '').trim(),
          text: String(d['Grievance Description'] || '').replace(/\{#[^}]*#\}/g, '').replace(/_x000D_/g, ' ').replace(/[-=_]{4,}/g, ' ').replace(/\s+/g, ' ').trim(), state: d.Status, assign: d['Assign To'],
          atn: d['Last ATN'], remarks: clean(d['Last ATN Remarks'])
        };
      });
      all.forEach(function (r) { r.search = (r.name + ' ' + r.phone + ' ' + r.ps + ' ' + r.text + ' ' + r.owner + ' ' + r.block).toLowerCase(); });
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.n(all.length) + ' grievances';
      UI.fill('district', DISTRICTS.filter(function (d) { return all.some(function (r) { return r.district === d; }); }), 'All districts');
      var owners = {}; all.forEach(function (r) { if (!r.disposed && r.owner) owners[r.owner] = 1; });
      UI.fill('owner', Object.keys(owners).sort(), 'Pending with anyone');
      var cats = {}; all.forEach(function (r) { if (r.category) cats[r.category] = 1; });
      UI.fill('category', Object.keys(cats).sort().map(function (c) { return { value: c, label: catLabel(c) }; }), 'All categories');
    }

    function base() {
      var q = $('q').value.trim().toLowerCase(), d = $('district').value, o = $('owner').value, c = $('category').value, m = +$('age').value;
      return all.filter(function (r) {
        return (!d || r.district === d) && (!o || r.owner === o) && (!c || r.category === c) &&
          (!m || (r.days != null && r.days >= m * 30)) && (!q || r.search.indexOf(q) !== -1);
      });
    }
    var STATUS = {
      all: function () { return true; },
      pending: function (r) { return !r.disposed; },
      old: function (r) { return !r.disposed && r.days != null && r.days >= 90; },
      disposed: function (r) { return r.disposed; }
    };

    function render() {
      var b = base(), view = b.filter(STATUS[status]), pend = b.filter(STATUS.pending);
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = b.filter(STATUS[k]);
        el.querySelector('.v').textContent = UI.n(rows.length);
        var oldest = rows.filter(function (r) { return !r.disposed && r.days != null; }).reduce(function (a, r) { return Math.max(a, r.days); }, 0);
        el.querySelector('.s').textContent = k === 'all' ? 'All statuses' : k === 'disposed' ? UI.pct(rows.length, b.length) + ' of grievances' : (oldest ? 'Oldest ' + UI.n(oldest) + ' days' : UI.pct(rows.length, b.length));
        el.setAttribute('aria-pressed', String(status === k));
      });

      // Who / where the pending grievances sit
      var key = group === 'owner' ? 'owner' : 'ps', g = {};
      pend.forEach(function (r) {
        var k = r[key] || 'Not known', x = g[k] || (g[k] = { name: k, n: 0, old: 0, oldest: 0 });
        x.n++; if (r.days >= 90) x.old++; if (r.days > x.oldest) x.oldest = r.days;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }), max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));
      UI.table('groupTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No pending grievances for these filters.',
        selected: function (x) { return group === 'owner' && $('owner').value === x.name; },
        columns: [
          { key: 'name', label: group === 'owner' ? 'Officer' : 'Police station', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
          { key: 'n', label: 'Pending', num: true, fmt: UI.n },
          { key: 'old', label: '3 months+', num: true, fmt: function (v) { return v ? '<span class="ui-delta bad">' + UI.n(v) + '</span>' : '<span class="ui-muted">0</span>'; } },
          { key: 'oldest', label: 'Oldest', num: true, fmt: function (v) { return v ? UI.n(v) + ' d' : '—'; }, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.n; }, fmt: function (_, x) { return UI.bar(x.n, max, UI.pct(x.n, pend.length)); }, hideSm: true, width: '26%' }
        ],
        onRow: function (x) {
          if (group === 'owner') { $('owner').value = $('owner').value === x.name ? '' : x.name; UI.mark($('owner')); }
          else { $('q').value = $('q').value === x.name ? '' : x.name; }
          status = 'pending'; render();
        }
      });

      var sel = STATUS[status];
      UI.hist('districtHist', DISTRICTS.map(function (d) { return { key: d, label: d, value: b.filter(function (r) { return r.district === d && sel(r); }).length }; }),
        { active: $('district').value, onClick: function (row) { $('district').value = $('district').value === row.key ? '' : row.key; UI.mark($('district')); render(); } });
      var cats = {}; view.forEach(function (r) { cats[r.category] = (cats[r.category] || 0) + 1; });
      UI.hist('categoryHist', Object.keys(cats).sort(function (a, c) { return cats[c] - cats[a]; }).slice(0, 6).map(function (c) { return { key: c, label: catLabel(c), value: cats[c] }; }),
        { active: $('category').value, onClick: function (row) { $('category').value = $('category').value === row.key ? '' : row.key; UI.mark($('category')); render(); } });

      $('listCount').textContent = UI.n(view.length);
      UI.table('listTable', { rows: view, sort: { key: 'days', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No grievances match these filters.', columns: COLS, onRow: detail });
      window.__view = view;
      $('clearBtn').hidden = !($('q').value || $('district').value || $('owner').value || $('category').value || +$('age').value || status !== 'pending');
    }

    var COLS = [
      { key: 'name', label: 'Applicant', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.phone) + '</span>'; } },
      { key: 'text', label: 'Grievance', hideSm: true, fmt: function (v, r) { return '<div class="cmo-desc">' + UI.esc(v || catLabel(r.category)) + '</div>'; } },
      { key: 'ps', label: 'Where', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r.district) + '</span>'; } },
      { key: 'owner', label: 'Pending with', fmt: function (v, r) { return r.disposed ? '<span class="ui-badge ok">Disposed / HQ</span>' : UI.esc(v || '—'); } },
      { key: 'days', label: 'Age', num: true, sortVal: function (r) { return r.days == null ? -1 : r.days; }, fmt: function (v, r) { return v == null ? '—' : (!r.disposed && v >= 90 ? '<span class="ui-delta bad">' + UI.n(v) + ' d</span>' : UI.n(v) + ' d'); }, csv: function (r) { return r.days; } }
    ];

    function detail(r) {
      UI.drawer(r.name || 'Grievance', [r.ps, r.district].filter(Boolean).join(' · '), [
        ['Status', r.disposed ? 'Disposed / pending with HQ' : 'Pending' + (r.days != null ? ' for ' + r.days + ' days' : '')],
        ['Pending with', r.disposed ? '' : r.owner], ['Phone', r.phone], ['Category', r.category], ['Grievance', r.text],
        ['Received', r.received], ['Block / municipality', r.block], ['GP / ward', r.gp], ['Assigned to', r.assign],
        ['Last action', r.atn], ['Last remarks', r.remarks], ['Portal status', r.state]
      ]);
    }

    ['district', 'owner', 'category', 'age'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(render, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (s) { status = s.getAttribute('data-k'); render(); } });
    $('groupTabs').addEventListener('click', function (e) {
      var t = e.target.closest('.ui-tab'); if (!t) return;
      group = t.getAttribute('data-g');
      [].forEach.call(this.querySelectorAll('.ui-tab'), function (x) { x.setAttribute('aria-selected', String(x === t)); });
      $('groupTitle').textContent = group === 'owner' ? 'Pending with' : 'Pending by police station';
      render();
    });
    $('clearBtn').addEventListener('click', function () {
      $('q').value = ''; ['district', 'owner', 'category'].forEach(function (id) { $(id).value = ''; UI.mark($(id)); }); $('age').value = '0'; UI.mark($('age'));
      status = 'pending'; render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('cmo-grievances.csv', [{ key: 'name', label: 'Applicant' }, { key: 'phone', label: 'Phone' }, { key: 'district', label: 'District' }, { key: 'ps', label: 'Police station' },
        { key: 'category', label: 'Category' }, { key: 'text', label: 'Grievance' }, { key: 'owner', label: 'Pending with' }, { key: 'days', label: 'Age (days)' }, { key: 'remarks', label: 'Last remarks' }], window.__view || []);
    });
    UI.refresh('refreshBtn', 'CACHE_CMO', function (t) { prepare(t); render(); });

    UI.load('CACHE_CMO', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('listTable').innerHTML = $('groupTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text); render();
    });
  });
  </script>
</body>
</html>
