<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMO grievances · DISHA</title>
  <script src="/mzo_theme.js?v=7"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=9" />
  <script src="/mzo_presets_hub.js?v=89"></script>
  <script src="/mzo_ui.js?v=10" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .ui-side-sec-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--mzo-muted); margin-bottom: 6px; }
    .ui-check-group { display: grid; gap: 3px; }
    .ui-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--mzo-text-2);
      cursor: pointer;
      user-select: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .ui-check-label:hover {
      background: var(--mzo-hover);
      color: var(--mzo-text);
    }
    .ui-check-label input[type="checkbox"] {
      accent-color: var(--mzo-accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
      margin: 0;
      flex: none;
    }
    .ui-check-label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ui-check-label small { color: var(--mzo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .cmo-desc {
      max-width: 440px;
      white-space: normal;
      color: var(--mzo-text-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .sub { display: block; font-size: 11.5px; color: var(--mzo-muted); margin-top: 2px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>CMO grievances<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search name, phone, police station or text" title="Name, phone, police station or text" /></label>
          <span class="ui-select"><select id="districtFilter" aria-label="District"><option value="">All districts</option></select></span>
          <span class="ui-select"><select id="ownerFilter" aria-label="Pending with"><option value="">Pending with anyone</option></select></span>
          <span class="ui-select"><select id="categoryFilter" aria-label="Category"><option value="">All categories</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Quick filters</div>
          <div class="ui-check-group">
            <label class="ui-check-label"><input type="checkbox" id="chkPendingOnly" /><span>Pending with officer</span><small id="cntPendingOnly"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkOver90d" /><span>Over 3 months (90d+)</span><small id="cntOver90d"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkConnection" /><span>Connection issues</span><small id="cntConnection"></small></label>
          </div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Age of grievance">
            <button type="button" role="tab" data-pane="fAge" aria-pressed="true" aria-selected="true">Age bracket</button>
            <button type="button" role="tab" data-pane="fAge2" aria-pressed="false" aria-selected="false">Cumulative</button>
          </div>
          <div aria-label="Age bracket" id="fAge"></div>
          <div aria-label="Age, cumulative" id="fAge2" hidden></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">District</div>
          <div aria-label="District" id="fDistrict"></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Category</div>
          <div aria-label="Category" id="fCategory"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary"></section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    var DISTRICTS = ['Malda', 'Uttar Dinajpur', 'Dakshin Dinajpur'];
    var DISPOSED = 'Disposed / pending with HQ';

    var CAT_SHORT = {
      'Power-Electricity Connection/ Transmission Line & Service related Issues': 'Connection',
      'Power-Electricity Bill Payment issues': 'Bill payment',
      'Appoinment, Remuneration, Transfer/Posting & Other Issues of Contractual Employees': 'Contractual staff',
      'Non-Descriptive Issues': 'Non-descriptive',
      'Corruption by Public Servant': 'Corruption'
    };
    function catLabel(c) { return CAT_SHORT[c] || c || 'Other'; }
    function clean(v) { return UI.blank(v) || /^none$|^not known$/i.test(String(v).trim()) ? '' : String(v).trim(); }

    var AGE = [
      { key: 'a0', label: 'Under 1 month', min: 0, max: 30, dot: 'ok' },
      { key: 'a1', label: '1–2 months', min: 31, max: 60, dot: 'warn' },
      { key: 'a2', label: '2–3 months', min: 61, max: 90, dot: 'warn' },
      { key: 'a3', label: '3–6 months', min: 91, max: 180, dot: 'bad' },
      { key: 'a4', label: '6–12 months', min: 181, max: 365, dot: 'bad' },
      { key: 'a5', label: 'Over 1 year', min: 366, max: Infinity, dot: 'bad' }
    ];

    var CUMULATIVE_AGE = [
      { key: 'c_m1', label: 'Over 1 month', min: 31, dot: 'warn' },
      { key: 'c_m2', label: 'Over 2 months', min: 61, dot: 'warn' },
      { key: 'c_m3', label: 'Over 3 months (90d+)', min: 91, dot: 'bad' },
      { key: 'c_m6', label: 'Over 6 months', min: 181, dot: 'bad' },
      { key: 'c_y1', label: 'Over 1 year', min: 366, dot: 'bad' }
    ];

    var KPI_STATS = [
      { key: '', label: 'Total grievances', test: function () { return true; } },
      { key: 'pending', label: 'Pending with officer', dot: 'warn', test: function (r) { return !r.disposed; } },
      { key: 'old90', label: 'Pending 3 months+', dot: 'bad', test: function (r) { return !r.disposed && r.days != null && r.days >= 90; } },
      { key: 'old180', label: 'Pending 6 months+', dot: 'bad', test: function (r) { return !r.disposed && r.days != null && r.days >= 180; } },
      { key: 'disposed', label: 'Disposed / with HQ', dot: 'ok', test: function (r) { return r.disposed; } }
    ];

    var KPI_MAP = {};
    KPI_STATS.forEach(function (k) { KPI_MAP[k.key] = k; });

    var CUM_MAP = {};
    var CUM_DOTS = {};
    CUMULATIVE_AGE.forEach(function (c) {
      CUM_MAP[c.key] = function (r) { return r.days != null && r.days >= c.min; };
      CUM_DOTS[c.label] = c.dot;
    });

    var AGE_DOTS = {};
    AGE.forEach(function (a) { AGE_DOTS[a.label] = a.dot; });

    var TABS = [
      ['officer', 'Officer'],
      ['district', 'District'],
      ['ps', 'Police station'],
      ['category', 'Category'],
      ['age', 'Age bracket'],
      ['age2', 'Cumulative age'],
      ['grievances', 'Grievances']
    ];

    var all = [], asOn = null, firstData = true;
    var tab = 'officer', renderedTab = '', lastTable = null, lastList = null, openRow = null;

    var f = {
      q: '', kpi: '', age: '', age2: '', district: '', category: '',
      chkPendingOnly: false, chkOver90d: false, chkConnection: false
    };

    var SELECTS = ['districtFilter', 'ownerFilter', 'categoryFilter'];

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    $('stats').innerHTML = KPI_STATS.map(function (o) {
      return '<button type="button" class="ui-stat" data-k="' + o.key + '">' +
        '<div class="k">' + (o.dot ? '<span class="ui-dot ' + o.dot + '"></span>' : '') + UI.esc(o.label) + '</div>' +
        '<div class="v"><span class="ui-skel"></span></div>' +
        '<div class="s">&nbsp;</div>' +
        '</button>';
    }).join('');

    function prepare(t) {
      asOn = t.first('report_date');
      all = t.rows.filter(function (d) { return DISTRICTS.indexOf(d.district) !== -1; }).map(function (d) {
        var owner = d.pending_with || '';
        var isDisposed = owner === DISPOSED;
        var days = d.grievance_since == null ? null : Math.trunc(d.grievance_since);
        var ab = days == null ? AGE[0] : (AGE.filter(function (a) { return days >= a.min && days <= a.max; })[0] || AGE[AGE.length - 1]);
        var cat = d.grievance_category || '';
        var catName = catLabel(cat);

        return {
          district: d.district,
          ps: clean(d.police_station) || 'Not known',
          owner: owner,
          disposed: isDisposed,
          days: days,
          name: clean(d.name) || clean((d.applicant_name_mobile_number || '').replace(/[\d\s\-+]{8,}$/, '')),
          phone: clean(d.phone),
          applicant: d.applicant_name_mobile_number || '',
          received: d.received_date_time || '',
          block: clean(d.block_municipality),
          gp: clean(d.gp_ward),
          category: cat,
          catLabel: catName,
          text: (d.grievance_description || '').replace(/\{#[^}]*#\}/g, '').replace(/_x000D_/g, ' ').replace(/[-=_]{4,}/g, ' ').replace(/\s+/g, ' ').trim(),
          state: d.status || '',
          assign: d.assign_to || '',
          atn: d.last_atn || '',
          remarks: clean(d.last_atn_remarks),
          ageKey: ab.key,
          ageLabel: ab.label
        };
      });

      all.forEach(function (r) {
        r.search = (r.name + ' ' + r.phone + ' ' + r.ps + ' ' + r.district + ' ' + r.text + ' ' + r.owner + ' ' + r.block + ' ' + r.catLabel).toLowerCase();
      });

      fillFilters();
    }

    function fillFilters() {
      var d = $('districtFilter').value;
      UI.fill('districtFilter', DISTRICTS.filter(function (dist) { return all.some(function (r) { return r.district === dist; }); }), 'All districts');
      var r1 = all.filter(function (r) { return !d || r.district === d; });

      var owners = {};
      r1.forEach(function (r) { if (!r.disposed && r.owner) owners[r.owner] = 1; });
      UI.fill('ownerFilter', Object.keys(owners).sort(), 'Pending with anyone');

      var cats = {};
      all.forEach(function (r) { if (r.category) cats[r.category] = 1; });
      UI.fill('categoryFilter', Object.keys(cats).sort().map(function (c) { return { value: c, label: catLabel(c) }; }), 'All categories');

      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function filtered(skip) {
      var q = f.q.toLowerCase(), v = function (id) { return $(id).value; };
      return all.filter(function (r) {
        if (v('districtFilter') && r.district !== v('districtFilter')) return false;
        if (v('ownerFilter') && r.owner !== v('ownerFilter')) return false;
        if (v('categoryFilter') && r.category !== v('categoryFilter')) return false;

        if (skip !== 'checkboxes') {
          if (f.chkPendingOnly && r.disposed) return false;
          if (f.chkOver90d && (r.days == null || r.days < 90 || r.disposed)) return false;
          if (f.chkConnection && r.catLabel !== 'Connection') return false;
        }

        if (skip !== 'age' && f.age && r.ageKey !== f.age) return false;
        if (skip !== 'age2' && f.age2 && CUM_MAP[f.age2] && !CUM_MAP[f.age2](r)) return false;
        if (skip !== 'district' && f.district && r.district !== f.district) return false;
        if (skip !== 'category' && f.category && r.category !== f.category) return false;

        if (q && r.search.indexOf(q) === -1) return false;

        return true;
      });
    }

    function renderFacets() {
      var baseNoChk = filtered('checkboxes');
      var cPend = baseNoChk.filter(function (r) { return !r.disposed; }).length;
      var c90d = baseNoChk.filter(function (r) { return !r.disposed && r.days != null && r.days >= 90; }).length;
      var cConn = baseNoChk.filter(function (r) { return r.catLabel === 'Connection'; }).length;
      $('cntPendingOnly').textContent = cPend ? UI.n(cPend) : '';
      $('cntOver90d').textContent = c90d ? UI.n(c90d) : '';
      $('cntConnection').textContent = cConn ? UI.n(cConn) : '';

      var rowsAge = filtered('age');
      UI.facet('fAge', AGE.map(function (a) {
        return {
          value: a.key,
          label: a.label,
          count: rowsAge.filter(function (r) { return r.ageKey === a.key; }).length,
          dot: a.dot
        };
      }), f.age, function (v) { f.age = v; render(); });

      var rowsAge2 = filtered('age2');
      UI.facet('fAge2', CUMULATIVE_AGE.map(function (c) {
        return {
          value: c.key,
          label: c.label,
          count: rowsAge2.filter(CUM_MAP[c.key]).length,
          dot: c.dot
        };
      }), f.age2, function (v) { f.age2 = v; render(); });

      var rowsDist = filtered('district');
      UI.facet('fDistrict', DISTRICTS.map(function (dist) {
        return {
          value: dist,
          label: dist,
          count: rowsDist.filter(function (r) { return r.district === dist; }).length
        };
      }), f.district, function (v) { f.district = v; render(); });

      var rowsCat = filtered('category');
      var cats = {};
      all.forEach(function (r) { if (r.category) cats[r.category] = (cats[r.category] || 0) + 1; });
      UI.facet('fCategory', Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; }).map(function (c) {
        return {
          value: c,
          label: catLabel(c),
          count: rowsCat.filter(function (r) { return r.category === c; }).length
        };
      }), f.category, function (v) { f.category = v; render(); });

      var active = (f.q ? 1 : 0) +
        (f.chkPendingOnly ? 1 : 0) + (f.chkOver90d ? 1 : 0) + (f.chkConnection ? 1 : 0) +
        (f.age ? 1 : 0) + (f.age2 ? 1 : 0) + (f.district ? 1 : 0) + (f.category ? 1 : 0) +
        SELECTS.filter(function (id) { return $(id).value; }).length;

      setActive(active, { fAge: f.age, fAge2: f.age2 });
    }

    function render() {
      var b = filtered(null);
      renderFacets();

      var tot = b.length;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        var kpiDef = KPI_MAP[k] || KPI_MAP[''];
        var rows = b.filter(kpiDef.test);
        el.querySelector('.v').textContent = UI.n(rows.length);
        var oldest = rows.filter(function (r) { return !r.disposed && r.days != null; }).reduce(function (a, r) { return Math.max(a, r.days); }, 0);
        el.querySelector('.s').textContent = k === ''
          ? 'All statuses'
          : k === 'disposed'
          ? UI.pct(rows.length, tot) + ' of total'
          : (oldest ? 'Oldest ' + UI.n(oldest) + ' d · ' + UI.pct(rows.length, tot) : UI.pct(rows.length, tot));
        el.setAttribute('aria-pressed', String(f.kpi === k));
      });

      if (asOn) $('asOn').textContent = 'As on ' + UI.fmtDate(asOn);
      else $('asOn').textContent = UI.n(all.length) + ' grievances';

      var view = f.kpi && KPI_MAP[f.kpi] ? b.filter(KPI_MAP[f.kpi].test) : b;

      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'grievances' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';
      var hintText = (kpiTitle ? 'Showing ' + kpiTitle.toLowerCase() + ' only. ' : '') +
        (tab === 'age2' ? 'Cumulative: a grievance can sit in more than one row.' : '');
      $('hint').textContent = hintText;

      renderReportHead(view);
      renderTab(view);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';

      $('rhTitle').textContent = tabLabel + (kpiTitle ? ' · ' + kpiTitle : '');

      if (view.length === all.length) {
        $('rhCount').textContent = 'Showing all ' + UI.n(all.length) + ' grievances';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' grievances';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('districtFilter').value) {
        currentActiveFilters.push({ label: 'District', value: $('districtFilter').value, clear: function () { $('districtFilter').value = ''; fillFilters(); } });
      }
      if ($('ownerFilter').value) {
        currentActiveFilters.push({ label: 'Pending with', value: $('ownerFilter').value, clear: function () { $('ownerFilter').value = ''; fillFilters(); } });
      }
      if ($('categoryFilter').value) {
        currentActiveFilters.push({ label: 'Category', value: catLabel($('categoryFilter').value), clear: function () { $('categoryFilter').value = ''; fillFilters(); } });
      }
      if (f.chkPendingOnly) {
        currentActiveFilters.push({ label: 'Quick', value: 'Pending with officer', clear: function () { f.chkPendingOnly = false; $('chkPendingOnly').checked = false; } });
      }
      if (f.chkOver90d) {
        currentActiveFilters.push({ label: 'Quick', value: 'Over 3 months (90d+)', clear: function () { f.chkOver90d = false; $('chkOver90d').checked = false; } });
      }
      if (f.chkConnection) {
        currentActiveFilters.push({ label: 'Quick', value: 'Connection issues', clear: function () { f.chkConnection = false; $('chkConnection').checked = false; } });
      }
      if (f.age) {
        var ab = AGE.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Age', value: ab ? ab.label : f.age, clear: function () { f.age = ''; } });
      }
      if (f.age2) {
        var ca = CUMULATIVE_AGE.filter(function (x) { return x.key === f.age2; })[0];
        currentActiveFilters.push({ label: 'Cumulative age', value: ca ? ca.label : f.age2, clear: function () { f.age2 = ''; } });
      }
      if (f.district) {
        currentActiveFilters.push({ label: 'District', value: f.district, clear: function () { f.district = ''; } });
      }
      if (f.category) {
        currentActiveFilters.push({ label: 'Category', value: catLabel(f.category), clear: function () { f.category = ''; } });
      }
      if (f.kpi && KPI_MAP[f.kpi]) {
        currentActiveFilters.push({ label: 'KPI', value: KPI_MAP[f.kpi].label, clear: function () { f.kpi = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    function groupTable(view, keyFn, label, order, dots, subKeyFn, onRowAction) {
      var groups = {}, total = view.length;
      view.forEach(function (r) {
        var k = keyFn(r);
        if (k == null) return;
        (Array.isArray(k) ? k : [k]).forEach(function (kk) {
          var g = groups[kk] || (groups[kk] = { name: kk, sub: subKeyFn ? subKeyFn(r) : '', n: 0, pending: 0, old90: 0, oldest: 0 });
          g.n++;
          if (!r.disposed) {
            g.pending++;
            if (r.days != null && r.days >= 90) g.old90++;
            if (r.days != null && r.days > g.oldest) g.oldest = r.days;
          }
        });
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      if (order) {
        list.sort(function (a, b) {
          var ia = order.indexOf(a.name), ib = order.indexOf(b.name);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });
      }
      var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      lastTable = {
        title: label,
        cols: [label, 'Total', 'Pending', '3 months+', 'Oldest (days)', '% Share'],
        rows: list.map(function (g) {
          return [g.name + (g.sub ? ' (' + g.sub + ')' : ''), g.n, g.pending, g.old90, g.oldest, UI.pct(g.n, total)];
        })
      };
      return {
        rows: list,
        sort: order ? null : { key: 'n', dir: 'desc' },
        count: false,
        empty: 'No grievances match these filters.',
        columns: [
          {
            key: 'name',
            label: label,
            cls: 'wrap',
            fmt: function (v, g) {
              return (dots && dots[v] ? '<span class="ui-dot ' + dots[v] + '" style="margin-right:8px"></span>' : '') +
                '<span class="ui-strong">' + UI.esc(v) + '</span>' +
                (g.sub ? '<span class="sub">' + UI.esc(g.sub) + '</span>' : '');
            }
          },
          { key: 'n', label: 'Grievances', num: true, fmt: UI.n },
          {
            key: 'pending',
            label: 'Pending',
            num: true,
            fmt: function (v) { return v ? '<span class="ui-delta warn">' + UI.n(v) + '</span>' : '<span class="ui-muted">0</span>'; }
          },
          {
            key: 'old90',
            label: '3 months+',
            num: true,
            fmt: function (v) { return v ? '<span class="ui-delta bad">' + UI.n(v) + '</span>' : '<span class="ui-muted">0</span>'; }
          },
          {
            key: 'oldest',
            label: 'Oldest',
            num: true,
            hideSm: true,
            fmt: function (v) { return v ? UI.n(v) + ' d' : '—'; }
          },
          {
            key: 'share',
            label: '% Share',
            sortVal: function (g) { return g.n; },
            fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, total)); },
            width: '24%'
          }
        ],
        foot: list.length > 1 && !order ? {
          name: 'Total',
          n: total,
          pending: view.filter(function (r) { return !r.disposed; }).length,
          old90: view.filter(function (r) { return !r.disposed && r.days != null && r.days >= 90; }).length,
          oldest: view.filter(function (r) { return !r.disposed && r.days != null; }).reduce(function (a, r) { return Math.max(a, r.days); }, 0),
          share: 0
        } : null,
        onRow: onRowAction
      };
    }

    function renderTab(view) {
      var cfg;
      lastList = null;

      if (tab === 'officer') {
        cfg = groupTable(view, function (r) { return r.owner || 'Not assigned'; }, 'Officer / Pending with', null, null, null, function (g) {
          if (g.name === DISPOSED) {
            f.kpi = 'disposed';
          } else {
            $('ownerFilter').value = g.name;
            fillFilters();
          }
          tab = 'grievances';
          render();
        });
      } else if (tab === 'district') {
        cfg = groupTable(view, function (r) { return r.district; }, 'District', DISTRICTS, null, null, function (g) {
          $('districtFilter').value = g.name;
          fillFilters();
          tab = 'ps';
          render();
        });
      } else if (tab === 'ps') {
        cfg = groupTable(view, function (r) { return r.ps || 'Not known'; }, 'Police station', null, null, function (r) { return r.district; }, function (g) {
          $('q').value = g.name;
          f.q = g.name;
          tab = 'grievances';
          render();
        });
      } else if (tab === 'category') {
        cfg = groupTable(view, function (r) { return r.catLabel; }, 'Category', null, null, function (r) { return r.category !== r.catLabel ? r.category : ''; }, function (g) {
          var matched = all.filter(function (r) { return r.catLabel === g.name; })[0];
          if (matched) {
            $('categoryFilter').value = matched.category;
            fillFilters();
          }
          tab = 'grievances';
          render();
        });
      } else if (tab === 'age') {
        var ageOrder = AGE.map(function (a) { return a.label; });
        cfg = groupTable(view, function (r) { return r.ageLabel; }, 'Age bracket', ageOrder, AGE_DOTS, null, function (g) {
          var matched = AGE.filter(function (a) { return a.label === g.name; })[0];
          if (matched) f.age = matched.key;
          tab = 'grievances';
          render();
        });
      } else if (tab === 'age2') {
        var cumList = CUMULATIVE_AGE.map(function (c) {
          var rows = view.filter(CUM_MAP[c.key]);
          var pend = rows.filter(function (r) { return !r.disposed; }).length;
          return { key: c.key, name: c.label, n: rows.length, pending: pend, dot: c.dot };
        });
        var total = view.length;
        lastTable = {
          title: 'Cumulative Age',
          cols: ['Age threshold', 'Grievances', 'Pending', '% of Total'],
          rows: cumList.map(function (g) { return [g.name, g.n, g.pending, UI.pct(g.n, total)]; })
        };
        cfg = {
          rows: cumList,
          count: false,
          columns: [
            {
              key: 'name',
              label: 'Age threshold',
              fmt: function (v, g) {
                return (g.dot ? '<span class="ui-dot ' + g.dot + '" style="margin-right:8px"></span>' : '') +
                  '<span class="ui-strong">' + UI.esc(v) + '</span>';
              }
            },
            { key: 'n', label: 'Grievances', num: true, fmt: UI.n },
            {
              key: 'pending',
              label: 'Pending',
              num: true,
              fmt: function (v) { return v ? '<span class="ui-delta warn">' + UI.n(v) + '</span>' : '0'; }
            },
            {
              key: 'share',
              label: '% of Total',
              sortVal: function (g) { return g.n; },
              fmt: function (_, g) { return UI.bar(g.n, total, UI.pct(g.n, total)); },
              width: '35%'
            }
          ],
          onRow: function (g) {
            f.age2 = g.key;
            tab = 'grievances';
            render();
          }
        };
      } else if (tab === 'grievances') {
        lastList = view;
        lastTable = {
          title: 'Grievances',
          cols: ['Applicant', 'Phone', 'District', 'Police station', 'Category', 'Grievance', 'Pending with', 'Age (days)', 'Status', 'Last remarks'],
          rows: view.slice().sort(function (a, b) { return (b.days || 0) - (a.days || 0); }).map(function (r) {
            return [r.name, r.phone, r.district, r.ps, r.catLabel, r.text, r.owner, r.days, r.state, r.remarks];
          })
        };
        cfg = {
          rows: view,
          sort: { key: 'days', dir: 'desc' },
          limit: 50,
          resetPage: true,
          empty: 'No grievances match these filters.',
          columns: [
            {
              key: 'name',
              label: 'Applicant',
              fmt: function (v, r) {
                return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.phone) + '</span>';
              }
            },
            {
              key: 'text',
              label: 'Grievance',
              hideSm: true,
              fmt: function (v, r) {
                return '<div class="cmo-desc">' + UI.esc(v || r.catLabel) + '</div>';
              }
            },
            {
              key: 'ps',
              label: 'Where',
              fmt: function (v, r) {
                return UI.esc(v) + '<span class="sub">' + UI.esc(r.district) + '</span>';
              }
            },
            {
              key: 'owner',
              label: 'Pending with',
              fmt: function (v, r) {
                return r.disposed
                  ? '<span class="ui-badge ok">Disposed / HQ</span>'
                  : '<span class="ui-strong">' + UI.esc(v || '—') + '</span>';
              }
            },
            {
              key: 'days',
              label: 'Age',
              num: true,
              sortVal: function (r) { return r.days == null ? -1 : r.days; },
              fmt: function (v, r) {
                if (v == null) return '—';
                return !r.disposed && v >= 90
                  ? '<span class="ui-delta bad">' + UI.n(v) + ' d</span>'
                  : (!r.disposed && v >= 30 ? '<span class="ui-delta warn">' + UI.n(v) + ' d</span>' : UI.n(v) + ' d');
              },
              csv: function (r) { return r.days; }
            }
          ],
          onRow: detail
        };
      }

      if (renderedTab !== tab) {
        $('table').__ui = null;
        renderedTab = tab;
      }
      UI.table('table', cfg);
    }

    function detail(r) {
      openRow = r;
      UI.drawer(r.name || 'Grievance', [r.ps, r.district].filter(Boolean).join(' · '), [
        ['Applicant name', r.name],
        ['Phone number', r.phone],
        ['Status', r.disposed ? 'Disposed / pending with HQ' : 'Pending' + (r.days != null ? ' (' + r.days + ' days)' : '')],
        ['Pending with', r.disposed ? 'HQ' : (r.owner || '—')],
        ['Age', r.days != null ? UI.n(r.days) + ' days (' + (r.ageLabel || '—') + ')' : '—'],
        ['Received on', r.received || '—'],
        ['District', r.district],
        ['Police station', r.ps],
        ['Block / municipality', r.block || '—'],
        ['GP / ward', r.gp || '—'],
        ['Grievance category', r.category],
        ['Portal status', r.state || '—'],
        ['Assigned to', r.assign || '—'],
        ['Last action (ATN)', r.atn || '—'],
        ['Last action remarks', r.remarks || 'None'],
        ['Full description', r.text]
      ], '', (r.phone ? '<a class="ui-btn sm" href="tel:' + UI.esc(r.phone) + '">Call</a>' : '') + '<button type="button" class="ui-btn sm" data-copy-detail><svg class="ui-i"><use href="#ui-copy"/></svg>Copy details</button>');
    }

    function copyDetail(r) {
      UI.copy([
        'Applicant: ' + (r.name || '—'),
        'Phone: ' + (r.phone || '—'),
        'District: ' + r.district + ' (' + r.ps + ')',
        'Block / GP: ' + [r.block, r.gp].filter(Boolean).join(', '),
        'Status: ' + (r.disposed ? 'Disposed / pending with HQ' : 'Pending with ' + (r.owner || '—')),
        'Age: ' + (r.days != null ? r.days + ' days' : '—'),
        'Category: ' + r.category,
        'Description: ' + r.text,
        'Last action: ' + (r.atn || '—'),
        'Remarks: ' + (r.remarks || 'None')
      ].join('\n')).then(function () { UI.toast('Grievance details copied'); });
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-copy-detail]');
      if (b && openRow) copyDetail(openRow);
    });

    function clearAll() {
      f.q = ''; f.kpi = ''; f.age = ''; f.age2 = ''; f.district = ''; f.category = '';
      f.chkPendingOnly = false; f.chkOver90d = false; f.chkConnection = false;
      $('q').value = '';
      $('chkPendingOnly').checked = false;
      $('chkOver90d').checked = false;
      $('chkConnection').checked = false;
      SELECTS.forEach(function (id) { $(id).value = ''; });
      fillFilters();
      tab = 'officer';
      render();
    }

    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        fillFilters();
        render();
      });
    });

    ['chkPendingOnly', 'chkOver90d', 'chkConnection'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        f[id] = this.checked;
        render();
      });
    });

    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      render();
    }, 180));

    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var k = s.getAttribute('data-k');
      f.kpi = (f.kpi === k ? '' : k);
      render();
    });

    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-t');
      render();
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });

    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = [lastTable.cols.join('\t')].concat(lastTable.rows.map(function (row) { return row.join('\t'); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied to clipboard'); });
    });

    $('exportBtn').addEventListener('click', function () {
      if (tab === 'grievances') {
        UI.exportCsv('cmo-grievances.csv', [
          { key: 'name', label: 'Applicant' },
          { key: 'phone', label: 'Phone' },
          { key: 'district', label: 'District' },
          { key: 'ps', label: 'Police station' },
          { key: 'block', label: 'Block' },
          { key: 'gp', label: 'GP/Ward' },
          { key: 'catLabel', label: 'Category' },
          { key: 'text', label: 'Grievance' },
          { key: 'owner', label: 'Pending with' },
          { key: 'days', label: 'Age (Days)' },
          { key: 'received', label: 'Received' },
          { key: 'state', label: 'Portal status' },
          { key: 'atn', label: 'Last ATN' },
          { key: 'remarks', label: 'Remarks' }
        ], lastList || []);
      } else if (lastTable) {
        var csvCols = lastTable.cols.map(function (c, idx) { return { key: 'c' + idx, label: c }; });
        var csvRows = lastTable.rows.map(function (r) {
          var obj = {};
          r.forEach(function (val, idx) { obj['c' + idx] = val; });
          return obj;
        });
        UI.exportCsv('cmo-' + tab + '.csv', csvCols, csvRows);
      }
    });

    function fromUrlParams() {
      var p = new URLSearchParams(window.location.search);
      if (p.has('district')) { $('districtFilter').value = p.get('district'); }
      if (p.has('owner')) { $('ownerFilter').value = p.get('owner'); }
      if (p.has('category')) { $('categoryFilter').value = p.get('category'); }
      if (p.has('q')) { f.q = p.get('q'); $('q').value = f.q; }
      if (p.has('kpi')) { f.kpi = p.get('kpi'); }
      if (p.has('age')) { f.age = p.get('age'); }
      if (p.has('tab')) { tab = p.get('tab'); }
      fillFilters();
    }

    MzoRows.refresh('refreshBtn', 'cmo_grievances', function (t) {
      prepare(t);
      render();
    }, { scope: false });

    MzoRows.load('cmo_grievances', function (t, info) {
      if (!t) {
        if (info && info.error) {
          $('asOn').textContent = 'Could not load data';
          $('table').innerHTML = '<div class="ui-empty">Could not load CMO grievances data.</div>';
        }
        return;
      }
      prepare(t);
      if (firstData) {
        firstData = false;
        fromUrlParams();
      }
      render();
    }, { scope: false });
  });
  </script>
</body>
</html>
