<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consumers · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .cs-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Consumers</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="f_CONN_STAT" aria-label="Status"></select></span>
      <span class="ui-select"><select id="f_BASE_CLASS" aria-label="Class"></select></span>
      <span class="ui-select"><select id="f_CONN_PHASE" aria-label="Phase"></select></span>
      <span class="ui-select"><select id="f_CATEGORY" aria-label="Area"></select></span>
      <span class="ui-select"><select id="f_GOVT_STAT" aria-label="Government"></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" aria-label="Summary">
      <div class="ui-stat"><div class="k">Consumers</div><div class="v" id="sCount"><span class="ui-skel"></span></div><div class="s" id="sCountS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Connected load</div><div class="v" id="sLoad"><span class="ui-skel"></span></div><div class="s" id="sLoadS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Security deposit</div><div class="v" id="sSd"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Outstanding</div><div class="v" id="sOsd"><span class="ui-skel"></span></div><div class="s" id="sOsdS">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">Govt. consumers</div><div class="v" id="sGovt"><span class="ui-skel"></span></div><div class="s" id="sGovtS">&nbsp;</div></div>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Breakdown</h2>
          <div class="cs-pick">
            <span class="ui-select"><select id="rowDim" aria-label="Break down by"></select></span>
            <span>split by</span>
            <span class="ui-select"><select id="colDim" aria-label="Split by"></select></span>
            <button type="button" class="ui-btn sm icon" id="exportBtn" aria-label="Export CSV" title="Export CSV"><svg class="ui-i"><use href="#ui-download"/></svg></button>
          </div>
        </div>
        <div id="pivot" style="--max-h:640px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Connection status</h2></div>
          <div class="ui-panel-b"><div id="hStat"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Meter type</h2></div>
          <div class="ui-panel-b"><div id="hMeter"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Connected by</h2></div>
          <div class="ui-panel-b"><div id="hBy"></div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT4ufTMHJGTUqNSqFSzz0q2x-ShM_WHlfSRxT4tVqA6GcaMK5g38PDLmcJR4JXuxLi-tKafW-Yxwdo/pub?gid=0&single=true&output=csv';
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', H: 'Class H', S: 'Class S', O: 'Others' };
    var LABELS = {
      CONN_STAT: function (v) { return UI.title(v); },
      BASE_CLASS: function (v) { return CLASS[v] || v; },
      CONN_PHASE: function (v) { return v === '3' ? 'Three phase' : v === '1' ? 'Single phase' : v; },
      CATEGORY: function (v) { return v === 'R' ? 'Rural' : v === 'U' ? 'Urban' : v; },
      GOVT_STAT: function (v) { return v === 'YES' ? 'Government' : v === 'NO' ? 'Private' : v; },
      TYPE_OF_METER: function (v) { return { ELECTRIONIC: 'Electronic', ELECTROMAGNATIC: 'Electromagnetic', 'NO METER': 'No meter', SMART: 'Smart' }[v] || UI.title(v); },
      CONN_BY: function (v) { return { 'MANNUAL(GHOST)': 'Manual (ghost)', CCC: 'CCC', RE: 'RE', BRGF: 'BRGF' }[v] || UI.title(v); },
      TIME_OF_DAY: function (v) { return v === 'T' ? 'Time of day' : v === 'W' ? 'Normal' : v ? v : 'Not set'; }
    };
    var DIMS = [
      ['_region', 'Region'], ['_divn', 'Division'], ['_supp', 'CCC'], ['CONN_STAT', 'Status'], ['BASE_CLASS', 'Class'], ['CONN_PHASE', 'Phase'],
      ['CATEGORY', 'Area'], ['GOVT_STAT', 'Government'], ['TYPE_OF_METER', 'Meter type'], ['CONN_BY', 'Connected by'], ['TIME_OF_DAY', 'Tariff']
    ];
    var FILTERS = { CONN_STAT: 'All statuses', BASE_CLASS: 'All classes', CONN_PHASE: 'Any phase', CATEGORY: 'Rural & urban', GOVT_STAT: 'Govt & private' };
    var rows = [], asOn = '', scope = null, hf = { TYPE_OF_METER: '', CONN_BY: '' };
    function lab(dim, v) { return LABELS[dim] ? LABELS[dim](v) : v; }
    function num(v) { return Number(String(v == null ? '' : v).replace(/,/g, '')) || 0; }

    $('rowDim').innerHTML = DIMS.map(function (d) { return '<option value="' + d[0] + '">' + d[1] + '</option>'; }).join('');
    $('colDim').innerHTML = '<option value="">Nothing</option>' + DIMS.slice(3).map(function (d) { return '<option value="' + d[0] + '">' + d[1] + '</option>'; }).join('');

    function prepare(text) {
      asOn = '';
      rows = UI.csv(text).filter(function (r) { return r.CCC_CODE; }).map(function (r) {
        if (!asOn && r.Date) asOn = r.Date;
        var o = UI.office(r.CCC_CODE);
        r._region = o.region || 'Unmapped'; r._divn = o.division || 'Unmapped'; r._supp = o.ccc || String(r.CCC_CODE).trim();
        r.COUNT = num(r.COUNT); r.LOAD = num(r.LOAD); r.SD_LAKH = num(r.SD_LAKH); r.OSD_LAKH = num(r.OSD_LAKH);
        r.TIME_OF_DAY = r.TIME_OF_DAY || '';
        return r;
      });
      if (window.MzoScope) rows = window.MzoScope.filterRows(rows);
      fillFilters();
    }
    function fillFilters() {
      UI.offices(rows);
      Object.keys(FILTERS).forEach(function (k) { UI.fill('f_' + k, UI.uniq(rows, k).map(function (v) { return { value: v, label: lab(k, v) }; }), FILTERS[k]); });
      if (!scope) scope = UI.lockScope();
    }
    function base(skip) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      var sel = {}; Object.keys(FILTERS).forEach(function (k) { sel[k] = $('f_' + k).value; });
      return rows.filter(function (r) {
        if ((reg && r._region !== reg) || (div && r._divn !== div) || (ccc && r._supp !== ccc)) return false;
        for (var k in sel) if (k !== skip && sel[k] && r[k] !== sel[k]) return false;
        for (var h in hf) if (h !== skip && hf[h] && r[h] !== hf[h]) return false;
        return true;
      });
    }
    function sum(list, k) { var s = 0; for (var i = 0; i < list.length; i++) s += list[i][k]; return s; }
    function mw(kw) { return kw >= 1000 ? UI.n(Math.round(kw / 100) / 10) + ' MW' : UI.n(Math.round(kw)) + ' kW'; }
    function lakh(l) { return UI.inr(l * 1e5); }

    function render() {
      var b = base(), all = sum(rows, 'COUNT'), c = sum(b, 'COUNT'), load = sum(b, 'LOAD'), osd = sum(b, 'OSD_LAKH');
      var live = sum(b.filter(function (r) { return r.CONN_STAT === 'LIVE'; }), 'COUNT');
      var govt = b.filter(function (r) { return r.GOVT_STAT === 'YES'; });
      $('sCount').textContent = UI.n(c); $('sCountS').textContent = UI.n(live) + ' live · ' + UI.pct(live, c);
      $('sLoad').textContent = mw(load); $('sLoadS').textContent = (c ? (load / c).toFixed(2) : '0') + ' kW per consumer';
      $('sSd').textContent = lakh(sum(b, 'SD_LAKH'));
      $('sOsd').textContent = lakh(osd); $('sOsdS').textContent = c ? '₹' + UI.n(Math.round(osd * 1e5 / c)) + ' per consumer' : ' ';
      $('sGovt').textContent = UI.n(sum(govt, 'COUNT')); $('sGovtS').textContent = 'Outstanding ' + lakh(sum(govt, 'OSD_LAKH'));
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.n(all) + ' consumers';

      pivot(b);
      hist('hStat', 'CONN_STAT', base('CONN_STAT'), $('f_CONN_STAT').value, function (v) { $('f_CONN_STAT').value = $('f_CONN_STAT').value === v ? '' : v; UI.mark($('f_CONN_STAT')); render(); });
      hist('hMeter', 'TYPE_OF_METER', base('TYPE_OF_METER'), hf.TYPE_OF_METER, function (v) { hf.TYPE_OF_METER = hf.TYPE_OF_METER === v ? '' : v; render(); });
      hist('hBy', 'CONN_BY', base('CONN_BY'), hf.CONN_BY, function (v) { hf.CONN_BY = hf.CONN_BY === v ? '' : v; render(); });
      $('clearBtn').hidden = !(hf.TYPE_OF_METER || hf.CONN_BY || Object.keys(FILTERS).some(function (k) { return $('f_' + k).value; }) || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }
    function hist(el, dim, list, active, onClick) {
      var g = {}; list.forEach(function (r) { var k = r[dim] || ''; g[k] = (g[k] || 0) + r.COUNT; });
      var short = { 'DEEMED DISCONNECTED': 'Deemed disc.', 'PERMANENTLY DISCONNECTED': 'Permanent disc.', 'TEMPORARY DISCONNECTED': 'Temporary disc.' };
      UI.hist(el, Object.keys(g).sort(function (a, c) { return g[c] - g[a]; }).slice(0, 8).map(function (k) { return { key: k, label: short[k] || lab(dim, k), value: g[k] }; }),
        { active: active, onClick: function (row) { onClick(row.key); } });
    }

    var last = { rows: [], cols: [] };
    function pivot(b) {
      var rd = $('rowDim').value, cd = $('colDim').value === rd ? '' : $('colDim').value;
      var g = {}, colVals = cd ? UI.uniq(b, cd) : [];
      if (cd && colVals.length > 8) { var tot = {}; b.forEach(function (r) { tot[r[cd]] = (tot[r[cd]] || 0) + r.COUNT; }); colVals = colVals.sort(function (x, y) { return tot[y] - tot[x]; }).slice(0, 8); }
      b.forEach(function (r) {
        var k = r[rd] || '—';
        var o = g[k] || (g[k] = { key: k, label: lab(rd, k), parent: rd === '_supp' ? r._divn : rd === '_divn' ? r._region : '', COUNT: 0, LOAD: 0, SD: 0, OSD: 0 });
        o.COUNT += r.COUNT; o.LOAD += r.LOAD; o.SD += r.SD_LAKH; o.OSD += r.OSD_LAKH;
        if (cd) o['c:' + r[cd]] = (o['c:' + r[cd]] || 0) + r.COUNT;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; });
      var cols = [{ key: 'label', label: DIMS.filter(function (d) { return d[0] === rd; })[0][1], fmt: function (v, o) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (o.parent ? '<span class="sub">' + UI.esc(o.parent) + '</span>' : ''); }, csv: function (o) { return o.label; } }];
      colVals.forEach(function (v) { cols.push({ key: 'c:' + v, label: lab(cd, v), num: true, fmt: function (x) { return x ? UI.n(x) : '<span class="ui-muted">—</span>'; }, csv: function (o) { return o['c:' + v] || 0; } }); });
      cols.push({ key: 'COUNT', label: 'Consumers', num: true, fmt: UI.n });
      if (!cd) {
        cols.push({ key: 'LOAD', label: 'Load (kW)', num: true, fmt: function (v) { return UI.n(Math.round(v)); }, hideSm: true, csv: function (o) { return Math.round(o.LOAD); } });
        cols.push({ key: 'SD', label: 'SD', num: true, fmt: lakh, hideSm: true, csv: function (o) { return (o.SD * 1e5).toFixed(0); } });
        cols.push({ key: 'OSD', label: 'Outstanding', num: true, fmt: lakh, csv: function (o) { return (o.OSD * 1e5).toFixed(0); } });
      }
      var foot = { COUNT: sum(b, 'COUNT'), LOAD: sum(b, 'LOAD'), SD: sum(b, 'SD_LAKH'), OSD: sum(b, 'OSD_LAKH') };
      colVals.forEach(function (v) { foot['c:' + v] = sum(b.filter(function (r) { return r[cd] === v; }), 'COUNT'); });
      last = { rows: list, cols: cols };
      var drillable = rd === '_region' || rd === '_divn';
      UI.table('pivot', { rows: list, sort: { key: 'COUNT', dir: 'desc' }, columns: cols, foot: list.length > 1 ? foot : null, count: false, empty: 'No consumers for these filters.', onRow: drillable ? function (o) { drill(rd, o.key); } : null });
    }
    function drill(dim, v) {
      if (dim === '_region') { $('regionFilter').value = v; $('divisionFilter').value = ''; $('rowDim').value = '_divn'; }
      else { $('divisionFilter').value = v; $('rowDim').value = '_supp'; }
      $('cccFilter').value = '';
      fillFilters(); markAll(); render();
    }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter'].concat(Object.keys(FILTERS).map(function (k) { return 'f_' + k; })).forEach(function (id) { UI.mark($(id)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); markAll(); render();
      });
    });
    Object.keys(FILTERS).forEach(function (k) { $('f_' + k).addEventListener('change', function () { UI.mark(this); render(); }); });
    ['rowDim', 'colDim'].forEach(function (id) { $(id).addEventListener('change', function () { $('pivot').__ui = null; render(); }); });
    $('clearBtn').addEventListener('click', function () {
      hf.TYPE_OF_METER = ''; hf.CONN_BY = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].concat(Object.keys(FILTERS).map(function (k) { return 'f_' + k; })).forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters(); markAll(); render();
    });
    $('exportBtn').addEventListener('click', function () { UI.exportCsv('consumers-' + $('rowDim').value.replace('_', '') + '.csv', last.cols, last.rows); });

    function load(force) {
      var b = $('refreshBtn'); if (force) b.classList.add('spin');
      return fetch(URL_CSV, { cache: force ? 'no-store' : 'default' }).then(function (r) { if (!r.ok) throw new Error('Sheet HTTP ' + r.status); return r.text(); })
        .then(function (t) {
          prepare(t);
          if (!load.done) {
            load.done = true;
            if (scope && (scope.level === 'division' || scope.level === 'ccc')) $('rowDim').value = '_supp';
            else if (scope && scope.level === 'region') $('rowDim').value = '_divn';
            markAll();
          }
          render();
        })
        .catch(function (e) { if (!rows.length) { $('meta').textContent = 'Could not load data'; $('pivot').innerHTML = '<div class="ui-empty">' + UI.esc(e.message) + '</div>'; } else UI.toast(e.message); })
        .then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
