<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consumers · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <script src="/mzo_rows.js?v=6" defer></script>
  <style>
    .cs-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Consumers<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec"><div aria-label="Status" id="fStat"></div></div>
        <div class="ui-side-sec"><div aria-label="Class" id="fClass"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Phase, Area and Government">
            <button type="button" role="tab" data-pane="fPhase" aria-pressed="true" aria-selected="true">Phase</button>
            <button type="button" role="tab" data-pane="fArea" aria-pressed="false" aria-selected="false">Area</button>
            <button type="button" role="tab" data-pane="fGovt" aria-pressed="false" aria-selected="false">Govt</button>
          </div>
          <div aria-label="Phase" id="fPhase"></div>
          <div aria-label="Area" id="fArea" hidden></div>
          <div aria-label="Government" id="fGovt" hidden></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Meter type and Connected by">
            <button type="button" role="tab" data-pane="fMeter" aria-pressed="true" aria-selected="true">Meter</button>
            <button type="button" role="tab" data-pane="fBy" aria-pressed="false" aria-selected="false">Connected by</button>
          </div>
          <div aria-label="Meter type" id="fMeter"></div>
          <div aria-label="Connected by" id="fBy" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" style="--n:5" aria-label="Summary">
          <div class="ui-stat"><div class="k">Consumers</div><div class="v" id="sCount"><span class="ui-skel"></span></div><div class="s" id="sCountS">&nbsp;</div></div>
          <div class="ui-stat"><div class="k">Connected load</div><div class="v" id="sLoad"><span class="ui-skel"></span></div><div class="s" id="sLoadS">&nbsp;</div></div>
          <div class="ui-stat"><div class="k">Security deposit</div><div class="v" id="sSd"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
          <div class="ui-stat"><div class="k">Outstanding</div><div class="v" id="sOsd"><span class="ui-skel"></span></div><div class="s" id="sOsdS">&nbsp;</div></div>
          <div class="ui-stat"><div class="k">Govt. consumers</div><div class="v" id="sGovt"><span class="ui-skel"></span></div><div class="s" id="sGovtS">&nbsp;</div></div>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">Breakdown</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="cs-pick">
                <span class="ui-select"><select id="rowDim" aria-label="Break down by"></select></span>
                <span>split by</span>
                <span class="ui-select"><select id="colDim" aria-label="Split by"></select></span>
                <button type="button" class="ui-btn sm icon" id="exportBtn" aria-label="Export CSV" title="Export CSV"><svg class="ui-i"><use href="#ui-download"/></svg></button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="pivot" style="--max-h:640px"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', H: 'Class H', S: 'Class S', O: 'Others' };
    var STAT_DOT = {
      'LIVE': 'ok',
      'TEMPORARY DISCONNECTED': 'warn',
      'DEEMED DISCONNECTED': 'bad',
      'PERMANENTLY DISCONNECTED': 'bad'
    };
    var SHORT_STAT = {
      'DEEMED DISCONNECTED': 'Deemed disc.',
      'PERMANENTLY DISCONNECTED': 'Permanent disc.',
      'TEMPORARY DISCONNECTED': 'Temporary disc.'
    };
    var LABELS = {
      CONN_STAT: function (v) { return SHORT_STAT[v] || UI.title(v); },
      BASE_CLASS: function (v) { return CLASS[v] || v; },
      CONN_PHASE: function (v) { return v === '3' ? 'Three phase' : v === '1' ? 'Single phase' : v; },
      CATEGORY: function (v) { return v === 'R' ? 'Rural' : v === 'U' ? 'Urban' : v; },
      GOVT_STAT: function (v) { return v === 'YES' ? 'Government' : v === 'NO' ? 'Private' : v; },
      TYPE_OF_METER: function (v) { return { ELECTRIONIC: 'Electronic', ELECTROMAGNATIC: 'Electromagnetic', 'NO METER': 'No meter', SMART: 'Smart' }[v] || UI.title(v); },
      CONN_BY: function (v) { return { 'MANNUAL(GHOST)': 'Manual (ghost)', CCC: 'CCC', RE: 'RE', BRGF: 'BRGF' }[v] || UI.title(v); },
      TIME_OF_DAY: function (v) { return v === 'T' ? 'Time of day' : v === 'W' ? 'Normal' : v ? v : 'Not set'; }
    };
    var DIMS = [
      ['_region', 'Region'], ['_divn', 'Division'], ['_supp', 'CCC'], ['CONN_STAT', 'Status'], ['BASE_CLASS', 'Class'], ['CONN_PHASE', 'Phase'],
      ['CATEGORY', 'Area'], ['GOVT_STAT', 'Government'], ['TYPE_OF_METER', 'Meter type'], ['CONN_BY', 'Connected by'], ['TIME_OF_DAY', 'Tariff']
    ];
    function lab(dim, v) { return LABELS[dim] ? LABELS[dim](v) : v; }

    var rows = [], asOn = '', scope = null;
    var f = {
      CONN_STAT: '',
      BASE_CLASS: '',
      CONN_PHASE: '',
      CATEGORY: '',
      GOVT_STAT: '',
      TYPE_OF_METER: '',
      CONN_BY: ''
    };
    var FACET_DIMS = ['CONN_STAT', 'BASE_CLASS', 'CONN_PHASE', 'CATEGORY', 'GOVT_STAT', 'TYPE_OF_METER', 'CONN_BY'];
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    $('rowDim').innerHTML = DIMS.map(function (d) { return '<option value="' + d[0] + '">' + d[1] + '</option>'; }).join('');
    $('colDim').innerHTML = '<option value="">Nothing</option>' + DIMS.slice(3).map(function (d) { return '<option value="' + d[0] + '">' + d[1] + '</option>'; }).join('');

    // t.rows: uniform rows of schema/consumers.json (numbers, ISO date, canonical _region/_division/_ccc),
    // already scoped to the login by MzoRows. Each row is a count for one combination of dimensions.
    function prepare(t) {
      asOn = t.first('date') || '';
      rows = t.rows.filter(function (d) { return d.ccc_code; }).map(function (d) {
        return {
          CCC_CODE: d.ccc_code, _region: d._region || 'Unmapped', _divn: d._division || 'Unmapped', _supp: d._ccc || d.ccc_code,
          COUNT: d.count || 0, LOAD: d.load || 0, SD_LAKH: d.sd_lakh || 0, OSD_LAKH: d.osd_lakh || 0,
          CONN_STAT: d.conn_stat, BASE_CLASS: d.base_class, CONN_PHASE: d.conn_phase, CATEGORY: d.category, GOVT_STAT: d.govt_stat,
          TYPE_OF_METER: d.type_of_meter, CONN_BY: d.conn_by, TIME_OF_DAY: d.time_of_day
        };
      });
      fillFilters();
    }

    function fillFilters() {
      UI.offices(rows);
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function base(skip) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return rows.filter(function (r) {
        if ((reg && r._region !== reg) || (div && r._divn !== div) || (ccc && r._supp !== ccc)) return false;
        for (var i = 0; i < FACET_DIMS.length; i++) {
          var k = FACET_DIMS[i];
          if (k !== skip && f[k] && r[k] !== f[k]) return false;
        }
        return true;
      });
    }

    function sum(list, k) { var s = 0; for (var i = 0; i < list.length; i++) s += list[i][k]; return s; }
    function mw(kw) { return kw >= 1000 ? UI.n(Math.round(kw / 100) / 10) + ' MW' : UI.n(Math.round(kw)) + ' kW'; }
    function lakh(l) { return UI.inr(l * 1e5); }

    function facetOptions(dim, dotMap) {
      var b = base(dim);
      var g = {};
      b.forEach(function (r) {
        var k = r[dim];
        if (k != null && k !== '') g[k] = (g[k] || 0) + r.COUNT;
      });
      return Object.keys(g).sort(function (x, y) { return g[y] - g[x]; }).map(function (k) {
        return {
          value: k,
          label: lab(dim, k),
          count: g[k],
          dot: dotMap ? dotMap[k] : ''
        };
      });
    }

    function renderFacets() {
      UI.facet('fStat', facetOptions('CONN_STAT', STAT_DOT), f.CONN_STAT, function (v) { f.CONN_STAT = v; render(); });
      UI.facet('fClass', facetOptions('BASE_CLASS'), f.BASE_CLASS, function (v) { f.BASE_CLASS = v; render(); });
      UI.facet('fPhase', facetOptions('CONN_PHASE'), f.CONN_PHASE, function (v) { f.CONN_PHASE = v; render(); });
      UI.facet('fArea', facetOptions('CATEGORY'), f.CATEGORY, function (v) { f.CATEGORY = v; render(); });
      UI.facet('fGovt', facetOptions('GOVT_STAT'), f.GOVT_STAT, function (v) { f.GOVT_STAT = v; render(); });
      UI.facet('fMeter', facetOptions('TYPE_OF_METER'), f.TYPE_OF_METER, function (v) { f.TYPE_OF_METER = v; render(); });
      UI.facet('fBy', facetOptions('CONN_BY'), f.CONN_BY, function (v) { f.CONN_BY = v; render(); });

      var active = FACET_DIMS.filter(function (k) { return f[k]; }).length +
                   SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active, {
        fPhase: f.CONN_PHASE,
        fArea: f.CATEGORY,
        fGovt: f.GOVT_STAT,
        fMeter: f.TYPE_OF_METER,
        fBy: f.CONN_BY
      });
    }

    function clearAll() {
      FACET_DIMS.forEach(function (k) { f[k] = ''; });
      SELECTS.forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters();
      render();
    }

    function render() {
      var b = base(), c = sum(b, 'COUNT'), load = sum(b, 'LOAD'), osd = sum(b, 'OSD_LAKH');
      var live = sum(b.filter(function (r) { return r.CONN_STAT === 'LIVE'; }), 'COUNT');
      var govt = b.filter(function (r) { return r.GOVT_STAT === 'YES'; });
      $('sCount').textContent = UI.n(c); $('sCountS').textContent = UI.n(live) + ' live · ' + UI.pct(live, c);
      $('sLoad').textContent = mw(load); $('sLoadS').textContent = (c ? (load / c).toFixed(2) : '0') + ' kW per consumer';
      $('sSd').textContent = lakh(sum(b, 'SD_LAKH'));
      $('sOsd').textContent = lakh(osd); $('sOsdS').textContent = c ? '₹' + UI.n(Math.round(osd * 1e5 / c)) + ' per consumer' : '\u00a0';
      $('sGovt').textContent = UI.n(sum(govt, 'COUNT')); $('sGovtS').textContent = 'Outstanding ' + lakh(sum(govt, 'OSD_LAKH'));
      $('asOn').textContent = asOn ? UI.fmtDate(asOn) : '—';

      var rhEl = $('rhCount');
      if (rhEl) rhEl.textContent = UI.n(c) + ' consumers · ' + lakh(osd) + ' OSD';
      renderReportHead(b);

      renderFacets();
      pivot(b);
    }

    var currentActiveFilters = [];
    function renderReportHead(b) {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var active = [];
      var rVal = $('regionFilter').value;
      if (rVal) {
        active.push({ key: 'region', label: 'Region: ' + rVal, clear: function () { $('regionFilter').value = ''; fillFilters(); render(); } });
      }
      var dVal = $('divisionFilter').value;
      if (dVal) {
        active.push({ key: 'division', label: 'Division: ' + dVal, clear: function () { $('divisionFilter').value = ''; fillFilters(); render(); } });
      }
      var cVal = $('cccFilter').value;
      if (cVal) {
        active.push({ key: 'ccc', label: 'CCC: ' + cVal, clear: function () { $('cccFilter').value = ''; fillFilters(); render(); } });
      }
      FACET_DIMS.forEach(function (k) {
        if (f[k]) {
          var dimLabel = (DIMS.filter(function (d) { return d[0] === k; })[0] || [k, k])[1];
          active.push({
            key: k,
            label: dimLabel + ': ' + lab(k, f[k]),
            clear: function () { f[k] = ''; render(); }
          });
        }
      });
      currentActiveFilters = active;
      if (!active.length) {
        bar.innerHTML = '<div class="rh-all-clear"><span class="ui-dot ok"></span><span>Showing all consumers</span></div>';
        return;
      }
      var html = '<div class="rh-filters">';
      active.forEach(function (flt, idx) {
        html += '<span class="rh-chip">' + UI.esc(flt.label) + '<button type="button" class="rh-chip-x" data-rh-clear="' + idx + '" aria-label="Remove filter">&times;</button></span>';
      });
      html += '<button type="button" class="rh-clear-btn" id="rhClearBtn">Reset all</button></div>';
      bar.innerHTML = html;
    }

    var last = { rows: [], cols: [] };
    function pivot(b) {
      var rd = $('rowDim').value, cd = $('colDim').value === rd ? '' : $('colDim').value;
      var g = {}, colVals = cd ? UI.uniq(b, cd) : [];
      if (cd && colVals.length > 8) { var tot = {}; b.forEach(function (r) { tot[r[cd]] = (tot[r[cd]] || 0) + r.COUNT; }); colVals = colVals.sort(function (x, y) { return tot[y] - tot[x]; }).slice(0, 8); }
      b.forEach(function (r) {
        var k = r[rd] || '—';
        var o = g[k] || (g[k] = { key: k, label: lab(rd, k), parent: rd === '_supp' ? r._divn : rd === '_divn' ? r._region : '', COUNT: 0, LOAD: 0, SD: 0, OSD: 0 });
        o.COUNT += r.COUNT; o.LOAD += r.LOAD; o.SD += r.SD_LAKH; o.OSD += r.OSD_LAKH;
        if (cd) o['c:' + r[cd]] = (o['c:' + r[cd]] || 0) + r.COUNT;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; });
      var cols = [{ key: 'label', label: DIMS.filter(function (d) { return d[0] === rd; })[0][1], fmt: function (v, o) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (o.parent ? '<span class="sub">' + UI.esc(o.parent) + '</span>' : ''); }, csv: function (o) { return o.label; } }];
      colVals.forEach(function (v) { cols.push({ key: 'c:' + v, label: lab(cd, v), num: true, fmt: function (x) { return x ? UI.n(x) : '<span class="ui-muted">—</span>'; }, csv: function (o) { return o['c:' + v] || 0; } }); });
      cols.push({ key: 'COUNT', label: 'Consumers', num: true, fmt: UI.n });
      if (!cd) {
        cols.push({ key: 'LOAD', label: 'Load (kW)', num: true, fmt: function (v) { return UI.n(Math.round(v)); }, hideSm: true, csv: function (o) { return Math.round(o.LOAD); } });
        cols.push({ key: 'SD', label: 'SD', num: true, fmt: lakh, hideSm: true, csv: function (o) { return (o.SD * 1e5).toFixed(0); } });
        cols.push({ key: 'OSD', label: 'Outstanding', num: true, fmt: lakh, csv: function (o) { return (o.OSD * 1e5).toFixed(0); } });
      }
      var foot = { COUNT: sum(b, 'COUNT'), LOAD: sum(b, 'LOAD'), SD: sum(b, 'SD_LAKH'), OSD: sum(b, 'OSD_LAKH') };
      colVals.forEach(function (v) { foot['c:' + v] = sum(b.filter(function (r) { return r[cd] === v; }), 'COUNT'); });
      last = { rows: list, cols: cols };
      var drillable = rd === '_region' || rd === '_divn';
      UI.table('pivot', { rows: list, sort: { key: 'COUNT', dir: 'desc' }, columns: cols, foot: list.length > 1 ? foot : null, count: false, empty: 'No consumers for these filters.', onRow: drillable ? function (o) { drill(rd, o.key); } : null });
    }

    function drill(dim, v) {
      if (dim === '_region') { $('regionFilter').value = v; $('divisionFilter').value = ''; $('rowDim').value = '_divn'; }
      else { $('divisionFilter').value = v; $('rowDim').value = '_supp'; }
      $('cccFilter').value = '';
      fillFilters(); render();
    }

    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillFilters(); render();
      });
    });

    ['rowDim', 'colDim'].forEach(function (id) { $(id).addEventListener('change', function () { $('pivot').__ui = null; render(); }); });
    $('exportBtn').addEventListener('click', function () { UI.exportCsv('consumers-' + $('rowDim').value.replace('_', '') + '.csv', last.cols, last.rows); });

    $('rhFiltersBar').addEventListener('click', function (e) {
      if (e.target.closest('#rhClearBtn')) { clearAll(); return; }
      var btn = e.target.closest('[data-rh-clear]');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
      if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
        currentActiveFilters[idx].clear();
      }
    });

    MzoRows.refresh('refreshBtn', 'consumers', function (t) { prepare(t); render(); });

    var first = true;
    MzoRows.load('consumers', function (t, info) {
      if (!t) { if (info && info.error && !rows.length) { $('asOn').textContent = 'Error'; $('pivot').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) $('rowDim').value = '_supp';
        else if (scope && scope.level === 'region') $('rowDim').value = '_divn';
      }
      render();
    });
  });
  </script>
</body>
</html>
