<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Defective meters · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <script src="/lib/defective_meter_pipeline.js?v=85" defer></script>
  <script src="/lib/sheet_mirror_client.js?v=110" defer></script>
  <style>
    .dm-band { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
    .dm-band h2 { margin: 0; font-size: 12.5px; font-weight: 500; color: var(--mzo-muted); }
    .dm-band span { font-size: 12px; color: var(--mzo-faint); }
    .dm-status { margin: -8px 0 16px; }
    .dm-status[hidden] { display: none; }
    .dm-prog { height: 4px; border-radius: 2px; background: var(--mzo-chart-soft); overflow: hidden; margin-top: 6px; max-width: 420px; }
    .dm-prog b { display: block; height: 100%; width: 0; background: var(--mzo-text); transition: width .2s ease; }
    @media (min-width: 1101px) { #prioStats { --n: 7; } }
    .dm-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 64px); justify-content: start; gap: 6px; align-items: end; height: 170px; }
    .dm-col { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; height: 100%; gap: 6px; cursor: pointer; min-width: 0; }
    .dm-col .n { font-size: 11px; color: var(--mzo-muted); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dm-col i { display: block; border-radius: 4px 4px 2px 2px; background: var(--mzo-chart); min-height: 2px; transition: background-color .12s; }
    .dm-col .y { font-size: 11.5px; color: var(--mzo-text-2); text-align: center; }
    .dm-col:hover i { background: var(--mzo-text-2); }
    .dm-col.on i { background: var(--mzo-text); }
    .dm-col.on .y { color: var(--mzo-text); font-weight: 600; }
    @media (max-width: 760px) { .dm-col .n { display: none; } .dm-col .y { font-size: 10px; } }
    @media (max-width: 1100px) and (min-width: 761px) { #prioStats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Defective meters</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn" id="syncBtn" hidden><svg class="ui-i"><use href="#ui-sync"/></svg>Sync sheet</button>
        <button type="button" class="ui-btn" id="uploadBtn" hidden><svg class="ui-i"><use href="#ui-upload"/></svg>Upload dump</button>
        <input type="file" id="fileInput" accept=".csv,.txt,text/csv" hidden />
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>
    <div class="dm-status ui-note" id="status" hidden><span id="statusText"></span><div class="dm-prog"><b id="statusBar"></b></div></div>

    <div class="ui-filters">
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="yearFilter" aria-label="Year reported"><option value="">Any year</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <div class="dm-band"><h2>All meters</h2><span>Counts only</span></div>
    <section class="ui-stats" style="--n:5" id="countStats" aria-label="All meters"></section>
    <div class="dm-band"><h2>Priority</h2><span>With consumer names</span></div>
    <section class="ui-stats" style="--n:7" id="prioStats" aria-label="Priority meters"></section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2 id="officeTitle">By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By class</h2></div>
          <div class="ui-panel-b"><div id="classHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By phase</h2></div>
          <div class="ui-panel-b"><div id="phaseHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h"><h2>Reported defective in</h2><span class="ui-note">Click a year to filter</span></div>
      <div class="ui-panel-b"><div id="yearHist" class="dm-cols"></div></div>
    </section>

    <section class="ui-panel" id="namesPanel" hidden>
      <div class="ui-panel-h">
        <h2 id="namesTitle">Consumers</h2>
        <button type="button" class="ui-btn sm" id="exportBtn" hidden><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="namesTable"><div class="ui-empty">Pick a CCC to list its consumers.</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var P = window.MzoDefectivePipeline;
    var DEFAULTS = {
      summaryCsvUrl: 'https://docs.google.com/spreadsheets/d/1dMLSX2bZBqZMPooh7_CrniCjqgy4MijaFW62GKJJldA/export?format=csv&gid=0',
      detailsCsvUrl: 'https://docs.google.com/spreadsheets/d/1dMLSX2bZBqZMPooh7_CrniCjqgy4MijaFW62GKJJldA/export?format=csv&gid=1638574999',
      sheetScriptUrl: 'https://script.google.com/macros/s/AKfycbzULRzoJRMlt_x3nlEo6RLFVzELgwAD5Z7f8JuvqwxBgC6cpc0BF7dynKwBg0hNIkBn/exec'
    };
    // metric key (pipeline name) → label; priority metrics have consumer names in the details tab
    var COUNT = [['total', 'Total'], ['agri', 'Agriculture'], ['over5years', 'Over 5 years'], ['load05to1', 'Load 0.5–1 kW'], ['loadBelow05', 'Load under 0.5 kW']];
    var PRIO = [['over10years', 'Over 10 years'], ['3phase', 'Three phase'], ['industrial', 'Industrial'], ['smartmeter', 'Smart'], ['loadAbove6', 'Load over 6 kW'], ['load3to6', 'Load 3–6 kW'], ['load1to3', 'Load 1–3 kW']];
    var LABEL = {}; COUNT.concat(PRIO).forEach(function (m) { LABEL[m[0]] = m[1]; });
    var STAT_KEY = { total: 'totalDefective', agri: 'agri', over5years: 'over5', load05to1: 'load05_1', loadBelow05: 'loadLt05', over10years: 'over10', '3phase': 'ph3', industrial: 'industrial', smartmeter: 'smart', loadAbove6: 'loadGt6', load3to6: 'load3_6', load1to3: 'load1_3' };
    var CLASS = { D: 'Domestic', C: 'Commercial', A: 'Agriculture', I: 'Industrial', W: 'Water works', H: 'Class H' };
    var meta = { summaryCsvUrl: '', detailsCsvUrl: '', sheetScriptUrl: '', canUpload: false };
    var rows = [], details = null, detailsP = null, metric = 'total', level = 'region', namesCcc = '', scope = null, asOn = '';

    function field(m) { return P ? P.kpiField(m) : 'total'; }
    function isPrio(m) { return !!(P && P.isPriorityMetric(m)); }
    function sum(list, f) { var s = 0; for (var i = 0; i < list.length; i++) { var n = Number(list[i][f]); if (n) s += n; } return s; }
    function ymd(v) { var t = String(v || '').trim(); if (/^\d{8}$/.test(t)) return new Date(+t.slice(0, 4), +t.slice(4, 6) - 1, +t.slice(6, 8)); return UI.date(t); }
    function parseRows(text) {
      if (/accounts\.google\.com|Sign in/i.test(text) && text.length < 5000) throw new Error('Sheet is not public.');
      return P.parseDump(text).rows.filter(function (r) { return Object.keys(r).some(function (k) { return String(r[k] || '').trim(); }); });
    }
    function withOffice(r) {
      var o = UI.office(r.CCC_CODE);
      r._region = o.region; r._divn = o.division; r._supp = o.ccc || String(r.CCC_CODE || '');
      return r;
    }

    /* ---------- stat strips ---------- */
    function statHtml(m) { return '<button type="button" class="ui-stat" data-m="' + m[0] + '"><div class="k">' + m[1] + '</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>'; }
    $('countStats').innerHTML = COUNT.map(statHtml).join('');
    $('prioStats').innerHTML = PRIO.map(statHtml).join('');
    function primeFromMeta(stats) {
      if (!stats || rows.length) return;
      COUNT.concat(PRIO).forEach(function (m) {
        var v = stats[STAT_KEY[m[0]]], el = document.querySelector('.ui-stat[data-m="' + m[0] + '"] .v');
        if (el && v != null) el.textContent = UI.n(v);
      });
      if (stats.reportDate && !asOn) $('meta').textContent = 'As on ' + stats.reportDate;
    }

    /* ---------- filters ---------- */
    function fillFilters() {
      UI.offices(rows);
      UI.fill('classFilter', UI.uniq(rows, 'BASE_CLASS').map(function (c) { return { value: c, label: CLASS[c] || c }; }), 'All classes');
      UI.fill('yearFilter', UI.uniq(rows, 'DEFECT_YEAR').sort(function (a, b) { return b - a; }), 'Any year');
      if (!scope) scope = UI.lockScope();
    }
    function base() {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, cls = $('classFilter').value, yr = $('yearFilter').value;
      return rows.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!cls || r.BASE_CLASS === cls) && (!yr || String(r.DEFECT_YEAR) === yr);
      });
    }

    /* ---------- render ---------- */
    function render() {
      var b = base(), f = field(metric), tot = sum(b, 'total');
      [].forEach.call(document.querySelectorAll('.ui-stat[data-m]'), function (el) {
        var m = el.getAttribute('data-m'), v = sum(b, field(m));
        el.querySelector('.v').textContent = UI.n(v);
        el.querySelector('.s').textContent = m === 'total' ? (UI.n(UI.uniq(b, '_supp').length) + ' CCCs') : UI.pct(v, tot) + ' of defective';
        el.setAttribute('aria-pressed', String(m === metric));
      });

      // Offices for the active metric
      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      b.forEach(function (r) {
        var n = Number(r[f]) || 0; if (!n) return;
        var name = r[key] || 'Unmapped';
        var o = g[name] || (g[name] = { name: name, code: r.CCC_CODE, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0 });
        o.n += n;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }), total = sum(b, f), max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));
      var namesRow = level === 'ccc' && isPrio(metric);
      $('officeTitle').textContent = LABEL[metric] + ' by office';
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No meters for these filters.',
        selected: function (x) { return namesRow && x.name === namesCcc; },
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Meters', num: true, fmt: UI.n },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.n; }, fmt: function (_, x) { return UI.bar(x.n, max, UI.pct(x.n, total)); }, width: '40%' }
        ],
        foot: list.length > 1 ? { n: total } : null,
        // Count-only metrics never open names (docs/reports.md).
        onRow: level === 'ccc' ? (namesRow ? function (x) { showNames(x.name); } : null) : function (x) { drill(x.name); }
      });

      // Distributions for the active metric (year ignores the year filter so it can be used to pick one)
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, cls = $('classFilter').value;
      var noYear = rows.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!cls || r.BASE_CLASS === cls);
      });
      var yr = {}; noYear.forEach(function (r) { var n = Number(r[f]) || 0; if (n && r.DEFECT_YEAR) yr[r.DEFECT_YEAR] = (yr[r.DEFECT_YEAR] || 0) + n; });
      var years = Object.keys(yr).sort(), ymax = Math.max.apply(null, years.map(function (y) { return yr[y]; }).concat([0])), ysel = $('yearFilter').value;
      $('yearHist').innerHTML = years.length ? years.map(function (y) {
        return '<div class="dm-col' + (ysel === y ? ' on' : '') + '" data-y="' + y + '" title="' + y + ': ' + UI.n(yr[y]) + '"><span class="n">' + UI.n(yr[y]) + '</span><i style="height:' + (ymax ? Math.max(1.5, yr[y] / ymax * 120) : 0) + 'px"></i><span class="y">' + (years.length > 12 ? "'" + y.slice(2) : y) + '</span></div>';
      }).join('') : '<div class="ui-empty">No meters for these filters.</div>';
      var cl = {}; b.forEach(function (r) { var n = Number(r[f]) || 0; if (n) cl[r.BASE_CLASS || '—'] = (cl[r.BASE_CLASS || '—'] || 0) + n; });
      UI.hist('classHist', Object.keys(cl).sort(function (a, c) { return cl[c] - cl[a]; }).map(function (c) { return { key: c, label: CLASS[c] || c, value: cl[c] }; }),
        { active: $('classFilter').value, onClick: function (row) { $('classFilter').value = $('classFilter').value === row.key ? '' : row.key; UI.mark($('classFilter')); render(); } });
      // Phase split is stored on the summary for all meters (not per metric).
      UI.hist('phaseHist', [{ key: '1', label: 'Single phase', value: sum(b, 'phase_1') }, { key: '3', label: 'Three phase', value: sum(b, 'phase_3') }, { key: 'o', label: 'Other', value: sum(b, 'phase_other') }].filter(function (x) { return x.value; }));

      var p = isPrio(metric);
      $('namesPanel').hidden = !p;
      if (p) {
        var ccc = $('cccFilter').value;
        if (ccc && ccc !== namesCcc) namesCcc = ccc;
        if (namesCcc) showNames(namesCcc, true); else { $('namesTitle').textContent = LABEL[metric] + ' · consumers'; $('exportBtn').hidden = true; $('namesTable').innerHTML = '<div class="ui-empty">Pick a CCC in the table above to list its consumers.</div>'; }
      }
      $('clearBtn').hidden = !(metric !== 'total' || $('classFilter').value || $('yearFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    /* ---------- consumer names (priority metrics only) ---------- */
    function loadDetails() {
      if (details) return Promise.resolve(details);
      if (detailsP) return detailsP;
      var hub = window.mzoDataHub;
      detailsP = Promise.resolve(hub && hub.waitForDataset('CACHE_DEFECTIVE_DETAILS')).catch(function () {})
        .then(function () { return hub ? hub._peek('CACHE_DEFECTIVE_DETAILS') : null; })
        .then(function (t) {
          if (typeof t === 'string' && t.trim()) return t;
          return fetch(meta.detailsCsvUrl || DEFAULTS.detailsCsvUrl, { credentials: 'omit' }).then(function (r) { if (!r.ok) throw new Error('Sheet HTTP ' + r.status); return r.text(); });
        })
        .then(function (t) { details = parseRows(t).map(withOffice); if (window.MzoScope) details = window.MzoScope.filterRows(details); detailsP = null; return details; })
        .catch(function (e) { detailsP = null; throw e; });
      return detailsP;
    }
    var NAME_COLS = [
      { key: 'NAME', label: 'Consumer', cls: 'wrap', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(UI.blank(v) ? '—' : UI.title(v)) + '</span><span class="sub">' + UI.esc(r.CON_ID || '') + '</span>'; } },
      { key: 'METER_NO', label: 'Meter' },
      { key: 'FIRST_REPORTED_DEF_DT', label: 'Reported', num: true, sortVal: function (r) { var d = ymd(r.FIRST_REPORTED_DEF_DT); return d ? d.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(ymd(v)); }, csv: function (r) { return UI.fmtDate(ymd(r.FIRST_REPORTED_DEF_DT)); } },
      { key: 'BASE_CLASS', label: 'Class', hideSm: true, fmt: function (v) { return UI.esc(CLASS[v] || v || '—'); } },
      { key: 'PHASE', label: 'Phase', hideSm: true },
      { key: 'CONN_LOAD', label: 'Load (kW)', num: true, sortVal: function (r) { return parseFloat(r.CONN_LOAD) || 0; } },
      { key: 'MRU', label: 'MRU', hideSm: true }
    ];
    function showNames(ccc, quiet) {
      namesCcc = ccc;
      var flag = P ? P.detailsFlag(metric) : '';
      $('namesPanel').hidden = false;
      $('namesTitle').innerHTML = UI.esc(LABEL[metric]) + ' · ' + UI.esc(ccc);
      if (!details) $('namesTable').innerHTML = '<div class="ui-empty">Loading consumers…</div>';
      if (!quiet) $('namesPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      loadDetails().then(function (all) {
        var cls = $('classFilter').value, yr = $('yearFilter').value;
        var seen = {};
        var list = all.filter(function (r) {
          if (r._supp !== ccc || Number(r[flag]) !== 1) return false;
          var dk = (r.CON_ID || '') + '|' + (r.METER_NO || '');
          if (seen[dk]) return false; // the names tab repeats some rows
          seen[dk] = 1;
          if (cls && r.BASE_CLASS !== cls) return false;
          if (yr) { var d = ymd(r.FIRST_REPORTED_DEF_DT); if (!d || String(d.getFullYear()) !== yr) return false; }
          return true;
        });
        var loadSort = /^load/.test(metric);
        window.__names = list;
        $('exportBtn').hidden = !list.length;
        $('namesTitle').innerHTML = UI.esc(LABEL[metric]) + ' · ' + UI.esc(ccc) + ' <small>' + UI.n(list.length) + '</small>';
        UI.table('namesTable', {
          rows: list, sort: loadSort ? { key: 'CONN_LOAD', dir: 'desc' } : { key: 'FIRST_REPORTED_DEF_DT', dir: 'asc' }, limit: 50, resetPage: true,
          empty: 'No matching consumers in the names tab.', columns: NAME_COLS,
          onRow: function (r) {
            UI.drawer(UI.blank(r.NAME) ? (r.METER_NO || 'Consumer') : UI.title(r.NAME), [r._supp, r._divn].filter(Boolean).join(' · '), [
              ['Consumer ID', r.CON_ID], ['Meter', r.METER_NO], ['Reported defective', UI.fmtDate(ymd(r.FIRST_REPORTED_DEF_DT))], ['Class', CLASS[r.BASE_CLASS] || r.BASE_CLASS],
              ['Phase', r.PHASE], ['Load (kW)', r.CONN_LOAD], ['Connection', r.CONN_STAT], ['MRU', r.MRU], ['Mobile', r.MOBILE_NO], ['Address', r.ADDRESS], ['CCC code', r.CCC_CODE]
            ]);
          }
        });
      }).catch(function (e) { $('namesTable').innerHTML = '<div class="ui-empty">' + UI.esc(e.message || 'Could not load consumer names.') + '</div>'; });
    }

    /* ---------- navigation ---------- */
    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillFilters(); markAll(); setLevel(level);
    }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'yearFilter'].forEach(function (id) { UI.mark($(id)); }); }
    function setMetric(m) {
      metric = m; namesCcc = $('cccFilter').value || '';
      if (isPrio(m) && level !== 'ccc' && !$('cccFilter').value) level = 'ccc';
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      render();
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        namesCcc = $('cccFilter').value || '';
        fillFilters(); markAll(); render();
      });
    });
    ['classFilter', 'yearFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    document.querySelector('main').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat[data-m]');
      if (s) { var m = s.getAttribute('data-m'); setMetric(metric === m ? 'total' : m); }
    });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('yearHist').addEventListener('click', function (e) {
      var c = e.target.closest('.dm-col'); if (!c) return;
      var y = c.getAttribute('data-y');
      $('yearFilter').value = $('yearFilter').value === y ? '' : y; UI.mark($('yearFilter')); render();
    });
    $('clearBtn').addEventListener('click', function () {
      ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'yearFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      namesCcc = ''; metric = 'total'; fillFilters(); markAll();
      setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('defective-' + metric + '-' + (namesCcc || 'ccc').toLowerCase().replace(/\s+/g, '-') + '.csv',
        [{ key: 'CON_ID', label: 'Consumer ID' }, { key: 'NAME', label: 'Name' }, { key: 'METER_NO', label: 'Meter' }, { key: 'FIRST_REPORTED_DEF_DT', label: 'Reported', csv: NAME_COLS[2].csv }, { key: 'BASE_CLASS', label: 'Class' }, { key: 'PHASE', label: 'Phase' }, { key: 'CONN_LOAD', label: 'Load (kW)' }, { key: 'MRU', label: 'MRU' }, { key: 'MOBILE_NO', label: 'Mobile' }, { key: 'ADDRESS', label: 'Address' }],
        window.__names || []);
    });

    /* ---------- data ---------- */
    var first = true;
    function onSummary(text) {
      var parsed = parseRows(text);
      if (!parsed.some(function (r) { return r.total != null && r.total !== ''; })) throw new Error('Summary is empty.');
      rows = parsed.map(withOffice);
      if (window.MzoScope) rows = window.MzoScope.filterRows(rows);
      var d = rows.length ? ymd(rows[0].REPORT_AS_ON) : null;
      asOn = d ? UI.fmtDate(d) : (rows[0] && rows[0].REPORT_AS_ON) || '';
      $('meta').textContent = (asOn ? 'As on ' + asOn + ' · ' : '') + UI.n(sum(rows, 'total')) + ' meters';
      fillFilters();
      if (first) {
        first = false;
        var k = new URLSearchParams(location.search).get('kpi') || '';
        var alias = { over10: 'over10years', ph3: '3phase', smart: 'smartmeter', load_gt6: 'loadAbove6' };
        k = alias[k] || k;
        if (LABEL[k]) metric = k;
        var dv = new URLSearchParams(location.search).get('division');
        if (dv && !$('divisionFilter').disabled) {
          var o = [].filter.call($('divisionFilter').options, function (x) { return x.value.toLowerCase() === dv.toLowerCase(); })[0];
          if (o) { $('divisionFilter').value = o.value; fillFilters(); level = 'ccc'; }
        }
        if (isPrio(metric) || (scope && (scope.level === 'division' || scope.level === 'ccc'))) level = 'ccc';
        else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
        markAll();
      }
      render();
    }
    function fail(msg) {
      if (rows.length) return;
      $('meta').textContent = 'Could not load data';
      $('officeTable').innerHTML = '<div class="ui-empty">' + UI.esc(msg || 'Could not load data.') + '</div>';
    }
    function loadSummary() {
      return new Promise(function (resolve) {
        UI.load('CACHE_DEFECTIVE', function (text, info) {
          if (text) { try { onSummary(text); } catch (e) { fail(e.message); } resolve(); return; }
          if (info && info.error) {
            fetch(meta.summaryCsvUrl || DEFAULTS.summaryCsvUrl, { credentials: 'omit' }).then(function (r) { if (!r.ok) throw new Error('Sheet HTTP ' + r.status); return r.text(); })
              .then(function (t) { onSummary(t); }).catch(function (e) { fail(e.message); }).then(resolve);
          }
        });
      });
    }

    /* ---------- meta, upload, sync ---------- */
    function profileAllows() {
      try {
        var p = JSON.parse(localStorage.getItem('mzo_user_profile') || '{}');
        if (String(p.role || p.Role || '').trim().toLowerCase() === 'admin') return true;
        var flag = String(p['defective-upload-autho'] || p.defective_upload_autho || '').trim().toLowerCase();
        if (['y', 'yes', '1', 'true', 'upload'].indexOf(flag) !== -1) return true;
        return String(p.Username || p.username || '').trim().toLowerCase() === 'dm1';
      } catch (e) { return false; }
    }
    function permit(upload, sync) { meta.canUpload = !!upload; $('uploadBtn').hidden = !upload; $('syncBtn').hidden = !(sync || upload); }
    permit(profileAllows(), profileAllows());
    var metaP = fetch('/api/defective/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
      if (!m) return;
      meta.summaryCsvUrl = m.summaryCsvUrl || ''; meta.detailsCsvUrl = m.detailsCsvUrl || ''; meta.sheetScriptUrl = m.sheetScriptUrl || DEFAULTS.sheetScriptUrl;
      var up = !!m.canUpload || profileAllows();
      permit(up, !!m.canSync || up);
      primeFromMeta(m.stats);
    }).catch(function () {});

    function status(text, pct) {
      $('status').hidden = !text;
      $('statusText').textContent = text || '';
      $('statusBar').style.width = Math.max(0, Math.min(100, pct || 0)) + '%';
    }
    $('uploadBtn').addEventListener('click', function () { $('fileInput').value = ''; $('fileInput').click(); });
    $('fileInput').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      if (!confirm('Publish ' + file.name + ' as the new defective-meter dump?')) return;
      var btn = $('uploadBtn'); btn.disabled = true;
      publish(file).then(function () {
        status('Published. Reloading…', 100);
        details = null; return loadSummary();
      }).then(function () { status(''); UI.toast('Dump published'); })
        .catch(function (e) { status('Upload failed: ' + (e.message || e), 0); })
        .then(function () { btn.disabled = false; });
    });
    // Same pipeline as before: process in the browser, publish summary + names to Apps Script.
    function publish(file) {
      var Mirror = window.MzoSheetMirror, url = meta.sheetScriptUrl || DEFAULTS.sheetScriptUrl;
      if (!P || !Mirror) return Promise.reject(new Error('Upload failed to load.'));
      if (!/macro/i.test(url)) return Promise.reject(new Error('Google Sheet mirror is not configured.'));
      status('Reading file…', 4);
      var built, total, sent = 0;
      return file.text().then(function (text) {
        status('Preparing rows…', 12);
        built = P.buildFromCsvText(text);
        if (!built.summary.length) throw new Error('No rows found.');
        total = built.summary.length + built.details.length;
        var prog = function (n) { sent += n; status('Publishing… ' + UI.n(sent) + ' / ' + UI.n(total), 20 + Math.round((sent / Math.max(total, 1)) * 75)); };
        return Mirror.publishTab(url, 'summary', built.summaryHeaders, built.summary, prog, 'summary')
          .then(function () { return Mirror.publishTab(url, 'details', built.detailsHeaders, built.details, prog, 'details'); });
      }).then(function () {
        return Mirror.postScript(url, { action: 'savemeta', meta: { uploadedAt: new Date().toISOString(), originalName: file.name, sourceRows: built.sourceRows, summaryRows: built.summary.length, detailsRows: built.details.length, reportAsOn: built.reportAsOn } }).catch(function () {});
      }).then(function () {
        var hub = window.mzoDataHub;
        return hub ? Promise.all([hub.refresh('CACHE_DEFECTIVE').catch(function () {}), hub.refresh('CACHE_DEFECTIVE_DETAILS').catch(function () {})]) : null;
      });
    }
    $('syncBtn').addEventListener('click', function () {
      if (!confirm('Pull the latest defective-meter summary and names from the Google Sheet now?')) return;
      var b = this; b.disabled = true; b.classList.add('spin');
      fetch('/api/defective/sync', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' } })
        .then(function (r) { return r.json().catch(function () { throw new Error(r.status === 401 ? 'Session expired. Sign in again.' : 'HTTP ' + r.status); }).then(function (d) { if (!r.ok || d.status !== 'success') throw new Error(d.message || 'Sync failed'); return d; }); })
        .then(function () { var hub = window.mzoDataHub; details = null; return Promise.all([hub.refresh('CACHE_DEFECTIVE').catch(function () {}), hub.refresh('CACHE_DEFECTIVE_DETAILS').catch(function () {})]); })
        .then(loadSummary).then(function () { UI.toast('Synced from the sheet'); })
        .catch(function (e) { UI.toast(e.message || 'Sync failed'); })
        .then(function () { b.disabled = false; b.classList.remove('spin'); });
    });
    UI.refresh('refreshBtn', 'CACHE_DEFECTIVE', function (t) {
      details = null;
      try { onSummary(t); } catch (e) { UI.toast(e.message || 'Refresh failed'); }
    });

    if (!P) { fail('Defective pipeline failed to load.'); return; }
    // Meta first (it can point the hub at Supabase Storage); then the summary.
    Promise.race([metaP, new Promise(function (r) { setTimeout(r, 1500); })]).then(loadSummary);
  });
  </script>
</body>
</html>
