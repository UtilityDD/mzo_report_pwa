<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unbilled &amp; Billing Exceptions · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <style>
    .ui-head { align-items: center; }
    .ub-status { margin: 8px 16px 0; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .ub-prog { width: 140px; height: 6px; background: var(--mzo-border); border-radius: 99px; overflow: hidden; }
    .ub-prog b { display: block; height: 100%; width: 0; background: var(--mzo-brand); transition: width .3s ease; }
    .rh-search-wrap { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 320px; }
    .rh-search-wrap input { width: 100%; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--mzo-border); background: var(--mzo-surface); color: var(--mzo-text); font-size: 13px; }
    .rh-search-wrap input:focus { outline: none; border-color: var(--mzo-brand); }
    .ui-stat.active { outline: 2px solid var(--mzo-brand); outline-offset: -2px; }
    .tag-outsort { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(220, 38, 38, 0.12); color: #dc2626; }
    .tag-chronic { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(217, 119, 6, 0.12); color: #d97706; }
    .tag-current { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(37, 99, 235, 0.12); color: #2563eb; }
    .cell-sub { font-size: 11px; color: var(--mzo-muted); display: block; margin-top: 1px; }

    /* Modal styling */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-overlay.active { display: flex; }
    .modal-card { width: min(520px, 100%); background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); padding: 20px; }
    .modal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-h h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .modal-desc { font-size: 12.5px; color: var(--mzo-muted); margin-bottom: 16px; line-height: 1.45; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .modal-field input[type="file"] { width: 100%; font-size: 12px; padding: 6px; border: 1px solid var(--mzo-border); border-radius: 6px; background: var(--mzo-bg); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Unbilled &amp; Exceptions<span class="ui-badge" style="margin-left:8px;vertical-align:3px;" title="Updated weekly from CRM DB2 ISUDATA batch"><span class="ui-dot c1"></span>Weekly Update</span><span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="uploadBtn" hidden title="Directly upload unbilled CSV data to the VM"><svg class="ui-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload to VM</button>
        <button type="button" class="ui-btn" id="crmSyncBtn" hidden title="Direct extraction from IBM DB2"><svg class="ui-i"><use href="#ui-sync"/></svg>Sync from DB2</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ub-status ui-note" id="status" hidden><span id="statusText"></span><div class="ub-prog"><b id="statusBar"></b></div></div>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec">
          <label style="display:block;font-size:12px;font-weight:600;color:var(--mzo-muted);margin-bottom:6px">Unbilled Type</label>
          <span class="ui-select" style="width:100%">
            <select id="typeFilter" aria-label="Unbilled Type" style="width:100%">
              <option value="">All Types</option>
              <option value="outsort">Outsorts</option>
              <option value="chronic">3M Unbilled</option>
              <option value="current">Current Month Unbilled</option>
            </select>
          </span>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <label style="display:block;font-size:12px;font-weight:600;color:var(--mzo-muted);margin-bottom:6px">MRU Search</label>
          <input type="text" id="mruInput" placeholder="Filter by MRU..." style="width:100%;height:30px;padding:0 8px;border-radius:6px;border:1px solid var(--mzo-border);background:var(--mzo-surface);color:var(--mzo-text);font-size:12.5px;" />
        </div>
        <div class="ui-side-sec"><div aria-label="Class" id="fClass"></div></div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-tab="outsort"><div class="k"><span class="ui-dot c4"></span>Billing Outsorts</div><div class="v" id="statOutsort"><span class="ui-skel"></span></div><div class="s">Exceptions blocked from billing</div></button>
          <button type="button" class="ui-stat" data-tab="chronic"><div class="k"><span class="ui-dot c3"></span>3 Month Unbilled</div><div class="v" id="statChronic"><span class="ui-skel"></span></div><div class="s">&ge; 3 consecutive cycles</div></button>
          <button type="button" class="ui-stat" data-tab="mru"><div class="k"><span class="ui-dot c1"></span>Current Month Unbilled</div><div class="v" id="statCurrent"><span class="ui-skel"></span></div><div class="s">Active cycle pending reading/bill</div></button>
          <button type="button" class="ui-stat" data-tab="ccc"><div class="k"><span class="ui-dot c2"></span>Offices Affected</div><div class="v" id="statOffices"><span class="ui-skel"></span></div><div class="s">CCCs with unbilled/outsorts</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title" id="rhTitle">Region-wise Breakdown</h2>
                <span class="rh-badge" id="rhCount">0</span>
              </div>
              <div class="rh-search-wrap">
                <input type="search" id="searchInput" placeholder="Search Consumer ID, Name, Meter, MRU..." />
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>

          <div class="ui-drill-tabs" role="tablist" id="tabs">
            <button type="button" class="ui-drill-tab" role="tab" data-t="region" aria-selected="true">Region</button>
            <button type="button" class="ui-drill-tab" role="tab" data-t="division" aria-selected="false">Division</button>
            <button type="button" class="ui-drill-tab" role="tab" data-t="ccc" aria-selected="false">CCC</button>
            <button type="button" class="ui-drill-tab" role="tab" data-t="class" aria-selected="false">Class</button>
            <button type="button" class="ui-drill-tab" role="tab" data-t="mru" aria-selected="false">MRU</button>
            <button type="button" class="ui-drill-tab" role="tab" data-t="outsort" aria-selected="false">Outsorts</button>
            <button type="button" class="ui-drill-tab" role="tab" data-t="chronic" aria-selected="false">3M Unbilled</button>
          </div>

          <div id="table"><div class="ui-empty">Loading unbilled datasets…</div></div>
        </section>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="uploadModal" role="dialog" aria-modal="true" aria-labelledby="upTitle">
    <div class="modal-card">
      <div class="modal-h">
        <h3 id="upTitle">Upload Unbilled Data to VM</h3>
        <button type="button" class="ui-btn ghost sm" id="modalCloseBtn" aria-label="Close">&times;</button>
      </div>
      <p class="modal-desc">
        Select CSV reports extracted from CRM DB2 ISUDATA to upload directly to the Oracle Cloud VM. Once uploaded, all users will immediately view the updated unbilled baseline.
      </p>
      <form id="uploadForm">
        <div class="modal-field">
          <label for="fOutsort">Billing Outsorts CSV <span style="font-weight:normal;color:var(--mzo-muted)">(OUTSORT_CURR_MON_UNBIL_REPORT)</span></label>
          <input type="file" id="fOutsort" name="outsort" accept=".csv,.txt" />
        </div>
        <div class="modal-field">
          <label for="fChronic">3 Month Unbilled CSV <span style="font-weight:normal;color:var(--mzo-muted)">(CRONIC_UNBIL_REPORT)</span></label>
          <input type="file" id="fChronic" name="chronic" accept=".csv,.txt" />
        </div>
        <div class="modal-field">
          <label for="fSummary">Current Month Summary CSV <span style="font-weight:normal;color:var(--mzo-muted)">(OUTSORT_CURR_MON_UNBIL_SUM_REP)</span></label>
          <input type="file" id="fSummary" name="summary" accept=".csv,.txt" />
        </div>
        <div class="modal-field" style="border-top:1px dashed var(--mzo-border);padding-top:10px;margin-top:12px;">
          <label for="fAuto">Or Single / Auto-detect CSV <span style="font-weight:normal;color:var(--mzo-muted)">(Any one report)</span></label>
          <input type="file" id="fAuto" name="file" accept=".csv,.txt" />
        </div>
        <div id="modalStatus" class="ui-note" style="margin-top:12px;font-size:12.5px;display:none;"></div>
        <div class="modal-actions">
          <button type="button" class="ui-btn ghost" id="modalCancelBtn">Cancel</button>
          <button type="submit" class="ui-btn primary" id="modalSubmitBtn">Upload Files</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    var currentTab = 'region';
    var renderedTab = null;
    var rawOutsort = [], rawChronic = [], rawSummary = [];
    var scopedOutsort = [], scopedChronic = [], scopedSummary = [];
    var f = { type: '', cls: '', mru: '', q: '' };
    var scope = null;
    var metaInfo = null;
    var lastTable = null;
    var firstData = true;

    function getActiveOutsort() {
      if (f.type && f.type !== 'outsort') return [];
      return scopedOutsort;
    }
    function getActiveChronic() {
      if (f.type && f.type !== 'chronic') return [];
      return scopedChronic;
    }
    function getActiveSummary() {
      if (f.type && f.type !== 'current') return [];
      return scopedSummary;
    }

    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function parseCsv(text) {
      if (!text || !text.trim()) return [];
      var lines = text.trim().split('\n');
      if (lines.length <= 1) return [];
      var sep = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
      var header = lines[0].split(sep).map(function (s) { return s.replace(/^"|"$/g, '').trim(); });
      var rows = [];
      for (var i = 1; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var parts = line.split(sep).map(function (s) { return s.replace(/^"|"$/g, '').trim(); });
        var row = {};
        for (var j = 0; j < header.length; j++) {
          row[header[j]] = parts[j] !== undefined ? parts[j] : '';
        }
        rows.push(row);
      }
      return rows;
    }

    function fmtYmd(ymd) {
      if (!ymd) return '—';
      var s = String(ymd).replace(/\D/g, '');
      if (s.length !== 8) return ymd || '—';
      return s.slice(6, 8) + '/' + s.slice(4, 6) + '/' + s.slice(0, 4);
    }

    function updateDateBadge(dateVal) {
      if (!dateVal) return;
      var dStr = String(dateVal).trim();
      if (/^\d{8}$/.test(dStr)) {
        dStr = dStr.slice(0, 4) + '-' + dStr.slice(4, 6) + '-' + dStr.slice(6, 8);
      }
      var badge = $('asOn');
      if (badge) {
        badge.textContent = UI.fmtDate(dStr);
        badge.title = 'Baseline Date: ' + dStr + ' (CRM DB2 ISUDATA Weekly Batch)';
      }
    }

    function initOffices() {
      var all = scopedSummary.length ? scopedSummary : rawSummary;
      if (!all.length) all = rawOutsort.concat(rawChronic);
      if (!all.length) {
        var allCodes = [];
        [rawOutsort, rawChronic, rawSummary].forEach(function (list) {
          list.forEach(function (r) {
            var c = String(r.CCC_CODE || '').replace(/\D/g, '').slice(-7);
            if (c && allCodes.indexOf(c) === -1) allCodes.push(c);
          });
        });
        all = allCodes.map(function (c) { return setOfficeFields({ CCC_CODE: c }); });
      }
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function setOfficeFields(row) {
      var code = String(row.CCC_CODE || '').replace(/\D/g, '').slice(-7);
      row.CCC_CODE = code;
      var o = window.MzoOffices && typeof window.MzoOffices.parseCode === 'function' ? window.MzoOffices.parseCode(code) : null;
      row._region = o && o.region ? o.region : (row.ZONE_CODE || 'Malda');
      row._divn = o && o.division ? o.division : (row.DIV_CODE || '');
      row._supp = o && o.ccc ? o.ccc : code;
      return row;
    }

    var VM_ORIGIN = 'https://130.210.43.11.sslip.io';
    function getApiBase() {
      // Direct load from Oracle Cloud VM when deployed on Vercel
      if (location.hostname.includes('vercel.app')) {
        return VM_ORIGIN;
      }
      return '';
    }

    function loadData() {
      $('table').innerHTML = '<div class="ui-empty">Loading unbilled datasets from VM…</div>';

      fetch('/api/unbilled/meta', { credentials: 'same-origin' })
        .then(function (r) {
          if (r.status === 401) { location.replace('/login.html'); return null; }
          return r.ok ? r.json() : null;
        })
        .then(function (m) {
          if (!m) return;
          metaInfo = m;
          updateDateBadge(m.asOn || m.baselineDate);
          if ($('crmSyncBtn')) $('crmSyncBtn').hidden = !(m.canCrmSync || m.canSync);
          if ($('uploadBtn')) $('uploadBtn').hidden = !m.canSync;
        }).catch(function () {});

      var base = getApiBase();
      Promise.all([
        fetch(base + '/api/unbilled/outsort').then(function (r) {
          if (r.status === 401 && !base) { location.replace('/login.html'); throw new Error('Unauthorized'); }
          if (!r.ok) throw new Error('HTTP ' + r.status + ' loading outsort data');
          return r.text();
        }),
        fetch(base + '/api/unbilled/chronic').then(function (r) {
          if (r.status === 401 && !base) { location.replace('/login.html'); throw new Error('Unauthorized'); }
          if (!r.ok) throw new Error('HTTP ' + r.status + ' loading chronic data');
          return r.text();
        }),
        fetch(base + '/api/unbilled/summary').then(function (r) {
          if (r.status === 401 && !base) { location.replace('/login.html'); throw new Error('Unauthorized'); }
          if (!r.ok) throw new Error('HTTP ' + r.status + ' loading summary data');
          return r.text();
        })
      ]).then(function (results) {
        rawOutsort = parseCsv(results[0]).map(setOfficeFields);
        rawChronic = parseCsv(results[1]).map(setOfficeFields);
        rawSummary = parseCsv(results[2]).map(setOfficeFields);

        // Apply Login Scope
        scopedOutsort = window.MzoScope && typeof window.MzoScope.filterRows === 'function' ? window.MzoScope.filterRows(rawOutsort) : rawOutsort;
        scopedChronic = window.MzoScope && typeof window.MzoScope.filterRows === 'function' ? window.MzoScope.filterRows(rawChronic) : rawChronic;
        scopedSummary = window.MzoScope && typeof window.MzoScope.filterRows === 'function' ? window.MzoScope.filterRows(rawSummary) : rawSummary;

        var bDate = (metaInfo && (metaInfo.asOn || metaInfo.baselineDate)) ||
                    (rawOutsort[0] && rawOutsort[0].BASE_LINE_DATE) ||
                    (rawChronic[0] && rawChronic[0].BASE_LINE_DATE) ||
                    (rawSummary[0] && rawSummary[0].BASE_LINE_DATE);
        updateDateBadge(bDate);

        initOffices();

        if (firstData) {
          firstData = false;
          if (scope && scope.level === 'ccc') currentTab = 'outsort';
          else if (scope && scope.level === 'division') currentTab = 'ccc';
          else currentTab = 'region';
        }

        render();
      }).catch(function (err) {
        console.error('Unbilled data load failed:', err);
        $('table').innerHTML = '<div class="ui-empty">Could not load unbilled data. (' + UI.esc(err.message) + ')</div>';
      });
    }

    function filterRows(list) {
      var reg = $('regionFilter').value;
      var div = $('divisionFilter').value;
      var cc = $('cccFilter').value;
      var q = f.q.toLowerCase().trim();
      var mru = f.mru.toLowerCase().trim();

      return list.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (cc && r._supp !== cc && r.CCC_CODE !== cc) return false;
        if (f.cls && r.BASE_CLASS !== f.cls) return false;
        if (mru && String(r.MRU || '').toLowerCase().indexOf(mru) === -1) return false;
        if (q) {
          var hay = [r.CON_ID, r.NAME, r.METER_NO, r.MRU, r.INST_NO, r._supp, r.CCC_CODE].join(' ').toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    }

    function renderFacets() {
      var classes = {};
      [getActiveOutsort(), getActiveChronic(), getActiveSummary()].forEach(function (list) {
        list.forEach(function (r) {
          if (r.BASE_CLASS) {
            var c = String(r.BASE_CLASS).trim();
            classes[c] = (classes[c] || 0) + (r.UNBILLED_COUNT ? +r.UNBILLED_COUNT : 1);
          }
        });
      });
      var clsItems = Object.keys(classes).sort().map(function (c) {
        return { value: c, label: 'Class ' + c + ' (' + UI.n(classes[c]) + ')', count: classes[c] };
      });
      UI.facet('fClass', clsItems, f.cls, function (v) { f.cls = v; render(); });
      setActive((f.type ? 1 : 0) + (f.cls ? 1 : 0) + (f.mru ? 1 : 0) + SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length);
    }

    function renderStats() {
      var outList = filterRows(scopedOutsort);
      var chrList = filterRows(scopedChronic);
      var sumList = filterRows(scopedSummary);

      var totCurrent = sumList.reduce(function (a, r) { return a + (+r.UNBILLED_COUNT || 0); }, 0);
      $('statOutsort').textContent = UI.n(outList.length);
      $('statChronic').textContent = UI.n(chrList.length);
      $('statCurrent').textContent = UI.n(totCurrent);

      var affCccs = {};
      outList.concat(chrList).forEach(function (r) { if (r.CCC_CODE) affCccs[r.CCC_CODE] = 1; });
      $('statOffices').textContent = UI.n(Object.keys(affCccs).length);

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        el.classList.toggle('active', el.getAttribute('data-tab') === currentTab);
      });
    }

    function render() {
      renderFacets();
      renderStats();
      renderActiveChips();

      [].forEach.call(document.querySelectorAll('#tabs .ui-drill-tab'), function (btn) {
        btn.setAttribute('aria-selected', String(btn.getAttribute('data-t') === currentTab));
      });

      if (renderedTab !== currentTab) {
        $('table').__ui = null;
        renderedTab = currentTab;
      }

      if (currentTab === 'region') renderRegionTable();
      else if (currentTab === 'division') renderDivisionTable();
      else if (currentTab === 'ccc') renderCccTable();
      else if (currentTab === 'class') renderClassTable();
      else if (currentTab === 'mru') renderMruTable();
      else if (currentTab === 'outsort') renderOutsortTable();
      else if (currentTab === 'chronic') renderChronicTable();
    }

    function renderActiveChips() {
      var bar = $('rhFiltersBar');
      if (!bar) return;
      var chips = [];
      if (f.type) {
        var typeLabels = { outsort: 'Outsorts', chronic: '3M Unbilled', current: 'Current Month' };
        chips.push({
          label: 'Type: ' + (typeLabels[f.type] || f.type),
          clear: function () {
            f.type = '';
            $('typeFilter').value = '';
            render();
          }
        });
      }
      var reg = $('regionFilter').value; if (reg) chips.push({ label: 'Region: ' + reg, clear: function () { $('regionFilter').value = ''; initOffices(); render(); } });
      var div = $('divisionFilter').value; if (div) chips.push({ label: 'Division: ' + div, clear: function () { $('divisionFilter').value = ''; initOffices(); render(); } });
      var cc = $('cccFilter').value; if (cc) chips.push({ label: 'CCC: ' + cc, clear: function () { $('cccFilter').value = ''; render(); } });
      if (f.cls) chips.push({ label: 'Class: ' + f.cls, clear: function () { f.cls = ''; render(); } });
      if (f.mru) chips.push({ label: 'MRU: ' + f.mru, clear: function () { f.mru = ''; $('mruInput').value = ''; render(); } });
      if (f.q) chips.push({ label: 'Search: ' + f.q, clear: function () { f.q = ''; $('searchInput').value = ''; render(); } });

      if (!chips.length) {
        bar.innerHTML = '<div class="rh-all-clear"><span class="ui-dot ok"></span><span>Showing all records</span></div>';
        return;
      }
      var html = '<div class="rh-filters">';
      chips.forEach(function (c, idx) {

    /* ---------------- office aggregations ---------------- */
    function aggregateOffices(level) {
      var fOut = filterRows(getActiveOutsort());
      var fChr = filterRows(getActiveChronic());
      var fSum = filterRows(getActiveSummary());

      var map = {};
      function getKey(r) {
        if (level === 'region') return r._region || 'Unmapped';
        if (level === 'division') return r._divn || 'Unmapped';
        return r._supp || r.CCC_CODE || 'Unmapped';
      }

      function getEntry(r) {
        var k = getKey(r);
        if (!map[k]) {
          map[k] = {
            name: k,
            code: r.CCC_CODE || '',
            reg: r._region || '',
            divn: r._divn || '',
            outsort: 0,
            chronic: 0,
            current: 0,
            total: 0
          };
        }
        return map[k];
      }

      fSum.forEach(function (r) {
        var e = getEntry(r);
        var count = (+r.UNBILLED_COUNT || 0);
        e.current += count;
        e.total += count;
      });

      fOut.forEach(function (r) {
        var e = getEntry(r);
        e.outsort++;
        e.total++;
      });

      fChr.forEach(function (r) {
        var e = getEntry(r);
        e.chronic++;
        e.total++;
      });

      var list = Object.values(map);
      var grandTotal = list.reduce(function (a, r) { return a + r.total; }, 0);
      var max = Math.max.apply(null, list.map(function (r) { return r.total; }).concat([0]));
      list.forEach(function (r) {
        r.share = grandTotal ? (r.total / grandTotal * 100) : 0;
      });
      return { list: list, grandTotal: grandTotal, max: max };
    }

          headers: { 'Content-Type': 'application/json', Accept: 'application/json' }
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            b.disabled = false; b.classList.remove('spin');
            if (res.status === 'success') {
              stBar.style.width = '100%';
              stText.textContent = res.message || 'Sync & VM upload complete!';
              UI.toast('Unbilled data extracted from DB2 and uploaded to VM!');
              setTimeout(function () { st.hidden = true; loadData(); }, 1200);
            } else {
              st.hidden = true;
              if (res.message && res.message.includes('DbVisualizer')) {
                if (confirm(res.message + '\n\nWould you like to open the Upload window to upload the CSV files directly to the VM?')) {
                  openUploadModal();
                }
              } else {
                alert('DB2 Sync note: ' + (res.message || 'Unknown error'));
              }
            }
          })
          .catch(function (err) {
            b.disabled = false; b.classList.remove('spin');
            st.hidden = true;
            alert('DB2 Sync error: ' + err.message);
          });
      });
    }

    /* ---------- VM Upload Modal ---------- */
    var uploadModal = $('uploadModal');
    var uploadBtn = $('uploadBtn');
    var modalCloseBtn = $('modalCloseBtn');
    var modalCancelBtn = $('modalCancelBtn');
    var uploadForm = $('uploadForm');
    var modalStatus = $('modalStatus');
    var modalSubmitBtn = $('modalSubmitBtn');

    function openUploadModal() {
      if (uploadModal) uploadModal.classList.add('active');
      if (modalStatus) { modalStatus.style.display = 'none'; modalStatus.textContent = ''; }
      if (uploadForm) uploadForm.reset();
    }
    function closeUploadModal() {
      if (uploadModal) uploadModal.classList.remove('active');
    }

    if (uploadBtn) uploadBtn.addEventListener('click', openUploadModal);
    if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeUploadModal);
    if (modalCancelBtn) modalCancelBtn.addEventListener('click', closeUploadModal);

    if (uploadModal) {
      uploadModal.addEventListener('click', function (e) {
        if (e.target === uploadModal) closeUploadModal();
      });
    }

    if (uploadForm) {
      uploadForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var f1 = $('fOutsort').files[0];
        var f2 = $('fChronic').files[0];
        var f3 = $('fSummary').files[0];
        var fAuto = $('fAuto').files[0];

        if (!f1 && !f2 && !f3 && !fAuto) {
          alert('Please select at least one CSV file to upload.');
          return;
        }

        var formData = new FormData();
        if (f1) formData.append('outsort', f1);
        if (f2) formData.append('chronic', f2);
        if (f3) formData.append('summary', f3);
        if (fAuto) formData.append('file', fAuto);

        modalSubmitBtn.disabled = true;
        modalSubmitBtn.textContent = 'Uploading...';
        modalStatus.style.display = 'block';
        modalStatus.textContent = 'Uploading CSV files directly to Oracle Cloud VM...';

        fetch('/api/unbilled/upload', {
          method: 'POST',
          credentials: 'same-origin',
          body: formData
        })
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, status: r.status, data: data };
            });
          })
          .then(function (res) {
            modalSubmitBtn.disabled = false;
            modalSubmitBtn.textContent = 'Upload Files';
            if (res.ok && res.data.status === 'success') {
              modalStatus.style.display = 'block';
              modalStatus.textContent = res.data.message || 'Upload complete!';
              UI.toast('Unbilled data uploaded directly to VM!');
              setTimeout(function () {
                closeUploadModal();
                loadData();
              }, 1200);
            } else {
              modalStatus.style.display = 'block';
              modalStatus.textContent = 'Upload failed: ' + (res.data.message || 'HTTP ' + res.status);
              alert('Upload failed: ' + (res.data.message || 'HTTP ' + res.status));
            }
          })
          .catch(function (err) {
            modalSubmitBtn.disabled = false;
            modalSubmitBtn.textContent = 'Upload Files';
            modalStatus.style.display = 'block';
            modalStatus.textContent = 'Upload error: ' + err.message;
            alert('Upload error: ' + err.message);
          });
      });
    }

    loadData();
  });
  </script>
</body>
</html>
