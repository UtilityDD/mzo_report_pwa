<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capex advance · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>.ui-grid > .ui-panel { margin-top: 0; } #ageTable td:first-child { white-space: nowrap; }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Capex advance to vendors</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Project, network, document or material" autocomplete="off" /></label>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="unitFilter" aria-label="Unit"><option value="">All units</option></select></span>
      <span class="ui-select"><select id="vendorFilter" aria-label="Vendor"><option value="">All vendors</option></select></span>
      <span class="ui-select"><select id="materialFilter" aria-label="Material"><option value="">All materials</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Outstanding by age"></section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Outstanding by</h2>
          <div class="ui-tabs" role="tablist" id="dimTabs">
            <button type="button" class="ui-tab" role="tab" data-d="division" aria-selected="true">Division</button>
            <button type="button" class="ui-tab" role="tab" data-d="unit">Unit</button>
            <button type="button" class="ui-tab" role="tab" data-d="vendor">Vendor</button>
            <button type="button" class="ui-tab" role="tab" data-d="material">Material</button>
          </div>
        </div>
        <div id="dimTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <section class="ui-panel">
        <div class="ui-panel-h"><h2>Ageing</h2></div>
        <div id="ageTable"></div>
      </section>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Lines <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var URLS = {
      vendors: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTZPn6CB_cHTFVb8S5vpvaBnczj63fYMTI0RVEdMzVcQ8O6XQi5iwTbMp2xa5vsL6zHGWxezWUSehrN/pub?gid=1818971964&single=true&output=csv',
      costcenter: '/data/costcenter.json',
      main: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQI2neSVbvMR4fF910Q0AWUcq02leP-sob8q4f9goT46hgLutCpxCjSL6y6X3s2vYBJRNN7WrFCjE0R/pub?gid=439685010&single=true&output=csv'
    };
    var AGE = [
      { key: 'a0', label: 'Under 6 months', min: 0, max: 180 }, { key: 'a1', label: '6–12 months', min: 181, max: 365 },
      { key: 'a2', label: '12–18 months', min: 366, max: 545 }, { key: 'a3', label: '18–24 months', min: 546, max: 730 },
      { key: 'a4', label: '2–3 years', min: 731, max: 1095 }, { key: 'a5', label: '3–4 years', min: 1096, max: 1460 },
      { key: 'a6', label: '4–5 years', min: 1461, max: 1825 }, { key: 'a7', label: 'Over 5 years', min: 1826, max: Infinity }
    ];
    var OVER = [['', 'Outstanding', 0], ['m6', 'Over 6 months', 180], ['y1', 'Over 1 year', 365], ['y2', 'Over 2 years', 730], ['y3', 'Over 3 years', 1095]];
    var all = [], vendors = {}, cc = {}, f = { q: '', over: '', age: '' }, dim = 'division', asOn = null;

    $('stats').innerHTML = OVER.map(function (o) { return '<button type="button" class="ui-stat" data-k="' + o[0] + '"><div class="k">' + o[1] + '</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>'; }).join('');

    function num(v) { var x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; }
    function unitName(u) { return UI.title(u).replace(/\bCcc\b/g, 'CCC').replace(/\bSs\b/g, 'SS').replace(/\bKv\b/g, 'kV').replace(/\bDtr\b/g, 'DTR'); }
    function regionOf(div) { var H = window.MzoScope && window.MzoScope.HIERARCHY, out = ''; if (H) Object.keys(H).forEach(function (r) { if (H[r].divisions && H[r].divisions[div]) out = r; }); return out; }
    function maps(vText, ccData) {
      vendors = {}; UI.csv(vText || '').forEach(function (v) { if (v.VENDOR_NO && v.NAME) vendors[String(v.VENDOR_NO).trim()] = v.NAME.trim(); });
      cc = {}; (ccData || []).forEach(function (e) { if (e['Cost Cen_Code'] && e['Unit Name'] && e['Division Name']) cc[String(e['Cost Cen_Code']).trim()] = { unit: e['Unit Name'].trim(), division: e['Division Name'].trim() }; });
    }
    function prepare(text) {
      asOn = null;
      all = UI.csv(text).filter(function (r) { return r['Net Balance Value'] !== undefined && (r['Project ID'] || r['Material Code']); }).map(function (r) {
        var m = cc[String(r['Cost Centre'] || '').trim()] || {}, divRaw = m.division || '', div = divRaw.replace(/\s*division$/i, '');
        var unit = m.unit || 'Unknown unit', vcode = String(r.Vendor || '').trim();
        var rd = UI.date(r['Reporting Date']); if (rd && (!asOn || rd > asOn)) asOn = rd;
        var isDiv = /division$/i.test(divRaw);
        var o = {
          value: num(r['Net Balance Value']), qty: num(r['Net Balance Qty']), age: parseInt(String(r['Ageing in Days'] || '0').replace(/,/g, ''), 10) || 0,
          division: div ? (isDiv ? div : UI.title(div)) : 'Unknown', unit: unitName(unit), vendor: vendors[vcode] || 'Unknown vendor (' + vcode + ')', vcode: vcode,
          material: String(r['Material description'] || '').trim() || '—', mcode: String(r['Material Code'] || '').trim(), project: String(r['Project ID'] || '').trim(),
          network: String(r.Network || '').trim(), doc: String(r['Issued Document'] || '').trim(), issued: r['Issued Date'], plant: r.Plant, costCentre: r['Cost Centre']
        };
        o._divn = isDiv ? div : ''; o._region = isDiv ? regionOf(div) : '';
        o._supp = /ccc$/i.test(unit) && window.MzoScope ? (window.MzoScope.cccNameOf(unit.replace(/\s*ccc$/i, '')) || '') : '';
        o.ageKey = AGE.filter(function (a) { return o.age >= a.min && o.age <= a.max; })[0].key;
        return o;
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      fillFilters();
    }

    function uniq(rows, k) { var s = {}; rows.forEach(function (r) { if (r[k] && r.value > 0) s[r[k]] = 1; }); return Object.keys(s).sort(); }
    function fillFilters() {
      var div = $('divisionFilter').value, unit = $('unitFilter').value, ven = $('vendorFilter').value;
      UI.fill('divisionFilter', uniq(all, 'division'), 'All divisions');
      var r1 = all.filter(function (r) { return !div || r.division === div; });
      UI.fill('unitFilter', uniq(r1, 'unit'), 'All units');
      var r2 = r1.filter(function (r) { return !unit || r.unit === unit; });
      UI.fill('vendorFilter', uniq(r2, 'vendor'), 'All vendors');
      var r3 = r2.filter(function (r) { return !ven || r.vendor === ven; });
      UI.fill('materialFilter', uniq(r3, 'material'), 'All materials');
    }
    function base(skipAge) {
      var q = f.q.toLowerCase(), div = $('divisionFilter').value, unit = $('unitFilter').value, ven = $('vendorFilter').value, mat = $('materialFilter').value;
      return all.filter(function (r) {
        return (!div || r.division === div) && (!unit || r.unit === unit) && (!ven || r.vendor === ven) && (!mat || r.material === mat) &&
          (skipAge || !f.age || r.ageKey === f.age) &&
          (!q || r.project.toLowerCase().indexOf(q) !== -1 || r.network.indexOf(q) !== -1 || r.doc.indexOf(q) !== -1 || r.material.toLowerCase().indexOf(q) !== -1 || r.mcode.indexOf(q) !== -1);
      });
    }
    function sum(rows) { var s = 0; for (var i = 0; i < rows.length; i++) s += rows[i].value; return s; }
    function overDays(k) { return OVER.filter(function (o) { return o[0] === k; })[0][2]; }

    function render() {
      var b = base(false), tot = sum(b), min = f.over ? overDays(f.over) : -1, view = b.filter(function (r) { return r.age > min; });
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), d = k ? overDays(k) : -1, rows = b.filter(function (r) { return r.age > d; }), v = sum(rows);
        el.querySelector('.v').textContent = UI.inr(v);
        el.querySelector('.s').textContent = k ? UI.pct(v, tot) + ' · ' + UI.n(rows.length) + ' lines' : UI.n(rows.length) + ' lines';
        el.setAttribute('aria-pressed', String(f.over === k));
      });
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.inr(sum(all)) + ' outstanding';

      var key = { division: 'division', unit: 'unit', vendor: 'vendor', material: 'material' }[dim], g = {};
      view.forEach(function (r) {
        var o = g[r[key]] || (g[r[key]] = { name: r[key], sub: dim === 'unit' ? r.division : dim === 'material' ? r.mcode : dim === 'vendor' ? r.vcode : '', value: 0, y1: 0, n: 0 });
        o.value += r.value; o.n++; if (r.age > 365) o.y1 += r.value;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }).filter(function (x) { return Math.abs(x.value) >= 1; }), vtot = sum(view);
      var max = Math.max.apply(null, list.map(function (x) { return x.value; }).concat([0]));
      UI.table('dimTable', {
        rows: list, sort: { key: 'value', dir: 'desc' }, limit: 40, resetPage: true, count: false, empty: 'Nothing outstanding for these filters.',
        selected: function (x) { return $(dim + 'Filter') && $(dim + 'Filter').value === x.name; },
        columns: [
          { key: 'name', label: { division: 'Division', unit: 'Unit', vendor: 'Vendor', material: 'Material' }[dim], cls: 'wrap', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.sub ? '<span class="sub">' + UI.esc(x.sub) + '</span>' : ''); } },
          { key: 'value', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'y1', label: 'Over 1 year', num: true, fmt: UI.inr, hideSm: true },
          { key: 'n', label: 'Lines', num: true, fmt: UI.n, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.value; }, fmt: function (_, x) { return UI.bar(Math.max(0, x.value), max, UI.pct(x.value, vtot)); }, hideSm: true, width: '24%' }
        ],
        onRow: function (x) { pick(x.name); }
      });

      var ab = base(true).filter(function (r) { return r.age > min; }), atot = sum(ab), amax = 0, arows = AGE.map(function (a) { var rs = ab.filter(function (r) { return r.ageKey === a.key; }), v = sum(rs); if (v > amax) amax = v; return { key: a.key, label: a.label, value: v, n: rs.length }; });
      UI.table('ageTable', {
        rows: arows, count: false, selected: function (x) { return x.key === f.age; },
        columns: [
          { key: 'label', label: 'Age', sortVal: function (x) { return x.key; } },
          { key: 'value', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.value; }, fmt: function (_, x) { return UI.bar(Math.max(0, x.value), amax, UI.pct(x.value, atot)); }, width: '42%' }
        ],
        onRow: function (x) { f.age = f.age === x.key ? '' : x.key; render(); }
      });

      $('listCount').textContent = UI.n(view.length);
      window.__view = view;
      UI.table('listTable', { rows: view, sort: { key: 'value', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No lines match these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.over || f.age || ['divisionFilter', 'unitFilter', 'vendorFilter', 'materialFilter'].some(function (id) { return $(id).value; }));
    }

    var COLS = [
      { key: 'project', label: 'Project', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.network) + '</span>'; } },
      { key: 'material', label: 'Material', cls: 'wrap', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r.mcode) + '</span>'; } },
      { key: 'vendor', label: 'Vendor', cls: 'wrap', hideSm: true },
      { key: 'unit', label: 'Unit', hideSm: true, fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r.division) + '</span>'; } },
      { key: 'qty', label: 'Qty', num: true, hideSm: true, fmt: function (v) { return UI.n(Math.round(v * 1000) / 1000); } },
      { key: 'value', label: 'Value', num: true, fmt: UI.inr, csv: function (r) { return r.value.toFixed(2); } },
      { key: 'age', label: 'Age', num: true, fmt: function (v) { return UI.age(v); }, csv: function (r) { return r.age; } }
    ];
    function detail(r) {
      UI.drawer(r.material, r.unit + ' · ' + r.division, [
        ['Project', r.project], ['Network', r.network], ['Material code', r.mcode], ['Vendor', r.vendor], ['Vendor code', r.vcode], ['Issued document', r.doc],
        ['Issued on', r.issued ? UI.fmtDate(r.issued) : ''], ['Balance qty', String(r.qty)], ['Balance value', '₹' + UI.n(Math.round(r.value))], ['Age', UI.age(r.age) + ' (' + UI.n(r.age) + ' days)'],
        ['Cost centre', r.costCentre], ['Plant', r.plant]
      ]);
    }

    // Row click in a breakdown sets that filter (and moves Division → Unit).
    function pick(name) {
      var id = dim + 'Filter';
      $(id).value = $(id).value === name ? '' : name;
      if (dim === 'division') { $('unitFilter').value = ''; if ($(id).value) setDim('unit', true); }
      fillFilters(); markAll(); render();
    }
    function setDim(d, quiet) {
      dim = d;
      [].forEach.call(document.querySelectorAll('#dimTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-d') === d)); });
      $('dimTable').__ui = null;
      if (!quiet) render();
    }
    function markAll() { ['divisionFilter', 'unitFilter', 'vendorFilter', 'materialFilter'].forEach(function (id) { UI.mark($(id)); }); }

    ['divisionFilter', 'unitFilter', 'vendorFilter', 'materialFilter'].forEach(function (id, i, arr) {
      $(id).addEventListener('change', function () { arr.slice(i + 1).forEach(function (x) { $(x).value = ''; }); fillFilters(); markAll(); render(); });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 180));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.over = f.over === k ? '' : k; render(); });
    $('dimTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setDim(t.getAttribute('data-d')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.over = ''; f.age = ''; $('q').value = '';
      ['divisionFilter', 'unitFilter', 'vendorFilter', 'materialFilter'].forEach(function (id) { $(id).value = ''; });
      fillFilters(); markAll(); setDim('division');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('capex-advance.csv', [{ key: 'project', label: 'Project' }, { key: 'network', label: 'Network' }, { key: 'mcode', label: 'Material code' }, { key: 'material', label: 'Material' }, { key: 'vendor', label: 'Vendor' }, { key: 'doc', label: 'Issued document' }, { key: 'issued', label: 'Issued on' }, { key: 'unit', label: 'Unit' }, { key: 'division', label: 'Division' }, { key: 'qty', label: 'Qty' }].concat(COLS.slice(5)), window.__view || []);
    });

    function hubText(key, url) {
      var hub = window.mzoDataHub;
      var viaHub = hub ? Promise.resolve(hub.get(key)).catch(function () { return null; }) : Promise.resolve(null);
      return viaHub.then(function (d) { return d || fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return /json/.test(r.headers.get('content-type') || '') || /\.json$/.test(url) ? r.json() : r.text(); }); });
    }
    function loadMaps() {
      return Promise.all([hubText('CACHE_VENDORS', URLS.vendors).catch(function () { return ''; }), hubText('CACHE_COSTCENTER', URLS.costcenter).catch(function () { return []; })])
        .then(function (m) { maps(m[0], typeof m[1] === 'string' ? JSON.parse(m[1] || '[]') : m[1]); });
    }
    var mapsP = loadMaps(), first = true;
    UI.refresh('refreshBtn', 'CACHE_CAPEX', function (t) { prepare(t); render(); });
    mapsP.then(function () {
      UI.load('CACHE_CAPEX', function (text, info) {
        if (!text) {
          if (info && info.error) fetch(URLS.main).then(function (r) { return r.text(); }).then(function (t) { prepare(t); render(); })
            .catch(function () { $('meta').textContent = 'Could not load data'; $('listTable').innerHTML = $('dimTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; });
          return;
        }
        prepare(text);
        if (first) { first = false; markAll(); }
        render();
      });
    });
  });
  </script>
</body>
</html>
