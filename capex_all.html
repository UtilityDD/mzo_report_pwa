<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capex advance · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=12" />
  <script src="/mzo_presets_hub.js?v=89"></script>
  <script src="/mzo_ui.js?v=10" defer></script>
  <script src="/mzo_data_hub.js?v=93" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .ui-side-sec-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--mzo-muted); margin-bottom: 6px; }
    .ui-check-group { display: grid; gap: 3px; }
    .ui-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--mzo-text-2);
      cursor: pointer;
      user-select: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .ui-check-label:hover {
      background: var(--mzo-hover);
      color: var(--mzo-text);
    }
    .ui-check-label input[type="checkbox"] {
      accent-color: var(--mzo-accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
      margin: 0;
      flex: none;
    }
    .ui-check-label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ui-check-label small { color: var(--mzo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .sub { display: block; font-size: 11.5px; color: var(--mzo-muted); margin-top: 2px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Capex advance to vendors<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search by project, network, doc, material or vendor" title="Project, network, doc, material or vendor" /></label>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="unitFilter" aria-label="Unit"><option value="">All units</option></select></span>
          <span class="ui-select"><select id="vendorFilter" aria-label="Vendor"><option value="">All vendors</option></select></span>
          <span class="ui-select"><select id="materialFilter" aria-label="Material"><option value="">All materials</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Quick filters</div>
          <div class="ui-check-group">
            <label class="ui-check-label"><input type="checkbox" id="chkOver1y" /><span>Over 1 year old</span><small id="cntOver1y"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkOver2y" /><span>Over 2 years old</span><small id="cntOver2y"></small></label>
            <label class="ui-check-label"><input type="checkbox" id="chkHighVal" /><span>High value (&ge; ₹1 lakh)</span><small id="cntHighVal"></small></label>
          </div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Age of advance">
            <button type="button" role="tab" data-pane="fAge" aria-pressed="true" aria-selected="true">Age bracket</button>
            <button type="button" role="tab" data-pane="fAge2" aria-pressed="false" aria-selected="false">Cumulative</button>
          </div>
          <div aria-label="Age bracket" id="fAge"></div>
          <div aria-label="Age, cumulative" id="fAge2" hidden></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Value slab</div>
          <div aria-label="Value slab" id="fVal"></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-side-sec-title">Unit type</div>
          <div aria-label="Unit type" id="fUnitType"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary"></section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title"><span id="rhTitle">Capex Analysis</span></h2>
                <span class="rh-badge" id="rhCount">Loading…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    var AGE = [
      { key: 'a0', label: 'Under 6 months', min: 0, max: 180, dot: 'ok' },
      { key: 'a1', label: '6–12 months', min: 181, max: 365, dot: 'warn' },
      { key: 'a2', label: '12–18 months', min: 366, max: 545, dot: 'warn' },
      { key: 'a3', label: '18–24 months', min: 546, max: 730, dot: 'warn' },
      { key: 'a4', label: '2–3 years', min: 731, max: 1095, dot: 'bad' },
      { key: 'a5', label: '3–4 years', min: 1096, max: 1460, dot: 'bad' },
      { key: 'a6', label: '4–5 years', min: 1461, max: 1825, dot: 'bad' },
      { key: 'a7', label: 'Over 5 years', min: 1826, max: Infinity, dot: 'bad' }
    ];

    var CUMULATIVE_AGE = [
      { key: 'c_m6', label: 'Over 6 months', min: 181, dot: 'warn' },
      { key: 'c_y1', label: 'Over 1 year', min: 366, dot: 'bad' },
      { key: 'c_y2', label: 'Over 2 years', min: 731, dot: 'bad' },
      { key: 'c_y3', label: 'Over 3 years', min: 1096, dot: 'bad' },
      { key: 'c_y5', label: 'Over 5 years', min: 1826, dot: 'bad' }
    ];

    var VALUE_SLABS = [
      { key: 'v_high', label: 'Above ₹10 lakh', min: 1000000, max: Infinity },
      { key: 'v_mid', label: '₹2 lakh – ₹10 lakh', min: 200000, max: 1000000 },
      { key: 'v_low', label: '₹50,000 – ₹2 lakh', min: 50000, max: 200000 },
      { key: 'v_micro', label: 'Below ₹50,000', min: -Infinity, max: 50000 }
    ];

    var UNIT_TYPES = [
      { key: 'CCC', label: 'CCC' },
      { key: 'Division', label: 'Division office' },
      { key: 'Store', label: 'Store' },
      { key: 'Sub-station', label: 'Sub-station' },
      { key: 'Other', label: 'Other unit' }
    ];

    var KPI_STATS = [
      { key: '', label: 'Total outstanding', test: function () { return true; } },
      { key: 'm6', label: 'Over 6 months', dot: 'warn', test: function (r) { return r.age > 180; } },
      { key: 'y1', label: 'Over 1 year', dot: 'bad', test: function (r) { return r.age > 365; } },
      { key: 'y2', label: 'Over 2 years', dot: 'bad', test: function (r) { return r.age > 730; } },
      { key: 'y3', label: 'Over 3 years', dot: 'bad', test: function (r) { return r.age > 1095; } },
      { key: 'high', label: 'Above ₹5 lakh', test: function (r) { return r.value >= 500000; } }
    ];

    var KPI_MAP = {};
    KPI_STATS.forEach(function (k) { KPI_MAP[k.key] = k; });

    var CUM_MAP = {};
    var CUM_DOTS = {};
    CUMULATIVE_AGE.forEach(function (c) {
      CUM_MAP[c.key] = function (r) { return r.age >= c.min; };
      CUM_DOTS[c.label] = c.dot;
    });

    var AGE_DOTS = {};
    AGE.forEach(function (a) { AGE_DOTS[a.label] = a.dot; });

    var TABS = [
      ['division', 'Division'],
      ['unit', 'Unit'],
      ['vendor', 'Vendor'],
      ['material', 'Material'],
      ['age', 'Age bracket'],
      ['age2', 'Cumulative age'],
      ['value', 'Value slab'],
      ['lines', 'Lines']
    ];

    var all = [], vendors = {}, cc = {}, asOn = null, scope = null, firstData = true;
    var tab = 'division', renderedTab = '', lastTable = null, lastList = null, openRow = null;

    var f = {
      q: '', kpi: '', age: '', age2: '', val: '', unitType: '',
      chkOver1y: false, chkOver2y: false, chkHighVal: false
    };

    var SELECTS = ['divisionFilter', 'unitFilter', 'vendorFilter', 'materialFilter'];

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    $('stats').innerHTML = KPI_STATS.map(function (o) {
      return '<button type="button" class="ui-stat" data-k="' + o.key + '">' +
        '<div class="k">' + (o.dot ? '<span class="ui-dot ' + o.dot + '"></span>' : '') + UI.esc(o.label) + '</div>' +
        '<div class="v"><span class="ui-skel"></span></div>' +
        '<div class="s">&nbsp;</div>' +
        '</button>';
    }).join('');

    function unitName(u) {
      return UI.title(u).replace(/\bCcc\b/g, 'CCC').replace(/\bSs\b/g, 'SS').replace(/\bKv\b/g, 'kV').replace(/\bDtr\b/g, 'DTR');
    }

    function regionOf(div) {
      var H = window.MzoScope && window.MzoScope.HIERARCHY, out = '';
      if (H) Object.keys(H).forEach(function (r) { if (H[r].divisions && H[r].divisions[div]) out = r; });
      return out;
    }

    function maps(vt, ct) {
      vendors = {};
      (vt ? vt.rows : []).forEach(function (v) { if (v.vendor_no && v.name) vendors[v.vendor_no] = v.name; });
      cc = {};
      (ct ? ct.rows : []).forEach(function (e) {
        if (e.cost_cen_code && e.unit_name && e.division_name) cc[e.cost_cen_code] = { unit: e.unit_name, division: e.division_name };
      });
    }

    function line(r) { return r.project_id || r.material_code; }

    function prepare(t) {
      asOn = null;
      var hasValue = t.columns.some(function (c) { return c.name === 'net_balance_value' && c.source_name; });
      if (hasValue) {
        t.all.forEach(function (r) {
          var rd = line(r) ? UI.date(r.reporting_date) : null;
          if (rd && (!asOn || rd > asOn)) asOn = rd;
        });
      }
      all = (hasValue ? t.rows : []).filter(line).map(function (r) {
        var m = cc[r.cost_centre] || {}, divRaw = m.division || '', div = divRaw.replace(/\s*division$/i, '');
        if (r._division) { div = r._division; divRaw = r._division + ' Division'; }
        if (r._ccc && m.unit) m = { unit: r._ccc + ' CCC', division: m.division };
        var unit = m.unit || 'Unknown unit', vcode = r.vendor;
        var isDiv = /division$/i.test(divRaw);
        var uTitle = unitName(unit);
        var age = Math.trunc(r.ageing_in_days || 0);
        var val = r.net_balance_value || 0;
        var ab = AGE.filter(function (a) { return age >= a.min && age <= a.max; })[0] || AGE[0];
        var vs = VALUE_SLABS.filter(function (s) { return val >= s.min && val < s.max; })[0] || VALUE_SLABS[VALUE_SLABS.length - 1];
        var uType = /ccc$/i.test(uTitle) ? 'CCC' : /store/i.test(uTitle) ? 'Store' : /(ss|sub[- ]?station|kv)/i.test(uTitle) ? 'Sub-station' : /division/i.test(uTitle) ? 'Division' : 'Other';

        var o = {
          value: val, qty: r.net_balance_qty || 0, age: age,
          division: div ? (isDiv ? div : UI.title(div)) : 'Unknown', unit: uTitle,
          vendor: vendors[vcode] || 'Unknown vendor (' + vcode + ')', vcode: vcode,
          material: r.material_description || '—', mcode: r.material_code || '',
          project: r.project_id || '', network: r.network || '', doc: r.issued_document || '',
          issued: r.issued_date, plant: r.plant || '', costCentre: r.cost_centre || '',
          ageKey: ab.key, ageLabel: ab.label, valKey: vs.key, valLabel: vs.label, unitType: uType
        };
        o._divn = isDiv ? div : '';
        o._region = isDiv ? regionOf(div) : '';
        o._supp = /ccc$/i.test(unit) && window.MzoScope ? (window.MzoScope.cccNameOf(unit.replace(/\s*ccc$/i, '')) || '') : '';
        return o;
      });
      fillFilters();
    }

    function uniq(rows, k) {
      var s = {};
      rows.forEach(function (r) { if (r[k] && r.value > 0) s[r[k]] = 1; });
      return Object.keys(s).sort();
    }

    function fillFilters() {
      var div = $('divisionFilter').value, unit = $('unitFilter').value, ven = $('vendorFilter').value;
      UI.fill('divisionFilter', uniq(all, 'division'), 'All divisions');
      var r1 = all.filter(function (r) { return !div || r.division === div; });
      UI.fill('unitFilter', uniq(r1, 'unit'), 'All units');
      var r2 = r1.filter(function (r) { return !unit || r.unit === unit; });
      UI.fill('vendorFilter', uniq(r2, 'vendor'), 'All vendors');
      var r3 = r2.filter(function (r) { return !ven || r.vendor === ven; });
      UI.fill('materialFilter', uniq(r3, 'material'), 'All materials');
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }

    function filtered(skip) {
      var q = f.q.toLowerCase(), v = function (id) { return $(id).value; };
      return all.filter(function (r) {
        if (v('divisionFilter') && r.division !== v('divisionFilter')) return false;
        if (v('unitFilter') && r.unit !== v('unitFilter')) return false;
        if (v('vendorFilter') && r.vendor !== v('vendorFilter')) return false;
        if (v('materialFilter') && r.material !== v('materialFilter')) return false;

        if (skip !== 'checkboxes') {
          if (f.chkOver1y && r.age <= 365) return false;
          if (f.chkOver2y && r.age <= 730) return false;
          if (f.chkHighVal && r.value < 100000) return false;
        }

        if (skip !== 'age' && f.age && r.ageKey !== f.age) return false;
        if (skip !== 'age2' && f.age2 && CUM_MAP[f.age2] && !CUM_MAP[f.age2](r)) return false;
        if (skip !== 'val' && f.val && r.valKey !== f.val) return false;
        if (skip !== 'unitType' && f.unitType && r.unitType !== f.unitType) return false;

        if (q && r.project.toLowerCase().indexOf(q) === -1 &&
            r.network.toLowerCase().indexOf(q) === -1 &&
            r.doc.toLowerCase().indexOf(q) === -1 &&
            r.material.toLowerCase().indexOf(q) === -1 &&
            r.mcode.toLowerCase().indexOf(q) === -1 &&
            r.vendor.toLowerCase().indexOf(q) === -1 &&
            r.vcode.toLowerCase().indexOf(q) === -1) return false;

        return true;
      });
    }

    function renderFacets() {
      // Quick checkboxes counts
      var baseNoChk = filtered('checkboxes');
      var c1y = baseNoChk.filter(function (r) { return r.age > 365; }).length;
      var c2y = baseNoChk.filter(function (r) { return r.age > 730; }).length;
      var cHigh = baseNoChk.filter(function (r) { return r.value >= 100000; }).length;
      $('cntOver1y').textContent = c1y ? UI.n(c1y) : '';
      $('cntOver2y').textContent = c2y ? UI.n(c2y) : '';
      $('cntHighVal').textContent = cHigh ? UI.n(cHigh) : '';

      // Age bracket facet
      var rowsAge = filtered('age');
      UI.facet('fAge', AGE.map(function (a) {
        return {
          value: a.key,
          label: a.label,
          count: rowsAge.filter(function (r) { return r.ageKey === a.key; }).length,
          dot: a.dot
        };
      }), f.age, function (v) { f.age = v; render(); });

      // Cumulative age facet
      var rowsAge2 = filtered('age2');
      UI.facet('fAge2', CUMULATIVE_AGE.map(function (c) {
        return {
          value: c.key,
          label: c.label,
          count: rowsAge2.filter(CUM_MAP[c.key]).length,
          dot: c.dot
        };
      }), f.age2, function (v) { f.age2 = v; render(); });

      // Value slab facet
      var rowsVal = filtered('val');
      UI.facet('fVal', VALUE_SLABS.map(function (s) {
        return {
          value: s.key,
          label: s.label,
          count: rowsVal.filter(function (r) { return r.valKey === s.key; }).length
        };
      }), f.val, function (v) { f.val = v; render(); });

      // Unit type facet
      var rowsType = filtered('unitType');
      UI.facet('fUnitType', UNIT_TYPES.map(function (u) {
        return {
          value: u.key,
          label: u.label,
          count: rowsType.filter(function (r) { return r.unitType === u.key; }).length
        };
      }), f.unitType, function (v) { f.unitType = v; render(); });

      var active = (f.q ? 1 : 0) +
        (f.chkOver1y ? 1 : 0) + (f.chkOver2y ? 1 : 0) + (f.chkHighVal ? 1 : 0) +
        (f.age ? 1 : 0) + (f.age2 ? 1 : 0) + (f.val ? 1 : 0) + (f.unitType ? 1 : 0) +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;

      setActive(active, { fAge: f.age, fAge2: f.age2 });
    }

    function render() {
      var b = filtered(null);
      renderFacets();

      var totVal = b.reduce(function (a, r) { return a + r.value; }, 0);
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        var kpiDef = KPI_MAP[k] || KPI_MAP[''];
        var rows = b.filter(kpiDef.test);
        var sVal = rows.reduce(function (a, r) { return a + r.value; }, 0);
        el.querySelector('.v').textContent = UI.inr(sVal);
        el.querySelector('.s').textContent = k === ''
          ? UI.n(rows.length) + ' lines'
          : UI.pct(sVal, totVal) + ' · ' + UI.n(rows.length) + ' lines';
        el.setAttribute('aria-pressed', String(f.kpi === k));
      });

      if (asOn) $('asOn').textContent = 'As on ' + UI.fmtDate(asOn);
      else $('asOn').textContent = UI.inr(all.reduce(function (a, r) { return a + r.value; }, 0));

      var view = f.kpi && KPI_MAP[f.kpi] ? b.filter(KPI_MAP[f.kpi].test) : b;

      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'lines' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';
      var hintText = (kpiTitle ? 'Showing ' + kpiTitle.toLowerCase() + ' only. ' : '') +
        (tab === 'age2' ? 'Cumulative: an advance line can sit in more than one row.' : '');
      $('hint').textContent = hintText;

      renderReportHead(view);
      renderTab(view);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
      var kpiTitle = f.kpi && KPI_MAP[f.kpi] ? KPI_MAP[f.kpi].label : '';

      $('rhTitle').textContent = tabLabel + (kpiTitle ? ' · ' + kpiTitle : '');

      var viewVal = view.reduce(function (a, r) { return a + r.value; }, 0);
      var allVal = all.reduce(function (a, r) { return a + r.value; }, 0);

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.inr(allVal) + '</b> · ' + UI.n(all.length) + ' lines';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.inr(viewVal) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(viewVal, allVal) + ')</span> · ' + UI.n(view.length) + ' of ' + UI.n(all.length) + ' lines';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('divisionFilter').value && !$('divisionFilter').disabled) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { $('divisionFilter').value = ''; $('unitFilter').value = ''; fillFilters(); } });
      }
      if ($('unitFilter').value && !$('unitFilter').disabled) {
        currentActiveFilters.push({ label: 'Unit', value: $('unitFilter').value, clear: function () { $('unitFilter').value = ''; fillFilters(); } });
      }
      if ($('vendorFilter').value && !$('vendorFilter').disabled) {
        currentActiveFilters.push({ label: 'Vendor', value: UI.title($('vendorFilter').value), clear: function () { $('vendorFilter').value = ''; UI.mark($('vendorFilter')); } });
      }
      if ($('materialFilter').value && !$('materialFilter').disabled) {
        currentActiveFilters.push({ label: 'Material', value: $('materialFilter').value, clear: function () { $('materialFilter').value = ''; UI.mark($('materialFilter')); } });
      }
      if (f.chkOver1y) {
        currentActiveFilters.push({ label: 'Quick', value: '> 1 year old', clear: function () { f.chkOver1y = false; $('chkOver1y').checked = false; } });
      }
      if (f.chkOver2y) {
        currentActiveFilters.push({ label: 'Quick', value: '> 2 years old', clear: function () { f.chkOver2y = false; $('chkOver2y').checked = false; } });
      }
      if (f.chkHighVal) {
        currentActiveFilters.push({ label: 'Quick', value: 'High value (≥ ₹1L)', clear: function () { f.chkHighVal = false; $('chkHighVal').checked = false; } });
      }
      if (f.age) {
        var ab = AGE_BRACKETS.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Age', value: ab ? ab.label : f.age, clear: function () { f.age = ''; } });
      }
      if (f.age2) {
        var ca = CUMULATIVE_AGE.filter(function (x) { return x.key === f.age2; })[0];
        currentActiveFilters.push({ label: 'Cumulative age', value: ca ? ca.label : f.age2, clear: function () { f.age2 = ''; } });
      }
      if (f.val) {
        var vs = VALUE_SLABS.filter(function (x) { return x.key === f.val; })[0];
        currentActiveFilters.push({ label: 'Value slab', value: vs ? vs.label : f.val, clear: function () { f.val = ''; } });
      }
      if (f.unitType) {
        var ut = UNIT_TYPES.filter(function (x) { return x.key === f.unitType; })[0];
        currentActiveFilters.push({ label: 'Unit type', value: ut ? ut.label : f.unitType, clear: function () { f.unitType = ''; } });
      }
      if (f.kpi && KPI_MAP[f.kpi]) {
        currentActiveFilters.push({ label: 'KPI', value: KPI_MAP[f.kpi].label, clear: function () { f.kpi = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    function groupTable(view, keyFn, label, order, dots, subKeyFn, onRowAction) {
      var groups = {}, totalVal = 0, totalLines = view.length;
      view.forEach(function (r) {
        var k = keyFn(r);
        if (k == null) return;
        (Array.isArray(k) ? k : [k]).forEach(function (kk) {
          var g = groups[kk] || (groups[kk] = { name: kk, sub: subKeyFn ? subKeyFn(r) : '', value: 0, y1: 0, y2: 0, n: 0, qty: 0 });
          g.value += r.value;
          g.n++;
          g.qty += (r.qty || 0);
          if (r.age > 365) g.y1 += r.value;
          if (r.age > 730) g.y2 += r.value;
        });
        totalVal += r.value;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      if (order) {
        list.sort(function (a, b) {
          var ia = order.indexOf(a.name), ib = order.indexOf(b.name);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });
      }
      var max = Math.max.apply(null, list.map(function (g) { return g.value; }).concat([0]));
      lastTable = {
        title: label,
        cols: [label, 'Outstanding', 'Over 1 year', 'Lines', '% Share'],
        rows: list.map(function (g) {
          return [g.name + (g.sub ? ' (' + g.sub + ')' : ''), Math.round(g.value), Math.round(g.y1), g.n, UI.pct(g.value, totalVal)];
        })
      };
      return {
        rows: list,
        sort: order ? null : { key: 'value', dir: 'desc' },
        count: false,
        empty: 'Nothing outstanding for these filters.',
        columns: [
          {
            key: 'name',
            label: label,
            cls: 'wrap',
            fmt: function (v, g) {
              return (dots && dots[v] ? '<span class="ui-dot ' + dots[v] + '" style="margin-right:8px"></span>' : '') +
                '<span class="ui-strong">' + UI.esc(v) + '</span>' +
                (g.sub ? '<span class="sub">' + UI.esc(g.sub) + '</span>' : '');
            }
          },
          { key: 'value', label: 'Outstanding', num: true, fmt: UI.inr },
          { key: 'y1', label: 'Over 1 year', num: true, fmt: UI.inr, hideSm: true },
          { key: 'n', label: 'Lines', num: true, fmt: UI.n },
          {
            key: 'share',
            label: '% Share',
            sortVal: function (g) { return g.value; },
            fmt: function (_, g) { return UI.bar(Math.max(0, g.value), max, UI.pct(g.value, totalVal)); },
            width: '26%'
          }
        ],
        foot: list.length > 1 && !order ? {
          name: 'Total',
          value: totalVal,
          y1: view.reduce(function (a, r) { return a + (r.age > 365 ? r.value : 0); }, 0),
          n: totalLines,
          share: 0
        } : null,
        onRow: onRowAction
      };
    }

    function renderTab(view) {
      var cfg;
      lastList = null;

      if (tab === 'division') {
        cfg = groupTable(view, function (r) { return r.division || 'Unknown'; }, 'Division', null, null, null, function (g) {
          $('divisionFilter').value = g.name;
          fillFilters();
          tab = 'unit';
          render();
        });
      } else if (tab === 'unit') {
        cfg = groupTable(view, function (r) { return r.unit || 'Unknown'; }, 'Unit', null, null, function (r) { return r.division; }, function (g) {
          $('unitFilter').value = g.name;
          fillFilters();
          tab = 'lines';
          render();
        });
      } else if (tab === 'vendor') {
        cfg = groupTable(view, function (r) { return r.vendor || 'Unknown'; }, 'Vendor', null, null, function (r) { return r.vcode; }, function (g) {
          $('vendorFilter').value = g.name;
          fillFilters();
          tab = 'lines';
          render();
        });
      } else if (tab === 'material') {
        cfg = groupTable(view, function (r) { return r.material || '—'; }, 'Material', null, null, function (r) { return r.mcode; }, function (g) {
          $('materialFilter').value = g.name;
          fillFilters();
          tab = 'lines';
          render();
        });
      } else if (tab === 'age') {
        var ageOrder = AGE.map(function (a) { return a.label; });
        cfg = groupTable(view, function (r) { return r.ageLabel; }, 'Age bracket', ageOrder, AGE_DOTS, null, function (g) {
          var matched = AGE.filter(function (a) { return a.label === g.name; })[0];
          if (matched) f.age = matched.key;
          tab = 'lines';
          render();
        });
      } else if (tab === 'age2') {
        var cumList = CUMULATIVE_AGE.map(function (c) {
          var rows = view.filter(CUM_MAP[c.key]);
          var val = rows.reduce(function (a, r) { return a + r.value; }, 0);
          return { key: c.key, name: c.label, value: val, n: rows.length, dot: c.dot };
        });
        var totVal = view.reduce(function (a, r) { return a + r.value; }, 0);
        lastTable = {
          title: 'Cumulative Age',
          cols: ['Age threshold', 'Outstanding', 'Lines', '% of Total'],
          rows: cumList.map(function (g) { return [g.name, Math.round(g.value), g.n, UI.pct(g.value, totVal)]; })
        };
        cfg = {
          rows: cumList,
          count: false,
          columns: [
            {
              key: 'name',
              label: 'Age threshold',
              fmt: function (v, g) {
                return (g.dot ? '<span class="ui-dot ' + g.dot + '" style="margin-right:8px"></span>' : '') +
                  '<span class="ui-strong">' + UI.esc(v) + '</span>';
              }
            },
            { key: 'value', label: 'Outstanding', num: true, fmt: UI.inr },
            { key: 'n', label: 'Lines', num: true, fmt: UI.n },
            {
              key: 'share',
              label: '% of Total',
              sortVal: function (g) { return g.value; },
              fmt: function (_, g) { return UI.bar(Math.max(0, g.value), totVal, UI.pct(g.value, totVal)); },
              width: '35%'
            }
          ],
          onRow: function (g) {
            f.age2 = g.key;
            tab = 'lines';
            render();
          }
        };
      } else if (tab === 'value') {
        var valOrder = VALUE_SLABS.map(function (s) { return s.label; });
        cfg = groupTable(view, function (r) { return r.valLabel; }, 'Value slab', valOrder, null, null, function (g) {
          var matched = VALUE_SLABS.filter(function (s) { return s.label === g.name; })[0];
          if (matched) f.val = matched.key;
          tab = 'lines';
          render();
        });
      } else if (tab === 'lines') {
        lastList = view;
        lastTable = {
          title: 'Advance Lines',
          cols: ['Project', 'Network', 'Material Code', 'Material', 'Vendor', 'Vendor Code', 'Unit', 'Division', 'Qty', 'Value', 'Age (Days)'],
          rows: view.slice().sort(function (a, b) { return b.value - a.value; }).map(function (r) {
            return [r.project, r.network, r.mcode, r.material, r.vendor, r.vcode, r.unit, r.division, r.qty, Math.round(r.value), r.age];
          })
        };
        cfg = {
          rows: view,
          sort: { key: 'value', dir: 'desc' },
          limit: 50,
          resetPage: true,
          empty: 'No lines match these filters.',
          columns: [
            {
              key: 'project',
              label: 'Project',
              fmt: function (v, r) {
                return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.network || '') + '</span>';
              }
            },
            {
              key: 'material',
              label: 'Material',
              cls: 'wrap',
              fmt: function (v, r) {
                return UI.esc(v) + '<span class="sub">' + UI.esc(r.mcode) + '</span>';
              }
            },
            {
              key: 'vendor',
              label: 'Vendor',
              cls: 'wrap',
              hideSm: true,
              fmt: function (v, r) {
                return UI.esc(v) + '<span class="sub">' + UI.esc(r.vcode) + '</span>';
              }
            },
            {
              key: 'unit',
              label: 'Unit',
              hideSm: true,
              fmt: function (v, r) {
                return UI.esc(v) + '<span class="sub">' + UI.esc(r.division) + '</span>';
              }
            },
            {
              key: 'qty',
              label: 'Qty',
              num: true,
              hideSm: true,
              fmt: function (v) { return UI.n(Math.round(v * 1000) / 1000); }
            },
            {
              key: 'value',
              label: 'Value',
              num: true,
              fmt: UI.inr,
              csv: function (r) { return r.value.toFixed(2); }
            },
            {
              key: 'age',
              label: 'Age',
              num: true,
              fmt: function (v) {
                return '<span class="' + (v > 730 ? 'ui-delta bad' : v > 365 ? 'ui-delta warn' : '') + '">' + UI.age(v) + '</span>';
              },
              csv: function (r) { return r.age; }
            }
          ],
          onRow: detail
        };
      }

      if (renderedTab !== tab) {
        $('table').__ui = null;
        renderedTab = tab;
      }
      UI.table('table', cfg);
    }

    function detail(r) {
      openRow = r;
      UI.drawer(r.material, r.unit + ' · ' + r.division, [
        ['Project', r.project],
        ['Network', r.network],
        ['Material code', r.mcode],
        ['Material', r.material],
        ['Vendor', r.vendor],
        ['Vendor code', r.vcode],
        ['Issued document', r.doc],
        ['Issued on', r.issued ? UI.fmtDate(r.issued) : '—'],
        ['Balance qty', UI.n(r.qty)],
        ['Balance value', UI.inr(r.value) + ' (₹' + UI.n(Math.round(r.value)) + ')'],
        ['Age', UI.age(r.age) + ' (' + UI.n(r.age) + ' days)'],
        ['Age bracket', r.ageLabel || '—'],
        ['Cost centre', r.costCentre],
        ['Plant', r.plant]
      ], '', '<button type="button" class="ui-btn sm" data-copy-detail><svg class="ui-i"><use href="#ui-copy"/></svg>Copy details</button>');
    }

    function copyDetail(r) {
      UI.copy([
        'Project: ' + (r.project || '—'),
        'Network: ' + (r.network || '—'),
        'Material: ' + r.material + ' (' + r.mcode + ')',
        'Vendor: ' + r.vendor + ' (' + r.vcode + ')',
        'Unit: ' + r.unit + ' (' + r.division + ')',
        'Document: ' + (r.doc || '—'),
        'Issued on: ' + (r.issued ? UI.fmtDate(r.issued) : '—'),
        'Balance Qty: ' + r.qty,
        'Balance Value: ₹' + UI.n(Math.round(r.value)),
        'Age: ' + r.age + ' days (' + UI.age(r.age) + ')',
        'Cost Centre: ' + (r.costCentre || '—'),
        'Plant: ' + (r.plant || '—')
      ].join('\n')).then(function () { UI.toast('Advance details copied'); });
    }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-copy-detail]');
      if (b && openRow) copyDetail(openRow);
    });

    function clearAll() {
      f.q = ''; f.kpi = ''; f.age = ''; f.age2 = ''; f.val = ''; f.unitType = '';
      f.chkOver1y = false; f.chkOver2y = false; f.chkHighVal = false;
      $('q').value = '';
      $('chkOver1y').checked = false;
      $('chkOver2y').checked = false;
      $('chkHighVal').checked = false;
      SELECTS.forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillFilters();
      tab = 'division';
      render();
    }

    SELECTS.forEach(function (id, i, arr) {
      $(id).addEventListener('change', function () {
        arr.slice(i + 1).forEach(function (x) { if (!$(x).disabled) $(x).value = ''; });
        fillFilters();
        render();
      });
    });

    ['chkOver1y', 'chkOver2y', 'chkHighVal'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        f[id] = this.checked;
        render();
      });
    });

    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      render();
    }, 180));

    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var k = s.getAttribute('data-k');
      f.kpi = (f.kpi === k ? '' : k);
      render();
    });

    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-t');
      render();
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var x = e.target.closest('[data-rh-clear]');
      if (x) {
        var idx = +x.getAttribute('data-rh-clear');
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });

    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = [lastTable.cols.join('\t')].concat(lastTable.rows.map(function (row) { return row.join('\t'); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied to clipboard'); });
    });

    $('exportBtn').addEventListener('click', function () {
      if (tab === 'lines') {
        UI.exportCsv('capex-advance-lines.csv', [
          { key: 'project', label: 'Project' },
          { key: 'network', label: 'Network' },
          { key: 'mcode', label: 'Material code' },
          { key: 'material', label: 'Material' },
          { key: 'vendor', label: 'Vendor' },
          { key: 'vcode', label: 'Vendor code' },
          { key: 'doc', label: 'Issued document' },
          { key: 'issued', label: 'Issued on' },
          { key: 'unit', label: 'Unit' },
          { key: 'division', label: 'Division' },
          { key: 'qty', label: 'Qty' },
          { key: 'value', label: 'Value (INR)' },
          { key: 'age', label: 'Age (Days)' },
          { key: 'costCentre', label: 'Cost centre' },
          { key: 'plant', label: 'Plant' }
        ], lastList || []);
      } else if (lastTable) {
        var csvCols = lastTable.cols.map(function (c, idx) { return { key: 'c' + idx, label: c }; });
        var csvRows = lastTable.rows.map(function (r) {
          var obj = {};
          r.forEach(function (val, idx) { obj['c' + idx] = val; });
          return obj;
        });
        UI.exportCsv('capex-advance-' + tab + '.csv', csvCols, csvRows);
      }
    });

    function fromUrlParams() {
      var p = new URLSearchParams(window.location.search);
      if (p.has('division')) { $('divisionFilter').value = p.get('division'); }
      if (p.has('unit')) { $('unitFilter').value = p.get('unit'); }
      if (p.has('vendor')) { $('vendorFilter').value = p.get('vendor'); }
      if (p.has('material')) { $('materialFilter').value = p.get('material'); }
      if (p.has('q')) { f.q = p.get('q'); $('q').value = f.q; }
      if (p.has('kpi')) { f.kpi = p.get('kpi'); }
      if (p.has('age')) { f.age = p.get('age'); }
      if (p.has('tab')) { tab = p.get('tab'); }
      fillFilters();
    }

    var KEYS = ['vendor_map', 'costcenter', 'capex_details'], got = {};
    function paint() {
      if (!KEYS.every(function (k) { return k in got; })) return;
      if (!got.capex_details) {
        $('asOn').textContent = 'Could not load data';
        $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
        return;
      }
      maps(got.vendor_map, got.costcenter);
      prepare(got.capex_details);
      if (firstData) {
        firstData = false;
        fromUrlParams();
      }
      render();
    }

    MzoRows.refresh('refreshBtn', 'capex_details', function (t) { got.capex_details = t; paint(); });
    KEYS.forEach(function (k) {
      MzoRows.load(k, function (t) { got[k] = t || got[k] || null; paint(); }, { scope: k === 'capex_details' });
    });
  });
  </script>
</body>
</html>
