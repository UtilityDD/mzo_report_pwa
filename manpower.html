<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manpower · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <style>
    .gate { min-height: 70vh; display: grid; place-items: center; }
    .gate form { width: min(340px, 100%); background: var(--mzo-surface); border: 1px solid var(--mzo-border); border-radius: 12px; padding: 24px; }
    .gate h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .gate p { margin: 4px 0 16px; color: var(--mzo-muted); font-size: 13px; }
    .gate .ui-input { width: 100%; padding: 0 12px; height: 36px; letter-spacing: .2em; }
    .gate .ui-btn { width: 100%; height: 36px; margin-top: 10px; }
    .gate .err { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: var(--mzo-bad); }
    .mini { list-style: none; margin: 0; padding: 0; }
    .mini li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--mzo-border); cursor: pointer; font-size: 13px; }
    .mini li:first-child { border-top: 0; }
    .mini li:hover { background: var(--mzo-row-hover); }
    .mini b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini span { color: var(--mzo-muted); font-size: 12px; }
    .mini .d { text-align: right; font-variant-numeric: tabular-nums; color: var(--mzo-text-2); font-size: 12.5px; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="ui-page">
    <section class="gate" id="gate">
      <form id="gateForm" autocomplete="off">
        <h1>Manpower</h1>
        <p id="gateNote">Enter your PIN to continue.</p>
        <input class="ui-input" id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN" disabled />
        <button type="submit" class="ui-btn primary" id="pinBtn" disabled>Continue</button>
        <div class="err" id="gateErr" role="alert"></div>
      </form>
    </section>

    <div id="app" hidden>
      <header class="ui-head">
        <div>
          <h1>Manpower</h1>
          <p id="meta">Loading…</p>
        </div>
      </header>

      <div class="ui-filters">
        <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Name or employee number" autocomplete="off" /></label>
        <span class="ui-select"><select id="pcFilter" aria-label="Profit center"><option value="">All profit centers</option></select></span>
        <span class="ui-select"><select id="ccFilter" aria-label="Cost center"><option value="">All cost centers</option></select></span>
        <span class="ui-select"><select id="desFilter" aria-label="Designation"><option value="">All designations</option></select></span>
        <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
        <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
      </div>

      <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
        <button type="button" class="ui-stat" data-k=""><div class="k">Employees</div><div class="v">—</div><div class="s">&nbsp;</div></button>
        <button type="button" class="ui-stat" data-k="r3"><div class="k">Retiring in 3 months</div><div class="v">—</div><div class="s">&nbsp;</div></button>
        <button type="button" class="ui-stat" data-k="r12"><div class="k">Retiring in a year</div><div class="v">—</div><div class="s">&nbsp;</div></button>
        <button type="button" class="ui-stat" data-k="bday"><div class="k">Birthdays this week</div><div class="v">—</div><div class="s">&nbsp;</div></button>
      </section>

      <div class="ui-grid">
        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>Strength</h2>
            <div class="ui-tabs" role="tablist" id="groupTabs">
              <button type="button" class="ui-tab" role="tab" data-g="des" aria-selected="true">Designation</button>
              <button type="button" class="ui-tab" role="tab" data-g="pc">Profit center</button>
              <button type="button" class="ui-tab" role="tab" data-g="cc">Cost center</button>
            </div>
          </div>
          <div id="groupTable" style="--max-h:480px"></div>
        </section>
        <div>
          <section class="ui-panel">
            <div class="ui-panel-h"><h2>Retiring soon</h2><span class="ui-note">Next 6 months</span></div>
            <ul class="mini" id="retireList"></ul>
          </section>
          <section class="ui-panel">
            <div class="ui-panel-h"><h2>Birthdays</h2><span class="ui-note">Next 7 days</span></div>
            <ul class="mini" id="bdayList"></ul>
          </section>
        </div>
      </div>

      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>Employees <small id="empCount"></small></h2>
          <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
        </div>
        <div id="empTable"></div>
      </section>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var SHEET = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRXojudL5q-ln7pXOcbLaGsBqznppnvsINcp8xEFvpJUWRCiC7bjii9eZYSu0istzyM91m4yybd5g-/pub?single=true&output=csv&gid=';
    var PIN_GID = '2073511562', DATA_GID = '2110628491';
    var FIELDS = ['Employee No', 'Name', 'Profit Center Code', 'Profit Center Name', 'Cost Center Code', 'Cost Center Name', 'Legacy ID', 'Position',
      'Designation', 'Class', 'Date of joining', 'Date of Retirement', 'Date of Increment', 'IFSC Code', 'Bank Account No', 'Payscale Group',
      'Payscale Level', 'Pay', 'Grade Pay', 'Dearness Allowance', 'House Rent Allowance', 'Gross Salary', 'PF A/C Number', 'PF Trust ID', 'Lock Status'];
    var pins = [], all = [], stat = '', group = 'des';

    /* ---------- PIN gate (PINs live in Sheet2, column B) ---------- */
    fetch(SHEET + PIN_GID, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (text) {
      var rows = text.split(/\r?\n/).slice(1);
      pins = rows.map(function (line) { var c = UI.csv('a,b\n' + line)[0]; return c && c.b != null ? String(c.b).trim() : ''; }).filter(Boolean);
      $('pin').disabled = false; $('pinBtn').disabled = false; $('pin').focus();
    }).catch(function () { $('gateErr').textContent = 'Could not reach the authorisation sheet. Check your connection and reload.'; });

    $('gateForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('pin').value.trim();
      if (!v) { $('gateErr').textContent = 'Enter a PIN.'; return; }
      if (!pins.some(function (p) { return p === v || (/^\d+$/.test(p) && /^\d+$/.test(v) && Number(p) === Number(v)); })) { $('gateErr').textContent = 'Not authorised. Ask an admin to add your PIN.'; $('pin').value = ''; $('pin').focus(); return; }
      $('gateErr').textContent = '';
      $('pinBtn').disabled = true; $('pinBtn').textContent = 'Loading…';
      loadData();
    });

    /* ---------- data ---------- */
    function toDate(v) {
      var s = String(v == null ? '' : v).trim();
      if (!s || /^n\/?a$/i.test(s)) return null;
      if (/^\d{5}(\.\d+)?$/.test(s)) return new Date(Date.UTC(1899, 11, 30) + parseFloat(s) * 864e5); // Excel serial
      return UI.date(s);
    }
    function birthday(legacy, year) {
      var id = String(legacy || '').trim();
      if (id.length !== 10) return null;
      var mm = +id.slice(4, 6) - 1, dd = +id.slice(6, 8);
      if (!(mm >= 0 && mm < 12 && dd >= 1 && dd <= 31)) return null;
      return new Date(year, mm, dd);
    }

    function loadData() {
      fetch(SHEET + DATA_GID, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (text) {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var week = new Date(today.getTime() + 6 * 864e5);
        all = UI.csv(text).map(function (row) {
          var e = {}; Object.keys(row).forEach(function (k) { e[k.trim()] = row[k]; });
          return e;
        }).filter(function (e) { return e.Name && String(e.Name).trim(); }).map(function (e) {
          var ret = toDate(e['Date of Retirement']), join = toDate(e['Date of joining']);
          var bd = birthday(e['Legacy ID'], today.getFullYear());
          if (bd && bd < today) bd = birthday(e['Legacy ID'], today.getFullYear() + 1);
          return {
            raw: e, name: String(e.Name).trim(), no: String(e['Employee No'] || '').trim(), des: String(e.Designation || '').trim() || 'Not set',
            cls: String(e.Class || '').trim(), pc: String(e['Profit Center Name'] || e['Profit Center Code'] || '').trim(), cc: String(e['Cost Center Name'] || e['Cost Center Code'] || '').trim(),
            join: join, ret: ret, retDays: ret ? Math.round((ret - today) / 864e5) : null, bday: bd && bd <= week ? bd : null
          };
        });
        all.forEach(function (e) { e.search = (e.name + ' ' + e.no).toLowerCase(); });
        var pcs = {}, ccs = {}; all.forEach(function (e) { if (e.pc) pcs[e.pc] = 1; if (e.cc) ccs[e.cc] = 1; });
        $('meta').textContent = UI.n(all.length) + ' employees · ' + Object.keys(pcs).length + ' profit centers · ' + Object.keys(ccs).length + ' cost centers';
        fill();
        $('gate').hidden = true; $('app').hidden = false;
        render();
      }).catch(function () { $('gateErr').textContent = 'Could not load employee data. Try again.'; $('pinBtn').disabled = false; $('pinBtn').textContent = 'Continue'; });
    }

    function fill() {
      var pc = $('pcFilter').value;
      UI.fill('pcFilter', UI.uniq(all, 'pc'), 'All profit centers');
      var r1 = all.filter(function (e) { return !pc || e.pc === pc; });
      UI.fill('ccFilter', UI.uniq(r1, 'cc'), 'All cost centers');
      UI.fill('desFilter', UI.uniq(r1, 'des'), 'All designations');
      UI.fill('classFilter', UI.uniq(all, 'cls'), 'All classes');
    }

    var STAT = {
      '': function () { return true; },
      r3: function (e) { return e.retDays != null && e.retDays > 0 && e.retDays <= 90; },
      r12: function (e) { return e.retDays != null && e.retDays > 0 && e.retDays <= 365; },
      bday: function (e) { return !!e.bday; }
    };
    function base() {
      var q = $('q').value.trim().toLowerCase(), pc = $('pcFilter').value, cc = $('ccFilter').value, des = $('desFilter').value, cls = $('classFilter').value;
      return all.filter(function (e) {
        return (!pc || e.pc === pc) && (!cc || e.cc === cc) && (!des || e.des === des) && (!cls || e.cls === cls) && (!q || e.search.indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base(), view = b.filter(STAT[stat]);
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = b.filter(STAT[k]).length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = k ? (c ? UI.pct(c, b.length) + ' of staff' : 'None') : (UI.uniq(b, 'des').length + ' designations');
        el.setAttribute('aria-pressed', String(stat === k));
      });

      var key = group, g = {};
      view.forEach(function (e) { var k = e[key] || 'Not set'; (g[k] || (g[k] = { name: k, n: 0, r12: 0 })).n++; if (STAT.r12(e)) g[k].r12++; });
      var list = Object.keys(g).map(function (k) { return g[k]; }), max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));
      UI.table('groupTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No employees for these filters.',
        columns: [
          { key: 'name', label: { des: 'Designation', pc: 'Profit center', cc: 'Cost center' }[group], cls: 'wrap', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
          { key: 'n', label: 'Staff', num: true, fmt: UI.n },
          { key: 'r12', label: 'Retiring in a year', num: true, hideSm: true, fmt: function (v) { return v ? UI.n(v) : '<span class="ui-muted">0</span>'; } },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.n; }, fmt: function (_, x) { return UI.bar(x.n, max, UI.pct(x.n, view.length)); }, hideSm: true, width: '28%' }
        ],
        onRow: function (x) { var id = { des: 'desFilter', pc: 'pcFilter', cc: 'ccFilter' }[group]; $(id).value = $(id).value === x.name ? '' : x.name; if (id === 'pcFilter') fill(); UI.mark($(id)); render(); }
      });

      var soon = b.filter(function (e) { return e.retDays != null && e.retDays > 0 && e.retDays <= 182; }).sort(function (x, y) { return x.retDays - y.retDays; });
      $('retireList').innerHTML = soon.slice(0, 8).map(function (e) { return '<li data-no="' + UI.esc(e.no) + '"><div><b>' + UI.esc(e.name) + '</b><span>' + UI.esc(e.des + (e.cc ? ' · ' + e.cc : '')) + '</span></div><div class="d">' + UI.fmtDate(e.ret) + '</div></li>'; }).join('') || '<li style="cursor:default"><span>No one in the next 6 months.</span></li>';
      var bd = b.filter(STAT.bday).sort(function (x, y) { return x.bday - y.bday; });
      $('bdayList').innerHTML = bd.slice(0, 8).map(function (e) { return '<li data-no="' + UI.esc(e.no) + '"><div><b>' + UI.esc(e.name) + '</b><span>' + UI.esc(e.cc || e.des) + '</span></div><div class="d">' + e.bday.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][e.bday.getMonth()] + '</div></li>'; }).join('') || '<li style="cursor:default"><span>No birthdays this week.</span></li>';

      $('empCount').textContent = UI.n(view.length);
      UI.table('empTable', { rows: view, sort: stat === 'r3' || stat === 'r12' ? { key: 'ret', dir: 'asc' } : stat === 'bday' ? { key: 'bday', dir: 'asc' } : { key: 'name', dir: 'asc' }, limit: 50, resetPage: true, empty: 'No employees match these filters.', columns: COLS, onRow: detail });
      window.__view = view;
      $('clearBtn').hidden = !($('q').value || stat || ['pcFilter', 'ccFilter', 'desFilter', 'classFilter'].some(function (id) { return $(id).value; }));
    }

    var COLS = [
      { key: 'name', label: 'Name', fmt: function (v, e) { return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + UI.esc(e.no) + '</span>'; } },
      { key: 'des', label: 'Designation', cls: 'wrap' },
      { key: 'cc', label: 'Cost center', hideSm: true, cls: 'wrap' },
      { key: 'cls', label: 'Class', hideSm: true },
      { key: 'join', label: 'Joined', num: true, hideSm: true, sortVal: function (e) { return e.join ? e.join.getTime() : 0; }, fmt: function (v) { return v ? UI.fmtDate(v) : '—'; }, csv: function (e) { return e.join ? UI.fmtDate(e.join) : ''; } },
      { key: 'ret', label: 'Retires', num: true, sortVal: function (e) { return e.ret ? e.ret.getTime() : 9e15; }, fmt: function (v, e) { return v ? (e.retDays > 0 && e.retDays <= 90 ? '<span class="ui-delta bad">' + UI.fmtDate(v) + '</span>' : UI.fmtDate(v)) : '—'; }, csv: function (e) { return e.ret ? UI.fmtDate(e.ret) : ''; } },
      { key: 'bday', label: 'Birthday', num: true, hideSm: true, sortVal: function (e) { return e.bday ? e.bday.getTime() : 9e15; }, fmt: function (v) { return v ? UI.fmtDate(v).replace(/ \d{4}$/, '') : '<span class="ui-muted">—</span>'; }, csv: function (e) { return e.bday ? UI.fmtDate(e.bday) : ''; } }
    ];

    function service(join) {
      if (!join) return '';
      var t = new Date(), y = t.getFullYear() - join.getFullYear(), m = t.getMonth() - join.getMonth();
      if (t.getDate() < join.getDate()) m--;
      if (m < 0) { y--; m += 12; }
      return Math.max(0, y) + ' yrs ' + Math.max(0, m) + ' months';
    }
    function detail(e) {
      var pairs = [['Service', service(e.join)]];
      FIELDS.forEach(function (f) {
        var v = e.raw[f];
        if (/^Date of/.test(f)) { var d = toDate(v); v = d ? UI.fmtDate(d) : v; }
        pairs.push([f, v]);
      });
      UI.drawer(e.name, [e.des, e.cc].filter(Boolean).join(' · '), pairs);
    }

    ['pcFilter', 'ccFilter', 'desFilter', 'classFilter'].forEach(function (id) { $(id).addEventListener('change', function () { if (id === 'pcFilter') { $('ccFilter').value = ''; $('desFilter').value = ''; fill(); } UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(render, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); stat = stat === k ? '' : k; render(); });
    $('groupTabs').addEventListener('click', function (e) {
      var t = e.target.closest('.ui-tab'); if (!t) return;
      group = t.getAttribute('data-g');
      [].forEach.call(this.querySelectorAll('.ui-tab'), function (x) { x.setAttribute('aria-selected', String(x === t)); });
      render();
    });
    ['retireList', 'bdayList'].forEach(function (id) {
      $(id).addEventListener('click', function (ev) { var li = ev.target.closest('li[data-no]'); if (!li) return; var e = all.filter(function (x) { return x.no === li.getAttribute('data-no'); })[0]; if (e) detail(e); });
    });
    $('clearBtn').addEventListener('click', function () { $('q').value = ''; stat = ''; ['pcFilter', 'ccFilter', 'desFilter', 'classFilter'].forEach(function (id) { $(id).value = ''; }); fill(); render(); });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('manpower.csv', [{ key: 'no', label: 'Employee No' }, { key: 'name', label: 'Name' }, { key: 'des', label: 'Designation' }, { key: 'cls', label: 'Class' }, { key: 'pc', label: 'Profit center' }, { key: 'cc', label: 'Cost center' }].concat(COLS.slice(4)), window.__view || []);
    });
  });
  </script>
</body>
</html>
