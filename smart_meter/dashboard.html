<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart meters · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=6" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/mzo_data_hub.js?v=91" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <script src="/mzo_rows.js?v=5" defer></script>
  <style>.ui-grid > .ui-panel { margin-top: 0; }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Smart meters</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Meter number or consumer ID" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="typeFilter" aria-label="Meter type"><option value="">All meter types</option></select></span>
      <span class="ui-select"><select id="lotFilter" aria-label="Lot"><option value="">All lots</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <div class="ui-stat"><div class="k">Work orders</div><div class="v" id="sWo"><span class="ui-skel"></span></div><div class="s">Issued</div></div>
      <button type="button" class="ui-stat" data-k=""><div class="k">Supplied</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="installed"><div class="k"><span class="ui-dot"></span>Installed</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pushed"><div class="k"><span class="ui-dot ok"></span>Pushed to AMI</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="unpushed"><div class="k"><span class="ui-dot warn"></span>Installed, not pushed</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Installed by meter type</h2></div>
          <div id="typeTable"></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By lot</h2></div>
          <div class="ui-panel-b"><div id="lotHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Meters <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var STATUS = { pushed: ['Pushed', 'ok'], unpushed: ['Not pushed', 'warn'], pending: ['Not installed', ''] };
    var meters = [], wos = [], woByMeter = {}, asOn = null, f = { q: '', stat: '' }, level = 'region', scope = null;

    // Canonical office of a row (schema offices: ccc_final for meters, CCC_code for work orders).
    function office(d, code) { return { _region: d._region, _divn: d._division, _supp: d._ccc || code, CCC_CODE: code }; }

    // mt, wt: uniform rows of schema/smart_meter_status.json and smart_meter_work_orders.json (wt may
    // still be on its way), each scoped to the login by MzoRows (t.all: every row).
    function prepare(mt, wt) {
      meters = mt.rows.filter(function (d) { return d.meter_supply_qty || d.con_id; }).map(function (d) {
        var o = office(d, d.ccc_final), inst = !!d.meter_installed_qty_in_field_active_in_hes, push = !!d.total_submit_in_ami_portal;
        o.meter = d.meter_supply_qty; o.con = d.con_id; o.type = d.meter_type || '—'; o.lot = d.lot || '—'; o.lotDate = d.lot_date;
        o.installed = inst; o.pushed = push; o.st = push ? 'pushed' : inst ? 'unpushed' : 'pending'; o.remarks = d.remarks; o.gen = d.generation_meter; o.check = d.checked_meter;
        return o;
      });
      // The as-on date and the meter → work order join use every work order, before the scope.
      asOn = null; woByMeter = {};
      (wt ? wt.all : []).forEach(function (d) {
        if (!d.work_order) return;
        if (!asOn && d.date) asOn = UI.date(d.date);
        if (d.new_meter_no) woByMeter[d.new_meter_no] = d;
      });
      wos = (wt ? wt.rows : []).filter(function (d) { return d.work_order; }).map(function (d) { var o = office(d, d.ccc_code); o.wo = d.work_order; return o; });
      $('meta').textContent = (asOn ? 'As on ' + UI.fmtDate(asOn) + ' · ' : '') + UI.n(meters.length) + ' meters supplied';
      UI.fill('typeFilter', UI.uniq(meters, 'type'), 'All meter types');
      UI.fill('lotFilter', UI.uniq(meters, 'lot'), 'All lots');
      fillOffices();
    }
    function fillOffices() {
      UI.offices(meters);
      if (!scope) scope = UI.lockScope();
    }
    function inOffice(r) {
      var reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc);
    }
    function base(skip) {
      var q = f.q.toLowerCase(), t = $('typeFilter').value, lot = $('lotFilter').value;
      return meters.filter(function (r) {
        return inOffice(r) && (!t || r.type === t) && (skip === 'lot' || !lot || r.lot === lot) &&
          (!q || String(r.meter).toLowerCase().indexOf(q) !== -1 || r.con.indexOf(q) !== -1);
      });
    }
    var STAT = { installed: function (r) { return r.installed; }, pushed: function (r) { return r.pushed; }, unpushed: function (r) { return r.st === 'unpushed'; } };
    function counts(rows) { var c = { n: rows.length, inst: 0, push: 0, un: 0 }; rows.forEach(function (r) { if (r.installed) c.inst++; if (r.pushed) c.push++; if (r.st === 'unpushed') c.un++; }); return c; }

    function render() {
      var b = base(), c = counts(b), view = f.stat ? b.filter(STAT[f.stat]) : b, wo = wos.filter(inOffice);
      $('sWo').textContent = UI.n(wo.length);
      [].forEach.call(document.querySelectorAll('#stats button.ui-stat'), function (el) {
        var k = el.getAttribute('data-k');
        var v = !k ? c.n : k === 'installed' ? c.inst : k === 'pushed' ? c.push : c.un;
        var s = !k ? UI.n(UI.uniq(b, '_supp').length) + ' CCCs' : k === 'installed' ? UI.pct(c.inst, c.n) + ' of supplied' : k === 'pushed' ? UI.pct(c.push, c.inst) + ' of installed' : UI.pct(c.un, c.inst) + ' of installed';
        el.querySelector('.v').textContent = UI.n(v); el.querySelector('.s').textContent = s;
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      var row = function (name, r) { return g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', wo: 0, n: 0, inst: 0, push: 0, un: 0 }); };
      b.forEach(function (r) { var o = row(r[key] || 'Unmapped', r); o.n++; if (r.installed) o.inst++; if (r.pushed) o.push++; if (r.st === 'unpushed') o.un++; });
      wo.forEach(function (r) { row(r[key] || 'Unmapped', r).wo++; });
      var list = Object.keys(g).map(function (k) { return g[k]; });
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No meters for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'wo', label: 'WO', num: true, fmt: UI.n, hideSm: true },
          { key: 'n', label: 'Supplied', num: true, fmt: UI.n },
          { key: 'push', label: 'Pushed', num: true, fmt: UI.n, hideSm: true },
          { key: 'un', label: 'Not pushed', num: true, fmt: UI.n },
          { key: 'rate', label: 'Installed', sortVal: function (x) { return x.n ? x.inst / x.n : 0; }, fmt: function (_, x) { return UI.bar(x.inst, x.n, UI.pct(x.inst, x.n), 2); }, width: '26%' }
        ],
        foot: list.length > 1 ? { wo: wo.length, n: c.n, push: c.push, un: c.un } : null,
        onRow: level === 'ccc' ? null : function (x) { drill(x.name); }
      });

      var tg = {}; b.forEach(function (r) { var o = tg[r.type] || (tg[r.type] = { type: r.type, n: 0, inst: 0, push: 0 }); o.n++; if (r.installed) o.inst++; if (r.pushed) o.push++; });
      UI.table('typeTable', {
        rows: Object.keys(tg).map(function (k) { return tg[k]; }), sort: { key: 'n', dir: 'desc' }, count: false,
        selected: function (x) { return x.type === $('typeFilter').value; },
        columns: [
          { key: 'type', label: 'Type', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
          { key: 'n', label: 'Supplied', num: true, fmt: UI.n },
          { key: 'rate', label: 'Installed', sortVal: function (x) { return x.n ? x.inst / x.n : 0; }, fmt: function (_, x) { return UI.bar(x.inst, x.n, UI.pct(x.inst, x.n), 2); }, width: '46%' }
        ],
        onRow: function (x) { $('typeFilter').value = $('typeFilter').value === x.type ? '' : x.type; UI.mark($('typeFilter')); render(); }
      });
      var lb = base('lot'), lg = {}; lb.forEach(function (r) { lg[r.lot] = (lg[r.lot] || 0) + 1; });
      UI.hist('lotHist', Object.keys(lg).sort().map(function (k) { return { key: k, label: k, value: lg[k] }; }),
        { active: $('lotFilter').value, onClick: function (x) { $('lotFilter').value = $('lotFilter').value === x.key ? '' : x.key; UI.mark($('lotFilter')); render(); } });

      $('listCount').textContent = UI.n(view.length);
      window.__view = view;
      UI.table('listTable', { rows: view, sort: { key: 'st', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No meters match these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.stat || $('typeFilter').value || $('lotFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    var COLS = [
      { key: 'meter', label: 'Meter', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span>'; } },
      { key: 'con', label: 'Consumer ID' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.CCC_CODE) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'type', label: 'Type', hideSm: true },
      { key: 'lot', label: 'Lot', hideSm: true },
      { key: 'st', label: 'Status', sortVal: function (r) { return r.st === 'unpushed' ? 3 : r.st === 'pending' ? 2 : 1; }, fmt: function (v) { return '<span class="ui-badge ' + STATUS[v][1] + '">' + STATUS[v][0] + '</span>'; }, csv: function (r) { return STATUS[r.st][0]; } }
    ];
    function detail(r) {
      var w = woByMeter[r.meter] || {};
      var clean = function (v) { return UI.blank(v) ? '' : v; };
      UI.drawer('Meter ' + (r.meter || '—'), [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Status', STATUS[r.st][0]], ['Consumer ID', r.con || clean(w.consumer_id)], ['Consumer', clean(w.con_name)], ['Address', clean(w.con_addr)],
        ['Work order', clean(w.work_order)], ['Work order date', clean(w.work_order_date)], ['Old meter', clean(w.old_meter_no)], ['Load (kW)', clean(w.conn_load)], ['Class', clean(w.con_class)],
        ['Meter type', r.type], ['Lot', r.lot], ['Lot date', r.lotDate ? UI.fmtDate(r.lotDate) : ''],
        ['Generation meter', r.gen], ['Check meter', r.check], ['Remarks', r.remarks], ['CCC code', r.CCC_CODE]
      ]);
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillOffices(); markAll(); setLevel(level);
    }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter', 'typeFilter', 'lotFilter'].forEach(function (id) { UI.mark($(id)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); markAll(); render();
      });
    });
    ['typeFilter', 'lotFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('button.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.stat = ''; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter', 'typeFilter', 'lotFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillOffices(); markAll();
      setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('smart-meters.csv', [{ key: 'meter', label: 'Meter' }, { key: 'con', label: 'Consumer ID' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'type', label: 'Type' }, { key: 'lot', label: 'Lot' }, COLS[5]], window.__view || []);
    });

    // These sheets export slowly from Google (half a minute or more). MzoRows paints this device's
    // last rows at once and replaces them when newer rows arrive (on the VM they come ready-made).
    // The page's old copy in the Cache API is no longer read.
    if ('caches' in window) caches.delete('mzo-smart-meter-v1').catch(function () {});
    var mT = null, wT = null, fresh = false;
    function paint() {
      prepare(mT, wT);
      if (!paint.done) {
        paint.done = true;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (x) { x.setAttribute('aria-selected', String(x.getAttribute('data-l') === level)); });
      }
      render();
      if (wT === null) $('sWo').innerHTML = '<span class="ui-skel"></span>';
      if (!fresh) $('meta').textContent += ' · updating…';
    }
    function load(force) {
      var b = $('refreshBtn'); b.classList.add('spin'); fresh = false;
      var done = 0, finish = function () { if (++done === 2) { fresh = true; if (mT) paint(); b.classList.remove('spin'); } };
      var opts = force ? { forceCheck: true } : undefined;
      MzoRows.load('smart_meter_status', function (t, info) {
        if (t) { mT = t; paint(); return; }
        if (info && info.error && !mT) { $('meta').textContent = 'Could not load data'; $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; }
      }, opts).then(finish, finish);
      MzoRows.load('smart_meter_work_orders', function (t) {
        if (t) wT = t; else if (!wT) wT = { rows: [], all: [] };
        if (mT) paint();
      }, opts).then(finish, finish);
    }
    $('refreshBtn').addEventListener('click', function () { if (!this.classList.contains('spin')) load(true); });
    load(false);
  });
  </script>
</body>
</html>
