<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance index · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .pi-rank { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 6px; font-weight: 600; font-size: 12px; background: var(--mzo-surface-2); color: var(--mzo-text-2); box-shadow: inset 0 0 0 1px var(--mzo-border); }
    .pi-rank.top { background: var(--mzo-fill); color: var(--mzo-on-fill); box-shadow: none; }
    .pi-score { display: flex; align-items: center; gap: 10px; min-width: 130px; }
    .pi-score b { width: 38px; text-align: right; font-weight: 600; }
    .pi-score .ui-bar { flex: 1; min-width: 70px; }
    .pi-body { padding: 4px 20px 24px; font-size: 13px; }
    .pi-total { display: flex; align-items: baseline; gap: 10px; padding: 16px 0 12px; border-bottom: 1px solid var(--mzo-border); }
    .pi-total b { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
    .pi-p { padding: 12px 0; border-bottom: 1px solid var(--mzo-border); }
    .pi-p .row1 { display: flex; justify-content: space-between; gap: 12px; }
    .pi-p .row1 span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
    .pi-p .row2 { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; font-size: 12px; color: var(--mzo-muted); font-variant-numeric: tabular-nums; }
    .pi-p .ui-bar { margin-top: 8px; }
    .pi-help h4 { margin: 18px 0 6px; font-size: 13px; font-weight: 600; }
    .pi-help p { margin: 0 0 8px; color: var(--mzo-text-2); line-height: 1.55; }
    .pi-help table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pi-help td { padding: 8px 0; border-bottom: 1px solid var(--mzo-border); }
    .pi-help td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .pi-help code { font-family: var(--mzo-mono); font-size: 12px; background: var(--mzo-surface-2); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Performance index</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn" id="helpBtn">How it's scored</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <div class="ui-seg" id="level" role="group" aria-label="Compare">
        <button type="button" data-l="region" aria-pressed="true">Regions</button>
        <button type="button" data-l="division" aria-pressed="false">Divisions</button>
        <button type="button" data-l="ccc" aria-pressed="false">CCCs</button>
      </div>
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search office" autocomplete="off" /></label>
      <span class="ui-select" id="divWrap" hidden><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Leaders">
      <button type="button" class="ui-stat" data-l="region"><div class="k">Top region</div><div class="v" id="tRegion"><span class="ui-skel"></span></div><div class="s" id="tRegionS">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-l="division"><div class="k">Top division</div><div class="v" id="tDivision"><span class="ui-skel"></span></div><div class="s" id="tDivisionS">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-l="ccc"><div class="k">Top CCC</div><div class="v" id="tCcc"><span class="ui-skel"></span></div><div class="s" id="tCccS">&nbsp;</div></button>
      <div class="ui-stat"><div class="k">CCC average</div><div class="v" id="tAvg"><span class="ui-skel"></span></div><div class="s" id="tAvgS">&nbsp;</div></div>
    </section>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2 id="tableTitle">Ranking</h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="rankTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };

    // 100 points, every parameter is "lower is better".
    var WEIGHTS = { atcLoss: 30, qtnDelay: 8, woDelay: 8, connDelay: 9, pendingNsc: 25, pendingMc: 20 };
    var PARAMS = [
      { key: 'atcLoss', label: 'AT&C loss', unit: '%' },
      { key: 'qtnDelay', label: 'Quotation delay', unit: ' d' },
      { key: 'woDelay', label: 'Work order delay', unit: ' d' },
      { key: 'connDelay', label: 'Connection delay', unit: ' d' },
      { key: 'pendingNsc', label: 'Pending NSC', unit: '' },
      { key: 'pendingMc', label: 'Master cards over 3 months', unit: '' }
    ];
    var DIVS = ['Malda', 'Chanchal', 'Gazole', 'Raiganj', 'Islampur', 'Balurghat', 'Buniadpur'];
    var REGIONS = ['Malda', 'Uttar Dinajpur', 'Dakshin Dinajpur'];
    var MON = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var data = { region: [], division: [], ccc: [] }, level = 'region', mine = {};

    function normalizeRegion(reg, div) {
      if (reg) {
        var r = reg.toLowerCase();
        if (r.indexOf('uttar') !== -1 || r.indexOf('u/d') !== -1 || r.indexOf('raiganj') !== -1) return 'Uttar Dinajpur';
        if (r.indexOf('dakshin') !== -1 || r.indexOf('d/d') !== -1 || r.indexOf('balurghat') !== -1) return 'Dakshin Dinajpur';
        if (r.indexOf('malda') !== -1) return 'Malda';
      }
      if (div) {
        if (div === 'Raiganj' || div === 'Islampur') return 'Uttar Dinajpur';
        if (div === 'Balurghat' || div === 'Buniadpur') return 'Dakshin Dinajpur';
        return 'Malda';
      }
      return 'Malda';
    }

    function process(lossRows, nscRows, mcRows) {
      var S = window.MzoScope;
      // Latest loss month (cumulative AT&C)
      var ly = 0, lm = 0;
      lossRows.forEach(function (r) {
        var y = parseInt(r.YEAR, 10), m = parseInt(r.MONTH, 10);
        if (!isNaN(y) && !isNaN(m) && (y > ly || (y === ly && m > lm))) { ly = y; lm = m; }
      });
      var latestLoss = lossRows.filter(function (r) { return parseInt(r.YEAR, 10) === ly && parseInt(r.MONTH, 10) === lm; });

      $('meta').textContent = (lm ? 'Loss to ' + MON[lm] + ' ' + ly + ' · ' : '') + UI.n(nscRows.length) + ' NSC cases · ' + UI.n(mcRows.length) + ' master cards';

      var cccList = S ? S.listAllUnits().filter(function (u) { return u.name !== 'Gazol'; }) : [];

      var acc = { ccc: {}, division: {}, region: {} };
      function add(map, key, q, w, c) {
        if (!key) return;
        var a = map[key] || (map[key] = { count: 0, qt: 0, qn: 0, wt: 0, wn: 0, ct: 0, cn: 0 });
        a.count++;
        if (!isNaN(q) && q >= 0) { a.qt += q; a.qn++; }
        if (!isNaN(w) && w >= 0) { a.wt += w; a.wn++; }
        if (!isNaN(c) && c >= 0) { a.ct += c; a.cn++; }
      }
      nscRows.forEach(function (r) {
        var raw = r.SUPP_OFF || r.CCC_CODE || '';
        var ccc = S ? S.cccNameOf(raw) : raw;
        var p = S && ccc ? S.parentOfCcc(ccc) : null;
        var div = p && p.division ? p.division : (r.DIVN_NAME || '');
        var reg = normalizeRegion(p && p.region ? p.region : (r.REG || r.REGION || ''), div);
        var f = function (v) { return v !== '' && v != null ? parseFloat(v) : NaN; };
        var q = f(r.DelayInQtn), w = f(r.DelayInWO), c = f(r.DelayInSC);
        add(acc.ccc, ccc, q, w, c); add(acc.division, div, q, w, c); add(acc.region, reg, q, w, c);
      });

      var mc = { ccc: {}, division: {}, region: {} };
      mcRows.forEach(function (r) {
        var ins = UI.date(r['Meter Installation Date']), rep = UI.date(r['Report Date']);
        if (!(ins && rep && (rep - ins) / 864e5 >= 90)) return;
        var raw = r.CCC || r.SUPP_OFF || '';
        var ccc = S ? S.cccNameOf(raw) : raw;
        var p = S && ccc ? S.parentOfCcc(ccc) : null;
        var div = p && p.division ? p.division : (r.Division || '');
        var reg = normalizeRegion(p && p.region ? p.region : (r.Region || ''), div);
        if (ccc) mc.ccc[ccc] = (mc.ccc[ccc] || 0) + 1;
        if (div) mc.division[div] = (mc.division[div] || 0) + 1;
        if (reg) mc.region[reg] = (mc.region[reg] || 0) + 1;
      });

      var ALIAS = {
        gazole: ['gazole', 'gazol'], gazol: ['gazole', 'gazol'], manikchak: ['mathurapur', 'manikchak'], baishnabnagar: ['baisnabnagar', 'baishnabnagar'],
        mokdumpur: ['mokdampur', 'mokdumpur'], harishchandrapur: ['h.c. pur', 'hc pur', 'harishchandrapur', 'h.c.pur'], bamongola: ['bamangola', 'bamongola'],
        kaliyaganj: ['kaliaganj', 'kaliyaganj'], karandighi: ['karandeghi', 'karandighi'], goalpokher: ['goalpokhar', 'goalpokher'],
        kumarganj: ['kumargunj', 'kumarganj'], kusmandi: ['kushmundi', 'kusmandi']
      };
      var DIV_PAT = { Malda: [/^malda\s+div/i], Chanchal: [/^chanchal\s+div/i], Gazole: [/^gazole\s+div/i, /^gazol\s+div/i], Raiganj: [/^raiganj\s+div/i], Islampur: [/^islampur\s+div/i], Balurghat: [/^balurghat\s+div/i], Buniadpur: [/^buniadpur\s+div/i] };
      var REG_PAT = { Malda: [/^malda\s+region$/i, /^malda$/i], 'Uttar Dinajpur': [/^u\/dinajpur\s+region$/i, /^uttar\s+dinajpur/i], 'Dakshin Dinajpur': [/^d\/dinajpur\s+region$/i, /^dakshin\s+dinajpur/i] };
      var clean = function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); };
      function loss(name, type) {
        var row = null;
        if (type === 'ccc') {
          var n = name.toLowerCase().trim(), al = ALIAS[n] || [n];
          row = latestLoss.filter(function (r) { return !/div\s+total/i.test(r.CCC) && !/region|zone/i.test(r.CCC); })
            .filter(function (r) { var rn = String(r.CCC || '').toLowerCase().trim(); return al.some(function (a) { return rn === a || clean(rn) === clean(a); }); })[0];
        } else {
          var pats = (type === 'division' ? DIV_PAT : REG_PAT)[name] || [];
          row = latestLoss.filter(function (r) { return pats.some(function (p) { return p.test(r.CCC); }); })[0];
        }
        var v = row && row['CUM. AT&C LOSS'] ? parseFloat(String(row['CUM. AT&C LOSS']).replace('%', '')) : null;
        return v != null && isFinite(v) ? v : 0;
      }

      function build(list, type) {
        return list.map(function (item) {
          var name = typeof item === 'string' ? item : item.name;
          var div = typeof item === 'object' ? item.division : (type === 'division' ? name : '');
          var reg = typeof item === 'object' ? normalizeRegion(item.region, div) : (type === 'region' ? name : normalizeRegion('', div));
          var a = acc[type][name] || { count: 0, qt: 0, qn: 0, wt: 0, wn: 0, ct: 0, cn: 0 };
          return {
            name: name, division: div, region: reg, type: type,
            metrics: {
              atcLoss: +loss(name, type).toFixed(2),
              qtnDelay: +(a.qn ? a.qt / a.qn : 0).toFixed(1),
              woDelay: +(a.wn ? a.wt / a.wn : 0).toFixed(1),
              connDelay: +(a.cn ? a.ct / a.cn : 0).toFixed(1),
              pendingNsc: a.count,
              pendingMc: mc[type][name] || 0
            }
          };
        });
      }

      // Each metric scaled 0–100 inside its peer group (best = 100), then weighted.
      function score(group) {
        if (!group.length) return [];
        var stats = {};
        Object.keys(WEIGHTS).forEach(function (k) {
          var vals = group.map(function (u) { return u.metrics[k]; });
          stats[k] = { min: Math.min.apply(null, vals), max: Math.max.apply(null, vals) };
        });
        return group.map(function (u) {
          var scores = {}, total = 0;
          Object.keys(WEIGHTS).forEach(function (k) {
            var v = u.metrics[k], lo = stats[k].min, hi = stats[k].max;
            var s100 = hi === lo ? 100 : 100 * (hi - v) / (hi - lo);
            s100 = Math.max(0, Math.min(100, s100));
            var pts = s100 * WEIGHTS[k] / 100;
            scores[k] = { score100: +s100.toFixed(1), pts: +pts.toFixed(2), weight: WEIGHTS[k] };
            total += pts;
          });
          u.scores = scores; u.total = +total.toFixed(1); u.stats = stats;
          return u;
        }).sort(function (a, b) { return b.total - a.total; }).map(function (u, i, arr) { u.rank = i + 1; u.of = arr.length; return u; });
      }

      data.ccc = score(build(cccList, 'ccc'));
      data.division = score(build(DIVS, 'division'));
      data.region = score(build(REGIONS, 'region'));

      var top = function (id, list, suffix) { var t = list[0]; $(id).textContent = t ? t.name : '—'; $(id + 'S').textContent = t ? t.total + ' / 100' + (suffix ? ' · ' + suffix(t) : '') : ''; };
      top('tRegion', data.region);
      top('tDivision', data.division, function (t) { return t.region; });
      top('tCcc', data.ccc, function (t) { return t.division; });
      var avg = data.ccc.length ? data.ccc.reduce(function (s, c) { return s + c.total; }, 0) / data.ccc.length : 0;
      $('tAvg').textContent = data.ccc.length ? avg.toFixed(1) : '—';
      $('tAvgS').textContent = data.ccc.length + ' CCCs';

      // The signed-in office (if scoped) is highlighted in the ranking.
      mine = {};
      if (S && !S.isUnscoped()) {
        var sc = S.getScope() || {};
        ['regions', 'divisions', 'cccs'].forEach(function (k) { if (sc[k]) sc[k].forEach(function (v) { mine[v] = 1; }); });
      }
      UI.fill('divisionFilter', DIVS, 'All divisions');
    }

    function render() {
      var q = $('q').value.trim().toLowerCase(), div = $('divisionFilter').value;
      [].forEach.call(document.querySelectorAll('#level button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === level)); });
      [].forEach.call(document.querySelectorAll('#stats button.ui-stat'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === level)); });
      $('divWrap').hidden = level !== 'ccc';
      $('tableTitle').textContent = { region: 'Regions', division: 'Divisions', ccc: 'CCCs' }[level] + ' ranked';
      var rows = (data[level] || []).filter(function (u) {
        if (q && u.name.toLowerCase().indexOf(q) === -1 && String(u.division || '').toLowerCase().indexOf(q) === -1) return false;
        return !(level === 'ccc' && div && u.division !== div);
      });
      window.__rows = rows;
      UI.table('rankTable', {
        rows: rows, sort: { key: 'rank', dir: 'asc' }, count: false, empty: 'No offices match.',
        selected: function (u) { return !!mine[u.name] && (level !== 'region' || mine[u.region]); },
        columns: [
          { key: 'rank', label: 'Rank', num: false, sortVal: function (u) { return u.rank; }, width: '64px', fmt: function (v) { return '<span class="pi-rank' + (v <= 3 ? ' top' : '') + '">' + v + '</span>'; } },
          { key: 'name', label: 'Office', fmt: function (v, u) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (level === 'ccc' ? '<span class="sub">' + UI.esc(u.division) + '</span>' : level === 'division' ? '<span class="sub">' + UI.esc(u.region) + '</span>' : ''); } },
          { key: 'total', label: 'Score', num: true, width: '22%', fmt: function (v) { return '<div class="pi-score">' + UI.bar(v, 100) + '<b>' + v.toFixed(1) + '</b></div>'; } },
          { key: 'atc', label: 'AT&C loss', num: true, sortVal: function (u) { return u.metrics.atcLoss; }, fmt: function (_, u) { return u.metrics.atcLoss.toFixed(2) + '%'; } },
          { key: 'delay', label: 'Delays Q / W / C (days)', num: true, hideSm: true, sortVal: function (u) { return u.metrics.connDelay; }, fmt: function (_, u) { return u.metrics.qtnDelay + ' / ' + u.metrics.woDelay + ' / ' + u.metrics.connDelay; } },
          { key: 'nsc', label: 'Pending NSC', num: true, sortVal: function (u) { return u.metrics.pendingNsc; }, fmt: function (_, u) { return UI.n(u.metrics.pendingNsc); } },
          { key: 'mc', label: 'MC > 3 mo', num: true, hideSm: true, sortVal: function (u) { return u.metrics.pendingMc; }, fmt: function (_, u) { return UI.n(u.metrics.pendingMc); } }
        ],
        onRow: scorecard
      });
    }

    // Drawer body under the kit's drawer header.
    function panel(title, sub, html) {
      UI.drawer(title, sub, []);
      var sec = document.querySelector('#ui-drawer section'), body = sec.querySelector('.pi-body');
      if (!body) { body = document.createElement('div'); body.className = 'pi-body'; sec.appendChild(body); }
      sec.querySelector('dl').hidden = true;
      body.innerHTML = html;
      sec.scrollTop = 0;
    }

    function scorecard(u) {
      var h = '<div class="pi-total"><b>' + u.total.toFixed(1) + '</b><span class="ui-muted">of 100 · rank ' + u.rank + ' of ' + u.of + '</span></div>';
      PARAMS.forEach(function (p) {
        var s = u.scores[p.key], st = u.stats[p.key], v = u.metrics[p.key];
        h += '<div class="pi-p"><div class="row1"><span>' + UI.esc(p.label) + ' <span class="ui-muted">· ' + s.weight + '%</span></span><span>' + s.pts.toFixed(2) + ' pts</span></div>' +
          '<div class="row2"><span>' + UI.esc(v + p.unit) + '</span><span>Best ' + UI.esc(st.min + p.unit) + ' · Worst ' + UI.esc(st.max + p.unit) + ' · ' + s.score100 + '/100</span></div>' +
          UI.bar(s.score100, 100) + '</div>';
      });
      var sub = u.type === 'ccc' ? u.division + ' division' : u.type === 'division' ? u.region + ' region' : 'Region';
      panel(u.name, sub, h);
    }

    function help() {
      var rows = PARAMS.map(function (p) { return '<tr><td>' + UI.esc(p.label) + '</td><td>' + WEIGHTS[p.key] + '%</td></tr>'; }).join('');
      panel('How it’s scored', 'Offices are compared only with their peers', '<div class="pi-help">' +
        '<p>Each parameter is scaled from 0 to 100 within the peer group: the best office gets 100, the worst 0. Lower is better for every parameter.</p>' +
        '<p><code>score = 100 × (worst − value) ÷ (worst − best)</code></p>' +
        '<p>The index is the weighted sum: <code>Σ score × weight</code>. If every office has the same value, all get 100.</p>' +
        '<h4>Weights</h4><table>' + rows + '<tr><td><b>Total</b></td><td>100%</td></tr></table>' +
        '<h4>Sources</h4><p>AT&amp;C loss is the latest cumulative month in the Loss report. Delays are averages of the pending NSC list (quotation, work order, connection). Master cards count meters installed more than 90 days before the report date.</p></div>');
    }

    /* events */
    $('level').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { level = b.getAttribute('data-l'); render(); } });
    $('stats').addEventListener('click', function (e) {
      var b = e.target.closest('button.ui-stat'); if (!b) return;
      level = b.getAttribute('data-l'); render();
      var top = data[level] && data[level][0]; if (top) scorecard(top);
    });
    $('q').addEventListener('input', UI.debounce(render, 140));
    $('divisionFilter').addEventListener('change', function () { UI.mark(this); render(); });
    $('helpBtn').addEventListener('click', help);
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('performance-index-' + level + '.csv', [
        { key: 'rank', label: 'Rank' }, { key: 'name', label: 'Office' }, { key: 'division', label: 'Division' }, { key: 'region', label: 'Region' }, { key: 'total', label: 'Score' },
        { key: 'a', label: 'AT&C loss %', csv: function (u) { return u.metrics.atcLoss; } },
        { key: 'b', label: 'Quotation delay (d)', csv: function (u) { return u.metrics.qtnDelay; } },
        { key: 'c', label: 'Work order delay (d)', csv: function (u) { return u.metrics.woDelay; } },
        { key: 'd', label: 'Connection delay (d)', csv: function (u) { return u.metrics.connDelay; } },
        { key: 'e', label: 'Pending NSC', csv: function (u) { return u.metrics.pendingNsc; } },
        { key: 'f', label: 'Master cards > 3 months', csv: function (u) { return u.metrics.pendingMc; } }
      ], window.__rows || []);
    });

    function load(force) {
      var hub = window.mzoDataHub, b = $('refreshBtn');
      if (!hub) { $('meta').textContent = 'Could not load data'; return; }
      if (force) { b.classList.add('spin'); try { hub.resetVersionChecks(); } catch (e) {} }
      var keys = ['CACHE_LOSS', 'CACHE_NSC_v5', 'CACHE_PENDING_MC'];
      Promise.all(keys.map(function (k) { return Promise.resolve(hub.waitForDataset(k, { forceCheck: !!force })).catch(function () {}).then(function () { return hub.get(k); }).catch(function () { return null; }); }))
        .then(function (t) {
          if (!t[0] && !t[1] && !t[2]) throw new Error('empty');
          process(UI.csv(t[0] || ''), UI.csv(t[1] || ''), UI.csv(t[2] || ''));
          render();
        })
        .catch(function () { $('meta').textContent = 'Could not load data'; $('rankTable').innerHTML = '<div class="ui-empty">Could not load the performance datasets.</div>'; })
        .then(function () { b.classList.remove('spin'); });
    }
    $('refreshBtn').addEventListener('click', function () { load(true); });
    load(false);
  });
  </script>
</body>
</html>
