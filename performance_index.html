<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance index · MZO Reports</title>
  <link rel="icon" href="/icons/icon-192-v5.png?v=308" />
  <script src="/mzo_theme.js?v=7"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=10" />
  <script src="/mzo_ui.js?v=10" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <style>
    .ui-head { align-items: center; }
    .pi-meta { margin: 3px 0 0; font-size: 12.5px; color: var(--mzo-muted); }
    .pi-link { padding: 0; border: 0; background: none; color: var(--mzo-accent); font: inherit; cursor: pointer; text-decoration: none; }
    .pi-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    .pi-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .pi-sample { margin-left: 6px; vertical-align: 3px; }

    /* Grade badge: the letter is the text; the colour repeats it (CSRD bands, best to worst: ok, neutral, warn, bad) */
    .pi-grade { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 650; line-height: 1; white-space: nowrap; background: var(--mzo-surface-2); color: var(--mzo-text); box-shadow: inset 0 0 0 1px var(--mzo-border-strong); font-variant-numeric: tabular-nums; }
    .pi-grade.ok { background: var(--mzo-ok-soft); color: var(--mzo-ok); box-shadow: none; }
    .pi-grade.warn { background: var(--mzo-warn-soft); color: var(--mzo-warn); box-shadow: none; }
    .pi-grade.bad { background: var(--mzo-bad-soft); color: var(--mzo-bad); box-shadow: none; }
    .pi-grade.none { color: var(--mzo-muted); font-weight: 500; box-shadow: inset 0 0 0 1px var(--mzo-border); }
    .pi-grade.md { min-width: 36px; height: 26px; font-size: 14px; border-radius: 7px; }
    .pi-grade.lg { min-width: 54px; height: 42px; padding: 0 10px; font-size: 21px; border-radius: 9px; }

    /* Zone strip */
    .pi-strip .v { display: flex; align-items: center; gap: 9px; }
    .pi-strip .v small { font-size: 13px; font-weight: 400; color: var(--mzo-muted); letter-spacing: 0; }
    .pi-strip .ui-stat .pi-track { margin-top: 9px; }

    /* Notes under the header */
    .pi-you { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--mzo-border); border-radius: 8px; background: var(--mzo-surface); font-size: 12.5px; color: var(--mzo-text-2); }
    .pi-you b { font-weight: 600; color: var(--mzo-text); }
    .pi-dq { display: flex; align-items: baseline; gap: 8px; margin: -4px 0 14px; font-size: 12.5px; color: var(--mzo-muted); }
    .pi-dq .ui-dot { position: relative; top: -1px; }

    /* Ranking tools */
    .pi-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--mzo-border); }
    .pi-tools .ui-search { flex: 1 1 200px; max-width: 280px; }
    .pi-tools .sp { flex: 1 1 auto; }
    .pi-tools .ui-note { white-space: nowrap; }

    /* Ranking table */
    .pi-rank { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .pi-rank b { font-weight: 600; }
    .pi-rank span { color: var(--mzo-muted); font-size: 12px; }
    .pi-off { font-weight: 500; }
    .pi-off small { display: block; font-size: 12px; font-weight: 400; color: var(--mzo-muted); }
    .pi-chip { display: inline-block; margin-left: 6px; padding: 0 6px; height: 18px; line-height: 18px; border-radius: 5px; font-size: 11px; font-weight: 500; vertical-align: 1px; background: var(--mzo-fill); color: var(--mzo-on-fill); white-space: nowrap; }
    .pi-chip.soft { background: var(--mzo-surface-2); color: var(--mzo-text-2); box-shadow: inset 0 0 0 1px var(--mzo-border-strong); }
    .pi-score { display: flex; align-items: center; gap: 8px; min-width: 110px; }
    .pi-score > b { width: 34px; text-align: right; font-weight: 600; }
    .pi-track { position: relative; display: block; flex: 1 1 auto; min-width: 36px; height: 6px; border-radius: 3px; background: var(--mzo-chart-soft); overflow: hidden; }
    .pi-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: var(--mzo-chart-muted); }
    .pi-mini { display: grid; gap: 5px; min-width: 52px; }
    .pi-mini > span { font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .pi-mini > span small { color: var(--mzo-muted); font-size: 11.5px; }
    .pi-na { color: var(--mzo-faint); }
    .pi-weak { font-size: 12.5px; line-height: 1.35; min-width: 140px; }
    .pi-weak small { display: block; color: var(--mzo-muted); font-size: 12px; }
    .ui-table.pi-table th { white-space: nowrap; }
    .ui-table.pi-table th[data-sort]:focus-visible { outline-offset: -2px; }
    .ui-table.pi-table tbody tr.mine td { background: var(--mzo-surface-2); }
    .ui-table.pi-table tbody tr:focus-visible { outline: 2px solid var(--mzo-accent); outline-offset: -2px; }
    .ui-table.pi-table td.c-pillar, .ui-table.pi-table th.c-pillar { width: 7%; }
    .ui-table.pi-table td.c-weak { max-width: 220px; }

    /* Phone: the ranking becomes cards */
    @media (max-width: 720px) {
      .ui-head { flex-wrap: nowrap; align-items: flex-start; }
      .pi-tools .ui-search { max-width: none; flex-basis: 100%; }
      .pi-tools .ui-select { flex: 1 1 auto; min-width: 0; }
      .pi-tools .ui-select select { max-width: none; width: 100%; }
      .pi-tools .sp, .pi-tools .ui-note { display: none; }
      .pi-mini > span small { display: none; }
      .pi-btn-t { display: none; }
      .ui-table.pi-table thead { display: none; }
      .ui-table.pi-table, .ui-table.pi-table tbody { display: block; }
      .ui-table.pi-table tbody tr { display: grid; grid-template-columns: repeat(var(--np, 5), minmax(0, 1fr)); gap: 10px 10px; padding: 12px 14px; border-bottom: 1px solid var(--mzo-border); }
      .ui-table.pi-table tbody tr:last-child { border-bottom: 0; }
      .ui-table.pi-table td, .ui-table.pi-table td:first-child, .ui-table.pi-table td:last-child { display: block; padding: 0; border: 0; background: none !important; min-width: 0; }
      .ui-table.pi-table td.c-rank { grid-column: 1 / 2; grid-row: 1; align-self: center; }
      .ui-table.pi-table td.c-office { grid-column: 2 / -2; grid-row: 1; }
      .ui-table.pi-table td.c-grade { grid-column: -2 / -1; grid-row: 1; justify-self: end; align-self: center; }
      .ui-table.pi-table td.c-score { grid-column: 1 / -1; grid-row: 2; }
      .ui-table.pi-table td.c-pillar { grid-row: 3; width: auto; }
      .ui-table.pi-table td.c-pillar::before, .ui-table.pi-table td.c-weak::before, .ui-table.pi-table td.c-trend::before { content: attr(data-label); display: block; margin-bottom: 3px; font-size: 11px; color: var(--mzo-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ui-table.pi-table td.c-weak { grid-column: 1 / -1; grid-row: 4; max-width: none; }
      .ui-table.pi-table td.c-trend { grid-column: 1 / -1; }
      .ui-table.pi-table td.chev { display: none; }
      .ui-table.pi-table tbody tr.mine { background: var(--mzo-surface-2); }
      .ui-table.pi-table .ui-empty { grid-column: 1 / -1; }
      .pi-score { min-width: 0; }
    }

    /* Scorecard drawer (kit drawer, wider; full screen on phones) */
    .pi-drawer > section { width: min(780px, 100%); }
    .pi-drawer header .pi-actions { display: flex; gap: 6px; }
    .pi-sc { padding: 2px 20px 32px; font-size: 13px; }
    .pi-sum { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; padding: 16px 0 14px; border-bottom: 1px solid var(--mzo-border); }
    .pi-sum .sc { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .pi-sum .sc small { margin-left: 4px; font-size: 13px; font-weight: 400; color: var(--mzo-muted); letter-spacing: 0; }
    .pi-sum .meta { font-size: 12.5px; color: var(--mzo-muted); }
    .pi-sum .meta b { color: var(--mzo-text); font-weight: 600; }
    .pi-trail { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 10px -6px 0; font-size: 12.5px; }
    .pi-trail button, .pi-trail span.c { display: inline-flex; align-items: center; height: 26px; padding: 0 6px; border-radius: 6px; border: 0; background: none; font: inherit; white-space: nowrap; }
    .pi-trail button { color: var(--mzo-text-2); cursor: pointer; }
    .pi-trail button:hover { background: var(--mzo-hover); color: var(--mzo-text); }
    .pi-trail span.c { color: var(--mzo-text); font-weight: 600; }
    .pi-trail .sep { color: var(--mzo-faint); }
    .pi-sc h4 { margin: 22px 0 8px; font-size: 13px; font-weight: 600; }
    .pi-sc h4 small { margin-left: 6px; font-weight: 400; color: var(--mzo-muted); }
    .pi-why { margin: 0; padding-left: 18px; color: var(--mzo-text-2); line-height: 1.5; }
    .pi-why li { margin: 3px 0; }
    .pi-box { border: 1px solid var(--mzo-border); border-radius: 8px; overflow: hidden; }
    .pi-box + .pi-box { margin-top: 10px; }
    .pi-box .ui-table td, .pi-box .ui-table th { padding: 8px 10px; }
    .pi-box .ui-table td:first-child, .pi-box .ui-table th:first-child { padding-left: 12px; }
    .pi-box .ui-table td:last-child, .pi-box .ui-table th:last-child { padding-right: 12px; }
    .pi-box .ui-table th { position: static; }
    .pi-box-h { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; padding: 9px 12px; background: var(--mzo-surface-2); border-bottom: 1px solid var(--mzo-border); }
    .pi-box-h b { font-weight: 600; }
    .pi-box-h span { font-size: 12.5px; color: var(--mzo-muted); font-variant-numeric: tabular-nums; }
    .pi-box-h .pi-right { display: inline-flex; align-items: center; gap: 10px; }
    .pi-box-h .pi-track { flex: 0 0 120px; width: 120px; }
    .pi-box-n { padding: 7px 12px; font-size: 12px; color: var(--mzo-muted); border-bottom: 1px solid var(--mzo-border); }
    .pi-param { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 12px; border-top: 1px solid var(--mzo-border); }
    .pi-box-h + .pi-param, .pi-box-n + .pi-param { border-top: 0; }
    .pi-param .lbl { font-weight: 500; }
    .pi-param .lbl small { display: block; font-weight: 400; color: var(--mzo-muted); font-size: 12px; }
    .pi-param .mk { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pi-param .mk small { font-weight: 400; color: var(--mzo-muted); }
    .pi-scale { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; color: var(--mzo-muted); font-variant-numeric: tabular-nums; }
    .pi-scale .now { color: var(--mzo-text); font-weight: 500; }
    .pi-src { grid-column: 1 / -1; font-size: 12px; color: var(--mzo-muted); }
    .pi-src span + span::before { content: " · "; color: var(--mzo-faint); }
    .pi-flags { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mzo-text-2); }
    .pi-flags div { display: flex; gap: 7px; align-items: baseline; }
    .pi-flags .ui-badge { flex: none; height: 18px; font-size: 11px; }
    .pi-param.na .lbl { color: var(--mzo-text-2); }
    .pi-param.na .mk { color: var(--mzo-muted); font-weight: 500; }
    .pi-imp td.num b { font-weight: 600; }
    .pi-click { cursor: pointer; }
    .pi-share { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .pi-share .pi-track { flex: 1 1 auto; }
    .pi-share span { width: 38px; text-align: right; color: var(--mzo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    @media (max-width: 720px) {
      .pi-drawer > section { width: 100%; border-left: 0; }
      .pi-sc { padding: 2px 14px 28px; }
      .pi-box .ui-table .hide-sm { display: none; }
      .pi-box-h .pi-track { display: none; }
    }

    /* Methodology */
    .pi-method { padding: 16px 16px 24px; font-size: 13px; }
    .pi-method > p { margin: 0 0 6px; color: var(--mzo-text-2); max-width: 900px; line-height: 1.55; }
    .pi-method h3 { margin: 22px 0 8px; font-size: 13.5px; font-weight: 600; }
    .pi-method h3:first-child { margin-top: 0; }
    .pi-method h3 small { margin-left: 6px; font-weight: 400; color: var(--mzo-muted); }
    .pi-method .basis { margin: -2px 0 8px; font-size: 12.5px; color: var(--mzo-muted); max-width: 900px; line-height: 1.5; }
    .pi-method .ui-table td { vertical-align: top; }
    .pi-method .ui-table td.wrap { min-width: 180px; }
    .pi-method .ref { display: block; margin-top: 2px; font-size: 12px; color: var(--mzo-muted); }
    .pi-rules { display: grid; grid-template-columns: 170px minmax(0, 1fr); margin: 0; border: 1px solid var(--mzo-border); border-radius: 8px; overflow: hidden; }
    .pi-rules dt, .pi-rules dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--mzo-border); }
    .pi-rules dt { color: var(--mzo-muted); background: var(--mzo-surface-2); }
    .pi-rules dd { color: var(--mzo-text-2); line-height: 1.5; }
    .pi-rules dt:nth-last-of-type(1), .pi-rules dd:last-child { border-bottom: 0; }
    .pi-method > p, .pi-method .basis { max-width: 920px; }
    .pi-toc { display: flex; flex-wrap: wrap; gap: 2px; margin: -6px -8px 10px; }
    .pi-toc .ui-btn { height: 26px; padding: 0 8px; font-size: 12.5px; }
    .pi-method h3 { scroll-margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--mzo-border); }
    .pi-method h3:first-of-type { border-top: 0; padding-top: 0; }
    .pi-method h4.pi-mh { margin: 18px 0 6px; font-size: 13px; font-weight: 600; scroll-margin-top: 12px; }
    .pi-method h4.pi-mh small { margin-left: 6px; font-weight: 400; color: var(--mzo-muted); }
    .pi-method .pi-box { margin: 8px 0 4px; }
    .pi-method .pi-why { max-width: 920px; }
    .pi-formula { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 0; padding: 9px 12px; border-radius: 8px; background: var(--mzo-surface-2); font-size: 12.5px; max-width: 920px; }
    .pi-formula .k { color: var(--mzo-muted); }
    .pi-formula code { font-size: 12.5px; color: var(--mzo-text); white-space: normal; }
    .pi-mparam { padding: 11px 12px; border-top: 1px solid var(--mzo-border); scroll-margin-top: 80px; }
    .pi-mparam:first-child { border-top: 0; }
    .pi-mparam.hit { background: var(--mzo-surface-2); box-shadow: inset 0 0 0 1px var(--mzo-border-strong); }
    .pi-mparam .lbl { font-weight: 600; }
    .pi-mparam .lbl small { margin-left: 8px; font-weight: 400; color: var(--mzo-muted); font-size: 12px; }
    .pi-mparam .basis { margin: 4px 0 0; }
    .pi-defs { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 3px 12px; margin: 6px 0 0; font-size: 12.5px; }
    .pi-defs dt { color: var(--mzo-muted); }
    .pi-defs dd { margin: 0; color: var(--mzo-text-2); line-height: 1.45; word-break: break-word; }
    .pi-defs .ref { display: block; margin-top: 1px; }
    .pi-foot { margin-top: 18px; }
    .pi-ex .ui-table { table-layout: fixed; }
    .pi-ex .ui-table th:first-child { width: 40%; }
    @media (max-width: 720px) {
      .pi-defs { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .pi-defs dt { margin-top: 5px; font-size: 11.5px; }
      .pi-method { padding: 14px 12px 20px; }
      .pi-rules { grid-template-columns: minmax(0, 1fr); }
      .pi-rules dt { border-bottom: 0; padding-bottom: 2px; background: none; }
      .pi-method .ui-table-wrap { margin: 0 -12px; }
    }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Performance index<span class="ui-badge ui-date" id="asOn">…</span></h1>
        <p class="pi-meta" id="meta">Loading the rating…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <!-- The signed-in office (this id also keeps MzoScope's "Showing … set by admin" banner off: everyone sees the full ranking) -->
    <div class="pi-you" id="mzo-scope-banner" role="note" hidden></div>
    <p class="pi-dq" id="dq" hidden></p>

    <section class="ui-stats pi-strip" id="strip" aria-label="Malda Zone">
      <div class="ui-stat"><div class="k">Malda Zone</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">&nbsp;</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">&nbsp;</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
      <div class="ui-stat"><div class="k">&nbsp;</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></div>
    </section>

    <section class="ui-panel" id="panel">
      <div class="ui-drill-tabs" role="tablist" aria-label="Level" id="tabs"></div>
      <div class="pi-tools" id="tools" hidden>
        <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search office" autocomplete="off" aria-label="Search office" /></label>
        <span class="ui-select" id="withinWrap" hidden><select id="within" aria-label="Within"></select></span>
        <span class="sp"></span>
        <span class="ui-note" id="count"></span>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="view"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var SVG = 'http://www.w3.org/2000/svg';
    var LEVELS = [{ k: 'region', label: 'Regions', one: 'region', many: 'regions' }, { k: 'division', label: 'Divisions', one: 'division', many: 'divisions' }, { k: 'ccc', label: 'CCCs', one: 'CCC', many: 'CCCs' }];
    var LEVEL_WORD = { zone: 'Zone', region: 'Region', division: 'Division', ccc: 'CCC' };
    var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    var HAS_BROWSER_METRICS = true; // lib/rating_metrics.js ships with this page

    /* ---------------- DOM: text only (no HTML strings from data) ---------------- */
    function h(tag, a, kids) {
      var el = document.createElement(tag);
      if (a) Object.keys(a).forEach(function (k) {
        var v = a[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'on') Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
        else if (k === 'width') el.style.width = v;
        else el.setAttribute(k, v === true ? '' : String(v));
      });
      return add(el, kids);
    }
    function add(el, kids) {
      if (kids == null || kids === false) return el;
      if (Array.isArray(el)) { el.push(kids); return el; }
      if (Array.isArray(kids)) { kids.forEach(function (k) { add(el, k); }); return el; }
      el.appendChild(kids instanceof Node ? kids : document.createTextNode(String(kids)));
      return el;
    }
    function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
    function icon(name) {
      var s = document.createElementNS(SVG, 'svg'), u = document.createElementNS(SVG, 'use');
      s.setAttribute('class', 'ui-i'); s.setAttribute('aria-hidden', 'true'); u.setAttribute('href', '#ui-' + name); s.appendChild(u);
      return s;
    }
    function track(frac) {
      var f = isFinite(frac) ? Math.max(0, Math.min(1, frac)) : 0;
      return h('span', { class: 'pi-track', 'aria-hidden': 'true' }, h('span', { class: 'pi-fill', width: (f > 0 ? Math.max(2, Math.round(f * 100)) : 0) + '%' }));
    }

    /* ---------------- formatting ---------------- */
    function d1(v) { return v == null || !isFinite(v) ? '—' : (Math.round(v * 10) / 10).toFixed(1); }
    function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + d1(Math.abs(v)); }
    function fmtDay(s) { return s ? UI.fmtDate(s) : '—'; }
    function shortDay(s) { var d = UI.date(s); return d ? d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] : '—'; }
    function pctOf(a, b) { return b > 0 ? Math.round(100 * a / b) + '%' : '—'; }
    function lower(s) { return String(s || '').toLowerCase(); }

    /* ---------------- state ---------------- */
    var R = null, SRC = '', bandIdx = {}, mine = { code: null, chain: {} };
    var st = { tab: 'ranking', level: 'region', q: '', within: '', sort: null, office: '', param: '' };

        ])
      ]);
    }
    function inputsTable() {
      var asOn = (R.inputs && R.inputs.asOn) || {}, seen = {}, rowsM = [];
      (R.methodology || []).forEach(function (m) { if (m.metric && !seen[m.metric]) { seen[m.metric] = 1; rowsM.push(m); } });
      return [h('h4', { class: 'pi-mh', id: 'pi-inputs' }, ['Inputs in this rating', h('small', { text: 'with their as-on dates' })]), h('div', { class: 'pi-box' }, h('div', { class: 'ui-table-wrap' }, h('table', { class: 'ui-table' }, [
        h('thead', null, h('tr', null, [h('th', { text: 'Input' }), h('th', { class: 'hide-sm', text: 'Data' }), h('th', { class: 'num', text: 'As on' }), h('th', { class: 'hide-sm', text: 'Period' }), h('th', { text: 'Status' })])),
        h('tbody', null, rowsM.map(function (m) {
          var a = asOn[m.metric] || {};
          return h('tr', null, [
            h('td', { class: 'wrap', text: m.label }),
            h('td', { class: 'wrap hide-sm' }, datasetLinks(a.datasets)),
            h('td', { class: 'num', text: fmtDay(a.asOn) }),
            h('td', { class: 'wrap hide-sm', text: a.period || '' }),
            h('td', null, a.stale ? h('span', { class: 'ui-badge warn', text: 'stale, not scored' }) : h('span', { class: 'ui-badge ok', text: 'current' }))
          ]);
        }))
      ])))];
    }
    function exampleBlock(ex) {
      var o = off(ex.code), lv = levelOf(ex.level);
      var out = [mSection('example', 'Worked example', ex.name + ' ' + (ex.level === 'ccc' ? 'CCC' : ex.level)),
        h('p', null, [ex.name + ' scores ' + d1(ex.score) + ' of 100, grade ', grade({ grade: ex.grade, band: null }), ', rank ' + ex.rank + ' of ' + ex.of + ' ' + (lv ? lv.many : '') + '. Each parameter: marks = maximum × the fraction of the way from the zero-marks level to the full-marks level; the pillar marks add up to the score' + (ex.penaltyTotal ? ', less ' + d1(-ex.penaltyTotal) + ' for safety.' : '.') + ' ',
          o ? h('button', { type: 'button', class: 'pi-link', text: 'Open its scorecard', on: { click: function () { openCard(ex.code); } } }) : null])];
      var sum = 0;
      (ex.pillars || []).forEach(function (p) {
        sum += p.marks || 0;
        add(out, h('div', { class: 'pi-box pi-ex' }, [
          h('div', { class: 'pi-box-h' }, [h('b', { text: p.label }), h('span', { text: d1(p.marks) + ' of ' + d1(p.max) + (p.max !== p.weight ? ' (base ' + p.weight + ')' : '') })]),
          p.note ? h('div', { class: 'pi-box-n', text: p.note.charAt(0).toUpperCase() + p.note.slice(1) + '.' }) : null,
          h('div', { class: 'ui-table-wrap' }, h('table', { class: 'ui-table' }, [
            h('thead', null, h('tr', null, [h('th', { text: 'Parameter' }), h('th', { class: 'num', text: 'Value' }), h('th', { class: 'num hide-sm', text: 'Zero at' }), h('th', { class: 'num hide-sm', text: 'Full at' }), h('th', { class: 'num', text: 'Fraction' }), h('th', { class: 'num', text: 'Marks' })])),
            h('tbody', null, (p.params || []).map(function (x) {
              var sc = x.status === 'scored';
              return h('tr', null, [
                h('td', { class: 'wrap' }, [x.label, !sc && x.naReason ? h('span', { class: 'sub', text: 'n/a: ' + x.naReason }) : null]),
                h('td', { class: 'num', text: x.display || '—' }),
                h('td', { class: 'num hide-sm', text: x.zero }), h('td', { class: 'num hide-sm', text: x.full }),
                h('td', { class: 'num', text: sc && x.fraction != null ? x.fraction.toFixed(2) : 'n/a' }),
                h('td', { class: 'num', text: sc ? d1(x.marks) + ' / ' + d1(x.effMax) : '— / 0' })
              ]);
            }))
          ]))
        ]));
      });
      add(out, h('p', { class: 'pi-formula' }, [h('span', { class: 'k', text: 'Score' }), h('code', { text: (ex.pillars || []).map(function (p) { return d1(p.marks); }).join(' + ') + (ex.penaltyTotal ? ' − ' + d1(-ex.penaltyTotal) : '') + ' = ' + d1(sum + (ex.penaltyTotal || 0)) + ' → ' + ex.grade })]));
      return out;
    }
    function hitParam(id) {
      var el = document.querySelector('[data-param="' + String(id).replace(/[^\w-]/g, '') + '"]');
      [].forEach.call(document.querySelectorAll('.pi-mparam.hit'), function (x) { x.classList.remove('hit'); });
      if (!el) return;
      el.classList.add('hit');
      setTimeout(function () { el.scrollIntoView({ block: 'center' }); }, 0);
    }
    // Older documents without ratingDoc.method: the flat methodology rows and rules.
    function paintMethodRows(box) {
      add(box, h('h3', { text: 'Parameters' }));
      add(box, h('div', { class: 'pi-box' }, (R.methodology || []).map(function (m) {
        return h('div', { class: 'pi-mparam', id: 'm-' + m.id, 'data-param': m.id }, [
          h('div', { class: 'lbl' }, [m.label, h('small', { text: m.pillarLabel + ' · ' + m.max + ' marks' })]),
          defs([['Formula', m.formula], ['Full marks at', m.fullDisplay], ['Zero marks at', m.zeroDisplay], ['Source', (m.sourceText || m.source || '') + (m.ref ? ' — ' + m.ref : '')]])
        ]);
      })));
      var rules = R.rules || {};
      add(box, [h('h3', { text: 'Rules' }), h('dl', { class: 'pi-rules' }, Object.keys(rules).map(function (k) { return [h('dt', { text: k }), h('dd', { text: rules[k] })]; }))]);
      add(box, inputsTable());
      if (st.param) hitParam(st.param);
    }

    /* ---------------- paint ---------------- */
    function paint() {
      paintTabs();
      $('tools').hidden = !R || st.tab !== 'ranking';
      writeUrl();
      if (!R) return;
      if (st.tab === 'methodology') paintMethod(); else paintRanking();
    }
    function fail(msg) {
      R = null;
      clear($('meta')).textContent = msg;
      $('asOn').textContent = '—';
      clear($('strip')).hidden = true;
      paintTabs();
      $('tools').hidden = true;
      add(clear($('view')), h('div', { class: 'ui-empty', text: msg }));
    }
    function use(doc, source) {
      if (!doc || !doc.offices || !doc.levels || !doc.bands) throw new Error('not a rating document');
      R = doc; SRC = source;
      bandIdx = {}; R.bands.forEach(function (b, i) { bandIdx[b.grade] = i; });
      findMine();
      // A signed-in office starts at its own level, unless the link says otherwise.
      if (!new URLSearchParams(location.search).get('level') && off(mine.code) && levelOf(off(mine.code).level)) st.level = off(mine.code).level;
      if (st.office && off(st.office) && levelOf(off(st.office).level) && !new URLSearchParams(location.search).get('level')) st.level = off(st.office).level;
      paintHead(); paintYou(); paintStrip(); paint();
      if (st.office) { if (off(st.office)) openCard(st.office); else { st.office = ''; writeUrl(); } }
    }

    /* ---------------- data: VM precompute → browser compute → (dev) sample ---------------- */
    function getJson(url, force) {
      return fetch(url, { credentials: 'same-origin', cache: force ? 'no-cache' : 'default', headers: { Accept: 'application/json' } })
        .then(function (r) { if (r.status !== 200) return null; return r.json(); });
    }
    function mirrorOn(force) {
      var hub = window.mzoDataHub;
      if (!hub || typeof hub.mirrorManifest !== 'function') return Promise.resolve(false);
      return Promise.resolve(hub.mirrorManifest(!!force)).then(function (m) { return !!m; }).catch(function () { return false; });
    }
    var scripts = {};
    function script(src) {
      if (!scripts[src]) scripts[src] = new Promise(function (resolve, reject) {
        var s = document.createElement('script'); s.src = src; s.async = false;
        s.onload = resolve; s.onerror = function () { delete scripts[src]; reject(new Error('could not load ' + src)); };
        document.head.appendChild(s);
      });
      return scripts[src];
    }
    // In-browser path (Vercel, or the VM before its precompute is ready): metrics from the app's own
    // datasets (lib/rating_metrics.js), then the engine (lib/rating.js). Both are loaded only when needed.
    // MzoRatingMetrics.compute(null) loads every dataset it needs through MzoRows (all offices: ranks need them all).
    var BROWSER_SCRIPTS = HAS_BROWSER_METRICS ? ['/mzo_rows.js?v=7', '/lib/rating_metrics.js?v=4', '/lib/rating.js?v=1'] : null;
    function browserRating() {
      if (!BROWSER_SCRIPTS) return Promise.reject(new Error('The rating is not available here yet.'));
      return Promise.all(BROWSER_SCRIPTS.map(script)).then(function () {
        var M = window.MzoRatingMetrics, E = window.MzoRating;
        if (!M || typeof M.compute !== 'function' || !E || typeof E.rate !== 'function') throw new Error('The rating engine did not load.');
        // MzoRows.get checks each dataset's version (the refresh button resets DataHub's checks first).
        return M.compute(null, { rated: true }); // only the metrics the engine scores (17 datasets, not 37)
      }).then(function (metrics) {
        if (!metrics || !metrics.offices) throw new Error('The rating inputs could not be loaded.');
        return window.MzoRating.rate(metrics);
      });
    }
    function load(force) {
      var btn = $('refreshBtn');
      btn.classList.add('spin');
      var p = new URLSearchParams(location.search), job;
      if (LOCAL && p.get('sample') === '1') job = getJson('/docs/rating/sample-rating.json', force).then(function (d) { return { doc: d, src: 'sample' }; });
      else job = mirrorOn(force).then(function (on) { return on ? getJson('/api/data/rating', force).catch(function () { return null; }) : null; })
        .then(function (d) {
          if (d && d.offices) return { doc: d, src: 'vm' };
          if (!R && BROWSER_SCRIPTS) $('meta').textContent = 'Computing the rating from the report data in this browser…';
          return browserRating().then(function (x) { return { doc: x, src: 'browser' }; });
        });
      return job.then(function (r) {
        if (!r || !r.doc) throw new Error('The rating could not be loaded.');
        use(r.doc, r.src);
      }).catch(function (e) {
        if (!R) fail((e && e.message) || 'The rating could not be loaded.');
        else UI.toast('Could not refresh the rating');
      }).then(function () { btn.classList.remove('spin'); });
    }

    window.addEventListener('hashchange', function () {
      if (!readHash()) return;
      if (drawer && !drawer.hidden) { drawer.hidden = true; }
      paint();
      if (!st.param) { var t = $('panel'); if (t) t.scrollIntoView({ block: 'start' }); }
    });
    $('refreshBtn').addEventListener('click', function () { var hub = window.mzoDataHub; try { if (hub && hub.resetVersionChecks) hub.resetVersionChecks(); } catch (e) {} load(true); });

    readUrl();
    paintTabs();
    load(false);
  });
  </script>
</body>
</html>
