<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WRIDD schemes · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=17" />
  <script src="/mzo_ui.js?v=14" defer></script>
  <script src="/mzo_data_hub.js?v=93" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=18" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <style>
    .ui-head { align-items: center; }
    .cl-kpis .ui-stat { padding: 13px 14px 14px; }
    .cl-hint { padding: 8px 16px; color: var(--mzo-muted); font-size: 12.5px; border-bottom: 1px solid var(--mzo-border); }
    .cl-hint:empty { display: none; }
    .remark { display: block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>WRIDD schemes<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn" id="topBtn">Pending schemes</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Scheme, block, mouza, remark" autocomplete="off" aria-label="Search schemes" title="Search scheme, block, mouza or remark" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Status" id="fStatus"></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Scheme type and reasons">
            <button type="button" role="tab" data-pane="fType" aria-pressed="true" aria-selected="true">Scheme type</button>
            <button type="button" role="tab" data-pane="fReason" aria-pressed="false" aria-selected="false">Why pending</button>
          </div>
          <div aria-label="Scheme type" id="fType"></div>
          <div aria-label="Why pending" id="fReason" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats cl-kpis" id="kpis" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Schemes</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="done"><div class="k"><span class="ui-dot ok"></span>Effected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="land"><div class="k"><span class="ui-dot bad"></span>Land / objection</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="core"><div class="k">Core sector</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="cl-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var ROWS = 'wridd_schemes';
    var STATUS = { done: { label: 'Effected', cls: 'ok' }, pending: { label: 'Pending', cls: 'warn' } };
    var REASON_DOTS = {
      'Land / objection': 'bad',
      'Material / erection': 'warn',
      'Quotation / payment': 'warn',
      'Pole / DTR testing': '',
      'Not reported': '',
      'Other': ''
    };
    var TABS = [
      ['region', 'Region'], ['division', 'Division'], ['ccc', 'CCC'],
      ['schemes', 'Schemes'], ['reason', 'Why pending'], ['type', 'Scheme type']
    ];
    var all = [], f = { q: '', status: '', reason: '', type: '' }, tab = 'region', renderedTab = '', scope = null, lastTable = null, lastList = null, first = true;
    var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter'];
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function parseType(row) {
      var t = (row.remarks_project_name + ' ' + row.name_of_scheme).toUpperCase();
      return /MIDI/.test(t) ? 'MIDI RLI' : /MAJOR/.test(t) ? 'Major RLI' : /LDTW/.test(t) ? 'LDTW' : /DTW/.test(t) ? 'DTW' : 'Other';
    }
    function parseReason(text) {
      var t = String(text || '').toLowerCase();
      if (!t || /^n\.?a\.?$/.test(t)) return 'Not reported';
      if (/test/.test(t)) return 'Pole / DTR testing';
      if (/quotation|payment|deposit/.test(t)) return 'Quotation / payment';
      if (/material|transformer|dtr|pole/.test(t)) return 'Material / erection';
      if (/land|objection|row|right of way|dispute/.test(t)) return 'Land / objection';
      return 'Other';
    }

    // t.rows: uniform rows of schema/wridd_schemes.json, already scoped to the login by MzoRows. The sheet
    // covers the whole state: a scheme is in Malda Zone when its CCC is one of the zone's (canonical _ccc,
    // the sheet's spellings included); the rest have no canonical office and are left out.
    function prepare(t) {
      var statewide = t.stats ? t.stats.source_rows : t.all.length;
      all = [];
      t.rows.forEach(function (d) {
        if (!d._ccc) return;
        var statusText = d.status_of_connection_as_on_date || d.status_of_connection_as_per_previous_report;
        var r = {
          name: d.name_of_scheme || 'Unnamed scheme', type: parseType(d),
          _region: d._region, _divn: d._division, _supp: d._ccc,
          district: d.district, block: d.block, mouza: d.mouza, jl: d.jl_no, plot: d.location_plot_no,
          statusText: statusText, st: /effected/i.test(statusText) ? 'done' : 'pending',
          remarks: d.remarks_project_name, prevRemarks: d.previous_remarks, presentRemarks: d.present_remarks,
          brief: d.brief_of_subjects_vis_a_vis_linked_projects, local: d.any_local_communication_made_with_the_requiring_authority_wb, toWridd: d.whether_communicated_to_wri_dd,
          circle: d.name_of_circle_division
        };
        r.core = /core sector/i.test(r.remarks + ' ' + r.brief + ' ' + r.local);
        r.reason = r.st === 'pending' ? parseReason(statusText + ' ' + r.brief) : '';
        r.search = [r.name, r.block, r.mouza, r.remarks, r.prevRemarks, d.ccc].join(' ').toLowerCase();
        all.push(r);
      });
      $('asOn').textContent = UI.n(all.length) + ' schemes';
      $('asOn').title = UI.n(all.length) + ' schemes in Malda Zone · ' + UI.n(statewide) + ' statewide';
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
      SELECTS.forEach(function (id) { UI.mark($(id)); });
    }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }

    function matchStatus(r, k) {
      if (!k) return true;
      if (k === 'core') return r.core;
      if (k === 'land') return r.st === 'pending' && r.reason === 'Land / objection';
      return r.st === k;
    }

    // Filters based on offices, search text and optionally status/reason/type.
    function filtered(skip) {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, cc = $('cccFilter').value;
      return all.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (cc && r._supp !== cc) return false;
        if (q && r.search.indexOf(q) === -1) return false;
        if (skip !== 'status' && !matchStatus(r, f.status)) return false;
        if (skip !== 'reason' && f.reason && r.reason !== f.reason) return false;
        if (skip !== 'type' && f.type && r.type !== f.type) return false;
        return true;
      });
    }

    function renderFacets() {
      var b = filtered('all');
      var cDone = b.filter(function (r) { return r.st === 'done'; }).length;
      var cPend = b.filter(function (r) { return r.st === 'pending'; }).length;
      var cCore = b.filter(function (r) { return r.core; }).length;

      var stOpts = [
        { value: 'done', label: 'Effected', count: cDone, dot: 'ok' },
        { value: 'pending', label: 'Pending', count: cPend, dot: 'warn' },
        { value: 'core', label: 'Core sector projects', count: cCore }
      ];
      UI.facet('fStatus', stOpts, f.status === 'land' ? 'pending' : f.status, function (v) {
        f.status = v;
        if (f.status === 'done') f.reason = '';
        render();
      });

      // Scheme types
      var bType = filtered('type');
      var tc = {};
      bType.forEach(function (r) { tc[r.type] = (tc[r.type] || 0) + 1; });
      var typeOpts = Object.keys(tc).sort(function (x, y) { return tc[y] - tc[x]; }).map(function (k) {
        return { value: k, label: k, count: tc[k] };
      });
      UI.facet('fType', typeOpts, f.type, function (v) { f.type = v; render(); });

      // Pending reasons
      var bReason = filtered('reason').filter(function (r) { return r.st === 'pending'; });
      var rc = {};
      bReason.forEach(function (r) { rc[r.reason] = (rc[r.reason] || 0) + 1; });
      var reasonOpts = Object.keys(rc).sort(function (x, y) { return rc[y] - rc[x]; }).map(function (k) {
        return { value: k, label: k, count: rc[k], dot: REASON_DOTS[k] || '' };
      });
      UI.facet('fReason', reasonOpts, f.reason, function (v) {
        f.reason = v;
        if (f.reason) f.status = 'pending';
        render();
      });

      var active = (f.q ? 1 : 0) + (f.status ? 1 : 0) + (f.type ? 1 : 0) + (f.reason ? 1 : 0) +
        SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
      setActive(active, { fType: f.type, fReason: f.reason });
    }

    function render() {
      renderFacets();
      var b = filtered('all'); // panel filters only (offices + q)
      var total = b.length;
      var cDone = b.filter(function (r) { return r.st === 'done'; }).length;
      var cPend = b.filter(function (r) { return r.st === 'pending'; }).length;
      var cLand = b.filter(function (r) { return r.st === 'pending' && r.reason === 'Land / objection'; }).length;
      var cCore = b.filter(function (r) { return r.core; }).length;

      var stats = [
        { k: '', label: 'Schemes', v: total, s: UI.n(UI.uniq(b, '_supp').length) + ' CCCs' },
        { k: 'done', label: 'Effected', dot: 'ok', v: cDone, s: UI.pct(cDone, total) + ' completion rate' },
        { k: 'pending', label: 'Pending', dot: 'warn', v: cPend, s: UI.pct(cPend, total) + ' of schemes' },
        { k: 'land', label: 'Land / objection', dot: 'bad', v: cLand, s: UI.pct(cLand, cPend) + ' of pending' },
        { k: 'core', label: 'Core sector', dot: '', v: cCore, s: UI.pct(cCore, total) + ' priority projects' }
      ];
      [].forEach.call(document.querySelectorAll('#kpis .ui-stat'), function (el, i) {
        var s = stats[i];
        if (!s) return;
        el.setAttribute('data-k', s.k);
        el.querySelector('.v').textContent = UI.n(s.v);
        el.querySelector('.s').textContent = s.s;
        el.setAttribute('aria-pressed', String(f.status === s.k));
      });

      var view = filtered(''); // all active filters combined
      $('tabs').innerHTML = TABS.map(function (t) {
        var extra = t[0] === 'schemes' ? '<small>' + UI.n(view.length) + '</small>' : '';
        return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
      }).join('');

      var stTitle = f.status === 'done' ? 'effected schemes' : f.status === 'pending' ? 'pending schemes' : f.status === 'land' ? 'land objection cases' : f.status === 'core' ? 'core sector projects' : '';
      $('hint').textContent = (stTitle ? 'Showing ' + stTitle + ' only.' : '');

      renderReportHead(view);
      renderTab(view, b);
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
      var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
      var stTitle = f.status === 'done' ? 'Effected' : f.status === 'pending' ? 'Pending' : f.status === 'land' ? 'Land Objection' : f.status === 'core' ? 'Core Sector' : '';

      $('rhTitle').textContent = tabLabel + (stTitle ? ' · ' + stTitle : '');

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> schemes';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' schemes';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if ($('regionFilter').value && !$('regionFilter').disabled) {
        currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { set('regionFilter', ''); set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); } });
      }
      if ($('divisionFilter').value && !$('divisionFilter').disabled) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { set('divisionFilter', ''); set('cccFilter', ''); fillFilters(); } });
      }
      if ($('cccFilter').value && !$('cccFilter').disabled) {
        currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { set('cccFilter', ''); fillFilters(); } });
      }
      if (f.status && stTitle) {
        currentActiveFilters.push({ label: 'Status', value: stTitle, clear: function () { f.status = ''; } });
      }
      if (f.type) {
        currentActiveFilters.push({ label: 'Type', value: f.type, clear: function () { f.type = ''; } });
      }
      if (f.reason) {
        currentActiveFilters.push({ label: 'Reason', value: f.reason, clear: function () { f.reason = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    function renderTab(view, b) {
      lastTable = null;
      lastList = null;
      var cfg = null;

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        var key = tab === 'region' ? '_region' : tab === 'division' ? '_divn' : '_supp', groups = {};
        view.forEach(function (r) {
          var name = r[key] || 'Unmapped';
          var g = groups[name] || (groups[name] = {
            name: name,
            parent: tab === 'ccc' ? r._divn : tab === 'division' ? r._region : '',
            n: 0, done: 0, pending: 0
          });
          g.n++;
          g[r.st]++;
        });
        var list = Object.keys(groups).map(function (k) { return groups[k]; });
        var label = tab === 'ccc' ? 'CCC' : tab === 'division' ? 'Division' : 'Region';
        var sumN = view.length, sumDone = view.filter(function (r) { return r.st === 'done'; }).length;
        var sumPend = view.filter(function (r) { return r.st === 'pending'; }).length;

        lastTable = {
          title: label,
          cols: [label, 'Schemes', 'Effected', 'Pending', 'Completion %'],
          rows: list.slice().sort(function (a, b) { return b.pending - a.pending; }).map(function (g) {
            return [g.name, g.n, g.done, g.pending, UI.pct(g.done, g.n)];
          })
        };

        cfg = {
          rows: list, sort: { key: 'pending', dir: 'desc' }, count: false, empty: 'No schemes for these filters.',
          columns: [
            { key: 'name', label: label, fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Schemes', num: true, fmt: UI.n },
            { key: 'done', label: 'Effected', num: true, hideSm: true, fmt: UI.n },
            { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
            { key: 'rate', label: 'Effected', sortVal: function (g) { return g.n ? g.done / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.done, g.n, UI.pct(g.done, g.n), 2); }, width: '28%' }
          ],
          foot: list.length > 1 ? { n: sumN, done: sumDone, pending: sumPend, rate: 0 } : null,
          onRow: tab === 'ccc' ? null : function (g) { drill(tab, g.name); },
          selected: tab === 'ccc' ? function (g) { return $('cccFilter').value === g.name; } : null
        };
      }
      else if (tab === 'reason') {
        var hb = view.filter(function (r) { return r.st === 'pending'; }), rc = {};
        hb.forEach(function (r) { rc[r.reason] = (rc[r.reason] || 0) + 1; });
        var reasons = Object.keys(rc).sort(function (x, y) { return rc[y] - rc[x]; }).map(function (k) {
          return { name: k, count: rc[k], dot: REASON_DOTS[k] || '' };
        });
        var totalP = hb.length || 1;
        lastTable = {
          title: 'Why pending',
          cols: ['Reason', 'Pending schemes', 'Share of pending'],
          rows: reasons.map(function (r) { return [r.name, r.count, UI.pct(r.count, totalP)]; })
        };
        cfg = {
          rows: reasons, sort: null, count: false, empty: 'No pending schemes for these filters.',
          columns: [
            { key: 'name', label: 'Reason', fmt: function (v, r) { return (r.dot ? '<span class="ui-dot ' + r.dot + '" style="margin-right:8px"></span>' : '') + '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
            { key: 'count', label: 'Pending schemes', num: true, fmt: UI.n },
            { key: 'share', label: 'Share', sortVal: function (r) { return r.count; }, fmt: function (_, r) { return UI.bar(r.count, totalP, UI.pct(r.count, totalP)); }, width: '32%' }
          ],
          foot: reasons.length > 1 ? { name: 'Total pending', count: hb.length } : null,
          onRow: function (r) { f.reason = f.reason === r.name ? '' : r.name; if (f.reason) f.status = 'pending'; render(); }
        };
      }
      else if (tab === 'type') {
        var tc = {};
        view.forEach(function (r) {
          var g = tc[r.type] || (tc[r.type] = { name: r.type, n: 0, done: 0, pending: 0 });
          g.n++; g[r.st]++;
        });
        var types = Object.keys(tc).map(function (k) { return tc[k]; });
        var totalN = view.length || 1;
        lastTable = {
          title: 'Scheme type',
          cols: ['Type', 'Schemes', 'Effected', 'Pending', 'Effected %'],
          rows: types.map(function (t) { return [t.name, t.n, t.done, t.pending, UI.pct(t.done, t.n)]; })
        };
        cfg = {
          rows: types, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No schemes for these filters.',
          columns: [
            { key: 'name', label: 'Type', fmt: function (v) { return '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
            { key: 'n', label: 'Schemes', num: true, fmt: UI.n },
            { key: 'done', label: 'Effected', num: true, hideSm: true, fmt: UI.n },
            { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
            { key: 'rate', label: 'Effected', sortVal: function (t) { return t.n ? t.done / t.n : 0; }, fmt: function (_, t) { return UI.bar(t.done, t.n, UI.pct(t.done, t.n), 2); }, width: '28%' }
          ],
          foot: types.length > 1 ? { name: 'Total', n: view.length, done: view.filter(function (r) { return r.st === 'done'; }).length, pending: view.filter(function (r) { return r.st === 'pending'; }).length } : null,
          onRow: function (t) { f.type = f.type === t.name ? '' : t.name; render(); }
        };
      }
      else {
        // Schemes list
        lastList = view;
        lastTable = {
          title: 'Schemes',
          cols: ['Scheme', 'Type', 'Region', 'Division', 'CCC', 'Block', 'Mouza', 'Status', 'Latest note'],
          rows: view.map(function (r) { return [r.name, r.type, r._region, r._divn, r._supp, r.block, r.mouza, STATUS[r.st].label, r.statusText]; })
        };
        cfg = {
          rows: view, sort: { key: 'st', dir: 'desc' }, limit: 50, resetPage: true,
          empty: 'No schemes match these filters.',
          columns: COLS,
          onRow: detail
        };
      }

      var k = tab + ':' + f.status + ':' + f.reason + ':' + f.type;
      if (renderedTab !== k) { $('table').__ui = null; renderedTab = k; }
      UI.table('table', cfg);
    }

    var COLS = [
      { key: 'name', label: 'Scheme', cls: 'wrap', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + UI.esc(r.type) + (r.core ? ' · Core sector' : '') + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'block', label: 'Block · mouza', hideSm: true, fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r.mouza || '') + '</span>'; }, csv: function (r) { return [r.block, r.mouza].filter(Boolean).join(' / '); } },
      { key: 'statusText', label: 'Latest note', hideSm: true, fmt: function (v) { return '<span class="remark" title="' + UI.esc(v) + '">' + UI.esc(v || '—') + '</span>'; } },
      { key: 'st', label: 'Status', sortVal: function (r) { return r.st === 'pending' ? 1 : 0; }, fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer(r.name, [STATUS[r.st].label, r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Status note', r.statusText], ['Scheme type', r.type + (r.core ? ' · Core sector' : '')], ['Pending reason', r.reason || '—'],
        ['Project / remarks', r.remarks], ['Brief', r.brief], ['Previous remarks', r.prevRemarks], ['Present remarks', r.presentRemarks],
        ['District', r.district], ['Block', r.block], ['Mouza', r.mouza], ['JL no.', r.jl], ['Plot no.', r.plot],
        ['Local communication', r.local], ['Communicated to WRI&DD', r.toWridd], ['Circle / division', r.circle]
      ], '', '<button type="button" class="ui-btn sm" data-copy-detail>Copy details</button>');
      var copyBtn = document.querySelector('[data-copy-detail]');
      if (copyBtn) {
        copyBtn.onclick = function () {
          var lines = [
            'Scheme: ' + r.name,
            'Status: ' + STATUS[r.st].label + ' (' + (r.statusText || '—') + ')',
            'Office: ' + [r._supp, r._divn, r._region].filter(Boolean).join(', '),
            'Type: ' + r.type + (r.core ? ' (Core sector)' : ''),
            'Location: ' + [r.block, r.mouza, r.district].filter(Boolean).join(', '),
            'Pending reason: ' + (r.reason || '—'),
            'Remarks: ' + (r.remarks || r.presentRemarks || '—')
          ];
          UI.copy(lines.join('\n')).then(function () { UI.toast('Scheme details copied'); });
        };
      }
    }

    function drill(level, name) {
      if (name === 'Unmapped' || name === 'Other') return;
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); tab = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); tab = 'ccc'; }
      else { set('cccFilter', $('cccFilter').value === name ? '' : name); tab = 'schemes'; }
      fillFilters(); render();
    }

    /* ---------- URL params (Ask, shared links) ---------- */
    // ?region= ?division= ?ccc= ?q= ?status=done|pending|core|land ?type= ?reason= ?tab=
    function applyUrl() {
      var p = new URLSearchParams(location.search), pick = function (id, v) {
        var el = $(id); if (!v || el.disabled) return false;
        var m = [].filter.call(el.options, function (o) { return o.value && o.value.toLowerCase() === String(v).trim().toLowerCase(); })[0];
        if (m) { el.value = m.value; fillFilters(); return true; } return false;
      };
      pick('regionFilter', p.get('region')); pick('divisionFilter', p.get('division')); pick('cccFilter', p.get('ccc'));
      if (p.get('q')) { f.q = p.get('q').trim(); $('q').value = f.q; }
      var st = String(p.get('status') || '').trim();
      if (/done|pending|core|land/.test(st)) f.status = st;
      if (p.get('type')) f.type = p.get('type');
      if (p.get('reason')) f.reason = p.get('reason');
      if (TABS.some(function (t) { return t[0] === p.get('tab'); })) tab = p.get('tab');
    }

    /* ---------- events ---------- */
    SELECTS.forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () {
      f.q = this.value.trim();
      if (f.q && tab !== 'schemes') tab = 'schemes';
      render();
    }, 180));
    $('kpis').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat'); if (!s) return;
      var k = s.getAttribute('data-k');
      f.status = f.status === k ? '' : k;
      if (f.status === 'done') f.reason = '';
      render();
    });
    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-drill-tab'); if (t) { tab = t.getAttribute('data-t'); render(); } });
    $('topBtn').addEventListener('click', function () {
      tab = 'schemes'; f.status = 'pending'; renderedTab = ''; render();
      $('table').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    function clearAll() {
      f.q = ''; f.status = ''; f.reason = ''; f.type = '';
      $('q').value = '';
      SELECTS.forEach(function (id) { set(id, ''); });
      tab = scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region';
      fillFilters(); render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });
    $('copyBtn').addEventListener('click', function () {
      if (!lastTable) return;
      var lines = ['*WRIDD schemes — ' + lastTable.title + '*' + (f.status ? ' (' + f.status + ')' : ''), lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
      UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
    });
    $('exportBtn').addEventListener('click', function () {
      if (lastList) {
        UI.exportCsv('wridd-schemes.csv', [
          { key: 'name', label: 'Scheme' }, { key: 'type', label: 'Type' }, { key: '_region', label: 'Region' },
          { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'district', label: 'District' },
          { key: 'block', label: 'Block' }, { key: 'mouza', label: 'Mouza' }, { key: 'st', label: 'Status', csv: function (r) { return STATUS[r.st].label; } },
          { key: 'reason', label: 'Pending reason' }, { key: 'statusText', label: 'Status note' }, { key: 'remarks', label: 'Remarks' }
        ], lastList);
        return;
      }
      if (!lastTable) return;
      UI.exportCsv('wridd-schemes-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
    });

    MzoRows.refresh('refreshBtn', ROWS, function (t) { prepare(t); render(); });

    MzoRows.load(ROWS, function (t, info) {
      if (!t) { if (info && info.error && !all.length) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc'; else if (scope && scope.level === 'region') tab = 'division';
        applyUrl();
      }
      render();
    });
  });
  </script>
</body>
</html>
