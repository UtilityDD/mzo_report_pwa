<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WRIDD schemes · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .remark { display: block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mzo-muted); }
    #reasonHist .row { grid-template-columns: 140px minmax(0, 1fr) 48px; }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>WRIDD schemes</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Scheme, block, mouza or remark" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:4" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Schemes</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="done"><div class="k"><span class="ui-dot ok"></span>Connection effected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="core"><div class="k">Core sector</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Why pending</h2></div>
          <div class="ui-panel-b"><div id="reasonHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Scheme type</h2></div>
          <div class="ui-panel-b"><div id="typeHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Schemes <small id="appCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var STATUS = { done: { label: 'Effected', cls: 'ok' }, pending: { label: 'Pending', cls: 'warn' } };
    // Sheet spellings → office names (the sheet covers the whole state; only Malda Zone CCCs are kept).
    var OVERRIDES = { kushmandi: 'Kusmandi', hcpur: 'Harishchandrapur', bamangola: 'Bamongola', gazol: 'Gazole', golapgang: 'Golapganj', sujpur: 'Sujapur', oldmalda: 'Old Malda', aiho: 'Aiho' };
    var all = [], f = { q: '', status: '', reason: '', type: '' }, level = 'region', scope = null, cccIndex = null;

    function clean(s) { return String(s || '').toLowerCase().replace(/\s+ccc$/i, '').replace(/\s+division$/i, '').replace(/[^a-z0-9]/g, ''); }
    function buildIndex() {
      cccIndex = {};
      var H = (window.MzoScope && window.MzoScope.HIERARCHY) || {};
      Object.keys(H).forEach(function (r) {
        Object.keys(H[r].divisions || {}).forEach(function (d) {
          (H[r].divisions[d].cccs || []).forEach(function (c) { cccIndex[clean(c)] = { region: r, division: d, ccc: c }; });
        });
      });
      Object.keys(OVERRIDES).forEach(function (k) { var p = window.MzoScope && window.MzoScope.parentOfCcc(OVERRIDES[k]); if (p) cccIndex[k] = p; });
    }
    function col(row, re) { var k = Object.keys(row).filter(function (h) { return re.test(h); })[0]; return k ? String(row[k] || '').trim() : ''; }
    function type(row) {
      var t = (row['Remarks/ Project name'] + ' ' + row['Name of scheme']).toUpperCase();
      return /MIDI/.test(t) ? 'MIDI RLI' : /MAJOR/.test(t) ? 'Major RLI' : /LDTW/.test(t) ? 'LDTW' : /DTW/.test(t) ? 'DTW' : 'Other';
    }
    function reason(text) {
      var t = String(text || '').toLowerCase();
      if (!t || /^n\.?a\.?$/.test(t)) return 'Not reported';
      if (/test/.test(t)) return 'Pole / DTR testing';
      if (/quotation|payment|deposit/.test(t)) return 'Quotation / payment';
      if (/material|transformer|dtr|pole/.test(t)) return 'Material / erection';
      if (/land|objection|row|right of way|dispute/.test(t)) return 'Land / objection';
      return 'Other';
    }

    function prepare(text) {
      if (!cccIndex) buildIndex();
      var rows = UI.csv(text), statewide = rows.length;
      all = [];
      rows.forEach(function (d, i) {
        var m = cccIndex[clean(d.CCC)];
        if (!m) return;
        var now = col(d, /^status of connection as on date/i), prev = col(d, /^status of connection as per previous/i), statusText = now || prev;
        var r = {
          id: i, name: String(d['Name of scheme'] || '').trim() || 'Unnamed scheme', type: type(d),
          _region: m.region, _divn: m.division, _supp: m.ccc,
          district: d.District, block: d.Block, mouza: d.Mouza, jl: d['Jl. no.'], plot: col(d, /^location/i),
          statusText: statusText, st: /effected/i.test(statusText) ? 'done' : 'pending',
          remarks: String(d['Remarks/ Project name'] || '').trim(), prevRemarks: col(d, /^previous remarks/i), presentRemarks: col(d, /^present remarks/i),
          brief: col(d, /^brief of subjects/i), local: col(d, /^any local communication/i), toWridd: col(d, /^whether communicated/i),
          circle: d['Name of Circle / Division']
        };
        r.core = /core sector/i.test(r.remarks + ' ' + r.brief + ' ' + r.local);
        r.reason = r.st === 'pending' ? reason(statusText + ' ' + r.brief) : '';
        r.search = [r.name, r.block, r.mouza, r.remarks, r.prevRemarks, d.CCC].join(' ').toLowerCase();
        all.push(r);
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      $('meta').textContent = UI.n(all.length) + ' schemes in Malda Zone · ' + UI.n(statewide) + ' statewide';
      fillFilters();
    }

    function fillFilters() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }

    function base() {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) { return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!q || r.search.indexOf(q) !== -1); });
    }
    function match(r, k) { return !k || (k === 'core' ? r.core : r.st === k); }

    function render() {
      var b = base();
      var view = b.filter(function (r) { return match(r, f.status) && (!f.reason || r.reason === f.reason) && (!f.type || r.type === f.type); });

      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = b.filter(function (r) { return match(r, k); }).length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = !k ? UI.n(UI.uniq(b, '_supp').length) + ' CCCs' : UI.pct(c, b.length) + ' of schemes';
        el.setAttribute('aria-pressed', String(f.status === k));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      view.forEach(function (r) {
        var g = groups[r[key]] || (groups[r[key]] = { name: r[key], parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, done: 0, pending: 0 });
        g.n++; g[r.st]++;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      var td = view.filter(function (r) { return r.st === 'done'; }).length;
      UI.table('officeTable', {
        rows: list, sort: { key: 'pending', dir: 'desc' }, count: false, empty: 'No schemes for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Schemes', num: true, fmt: UI.n },
          { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
          { key: 'rate', label: 'Effected', sortVal: function (g) { return g.n ? g.done / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.done, g.n, UI.pct(g.done, g.n)); }, width: '30%' }
        ],
        foot: list.length > 1 ? { n: view.length, pending: view.length - td, done: td, rate: 0 } : null,
        onRow: function (g) { drill(g.name); }
      });

      var hb = b.filter(function (r) { return r.st === 'pending' && (!f.type || r.type === f.type); }), rc = {};
      hb.forEach(function (r) { rc[r.reason] = (rc[r.reason] || 0) + 1; });
      UI.hist('reasonHist', Object.keys(rc).sort(function (x, y) { return rc[y] - rc[x]; }).map(function (k) { return { key: k, label: k, value: rc[k] }; }),
        { active: f.reason, onClick: function (row) { f.reason = f.reason === row.key ? '' : row.key; if (f.reason) f.status = 'pending'; render(); } });
      if (!hb.length) { $('reasonHist').className = ''; $('reasonHist').innerHTML = '<div class="ui-empty">Nothing pending.</div>'; }
      var tc = {};
      b.filter(function (r) { return match(r, f.status) && (!f.reason || r.reason === f.reason); }).forEach(function (r) { tc[r.type] = (tc[r.type] || 0) + 1; });
      UI.hist('typeHist', Object.keys(tc).sort(function (x, y) { return tc[y] - tc[x]; }).map(function (k) { return { key: k, label: k, value: tc[k] }; }),
        { active: f.type, onClick: function (row) { f.type = f.type === row.key ? '' : row.key; render(); } });

      $('appCount').textContent = UI.n(view.length);
      UI.table('appTable', { rows: view, sort: { key: 'st', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No schemes match these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.status || f.reason || f.type || ($('regionFilter').value && !$('regionFilter').disabled) || ($('divisionFilter').value && !$('divisionFilter').disabled) || ($('cccFilter').value && !$('cccFilter').disabled));
      window.__view = view;
    }

    var COLS = [
      { key: 'name', label: 'Scheme', cls: 'wrap', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + UI.esc(r.type) + (r.core ? ' · Core sector' : '') + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'block', label: 'Block · mouza', hideSm: true, fmt: function (v, r) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(r.mouza || '') + '</span>'; }, csv: function (r) { return [r.block, r.mouza].filter(Boolean).join(' / '); } },
      { key: 'statusText', label: 'Latest note', hideSm: true, fmt: function (v) { return '<span class="remark" title="' + UI.esc(v) + '">' + UI.esc(v || '—') + '</span>'; } },
      { key: 'st', label: 'Status', sortVal: function (r) { return r.st === 'pending' ? 1 : 0; }, fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer(r.name, [STATUS[r.st].label, r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Status note', r.statusText], ['Scheme type', r.type + (r.core ? ' · Core sector' : '')], ['Project / remarks', r.remarks],
        ['Brief', r.brief], ['Previous remarks', r.prevRemarks], ['Present remarks', r.presentRemarks],
        ['District', r.district], ['Block', r.block], ['Mouza', r.mouza], ['JL no.', r.jl], ['Plot no.', r.plot],
        ['Local communication', r.local], ['Communicated to WRI&DD', r.toWridd], ['Circle / division (sheet)', r.circle]
      ]);
    }

    function tabs() { [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); }); }
    function setLevel(l) { level = l; tabs(); render(); }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (x) { UI.mark($(x)); }); }
    function set(id, v) { if (!$(id).disabled) $(id).value = v; }
    function drill(name) {
      if (level === 'region') { set('regionFilter', name); set('divisionFilter', ''); set('cccFilter', ''); level = 'division'; }
      else if (level === 'division') { set('divisionFilter', name); set('cccFilter', ''); level = 'ccc'; }
      else set('cccFilter', $('cccFilter').value === name ? '' : name);
      fillFilters(); markAll(); setLevel(level);
    }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') set('divisionFilter', '');
        if (id !== 'cccFilter') set('cccFilter', '');
        fillFilters(); markAll(); render();
      });
    });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.status = f.status === k ? '' : k; if (f.status !== 'pending') f.reason = ''; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.status = ''; f.reason = ''; f.type = ''; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { set(id, ''); });
      fillFilters(); markAll(); render();
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('wridd-schemes.csv', [{ key: 'name', label: 'Scheme' }, { key: 'type', label: 'Type' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'district', label: 'District' }, { key: 'block', label: 'Block' }, { key: 'mouza', label: 'Mouza' }, { key: 'statusText', label: 'Status note' }, COLS[4], { key: 'remarks', label: 'Remarks' }], window.__view || []);
    });
    UI.refresh('refreshBtn', 'CACHE_WRIDD', function (t) { prepare(t); render(); });

    var first = true;
    UI.load('CACHE_WRIDD', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('appTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        tabs();
      }
      render();
    });
  });
  </script>
</body>
</html>
