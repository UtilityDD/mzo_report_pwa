# MZO VM: keep the journal on disk, capped. deploy.sh installs this file as
# /etc/systemd/journald.conf.d/mzo.conf (and creates /var/log/journal), then restarts journald.
# Without it the journal lives in /run (tmpfs, about 30 hours) and a reboot erases it.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=2G
SystemMaxFileSize=20M
MaxRetentionSec=30day
RuntimeMaxUse=16M
