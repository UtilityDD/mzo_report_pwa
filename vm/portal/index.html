<!DOCTYPE html>
<html lang="en" class="ui" data-mzo-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MZO Data</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/kit/mzo_theme.css" />
  <link rel="stylesheet" href="portal.css" />
  <script src="/kit/mzo_theme.js"></script>
  <script src="js/boot.js"></script>
</head>
<body>
  <svg class="pt-sprite" aria-hidden="true" focusable="false">
    <symbol id="pt-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></symbol>
    <symbol id="pt-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="pt-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="pt-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1L20.5 8.5"/><path d="M20.5 3.5v5h-5"/></symbol>
    <symbol id="pt-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="pt-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="pt-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></symbol>
    <symbol id="pt-out" viewBox="0 0 24 24"><path d="M9.5 20.5H6A2.5 2.5 0 0 1 3.5 18V6A2.5 2.5 0 0 1 6 3.5h3.5"/><path d="m15.5 16.5 4.5-4.5-4.5-4.5"/><path d="M20 12H9.5"/></symbol>
    <symbol id="pt-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="pt-chev-l" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="pt-first" viewBox="0 0 24 24"><path d="m17 6-6 6 6 6"/><path d="M7 6v12"/></symbol>
    <symbol id="pt-last" viewBox="0 0 24 24"><path d="m7 6 6 6-6 6"/><path d="M17 6v12"/></symbol>
    <symbol id="pt-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="pt-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="pt-updown" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></symbol>
    <symbol id="pt-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="pt-ext" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
    <symbol id="pt-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
    <symbol id="pt-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></symbol>
    <symbol id="pt-columns" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9.5 4v16M14.5 4v16"/></symbol>
    <symbol id="pt-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="pt-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="pt-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></symbol>
    <symbol id="pt-sheet" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16M4 14.5h16M10 9v11.5"/></symbol>
    <symbol id="pt-table" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6"/></symbol>
    <symbol id="pt-bucket" viewBox="0 0 24 24"><path d="M3.5 8.5h17l-1.6 10.2a2 2 0 0 1-2 1.8H7.1a2 2 0 0 1-2-1.8z"/><path d="M8 8.5a4 4 0 0 1 8 0"/></symbol>
    <symbol id="pt-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="pt-script" viewBox="0 0 24 24"><path d="m8.5 8-4 4 4 4"/><path d="m15.5 8 4 4-4 4"/><path d="m13.5 5-3 14"/></symbol>
    <symbol id="pt-shield" viewBox="0 0 24 24"><path d="M12 21s7-3.2 7-9.5V5.5L12 3 5 5.5v6C5 17.8 12 21 12 21z"/></symbol>
  </svg>

  <main class="pt-login" id="login" hidden>
    <form class="pt-login-card" id="loginForm" novalidate>
      <div class="pt-brand">
        <span class="pt-mark"><svg class="ui-i" aria-hidden="true"><use href="#pt-db"/></svg></span>
        <span class="pt-brand-t"><b>MZO Data</b><span>Data mirror console</span></span>
      </div>
      <h1>Sign in</h1>
      <label class="pt-field"><span>Email</span><input class="ui-input" id="loginEmail" name="email" type="email" autocomplete="username" spellcheck="false" required /></label>
      <label class="pt-field"><span>Password</span><input class="ui-input" id="loginPass" name="password" type="password" autocomplete="current-password" required /></label>
      <p class="pt-login-msg" id="loginMsg" role="alert" hidden></p>
      <button class="ui-btn primary pt-login-btn" type="submit" id="loginBtn">Sign in</button>
      <p class="pt-login-foot">Portal accounts and PocketBase superusers</p>
    </form>
  </main>

  <div class="pt-app" id="app" hidden>
    <aside class="pt-sb" id="sb" aria-label="Datasets">
      <a class="pt-brand" href="#/">
        <span class="pt-mark"><svg class="ui-i" aria-hidden="true"><use href="#pt-db"/></svg></span>
        <span class="pt-brand-t"><b>MZO Data</b><span>Data mirror console</span></span>
      </a>
      <div class="ui-search pt-sb-search">
        <svg class="ui-i" aria-hidden="true"><use href="#pt-search"/></svg>
        <input class="ui-input" id="dsSearch" type="search" placeholder="Search datasets" autocomplete="off" spellcheck="false" aria-label="Search datasets" />
      </div>
      <div class="ui-seg pt-sb-mode" id="groupMode" role="group" aria-label="Group datasets by">
        <button type="button" data-mode="source" aria-pressed="true">Source</button>
        <button type="button" data-mode="area" aria-pressed="false">Report area</button>
      </div>
      <nav class="pt-nav" id="nav" aria-label="Datasets"></nav>
      <div class="pt-sb-foot">
        <button type="button" class="pt-me" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="meMenu">
          <span class="pt-av" id="meAv"></span>
          <span class="pt-me-t"><b id="meName"></b><span id="meSub"></span></span>
          <svg class="ui-i" aria-hidden="true"><use href="#pt-updown"/></svg>
        </button>
      </div>
    </aside>
    <div class="pt-scrim" id="scrim"></div>
    <div class="pt-main">
      <section class="pt-shell">
        <header class="pt-bar">
          <button type="button" class="ui-btn icon ghost pt-menu-btn" id="menuBtn" aria-label="Show datasets" aria-controls="sb" aria-expanded="false">
            <svg class="ui-i" aria-hidden="true"><use href="#pt-menu"/></svg>
          </button>
          <nav class="pt-crumbs" id="crumbs" aria-label="Location"></nav>
          <span class="pt-bar-busy" id="busy" hidden></span>
          <button type="button" class="ui-btn icon ghost" id="reloadBtn" aria-label="Reload" title="Reload">
            <svg class="ui-i" aria-hidden="true"><use href="#pt-refresh"/></svg>
          </button>
          <button type="button" class="ui-btn icon ghost" id="themeBtn" aria-label="Switch theme" title="Switch theme">
            <svg class="ui-i" aria-hidden="true"><use id="themeIco" href="#pt-moon"/></svg>
          </button>
        </header>
        <div class="pt-view" id="view" tabindex="-1"></div>
      </section>
    </div>
  </div>

  <div class="pt-menu" id="meMenu" role="menu" hidden>
    <div class="pt-menu-h"><b id="mhName"></b><span id="mhSub"></span></div>
    <div class="pt-menu-row">
      <span>Theme</span>
      <span class="ui-seg pt-theme-seg" role="group" aria-label="Theme">
        <button type="button" data-theme="light" aria-pressed="false" aria-label="Light" title="Light"><svg class="ui-i" aria-hidden="true"><use href="#pt-sun"/></svg></button>
        <button type="button" data-theme="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg class="ui-i" aria-hidden="true"><use href="#pt-moon"/></svg></button>
      </span>
    </div>
    <a class="pt-mi" id="pbAdminLink" role="menuitem" href="/_/" target="_blank" rel="noopener noreferrer" hidden>
      <svg class="ui-i" aria-hidden="true"><use href="#pt-shield"/></svg>PocketBase dashboard
    </a>
    <hr />
    <button type="button" class="pt-mi danger" role="menuitem" id="logoutBtn"><svg class="ui-i" aria-hidden="true"><use href="#pt-out"/></svg>Sign out</button>
  </div>

  <script src="/kit/mzo_ui.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
