<!DOCTYPE html>
<html lang="en" class="ui">
<head>
    <script src="/mzo_theme.js?v=9"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street View with Overlay</title>
    <link rel="stylesheet" href="/mzo_theme.css?v=19" />
    <script src="/mzo_ui.js?v=16" defer></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: var(--mzo-font, system-ui, sans-serif);
            display: flex;
            background-color: var(--mzo-bg, #09090a);
            color: var(--mzo-text, #f3f3f4);
        }
        #street-view-container {
            flex-grow: 1;
            height: 100%;
        }
        #info-panel {
            width: 300px;
            height: 100%;
            background-color: var(--mzo-surface, #111113);
            border-right: 1px solid var(--mzo-border, rgba(255,255,255,0.08));
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 10;
        }
        #info-panel h2 {
            margin-top: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--mzo-text, #f3f3f4);
            border-bottom: 1px solid var(--mzo-border, rgba(255,255,255,0.08));
            padding-bottom: 10px;
        }
        #info-panel p {
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--mzo-text-2, #b5b5bc);
        }
        #info-panel strong {
            color: var(--mzo-text, #f3f3f4);
            font-weight: 600;
        }
        iframe {
            border: none;
            height: 100%;
            width: 100%;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column-reverse;
            }
            #info-panel {
                width: 100%;
                height: auto;
                max-height: 38%;
                border-right: 0;
                border-top: 1px solid var(--mzo-border-strong, rgba(255,255,255,0.14));
                border-radius: 16px 16px 0 0;
                padding: 14px 16px;
            }
            #street-view-container {
                height: 62%;
            }
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <h2>Crossing Details</h2>
        <p><strong>ID:</strong> <span id="info-id"></span></p>
        <p><strong>Coordinates:</strong> <span id="info-coords"></span></p>
        <p><strong>Division:</strong> <span id="info-division"></span></p>
        <p><strong>CCC:</strong> <span id="info-ccc"></span></p>
        <p><strong>E-Note No:</strong> <span id="info-enote"></span></p>
    </div>

    <div id="street-view-container">
        <iframe id="street-view-iframe"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);

            const lat = parseFloat(params.get('lat'));
            const lng = parseFloat(params.get('lng'));
            const hasCoords = isFinite(lat) && isFinite(lng);
            const id = params.get('id');
            const division = params.get('division');
            const ccc = params.get('ccc');
            const enote = params.get('enote');

            document.getElementById('info-id').textContent = id || 'N/A';
            document.getElementById('info-coords').textContent = hasCoords ? `${lat.toFixed(6)}, ${lng.toFixed(6)}` : 'N/A';
            document.getElementById('info-division').textContent = division || 'N/A';
            document.getElementById('info-ccc').textContent = ccc || 'N/A';
            document.getElementById('info-enote').textContent = enote || 'N/A';

            if (hasCoords) {
                const iframe = document.getElementById('street-view-iframe');
                // Keyless Street View embed: cbll=lat,lng; cbp=12,heading,tilt,zoom,pitch
                iframe.src = `https://www.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=12,235,0,0,10&output=svembed`;
            }
        };
    </script>

</body>
</html>
