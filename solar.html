<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar connections · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=24" />
  <script src="/mzo_ui.js?v=21" defer></script>
  <script src="/mzo_data_hub.js?v=94" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=20" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div><h1>Solar connections<span class="ui-badge ui-date" id="asOn">…</span></h1></div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h"><h2>Filters<small id="activeLabel"></small></h2><button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button></div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Search" title="Application, consumer ID or name" aria-label="Search by application, consumer ID or name" autocomplete="off" /></label>
        </div>
        <div class="ui-side-sec"><div id="fScheme" aria-label="Scheme"></div></div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Group">
            <button type="button" role="tab" data-pane="fAge" aria-pressed="true" aria-selected="true">Pending for</button>
            <button type="button" role="tab" data-pane="fLoad" aria-pressed="false" aria-selected="false">Load</button>
          </div>
          <div id="fAge" aria-label="Pending for"></div>
          <div id="fLoad" aria-label="Applied load" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Applications</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="done"><div class="k"><span class="ui-dot ok"></span>Connected</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="pending"><div class="k"><span class="ui-dot warn"></span>Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="issue"><div class="k"><span class="ui-dot bad"></span>Meter issue</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed report</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div id="drill"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var SCHEME = { PMSGMBY: 'PM Surya Ghar', WBREDA: 'WBREDA', ALOSHREE: 'Aloshree', OTHERS: 'Others' };
    var STATUS = { done: { label: 'Connected', cls: 'ok' }, pending: { label: 'Pending', cls: 'warn' }, issue: { label: 'Meter issue', cls: 'bad' } };
    var AGE = [
      { key: 'a0', label: 'Under a month', max: 30, dot: 'ok' },
      { key: 'a1', label: '1–3 months', max: 91, dot: 'warn' },
      { key: 'a2', label: '3–6 months', max: 182, dot: 'warn' },
      { key: 'a3', label: '6–12 months', max: 365, dot: 'bad' },
      { key: 'a4', label: 'Over a year', max: Infinity, dot: 'bad' }
    ];
    var all = [], f = { q: '', scheme: '', status: '', age: '', load: '' }, shown = '';
    var dr = UI.drill({ el: 'drill', root: 'Malda Zone', onChange: render });
    var LOAD = [{ key: 'l0', label: 'Up to 2 kW', max: 2 }, { key: 'l1', label: '2–3 kW', max: 3 }, { key: 'l2', label: '3–5 kW', max: 5 }, { key: 'l3', label: 'Above 5 kW', max: Infinity }];
    function loadKey(v) { return (LOAD.filter(function (b) { return v <= b.max; })[0] || LOAD[3]).key; }
    var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });

    function status(v) {
      var s = String(v || '').trim().toUpperCase();
      if (s === 'SUCCESS' || s === 'EFFECTED' || s === 'DONE') return 'done';
      if (!s || s === '(NULL)' || s === 'NOT YET' || s === 'PENDING') return 'pending';
      return 'issue';
    }
    function scheme(v) { var s = String(v || '').trim().toUpperCase(); return !s || s === 'OTHER' || s === '(NULL)' ? 'OTHERS' : s; }

    // t.rows: uniform rows of schema/solar_connections.json (snake_case, numbers, ISO dates,
    // canonical _region/_division/_ccc), already scoped to the login by MzoRows.
    function mapSolar(d) {
      if (!(d.solar_appl_no || d.con_id)) return null;
      var created = UI.date(d.creation_date);
      var st = status(d.replace_status);
      var r = {
        appl: d.solar_appl_no, con: d.con_id,
        name: [d.fname, d.lname].filter(function (x) { return !UI.blank(x) && x !== 'NA'; }).map(UI.title).join(' '),
        phone: UI.blank(d.phone_no) ? '' : d.phone_no, code: d.ccc_code,
        _region: d._region, _divn: d._division, _supp: d._ccc || UI.title(d.supp_off.replace(/\s*CCC.*$/i, '')), CCC_CODE: d.ccc_code,
        scheme: scheme(d.remarks), cls: d.class, load: d.load_appl || 0, curr: d.curr_load || 0,
        created: created, wait: st === 'done' ? null : UI.days(created), st: st,
        meterType: UI.blank(d.meter_type) ? '' : d.meter_type, genMeter: UI.blank(d.gen_meter1) ? '' : d.gen_meter1, conMeter: UI.blank(d.con_meter) ? '' : d.con_meter,
        wo: UI.blank(d.won) ? '' : d.won, woDate: d.work_order_date, quoteDue: d.quotation_due_date,
        response: [d.response1, d.response2, d.response3].filter(function (x) { return !UI.blank(x); }).join(' · ')
      };
      r.ageKey = r.wait == null ? '' : AGE.filter(function (b) { return r.wait <= b.max; })[0].key;
      return r;
    }
    function prepare(t) {
      var asOn = t.first('report_date'); // one cell of the sheet: read it before the scope (t.all)
      all = t.rows.map(mapSolar).filter(Boolean);
      $('asOn').textContent = asOn ? 'As on ' + UI.fmtDate(asOn) : UI.n(all.length) + ' applications';
      UI.reportRankFromTable(t, mapSolar, { lowerIsBetter: true, label: 'Pending solar applications' });
    }

    // Every panel filter; `skip` leaves one facet out so it can count its own options.
    function base(skip) {
      var q = f.q.toLowerCase();
      return all.filter(function (r) {
        return (skip === 'scheme' || !f.scheme || r.scheme === f.scheme) && (skip === 'age' || !f.age || r.ageKey === f.age) && (skip === 'load' || !f.load || loadKey(r.load) === f.load) &&
          dr.match(r) &&
          (!q || r.appl.indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1);
      });
    }
    function facets() {
      var sc = {}, bs = base('scheme'); bs.forEach(function (r) { sc[r.scheme] = (sc[r.scheme] || 0) + 1; });
      var keys = Object.keys(sc); if (f.scheme && keys.indexOf(f.scheme) === -1) keys.push(f.scheme);
      UI.facet('fScheme', keys.sort(function (a, b) { return (sc[b] || 0) - (sc[a] || 0); }).map(function (k) { return { value: k, label: SCHEME[k] || UI.title(k), count: sc[k] || 0 }; }), f.scheme, function (v) { f.scheme = v; render(); });
      var ba = base('age').filter(function (r) { return r.st === 'pending'; });
      UI.facet('fAge', AGE.map(function (a) { return { value: a.key, label: a.label, dot: a.dot, count: ba.filter(function (r) { return r.ageKey === a.key; }).length }; }), f.age, function (v) { f.age = v; if (v) f.status = 'pending'; render(); });
      var bl = base('load');
      UI.facet('fLoad', LOAD.map(function (l) { return { value: l.key, label: l.label, count: bl.filter(function (r) { return loadKey(r.load) === l.key; }).length }; }), f.load, function (v) { f.load = v; render(); });
      var on = (f.q ? 1 : 0) + ['scheme', 'age', 'load'].filter(function (k) { return f[k]; }).length;
      setActive(on, { fAge: f.age, fLoad: f.load });
    }

    function render() {
      var b = base(), count = function (rows, st) { return rows.filter(function (r) { return r.st === st; }).length; };
      facets();
      var view = b.filter(function (r) { return !f.status || r.st === f.status; });

      var pend = b.filter(function (r) { return r.st === 'pending' && r.wait != null; }).map(function (r) { return r.wait; }).sort(function (x, y) { return x - y; });
      var median = pend.length ? pend[Math.floor(pend.length / 2)] : null;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), c = k ? count(b, k) : b.length;
        el.querySelector('.v').textContent = UI.n(c);
        el.querySelector('.s').textContent = !k ? UI.n(Math.round(b.reduce(function (a, r) { return a + r.load; }, 0))) + ' kW applied'
          : k === 'pending' ? (median != null ? 'Median wait ' + UI.age(median) : '—')
          : UI.pct(c, b.length) + ' of applications';
        el.setAttribute('aria-pressed', String(f.status === k));
      });

      // Detailed report: offices down the path, then the applications
      if (dr.level() !== shown) { $('table').__ui = null; shown = dr.level(); }
      if (dr.isList()) {
        UI.table('table', { rows: view, sort: { key: 'wait', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No applications match these filters.', columns: APP_COLS, onRow: detail });
      } else {
        var groups = {};
        view.forEach(function (r) {
          var k = dr.key(r), g = groups[k] || (groups[k] = { name: k, parent: dr.parent(r), row: r, n: 0, done: 0, pending: 0, issue: 0 });
          g.n++; g[r.st]++;
        });
        var list = Object.keys(groups).map(function (k) { return groups[k]; });
        var tot = { n: view.length, done: count(view, 'done'), pending: count(view, 'pending'), issue: count(view, 'issue') };
        UI.table('table', {
          rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No applications for these filters.',
          columns: [
            { key: 'name', label: dr.label(), fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
            { key: 'n', label: 'Applications', num: true, fmt: UI.n },
            { key: 'pending', label: 'Pending', num: true, fmt: UI.n },
            { key: 'issue', label: 'Issue', num: true, fmt: UI.n, hideSm: true },
            { key: 'rate', label: 'Connected', sortVal: function (g) { return g.n ? g.done / g.n : 0; }, fmt: function (_, g) { return UI.bar(g.done, g.n, UI.pct(g.done, g.n), 2); }, width: '26%' }
          ],
          foot: list.length > 1 ? { n: tot.n, pending: tot.pending, issue: tot.issue, done: tot.done, rate: 0 } : null,
          onRow: function (g) { dr.open(g.name, g.row); }
        });
      }
      dr.paint({ list: view.length });
      renderReportHead(view);
      window.__view = view;
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var label = dr.isList() ? 'Applications' : dr.label() + ' wise report';
      var stLabel = f.status && STATUS[f.status] ? STATUS[f.status].label : '';

      $('rhTitle').textContent = label + (stLabel ? ' · ' + stLabel : '');

      var viewLoad = view.reduce(function (s, r) { return s + (r.load || 0); }, 0);
      var allLoad = all.reduce(function (s, r) { return s + (r.load || 0); }, 0);

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> · ' + UI.n(Math.round(allLoad)) + ' kW';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' · ' + UI.n(Math.round(viewLoad)) + ' kW';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
      }
      if (f.scheme) {
        currentActiveFilters.push({ label: 'Scheme', value: SCHEME[f.scheme] || f.scheme, clear: function () { f.scheme = ''; } });
      }
      if (f.status && STATUS[f.status]) {
        currentActiveFilters.push({ label: 'Status', value: STATUS[f.status].label, clear: function () { f.status = ''; } });
      }
      if (f.age) {
        var ab = AGE.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Age', value: ab ? ab.label : f.age, clear: function () { f.age = ''; } });
      }
      if (f.load) {
        var lb = LOAD.filter(function (x) { return x.key === f.load; })[0];
        currentActiveFilters.push({ label: 'Capacity', value: lb ? lb.label : f.load, clear: function () { f.load = ''; } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    var APP_COLS = [
      { key: 'appl', label: 'Application', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v || '—') + '</span><span class="sub">' + UI.esc(r.con) + '</span>'; } },
      { key: 'name', label: 'Name', hideSm: true, cls: 'wrap' },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'scheme', label: 'Scheme', hideSm: true, fmt: function (v) { return UI.esc(SCHEME[v] || UI.title(v)); } },
      { key: 'load', label: 'Load (kW)', num: true, fmt: function (v) { return v ? UI.n(v) : '—'; } },
      { key: 'created', label: 'Applied', num: true, hideSm: true, sortVal: function (r) { return r.created ? r.created.getTime() : 0; }, fmt: function (v) { return UI.fmtDate(v); }, csv: function (r) { return UI.fmtDate(r.created); } },
      { key: 'wait', label: 'Pending for', num: true, sortVal: function (r) { return r.wait == null ? -1 : r.wait; }, fmt: function (v) { return v == null ? '<span class="ui-muted">—</span>' : UI.age(v); }, csv: function (r) { return r.wait == null ? '' : r.wait + ' days'; } },
      { key: 'st', label: 'Status', fmt: function (v) { return '<span class="ui-badge ' + STATUS[v].cls + '">' + STATUS[v].label + '</span>'; }, csv: function (r) { return STATUS[r.st].label; } }
    ];

    function detail(r) {
      UI.drawer('Application ' + (r.appl || '—'), [STATUS[r.st].label, r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Consumer ID', r.con], ['Name', r.name], ['Phone', r.phone], ['Scheme', SCHEME[r.scheme] || r.scheme], ['Class', r.cls],
        ['Applied load', r.load ? r.load + ' kW' : ''], ['Current load', r.curr ? r.curr + ' kW' : ''], ['Applied on', UI.fmtDate(r.created)],
        ['Pending for', r.wait == null ? '' : UI.age(r.wait)], ['Quotation due', r.quoteDue ? UI.fmtDate(r.quoteDue) : ''],
        ['Work order', r.wo], ['Work order date', r.woDate && !UI.blank(r.woDate) ? UI.fmtDate(r.woDate) : ''],
        ['Meter type', r.meterType], ['Generation meter', r.genMeter], ['Consumption meter', r.conMeter], ['Replacement notes', r.response], ['CCC code', r.code]
      ]);
    }

    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.status = f.status === k ? '' : k; if (f.status !== 'pending') f.age = ''; render(); });
    function clearAll() {
      f.q = ''; f.status = ''; f.age = ''; f.load = ''; f.scheme = ''; $('q').value = '';
      render();
    }
    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('solar-connections.csv', [{ key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'scheme', label: 'Scheme' }, { key: 'load', label: 'Load (kW)' }].concat(APP_COLS.slice(5)), window.__view || []);
    });
    MzoRows.refresh('refreshBtn', 'solar_connections', function (t) { prepare(t); render(); });

    var first = true;
    MzoRows.load('solar_connections', function (t, info) {
      if (!t) { if (info && info.error) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(t);
      if (first) {
        first = false;
        // Deep links: ?region= ?division= ?ccc= ?q= ?status=done|pending|issue ?scheme=PMSGMBY|WBREDA|ALOSHREE|OTHERS
        var params = new URLSearchParams(location.search);
        dr.fromParams(params, all);
        if (params.get('q')) { f.q = params.get('q').trim(); $('q').value = f.q; }
        if (STATUS[params.get('status')]) f.status = params.get('status');
        var sch = String(params.get('scheme') || '').toUpperCase();
        if (sch && all.some(function (r) { return r.scheme === sch; })) f.scheme = sch;
      }
      render();
    });
  });
  </script>
</body>
</html>
