<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consumer dockets · DISHA</title>
  <script src="/mzo_theme.js?v=4"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=7" />
  <script src="/mzo_ui.js?v=6" defer></script>
  <script src="/mzo_data_hub.js?v=92" defer></script>
  <script src="/lib/offices.js?v=2" defer></script>
  <script src="/mzo_scope.js?v=17" defer></script>
  <script src="/mzo_rows.js?v=6" defer></script>
  <style>
    .rem-hint {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--mzo-muted);
      border-bottom: 1px solid var(--mzo-border);
    }
    .rd-copy { margin-left: auto; margin-right: 2px; }
    .ui-stat .s { font-size: 11px; color: var(--mzo-muted); }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Docket calls <span class="ui-badge ui-date" id="asOn"></span></h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <a class="ui-btn sm" href="/docket/kpi.html" id="kpiLink">Closure KPI</a>
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg>Filters<span id="activeCount"></span></button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-layout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Docket, consumer ID, name or mobile" autocomplete="off" aria-label="Search dockets" title="Search dockets" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Docket type" id="fType"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Open duration" id="fAge"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Top problems" id="fProb"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Consumer multiplicity" id="fRep"></div>
        </div>
      </aside>

      <div class="ui-main">
        <section class="ui-stats" id="stats" aria-label="Summary">
          <button type="button" class="ui-stat" data-k=""><div class="k">Open dockets</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="tech"><div class="k">Technical</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="nontech"><div class="k">Non-technical</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="old"><div class="k"><span class="ui-dot bad"></span>Open over 48 hours</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
          <button type="button" class="ui-stat" data-k="repeat"><div class="k">Repeat consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
        </section>

        <section class="ui-panel">
          <div class="report-head" id="reportHead">
            <div class="rh-top">
              <div class="rh-title-wrap">
                <h2 class="rh-title">
                  <span id="rhTitle">Detailed Analysis</span>
                </h2>
                <span class="rh-badge" id="rhCount">…</span>
              </div>
              <div class="ui-actions">
                <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i"><use href="#ui-copy"/></svg>Copy</button>
                <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
              </div>
            </div>
            <div class="rh-filters-bar" id="rhFiltersBar"></div>
          </div>
          <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
          <div class="rem-hint" id="hint"></div>
          <div id="table"><div class="ui-empty">Loading…</div></div>
        </section>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var TECH = [
      'Meter defective and No Power', 'Meter (Tampering)', 'Service (main) problem', 'Service (main) problem (UG cable)',
      'Service(main) problem(OH Line)', 'Breakage or uprooting of pole', 'Flashing/Glowing', 'No power',
      'Dis. transformer problem', 'Voltage fluctuation', 'Insulator break at pole', 'Earthing problem',
      'Fuse problem', 'Alteration of Services', 'Load Shedding Problem', 'Bird fault', 'Conductor snap',
      'LT wire problem', 'Sagging of wire', 'Single phasing', 'Voltage complaint', 'Cable fault',
      'Cable fault where RMU exists', 'Cable fault where no RMU exists', 'Frequent tripping', 'Short circuit',
      'Problem in Shifting of Meter'
    ];
    var AGE = [
      { key: 'h0', label: 'Under 24 hours', max: 24 },
      { key: 'h1', label: '1–2 days', max: 48 },
      { key: 'h2', label: '2–7 days', max: 168 },
      { key: 'h3', label: '7–30 days', max: 720 },
      { key: 'h4', label: 'Over 30 days', max: Infinity }
    ];
    var TABS = [
      { id: 'region', label: 'Region' },
      { id: 'division', label: 'Division' },
      { id: 'ccc', label: 'CCC' },
      { id: 'dockets', label: 'Dockets' },
      { id: 'age', label: 'Aging Buckets' },
      { id: 'problems', label: 'Problem Types' },
      { id: 'repeat', label: 'Repeat Consumers' }
    ];

    var all = [], f = { q: '', stat: '', type: '', age: '', prob: '', rep: '' };
    var tab = 'region', scope = null, latest = null, repeat = {};

    var setActive = UI.sidePanel({
      side: 'side',
      toggle: 'sideToggle',
      label: 'activeLabel',
      count: 'activeCount',
      clear: 'clearBtn',
      onClear: clearAll
    });

    function clearAll() {
      f.q = ''; f.stat = ''; f.type = ''; f.age = ''; f.prob = ''; f.rep = '';
      $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
        if (!$(id).disabled) $(id).value = '';
      });
      fillOffices(); markAll();
      syncUrl();
      render();
    }

    // "dd/mm/yyyy hh:mm:ss" (seconds sometimes dotted: 22.44.30)
    function when(s) {
      var m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[.:](\d{1,2})(?:[.:](\d{1,2}))?)?/);
      return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : null;
    }
    function since(h) {
      if (h == null) return '—';
      if (h < 1) return Math.max(1, Math.round(h * 60)) + 'm';
      if (h < 48) return Math.floor(h) + 'h';
      return UI.age(Math.floor(h / 24));
    }

    function prepare(t) {
      var now = Date.now(); latest = null; repeat = {};
      t.all.forEach(function (d) { var c = d.doc_no ? when(d.doc_crn_dt) : null; if (c && (!latest || c > latest)) latest = c; });
      all = t.rows.filter(function (d) { return d.doc_no; }).map(function (d) {
        var c = when(d.doc_crn_dt), prob = d.prob_type;
        return {
          doc: d.doc_no, con: d.con_id, name: UI.blank(d.party_name) ? '' : UI.title(d.party_name), mobile: UI.blank(d.mob_no) ? '' : d.mob_no,
          addr: d.addr, prob: prob, desc: d.description, created: c, raw: d.doc_crn_dt, code: d.ccc_code,
          hours: c ? (now - c.getTime()) / 36e5 : null, tech: TECH.indexOf(prob) !== -1,
          _region: d._region, _divn: d._division, _supp: d._ccc || UI.title((d.ccc_name || d.ccc_code).replace(/\s*CCC.*$/i, '')), CCC_CODE: d.ccc_code
        };
      });
      all.forEach(function (r) {
        var match = AGE.filter(function (a) { return r.hours != null && r.hours < a.max; })[0];
        r.ageKey = match ? match.key : 'h4';
        if (r.con) repeat[r.con] = (repeat[r.con] || 0) + 1;
      });
      if (latest && $('asOn')) $('asOn').textContent = 'Up to ' + UI.fmtDate(latest) + ', ' + latest.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      $('meta').textContent = (latest ? 'Up to ' + UI.fmtDate(latest) + ', ' + latest.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) + ' · ' : '') + UI.n(all.length) + ' open dockets';
      fillOffices();
    }

    function fillOffices() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }
    function markAll() {
      ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) { UI.mark($(id)); });
    }

    var STAT = {
      tech: function (r) { return r.tech; },
      nontech: function (r) { return !r.tech; },
      old: function (r) { return r.hours != null && r.hours >= 48; },
      repeat: function (r) { return r.con && repeat[r.con] > 1; }
    };

    function base(skip) {
      skip = skip || {};
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value;
      return all.filter(function (r) {
        if (reg && r._region !== reg) return false;
        if (div && r._divn !== div) return false;
        if (ccc && r._supp !== ccc) return false;
        if (!skip.type && f.type === 'tech' && !r.tech) return false;
        if (!skip.type && f.type === 'nontech' && r.tech) return false;
        if (!skip.age && f.age && r.ageKey !== f.age) return false;
        if (!skip.prob && f.prob && r.prob !== f.prob) return false;
        if (!skip.rep && f.rep === 'repeat' && (!r.con || repeat[r.con] <= 1)) return false;
        if (q && String(r.doc).indexOf(q) === -1 && (r.con || '').indexOf(q) === -1 && r.name.toLowerCase().indexOf(q) === -1 && String(r.mobile || '').indexOf(q) === -1 && String(r._supp || '').toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
    }

    function syncUrl() {
      var p = new URLSearchParams();
      if ($('regionFilter').value) p.set('region', $('regionFilter').value);
      if ($('divisionFilter').value) p.set('division', $('divisionFilter').value);
      if ($('cccFilter').value) p.set('ccc', $('cccFilter').value);
      if (f.q) p.set('q', f.q);
      if (f.stat) p.set('stat', f.stat);
      if (f.type) p.set('type', f.type);
      if (f.age) p.set('age', f.age);
      if (f.prob) p.set('prob', f.prob);
      if (f.rep) p.set('rep', f.rep);
      if (tab !== 'region') p.set('tab', tab);
      var qs = p.toString();
      var url = location.pathname + (qs ? '?' + qs : '');
      if (location.search !== (qs ? '?' + qs : '')) history.replaceState(null, '', url);
    }

    function render() {
      var b = base({});
      var view = f.stat ? b.filter(STAT[f.stat]) : b;

      // Update KPI stats
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = k ? b.filter(STAT[k]) : b;
        el.querySelector('.v').textContent = UI.n(rows.length);
        var cons = {}; rows.forEach(function (r) { if (r.con) cons[r.con] = 1; });
        el.querySelector('.s').textContent = !k || k === 'repeat' ? UI.n(Object.keys(cons).length) + ' consumers' : UI.pct(rows.length, b.length) + ' of open';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      // Facets
      var forType = base({ type: true }).filter(function (r) { return !f.stat || STAT[f.stat](r); });
      var typeItems = [
        { value: '', label: 'All docket types', count: forType.length },
        { value: 'tech', label: 'Technical', count: forType.filter(function (r) { return r.tech; }).length },
        { value: 'nontech', label: 'Non-technical', count: forType.filter(function (r) { return !r.tech; }).length }
      ];
      UI.facet($('fType'), typeItems, f.type, function (v) { f.type = v; syncUrl(); render(); });

      var forAge = base({ age: true }).filter(function (r) { return !f.stat || STAT[f.stat](r); });
      var ageItems = [{ value: '', label: 'Any age', count: forAge.length }].concat(AGE.map(function (a) {
        return { value: a.key, label: a.label, count: forAge.filter(function (r) { return r.ageKey === a.key; }).length };
      }));
      UI.facet($('fAge'), ageItems, f.age, function (v) { f.age = v; syncUrl(); render(); });

      var forProb = base({ prob: true }).filter(function (r) { return !f.stat || STAT[f.stat](r); });
      var pc = {};
      forProb.forEach(function (r) { if (r.prob) pc[r.prob] = (pc[r.prob] || 0) + 1; });
      var topProbs = Object.keys(pc).sort(function (a, b) { return pc[b] - pc[a]; }).slice(0, 8);
      if (f.prob && topProbs.indexOf(f.prob) === -1) topProbs.push(f.prob);
      var probItems = [{ value: '', label: 'All problems', count: forProb.length }].concat(topProbs.map(function (p) {
        return { value: p, label: p, count: pc[p] || 0 };
      }));
      UI.facet($('fProb'), probItems, f.prob, function (v) { f.prob = v; syncUrl(); render(); });

      var forRep = base({ rep: true }).filter(function (r) { return !f.stat || STAT[f.stat](r); });
      var repItems = [
        { value: '', label: 'All consumers', count: forRep.length },
        { value: 'repeat', label: 'Repeat consumers only', count: forRep.filter(function (r) { return r.con && repeat[r.con] > 1; }).length }
      ];
      UI.facet($('fRep'), repItems, f.rep, function (v) { f.rep = v; syncUrl(); render(); });

      // Active filters count
      var hasOffice = ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; });
      var nActive = (f.q ? 1 : 0) + (f.stat ? 1 : 0) + (f.type ? 1 : 0) + (f.age ? 1 : 0) + (f.prob ? 1 : 0) + (f.rep ? 1 : 0) + (hasOffice ? 1 : 0);
      setActive(nActive);

      // Render Tabs
      var tabsEl = $('tabs');
      tabsEl.innerHTML = TABS.map(function (t) {
        var count = '';
        if (t.id === 'dockets') count = '<small>' + UI.n(view.length) + '</small>';
        else if (t.id === 'repeat') {
          var repCount = view.filter(function (r) { return r.con && repeat[r.con] > 1; }).length;
          count = '<small>' + UI.n(repCount) + '</small>';
        }
        return '<button type="button" class="ui-drill-tab" role="tab" data-tab="' + t.id + '" aria-selected="' + String(tab === t.id) + '">' + t.label + count + '</button>';
      }).join('');

      var totTech = view.filter(STAT.tech).length;
      var totOld = view.filter(STAT.old).length;
      $('hint').innerHTML = '<span class="ui-strong">' + UI.n(view.length) + '</span> open dockets · Technical: <span class="ui-strong">' + UI.n(totTech) + '</span> (' + UI.pct(totTech, view.length) + ') · Over 48h: <span class="ui-strong">' + UI.n(totOld) + '</span> (' + UI.pct(totOld, view.length) + ')';

      window.__view = view;
      renderReportHead(view);

      if (tab === 'region' || tab === 'division' || tab === 'ccc') {
        renderOfficesTab(view);
      } else if (tab === 'dockets') {
        renderDocketsTab(view);
      } else if (tab === 'age') {
        renderAgeTab(view);
      } else if (tab === 'problems') {
        renderProblemsTab(view);
      } else if (tab === 'repeat') {
        renderRepeatTab(view);
      }
    }

    var currentActiveFilters = [];
    function renderReportHead(view) {
      var tabObj = TABS.filter(function (t) { return t.id === tab; })[0];
      var tabLabel = tabObj ? tabObj.label : 'Detailed Analysis';
      var kpiLabels = { tech: 'Technical', nontech: 'Non-technical', old: 'Open > 48 hours', repeat: 'Repeat consumers' };
      var kpiLabel = f.stat && kpiLabels[f.stat] ? kpiLabels[f.stat] : '';

      $('rhTitle').textContent = tabLabel + (kpiLabel ? ' · ' + kpiLabel : '');

      if (view.length === all.length) {
        $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> open dockets';
      } else {
        $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span> of ' + UI.n(all.length) + ' open dockets';
      }

      currentActiveFilters = [];
      if (f.q) {
        currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; syncUrl(); } });
      }
      if ($('regionFilter').value && !$('regionFilter').disabled) {
        currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { $('regionFilter').value = ''; $('divisionFilter').value = ''; $('cccFilter').value = ''; fillOffices(); markAll(); syncUrl(); } });
      }
      if ($('divisionFilter').value && !$('divisionFilter').disabled) {
        currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { $('divisionFilter').value = ''; $('cccFilter').value = ''; fillOffices(); markAll(); syncUrl(); } });
      }
      if ($('cccFilter').value && !$('cccFilter').disabled) {
        currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { $('cccFilter').value = ''; fillOffices(); markAll(); syncUrl(); } });
      }
      if (f.stat && kpiLabels[f.stat]) {
        currentActiveFilters.push({ label: 'KPI', value: kpiLabels[f.stat], clear: function () { f.stat = ''; syncUrl(); } });
      }
      if (f.type) {
        currentActiveFilters.push({ label: 'Type', value: f.type === 'tech' ? 'Technical' : 'Non-technical', clear: function () { f.type = ''; syncUrl(); } });
      }
      if (f.age) {
        var ab = AGE.filter(function (x) { return x.key === f.age; })[0];
        currentActiveFilters.push({ label: 'Age', value: ab ? ab.label : f.age, clear: function () { f.age = ''; syncUrl(); } });
      }
      if (f.prob) {
        currentActiveFilters.push({ label: 'Problem', value: f.prob, clear: function () { f.prob = ''; syncUrl(); } });
      }
      if (f.rep) {
        currentActiveFilters.push({ label: 'Repeat', value: 'Repeat consumers only', clear: function () { f.rep = ''; syncUrl(); } });
      }

      var bar = $('rhFiltersBar');
      if (currentActiveFilters.length) {
        var chips = currentActiveFilters.map(function (af, i) {
          return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
            '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
        }).join('');
        bar.innerHTML = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
          chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-reload"/></svg>Reset all</button></div>';
      } else {
        bar.innerHTML = '';
      }
    }

    function renderOfficesTab(view) {
      var key = tab === 'region' ? '_region' : tab === 'division' ? '_divn' : '_supp', g = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var o = g[name] || (g[name] = { name: name, parent: tab === 'ccc' ? r._divn : tab === 'division' ? r._region : '', n: 0, tech: 0, old: 0, oldest: 0 });
        o.n++;
        if (r.tech) o.tech++;
        if (r.hours >= 48) o.old++;
        if (r.hours > o.oldest) o.oldest = r.hours;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; });
      var max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'n', dir: 'desc' },
        count: false,
        empty: 'No open dockets for these filters.',
        columns: [
          {
            key: 'name',
            label: tab === 'ccc' ? 'CCC' : tab === 'division' ? 'Division' : 'Region',
            fmt: function (v, x) {
              return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : '');
            }
          },
          { key: 'n', label: 'Open', num: true, fmt: UI.n },
          { key: 'tech', label: 'Technical', num: true, fmt: UI.n, hideSm: true },
          { key: 'old', label: 'Over 48 h', num: true, fmt: UI.n },
          { key: 'oldest', label: 'Oldest', num: true, fmt: since, hideSm: true },
          {
            key: 'share',
            label: 'Share',
            sortVal: function (x) { return x.n; },
            fmt: function (_, x) { return UI.bar(x.n, max, UI.pct(x.n, view.length)); },
            hideSm: true,
            width: '24%'
          }
        ],
        foot: list.length > 1 ? { n: view.length, tech: view.filter(STAT.tech).length, old: view.filter(STAT.old).length } : null,
        onRow: function (x) {
          if (tab === 'region') {
            if ($('regionFilter').disabled) return;
            $('regionFilter').value = x.name; $('divisionFilter').value = ''; $('cccFilter').value = '';
            tab = 'division';
          } else if (tab === 'division') {
            if ($('divisionFilter').disabled) return;
            $('divisionFilter').value = x.name; $('cccFilter').value = '';
            tab = 'ccc';
          } else {
            $('cccFilter').value = x.name;
            tab = 'dockets';
          }
          fillOffices(); markAll(); syncUrl(); render();
        }
      });
    }

    var COLS = [
      {
        key: 'doc',
        label: 'Docket',
        fmt: function (v, r) {
          return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + (r.tech ? 'Technical' : 'Non-technical') + '</span>';
        }
      },
      {
        key: 'name',
        label: 'Consumer',
        cls: 'wrap',
        fmt: function (v, r) {
          return UI.esc(v || '—') + (repeat[r.con] > 1 ? ' <span class="ui-badge warn">' + repeat[r.con] + ' open</span>' : '') + '<span class="sub">' + UI.esc(r.con || 'No consumer ID') + '</span>';
        }
      },
      {
        key: '_supp',
        label: 'CCC',
        fmt: function (v, r) {
          return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>';
        }
      },
      { key: 'prob', label: 'Problem', cls: 'wrap', hideSm: true },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      {
        key: 'hours',
        label: 'Open for',
        num: true,
        sortVal: function (r) { return r.hours == null ? -1 : r.hours; },
        fmt: function (v, r) {
          var dot = (r.hours != null && r.hours >= 48) ? '<span class="ui-dot bad"></span>' : '';
          return dot + since(v);
        },
        csv: function (r) { return r.raw; }
      }
    ];

    function renderDocketsTab(view) {
      UI.table('table', {
        rows: view,
        sort: { key: 'hours', dir: 'desc' },
        limit: 50,
        resetPage: true,
        empty: 'No open dockets match these filters.',
        columns: COLS,
        onRow: detail
      });
    }

    function renderAgeTab(view) {
      var list = AGE.map(function (a) {
        var sub = view.filter(function (r) { return r.ageKey === a.key; });
        var techN = sub.filter(STAT.tech).length;
        return {
          key: a.key, label: a.label, n: sub.length, tech: techN,
          pct: UI.pct(sub.length, view.length)
        };
      });
      var maxN = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'n', dir: 'desc' },
        count: false,
        columns: [
          { key: 'label', label: 'Aging Bucket', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          { key: 'pct', label: '% Share', num: true },
          { key: 'tech', label: 'Technical', num: true, fmt: UI.n, hideSm: true },
          { key: 'share', label: 'Distribution', fmt: function (_, o) { return UI.bar(o.n, maxN, o.pct); }, width: '24%', hideSm: true }
        ],
        onRow: function (o) {
          f.age = f.age === o.key ? '' : o.key;
          syncUrl(); render();
        }
      });
    }

    function renderProblemsTab(view) {
      var pc = {};
      view.forEach(function (r) {
        var k = r.prob || 'Unspecified';
        var o = pc[k] || (pc[k] = { prob: k, tech: r.tech, n: 0, old: 0 });
        o.n++;
        if (r.hours >= 48) o.old++;
      });
      var list = Object.keys(pc).map(function (k) {
        var o = pc[k];
        o.pct = UI.pct(o.n, view.length);
        return o;
      });
      var maxN = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));

      UI.table('table', {
        rows: list,
        sort: { key: 'n', dir: 'desc' },
        count: false,
        columns: [
          { key: 'prob', label: 'Problem Type', fmt: function (x) { return '<span class="ui-strong">' + UI.esc(x) + '</span>'; } },
          { key: 'tech', label: 'Type', fmt: function (x) { return x ? '<span class="ui-badge">Technical</span>' : '<span class="ui-badge info">Non-technical</span>'; }, hideSm: true },
          { key: 'n', label: 'Dockets', num: true, fmt: UI.n },
          { key: 'pct', label: '% Share', num: true },
          { key: 'old', label: 'Over 48h', num: true, fmt: UI.n },
          { key: 'share', label: 'Distribution', fmt: function (_, o) { return UI.bar(o.n, maxN, o.pct); }, width: '24%', hideSm: true }
        ],
        onRow: function (o) {
          f.prob = f.prob === o.prob ? '' : o.prob;
          syncUrl(); render();
        }
      });
    }

    function renderRepeatTab(view) {
      var repMap = {};
      view.forEach(function (r) {
        if (!r.con || repeat[r.con] <= 1) return;
        var o = repMap[r.con] || (repMap[r.con] = {
          con: r.con, name: r.name, _supp: r._supp, _divn: r._divn, mobile: r.mobile,
          n: 0, probs: [], oldest: 0
        });
        o.n++;
        if (r.prob && o.probs.indexOf(r.prob) === -1) o.probs.push(r.prob);
        if (r.hours > o.oldest) o.oldest = r.hours;
      });
      var list = Object.keys(repMap).map(function (k) { return repMap[k]; });

      UI.table('table', {
        rows: list,
        sort: { key: 'n', dir: 'desc' },
        limit: 50,
        resetPage: true,
        empty: 'No repeat consumers matching these filters.',
        columns: [
          {
            key: 'name',
            label: 'Consumer',
            fmt: function (v, r) {
              return '<span class="ui-strong">' + UI.esc(v || r.con) + '</span><span class="sub">' + UI.esc(r.con) + '</span>';
            }
          },
          {
            key: '_supp',
            label: 'CCC',
            fmt: function (v, r) {
              return UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>';
            }
          },
          { key: 'n', label: 'Open Dockets', num: true, fmt: function (v) { return '<span class="ui-badge warn">' + v + ' dockets</span>'; } },
          {
            key: 'probs',
            label: 'Problems',
            cls: 'wrap',
            fmt: function (x) { return UI.esc(x.join(', ')); },
            hideSm: true
          },
          { key: 'oldest', label: 'Oldest', num: true, fmt: since, hideSm: true },
          { key: 'mobile', label: 'Mobile', hideSm: true }
        ],
        onRow: function (r) {
          f.q = r.con;
          $('q').value = r.con;
          tab = 'dockets';
          syncUrl(); render();
        }
      });
    }

    function detail(r) {
      var others = r.con ? all.filter(function (x) { return x.con === r.con && x !== r; }) : [];
      var pairs = [
        ['Docket number', r.doc], ['Problem', r.prob], ['Type', r.tech ? 'Technical' : 'Non-technical'],
        ['Description', r.desc], ['Consumer', r.name], ['Consumer ID', r.con], ['Mobile', r.mobile], ['Address', r.addr],
        ['CCC', r._supp], ['Division', r._divn], ['Region', r._region],
        ['Created', r.created ? UI.fmtDate(r.created) + ', ' + r.created.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : r.raw],
        ['Open for', since(r.hours)],
        ['Other open dockets', others.map(function (o) { return o.doc + ' (' + o.prob + ', ' + since(o.hours) + ')'; }).join('; ') || 'None']
      ];
      UI.drawer('Docket ' + r.doc, [r._supp, r._divn].filter(Boolean).join(' · '), pairs);
      var head = document.querySelector('#ui-drawer header'), btn = head ? head.querySelector('.rd-copy') : null;
      if (head && !btn) {
        btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ui-btn sm rd-copy';
        btn.innerHTML = UI.icon('copy') + 'Copy';
        head.insertBefore(btn, head.lastElementChild);
      }
      if (btn) {
        btn.onclick = function () {
          var text = '*Docket Call*\n' + pairs.filter(function (p) { return !UI.blank(p[1]); }).map(function (p) { return '*' + p[0] + ':* ' + p[1]; }).join('\n');
          UI.copy(text).then(function () { UI.toast('Details copied'); });
        };
      }
    }

    // Office filter change events
    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); markAll(); syncUrl(); render();
      });
    });

    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); syncUrl(); render(); }, 160));

    // Stats click toggles status filter
    $('stats').addEventListener('click', function (e) {
      var s = e.target.closest('.ui-stat');
      if (!s) return;
      var k = s.getAttribute('data-k');
      f.stat = f.stat === k ? '' : k;
      syncUrl(); render();
    });

    // Tab navigation
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.ui-drill-tab');
      if (!b) return;
      tab = b.getAttribute('data-tab');
      syncUrl(); render();
    });

    $('rhFiltersBar').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-rh-clear]');
      if (btn) {
        var idx = parseInt(btn.getAttribute('data-rh-clear'), 10);
        if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
          currentActiveFilters[idx].clear();
          render();
        }
        return;
      }
      if (e.target.closest('#rhClearBtn')) {
        clearAll();
      }
    });

    // Copy summary action
    $('copyBtn').addEventListener('click', function () {
      var b = base({});
      var view = f.stat ? b.filter(STAT[f.stat]) : b;
      var totTech = view.filter(STAT.tech).length;
      var totOld = view.filter(STAT.old).length;
      var text = 'Docket Calls — ' + ($('tableTitle').textContent || 'Summary') + '\n' +
        'Open Dockets: ' + UI.n(view.length) + '\n' +
        'Technical: ' + UI.n(totTech) + ' (' + UI.pct(totTech, view.length) + ')\n' +
        'Over 48 hours: ' + UI.n(totOld) + ' (' + UI.pct(totOld, view.length) + ')\n' +
        (f.stat ? 'Filter: ' + f.stat + '\n' : '') +
        ($('regionFilter').value ? 'Region: ' + $('regionFilter').value + '\n' : '') +
        ($('divisionFilter').value ? 'Division: ' + $('divisionFilter').value + '\n' : '') +
        ($('cccFilter').value ? 'CCC: ' + $('cccFilter').value + '\n' : '');
      UI.copy(text).then(function () { UI.toast('Summary copied to clipboard'); });
    });

    // Export CSV
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('open-dockets.csv', [
        { key: 'doc', label: 'Docket' },
        { key: 'con', label: 'Consumer ID' },
        { key: 'name', label: 'Consumer' },
        { key: 'mobile', label: 'Mobile' },
        { key: '_region', label: 'Region' },
        { key: '_divn', label: 'Division' },
        { key: '_supp', label: 'CCC' },
        { key: 'prob', label: 'Problem' },
        { key: 'tech', label: 'Type', csv: function (r) { return r.tech ? 'Technical' : 'Non-technical'; } },
        { key: 'addr', label: 'Address' },
        { key: 'raw', label: 'Created' }
      ], window.__view || []);
    });

    // Inside the workstation, open the KPI page as its own report.
    $('kpiLink').addEventListener('click', function (e) {
      if (window.parent !== window && typeof window.parent.openPage === 'function') {
        e.preventDefault();
        window.parent.openPage('docket/kpi.html', 'Docket KPI');
      }
    });

    MzoRows.refresh('refreshBtn', 'docket_calls', function (t) {
      prepare(t);
      render();
    });

    // Read deep link params on start
    function initParams() {
      var p = new URLSearchParams(location.search);
      if (p.has('region')) $('regionFilter').value = p.get('region');
      if (p.has('division')) $('divisionFilter').value = p.get('division');
      if (p.has('ccc')) $('cccFilter').value = p.get('ccc');
      if (p.has('q')) { f.q = p.get('q'); $('q').value = f.q; }
      if (p.has('stat')) f.stat = p.get('stat');
      if (p.has('type')) f.type = p.get('type');
      if (p.has('age')) f.age = p.get('age');
      if (p.has('prob')) f.prob = p.get('prob');
      if (p.has('rep')) f.rep = p.get('rep');
      if (p.has('tab')) tab = p.get('tab');
    }

    var first = true;
    MzoRows.load('docket_calls', function (t, info) {
      if (!t) {
        if (info && info.error && !all.length) {
          $('meta').textContent = 'Could not load data';
          $('table').innerHTML = '<div class="ui-empty">Could not load data.</div>';
        }
        return;
      }
      prepare(t);
      if (first) {
        first = false;
        initParams();
        if (!new URLSearchParams(location.search).has('tab')) {
          if (scope && (scope.level === 'division' || scope.level === 'ccc')) tab = 'ccc';
          else if (scope && scope.level === 'region') tab = 'division';
        }
      }
      markAll();
      render();
    });
  });
  </script>
</body>
</html>
