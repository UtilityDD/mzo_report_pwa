<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Docket calls · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>#probHist .row { grid-template-columns: minmax(120px, 44%) minmax(0, 1fr) 52px; }</style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Docket calls</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <a class="ui-btn" href="/docket/kpi.html" id="kpiLink">Closure KPI</a>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Docket, consumer ID, name or mobile" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="probFilter" aria-label="Problem"><option value="">All problems</option></select></span>
      <span class="ui-select"><select id="ageFilter" aria-label="Open for"><option value="">Any age</option><option value="24">Over 24 hours</option><option value="48">Over 48 hours</option><option value="168">Over 7 days</option><option value="720">Over 30 days</option></select></span>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>

    <section class="ui-stats" style="--n:5" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Open dockets</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="tech"><div class="k">Technical</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="nontech"><div class="k">Non-technical</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="old"><div class="k">Open over 48 hours</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="repeat"><div class="k">Repeat consumers</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <section class="ui-panel">
        <div class="ui-panel-h">
          <h2>By office</h2>
          <div class="ui-tabs" role="tablist" id="levelTabs">
            <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
            <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
            <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
          </div>
        </div>
        <div id="officeTable" style="--max-h:520px"><div class="ui-empty">Loading…</div></div>
      </section>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Open for</h2></div>
          <div class="ui-panel-b"><div id="ageHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Top problems</h2></div>
          <div class="ui-panel-b"><div id="probHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Dockets <small id="listCount"></small></h2>
        <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
      </div>
      <div id="listTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var TECH = ['Meter defective and No Power', 'Meter (Tampering)', 'Service (main) problem', 'Service (main) problem (UG cable)', 'Service(main) problem(OH Line)', 'Breakage or uprooting of pole', 'Flashing/Glowing', 'No power', 'Dis. transformer problem', 'Voltage fluctuation', 'Insulator break at pole', 'Earthing problem', 'Fuse problem', 'Alteration of Services', 'Load Shedding Problem', 'Bird fault', 'Conductor snap', 'LT wire problem', 'Sagging of wire', 'Single phasing', 'Voltage complaint', 'Cable fault', 'Cable fault where RMU exists', 'Cable fault where no RMU exists', 'Frequent tripping', 'Short circuit', 'Problem in Shifting of Meter'];
    var AGE = [{ key: 'h0', label: 'Under 24 hours', max: 24 }, { key: 'h1', label: '1–2 days', max: 48 }, { key: 'h2', label: '2–7 days', max: 168 }, { key: 'h3', label: '7–30 days', max: 720 }, { key: 'h4', label: 'Over 30 days', max: Infinity }];
    var all = [], f = { q: '', stat: '', age: '' }, level = 'region', scope = null, latest = null, repeat = {};

    // "dd/mm/yyyy hh:mm:ss" (seconds sometimes dotted: 22.44.30)
    function when(s) {
      var m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2})[.:](\d{1,2})(?:[.:](\d{1,2}))?)?/);
      return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : null;
    }
    function since(h) {
      if (h == null) return '—';
      if (h < 1) return Math.max(1, Math.round(h * 60)) + 'm';
      if (h < 48) return Math.floor(h) + 'h';
      return UI.age(Math.floor(h / 24));
    }

    function prepare(text) {
      var now = Date.now(); latest = null; repeat = {};
      all = UI.csv(text).filter(function (d) { return d.doc_no; }).map(function (d) {
        var o = UI.office(d.ccc_code), t = when(d.doc_crn_dt), prob = String(d.prob_type || '').trim();
        if (t && (!latest || t > latest)) latest = t;
        return {
          doc: d.doc_no, con: String(d.con_id || '').trim(), name: UI.blank(d.PARTY_NAME) ? '' : UI.title(d.PARTY_NAME), mobile: UI.blank(d.Mob_No) ? '' : d.Mob_No,
          addr: d.addr, prob: prob, desc: d.DESCRIPTION, created: t, raw: d.doc_crn_dt, code: d.ccc_code,
          hours: t ? (now - t.getTime()) / 36e5 : null, tech: TECH.indexOf(prob) !== -1,
          _region: o.region, _divn: o.division, _supp: o.ccc || UI.title(String(d.ccc_name || d.ccc_code || '').replace(/\s*CCC.*$/i, '')), CCC_CODE: d.ccc_code
        };
      });
      if (window.MzoScope) all = window.MzoScope.filterRows(all);
      all.forEach(function (r) { r.ageKey = r.hours == null ? '' : AGE.filter(function (a) { return r.hours < a.max; })[0].key; if (r.con) repeat[r.con] = (repeat[r.con] || 0) + 1; });
      $('meta').textContent = (latest ? 'Up to ' + UI.fmtDate(latest) + ', ' + latest.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) + ' · ' : '') + UI.n(all.length) + ' open';
      var probs = {}; all.forEach(function (r) { if (r.prob) probs[r.prob] = (probs[r.prob] || 0) + 1; });
      UI.fill('probFilter', Object.keys(probs).sort(), 'All problems');
      fillOffices();
    }
    function fillOffices() {
      UI.offices(all);
      if (!scope) scope = UI.lockScope();
    }

    var STAT = {
      tech: function (r) { return r.tech; },
      nontech: function (r) { return !r.tech; },
      old: function (r) { return r.hours != null && r.hours >= 48; },
      repeat: function (r) { return r.con && repeat[r.con] > 1; }
    };
    function base(skipAge) {
      var q = f.q.toLowerCase(), reg = $('regionFilter').value, div = $('divisionFilter').value, ccc = $('cccFilter').value, prob = $('probFilter').value, age = +$('ageFilter').value || 0;
      return all.filter(function (r) {
        return (!reg || r._region === reg) && (!div || r._divn === div) && (!ccc || r._supp === ccc) && (!prob || r.prob === prob) &&
          (!age || (r.hours != null && r.hours >= age)) && (skipAge || !f.age || r.ageKey === f.age) &&
          (!q || String(r.doc).indexOf(q) !== -1 || r.con.indexOf(q) !== -1 || r.name.toLowerCase().indexOf(q) !== -1 || String(r.mobile).indexOf(q) !== -1);
      });
    }

    function render() {
      var b = base(false), view = f.stat ? b.filter(STAT[f.stat]) : b;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = k ? b.filter(STAT[k]) : b;
        el.querySelector('.v').textContent = UI.n(rows.length);
        var cons = {}; rows.forEach(function (r) { if (r.con) cons[r.con] = 1; });
        el.querySelector('.s').textContent = !k || k === 'repeat' ? UI.n(Object.keys(cons).length) + ' consumers' : UI.pct(rows.length, b.length) + ' of open';
        el.setAttribute('aria-pressed', String(f.stat === k));
      });

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', g = {};
      view.forEach(function (r) {
        var name = r[key] || 'Unmapped';
        var o = g[name] || (g[name] = { name: name, parent: level === 'ccc' ? r._divn : level === 'division' ? r._region : '', n: 0, tech: 0, old: 0, oldest: 0 });
        o.n++; if (r.tech) o.tech++; if (r.hours >= 48) o.old++; if (r.hours > o.oldest) o.oldest = r.hours;
      });
      var list = Object.keys(g).map(function (k) { return g[k]; }), max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([0]));
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No open dockets for these filters.',
        columns: [
          { key: 'name', label: level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region', fmt: function (v, x) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (x.parent ? '<span class="sub">' + UI.esc(x.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Open', num: true, fmt: UI.n },
          { key: 'tech', label: 'Technical', num: true, fmt: UI.n, hideSm: true },
          { key: 'old', label: 'Over 48 h', num: true, fmt: UI.n },
          { key: 'oldest', label: 'Oldest', num: true, fmt: since, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (x) { return x.n; }, fmt: function (_, x) { return UI.bar(x.n, max, UI.pct(x.n, view.length)); }, hideSm: true, width: '24%' }
        ],
        foot: list.length > 1 ? { n: view.length, tech: view.filter(STAT.tech).length, old: view.filter(STAT.old).length } : null,
        onRow: level === 'ccc' ? function (x) { $('cccFilter').value = x.name; fillOffices(); markAll(); render(); } : function (x) { drill(x.name); }
      });

      var forAge = base(true).filter(function (r) { return !f.stat || STAT[f.stat](r); });
      UI.hist('ageHist', AGE.map(function (a) { return { key: a.key, label: a.label, value: forAge.filter(function (r) { return r.ageKey === a.key; }).length }; }),
        { active: f.age, onClick: function (row) { f.age = f.age === row.key ? '' : row.key; render(); } });
      var pc = {}; view.forEach(function (r) { pc[r.prob || '—'] = (pc[r.prob || '—'] || 0) + 1; });
      UI.hist('probHist', Object.keys(pc).sort(function (a, c) { return pc[c] - pc[a]; }).slice(0, 8).map(function (p) { return { key: p, label: p, value: pc[p] }; }),
        { active: $('probFilter').value, onClick: function (row) { $('probFilter').value = $('probFilter').value === row.key ? '' : row.key; UI.mark($('probFilter')); render(); } });

      $('listCount').textContent = UI.n(view.length);
      window.__view = view;
      UI.table('listTable', { rows: view, sort: { key: 'hours', dir: 'desc' }, limit: 50, resetPage: true, empty: 'No open dockets match these filters.', columns: COLS, onRow: detail });
      $('clearBtn').hidden = !(f.q || f.stat || f.age || $('probFilter').value || $('ageFilter').value || ['regionFilter', 'divisionFilter', 'cccFilter'].some(function (id) { return $(id).value && !$(id).disabled; }));
    }

    var COLS = [
      { key: 'doc', label: 'Docket', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span><span class="sub">' + (r.tech ? 'Technical' : 'Non-technical') + '</span>'; } },
      { key: 'name', label: 'Consumer', cls: 'wrap', fmt: function (v, r) { return UI.esc(v || '—') + (repeat[r.con] > 1 ? ' <span class="ui-badge warn">' + repeat[r.con] + ' open</span>' : '') + '<span class="sub">' + UI.esc(r.con || 'No consumer ID') + '</span>'; } },
      { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v || r.code) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
      { key: 'prob', label: 'Problem', cls: 'wrap', hideSm: true },
      { key: 'mobile', label: 'Mobile', hideSm: true },
      { key: 'hours', label: 'Open for', num: true, sortVal: function (r) { return r.hours == null ? -1 : r.hours; }, fmt: function (v) { return since(v); }, csv: function (r) { return r.raw; } }
    ];
    function detail(r) {
      var others = r.con ? all.filter(function (x) { return x.con === r.con && x !== r; }) : [];
      UI.drawer('Docket ' + r.doc, [r._supp, r._divn].filter(Boolean).join(' · '), [
        ['Problem', r.prob], ['Type', r.tech ? 'Technical' : 'Non-technical'], ['Description', r.desc], ['Consumer', r.name], ['Consumer ID', r.con], ['Mobile', r.mobile], ['Address', r.addr],
        ['Created', r.created ? UI.fmtDate(r.created) + ', ' + r.created.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : r.raw], ['Open for', since(r.hours)],
        ['Other open dockets', others.map(function (o) { return o.doc + ' (' + o.prob + ', ' + since(o.hours) + ')'; }).join('; ')]
      ]);
    }

    function setLevel(l) {
      level = l;
      [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === l)); });
      render();
    }
    function drill(name) {
      if (level === 'region') { $('regionFilter').value = name; $('divisionFilter').value = ''; level = 'division'; }
      else { $('divisionFilter').value = name; level = 'ccc'; }
      $('cccFilter').value = '';
      fillOffices(); markAll(); setLevel(level);
    }
    function markAll() { ['regionFilter', 'divisionFilter', 'cccFilter', 'probFilter', 'ageFilter'].forEach(function (id) { UI.mark($(id)); }); }

    ['regionFilter', 'divisionFilter', 'cccFilter'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        if (id === 'regionFilter') $('divisionFilter').value = '';
        if (id !== 'cccFilter') $('cccFilter').value = '';
        fillOffices(); markAll(); render();
      });
    });
    ['probFilter', 'ageFilter'].forEach(function (id) { $(id).addEventListener('change', function () { UI.mark(this); render(); }); });
    $('q').addEventListener('input', UI.debounce(function () { f.q = this.value.trim(); render(); }, 160));
    $('stats').addEventListener('click', function (e) { var s = e.target.closest('.ui-stat'); if (!s) return; var k = s.getAttribute('data-k'); f.stat = f.stat === k ? '' : k; render(); });
    $('levelTabs').addEventListener('click', function (e) { var t = e.target.closest('.ui-tab'); if (t) setLevel(t.getAttribute('data-l')); });
    $('clearBtn').addEventListener('click', function () {
      f.q = ''; f.stat = ''; f.age = ''; $('q').value = '';
      ['regionFilter', 'divisionFilter', 'cccFilter', 'probFilter', 'ageFilter'].forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
      fillOffices(); markAll();
      setLevel(scope && (scope.level === 'division' || scope.level === 'ccc') ? 'ccc' : scope && scope.level === 'region' ? 'division' : 'region');
    });
    $('exportBtn').addEventListener('click', function () {
      UI.exportCsv('open-dockets.csv', [{ key: 'doc', label: 'Docket' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Consumer' }, { key: 'mobile', label: 'Mobile' }, { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'prob', label: 'Problem' }, { key: 'tech', label: 'Type', csv: function (r) { return r.tech ? 'Technical' : 'Non-technical'; } }, { key: 'addr', label: 'Address' }, { key: 'raw', label: 'Created' }], window.__view || []);
    });
    // Inside the workstation, open the KPI page as its own report.
    $('kpiLink').addEventListener('click', function (e) {
      if (window.parent !== window && typeof window.parent.openPage === 'function') { e.preventDefault(); window.parent.openPage('docket/kpi.html', 'Docket KPI'); }
    });
    UI.refresh('refreshBtn', 'CACHE_DOCKET', function (t) { prepare(t); render(); });

    var first = true;
    UI.load('CACHE_DOCKET', function (text, info) {
      if (!text) { if (info && info.error) { $('meta').textContent = 'Could not load data'; $('listTable').innerHTML = $('officeTable').innerHTML = '<div class="ui-empty">Could not load data.</div>'; } return; }
      prepare(text);
      if (first) {
        first = false;
        if (scope && (scope.level === 'division' || scope.level === 'ccc')) level = 'ccc'; else if (scope && scope.level === 'region') level = 'division';
        [].forEach.call(document.querySelectorAll('#levelTabs .ui-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-l') === level)); });
      }
      render();
    });
  });
  </script>
</body>
</html>
