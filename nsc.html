<!DOCTYPE html>
<html lang="en" class="ui">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending NSC · MZO Reports</title>
  <script src="/mzo_theme.js?v=3"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=5" />
  <!-- auth gate (loads auth.js), app-update check, service worker -->
  <script src="/mzo_presets_hub.js?v=88"></script>
  <script src="/mzo_ui.js?v=4" defer></script>
  <script src="/mzo_data_hub.js?v=90" defer></script>
  <script src="/mzo_scope.js?v=14" defer></script>
  <style>
    .nsc-more { margin-top: -8px; }
    .nsc-more .lbl { font-size: 12.5px; color: var(--mzo-muted); }
    .nsc-more input[type="date"].ui-input { padding: 0 8px; width: 148px; }
    .nsc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
    .nsc-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 7px; border: 1px solid var(--mzo-border-strong); background: var(--mzo-surface-2); color: var(--mzo-text-2); font-size: 12.5px; cursor: pointer; }
    .nsc-chip:hover { color: var(--mzo-text); }
    .nsc-chip .ui-i { width: 13px; height: 13px; color: var(--mzo-muted); }
    .nsc-notice { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; padding: 9px 10px 9px 14px; border-radius: 10px; border: 1px solid var(--mzo-border); background: var(--mzo-surface); font-size: 13px; }
    .nsc-notice .ui-dot { margin-right: 8px; }
    .nsc-notice > div { display: flex; gap: 6px; }
    .nsc-late { color: var(--mzo-bad); font-weight: 500; }
    .nsc-notes { margin-left: 6px; }

    /* Mix: two-way splits */
    .nsc-mix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 32px; }
    #appTable td:not(.wrap) { white-space: nowrap; }
    .nsc-mix .row { display: grid; gap: 6px; }
    .nsc-mix .t { font-size: 12.5px; color: var(--mzo-muted); }
    .nsc-mix .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--mzo-chart-soft); }
    .nsc-mix .bar b { display: block; height: 100%; background: var(--mzo-chart); transition: width .25s ease; }
    .nsc-mix .legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
    .nsc-mix .legend button { white-space: nowrap; border: 0; background: none; padding: 2px 6px; margin: 0 -6px; border-radius: 6px; font-size: 12.5px; color: var(--mzo-text-2); cursor: pointer; font-variant-numeric: tabular-nums; }
    .nsc-mix .legend button:hover { background: var(--mzo-row-hover); color: var(--mzo-text); }
    .nsc-mix .legend button b { font-weight: 600; color: var(--mzo-text); margin-left: 4px; }
    .nsc-mix .legend button[aria-pressed="true"] { background: var(--mzo-surface-2); color: var(--mzo-text); box-shadow: inset 0 0 0 1px var(--mzo-border-strong); }
    .nsc-mix .legend button i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--mzo-chart); vertical-align: 0; }
    .nsc-mix .legend button + button i { background: var(--mzo-chart-soft); box-shadow: inset 0 0 0 1px var(--mzo-border-strong); }

    /* Detail drawer extras */
    .nsc-act { display: flex; gap: 8px; padding: 12px 20px 0; }
    .nsc-fu { padding: 4px 20px 8px; border-bottom: 1px solid var(--mzo-border); margin-bottom: 4px; }
    .nsc-fu h4 { margin: 14px 0 10px; font-size: 13px; font-weight: 600; }
    .nsc-fu-list { display: grid; gap: 8px; margin-bottom: 12px; }
    .nsc-fu-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--mzo-border); border-radius: 8px; }
    .nsc-fu-item .n { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    .nsc-fu-item .q { margin-top: 3px; font-size: 12px; color: var(--mzo-muted); }
    .nsc-fu-empty { font-size: 12.5px; color: var(--mzo-muted); margin-bottom: 12px; }
    .nsc-fu textarea { width: 100%; min-height: 72px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
    .nsc-fu .err { margin: 6px 0 0; font-size: 12.5px; color: var(--mzo-bad); }
    .nsc-fu .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .nsc-fu .row span { font-size: 12px; color: var(--mzo-faint); }

    /* Login-scope banner from mzo_scope.js, quieted to match the page */
    #mzo-scope-banner { background: none !important; border: 0 !important; color: var(--mzo-muted) !important; padding: 0 !important; margin: -14px 0 14px; font-size: 12.5px !important; }
    #mzo-scope-banner > span { display: none; }

    @media (max-width: 760px) {
      .nsc-mix { grid-template-columns: minmax(0, 1fr); }
      .ui-head .ui-seg { order: 3; }
      .nsc-more input[type="date"].ui-input { width: 136px; }
    }
  </style>
</head>
<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Pending NSC</h1>
        <p id="meta">Loading…</p>
      </div>
      <div class="ui-actions">
        <div class="ui-seg" id="agri" role="group" aria-label="Agriculture">
          <button type="button" data-a="" aria-pressed="true">All</button>
          <button type="button" data-a="non" aria-pressed="false">Excl. agri</button>
          <button type="button" data-a="agri" aria-pressed="false">Agri only</button>
        </div>
        <a class="ui-btn" id="uploadLink" href="nsc/upload.html" hidden><svg class="ui-i"><use href="#ui-upload"/></svg>Upload</a>
        <button type="button" class="ui-btn" id="topBtn" title="Sort applications by delay">Most delayed</button>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Reload data" title="Reload data"><svg class="ui-i"><use href="#ui-refresh"/></svg></button>
      </div>
    </header>

    <div class="nsc-notice" id="notice" role="status" hidden>
      <span><span class="ui-dot warn"></span><span id="noticeMsg">New NSC data is available.</span></span>
      <div><button type="button" class="ui-btn sm primary" id="noticeLoad">Load latest</button><button type="button" class="ui-btn sm ghost" id="noticeDismiss">Dismiss</button></div>
    </div>

    <div class="ui-filters">
      <label class="ui-search"><svg class="ui-i"><use href="#ui-search"/></svg><input class="ui-input" id="q" type="search" placeholder="Application, consumer ID, name or phone" autocomplete="off" /></label>
      <span class="ui-select"><select id="regionFilter" aria-label="Region"><option value="">All regions</option></select></span>
      <span class="ui-select"><select id="divisionFilter" aria-label="Division"><option value="">All divisions</option></select></span>
      <span class="ui-select"><select id="cccFilter" aria-label="CCC"><option value="">All CCCs</option></select></span>
      <span class="ui-select"><select id="classFilter" aria-label="Class"><option value="">All classes</option></select></span>
      <span class="ui-select"><select id="delayFilter" aria-label="Delay"><option value="">Any delay</option></select></span>
      <button type="button" class="ui-btn ghost" id="moreBtn" aria-expanded="false"><svg class="ui-i"><use href="#ui-filter"/></svg><span>More filters</span></button>
      <button type="button" class="ui-btn ghost" id="clearBtn" hidden><svg class="ui-i"><use href="#ui-x"/></svg>Clear</button>
    </div>
    <div class="ui-filters nsc-more" id="more" hidden>
      <span class="ui-select"><select id="agencyFilter" aria-label="Agency"><option value="">All agencies</option></select></span>
      <span class="ui-select"><select id="delay2Filter" aria-label="Delay, cumulative"><option value="">Any delay (cumulative)</option></select></span>
      <span class="lbl">Paid</span>
      <input class="ui-input" type="date" id="fromDate" aria-label="Paid from" />
      <span class="lbl">to</span>
      <input class="ui-input" type="date" id="toDate" aria-label="Paid to" />
    </div>
    <div class="nsc-chips" id="chips" hidden></div>

    <section class="ui-stats" style="--n:6" id="stats" aria-label="Summary">
      <button type="button" class="ui-stat" data-k=""><div class="k">Pending</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="d30"><div class="k">Over 30 days</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="pole"><div class="k">Pole cases</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="rescued"><div class="k">Rescued from withheld</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="ind"><div class="k">Industrial</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
      <button type="button" class="ui-stat" data-k="com3"><div class="k">Commercial three phase</div><div class="v"><span class="ui-skel"></span></div><div class="s">&nbsp;</div></button>
    </section>

    <div class="ui-grid">
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h">
            <h2>By office</h2>
            <div class="ui-actions">
              <div class="ui-tabs" role="tablist" id="levelTabs">
                <button type="button" class="ui-tab" role="tab" data-l="region" aria-selected="true">Region</button>
                <button type="button" class="ui-tab" role="tab" data-l="division">Division</button>
                <button type="button" class="ui-tab" role="tab" data-l="ccc">CCC</button>
              </div>
              <button type="button" class="ui-btn icon sm ghost" data-copy="office" aria-label="Copy table" title="Copy table"><svg class="ui-i"><use href="#ui-copy"/></svg></button>
            </div>
          </div>
          <div id="officeTable" style="--max-h:560px"><div class="ui-empty">Loading…</div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Mix</h2></div>
          <div class="ui-panel-b"><div class="nsc-mix" id="mix"></div></div>
        </section>
      </div>
      <div>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>Delay since payment</h2></div>
          <div class="ui-panel-b"><div id="delayHist"></div></div>
        </section>
        <section class="ui-panel">
          <div class="ui-panel-h"><h2>By class</h2></div>
          <div class="ui-panel-b"><div id="classHist"></div></div>
        </section>
      </div>
    </div>

    <section class="ui-panel">
      <div class="ui-panel-h">
        <h2>Breakdown</h2>
        <div class="ui-actions">
          <div class="ui-tabs" role="tablist" id="bTabs">
            <button type="button" class="ui-tab" role="tab" data-b="agency" aria-selected="true">Agency</button>
            <button type="button" class="ui-tab" role="tab" data-b="reason">Withheld reason</button>
            <button type="button" class="ui-tab" role="tab" data-b="insp">Inspection</button>
            <button type="button" class="ui-tab" role="tab" data-b="delay2">Delay, cumulative</button>
          </div>
          <button type="button" class="ui-btn icon sm ghost" data-copy="breakdown" aria-label="Copy table" title="Copy table"><svg class="ui-i"><use href="#ui-copy"/></svg></button>
        </div>
      </div>
      <div id="bTable" style="--max-h:420px"><div class="ui-empty">Loading…</div></div>
    </section>

    <section class="ui-panel" id="appsPanel">
      <div class="ui-panel-h">
        <h2>Applications <small id="appCount"></small></h2>
        <div class="ui-actions">
          <div class="ui-seg" id="appView" role="group" aria-label="View">
            <button type="button" data-v="all" aria-pressed="true">All</button>
            <button type="button" data-v="followups" aria-pressed="false">Follow-ups <span id="fuCount"></span></button>
          </div>
          <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i"><use href="#ui-download"/></svg>Export CSV</button>
        </div>
      </div>
      <div id="appTable"><div class="ui-empty">Loading…</div></div>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var LS = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
    };

    var NSC_CACHE_KEY = 'CACHE_NSC_v5';
    var PARSED_KEY = 'CACHE_NSC_PARSED_v7';
    var CLASS = { D: 'Domestic', A: 'Agriculture', C: 'Commercial', I: 'Industrial', P: 'Public', W: 'Water works', GS: 'Govt. supply', X: 'Other' };
    var DELAY_LABEL = { '0-3 Day': '0–3 days', '4-7 Day': '4–7 days', '8-15 Day': '8–15 days', '16-30 Day': '16–30 days', '1-2 Months': '1–2 months', '2-6 Months': '2–6 months', '6-12 Months': '6–12 months', '>1 Year': 'Over a year' };
    var DELAY2_ORDER = ['Within 3 days', 'More than 3 days', 'More than 7 days', 'More than 15 days', 'More than 1 month', 'More than 2 month', 'More than 6 month', 'More than 1 year'];
    var DELAY2_SERIALS = {
      'Within 3 days': [1], 'More than 3 days': [2, 3, 4, 5, 6, 7, 8], 'More than 7 days': [3, 4, 5, 6, 7, 8], 'More than 15 days': [4, 5, 6, 7, 8],
      'More than 1 month': [5, 6, 7, 8], 'More than 2 month': [6, 7, 8], 'More than 6 month': [7, 8], 'More than 1 year': [8]
    };
    var STAT = {
      '': function () { return true; },
      d30: function (d) { return (d._delaySc || 0) > 30; },
      pole: function (d) { return d._hasPole; },
      rescued: function (d) { return d._withheld; },
      ind: function (d) { return d._class === 'I'; },
      com3: function (d) { return d._class === 'C' && d._phase === 'III'; }
    };
    var STAT_LABEL = { d30: 'Over 30 days', pole: 'Pole cases', rescued: 'Rescued from withheld', ind: 'Industrial', com3: 'Commercial three phase' };
    var MIX = [
      { k: 'wo', t: 'Work order', a: 'Issued', b: 'Not issued', test: function (d) { return d._wo; } },
      { k: 'pole', t: 'Poles', a: 'Pole case', b: 'Non-pole', test: function (d) { return d._hasPole; } },
      { k: 'phase', t: 'Phase', a: 'Single', b: 'Three', test: function (d) { return d._phase !== 'III'; } },
      { k: 'area', t: 'Area', a: 'Rural', b: 'Urban', test: function (d) { return d._area !== 'U'; } },
      { k: 'portal', t: 'Applied via', a: 'Portal', b: 'Office', test: function (d) { return d._portal; } },
      { k: 'applicant', t: 'Applicant', a: 'Individual', b: 'Promoter / developer', test: function (d) { return !d._procB; } }
    ];

    var all = [], loadedCount = 0, reportDate = '', firstPaint = true;
    var f = { q: '', cls: '', delay: '', agency: '', delay2: '', from: 0, to: 0, agri: '', stat: '', mix: {}, reason: '', insp: '' };
    var level = 'region', btab = 'agency', appView = 'all', scope = null;
    var lastOffice = null, lastBreakdown = null, lastView = [];

    /* ---------------- parsing ---------------- */
    function parseDmy(s) {
      s = String(s || '').trim();
      if (s.indexOf('/') === -1) return 0;
      var p = s.split('/'), dd = parseInt(p[0], 10), mm = parseInt(p[1], 10), yy = parseInt(p[2], 10);
      if (!isFinite(dd) || !isFinite(mm) || !isFinite(yy)) return 0;
      if (yy < 100) yy += 2000;
      return new Date(yy, mm - 1, dd).getTime();
    }

    // Same shape as the old page's parsed cache (CACHE_NSC_PARSED_v7), so either can be read.
    // One row per APPL_NO: the last row in the dump wins.
    function normalize(list) {
      var S = window.MzoScope, byAppl = new Map();
      for (var i = 0; i < list.length; i++) {
        var d = list[i] || {};
        var appl = String(d.APPL_NO || '').trim().toLowerCase();
        if (!appl) continue;
        var o = UI.office(d.CCC_CODE, d.SUPP_OFF);
        var rawRegion = String(d.REGION || d.region || d.REG || d.reg || '').trim();
        var rawDivn = String(d.DIVN_NAME || d.divn_name || d.DIVN || d.Division || '').trim();
        var rawSupp = String(d.SUPP_OFF || d.supp_off || d.CCC || d.ccc || '').trim();
        var region = o.region || (S && S.regionNameOf(rawRegion)) || rawRegion;
        var divn = o.division || (S && S.divisionNameOf(rawDivn)) || rawDivn;
        var supp = o.ccc || (S && S.cccNameOf(rawSupp)) || rawSupp;
        var agency = String(d.AGENCY_NAME || d.agency_name || '').trim();
        var connClass = String(d.CONN_CLASS || d.conn_class || '').trim();
        var polesRaw = String(d.NO_OF_POLES || '').trim();
        var polesNum = parseInt(polesRaw, 10);
        var delaySc = parseFloat(d.DelayInSC);
        d.REGION = region || d.REGION || '';
        d.DIVN_NAME = divn; d.SUPP_OFF = supp; d.AGENCY_NAME = agency; d.CONN_CLASS = connClass;
        d._region = region; d._divn = divn; d._supp = supp;
        d._agency = agency || 'WO not issued';
        d._class = connClass.toUpperCase();
        d._polesRaw = polesRaw;
        d._hasPole = polesRaw !== '' && polesRaw !== '0' && !isNaN(polesNum) && polesNum > 0;
        d._delaySc = isNaN(delaySc) ? null : delaySc;
        d._delayRange = String(d.DelayRange || '').trim();
        d._delaySerial = parseInt(d.DelaySerial, 10) || 0;
        d._collMs = parseDmy(d.COLL_DATE);
        d._appl = appl;
        d._name = String(d.NAME || '').toLowerCase();
        d._phone = String(d.PHONE_NO || '').toLowerCase();
        byAppl.set(appl, d);
      }
      return Array.from(byAppl.values());
    }
    function dedupe(list) {
      var m = new Map();
      for (var i = 0; i < list.length; i++) { var d = list[i] || {}; var a = String(d.APPL_NO || d._appl || '').trim().toLowerCase(); if (a) m.set(a, d); }
      return Array.from(m.values());
    }
    function enrich(d) {
      d._poles = parseInt(d.NO_OF_POLES, 10) || 0;
      d._phase = String(d.APPLIED_PHASE || '').trim().toUpperCase();
      d._wo = String(d.WO_ISSUED || '').trim().toUpperCase() === 'Y';
      var w = String(d.SCN_WITHELD_DATE || '').trim();
      d._withheld = w !== '' && w !== '0';
      d._procB = String(d.APPLICANT_TYPE || '').trim() === 'Promoter/ Developer';
      d._portal = String(d.IS_PORTAL_APPL || '').trim().toUpperCase() === 'Y';
      d._area = String(d.CONN_CAT || '').trim().toUpperCase();
      d._reason = String(d.SCN_WITHELD_REASON || '').trim();
      d._insp = String(d.INSPECTION_COMMENT || '').trim().replace(/\s+/g, ' ');
      d._con = String(d.CON_ID || '').trim();
      if (!d._collMs && d._collMs !== 0) d._collMs = parseDmy(d.COLL_DATE);
    }

    function ver(key) { return LS.get('mzo_hub_ver_' + key) || ''; }

    /* ---------------- loading ---------------- */
    function setRows(list, incoming) {
      loadedCount = incoming || list.length;
      all = window.MzoScope ? window.MzoScope.filterRows(list) : list;
      all.forEach(enrich);
      var withDate = all[1] || all[0];
      reportDate = withDate && withDate.TODAY ? String(withDate.TODAY).trim() : '';
      $('meta').textContent = (reportDate ? 'As on ' + UI.fmtDate(reportDate) + ' · ' : '') + UI.n(all.length) + ' applications';
      fillFilters(true);
      if (firstPaint) { firstPaint = false; applyUrl(); }
      render();
    }

    function fromRaw(raw) {
      var data = typeof raw === 'string' ? UI.csv(raw) : raw;
      if (!Array.isArray(data)) throw new Error('Invalid data format');
      var incoming = data.filter(function (d) { return String((d && d.APPL_NO) || '').trim(); }).length;
      var norm = normalize(data);
      var hub = window.mzoDataHub;
      if (hub && norm.length) {
        var v = ver(NSC_CACHE_KEY) || 'v1';
        Promise.resolve(hub.set(PARSED_KEY, norm)).then(function () { LS.set('mzo_hub_ver_' + PARSED_KEY, v); }).catch(function () {});
      }
      setRows(norm, incoming);
    }

    function legacyCleanup() {
      var hub = window.mzoDataHub;
      if (!hub || typeof hub.delete !== 'function' || LS.get('mzo_nsc_legacy_cleared') === 'v5') return Promise.resolve();
      return Promise.all(['CACHE_NSC', 'CACHE_NSC_v2', 'CACHE_NSC_v3', 'CACHE_NSC_v4', 'CACHE_NSC_PARSED', 'CACHE_NSC_PARSED_v2', 'CACHE_NSC_PARSED_v3', 'CACHE_NSC_PARSED_v4']
        .map(function (k) { return Promise.resolve(hub.delete(k)).catch(function () {}); }))
        .then(function () { LS.set('mzo_nsc_legacy_cleared', 'v5'); });
    }

    function boot() {
      var hub = window.mzoDataHub, usedVer = '', loaded = false;
      if (!hub) { failed(); return; }
      legacyCleanup().then(function () {
        var rawVer = ver(NSC_CACHE_KEY), parsedVer = ver(PARSED_KEY);
        if (rawVer && parsedVer && rawVer === parsedVer) {
          return Promise.resolve(hub._peek(PARSED_KEY)).catch(function () { return null; }).then(function (c) {
            if (Array.isArray(c) && c.length) { setRows(dedupe(c), c.length); loaded = true; usedVer = rawVer; }
          });
        }
      }).then(function () {
        if (loaded) return;
        return Promise.resolve(hub._peek(NSC_CACHE_KEY)).catch(function () { return null; }).then(function (raw) {
          if (raw) { fromRaw(raw); loaded = true; usedVer = ver(NSC_CACHE_KEY); }
        });
      }).then(function () {
        return Promise.resolve(hub.waitForDataset(NSC_CACHE_KEY)).catch(function () {});
      }).then(function () {
        var now = ver(NSC_CACHE_KEY);
        if (loaded && (!now || now === usedVer)) return;
        return Promise.resolve(hub._peek(NSC_CACHE_KEY)).then(function (raw) {
          if (raw) return raw;
          return Promise.resolve(hub.get(NSC_CACHE_KEY));
        }).then(function (raw) {
          if (raw) return raw;
          return fetch('/api/nsc/dataset', { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(function (text) { return Promise.resolve(hub.set(NSC_CACHE_KEY, text)).catch(function () {}).then(function () { return text; }); });
        }).then(function (raw) { if (raw) fromRaw(raw); else if (!loaded) failed(); });
      }).catch(function (e) { console.error('[NSC] load', e); if (!all.length) failed(); })
        .then(reconcile);
    }

    function failed() {
      $('meta').textContent = 'Could not load data';
      ['officeTable', 'bTable', 'appTable'].forEach(function (id) { $(id).innerHTML = '<div class="ui-empty">Could not load data. <button type="button" class="ui-btn sm" onclick="location.reload()">Retry</button></div>'; });
      [].forEach.call(document.querySelectorAll('#stats .v'), function (el) { el.textContent = '—'; });
    }

    // If the cache holds far fewer rows than the server published, refetch once per session.
    function reconcile() {
      var hub = window.mzoDataHub;
      if (!hub || !loadedCount || window.__nscReconciled) return;
      try { if (sessionStorage.getItem('mzo_nsc_reconcile_tried') === '1') return; } catch (e) {}
      fetch('/api/nsc/meta', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (m) {
        var expected = Number(m && m.meta && m.meta.publishedRows) || 0;
        if (expected > 0 && loadedCount < expected * 0.95) {
          window.__nscReconciled = true;
          try { sessionStorage.setItem('mzo_nsc_reconcile_tried', '1'); } catch (e) {}
          return Promise.resolve(hub.delete && hub.delete(PARSED_KEY)).then(function () { return hub.refresh(NSC_CACHE_KEY); })
            .then(function () { return hub._peek(NSC_CACHE_KEY); }).then(function (raw) { if (raw) fromRaw(raw); });
        }
        try { sessionStorage.removeItem('mzo_nsc_reconcile_tried'); } catch (e) {}
      }).catch(function () {});
    }

    /* ---------------- filters ---------------- */
    function fillFilters(initial) {
      UI.offices(all);
      var o = office();
      UI.fill('agencyFilter', UI.uniq(all.filter(function (r) { return (!o.region || r._region === o.region) && (!o.division || r._divn === o.division) && (!o.ccc || r._supp === o.ccc); }), '_agency'), 'All agencies');
      if (initial) {
        var cc = {}; all.forEach(function (r) { if (r._class) cc[r._class] = (cc[r._class] || 0) + 1; });
        UI.fill('classFilter', Object.keys(cc).sort(function (a, b) { return cc[b] - cc[a]; }).map(function (c) { return { value: c, label: CLASS[c] ? CLASS[c] : c }; }), 'All classes');
        var dr = {}; all.forEach(function (r) { if (r._delayRange) dr[r._delayRange] = r._delaySerial; });
        UI.fill('delayFilter', Object.keys(dr).sort(function (a, b) { return dr[a] - dr[b]; }).map(function (k) { return { value: k, label: DELAY_LABEL[k] || k }; }), 'Any delay');
        UI.fill('delay2Filter', DELAY2_ORDER, 'Any delay (cumulative)');
      }
      if (!scope) scope = UI.lockScope();
      ['regionFilter', 'divisionFilter', 'cccFilter', 'agencyFilter', 'classFilter', 'delayFilter', 'delay2Filter'].forEach(function (id) { UI.mark($(id)); });
    }
    function office() { return { region: $('regionFilter').value, division: $('divisionFilter').value, ccc: $('cccFilter').value }; }

    // skip: a filter key to ignore (so a breakdown can still show its own alternatives)
    function matches(d, o, skip) {
      if (o.region && d._region !== o.region) return false;
      if (o.division && d._divn !== o.division) return false;
      if (o.ccc && d._supp !== o.ccc) return false;
      if (skip !== 'cls' && f.cls && d._class !== f.cls) return false;
      if (skip !== 'delay' && f.delay && d._delayRange !== f.delay) return false;
      if (skip !== 'agency' && f.agency && d._agency !== f.agency) return false;
      if (skip !== 'delay2' && f.delay2 && (DELAY2_SERIALS[f.delay2] || []).indexOf(d._delaySerial) === -1) return false;
      if (f.from && (!d._collMs || d._collMs < f.from)) return false;
      if (f.to && (!d._collMs || d._collMs > f.to)) return false;
      if (f.agri === 'non' && d._class === 'A') return false;
      if (f.agri === 'agri' && d._class !== 'A') return false;
      if (skip !== 'reason' && f.reason && d._reason !== f.reason) return false;
      if (skip !== 'insp' && f.insp && d._insp !== f.insp) return false;
      for (var i = 0; i < MIX.length; i++) {
        var m = MIX[i], want = f.mix[m.k];
        if (want && skip !== 'mix:' + m.k && (want === 'a') !== !!m.test(d)) return false;
      }
      if (f.q) {
        if (d._appl.indexOf(f.q) === -1 && d._name.indexOf(f.q) === -1 && d._phone.indexOf(f.q) === -1 && d._con.indexOf(f.q) === -1) return false;
      }
      return true;
    }
    function rowsWhere(skip, withStat) {
      var o = office(), st = STAT[withStat ? f.stat : ''] || STAT[''];
      return all.filter(function (d) { return matches(d, o, skip) && st(d); });
    }

    /* ---------------- render ---------------- */
    function render() {
      var base = rowsWhere('', false);
      var view = base.filter(STAT[f.stat] || STAT['']);
      lastView = view;
      renderStats(base);
      renderOffice(view);
      renderHists();
      renderBreakdown(view);
      renderMix();
      renderApps(view);
      renderChips();
      syncLevelTabs();
    }

    function renderStats(base) {
      var delays = base.map(function (d) { return d._delaySc; }).filter(function (x) { return x != null; }).sort(function (a, b) { return a - b; });
      var median = delays.length ? delays[Math.floor(delays.length / 2)] : null;
      [].forEach.call(document.querySelectorAll('#stats .ui-stat'), function (el) {
        var k = el.getAttribute('data-k'), rows = k ? base.filter(STAT[k]) : base;
        el.querySelector('.v').textContent = UI.n(rows.length);
        var s;
        if (!k) s = median != null ? 'Median delay ' + UI.age(Math.round(median)) : '—';
        else if (k === 'pole') s = UI.n(rows.reduce(function (a, d) { return a + d._poles; }, 0)) + ' poles needed';
        else s = UI.pct(rows.length, base.length) + ' of pending';
        el.querySelector('.s').textContent = s;
        el.setAttribute('aria-pressed', String(f.stat === k));
      });
    }

    function levelVisible(l) {

      if (l === 'division') return !$('divisionFilter').disabled;
      return !$('cccFilter').disabled;
    }

        t.setAttribute('aria-selected', String(l === level));
      });
    }

      var key = level === 'region' ? '_region' : level === 'division' ? '_divn' : '_supp', groups = {};
      view.forEach(function (d) {

        g.n++; if ((d._delaySc || 0) > 30) g.d30++; g.poles += d._poles;
      });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
      var label = level === 'ccc' ? 'CCC' : level === 'division' ? 'Division' : 'Region';
      lastOffice = { title: 'By ' + label.toLowerCase(), cols: [label, 'Pending', 'Over 30 days', 'Poles'], rows: list.slice().sort(function (a, b) { return b.n - a.n; }).map(function (g) { return [g.name, g.n, g.d30, g.poles]; }) };
      UI.table('officeTable', {
        rows: list, sort: { key: 'n', dir: 'desc' }, count: false, empty: 'No pending applications for these filters.',
        columns: [
          { key: 'name', label: label, fmt: function (v, g) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (g.parent ? '<span class="sub">' + UI.esc(g.parent) + '</span>' : ''); } },
          { key: 'n', label: 'Pending', num: true, fmt: UI.n },

          { key: 'poles', label: 'Poles', num: true, fmt: UI.n, hideSm: true },
          { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, view.length)); }, hideSm: true, width: '26%' }
        ],
        foot: list.length > 1 ? { n: view.length, d30: view.filter(STAT.d30).length, poles: view.reduce(function (a, d) { return a + d._poles; }, 0) } : null,
        onRow: function (g) { drill(g.name); }

    function renderHists() {
      var forDelay = rowsWhere('delay', true), dr = {};

        .map(function (k) { return { key: k, label: DELAY_LABEL[k] || k, value: dr[k] || 0 }; }),
        { active: f.delay, onClick: function (row) { f.delay = f.delay === row.key ? '' : row.key; $('delayFilter').value = f.delay; UI.mark($('delayFilter')); render(); } });
      var forClass = rowsWhere('cls', true), cc = {};

      UI.hist('classHist', Object.keys(cc).sort(function (a, b) { return cc[b] - cc[a]; }).slice(0, 6).map(function (c) { return { key: c, label: CLASS[c] || c, value: cc[c] }; }),
        { active: f.cls, onClick: function (row) { f.cls = f.cls === row.key ? '' : row.key; $('classFilter').value = f.cls; UI.mark($('classFilter')); render(); } });
    }

    function renderBreakdown(view) {
      var groups = {}, list, label, total = view.length;
      var add = function (name, d) { var g = groups[name] || (groups[name] = { name: name, n: 0, poles: 0 }); g.n++; g.poles += d._poles; };
      if (btab === 'agency') { label = 'Agency'; rowsWhere('agency', true).forEach(function (d) { add(d._agency, d); }); }
      else if (btab === 'reason') { label = 'Withheld reason'; rowsWhere('reason', true).forEach(function (d) { if (d._reason) add(d._reason, d); }); }
      else if (btab === 'insp') { label = 'Inspection comment'; rowsWhere('insp', true).forEach(function (d) { if (d._insp) add(d._insp, d); }); }
      else {

      UI.table(el, {

          { key: 'share', label: 'Share', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, total)); }, hideSm: true, width: '28%' }
        ],
        onRow: function (g) {

          else if (btab === 'reason') f.reason = f.reason === g.name ? '' : g.name;
          else if (btab === 'insp') f.insp = f.insp === g.name ? '' : g.name;
          else { f.delay2 = f.delay2 === g.name ? '' : g.name; $('delay2Filter').value = f.delay2; UI.mark($('delay2Filter')); }
          render();
        }
      });
    }

    function renderMix() {
      $('mix').innerHTML = MIX.map(function (m) {

            { key: 'ccc', label: 'CCC', hideSm: true, fmt: function (v, it) { return UI.esc(v || '—') + '<span class="sub">' + UI.esc(it.row._divn) + '</span>'; } },
            { key: 'note', label: 'Latest note', cls: 'wrap', fmt: function (v, it) { return UI.esc(v.length > 140 ? v.slice(0, 140) + '…' : v) + '<span class="sub">' + UI.esc(quietLine(it.latest)) + '</span>'; } },

    function renderChips() {
      var chips = [];

    function clearChip(k) {

      else if (k === 'delay2') { f.delay2 = ''; $('delay2Filter').value = ''; }

      else if (level === 'ccc' && !$('cccFilter').disabled) { $('cccFilter').value = $('cccFilter').value === name ? '' : name; }

      var lines = ['*Pending NSC*' + (ctx ? ' — ' + ctx : ''), t.title, t.cols.join(' | ')].concat(t.rows.map(function (r) { return r.join(' | '); }));

    /* ---------------- detail drawer + follow-ups ---------------- */
    var openRow = null;
    function detailPairs(d) {
      var yes = function (v) { return String(v || '').trim().toUpperCase() === 'Y'; };
      return [
        ['Consumer ID', d._con], ['Phone', d.PHONE_NO], ['Address', d.ADDRESS],
        ['CCC', [d._supp, d._divn].filter(Boolean).join(' · ')],
        ['Class', (CLASS[d._class] ? CLASS[d._class] + ' (' + d._class + ')' : d._class) + (d._area ? ' · ' + (d._area === 'U' ? 'Urban' : 'Rural') : '')],
        ['Load', (d.LOAD_WATTS ? UI.n(parseFloat(d.LOAD_WATTS) || 0) + ' W' : '') + (d._phase ? ' · ' + (d._phase === 'III' ? 'three phase' : 'single phase') : '')],

    function openDetail(d) {

        { key: 'APPLIED_PHASE', label: 'Phase' }, { key: 'LOAD_WATTS', label: 'Load (W)' }, { key: '_poles', label: 'Poles' }, { key: 'COLL_DATE', label: 'Paid' },
        { key: 'AGENCY_NAME', label: 'Agency' }, { key: 'WON', label: 'Work order' }, { key: 'DelayRange', label: 'Delay range' },
        { key: '_delaySc', label: 'Delay (days)', csv: function (d) { return d._delaySc == null ? '' : Math.round(d._delaySc); } }, { key: 'SCN_WITHELD_REASON', label: 'Withheld reason' }
      ];
      UI.exportCsv('pending-nsc.csv', cols, lastView);
    });
    document.addEventListener('click', function (e) {
      var c = e.target.closest('[data-copy]');
      if (c) { copyTable(c.getAttribute('data-copy') === 'office' ? lastOffice : lastBreakdown); return; }
      if (e.target.closest('[data-copy-detail]') && openRow) copyDetail(openRow);
    });
    $('refreshBtn').addEventListener('click', loadLatest);
    $('noticeLoad').addEventListener('click', loadLatest);
    $('noticeDismiss').addEventListener('click', function () {
      fetchMeta().then(function (d) { if (d && d.version) markSeen(d.version); });
      $('notice').hidden = true;
    });

    /* ---------------- start ---------------- */
    if (LS.get(PENDING_KEY) === '1') {
      // An upload just finished on this device: start from the fresh dump.
      Promise.resolve(window.mzoDataHub && window.mzoDataHub.waitForDataset(NSC_CACHE_KEY)).catch(function () {}).then(loadLatest);
    } else {
      boot();
    }
    setTimeout(checkUpdate, 2500);
    setInterval(checkUpdate, 90 * 1000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });
    window.addEventListener('focus', checkUpdate);
    try {
      var ch = new BroadcastChannel('mzo-nsc');
      ch.onmessage = function (ev) {
        if (ev && ev.data && ev.data.type === 'nsc-uploaded') {
          if (ev.data.version && (LS.get(SEEN_KEY) || '') === String(ev.data.version)) return;
          showNotice(ev.data.reportDate);
        }
      };
    } catch (e) {}
  });
  </script>
</body>
</html>
