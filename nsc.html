<!DOCTYPE html>
<html lang="en" class="ui">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending NSC · DISHA</title>
  <script src="/mzo_theme.js?v=9"></script>
  <link rel="stylesheet" href="/mzo_theme.css?v=25" />
  <!-- auth gate (loads auth.js), app-update check, service worker when opened on its own -->
  <script src="/mzo_presets_hub.js?v=89"></script>
  <script src="/mzo_ui.js?v=22" defer></script>
  <script src="/mzo_data_hub.js?v=94" defer></script>
  <script src="/lib/offices.js?v=3" defer></script>
  <script src="/mzo_scope.js?v=20" defer></script>
  <script src="/mzo_rows.js?v=7" defer></script>
  <script src="/nsc/nsc_trend.js?v=5" defer></script>
  <style>
    .ui-head {
      align-items: center;
    }

    /* New-upload notice */
    .nsc-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 16px;
      padding: 9px 10px 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--mzo-border);
      background: var(--mzo-surface);
      font-size: 13px;
    }

    .nsc-notice .ui-dot {
      margin-right: 8px;
    }

    .nsc-notice>div {
      display: flex;
      gap: 6px;
    }

    /* Content */
    .cl-kpis .ui-stat {
      padding: 13px 14px 14px;
    }

    .cl-hint {
      padding: 8px 16px;
      color: var(--mzo-muted);
      font-size: 12.5px;
      border-bottom: 1px solid var(--mzo-border);
    }

    .cl-hint:empty {
      display: none;
    }

    /* Follow-ups in the detail drawer */
    .nsc-fu h4:first-child {
      margin-top: 0;
    }

    .nsc-fu h4 {
      margin: 14px 0 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .nsc-fu-list {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .nsc-fu-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--mzo-border);
      border-radius: 8px;
    }

    .nsc-fu-item .n {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }

    .nsc-fu-item .q {
      margin-top: 3px;
      font-size: 12px;
      color: var(--mzo-muted);
    }

    .nsc-fu-empty {
      font-size: 12.5px;
      color: var(--mzo-muted);
      margin-bottom: 12px;
    }

    .nsc-fu textarea {
      width: 100%;
      min-height: 72px;
      padding: 8px 10px;
      resize: vertical;
      line-height: 1.45;
    }

    .nsc-fu .err {
      margin: 6px 0 0;
      font-size: 12.5px;
      color: var(--mzo-bad);
    }

    .nsc-fu .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    .nsc-fu .row span {
      font-size: 12px;
      color: var(--mzo-muted);
    }

    /* Aging Focus View (Stage 1) */
    .nsc-focus-ladder {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 760px) {
      .nsc-focus-ladder {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .nsc-ladder-step {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--mzo-border);
      background: var(--mzo-surface);
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .nsc-ladder-step:hover {
      border-color: var(--mzo-border-strong);
      background: var(--mzo-surface-2);
    }

    .nsc-ladder-h {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--mzo-muted);
      margin-bottom: 6px;
    }

    .nsc-ladder-v {
      font-size: 20px;
      font-weight: 750;
      color: var(--mzo-text);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .nsc-ladder-s {
      font-size: 11.5px;
      color: var(--mzo-muted);
      margin-top: 4px;
    }

    .nsc-focus-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    @media (max-width: 860px) {
      .nsc-focus-grid {
        grid-template-columns: 1fr;
      }
    }

    .nsc-card {
      background: var(--mzo-surface);
      border: 1px solid var(--mzo-border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .nsc-card-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--mzo-border);
      padding-bottom: 8px;
    }

    .nsc-card-h h3 {
      margin: 0;
      font-size: 13.5px;
      font-weight: 650;
      color: var(--mzo-text);
    }

    .nsc-card-h span {
      font-size: 11.5px;
      color: var(--mzo-muted);
    }

    .nsc-row-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nsc-focus-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--mzo-border);
      background: var(--mzo-bg);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background .12s, border-color .12s;
    }

    .nsc-focus-row:hover {
      background: var(--mzo-surface-2);
      border-color: var(--mzo-border-strong);
    }

    .nsc-focus-row-t {
      font-size: 13px;
      font-weight: 550;
      color: var(--mzo-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nsc-focus-row-t small {
      font-size: 11.5px;
      margin-left: 4px;
      font-weight: 400;
      color: var(--mzo-muted);
    }

    .nsc-focus-row-val {
      text-align: right;
      flex-shrink: 0;
      font-size: 13px;
    }

    .nsc-focus-row-n {
      font-weight: 700;
      color: var(--mzo-text);
      font-variant-numeric: tabular-nums;
    }

    .nsc-focus-row-p {
      font-size: 11.5px;
      color: var(--mzo-muted);
      margin-left: 2px;
    }

    .nsc-banner {
      margin-top: 16px;
      padding: 10px 16px;
      background: var(--mzo-surface);
      border: 1px solid var(--mzo-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

  </style>
</head>

<body>
  <main class="ui-page">
    <header class="ui-head">
      <div>
        <h1>Pending NSC<span class="ui-badge ui-date" id="asOn">…</span></h1>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn ui-side-toggle" id="sideToggle" aria-controls="side"
          aria-expanded="false" title="Toggle filters"><svg class="ui-i">
            <use href="#ui-filter" />
          </svg><span>Filters</span><span id="activeCount"></span></button>
        <div class="ui-seg" id="viewModeSeg" role="tablist" aria-label="View mode">
          <button type="button" id="btnFocusView" aria-pressed="true">Aging Focus (&gt;30d)</button>
          <button type="button" id="btnDetailView" aria-pressed="false">Detailed Analysis</button>
          <button type="button" id="btnTrendView" aria-pressed="false">Trend</button>
        </div>
        <a class="ui-btn" id="uploadBtn" href="nsc/upload.html" hidden><svg class="ui-i">
            <use href="#ui-upload" />
          </svg>Upload</a>
        <button type="button" class="ui-btn icon" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg
            class="ui-i">
            <use href="#ui-refresh" />
          </svg></button>
      </div>
    </header>

    <div class="nsc-notice" id="notice" role="status" hidden>
      <span><span class="ui-dot warn"></span><span id="noticeMsg">New NSC data is available.</span></span>
      <div><button type="button" class="ui-btn sm primary" id="noticeLoad">Load latest</button><button type="button"
          class="ui-btn sm ghost" id="noticeDismiss">Dismiss</button></div>
    </div>

    <div class="ui-layout side-collapsed" id="uiLayout">
      <aside class="ui-side" id="side" aria-label="Filters">
        <div class="ui-side-h">
          <h2>Filters<small id="activeLabel"></small></h2>
          <div style="display:flex;align-items:center;gap:4px">
            <button type="button" class="ui-btn ghost sm" id="clearBtn">Clear</button>
            <button type="button" class="ui-btn icon ghost sm" id="sideCloseBtn" aria-label="Close filters"
              title="Close"><svg class="ui-i">
                <use href="#ui-x" />
              </svg></button>
          </div>
        </div>
        <div class="ui-side-sec ui-side-stack">
          <label class="ui-search"><svg class="ui-i">
              <use href="#ui-search" />
            </svg><input class="ui-input" id="q" type="search" placeholder="Search" autocomplete="off"
              aria-label="Search by application, consumer ID, name or phone"
              title="Application no., consumer ID, name or phone" /></label>
          <span class="ui-select"><select id="regionFilter" aria-label="Region">
              <option value="">All regions</option>
            </select></span>
          <span class="ui-select"><select id="divisionFilter" aria-label="Division">
              <option value="">All divisions</option>
            </select></span>
          <span class="ui-select"><select id="cccFilter" aria-label="CCC">
              <option value="">All CCCs</option>
            </select></span>
          <span class="ui-select"><select id="classFilter" aria-label="Class">
              <option value="">All classes</option>
            </select></span>
          <span class="ui-select"><select id="agencyFilter" aria-label="Agency">
              <option value="">All agencies</option>
            </select></span>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Agriculture" id="fAgri"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Poles" id="fPole"></div>
        </div>
        <div class="ui-side-sec">
          <div aria-label="Work order" id="fWo"></div>
        </div>
        <div class="ui-side-sec">
          <div class="ui-seg ui-side-tabs" data-tabs role="tablist" aria-label="Delay since payment">
            <button type="button" role="tab" data-pane="fDelay" aria-pressed="true" aria-selected="true">Delay
              range</button>
            <button type="button" role="tab" data-pane="fDelay2" aria-pressed="false"
              aria-selected="false">Cumulative</button>
          </div>
          <div aria-label="Delay range" id="fDelay"></div>
          <div aria-label="Delay, cumulative" id="fDelay2" hidden></div>
        </div>
      </aside>

      <div class="ui-main">
        <!-- Stage 1: Aging Focus (>30d) View -->
        <div id="focusView">
          <div class="rh-filters-bar" id="focusFiltersBar" style="margin-bottom:12px" hidden></div>
          <section class="ui-stats cl-kpis" id="focusKpis" aria-label="Aging focus summary">
            <button type="button" class="ui-stat" id="fStatTotal">
              <div class="k">Total pending</div>
              <div class="v" id="fValTotal"><span class="ui-skel"></span></div>
              <div class="s" id="fSubTotal">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" id="fStatCritical" title="Click to inspect all >30 days pending">
              <div class="k"><span class="ui-dot bad"></span>&gt; 30 days (Critical)</div>
              <div class="v" id="fValCritical"><span class="ui-skel"></span></div>
              <div class="s" id="fSubCritical">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" id="fStatSevere" title="Click to inspect all >60 days pending">
              <div class="k"><span class="ui-dot bad"></span>&gt; 60 days (Severe)</div>
              <div class="v" id="fValSevere"><span class="ui-skel"></span></div>
              <div class="s" id="fSubSevere">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" id="fStatNonPole30"
              title="Click to inspect non-pole >30 days pending">
              <div class="k"><span class="ui-dot warn"></span>Non-pole &gt; 30d</div>
              <div class="v" id="fValNonPole30"><span class="ui-skel"></span></div>
              <div class="s" id="fSubNonPole30">&nbsp;</div>
            </button>
          </section>

          <section class="ui-panel" style="margin-top:14px;padding:14px 16px;">
            <div class="ui-panel-h" style="margin-bottom:6px;">
              <h2>Aging distribution</h2>
            </div>
            <div class="nsc-focus-ladder" id="agingLadder"></div>
          </section>

          <div class="nsc-focus-grid">
            <section class="nsc-card">
              <div class="nsc-card-h">
                <h3>Reasons for delay (&gt; 30d)</h3>
                <span id="whyTotal30"></span>
              </div>
              <div class="nsc-row-list" id="why30List"></div>
            </section>

            <section class="nsc-card">
              <div class="nsc-card-h">
                <h3 id="topOfficesTitle">Top delayed offices (&gt; 30d)</h3>
                <span id="topOfficesSub"></span>
              </div>
              <div class="nsc-row-list" id="topOfficesList"></div>
            </section>
          </div>

          <div class="nsc-banner">
            <span style="font-size:12.5px;color:var(--mzo-muted)">Detailed breakdown across offices, classes, phases and
              agencies</span>
            <button type="button" class="ui-btn primary sm" id="openDetailedBtn">Detailed Analysis &rarr;</button>
          </div>
        </div>

        <!-- Stage 3: Office pendency trend (Zone → CCC) from VM snapshots -->
        <div id="trendView" hidden>
          <div id="nscTrendHost"></div>
        </div>

        <!-- Stage 2: Detailed Analysis View (12 Drill Tabs & Full Table) -->
        <div id="detailView" hidden>
          <section class="ui-stats cl-kpis" id="kpis" aria-label="Summary">
            <button type="button" class="ui-stat" data-k="">
              <div class="k">Total pending</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" data-k="nonpole">
              <div class="k">Non-pole</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" data-k="pole">
              <div class="k">Pole</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" data-k="withheld">
              <div class="k" title="Rescued from withheld">From withheld</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" data-k="ind">
              <div class="k">Industrial</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" data-k="procb">
              <div class="k">Proc-B</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
            <button type="button" class="ui-stat" data-k="com3">
              <div class="k">Com. 3-phase</div>
              <div class="v"><span class="ui-skel"></span></div>
              <div class="s">&nbsp;</div>
            </button>
          </section>

          <section class="ui-panel">
            <div class="report-head" id="reportHead">
              <div class="rh-top">
                <div class="rh-title-wrap">
                  <h2 class="rh-title"><span id="rhTitle">Pending NSC Analysis</span></h2>
                  <span class="rh-badge" id="rhCount">Loading…</span>
                </div>
                <div class="ui-actions">
                  <button type="button" class="ui-btn sm" id="copyBtn"><svg class="ui-i">
                      <use href="#ui-copy" />
                    </svg>Copy</button>
                  <button type="button" class="ui-btn sm" id="exportBtn"><svg class="ui-i">
                      <use href="#ui-download" />
                    </svg>Export</button>
                </div>
              </div>
              <div class="rh-filters-bar" id="rhFiltersBar">
                <!-- Dynamically populated filter chips / all-clear status -->
              </div>
            </div>
            <div class="ui-drill-tabs" role="tablist" id="tabs"></div>
            <div id="scopeTrail" class="ui-scope-trail-host"></div>
            <div class="cl-hint" id="hint"></div>
            <div id="table">
              <div class="ui-empty">Loading…</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var LS = {
        get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
        del: function (k) { try { localStorage.removeItem(k); } catch (e) { } }
      };
      var ROWS = 'nsc_pending';

      /* ---------------- parsing: one row per APPL_NO (the last row in the dump wins), scoped to the login ---------------- */
      // t.rows: uniform rows of schema/nsc_pending.json (snake_case, numbers, ISO dates, Y/N as true/false,
      // canonical _region/_division/_ccc). Loaded unscoped so the last row per application wins first.
      var CLASS = { D: 'Domestic', A: 'Agriculture', C: 'Commercial', P: 'Public', I: 'Industrial', W: 'Water works', S: 'Street light', GS: 'Govt. supply', X: 'Other' };
      function blank(v) { var s = String(v == null ? '' : v).trim(); return !s || /^\(?null\)?$/i.test(s); }
      function parse(t) {
        var byAppl = new Map(), today = null, S = window.MzoScope, rows = [];
        t.rows.forEach(function (d) {
          if (!d.appl_no) return;
          byAppl.set(d.appl_no, d);
          if (!today && d.today) today = UI.date(d.today);
        });
        byAppl.forEach(function (d, appl) {
          var poles = Math.trunc(d.no_of_poles) || 0;
          var paid = UI.date(d.coll_date), delay = d.delayinsc;
          var cls = d.conn_class.toUpperCase();
          rows.push({
            appl: appl, con: d.con_id,
            name: blank(d.name) ? '' : UI.title(d.name), phone: blank(d.phone_no) ? '' : d.phone_no, address: blank(d.address) ? '' : d.address,
            _region: d._region, _divn: d._division || d.divn_name, _supp: d._ccc || d.supp_off, CCC_CODE: d.ccc_code,
            cls: cls, clsLabel: CLASS[cls] || cls || '—', phase: d.applied_phase.toUpperCase(), load: d.load_watts || 0,
            area: d.conn_cat === 'U' ? 'Urban' : d.conn_cat === 'R' ? 'Rural' : '',
            poles: poles, pole: poles > 0 || /^pole/i.test(d.polenonpole),
            wo: d.wo_issued === true, won: blank(d.won) ? '' : d.won, woDate: UI.date(d.wo_creation_date),
            agency: blank(d.agency_name) ? '' : d.agency_name, meter: blank(d.meter_number) ? '' : d.meter_number,
            withheld: d.scn_witheld_date !== '' && d.scn_witheld_date !== '0', reason: blank(d.scn_witheld_reason) ? '' : d.scn_witheld_reason,
            paid: paid, delay: delay == null ? (paid && today ? Math.max(0, Math.round((today - paid) / 864e5)) : null) : delay,
            portal: d.is_portal_appl === true, comment: blank(d.inspection_comment) ? '' : d.inspection_comment,
            delayRange: d.delayrange, delaySerial: Math.trunc(d.delayserial) || 0,
            procB: d.applicant_type === 'Promoter/ Developer', status: blank(d.scn_status) ? '' : d.scn_status
          });
        });
        var zoneForRank = rows.slice();
        if (S) rows = S.filterRows(rows);
        rows.asOn = today;
        rows._zoneForRank = zoneForRank;
        return rows;
      }

      // Delay status by DelaySerial (1 = 0–3 days … 8 = over a year): up to a month ok, up to six months warn, then bad.
      function delayDot(serial) { return serial >= 7 ? 'bad' : serial >= 5 ? 'warn' : serial >= 1 ? 'ok' : ''; }
      var DELAY_DOT = {};
      var DELAY2 = [
        ['Within 3 days', [1]], ['More than 3 days', [2, 3, 4, 5, 6, 7, 8]], ['More than 7 days', [3, 4, 5, 6, 7, 8]], ['More than 15 days', [4, 5, 6, 7, 8]],
        ['More than 1 month', [5, 6, 7, 8]], ['More than 2 months', [6, 7, 8]], ['More than 6 months', [7, 8]], ['More than 1 year', [8]]
      ];
      var KPI = {
        '': function () { return true; },
        nonpole: function (r) { return !r.pole; }, pole: function (r) { return r.pole; }, withheld: function (r) { return r.withheld; },
        ind: function (r) { return r.cls === 'I'; }, procb: function (r) { return r.procB; }, com3: function (r) { return r.cls === 'C' && r.phase === 'III'; }
      };
      // Facets shown as radio lists in the left panel: [value, label, test]
      var FACETS = {
        agri: [['excl', 'Exclude agriculture', function (r) { return r.cls !== 'A'; }], ['only', 'Agriculture only', function (r) { return r.cls === 'A'; }]],
        pole: [['pole', 'Pole cases', function (r) { return r.pole; }], ['nonpole', 'Non-pole cases', function (r) { return !r.pole; }]],
        wo: [['issued', 'WO issued', function (r) { return r.wo; }], ['none', 'WO not issued', function (r) { return !r.wo; }]],
        delay: []  // filled from the data (DelayRange in DelaySerial order)
      };
      var TABS = [
        ['region', 'Region'], ['division', 'Division'], ['ccc', 'CCC'], ['consumer', 'Consumer'], ['delay', 'Delay range-1'], ['delay2', 'Delay range-2'],
        ['pole', 'Pole'], ['class', 'Class'], ['phase', 'Phase'], ['agency', 'Agency'], ['wo', 'WO'], ['followups', 'Follow-ups']
      ];
      var all = [], f = { q: '', kpi: '', agri: '', pole: '', wo: '', delay: '', delay2: '' }, tab = 'region', renderedTab = '', scope = null, lastTable = null, lastList = null, firstData = true;
      var setActive = UI.sidePanel({ side: 'side', toggle: 'sideToggle', label: 'activeLabel', count: 'activeCount', clear: 'clearBtn', onClear: clearAll });
      var SELECTS = ['regionFilter', 'divisionFilter', 'cccFilter', 'classFilter', 'agencyFilter'];
      var FACET_NAMES = ['agri', 'pole', 'wo', 'delay', 'delay2'];
      FACETS.delay2 = DELAY2.map(function (d) { DELAY_DOT[d[0]] = delayDot(d[1][0]); return [d[0], d[0], function (r) { return d[1].indexOf(r.delaySerial) !== -1; }]; });

      function fillFilters() {
        UI.offices(all);
        UI.fill('agencyFilter', UI.uniq(all, 'agency').map(function (a) { return { value: a, label: UI.title(a) }; }), 'All agencies');
        UI.fill('classFilter', UI.uniq(all, 'cls').map(function (c) { return { value: c, label: CLASS[c] || c }; }), 'All classes');
        var ranges = {}; all.forEach(function (r) { if (r.delayRange) ranges[r.delayRange] = r.delaySerial; });
        FACETS.delay = [].concat(Object.keys(ranges).sort(function (a, b) { return ranges[a] - ranges[b]; }).map(function (k) { DELAY_DOT[k] = delayDot(ranges[k]); return [k, k, function (r) { return r.delayRange === k; }]; }));
        if (!scope) scope = UI.lockScope();
        SELECTS.forEach(function (id) { UI.mark($(id)); });
      }

      function facetTest(name) { var v = f[name]; if (!v) return null; var o = FACETS[name].filter(function (x) { return x[0] === v; })[0]; return o ? o[2] : null; }

      // All filters, optionally leaving one facet out (so that facet can count its own options).
      function filtered(skip) {
        var q = f.q.toLowerCase(), v = function (id) { return $(id).value; };
        var tests = FACET_NAMES.filter(function (n) { return n !== skip; }).map(facetTest).filter(Boolean);
        return all.filter(function (r) {
          if (v('regionFilter') && r._region !== v('regionFilter')) return false;
          if (v('divisionFilter') && r._divn !== v('divisionFilter')) return false;
          if (v('cccFilter') && r._supp !== v('cccFilter')) return false;
          if (v('agencyFilter') && r.agency !== v('agencyFilter')) return false;
          if (v('classFilter') && r.cls !== v('classFilter')) return false;
          for (var i = 0; i < tests.length; i++) if (!tests[i](r)) return false;
          if (q && r.appl.toLowerCase().indexOf(q) === -1 && r.con.indexOf(q) === -1 && r.name.toLowerCase().indexOf(q) === -1 && r.phone.indexOf(q) === -1) return false;
          return true;
        });
      }

      function renderFacets() {
        [['agri', 'fAgri'], ['pole', 'fPole'], ['wo', 'fWo'], ['delay', 'fDelay'], ['delay2', 'fDelay2']].forEach(function (x) {
          var name = x[0], rows = filtered(name);
          UI.facet(x[1], FACETS[name].map(function (o) { return { value: o[0], label: o[1], count: rows.filter(o[2]).length, dot: /^delay/.test(name) ? DELAY_DOT[o[0]] : '' }; }), f[name], function (v) { f[name] = v; render(); });
        });
        var active = (f.q ? 1 : 0) + FACET_NAMES.filter(function (n) { return f[n]; }).length +
          SELECTS.filter(function (id) { return $(id).value && !$(id).disabled; }).length;
        setActive(active, { fDelay: f.delay, fDelay2: f.delay2 });
      }

      // Visible follow-up notes per application: { APPL_NO: [notes, newest first] }
      function notes() {
        var store = FU.readStore(), hidden = FU.hiddenIds(), out = {};
        Object.keys(store).forEach(function (appl) {
          var list = (store[appl] || []).filter(function (e) { return e && String(e.note || '').trim() && !hidden.has(e.id); });
          if (list.length) out[String(appl).trim()] = list.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
        });
        return out;
      }

      var params = new URLSearchParams(location.search);
      var viewMode = params.get('view') === 'trend' ? 'trend'
        : (params.get('view') === 'detail' || params.get('tab') ? 'detail' : 'focus');
      var trendCtl = null;

      function setViewMode(mode) {
        var next = mode === 'trend' || mode === 'detail' ? mode : 'focus';
        var switched = next !== viewMode;
        viewMode = next;
        $('btnFocusView').setAttribute('aria-pressed', String(viewMode === 'focus'));
        $('btnDetailView').setAttribute('aria-pressed', String(viewMode === 'detail'));
        $('btnTrendView').setAttribute('aria-pressed', String(viewMode === 'trend'));
        $('focusView').hidden = viewMode !== 'focus';
        $('detailView').hidden = viewMode !== 'detail';
        $('trendView').hidden = viewMode !== 'trend';
        if (viewMode === 'trend' && window.NscTrend) {

          else if (switched && trendCtl.reload) trendCtl.reload();
        }
      }

      function renderFocusView(b) {
        var total = b.length;
        var med = function (rows) { var s = rows.map(function (r) { return r.delay || 0; }).sort(function (x, y) { return x - y; }); return s.length ? s[Math.floor(s.length / 2)] : 0; };

        var under30 = b.filter(function (r) { return r.delaySerial <= 4; });
        var over30 = b.filter(function (r) { return r.delaySerial >= 5; });
        var over60 = b.filter(function (r) { return r.delaySerial >= 6; });
        var over180 = b.filter(function (r) { return r.delaySerial >= 7; });
        var nonPole30 = over30.filter(function (r) { return !r.pole; });

        // 1. Hero KPIs
        $('fValTotal').textContent = UI.n(total);
        $('fSubTotal').textContent = total ? 'Median ' + UI.age(med(b)) : 'No cases';

        $('fValCritical').textContent = UI.n(over30.length);
        $('fSubCritical').textContent = total ? UI.pct(over30.length, total) + ' of total' : '0%';

        $('fValSevere').textContent = UI.n(over60.length);
        $('fSubSevere').textContent = total ? UI.pct(over60.length, total) + ' of total' : '0%';

        $('fValNonPole30').textContent = UI.n(nonPole30.length);
        $('fSubNonPole30').textContent = over30.length ? UI.pct(nonPole30.length, over30.length) + ' of >30d' : '0%';

        // 2. Aging Distribution Ladder
        var b31_60 = b.filter(function (r) { return r.delaySerial === 5; });
        var b61_180 = b.filter(function (r) { return r.delaySerial === 6; });
        var brackets = [
          { label: '0–30 days', count: under30.length, dot: 'ok', key: 'under30' },
          { label: '31–60 days', count: b31_60.length, dot: 'warn', key: 'b31_60' },
          { label: '61–180 days', count: b61_180.length, dot: 'bad', key: 'b61_180' },
          { label: '> 180 days', count: over180.length, dot: 'bad', key: 'over180' }
        ];

        $('agingLadder').innerHTML = brackets.map(function (bk) {
          return '<button type="button" class="nsc-ladder-step" data-age-bracket="' + bk.key + '" title="View ' + UI.esc(bk.label) + '">' +
            '<div class="nsc-ladder-h"><span class="ui-dot ' + bk.dot + '"></span>' + UI.esc(bk.label) + '</div>' +
            '<div class="nsc-ladder-v">' + UI.n(bk.count) + '</div>' +
            '<div class="nsc-ladder-s">' + (total ? UI.pct(bk.count, total) : '0%') + ' of total</div>' +
            '</button>';
        }).join('');

        // 3. Reasons for delay > 30 days
        var o30Count = over30.length;
        $('whyTotal30').textContent = UI.n(o30Count) + ' applications';

        var npCount = nonPole30.length;
        var poleNoWo = over30.filter(function (r) { return r.pole && !r.wo; }).length;
        var poleWithWo = over30.filter(function (r) { return r.pole && r.wo; }).length;
        var withheld30 = over30.filter(function (r) { return r.withheld; }).length;
        var highVal30 = over30.filter(function (r) { return r.cls === 'I' || (r.cls === 'C' && r.phase === 'III') || r.procB; }).length;

        var reasons = [
          { title: 'Non-pole cases', count: npCount, action: 'nonpole30', dot: 'bad' },
          { title: 'Pole: Work order not issued', count: poleNoWo, action: 'polenowo', dot: 'warn' },
          { title: 'Pole: WO issued to agency', count: poleWithWo, action: 'polewo', dot: 'warn' },
          { title: 'Withheld cases', count: withheld30, action: 'withheld30', dot: 'bad' },
          { title: 'Commercial & Industrial', count: highVal30, action: 'highval30', dot: 'c2' }
        ];

        $('why30List').innerHTML = reasons.map(function (item) {
          return '<div class="nsc-focus-row" data-reason-action="' + item.action + '" title="' + UI.esc(item.title) + '">' +
            '<div class="nsc-focus-row-t"><span class="ui-dot ' + item.dot + '"></span>' + UI.esc(item.title) + '</div>' +
            '<div class="nsc-focus-row-val">' +
            '<span class="nsc-focus-row-n">' + UI.n(item.count) + '</span>' +
            ' <span class="nsc-focus-row-p">(' + (o30Count ? UI.pct(item.count, o30Count) : '0%') + ')</span>' +
            '</div>' +
            '</div>';
        }).join('');

        // 4. Top delayed offices (> 30 days)
        var selCcc = $('cccFilter').value;
        var selDiv = $('divisionFilter').value;
        var offCounts = {};
        over30.forEach(function (r) {
          var key = selCcc ? (r.clsLabel || 'Unspecified') : (r._supp || 'Unmapped');
          var sub = selCcc ? (r.phase === 'III' ? '3-phase' : '1-phase') : (r._divn || '');
          if (!offCounts[key]) offCounts[key] = { name: key, sub: sub, count: 0 };
          offCounts[key].count++;
        });
        var sortedOffices = Object.keys(offCounts).map(function (k) { return offCounts[k]; }).sort(function (a, b) { return b.count - a.count; }).slice(0, 5);

        if (selCcc) {
          $('topOfficesTitle').textContent = 'Classes with > 30 days delay';
          $('topOfficesSub').textContent = selCcc;
        } else if (selDiv) {
          $('topOfficesTitle').textContent = 'Top CCCs with > 30 days delay';
          $('topOfficesSub').textContent = selDiv;
        } else {
          $('topOfficesTitle').textContent = 'Top delayed CCCs (> 30 days)';
          $('topOfficesSub').textContent = '';
        }

        if (!sortedOffices.length) {
          $('topOfficesList').innerHTML = '<div class="ui-empty" style="padding:16px 0">No applications pending > 30 days!</div>';
        } else {
          $('topOfficesList').innerHTML = sortedOffices.map(function (off) {
            return '<div class="nsc-focus-row" data-office-name="' + UI.esc(off.name) + '" title="' + UI.esc(off.name) + '">' +
              '<div class="nsc-focus-row-t"><span class="ui-strong">' + UI.esc(off.name) + '</span>' + (off.sub ? ' <small>' + UI.esc(off.sub) + '</small>' : '') + '</div>' +
              '<div class="nsc-focus-row-val">' +
              '<span class="nsc-focus-row-n">' + UI.n(off.count) + '</span>' +
              ' <span class="nsc-focus-row-p">(' + (o30Count ? UI.pct(off.count, o30Count) : '0%') + ')</span>' +
              '</div>' +
              '</div>';

      }

      function render() {
        var b = filtered(null);
        renderFacets();
        renderFocusView(b);
        setViewMode(viewMode);
        var med = function (rows) { var s = rows.map(function (r) { return r.delay || 0; }).sort(function (x, y) { return x - y; }); return s.length ? s[Math.floor(s.length / 2)] : 0; };
        [].forEach.call(document.querySelectorAll('#kpis .ui-stat'), function (el) {
          var k = el.getAttribute('data-k'), rows = b.filter(KPI[k]);
          el.querySelector('.v').textContent = UI.n(rows.length);
          el.querySelector('.s').textContent = k === '' ? 'Median ' + UI.age(med(b))
            : k === 'pole' ? UI.n(rows.reduce(function (a, r) { return a + r.poles; }, 0)) + ' poles'
              : UI.pct(rows.length, b.length) + ' of total';
          el.setAttribute('aria-pressed', String(f.kpi === k));
        });

        var view = b.filter(KPI[f.kpi]), n = notes();
        var inView = new Set(view.map(function (r) { return r.appl; }));
        tab = UI.snapOfficeTab(tab);
        var visibleTabs = UI.filterOfficeTabs(TABS);
        $('tabs').innerHTML = visibleTabs.map(function (t) {
          var extra = t[0] === 'consumer' ? '<small>' + UI.n(view.length) + '</small>' : t[0] === 'followups' ? '<small>' + Object.keys(n).filter(function (a) { return inView.has(a); }).length + '</small>' : '';
          return '<button type="button" class="ui-drill-tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + extra + '</button>';
        }).join('');
        UI.scopeTrail('scopeTrail');
        var kpiName = f.kpi ? document.querySelector('#kpis [data-k="' + f.kpi + '"] .k').getAttribute('title') || document.querySelector('#kpis [data-k="' + f.kpi + '"] .k').textContent : '';
        $('hint').textContent = (kpiName ? 'Showing ' + kpiName.toLowerCase() + ' only. ' : '') + (tab === 'delay2' ? 'Cumulative: an application can sit in more than one row.' : '');
        renderReportHead(view);
        renderTab(view, n);
      }

      var currentActiveFilters = [];
      function renderReportHead(view) {
        var tabObj = TABS.filter(function (t) { return t[0] === tab; })[0];
        var tabLabel = tabObj ? tabObj[1] : 'Detailed Analysis';
        var kpiBtn = f.kpi ? document.querySelector('#kpis [data-k="' + f.kpi + '"]') : null;
        var kpiTitle = kpiBtn ? (kpiBtn.getAttribute('title') || kpiBtn.querySelector('.k').textContent) : '';

        $('rhTitle').textContent = tabLabel + (kpiTitle ? ' · ' + kpiTitle : '');

        if (view.length === all.length) {
          $('rhCount').innerHTML = 'Showing all <b>' + UI.n(all.length) + '</b> applications';
        } else {
          $('rhCount').innerHTML = 'Showing <b>' + UI.n(view.length) + '</b> of ' + UI.n(all.length) + ' applications <span style="opacity:0.75;font-weight:400">(' + UI.pct(view.length, all.length) + ')</span>';
        }

        currentActiveFilters = [];
        if (f.q) {
          currentActiveFilters.push({ label: 'Search', value: '"' + f.q + '"', clear: function () { f.q = ''; $('q').value = ''; } });
        }
        if ($('regionFilter').value && !$('regionFilter').disabled) {
          currentActiveFilters.push({ label: 'Region', value: $('regionFilter').value, clear: function () { $('regionFilter').value = ''; $('divisionFilter').value = ''; $('cccFilter').value = ''; fillFilters(); } });
        }
        if ($('divisionFilter').value && !$('divisionFilter').disabled) {
          currentActiveFilters.push({ label: 'Division', value: $('divisionFilter').value, clear: function () { $('divisionFilter').value = ''; $('cccFilter').value = ''; fillFilters(); } });
        }
        if ($('cccFilter').value && !$('cccFilter').disabled) {
          currentActiveFilters.push({ label: 'CCC', value: $('cccFilter').value, clear: function () { $('cccFilter').value = ''; fillFilters(); } });
        }
        if ($('classFilter').value && !$('classFilter').disabled) {
          var clsVal = $('classFilter').value;
          currentActiveFilters.push({ label: 'Class', value: CLASS[clsVal] || clsVal, clear: function () { $('classFilter').value = ''; UI.mark($('classFilter')); } });
        }
        if ($('agencyFilter').value && !$('agencyFilter').disabled) {
          currentActiveFilters.push({ label: 'Agency', value: UI.title($('agencyFilter').value), clear: function () { $('agencyFilter').value = ''; UI.mark($('agencyFilter')); } });
        }
        if (f.agri) {
          var ag = FACETS.agri.filter(function (x) { return x[0] === f.agri; })[0];
          currentActiveFilters.push({ label: 'Agriculture', value: ag ? ag[1] : f.agri, clear: function () { f.agri = ''; } });
        }
        if (f.pole) {
          var pl = FACETS.pole.filter(function (x) { return x[0] === f.pole; })[0];
          currentActiveFilters.push({ label: 'Poles', value: pl ? pl[1] : f.pole, clear: function () { f.pole = ''; } });
        }
        if (f.wo) {
          var wo = FACETS.wo.filter(function (x) { return x[0] === f.wo; })[0];
          currentActiveFilters.push({ label: 'Work Order', value: wo ? wo[1] : f.wo, clear: function () { f.wo = ''; } });
        }
        if (f.delay) {
          currentActiveFilters.push({ label: 'Delay range', value: f.delay, clear: function () { f.delay = ''; } });
        }
        if (f.delay2) {
          currentActiveFilters.push({ label: 'Cumulative delay', value: f.delay2, clear: function () { f.delay2 = ''; } });
        }
        if (f.kpi) {
          currentActiveFilters.push({ label: 'Focus KPI', value: kpiTitle, clear: function () { f.kpi = ''; } });
        }

        var bar = $('rhFiltersBar');
        var focusBar = $('focusFiltersBar');
        if (currentActiveFilters.length) {
          var chips = currentActiveFilters.map(function (af, i) {
            return '<span class="rh-chip"><strong>' + UI.esc(af.label) + ':</strong> ' + UI.esc(af.value) +
              '<button type="button" class="rh-chip-x" data-rh-clear="' + i + '" title="Remove ' + UI.esc(af.label) + ' filter" aria-label="Remove filter">&times;</button></span>';
          }).join('');
          var content = '<div class="rh-filters"><span class="rh-filters-label"><svg class="ui-i sm"><use href="#ui-filter"/></svg>Applied:</span>' +
            chips + '<button type="button" class="rh-clear-btn" id="rhClearBtn"><svg class="ui-i sm"><use href="#ui-refresh"/></svg>Reset all</button></div>';
          bar.innerHTML = content;
          if (focusBar) {
            focusBar.innerHTML = content;
            focusBar.hidden = false;
          }
        } else {
          bar.innerHTML = '';
          if (focusBar) {
            focusBar.innerHTML = '';
            focusBar.hidden = true;
          }
        }
      }

      function groupTable(view, keyFn, label, order, dots) {
        var groups = {}, total = view.length;
        view.forEach(function (r) { var k = keyFn(r); if (k == null) return; (Array.isArray(k) ? k : [k]).forEach(function (kk) { var g = groups[kk] || (groups[kk] = { name: kk, n: 0, poles: 0 }); g.n++; g.poles += r.poles; }); });
        var list = Object.keys(groups).map(function (k) { return groups[k]; });
        if (order) list.sort(function (a, b) { return order.indexOf(a.name) - order.indexOf(b.name); });
        var max = Math.max.apply(null, list.map(function (g) { return g.n; }).concat([0]));
        lastTable = { title: label, cols: [label, 'Count', 'Pole count', '%'], rows: list.map(function (g) { return [g.name, g.n, g.poles, UI.pct(g.n, total)]; }) };
        return {
          rows: list, sort: order ? null : { key: 'n', dir: 'desc' }, count: false, empty: 'Nothing pending for these filters.',
          columns: [
            { key: 'name', label: label, fmt: function (v) { return (dots && dots[v] ? '<span class="ui-dot ' + dots[v] + '" style="margin-right:8px"></span>' : '') + '<span class="ui-strong">' + UI.esc(v) + '</span>'; } },
            { key: 'n', label: 'Count', num: true, fmt: UI.n },
            { key: 'poles', label: 'Pole count', num: true, fmt: UI.n },
            { key: 'pct', label: '%', sortVal: function (g) { return g.n; }, fmt: function (_, g) { return UI.bar(g.n, max, UI.pct(g.n, total)); }, width: '30%' }
          ],
          foot: list.length > 1 && !order ? { n: total, poles: view.reduce(function (a, r) { return a + r.poles; }, 0), pct: 0 } : null
        };
      }

      function renderTab(view, n) {
        var cfg;
        lastList = null;
        if (tab === 'region') { cfg = groupTable(view, function (r) { return r._region || 'Unmapped'; }, 'Region'); cfg.onRow = function (g) { $('regionFilter').value = g.name; fillFilters(); tab = 'division'; render(); }; }
        else if (tab === 'division') { cfg = groupTable(view, function (r) { return r._divn || 'Unmapped'; }, 'Division'); cfg.onRow = function (g) { $('divisionFilter').value = g.name; fillFilters(); tab = 'ccc'; render(); }; }
        else if (tab === 'ccc') { cfg = groupTable(view, function (r) { return r._supp || 'Unmapped'; }, 'CCC'); cfg.onRow = function (g) { $('cccFilter').value = g.name; fillFilters(); tab = 'consumer'; render(); }; }
        else if (tab === 'delay') { var ord = {}; view.forEach(function (r) { if (r.delayRange) ord[r.delayRange] = r.delaySerial; }); cfg = groupTable(view, function (r) { return r.delayRange || null; }, 'Delay range', Object.keys(ord).sort(function (a, b) { return ord[a] - ord[b]; }), DELAY_DOT); }
        else if (tab === 'delay2') { cfg = groupTable(view, function (r) { return DELAY2.filter(function (d) { return d[1].indexOf(r.delaySerial) !== -1; }).map(function (d) { return d[0]; }); }, 'Delay (cumulative)', DELAY2.map(function (d) { return d[0]; }), DELAY_DOT); }
        else if (tab === 'pole') cfg = groupTable(view, function (r) { return r.pole ? 'Pole case' : 'Non-pole case'; }, 'Pole');
        else if (tab === 'class') cfg = groupTable(view, function (r) { return r.clsLabel; }, 'Class');
        else if (tab === 'phase') cfg = groupTable(view, function (r) { return r.phase === 'III' ? 'Three phase' : 'Single phase'; }, 'Phase');
        else if (tab === 'agency') cfg = groupTable(view, function (r) { return r.agency ? UI.title(r.agency) : 'WO not issued'; }, 'Agency');
        else if (tab === 'wo') cfg = groupTable(view, function (r) { return r.wo ? 'WO issued' : 'WO not issued'; }, 'Work order');
        else if (tab === 'consumer' || tab === 'followups') {
          var rows = tab === 'followups' ? view.filter(function (r) { return n[r.appl]; }) : view;
          rows = rows.map(function (r) { r._notes = (n[r.appl] || []).length; return r; });
          lastList = rows;
          lastTable = { title: tab === 'followups' ? 'Follow-ups' : 'Consumers', cols: ['Appl. no.', 'Class', 'Name', 'CCC', 'Delay (days)'], rows: rows.slice().sort(function (x, y) { return (y.delay || 0) - (x.delay || 0); }).map(function (r) { return [r.appl, r.cls, r.name, r._supp, r.delay || 0]; }) };
          cfg = {
            rows: rows, sort: { key: 'delay', dir: 'desc' }, limit: 50,
            empty: tab === 'followups' ? 'No follow-up notes for these applications. Open an application to add one.' : 'No applications for these filters.',
            columns: [
              { key: 'appl', label: 'Appl. no.', fmt: function (v, r) { return '<span class="ui-strong">' + UI.esc(v) + '</span>' + (r._notes ? ' <span class="ui-badge">' + r._notes + ' note' + (r._notes > 1 ? 's' : '') + '</span>' : ''); } },
              { key: 'cls', label: 'Class', fmt: function (v, r) { return UI.esc(r.clsLabel); } },
              { key: 'name', label: 'Name', cls: 'wrap', hideSm: true },
              { key: '_supp', label: 'CCC', fmt: function (v, r) { return UI.esc(v) + '<span class="sub">' + UI.esc(r._divn) + '</span>'; } },
              { key: 'delay', label: 'Delay', num: true, fmt: function (v) { var d = v || 0; return '<span class="' + (d > 90 ? 'ui-delta bad' : '') + '">' + UI.n(d) + ' d</span>'; } },
              { key: 'agency', label: 'Agency', hideSm: true, cls: 'wrap', fmt: function (v) { return v ? UI.esc(UI.title(v)) : '<span class="ui-muted">WO not issued</span>'; } }
            ],
            onRow: detail
          };
        }
        if (renderedTab !== tab) { $('table').__ui = null; renderedTab = tab; } // new columns: fresh sort and paging
        UI.table('table', cfg);
      }

      /* ---------------- detail drawer ---------------- */
      var openRow = null;
      function detail(r) {
        openRow = r;
        var d = UI.drawer(r.name || 'Application ' + r.appl, [r._supp, r._divn].filter(Boolean).join(' · '), [
          ['Application', r.appl], ['Consumer ID', r.con], ['Phone', r.phone], ['Address', r.address],
          ['Delay', UI.n(r.delay || 0) + ' days (' + (r.delayRange || '—') + ')'], ['Paid on', r.paid ? UI.fmtDate(r.paid) : ''],

          if (currentActiveFilters[idx] && currentActiveFilters[idx].clear) {
            currentActiveFilters[idx].clear();
            render();
          }
          return;
        }
        if (e.target.closest('#rhClearBtn')) {
          clearAll();
        }
      });

      function clearAll() {
        f = { q: '', kpi: '', agri: '', pole: '', wo: '', delay: '', delay2: '' }; $('q').value = '';
        SELECTS.forEach(function (id) { if (!$(id).disabled) $(id).value = ''; });
        tab = scope && (scope.level === 'division' || scope.level === 'ccc' || scope.level === 'codes') ? 'ccc' : 'region';
        fillFilters(); render();
      }

      $('copyBtn').addEventListener('click', function () {
        if (!lastTable) return;
        var lines = ['*Pending NSC — ' + lastTable.title + '*' + ($('asOn').textContent ? ' (as on ' + $('asOn').textContent + ')' : ''), lastTable.cols.join(' | ')].concat(lastTable.rows.slice(0, 60).map(function (r) { return r.map(function (c) { return typeof c === 'number' ? UI.n(c) : c; }).join(' | '); }));
        UI.copy(lines.join('\n')).then(function () { UI.toast('Table copied'); });
      });
      // Consumer and Follow-ups export every application in view with its details; group tabs export the table.
      var FULL = [
        { key: 'appl', label: 'Application' }, { key: 'con', label: 'Consumer ID' }, { key: 'name', label: 'Name' }, { key: 'phone', label: 'Phone' },
        { key: '_region', label: 'Region' }, { key: '_divn', label: 'Division' }, { key: '_supp', label: 'CCC' }, { key: 'clsLabel', label: 'Class' },
        { key: 'phase', label: 'Phase' }, { key: 'load', label: 'Load (W)' }, { key: 'poles', label: 'Poles' }, { key: 'paid', label: 'Paid', csv: function (r) { return r.paid ? UI.fmtDate(r.paid) : ''; } },
        { key: 'agency', label: 'Agency' }, { key: 'won', label: 'Work order' }, { key: 'delayRange', label: 'Delay range' },
        { key: 'delay', label: 'Delay (days)', csv: function (r) { return r.delay == null ? '' : Math.round(r.delay); } }, { key: 'reason', label: 'Withheld reason' }, { key: '_notes', label: 'Follow-ups' }
      ];
      $('exportBtn').addEventListener('click', function () {
        if (lastList) { UI.exportCsv('pending-nsc' + (tab === 'followups' ? '-followups' : '') + '.csv', FULL, lastList.slice().sort(function (x, y) { return (y.delay || 0) - (x.delay || 0); })); return; }
        if (!lastTable) return;
        UI.exportCsv('pending-nsc-' + lastTable.title.toLowerCase().replace(/\W+/g, '-') + '.csv', lastTable.cols.map(function (c, i) { return { key: i, label: c }; }), lastTable.rows.map(function (r) { var o = {}; r.forEach(function (c, i) { o[i] = c; }); return o; }));
      });
      document.addEventListener('click', function (e) { if (e.target.closest('[data-copy-detail]') && openRow) copyDetail(openRow); });
      MzoRows.refresh('refreshBtn', ROWS, function (t) { setData(t); checkUpdate(); }, { scope: false });
      $('noticeLoad').addEventListener('click', loadLatest);
      $('noticeDismiss').addEventListener('click', function () {
        fetchMeta().then(function (d) { if (d && d.version) markSeen(d.version); });
        $('notice').hidden = true;
      });

      /* ---------------- start ---------------- */
      MzoRows.load(ROWS, function (t, info) {
        if (!t) { if (info && info.error && !all.length) { $('asOn').textContent = 'No data'; $('table').innerHTML = '<div class="ui-empty">Could not load the NSC data.</div>'; } return; }
        setData(t);
      }, { scope: false });
      if (LS.get(PENDING_KEY) === '1') loadLatest(); // an upload just finished on this device: start from the fresh dump
      setTimeout(checkUpdate, 2500);
      setInterval(function () { if (document.visibilityState !== 'hidden') checkUpdate(); }, 90 * 1000);
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });
      window.addEventListener('focus', checkUpdate);
      try {
        var ch = new BroadcastChannel('mzo-nsc');
        ch.onmessage = function (ev) {
          if (ev && ev.data && ev.data.type === 'nsc-uploaded') {
            if (ev.data.version && (LS.get(SEEN_KEY) || '') === String(ev.data.version)) return;
            showNotice(ev.data.reportDate);
          }
        };
      } catch (e) { }
    });
  </script>
</body>

</html>
