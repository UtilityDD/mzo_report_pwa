<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheet</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="view" title="Sheet"></iframe>
  <script>
    var q = new URLSearchParams(location.search);
    var id = q.get('id') || '';
    var pub = q.get('e') || '';
    var gid = q.get('gid') || '';
    var view = pub
      ? 'https://docs.google.com/spreadsheets/d/e/' + encodeURIComponent(pub) + '/pubhtml' + (gid ? '?gid=' + encodeURIComponent(gid) : '')
      : (id ? 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) + '/preview' + (gid ? '?gid=' + encodeURIComponent(gid) + '&rm=minimal' : '?rm=minimal') : '');
    var edit = id
      ? 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) + '/edit' + (gid ? '#gid=' + gid : '')
      : '';
    if (!view) {
      document.body.textContent = 'This sheet link is not available.';
    } else {
      document.getElementById('view').src = view;
    }
    if (edit) {
      window.google = window.google || {};
      google.visualization = google.visualization || {};
      google.visualization.Query = {
        setResponse: function (resp) {
          if (resp && resp.status === 'ok') location.replace(edit);
        }
      };
      var probe = document.createElement('script');
      probe.src = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) + '/gviz/tq?tqx=out:json&tq=' + encodeURIComponent('limit 0');
      probe.async = true;
      document.head.appendChild(probe);
    }
  </script>
</body>
</html>
