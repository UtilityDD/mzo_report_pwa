<!DOCTYPE html>
<html lang="en" data-mzo-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MZO Reports</title>
  <meta name="theme-color" content="#f1f1f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MZO Reports" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192-v2.png" />
  <script>
    /* Paint the right theme before first render (no flash). */
    (function () {
      var d = document.documentElement, pref = 'system', t;
      try {
        pref = localStorage.getItem('mzo_theme_pref') || '';
        if (!pref) { t = localStorage.getItem('theme') || localStorage.getItem('mzo_theme'); pref = (t === 'light' || t === 'dark') ? t : 'system'; }
      } catch (e) {}
      t = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
      d.setAttribute('data-mzo-theme', t);
      d.setAttribute('data-theme-pref', pref);
      try { if (localStorage.getItem('mzo_ws_rail') === '1') d.classList.add('rail'); } catch (e) {}
      window.__MZO_SHELL__ = true;
    })();
  </script>
  <style>
    /* ---------- Tokens (keep in sync with mzo_theme.css) ---------- */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --sb-w: 252px;
      --rail-w: 56px;
      --bar-h: 44px;
      --r: 8px;
      --r-sm: 6px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    [data-mzo-theme="light"] {
      color-scheme: light;
      --canvas: #f1f1f0; --bg: #fafafa; --surface: #fff; --surface-2: #f5f5f4; --hover: #e9e9e7; --hover-soft: #efefee;
      --border: #e7e7e5; --border-strong: #d6d6d3;
      --text: #18181b; --text-2: #3f3f46; --muted: #71717a; --faint: #a1a1aa;
      --ink: #18181b; --on-ink: #fff;
      --accent: #0f766e; --accent-soft: rgba(15, 118, 110, .09); --ring: 0 0 0 3px rgba(15, 118, 110, .18);
      --shadow-pop: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -8px rgba(0,0,0,.16);
      --shadow-panel: 0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,.03);
      --scrim: rgba(24, 24, 27, .32);
    }
    [data-mzo-theme="dark"] {
      color-scheme: dark;
      --canvas: #09090a; --bg: #0f0f10; --surface: #161617; --surface-2: #1c1c1e; --hover: #232325; --hover-soft: #1d1d1f;
      --border: #27272a; --border-strong: #34343a;
      --text: #ececee; --text-2: #c8c8cd; --muted: #8e8e96; --faint: #5f5f66;
      --ink: #ececee; --on-ink: #0f0f10;
      --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, .12); --ring: 0 0 0 3px rgba(45, 212, 191, .22);
      --shadow-pop: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px -8px rgba(0,0,0,.65);
      --shadow-panel: 0 0 0 1px var(--border);
      --scrim: rgba(0, 0, 0, .55);
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.45 var(--font);
      color: var(--text);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
    .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .ic-sm { width: 14px; height: 14px; }
    kbd {
      font: 500 11px/1 var(--mono);
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 2px 5px;
      min-width: 18px;
      text-align: center;
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Layout ---------- */
    .app { display: grid; grid-template-columns: var(--sb-w) minmax(0, 1fr); height: 100dvh; transition: grid-template-columns .2s var(--ease); }
    .rail .app { grid-template-columns: var(--rail-w) minmax(0, 1fr); }

    /* ---------- Sidebar ---------- */
    .sb { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 10px 8px 8px; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px; min-width: 0; }
    .mark {
      width: 26px; height: 26px; border-radius: 7px; flex: none;
      display: grid; place-items: center;
      background: var(--ink); color: var(--on-ink);
    }
    .mark .ic { width: 15px; height: 15px; stroke-width: 2.1; }
    .brand-t { min-width: 0; line-height: 1.2; }
    .brand-t b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
    .brand-t span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .search {
      display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 6px 0 9px;
      border-radius: var(--r-sm);
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--border);
      color: var(--muted);
      text-align: left;
      transition: box-shadow .12s, color .12s;
    }
    .search:hover { color: var(--text-2); box-shadow: 0 0 0 1px var(--border-strong); }
    .search span { flex: 1; white-space: nowrap; overflow: hidden; }
    .search kbd { background: var(--surface-2); }

    .nav { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: 0 -8px; padding: 2px 8px 8px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    .nav::-webkit-scrollbar { width: 8px; }
    .nav::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--canvas); }
    .sec { font-size: 11px; font-weight: 500; color: var(--faint); padding: 14px 8px 4px; white-space: nowrap; }
    .ni, .ng {
      display: flex; align-items: center; gap: 9px; width: 100%;
      height: 30px; padding: 0 8px;
      border-radius: var(--r-sm);
      color: var(--text-2);
      white-space: nowrap; text-align: left;
      transition: background-color .1s, color .1s;
      position: relative;
    }
    .ni:hover, .ng:hover { background: var(--hover); color: var(--text); }
    .ni .ic, .ng .ic { color: var(--muted); }
    .ni:hover .ic, .ng:hover .ic { color: var(--text-2); }
    .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .chev { color: var(--faint); transition: transform .15s var(--ease); }
    .grp.open > .ng .chev { transform: rotate(90deg); }
    .grp.has-active > .ng { color: var(--text); }
    .grp.has-active > .ng .ic:first-child { color: var(--text); }
    .ni[aria-current="page"] {
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,.04);
    }
    .ni[aria-current="page"] .ic { color: var(--text); }
    .sub { display: none; position: relative; padding: 2px 0 4px; }
    .grp.open > .sub { display: block; }
    .sub::before { content: ""; position: absolute; left: 15px; top: 2px; bottom: 6px; width: 1px; background: var(--border); }
    .sub .ni { height: 28px; padding-left: 26px; font-size: 12.75px; }
    .sub .ni[aria-current="page"]::before { content: ""; position: absolute; left: 14px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }

    .foot { border-top: 1px solid var(--border); margin: 0 -8px; padding: 8px 8px 0; }
    .me {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 6px; border-radius: var(--r-sm);
      text-align: left;
    }
    .me:hover, .me[aria-expanded="true"] { background: var(--hover); }
    .av {
      width: 28px; height: 28px; border-radius: 50%; flex: none;
      display: grid; place-items: center;
      background: var(--surface); box-shadow: 0 0 0 1px var(--border-strong);
      font-size: 11.5px; font-weight: 600; color: var(--text-2);
    }
    .me-t { flex: 1; min-width: 0; line-height: 1.25; }
    .me-t b { display: block; font-weight: 500; font-size: 12.75px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me-t span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me .ic { color: var(--faint); }

    @media (min-width: 901px) {
    /* Rail (collapsed) */
      .rail .sb .brand-t, .rail .sb .search span, .rail .sb .search kbd, .rail .sb .sec, .rail .sb .lbl, .rail .sb .chev, .rail .sb .me-t, .rail .sb .me > .ic, .rail .sb .sub { display: none !important; }
      .rail .sb .brand { padding: 0; justify-content: center; }
      .rail .sb .search { justify-content: center; padding: 0; background: none; box-shadow: none; }
      .rail .sb .search:hover { background: var(--hover); }
      .rail .sb .ni, .rail .sb .ng { justify-content: center; padding: 0; }
      .rail .sb .sec-gap { height: 10px; }
      .rail .sb .grp.has-active > .ng { background: var(--surface); box-shadow: 0 0 0 1px var(--border); }
      .rail .sb .me { justify-content: center; padding: 6px 0; }
      .sec-gap { display: none; }
      .rail .sb .sec-gap { display: block; }
    }

    /* Rail flyout */
    .fly {
      position: fixed; z-index: 60; min-width: 220px; max-width: 280px;
      max-height: calc(100dvh - 16px); overflow: auto;
      background: var(--surface); border-radius: 10px;
      box-shadow: 0 0 0 1px var(--border), var(--shadow-pop);
      padding: 6px;
    }
    .fly[hidden] { display: none; }
    .fly h4 { margin: 0; padding: 6px 8px 6px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
    .fly .ni { height: 30px; }

    /* ---------- Main panel ---------- */
    .main { min-width: 0; min-height: 0; padding: 8px 8px 8px 0; display: flex; }
    .panel {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      background: var(--bg);
      border-radius: 10px;
      box-shadow: var(--shadow-panel);
      overflow: hidden;
    }
    .bar {
      height: var(--bar-h); flex: none;
      display: flex; align-items: center; gap: 6px;
      padding: 0 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; padding-left: 4px; }
    .crumbs .c-g { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
    .crumbs .c-s { color: var(--faint); }
    .crumbs .c-p { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
    .crumbs .c-g:empty, .crumbs .c-g:empty + .c-s { display: none; }
    .vr { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex: none; }
    .ib {
      width: 32px; height: 32px; flex: none;
      display: grid; place-items: center;
      border-radius: var(--r-sm);
      color: var(--muted);
      position: relative;
      transition: background-color .1s, color .1s;
    }
    .ib:hover { background: var(--hover-soft); color: var(--text); }
    .ib:active { background: var(--hover); }
    .ib.spin .ic { animation: spin .6s var(--ease); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tooltips */
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute; top: calc(100% + 6px); left: 50%;
      transform: translateX(-50%) translateY(-2px);
      background: var(--ink); color: var(--on-ink);
      font: 500 11.5px/1 var(--font); white-space: nowrap;
      padding: 6px 8px; border-radius: 5px;
      opacity: 0; pointer-events: none; z-index: 70;
      transition: opacity .12s, transform .12s;
    }
    [data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); transition-delay: .35s; }
    [data-tip-end]::after { left: auto; right: 0; transform: translateY(-2px); }
    [data-tip-end]:hover::after { transform: translateY(0); }
    .tip {
      position: fixed; z-index: 80; pointer-events: none;
      background: var(--ink); color: var(--on-ink);
      font: 500 11.5px/1 var(--font); white-space: nowrap;
      padding: 6px 8px; border-radius: 5px;
    }
    .tip[hidden] { display: none; }

    /* ---------- Stage ---------- */
    .stage { position: relative; flex: 1; min-height: 0; background: var(--bg); }
    .stage iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; display: block; background: transparent;
    }
    .stage iframe.off { visibility: hidden; pointer-events: none; }
    .stage-msg {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--muted); font-size: 12.5px;
      opacity: 0; transition: opacity .2s .25s;
    }
    .stage.busy .stage-msg { opacity: 1; }
    .prog { position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 5; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .2s; }
    .stage.busy .prog { opacity: 1; }
    .prog::before {
      content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
      background: var(--accent); border-radius: 2px;
      animation: prog 1.1s var(--ease) infinite;
    }
    @keyframes prog { from { left: -40%; } to { left: 100%; } }

    /* ---------- Menus ---------- */
    .menu {
      position: fixed; z-index: 60; width: 248px;
      background: var(--surface); border-radius: 10px;
      box-shadow: 0 0 0 1px var(--border), var(--shadow-pop);
      padding: 6px;
    }
    .menu[hidden] { display: none; }
    .menu-h { padding: 8px 8px 10px; border-bottom: 1px solid var(--border); margin: -6px -6px 6px; padding-top: 12px; padding-left: 14px; }
    .menu-h b { display: block; font-weight: 600; font-size: 13px; }
    .menu-h span { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .mi { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 8px; border-radius: var(--r-sm); color: var(--text-2); text-align: left; }
    .mi:hover { background: var(--hover-soft); color: var(--text); }
    .mi .ic { color: var(--muted); }
    .mi.danger:hover { color: #dc2626; }
    .mi.danger:hover .ic { color: #dc2626; }
    .mi-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 4px 8px; height: 38px; color: var(--text-2); }
    .seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
    .seg button { width: 28px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border-strong), 0 1px 1px rgba(0,0,0,.05); }
    .menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px -6px; }

    /* ---------- Command palette ---------- */
    dialog.pal {
      width: min(600px, calc(100vw - 24px));
      margin: 12vh auto auto; padding: 0;
      border: 0; border-radius: 12px;
      background: var(--surface); color: var(--text);
      box-shadow: 0 0 0 1px var(--border), var(--shadow-pop);
      overflow: hidden;
    }
    dialog.pal::backdrop { background: var(--scrim); }
    dialog.pal[open] { animation: pop .14s var(--ease); }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } }
    .pal-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; border-bottom: 1px solid var(--border); color: var(--muted); }
    .pal-in input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--text); font: 15px var(--font); }
    .pal-in input::placeholder { color: var(--faint); }
    .pal-list { max-height: min(400px, 52vh); overflow-y: auto; padding: 6px; scrollbar-width: thin; }
    .pal-sec { font-size: 11.5px; color: var(--muted); padding: 8px 10px 4px; }
    .pal-it { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; color: var(--text-2); cursor: pointer; }
    .pal-it .ic { color: var(--muted); }
    .pal-it .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pal-it .t mark { background: none; color: var(--text); font-weight: 600; }
    .pal-it .g { color: var(--faint); font-size: 12px; white-space: nowrap; }
    .pal-it[aria-selected="true"] { background: var(--hover-soft); color: var(--text); }
    .pal-it[aria-selected="true"] .ic { color: var(--text); }
    .pal-empty { padding: 28px 10px; text-align: center; color: var(--muted); }
    .pal-ft { display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11.5px; background: var(--surface-2); }
    .pal-ft span { display: inline-flex; align-items: center; gap: 5px; }

    /* ---------- Mobile ---------- */
    .scrim { display: none; }
    @media (max-width: 900px) {
      .app, .rail .app { grid-template-columns: minmax(0, 1fr); }
      .sb {
        position: fixed; z-index: 50; inset: 0 auto 0 0; width: min(296px, 86vw);
        background: var(--canvas);
        box-shadow: var(--shadow-pop);
        transform: translateX(-102%);
        transition: transform .22s var(--ease);
      }
      .drawer .sb { transform: none; }
      .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
      .drawer .scrim { opacity: 1; pointer-events: auto; }
      .main { padding: 0; }
      .panel { border-radius: 0; box-shadow: none; }
      .hide-sm { display: none !important; }
      .search kbd { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>

        ['admin_corrections', 'Corrections', 'admin_users.html?tab=corrections', ''],
        ['admin_structure', 'Structure', 'admin.html', 'estimate']
      ]}
    ];
    var HOME = { k: 'home', n: 'Briefing', u: 'executive_briefing.html', g: '', icon: 'home', kw: 'overview summary critical' };
    var ASK = { k: 'ask', n: 'Ask', u: 'assistant.html', g: '', icon: 'chat', kw: 'assistant ai question chat help' };

    var LS = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
    };
    var $ = function (id) { return document.getElementById(id); };
    var root = document.documentElement;
    var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    if (!isMac) { $('kbdHint').textContent = 'Ctrl K'; $('ftMod').textContent = 'Ctrl'; $('openPal').setAttribute('data-rtip', 'Search  Ctrl K'); $('railBtn').setAttribute('data-tip', 'Toggle sidebar  Ctrl B'); }

    /* ================= Session ================= */
    var profile = null;
    try { profile = JSON.parse(LS.get('mzo_user_profile') || 'null'); } catch (e) {}
    if (!profile && LS.get('mzo_authenticated') !== 'true') { location.replace('/login.html'); return; }

    function isAdmin(p) { return !!p && String(p.role || '').toLowerCase() === 'admin'; }
    function canSheets(p) {
      if (isAdmin(p)) return true;
      var f = String((p && (p['sheets-autho'] != null ? p['sheets-autho'] : p.sheets_autho)) || '').trim().toLowerCase();
      return f === 'list' || f === 'edit' || f === 'y' || f === 'all';
    }

    /* ================= Index ================= */
    var MODS = {}, BY_URL = {}, ALL = [];
    function norm(u) { return String(u || '').replace(/^\/+/, '').replace(/#.*$/, ''); }
    function index() {
      MODS = {}; BY_URL = {}; ALL = [];
      var add = function (m) { MODS[m.k] = m; if (!BY_URL[norm(m.u)]) BY_URL[norm(m.u)] = m.k; ALL.push(m); };
      add(HOME);
      add(ASK);
      NAV.forEach(function (g) {
        g.visible = !g.admin || isAdmin(profile);
        g.mods = [];
        g.items.forEach(function (it) {
          if (it[4] === 'sheets' && !canSheets(profile)) return;
          if (!g.visible) return;
          var m = { k: it[0], n: it[1], u: it[2], kw: it[3] || '', g: g.label, gid: g.id, icon: g.icon };
          add(m);
          g.mods.push(m);
        });
      });
    }

    /* ================= Sidebar ================= */
    function icon(name, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '"><use href="#i-' + name + '"/></svg>'; }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    var openGroups = {};
    try { openGroups = JSON.parse(LS.get('mzo_ws_groups') || '{}') || {}; } catch (e) {}

    function renderNav() {
      var h = '<a class="ni" href="#home" data-k="home" data-rtip="' + HOME.n + '">' + icon('home') + '<span class="lbl">' + HOME.n + '</span></a>' +
        '<a class="ni" href="#ask" data-k="ask" data-rtip="' + ASK.n + '">' + icon('chat') + '<span class="lbl">' + ASK.n + '</span></a>';
      h += '<div class="sec">Reports</div><div class="sec-gap"></div>';
      NAV.forEach(function (g) {
        if (!g.visible || !g.mods.length) return;
        if (g.admin) h += '<div class="sec">Admin</div><div class="sec-gap"></div>';
        h += '<div class="grp' + (openGroups[g.id] ? ' open' : '') + '" data-g="' + g.id + '">' +
          '<button type="button" class="ng" aria-expanded="' + (!!openGroups[g.id]) + '" data-rtip="' + esc(g.label) + '">' + icon(g.icon) +
          '<span class="lbl">' + esc(g.label) + '</span>' + icon('chev', 'ic-sm chev') + '</button><div class="sub">';
        g.mods.forEach(function (m) { h += '<a class="ni" href="#' + m.k + '" data-k="' + m.k + '"><span class="lbl">' + esc(m.n) + '</span></a>'; });
        h += '</div></div>';
      });
      $('nav').innerHTML = h;
    }

    function setGroup(gid, open) {
      var el = document.querySelector('.grp[data-g="' + gid + '"]');
      if (!el) return;
      el.classList.toggle('open', open);
      el.firstElementChild.setAttribute('aria-expanded', String(open));
      if (open) openGroups[gid] = 1; else delete openGroups[gid];
      LS.set('mzo_ws_groups', JSON.stringify(openGroups));
    }

    function markActive(k) {
      var m = MODS[k];
      var cur = document.querySelectorAll('#nav [aria-current]');
      for (var i = 0; i < cur.length; i++) cur[i].removeAttribute('aria-current');
      var hits = document.querySelectorAll('#nav .ni[data-k="' + ((m && m.base) || k) + '"]');
      for (var j = 0; j < hits.length; j++) hits[j].setAttribute('aria-current', 'page');
      var gs = document.querySelectorAll('#nav .grp');
      for (var x = 0; x < gs.length; x++) gs[x].classList.toggle('has-active', !!(m && m.gid === gs[x].getAttribute('data-g')));
      if (m && m.gid && !root.classList.contains('rail')) setGroup(m.gid, true);
      var a = hits[0];
      if (a && a.scrollIntoView) { var r = a.getBoundingClientRect(), n = $('nav').getBoundingClientRect(); if (r.top < n.top || r.bottom > n.bottom) a.scrollIntoView({ block: 'nearest' }); }
    }

    $('nav').addEventListener('click', function (e) {
      var ng = e.target.closest('.ng');
      if (ng) {
        var gid = ng.parentNode.getAttribute('data-g');
        if (root.classList.contains('rail') && !isSmall()) { showFly(gid, ng); return; }
        setGroup(gid, !ng.parentNode.classList.contains('open'));
        return;
      }
      var a = e.target.closest('.ni[data-k]');
      if (a) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) { e.preventDefault(); openTab(MODS[a.getAttribute('data-k')]); return; }
        e.preventDefault();
        go(a.getAttribute('data-k'));
      }
    });
    // Warm the next page while the pointer is on its link.
    $('nav').addEventListener('pointerover', function (e) { var a = e.target.closest('.ni[data-k]'); if (a) prefetch(MODS[a.getAttribute('data-k')]); });
    $('nav').addEventListener('focusin', function (e) { var a = e.target.closest('.ni[data-k]'); if (a) prefetch(MODS[a.getAttribute('data-k')]); });

    /* Rail tooltips (CSS ::after would be clipped by the scrolling nav) */
    var tip = $('tip'), tipT = 0;
    document.querySelector('.sb').addEventListener('pointerover', function (e) {
      var el = e.target.closest('[data-rtip]');
      clearTimeout(tipT); tip.hidden = true;
      if (!el || !root.classList.contains('rail') || isSmall() || !fly.hidden) return;
      tipT = setTimeout(function () {
        if (!fly.hidden) return;
        var r = el.getBoundingClientRect();
        tip.textContent = el.getAttribute('data-rtip');
        tip.hidden = false;
        tip.style.left = (r.right + 10) + 'px';
        tip.style.top = (r.top + r.height / 2 - tip.offsetHeight / 2) + 'px';
      }, 250);
    });
    document.querySelector('.sb').addEventListener('pointerleave', function () { clearTimeout(tipT); tip.hidden = true; });

    /* Rail flyout */
    var fly = $('fly');
    function showFly(gid, btn) {
      var g = NAV.filter(function (x) { return x.id === gid; })[0];
      if (!g) return;
      clearTimeout(tipT); tip.hidden = true;
      if (!fly.hidden && fly.getAttribute('data-g') === gid) { hideFly(); return; }
      var h = '<h4>' + esc(g.label) + '</h4>';
      g.mods.forEach(function (m) { h += '<a class="ni" href="#' + m.k + '" data-k="' + m.k + '"' + (m.k === active ? ' aria-current="page"' : '') + '><span class="lbl">' + esc(m.n) + '</span></a>'; });
      fly.innerHTML = h;
      fly.setAttribute('data-g', gid);
      fly.hidden = false;
      var r = btn.getBoundingClientRect();
      var top = Math.min(r.top - 6, innerHeight - fly.offsetHeight - 8);
      fly.style.left = (r.right + 10) + 'px';
      fly.style.top = Math.max(8, top) + 'px';
    }
    function hideFly() { fly.hidden = true; fly.removeAttribute('data-g'); }
    fly.addEventListener('click', function (e) {
      var a = e.target.closest('.ni[data-k]');
      if (!a) return;
      e.preventDefault(); hideFly();
      if (e.metaKey || e.ctrlKey) openTab(MODS[a.getAttribute('data-k')]); else go(a.getAttribute('data-k'));
    });
    fly.addEventListener('pointerover', function (e) { var a = e.target.closest('.ni[data-k]'); if (a) prefetch(MODS[a.getAttribute('data-k')]); });

    /* ================= Stage: keep-alive frames ================= */
    var stage = $('stage');
    var frames = {};                  // key -> { el, t }
    var MAX_ALIVE = (navigator.deviceMemory && navigator.deviceMemory <= 4) || matchMedia('(max-width: 900px)').matches ? 2 : 5;
    var active = null, loadTimer = 0, prefetched = {};

    function isSmall() { return matchMedia('(max-width: 900px)').matches; }

    function prefetch(m) {
      if (!m || frames[m.k] || prefetched[m.u]) return;
      prefetched[m.u] = 1;
      var l = document.createElement('link');
      l.rel = 'prefetch'; l.href = '/' + norm(m.u);
      document.head.appendChild(l);
    }

    function busy(on, name) {
      clearTimeout(loadTimer);
      stage.classList.toggle('busy', !!on);
      if (on) { $('stageMsg').textContent = 'Loading ' + name + '…'; loadTimer = setTimeout(function () { stage.classList.remove('busy'); }, 20000); }
    }

    function frameFor(m) {
      var f = frames[m.k];
      if (f) return f;
      var el = document.createElement('iframe');
      el.title = m.n;
      el.setAttribute('data-k', m.k);
      el.addEventListener('load', function () { onFrameLoad(el); });
      el.src = '/' + norm(m.u);
      stage.appendChild(el);
      f = frames[m.k] = { el: el, t: 0, loaded: false };
      return f;
    }

    function evict() {
      var keys = Object.keys(frames);
      if (keys.length <= MAX_ALIVE) return;
      keys.sort(function (a, b) { return frames[a].t - frames[b].t; });
      for (var i = 0; i < keys.length - MAX_ALIVE; i++) {
        if (keys[i] === active) continue;
        frames[keys[i]].el.remove();
        delete frames[keys[i]];
      }
    }

    function show(k) {
      var m = MODS[k];
      if (!m) return;
      var f = frameFor(m);
      f.t = Date.now();
      Object.keys(frames).forEach(function (key) { frames[key].el.classList.toggle('off', key !== k); });
      active = k;
      busy(!f.loaded, m.n);
      evict();
    }

    function onFrameLoad(el) {
      var k = el.getAttribute('data-k');
      var f = frames[k];
      if (f) f.loaded = true;
      var win = el.contentWindow, path = '', search = '';
      try { path = win.location.pathname; search = win.location.search; } catch (e) {}
      // Session ended inside the page → leave the shell for the login screen.
      if (/\/login\.html$/i.test(path)) { location.replace('/login.html'); return; }
      // A page linked back home (old hub URL, which now redirects here) → show Briefing, not a shell in a shell.
      if (path === '/' || /^\/(index|app)\.html$/i.test(path)) { el.remove(); delete frames[k]; go('home', true); return; }
      try {
        var doc = win.document;
        doc.documentElement.classList.add('mzo-in-shell');
        if (doc.body) doc.body.classList.add('in-workstation');
        if (!win.MzoTheme) paintLegacy(doc, win);
        win.addEventListener('keydown', shortcuts);
      } catch (e) {}
      // The page navigated itself (in-page link) → follow it in the shell.
      var rel = norm(path + search);
      var was = MODS[k] ? norm(MODS[k].u).split('?')[0] : '';
      if (f && path && norm(path) !== was) {
        var nk = BY_URL[rel] || BY_URL[norm(path)];
        if (!nk) { nk = '~' + rel; MODS[nk] = { k: nk, n: (win.document && win.document.title) || rel, u: rel, g: '' }; }
        if (nk !== k && !frames[nk]) {
          frames[nk] = f; delete frames[k];
          el.setAttribute('data-k', nk);
          if (active === k) { active = nk; setChrome(nk); history.replaceState(null, '', '#' + nk); }
          k = nk;
        }
      }
      if (k === active) busy(false);
    }

    // Pages without mzo_theme.js still follow the shell theme.
    function paintLegacy(doc, win) {
      var t = root.getAttribute('data-mzo-theme');
      doc.documentElement.setAttribute('data-bs-theme', t);
      [doc.documentElement, doc.body].forEach(function (n) {
        if (!n) return;
        n.classList.remove('dark-theme', 'light-theme', 'dark', 'light');
        n.classList.add(t + '-theme', t);
      });
      try { win.dispatchEvent(new CustomEvent('mzo-theme-change', { detail: { theme: t } })); } catch (e) {}
    }

    /* ================= Routing ================= */
    var RECENT_KEY = 'mzo_ws_recent';
    function remember(k) {
      if (k.charAt(0) === '~') return;
      var r = [];
      try { r = JSON.parse(LS.get(RECENT_KEY) || '[]'); } catch (e) {}
      r = [k].concat(r.filter(function (x) { return x !== k; })).slice(0, 6);
      LS.set(RECENT_KEY, JSON.stringify(r));
    }
    function recents() {
      try { return JSON.parse(LS.get(RECENT_KEY) || '[]').filter(function (k) { return MODS[k]; }); } catch (e) { return []; }
    }

    function setChrome(k) {
      var m = MODS[k];
      $('cG').textContent = m.g || '';
      $('cP').textContent = m.n;
      document.title = m.n + ' · MZO Reports';
      markActive(k);
    }

    function go(k, replace) {
      if (!MODS[k]) k = 'home';
      if (isSmall()) drawer(false);
      hideFly();
      if (k !== active) {
        setChrome(k);
        show(k);
        remember(k);
      }
      var h = '#' + k;
      if (location.hash !== h) history[replace ? 'replaceState' : 'pushState'](null, '', h);
    }

    function fromHash() {
      var h = decodeURIComponent((location.hash || '').slice(1));
      if (h.charAt(0) === '~') {
        var u = norm(h.slice(1));
        var known = BY_URL[u];
        if (known) return known;
        var base = MODS[BY_URL[u.split('?')[0]]];
        if (u && !/^(https?:)?\/\//i.test(u)) { MODS[h] = base ? { k: h, n: base.n, u: u, g: base.g, gid: base.gid, base: base.k } : { k: h, n: u, u: u, g: '' }; return h; }
        return 'home';
      }
      return MODS[h] ? h : 'home';
    }
    window.addEventListener('popstate', function () { go(fromHash(), true); });

    // Pages call parent.openPage(url, title) to jump to another report.
    window.openPage = function (url, title) {
      var u = norm(url);
      if (/^https?:\/\//i.test(u)) { window.open(url, '_blank', 'noopener'); return; }
      if (/^((index|app)\.html)?$/i.test(u.split('?')[0])) { go('home'); return; } // a page's Home link
      var k = BY_URL[u];
      if (!k) {
        // Deep link with its own query (e.g. ?kpi=…, ?division=…): open that exact URL,
        // labelled and highlighted as its base report.
        var base = MODS[BY_URL[u.split('?')[0]]];
        k = '~' + u;
        if (frames[k]) { frames[k].el.remove(); delete frames[k]; }
        MODS[k] = base ? { k: k, n: base.n, u: u, g: base.g, gid: base.gid, icon: base.icon, base: base.k } : { k: k, n: title || u, u: u, g: '' };
      }
      go(k);
    };

    function openTab(m) { if (m) window.open('/' + norm(m.u), '_blank', 'noopener'); }

    /* ================= Theme ================= */
    var mq = matchMedia('(prefers-color-scheme: dark)');
    function pref() { return root.getAttribute('data-theme-pref') || 'system'; }
    function resolved(p) { return p === 'system' ? (mq.matches ? 'dark' : 'light') : p; }
    function applyTheme(p, persist) {
      var t = resolved(p);
      root.setAttribute('data-mzo-theme', t);
      root.setAttribute('data-theme-pref', p);
      if (persist) LS.set('mzo_theme_pref', p);
      ['theme', 'mzo_theme', 'collectionDashboardTheme'].forEach(function (key) { LS.set(key, t); });
      document.body.classList.toggle('light-theme', t === 'light');
      document.body.classList.toggle('dark-theme', t === 'dark');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#09090a' : '#f1f1f0');
      $('themeIco').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
      $('themeBtn').setAttribute('data-tip', t === 'dark' ? 'Light theme' : 'Dark theme');
      var segs = document.querySelectorAll('.seg button');
      for (var i = 0; i < segs.length; i++) segs[i].setAttribute('aria-pressed', String(segs[i].getAttribute('data-pref') === p));
      Object.keys(frames).forEach(function (k) {
        try {
          var w = frames[k].el.contentWindow;
          if (w.MzoTheme) w.MzoTheme.apply(t); else paintLegacy(w.document, w);
        } catch (e) {}
      });
    }
    mq.addEventListener && mq.addEventListener('change', function () { if (pref() === 'system') applyTheme('system'); });
    $('themeBtn').addEventListener('click', function () { applyTheme(resolved(pref()) === 'dark' ? 'light' : 'dark', true); });
    // A page's own toggle changed the theme.
    window.addEventListener('storage', function (e) {
      if ((e.key === 'theme' || e.key === 'mzo_theme') && (e.newValue === 'light' || e.newValue === 'dark') && e.newValue !== root.getAttribute('data-mzo-theme')) applyTheme(e.newValue, true);
    });

    /* ================= Chrome actions ================= */
    function rail(on) {
      root.classList.toggle('rail', on);
      LS.set('mzo_ws_rail', on ? '1' : '0');
      hideFly();
      if (!on && active && MODS[active] && MODS[active].gid) setGroup(MODS[active].gid, true);
    }
    function drawer(on) { root.classList.toggle('drawer', on); }
    $('railBtn').addEventListener('click', function () { if (isSmall()) drawer(!root.classList.contains('drawer')); else rail(!root.classList.contains('rail')); });
    $('scrim').addEventListener('click', function () { drawer(false); });

    $('reloadBtn').addEventListener('click', function () {
      var f = frames[active];
      if (!f) return;
      var b = $('reloadBtn'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
      f.loaded = false; busy(true, MODS[active].n);
      try { f.el.contentWindow.location.reload(); } catch (e) { f.el.src = f.el.src; }
    });
    $('popBtn').addEventListener('click', function () { openTab(MODS[active]); });
    $('fsBtn').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else document.documentElement.requestFullscreen().catch(function () {});
    });
    document.addEventListener('fullscreenchange', function () {
      var on = !!document.fullscreenElement;
      $('fsIco').setAttribute('href', on ? '#i-min' : '#i-max');
      $('fsBtn').setAttribute('data-tip', on ? 'Exit full screen' : 'Full screen');
    });

    /* Account menu */
    var menu = $('meMenu'), meBtn = $('meBtn');
    function menuOpen(on) {
      menu.hidden = !on;
      meBtn.setAttribute('aria-expanded', String(on));
      if (on) {
        var r = meBtn.getBoundingClientRect();
        menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + 'px';
        menu.style.top = Math.max(8, r.top - menu.offsetHeight - 6) + 'px';
      }
    }
    meBtn.addEventListener('click', function (e) { e.stopPropagation(); menuOpen(menu.hidden); });
    menu.addEventListener('click', function (e) {
      var s = e.target.closest('[data-pref]');
      if (s) applyTheme(s.getAttribute('data-pref'), true);
    });
    document.addEventListener('click', function (e) {
      if (!menu.hidden && !menu.contains(e.target)) menuOpen(false);
      if (!fly.hidden && !fly.contains(e.target) && !e.target.closest('.ng')) hideFly();
    });
    $('logoutBtn').addEventListener('click', function () {
      $('logoutBtn').disabled = true;
      fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).catch(function () {}).then(function () {
        LS.del('mzo_authenticated'); LS.del('mzo_user_profile');
        location.replace('/login.html');
      });
    });

    function renderUser() {
      var p = profile || {};
      var name = String(p.Name || p.Username || 'Signed in').trim();
      var role = isAdmin(p) ? 'Administrator' : (p.role ? String(p.role).charAt(0).toUpperCase() + String(p.role).slice(1) : 'Officer');
      var lvl = String(p.office_level || '').toUpperCase();
      var scope = p.ccc_code ? 'CCC ' + p.ccc_code : p.division_code ? 'Division ' + p.division_code : p.region_code ? 'Region ' + p.region_code : (lvl && lvl !== 'CCC' ? lvl : 'Malda Zone');
      var initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase() || '·';
      $('meAv').textContent = initials;
      $('meName').textContent = name;
      $('meSub').textContent = role + ' · ' + scope;
      $('mhName').textContent = name;
      $('mhSub').textContent = (p.email || p.Username || '') + '';
    }

    /* ================= Command palette ================= */
    var pal = $('pal'), palQ = $('palQ'), palList = $('palList');
    var palItems = [], palSel = 0;
    var ACTIONS = [
      { a: 'theme', n: 'Switch theme', icon: 'moon', kw: 'dark light mode appearance' },
      { a: 'rail', n: 'Toggle sidebar', icon: 'panel', kw: 'collapse expand' },
      { a: 'reload', n: 'Reload current page', icon: 'reload', kw: 'refresh' },
      { a: 'pop', n: 'Open current page in new tab', icon: 'ext', kw: 'pop out window' },
      { a: 'logout', n: 'Sign out', icon: 'out', kw: 'logout exit' }
    ];

    function score(q, m) {
      var n = m.n.toLowerCase(), hay = (n + ' ' + (m.g || '') + ' ' + (m.kw || '')).toLowerCase();
      if (n === q) return 1000;
      if (n.indexOf(q) === 0) return 900 - n.length;
      if ((' ' + n).indexOf(' ' + q) !== -1) return 800 - n.length;
      if (n.indexOf(q) !== -1) return 700 - n.indexOf(q);
      var words = q.split(/\s+/).filter(Boolean);
      if (words.length && words.every(function (w) { return hay.indexOf(w) !== -1; })) return 500 - n.length;
      // initials / subsequence ("pnsc" → Pending NSC)
      var i = 0; for (var c = 0; c < n.length && i < q.length; c++) if (n[c] === q[i]) i++;
      if (i === q.length) return 200 - n.length;
      return 0;
    }
    function hl(text, q) {
      if (!q) return esc(text);
      var i = text.toLowerCase().indexOf(q);
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }

    function palRender() {
      var q = palQ.value.trim().toLowerCase();
      var h = '', seen = {};
      palItems = [];
      function row(it, kind) {
        var idx = palItems.length;
        palItems.push(it);
        var ic = kind === 'act' ? it.icon : (it.k === 'home' ? 'home' : (it.icon || 'file'));
        return '<div class="pal-it" role="option" id="po' + idx + '" data-i="' + idx + '">' + icon(kind === 'recent' ? 'clock' : ic) +
          '<span class="t">' + hl(it.n, q) + '</span><span class="g">' + esc(kind === 'act' ? 'Action' : (it.g || '')) + '</span></div>';
      }
      if (!q) {
        var r = recents();
        if (r.length) { h += '<div class="pal-sec">Recent</div>'; r.forEach(function (k) { seen[MODS[k].u] = 1; h += row(MODS[k], 'recent'); }); }
        h += '<div class="pal-sec">Reports</div>';
        ALL.forEach(function (m) { if (!seen[m.u]) { seen[m.u] = 1; h += row(m, 'mod'); } });
      } else {
        var hits = [];
        ALL.forEach(function (m) { var s = score(q, m); if (s > 0 && !seen[m.u]) { seen[m.u] = 1; hits.push([s, m]); } });
        hits.sort(function (a, b) { return b[0] - a[0]; });
        var acts = ACTIONS.filter(function (a) { return score(q, a) > 0; });
        if (hits.length) { h += '<div class="pal-sec">Reports</div>'; hits.slice(0, 30).forEach(function (x) { h += row(x[1], 'mod'); }); }
        if (q.length > 2) { h += '<div class="pal-sec">Assistant</div>'; h += row({ a: 'ask', n: 'Ask: ' + palQ.value.trim(), icon: 'chat', q: palQ.value.trim() }, 'act'); }
        if (acts.length) { h += '<div class="pal-sec">Actions</div>'; acts.forEach(function (a) { h += row(a, 'act'); }); }
        if (!palItems.length) h = '<div class="pal-empty">No reports match “' + esc(palQ.value.trim()) + '”</div>';
      }
      if (!q) { h += '<div class="pal-sec">Actions</div>'; ACTIONS.forEach(function (a) { h += row(a, 'act'); }); }
      palList.innerHTML = h;
      palSel = 0; palMark();
    }
    function palMark() {
      var rows = palList.querySelectorAll('.pal-it');
      for (var i = 0; i < rows.length; i++) rows[i].setAttribute('aria-selected', String(i === palSel));
      var cur = rows[palSel];
      if (cur) { palQ.setAttribute('aria-activedescendant', cur.id); cur.scrollIntoView({ block: 'nearest' }); if (palItems[palSel] && palItems[palSel].u) prefetch(palItems[palSel]); }
    }
    function palRun(i, newTab) {
      var it = palItems[i];
      if (!it) return;
      pal.close();
      if (it.a) return runAction(it.a, it);
      if (newTab) openTab(it); else go(it.k);
    }
    function runAction(a, it) {
      if (a === 'ask') { window.openPage('assistant.html?q=' + encodeURIComponent(it.q)); return; }
      if (a === 'theme') $('themeBtn').click();
      else if (a === 'rail') $('railBtn').click();
      else if (a === 'reload') $('reloadBtn').click();
      else if (a === 'pop') openTab(MODS[active]);
      else if (a === 'logout') $('logoutBtn').click();
    }
    function palOpen() {
      if (pal.open) { palQ.select(); return; }
      menuOpen(false); hideFly();
      palQ.value = '';
      palRender();
      pal.showModal();
      palQ.focus();
    }
    palQ.addEventListener('input', palRender);
    palQ.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palMark(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palMark(); }
      else if (e.key === 'Enter') { e.preventDefault(); palRun(palSel, e.metaKey || e.ctrlKey); }
    });
    palList.addEventListener('click', function (e) { var r = e.target.closest('.pal-it'); if (r) palRun(+r.getAttribute('data-i'), e.metaKey || e.ctrlKey); });
    palList.addEventListener('pointermove', function (e) { var r = e.target.closest('.pal-it'); if (r && +r.getAttribute('data-i') !== palSel) { palSel = +r.getAttribute('data-i'); palMark(); } });
    pal.addEventListener('click', function (e) { if (e.target === pal) pal.close(); });
    $('openPal').addEventListener('click', palOpen);

    /* ================= Keyboard ================= */
    function shortcuts(e) {
      var mod = e.metaKey || e.ctrlKey;
      var k = (e.key || '').toLowerCase();
      if (mod && k === 'k') { e.preventDefault(); palOpen(); return; }
      if (mod && k === 'b') { e.preventDefault(); $('railBtn').click(); return; }
      if (e.key === 'Escape') { menuOpen(false); hideFly(); if (isSmall()) drawer(false); }
      if (e.key === '/' && !mod && e.currentTarget === window) {
        var t = document.activeElement && document.activeElement.tagName;
        if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'SELECT') { e.preventDefault(); palOpen(); }
      }
    }
    window.addEventListener('keydown', shortcuts);

    /* ================= Boot ================= */
    index();
    renderNav();
    renderUser();
    applyTheme(pref(), false);
    go(fromHash(), true);

    // Validate the session in the background; refresh the profile.
    if (navigator.onLine !== false) {
      fetch('/api/session-check', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
        .then(function (r) {
          if (r.status === 401) { LS.del('mzo_authenticated'); LS.del('mzo_user_profile'); location.replace('/login.html'); return null; }
          return r.ok ? r.json() : null;
        })
        .then(function (d) {
          if (!d || !d.profile) return;
          var wasAdmin = isAdmin(profile), wasSheets = canSheets(profile);
          profile = d.profile;
          LS.set('mzo_authenticated', 'true');
          LS.set('mzo_user_profile', JSON.stringify(profile));
          renderUser();
          if (wasAdmin !== isAdmin(profile) || wasSheets !== canSheets(profile)) { index(); renderNav(); if (!MODS[active]) go('home', true); else markActive(active); }
        })
        .catch(function () {});
    }

    // After first paint: app-update notice, and warm recent pages.
    var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 1200); };
    idle(function () {
      var s = document.createElement('script');
      s.src = '/mzo_app_update.js?v=87'; s.async = true;
      document.head.appendChild(s);
      recents().slice(0, 3).forEach(function (k) { prefetch(MODS[k]); });
    });
  })();
  </script>
</body>
