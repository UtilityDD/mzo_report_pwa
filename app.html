<!DOCTYPE html>
<html lang="en" data-mzo-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DISHA · Distribution Insights</title>
  <meta name="theme-color" content="#f1f1f0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DISHA" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" id="appFavicon" href="/icons/icon-192-v2.png?v=297" />
  <script>
    /* Paint the right theme before first render (no flash). */
    (function () {
      var d = document.documentElement, pref = 'system', t;
      try {
        pref = localStorage.getItem('mzo_theme_pref') || '';
        if (!pref) { t = localStorage.getItem('theme') || localStorage.getItem('mzo_theme'); pref = (t === 'light' || t === 'dark' || t === 'ppt') ? t : 'system'; }
      } catch (e) { }
      t = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : ((pref === 'dark' || pref === 'ppt') ? pref : 'light');
      d.setAttribute('data-mzo-theme', t);
      d.setAttribute('data-theme-pref', pref);
      if (t === 'dark') {
        var fi = document.getElementById('appFavicon');
        if (fi) fi.href = '/icons/icon-192-dark.png?v=297';
      }
      try { if (localStorage.getItem('mzo_ws_rail') === '1') d.classList.add('rail'); } catch (e) { }
      window.__MZO_SHELL__ = true;
    })();
  </script>
  <style>
    /* ---------- Tokens (keep in sync with mzo_theme.css) ---------- */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --sb-w: 252px;
      --rail-w: 56px;
      --bar-h: 44px;
      --r: 8px;
      --r-sm: 6px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    [data-mzo-theme="light"] {
      color-scheme: light;
      --canvas: #f1f1f0;
      --bg: #fafafa;
      --surface: #fff;
      --surface-2: #f5f5f4;
      --hover: #e9e9e7;
      --hover-soft: #efefee;
      --border: #e7e7e5;
      --border-strong: #d6d6d3;
      --text: #18181b;
      --text-2: #3f3f46;
      --muted: #71717a;
      --faint: #a1a1aa;
      --ink: #18181b;
      --on-ink: #fff;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, .09);
      --ring: 0 0 0 3px rgba(15, 118, 110, .18);
      --c1: #12a195;
      --c2: #427fd8;
      --c3: #982c72;
      --c4: #886acf;
      --c5: #b08505;
      --c6: #0c8bbb;
      --warn-mark: #f59e0b;
      --shadow-pop: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -8px rgba(0, 0, 0, .16);
      --shadow-panel: 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, .03);
      --scrim: rgba(24, 24, 27, .32);
    }

    [data-mzo-theme="dark"] {
      color-scheme: dark;
      --canvas: #09090a;
      --bg: #0f0f10;
      --surface: #161617;
      --surface-2: #1c1c1e;
      --hover: #232325;
      --hover-soft: #1d1d1f;
      --border: #27272a;
      --border-strong: #34343a;
      --text: #ececee;
      --text-2: #c8c8cd;
      --muted: #8e8e96;
      --faint: #5f5f66;
      --ink: #ececee;
      --on-ink: #0f0f10;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, .12);
      --ring: 0 0 0 3px rgba(96, 165, 250, .24);
      --c1: #4285f4;
      --c2: #e2671e;
      --c3: #13a091;
      --c4: #8f63f2;
      --c5: #e04b95;
      --c6: #b8891d;
      --warn-mark: #fbbf24;
      --shadow-pop: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px -8px rgba(0, 0, 0, .65);
      --shadow-panel: 0 0 0 1px var(--border);
      --scrim: rgba(0, 0, 0, .55);
    }

    /* Presentation: light chrome, so the report's own title band is the one coloured bar. */
    [data-mzo-theme="ppt"] {
      color-scheme: light;
      --canvas: #e8edf6;
      --bg: #f2f5fb;
      --surface: #ffffff;
      --surface-2: #eef3fb;
      --hover: #dfe7f6;
      --hover-soft: #e9eff9;
      --border: #d6deec;
      --border-strong: #b4c2db;
      --text: #0f172a;
      --text-2: #1e293b;
      --muted: #475569;
      --faint: #94a3b8;
      --ink: #0f172a;
      --on-ink: #ffffff;
      --accent: #1d4ed8;
      --accent-soft: rgba(29, 78, 216, .10);
      --ring: 0 0 0 3px rgba(29, 78, 216, .28);
      --c1: #2563eb;
      --c2: #ea580c;
      --c3: #0d9488;
      --c4: #7c3aed;
      --c5: #db2777;
      --c6: #a16207;
      --warn-mark: #d97706;
      --shadow-pop: 0 4px 12px rgba(15, 23, 42, .08), 0 20px 44px -10px rgba(30, 58, 138, .22);
      --shadow-panel: 0 0 0 1px var(--border), 0 8px 24px -12px rgba(30, 58, 138, .22);
      --scrim: rgba(15, 23, 42, .45);
    }

    /* ---------- Base ---------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font: 13px/1.45 var(--font);
      color: var(--text);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    .ic {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ic-sm {
      width: 14px;
      height: 14px;
    }

    kbd {
      font: 500 11px/1 var(--mono);
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 2px 5px;
      min-width: 18px;
      text-align: center;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---------- Layout ---------- */
    .app {
      display: grid;
      grid-template-columns: var(--sb-w) minmax(0, 1fr);
      height: 100dvh;
      transition: grid-template-columns .2s var(--ease);
    }

    .rail .app {
      grid-template-columns: var(--rail-w) minmax(0, 1fr);
    }

    /* ---------- Sidebar ---------- */
    .sb {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 10px 8px 8px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 4px 6px;
      min-width: 0;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      min-width: 0;
    }

    .brand-logo-img {
      display: block;
      width: 100%;
      max-width: 232px;
      height: auto;
      object-fit: contain;
      object-position: left center;
    }

    .brand-logo-dark {
      display: none !important;
    }

    .brand-logo-light {
      display: block !important;
    }

    html[data-mzo-theme="dark"] .brand-logo-light {
      display: none !important;
    }

    html[data-mzo-theme="dark"] .brand-logo-dark {
      display: block !important;
    }

    .brand-tagline {
      display: none;
    }

    .brand-rail-icon {
      display: none;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 6px 0 9px;
      border-radius: var(--r-sm);
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--border);
      color: var(--muted);
      text-align: left;
      transition: box-shadow .12s, color .12s;
    }

    .search:hover {
      color: var(--text-2);
      box-shadow: 0 0 0 1px var(--border-strong);
    }

    .search span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
    }

    .search kbd {
      background: var(--surface-2);
    }

    .nav {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0 -8px;
      padding: 2px 8px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .nav::-webkit-scrollbar {
      width: 8px;
    }

    .nav::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 8px;
      border: 2px solid var(--canvas);
    }

    .sec {
      font-size: 11px;
      font-weight: 500;
      color: var(--faint);
      padding: 14px 8px 4px;
      white-space: nowrap;
    }

    .ni,
    .ng {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 30px;
      padding: 0 8px;
      border-radius: var(--r-sm);
      color: var(--text-2);
      white-space: nowrap;
      text-align: left;
      transition: background-color .1s, color .1s;
      position: relative;
    }

    .ni:hover,
    .ng:hover {
      background: var(--hover);
      color: var(--text);
    }

    .ni .ic,
    .ng .ic {
      color: var(--muted);
    }

    .ni:hover .ic,
    .ng:hover .ic {
      color: var(--text-2);
    }

    .lbl {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev {
      color: var(--faint);
      transition: transform .15s var(--ease);
    }

    .grp.open>.ng .chev {
      transform: rotate(90deg);
    }

    .grp.has-active>.ng {
      color: var(--text);
    }

    .grp.has-active>.ng .ic:first-child {
      color: var(--text);
    }

    .ni[aria-current="page"] {
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, .04);
    }

    .ni[aria-current="page"] .ic {
      color: var(--text);
    }

    .sub {
      display: none;
      position: relative;
      padding: 2px 0 4px;
    }

    .grp.open>.sub {
      display: block;
    }

    .sub::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 2px;
      bottom: 6px;
      width: 1px;
      background: var(--border);
    }

    .sub .ni {
      height: 28px;
      padding-left: 26px;
      font-size: 12.75px;
    }

    .sub .ni[aria-current="page"]::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
    }

    /* Group identity: each report group's icon wears its own hue (--gc, from NAV hue). */
    .grp>.ng>.ic.gi,
    .grp>.ng:hover>.ic.gi,
    .grp.has-active>.ng>.ic.gi {
      color: var(--gc, var(--muted));
    }

    /* ---------- Highlighted Favourites Box in Left Menu ---------- */
    .fav-card {
      margin: 6px 0 2px;
      padding: 4px;
      border-radius: var(--r-sm);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .fav-head {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .fav-head .ic.fav-star,
    .pal-it .ic.fav-star {
      color: var(--warn-mark);
      fill: var(--warn-mark);
      width: 12px;
      height: 12px;
    }

    .fav-cnt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 17px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .fav-add {
      margin-left: auto;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      color: var(--muted);
      background: none;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color .1s, color .1s;
    }

    .fav-add:hover {
      background: var(--hover);
      color: var(--text);
    }

    .fav-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-top: 2px;
    }

    .fav-list .ni {
      height: 28px;
      padding: 0 6px 0 8px;
      font-size: 12.5px;
      font-weight: 500;
    }

    .fav-list .ni .ic.gi {
      color: var(--gc, var(--accent));
      width: 14px;
      height: 14px;
    }

    .fav-empty {
      padding: 6px 8px;
      font-size: 11px;
      color: var(--faint);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .fav-empty-add {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px dashed var(--border-strong);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .12s ease;
      font-family: inherit;
    }

    .fav-empty-add:hover {
      background: var(--hover);
      color: var(--text);
      border-color: var(--warn-mark);
    }

    /* Star pin button inside nav rows, flyout & search palette */
    .fav-pin {
      width: 22px;
      height: 22px;
      flex: none;
      display: inline-grid;
      place-items: center;
      border-radius: 5px;
      color: var(--faint);
      opacity: 0;
      transition: opacity .12s, color .12s, background-color .12s, transform .12s;
      margin-right: -3px;
    }

    @media (hover: none) {
      .fav-pin {
        opacity: .5;
      }
    }

    .ni:hover .fav-pin,
    .pal-it:hover .fav-pin,
    .fav-pin:focus-visible,
    .fav-pin.on {
      opacity: 1;
    }

    .fav-pin:hover {
      background: var(--hover-soft);
      color: var(--warn-mark);
      transform: scale(1.1);
    }

    .fav-pin.on {
      color: var(--warn-mark);
    }

    .fav-pin.on .ic {
      fill: var(--warn-mark);
      color: var(--warn-mark);
    }

    .ni[aria-current="page"] .fav-pin.on .ic {
      fill: var(--warn-mark);
      color: var(--warn-mark);
    }

    /* Top bar favourite star button */
    .ib.fav-bar-btn[aria-pressed="true"],
    .ib.fav-bar-btn[aria-pressed="true"]:hover {
      background: rgba(245, 158, 11, .15) !important;
      color: var(--warn-mark) !important;
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, .42) !important;
    }

    .ib.fav-bar-btn[aria-pressed="true"] .ic {
      fill: var(--warn-mark);
      color: var(--warn-mark) !important;
    }

    .fav-rail-btn {
      display: none;
    }

    .fav-rail-btn .ic {
      color: var(--warn-mark);
      fill: var(--warn-mark);
    }

    /* Top bar presentation PPT button */
    .ib#pptBtn[aria-pressed="true"],
    .ib#pptBtn[aria-pressed="true"]:hover {
      background: #1d4ed8 !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }

    .ib#pptBtn[aria-pressed="true"] .ic {
      color: #ffffff !important;
    }

    .foot {
      border-top: 1px solid var(--border);
      margin: 0 -8px;
      padding: 8px 8px 0;
    }

    .me {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 6px;
      border-radius: var(--r-sm);
      text-align: left;
    }

    .me:hover,
    .me[aria-expanded="true"] {
      background: var(--hover);
    }

    .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--border-strong);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-2);
    }

    .me-t {
      flex: 1;
      min-width: 0;
      line-height: 1.25;
    }

    .me-t b {
      display: block;
      font-weight: 500;
      font-size: 12.75px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .me-t span {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .me .ic {
      color: var(--faint);
    }

    @media (min-width: 901px) {

      /* Rail (collapsed) */
      .rail .sb .brand-t,
      .rail .sb .search span,
      .rail .sb .search kbd,
      .rail .sb .sec,
      .rail .sb .lbl,
      .rail .sb .chev,
      .rail .sb .me-t,
      .rail .sb .me>.ic,
      .rail .sb .sub,
      .rail .sb .fav-card,
      .rail .sb .fav-pin {
        display: none !important;
      }

      .rail .sb .fav-rail-btn {
        display: flex !important;
        justify-content: center;
        padding: 0;
      }

      .rail .sb .brand {
        padding: 0;
        justify-content: center;
        height: 48px;
        min-height: 48px;
      }

      .rail .sb .brand-wrap {
        display: none !important;
      }

      .rail .sb .brand-rail-icon {
        width: 38px;
        height: 38px;
        object-fit: contain;
      }

      .rail .sb .brand-rail-light {
        display: block !important;
      }

      .rail .sb .brand-rail-dark {
        display: none !important;
      }

      html[data-mzo-theme="dark"] .rail .sb .brand-rail-light {
        display: none !important;
      }

      html[data-mzo-theme="dark"] .rail .sb .brand-rail-dark {
        display: block !important;
      }

      .rail .sb .search {
        justify-content: center;
        padding: 0;
        background: none;
        box-shadow: none;
      }

      .rail .sb .search:hover {
        background: var(--hover);
      }

      .rail .sb .ni,
      .rail .sb .ng {
        justify-content: center;
        padding: 0;
      }

      .rail .sb .sec-gap {
        height: 10px;
      }

      .rail .sb .grp.has-active>.ng {
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--border);
      }

      .rail .sb .me {
        justify-content: center;
        padding: 6px 0;
      }

      .sec-gap {
        display: none;
      }

      .rail .sb .sec-gap {
        display: block;
      }
    }

    /* Rail flyout */
    .fly {
      position: fixed;
      z-index: 60;
      min-width: 220px;
      max-width: 280px;
      max-height: calc(100dvh - 16px);
      overflow: auto;
      background: var(--surface);
      border-radius: 10px;
      box-shadow: 0 0 0 1px var(--border), var(--shadow-pop);
      padding: 6px;
    }

    .fly[hidden] {
      display: none;
    }

    .fly h4 {
      margin: 0;
      padding: 6px 8px 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
    }

    .fly .ni {
      height: 30px;
    }

    /* ---------- Main panel ---------- */
    .main {
      min-width: 0;
      min-height: 0;
      padding: 8px 8px 8px 0;
      display: flex;
    }

    .panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 10px;
      box-shadow: var(--shadow-panel);
      overflow: hidden;
    }

    .bar {
      height: var(--bar-h);
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .crumbs {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
      padding-left: 4px;
    }

    .crumbs .c-g {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
    }

    .crumbs .c-s {
      color: var(--faint);
    }

    .crumbs .c-p {
      color: var(--text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .crumbs .c-g:empty,
    .crumbs .c-g:empty+.c-s {
      display: none;
    }

    .vr {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
      flex: none;
    }

    .asof {
      flex: none;
      padding: 0 6px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      cursor: default;
      position: relative;
    }

    .ib {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: var(--r-sm);
      color: var(--muted);
      position: relative;
      transition: background-color .1s, color .1s;
    }

    .ib:hover {
      background: var(--hover-soft);
      color: var(--text);
    }

    .ib:active {
      background: var(--hover);
    }

    html[data-mzo-theme="ppt"] .stage-msg {
      color: #334155;
    }

    html[data-mzo-theme="ppt"] .stage-msg::before {
      border-color: #cbd5e1;
      border-top-color: #2563eb;
    }

    html[data-mzo-theme="ppt"] .ni[aria-current="page"] {
      background: #1d4ed8;
      color: #ffffff;
      font-weight: 600;
      box-shadow: none;
    }

    html[data-mzo-theme="ppt"] .ni[aria-current="page"] .ic {
      color: #ffffff;
    }

    .ib.spin .ic {
      animation: spin .6s var(--ease);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Tooltips */
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(-2px);
      background: var(--ink);
      color: var(--on-ink);
      font: 500 11.5px/1 var(--font);
      white-space: nowrap;
      padding: 6px 8px;
      border-radius: 5px;
      opacity: 0;
      pointer-events: none;
      z-index: 70;
      transition: opacity .12s, transform .12s;
    }

    [data-tip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: .35s;
    }

    [data-tip-end]::after {
      left: auto;
      right: 0;
      transform: translateY(-2px);
    }

    [data-tip-end]:hover::after {
      transform: translateY(0);
    }

    .tip {
      position: fixed;
      z-index: 80;
      pointer-events: none;
      background: var(--ink);
      color: var(--on-ink);
      font: 500 11.5px/1 var(--font);
      white-space: nowrap;
      padding: 6px 8px;
      border-radius: 5px;
    }

    .tip[hidden] {
      display: none;
    }

    /* ---------- Stage ---------- */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--bg);
    }

    .stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .stage iframe.off {
      visibility: hidden;
      pointer-events: none;
    }

    .stage-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s .15s;
    }

    .stage-msg::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      animation: spin .75s linear infinite;
    }

    .stage.busy .stage-msg {
      opacity: 1;
    }

    .prog {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }

    .stage.busy .prog {
      opacity: 1;
    }

    .prog::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: var(--accent);
      border-radius: 2px;
      animation: prog 1.1s var(--ease) infinite;
    }

    @keyframes prog {
      from {
        left: -40%;
      }

      to {
        left: 100%;
      }
    }

    /* ---------- Menus ---------- */
    .menu {
      position: fixed;
      z-index: 60;
      width: 248px;
      background: var(--surface);
      border-radius: 10px;
      box-shadow: 0 0 0 1px var(--border), var(--shadow-pop);
      padding: 6px;
    }

    .menu[hidden] {
      display: none;
    }

    .menu-h {
      padding: 8px 8px 10px;
      border-bottom: 1px solid var(--border);
      margin: -6px -6px 6px;
      padding-top: 12px;
      padding-left: 14px;
    }

    .menu-h b {
      display: block;
      font-weight: 600;
      font-size: 13px;
    }

    .menu-h span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 1px;
    }

    .mi {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border-radius: var(--r-sm);
      color: var(--text-2);
      text-align: left;
    }

    .mi:hover {
      background: var(--hover-soft);
      color: var(--text);
    }

    .mi .ic {
      color: var(--muted);
    }

    .mi.danger:hover {
      color: #dc2626;
    }

    .mi.danger:hover .ic {
      color: #dc2626;
    }

    .mi-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 4px 4px 8px;
      height: 38px;
      color: var(--text-2);
    }

    .seg {
      display: inline-flex;
      padding: 2px;
      border-radius: 7px;
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--border);
    }

    .seg button {
      width: 28px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--muted);
    }

    .seg button:hover {
      color: var(--text);
    }

    .seg button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--border-strong), 0 1px 1px rgba(0, 0, 0, .05);
    }

    .menu hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 6px -6px;
    }

    /* ---------- Command palette ---------- */
    dialog.pal {
      width: min(600px, calc(100vw - 24px));
      margin: 12vh auto auto;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--border), var(--shadow-pop);
      overflow: hidden;
    }

    dialog.pal::backdrop {
      background: var(--scrim);
    }

    dialog.pal[open] {
      animation: pop .14s var(--ease);
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(-4px) scale(.985);
      }
    }

    .pal-in {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }

    .pal-in input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: none;
      color: var(--text);
      font: 15px var(--font);
    }

    .pal-in input::placeholder {
      color: var(--faint);
    }

    .pal-list {
      max-height: min(400px, 52vh);
      overflow-y: auto;
      padding: 6px;
      scrollbar-width: thin;
    }

    .pal-sec {
      font-size: 11.5px;
      color: var(--muted);
      padding: 8px 10px 4px;
    }

    .pal-it {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 38px;
      padding: 0 10px;
      border-radius: 7px;
      color: var(--text-2);
      cursor: pointer;
    }

    .pal-it .ic {
      color: var(--muted);
    }

    .pal-it .t {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pal-it .t mark {
      background: none;
      color: var(--text);
      font-weight: 600;
    }

    .pal-it .g {
      color: var(--faint);
      font-size: 12px;
      white-space: nowrap;
    }

    .pal-it[aria-selected="true"] {
      background: var(--hover-soft);
      color: var(--text);
    }

    .pal-it[aria-selected="true"] .ic {
      color: var(--text);
    }

    .pal-it .ic.gi,
    .pal-it[aria-selected="true"] .ic.gi {
      color: var(--gc, var(--muted));
    }

    .pal-empty {
      padding: 28px 10px;
      text-align: center;
      color: var(--muted);
    }

    .pal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .pal-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .pal-title-wrap .fav-star {
      color: var(--warn-mark);
      fill: var(--warn-mark);
      width: 14px;
      height: 14px;
    }

    .pal-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pal-fav-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, .16);
      color: var(--warn-mark);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .pal-close-btn,
    .pal-done-action {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color .1s, border-color .1s, color .1s;
      font-family: inherit;
    }

    .pal-close-btn:hover,
    .pal-done-action:hover {
      background: var(--hover);
      border-color: var(--border-strong);
      color: var(--text);
    }

    .pal-fav-it {
      user-select: none;
    }

    .pal-fav-it.is-fav {
      background: rgba(245, 158, 11, .08);
      color: var(--text);
    }

    .pal-fav-it.is-fav .t {
      font-weight: 600;
    }

    .pal-fav-it .fav-pin {
      opacity: 1 !important;
    }

    .pal-ft {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11.5px;
      background: var(--surface-2);
    }

    .pal-ft-search,
    .pal-ft-favs {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .pal-ft-favs {
      justify-content: space-between;
    }

    .pal-ft span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ---------- Mobile ---------- */
    .scrim {
      display: none;
    }

    @media (max-width: 900px) {

      .app,
      .rail .app {
        grid-template-columns: minmax(0, 1fr);
      }

      .sb {
        position: fixed;
        z-index: 50;
        inset: 0 auto 0 0;
        width: min(296px, 86vw);
        background: var(--canvas);
        box-shadow: var(--shadow-pop);
        transform: translateX(-102%);
        transition: transform .22s var(--ease);
      }

      .drawer .sb {
        transform: none;
      }

      .scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
      }

      .drawer .scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .main {
        padding: 0;
      }

      .panel {
        border-radius: 0;
        box-shadow: none;
      }

      .hide-sm {
        display: none !important;
      }

      .search kbd {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      /* ================= Module registry (single source of truth) ================= */
      // [key, name, url, extra search words] · hue: the group's identity colour (sidebar and search icons)
      var NAV = [

          ]
        },
        {

            ['dd_visit_page', 'DD visit', 'dd/dd_visit.html', 'visit']

        {

            ['advance_onm', 'O&M summary', 'advance_onm.html', 'advance vendor maintenance']
          ]
        },
        {
          id: 'substation_network', label: 'Substation & network', icon: 'grid', hue: 'c3', items: [
            ['power_map', 'Power map', 'power_map/map.html', 'substation feeder gis'],
            ['highway_crossings', 'Line–highway crossings', 'power_map/nh_sh_crossings.html', 'nh sh crossing'],
            ['prt_oil', 'PRT / transformer records', 'prt-oil/index.html', 'oil test'],
            ['feeder_outage', 'Feeder outage', 'feeder_outage.html', 'interruption tripping']
          ]
        },
        {
          id: 'important', label: 'Important', icon: 'mark', hue: 'warn-mark', items: [
            ['perf_index_imp', 'Performance index', 'performance_index.html', 'ranking'],
            ['cmo', 'CMO grievance', 'cmo.html', 'complaint'],
            ['pmsgy', 'PM Surya Ghar', 'pmsgy.html', 'solar rooftop'],
            ['si_works', 'Priority SI works', 'si-works/si.html', 'safety inspection'],
            ['jjm_report', 'JJM report', 'jjm.html', 'jal jeevan'],
            ['accident', 'Accident reports', 'accident/accident.html', 'safety'],
            ['safety_app', 'Safety app reports', 'safety_inspection.html', 'inspection'],
            ['manpower', 'Manpower report', 'manpower.html', 'staff'],
            ['upkeeping', 'Substation upkeeping', 'Upkeeping/index.html', 'maintenance'],
            ['dtr', 'DTR records', 'dtr/index.html', 'transformer'],
            ['dtr_load', 'Peak load measurements', 'dtr/load.html', 'transformer load'],
            ['health_checkup', 'Health check-up', 'health_checkup.html', ''],
            ['puja', 'Durga Puja 2026', 'puja.html', 'puja festival pandal durga'],
            ['stock', 'Stock', 'stock/index.html', 'material inventory'],
            ['important_sheets', 'Important data sheets', 'important_sheets.html', 'google sheets'],
            ['sheet_links', 'Sheet links', 'sheet_links.html', 'google sheets sources', 'sheets']
          ]
        },
        {
          id: 'media', label: 'Media', icon: 'news', items: [
            ['media_news', 'Power news hub', 'media_news.html', 'news']
          ]
        },
        {
          id: 'admin', label: 'Administration', icon: 'shield', admin: true, items: [
            ['admin_users', 'Users', 'admin_users.html?tab=users', 'accounts roles approvals'],
            ['admin_sources', 'Sources', 'admin_users.html?tab=sources', 'datasets'],
            ['admin_activity', 'Activity', 'admin_users.html?tab=activity', 'logs'],
            ['admin_visitors', 'Visitors', 'admin_users.html?tab=visitors', ''],
            ['admin_asks', 'Ask usage', 'admin_users.html?tab=asks', 'assistant ai tokens limits cost'],
            ['admin_powermap', 'Power map edits', 'admin_users.html?tab=powermap', ''],
            ['admin_corrections', 'Corrections', 'admin_users.html?tab=corrections', ''],
            ['admin_editor', 'Data editor', 'editor/', 'edit sheets datasets permissions paste'],
            ['admin_structure', 'Structure', 'admin.html', 'estimate']
          ]
        }
      ];
      var HOME = { k: 'home', n: 'Briefing', u: 'executive_briefing.html', g: '', icon: 'home', kw: 'overview summary critical' };
      var ASK = { k: 'ask', n: 'Ask', u: 'assistant.html', g: '', icon: 'chat', kw: 'assistant ai question chat help' };

      var LS = {
        get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
        del: function (k) { try { localStorage.removeItem(k); } catch (e) { } }
      };
      var $ = function (id) { return document.getElementById(id); };
      var root = document.documentElement;
      var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
      if (!isMac) { $('kbdHint').textContent = 'Ctrl K'; $('ftMod').textContent = 'Ctrl'; $('openPal').setAttribute('data-rtip', 'Search  Ctrl K'); $('railBtn').setAttribute('data-tip', 'Toggle sidebar  Ctrl B'); }

      /* ================= Session ================= */
      var profile = null;
      try { profile = JSON.parse(LS.get('mzo_user_profile') || 'null'); } catch (e) { }
      if (!profile && LS.get('mzo_authenticated') !== 'true') { location.replace('/login.html'); return; }

      function isAdmin(p) { return !!p && String(p.role || '').toLowerCase() === 'admin'; }
      function canSheets(p) {
        if (isAdmin(p)) return true;
        var f = String((p && (p['sheets-autho'] != null ? p['sheets-autho'] : p.sheets_autho)) || '').trim().toLowerCase();
        return f === 'list' || f === 'edit' || f === 'y' || f === 'all';
      }

      /* ================= Index ================= */
      var MODS = {}, BY_URL = {}, ALL = [];
      function norm(u) { return String(u || '').replace(/^\/+/, '').replace(/#.*$/, ''); }
      function index() {
        MODS = {}; BY_URL = {}; ALL = [];
        var add = function (m) { MODS[m.k] = m; if (!BY_URL[norm(m.u)]) BY_URL[norm(m.u)] = m.k; ALL.push(m); };
        add(HOME);
        add(ASK);
        NAV.forEach(function (g) {
          g.visible = !g.admin || isAdmin(profile);
          g.mods = [];
          g.items.forEach(function (it) {
            if (it[4] === 'sheets' && !canSheets(profile)) return;
            // VM user store: a user with a modules list sees only those reports (docs/users.md).
            if (profile && Array.isArray(profile.modules) && !isAdmin(profile) && profile.modules.indexOf(it[0]) === -1) return;
            if (!g.visible) return;
            var m = { k: it[0], n: it[1], u: it[2], kw: it[3] || '', g: g.label, gid: g.id, icon: g.icon, hue: g.hue };
            add(m);
            g.mods.push(m);
          });
        });
      }

      /* ================= Sidebar & Favourites ================= */
      var FAV_KEY = 'mzo_ws_favs';
      function icon(name, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '"><use href="#i-' + name + '"/></svg>'; }
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      // All left panel report menus collapsed by default (only Favourites expanded)
      var openGroups = {};

      function favs() {
        try { return JSON.parse(LS.get(FAV_KEY) || '[]').filter(function (k) { return MODS[k] && k !== 'home' && k !== 'ask'; }); } catch (e) { return []; }
      }
      function isFav(k) {
        var baseK = (MODS[k] && MODS[k].base) || k;
        return favs().indexOf(baseK) !== -1;
      }
      function favPinBtn(k) {
        if (!k || k === 'home' || k === 'ask') return '';
        var on = isFav(k);
        return '<button type="button" class="fav-pin' + (on ? ' on' : '') + '" data-fav="' + esc(k) + '" title="' + (on ? 'Remove from Favourites' : 'Add to Favourites') + '" aria-label="' + (on ? 'Remove from Favourites' : 'Add to Favourites') + '">' + icon(on ? 'star-fill' : 'star', 'ic-sm') + '</button>';
      }
      function renderFavBox() {
        var list = favs();
        var h = '<div class="fav-head">' + icon('star-fill', 'ic-sm fav-star') + '<span>Favourites</span>' +
          (list.length ? '<span class="fav-cnt">' + list.length + '</span>' : '') +
          '<button type="button" class="fav-add" data-act="fav-add" title="Select Favourite Reports" aria-label="Select Favourite Reports">' + icon('plus', 'ic-sm') + '</button></div>';
        if (!list.length) {
          h += '<div class="fav-empty"><button type="button" class="fav-empty-add" data-act="fav-add">' + icon('plus', 'ic-sm') + '<span>Add reports</span></button></div>';
        } else {
          h += '<div class="fav-list">';
          list.forEach(function (k) {
            var m = MODS[k];
            if (!m) return;
            var isCur = active && (((MODS[active] && MODS[active].base) || active) === k);
            h += '<a class="ni" href="#' + m.k + '" data-k="' + m.k + '"' + (m.hue ? ' style="--gc:var(--' + m.hue + ')"' : '') + (isCur ? ' aria-current="page"' : '') + '>' +
              icon(m.icon || 'file', 'gi') + '<span class="lbl">' + esc(m.n) + '</span>' + favPinBtn(m.k) + '</a>';
          });
          h += '</div>';
        }
        return h;
      }
      function syncFavUI() {
        var box = $('favCard');
        if (box) box.innerHTML = renderFavBox();
        var pins = document.querySelectorAll('#nav .sub .fav-pin, #fly .fav-pin');
        for (var i = 0; i < pins.length; i++) {
          var k = pins[i].getAttribute('data-fav');
          var on = isFav(k);
          pins[i].classList.toggle('on', on);
          pins[i].title = on ? 'Remove from Favourites' : 'Add to Favourites';
          pins[i].setAttribute('aria-label', pins[i].title);
          pins[i].innerHTML = icon(on ? 'star-fill' : 'star', 'ic-sm');
        }
        var barBtn = $('favPageBtn'), barIco = $('favPageIco');
        if (barBtn && barIco) {
          var baseK = active ? ((MODS[active] && MODS[active].base) || active) : '';
          var hide = !baseK || baseK === 'home' || baseK === 'ask' || !MODS[baseK];
          barBtn.hidden = hide;
          if (!hide) {
            var fOn = isFav(baseK);
            barBtn.setAttribute('aria-pressed', String(fOn));
            barBtn.setAttribute('data-tip', fOn ? 'Remove from Favourites' : 'Add to Favourites');
            barIco.setAttribute('href', fOn ? '#i-star-fill' : '#i-star');
          }
        }
      }
      function toggleFav(k, rowEl) {
        var baseK = (MODS[k] && MODS[k].base) || k;
        if (!baseK || baseK === 'home' || baseK === 'ask' || !MODS[baseK]) return;
        var list = favs();
        var idx = list.indexOf(baseK);
        var willBeFav = (idx === -1);
        if (willBeFav) list.push(baseK);
        else list.splice(idx, 1);
        LS.set(FAV_KEY, JSON.stringify(list));
        syncFavUI();
        if (pal && pal.open) {
          if (palMode === 'favs') {
            var matchingRows = palList.querySelectorAll('.pal-fav-it[data-k="' + baseK + '"]');
            for (var m = 0; m < matchingRows.length; m++) {
              var mr = matchingRows[m];
              mr.classList.toggle('is-fav', willBeFav);
              var pin = mr.querySelector('.fav-pin');
              if (pin) {
                pin.classList.toggle('on', willBeFav);
                pin.title = willBeFav ? 'Remove from Favourites' : 'Add to Favourites';
                pin.setAttribute('aria-label', pin.title);
                pin.innerHTML = icon(willBeFav ? 'star-fill' : 'star', 'ic-sm');
              }
            }
            if ($('palFavBadge')) $('palFavBadge').textContent = list.length + ' pinned';
          } else if (rowEl) {
            rowEl.classList.toggle('is-fav', willBeFav);
            var pin = rowEl.querySelector('.fav-pin');
            if (pin) {
              pin.classList.toggle('on', willBeFav);
              pin.title = willBeFav ? 'Remove from Favourites' : 'Add to Favourites';
              pin.setAttribute('aria-label', pin.title);
              pin.innerHTML = icon(willBeFav ? 'star-fill' : 'star', 'ic-sm');
            }
          } else {
            palRender();
          }
        }
      }
      window.addEventListener('storage', function (e) { if (e.key === FAV_KEY) syncFavUI(); });

      function renderNav() {
        var h = '<a class="ni" href="#home" data-k="home" data-rtip="' + HOME.n + '">' + icon('home') + '<span class="lbl">' + HOME.n + '</span></a>' +
          '<a class="ni" href="#ask" data-k="ask" data-rtip="' + ASK.n + '">' + icon('chat') + '<span class="lbl">' + ASK.n + '</span></a>';
        h += '<div class="fav-card" id="favCard">' + renderFavBox() + '</div>';
        h += '<div class="grp fav-rail-grp" data-g="favs"><button type="button" class="ng fav-rail-btn" data-rtip="Favourites">' + icon('star-fill') + '</button></div>';
        h += '<div class="sec">Reports</div><div class="sec-gap"></div>';
        NAV.forEach(function (g) {
          if (!g.visible || !g.mods.length) return;
          if (g.admin) {
            // Administration opens its own window (admin_users.html with every admin tool as a tab).
            h += '<div class="sec">Admin</div><div class="sec-gap"></div>' +
              '<div class="grp" data-g="' + g.id + '"><button type="button" class="ng" data-admin-open="1" title="Opens in a new window" data-rtip="' + esc(g.label) + ' (new window)">' +
              icon(g.icon, 'gi') + '<span class="lbl">' + esc(g.label) + '</span>' + icon('ext', 'ic-sm chev') + '</button></div>';
            return;
          }
          h += '<div class="grp' + (openGroups[g.id] ? ' open' : '') + '" data-g="' + g.id + '"' + (g.hue ? ' style="--gc:var(--' + g.hue + ')"' : '') + '>' +
            '<button type="button" class="ng" aria-expanded="' + (!!openGroups[g.id]) + '" data-rtip="' + esc(g.label) + '">' + icon(g.icon, 'gi') +
            '<span class="lbl">' + esc(g.label) + '</span>' + icon('chev', 'ic-sm chev') + '</button><div class="sub">';
          g.mods.forEach(function (m) { h += '<a class="ni" href="#' + m.k + '" data-k="' + m.k + '"><span class="lbl">' + esc(m.n) + '</span>' + favPinBtn(m.k) + '</a>'; });
          h += '</div></div>';
        });
        $('nav').innerHTML = h;
      }

      function setGroup(gid, open) {
        var el = document.querySelector('.grp[data-g="' + gid + '"]');
        if (!el) return;
        el.classList.toggle('open', open);
        el.firstElementChild.setAttribute('aria-expanded', String(open));
        if (open) openGroups[gid] = 1; else delete openGroups[gid];
        LS.set('mzo_ws_groups', JSON.stringify(openGroups));
      }

      function markActive(k) {
        var m = MODS[k];
        var cur = document.querySelectorAll('#nav [aria-current]');
        for (var i = 0; i < cur.length; i++) cur[i].removeAttribute('aria-current');
        var hits = document.querySelectorAll('#nav .ni[data-k="' + ((m && m.base) || k) + '"]');
        for (var j = 0; j < hits.length; j++) hits[j].setAttribute('aria-current', 'page');
        var gs = document.querySelectorAll('#nav .grp');
        for (var x = 0; x < gs.length; x++) gs[x].classList.toggle('has-active', !!(m && m.gid === gs[x].getAttribute('data-g')));
        // Category groups remain collapsed by default unless explicitly toggled by user
        var visibleHit = null;
        for (var h = 0; h < hits.length; h++) {
          if (hits[h].offsetParent !== null) { visibleHit = hits[h]; break; }
        }
        if (visibleHit && visibleHit.scrollIntoView) {
          var r = visibleHit.getBoundingClientRect(), n = $('nav').getBoundingClientRect();
          if (r.top < n.top || r.bottom > n.bottom) visibleHit.scrollIntoView({ block: 'nearest' });
        }
        syncFavUI();
      }

      $('nav').addEventListener('click', function (e) {
        var addBtn = e.target.closest('[data-act="fav-add"]');
        if (addBtn) { e.preventDefault(); e.stopPropagation(); palOpen('favs'); return; }
        var favBtn = e.target.closest('[data-fav]');
        if (favBtn) { e.preventDefault(); e.stopPropagation(); toggleFav(favBtn.getAttribute('data-fav')); return; }
        if (e.target.closest('[data-admin-open]')) { e.preventDefault(); if (isSmall()) drawer(false); hideFly(); if (!openAdmin('')) go('admin_users'); return; }
        var ng = e.target.closest('.ng');
        if (ng) {
          var gid = ng.parentNode.getAttribute('data-g');
          if (root.classList.contains('rail') && !isSmall()) { showFly(gid, ng); return; }
          setGroup(gid, !ng.parentNode.classList.contains('open'));
          return;
        }

        if (palMode === 'favs') {
          var currentFavs = favs();
          if ($('palFavBadge')) $('palFavBadge').textContent = currentFavs.length + ' pinned';

          function favRow(m) {
            var idx = palItems.length;
            palItems.push(m);
            var isPinned = currentFavs.indexOf(m.k) !== -1;
            return '<div class="pal-it pal-fav-it' + (isPinned ? ' is-fav' : '') + '" role="option" id="po' + idx + '" data-i="' + idx + '" data-k="' + m.k + '"' + (m.hue ? ' style="--gc:var(--' + m.hue + ')"' : '') + '>' +
              icon(m.icon || 'file', m.hue ? 'gi' : '') +
              '<span class="t">' + hl(m.n, q) + '</span>' +
              '<span class="g">' + esc(m.g || '') + '</span>' +
              '<button type="button" class="fav-pin' + (isPinned ? ' on' : '') + '" data-fav="' + esc(m.k) + '" title="' + (isPinned ? 'Remove from Favourites' : 'Add to Favourites') + '" aria-label="' + (isPinned ? 'Remove from Favourites' : 'Add to Favourites') + '">' +
                icon(isPinned ? 'star-fill' : 'star', 'ic-sm') +
              '</button>' +
            '</div>';
          }

          if (!q) {
            NAV.forEach(function (g) {
              if (!g.visible || !g.mods.length) return;
              var grpHtml = '';
              g.mods.forEach(function (m) {
                if (seen[m.k] || m.k === 'home' || m.k === 'ask') return;
                seen[m.k] = 1;
                grpHtml += favRow(m);
              });
              if (grpHtml) {
                h += '<div class="pal-sec">' + esc(g.label) + '</div>' + grpHtml;
              }
            });
          } else {
            var hits = [];
            ALL.forEach(function (m) {
              if (m.k === 'home' || m.k === 'ask') return;
              var s = score(q, m);
              if (s > 0 && !seen[m.k]) { seen[m.k] = 1; hits.push([s, m]); }
            });
            hits.sort(function (a, b) { return b[0] - a[0]; });
            if (hits.length) {
              h += '<div class="pal-sec">Matching reports (' + hits.length + ')</div>';
              hits.forEach(function (x) { h += favRow(x[1]); });
            } else {
              h = '<div class="pal-empty">No reports match “' + esc(palQ.value.trim()) + '”</div>';
            }
          }

          palList.innerHTML = h;
          palSel = 0; palMark();
          return;
        }

        function row(it, kind) {
          var idx = palItems.length;
          palItems.push(it);
          var ic = kind === 'act' ? it.icon : (kind === 'fav' ? 'star-fill' : (it.k === 'home' ? 'home' : (it.icon || 'file')));
          var pin = kind !== 'act' && it.k ? favPinBtn(it.k) : '';
          return '<div class="pal-it" role="option" id="po' + idx + '" data-i="' + idx + '"' + (kind !== 'act' && kind !== 'recent' && it.hue ? ' style="--gc:var(--' + it.hue + ')"' : '') + '>' + icon(kind === 'recent' ? 'clock' : ic, kind === 'fav' ? 'fav-star' : (kind !== 'act' && kind !== 'recent' && it.hue ? 'gi' : '')) +
            '<span class="t">' + hl(it.n, q) + '</span><span class="g">' + esc(kind === 'act' ? 'Action' : (it.g || '')) + '</span>' + pin + '</div>';
        }
        if (!q) {
          var fv = favs();
          if (fv.length) { h += '<div class="pal-sec">Favourites</div>'; fv.forEach(function (k) { seen[MODS[k].u] = 1; h += row(MODS[k], 'fav'); }); }
          var r = recents().filter(function (k) { return !seen[MODS[k].u]; });
          if (r.length) { h += '<div class="pal-sec">Recent</div>'; r.forEach(function (k) { seen[MODS[k].u] = 1; h += row(MODS[k], 'recent'); }); }
          h += '<div class="pal-sec">Reports</div>';
          ALL.forEach(function (m) { if (!seen[m.u]) { seen[m.u] = 1; h += row(m, 'mod'); } });
        } else {
          var hits = [];
          ALL.forEach(function (m) { var s = score(q, m); if (s > 0 && !seen[m.u]) { seen[m.u] = 1; hits.push([s, m]); } });
          hits.sort(function (a, b) { return b[0] - a[0]; });
          var acts = ACTIONS.filter(function (a) { return score(q, a) > 0; });
          if (hits.length) { h += '<div class="pal-sec">Reports</div>'; hits.slice(0, 30).forEach(function (x) { h += row(x[1], 'mod'); }); }
          if (q.length > 2) { h += '<div class="pal-sec">Assistant</div>'; h += row({ a: 'ask', n: 'Ask: ' + palQ.value.trim(), icon: 'chat', q: palQ.value.trim() }, 'act'); }
          if (acts.length) { h += '<div class="pal-sec">Actions</div>'; acts.forEach(function (a) { h += row(a, 'act'); }); }
          if (!palItems.length) h = '<div class="pal-empty">No reports match “' + esc(palQ.value.trim()) + '”</div>';
        }
        if (!q) { h += '<div class="pal-sec">Actions</div>'; ACTIONS.forEach(function (a) { h += row(a, 'act'); }); }
        palList.innerHTML = h;
        palSel = 0; palMark();
      }
      function palMark() {
        var rows = palList.querySelectorAll('.pal-it');
        for (var i = 0; i < rows.length; i++) rows[i].setAttribute('aria-selected', String(i === palSel));
        var cur = rows[palSel];
        if (cur) { palQ.setAttribute('aria-activedescendant', cur.id); cur.scrollIntoView({ block: 'nearest' }); if (palItems[palSel] && palItems[palSel].u) prefetch(palItems[palSel]); }
      }
      function palRun(i, newTab) {
        var it = palItems[i];
        if (!it) return;
        pal.close();
        if (it.a) return runAction(it.a, it);
        if (newTab) openTab(it); else go(it.k);
      }
      function runAction(a, it) {
        if (a === 'ask') { window.openPage('assistant.html?q=' + encodeURIComponent(it.q)); return; }
        if (a === 'theme') $('themeBtn').click();
        else if (a === 'ppt') { if ($('pptBtn')) $('pptBtn').click(); }
        else if (a === 'rail') $('railBtn').click();
        else if (a === 'reload') $('reloadBtn').click();
        else if (a === 'pop') openTab(MODS[active]);
        else if (a === 'logout') $('logoutBtn').click();
      }
      palQ.addEventListener('input', palRender);
      palQ.addEventListener('keydown', function (e) {
        if (palMode === 'favs') {
          if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palMark(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palMark(); }
          else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            var cur = palList.querySelector('#po' + palSel);
            if (cur) toggleFav(cur.getAttribute('data-k'), cur);
          }
          return;
        }
        if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palMark(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palMark(); }
        else if (e.key === 'Enter') { e.preventDefault(); palRun(palSel, e.metaKey || e.ctrlKey); }
      });
      palList.addEventListener('click', function (e) {
        if (palMode === 'favs') {
          var r = e.target.closest('.pal-fav-it');
          if (r) {
            e.preventDefault();
            e.stopPropagation();
            toggleFav(r.getAttribute('data-k'), r);
            return;
          }
          return;
        }
        var favBtn = e.target.closest('[data-fav]');
        if (favBtn) { e.preventDefault(); e.stopPropagation(); toggleFav(favBtn.getAttribute('data-fav'), favBtn.closest('.pal-it')); return; }
        var r = e.target.closest('.pal-it');
        if (r) palRun(+r.getAttribute('data-i'), e.metaKey || e.ctrlKey);
      });
      palList.addEventListener('pointermove', function (e) { var r = e.target.closest('.pal-it'); if (r && +r.getAttribute('data-i') !== palSel) { palSel = +r.getAttribute('data-i'); palMark(); } });
      pal.addEventListener('click', function (e) { if (e.target === pal) pal.close(); });
      $('openPal').addEventListener('click', function () { palOpen(); });
      if ($('palDoneBtn')) $('palDoneBtn').addEventListener('click', function () { pal.close(); });
      if ($('palDoneFt')) $('palDoneFt').addEventListener('click', function () { pal.close(); });

      /* ================= Keyboard ================= */
      function shortcuts(e) {
        var mod = e.metaKey || e.ctrlKey;
        var k = (e.key || '').toLowerCase();
        if (mod && k === 'k') { e.preventDefault(); palOpen(); return; }
        if (mod && k === 'b') { e.preventDefault(); $('railBtn').click(); return; }
        if (e.key === 'Escape') { menuOpen(false); hideFly(); if (isSmall()) drawer(false); }
        if (e.key === '/' && !mod && e.currentTarget === window) {
          var t = document.activeElement && document.activeElement.tagName;
          if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'SELECT') { e.preventDefault(); palOpen(); }
        }
      }
      window.addEventListener('keydown', shortcuts);

      /* ================= Data mirror (VM only) ================= */
      // The server's copy of the source sheets is listed in one manifest. Ask for it once here, before the
      // first report frame loads, so the frame reads it from sessionStorage (same keys as MIRROR in
      // mzo_data_hub.js). 204/404 means there is no mirror (Vercel): nothing else happens.
      var MIRROR_SHARE = 'mzo_mirror_manifest', MIRROR_OFF = 'mzo_mirror_off';
      function mirrorCopy() { try { return JSON.parse(sessionStorage.getItem(MIRROR_SHARE) || 'null'); } catch (e) { return null; } }
      var mirrorP = (function () {
        var off = Number(LS.get(MIRROR_OFF) || 0), s = mirrorCopy();
        if (off && Date.now() - off < 30 * 60 * 1000) return Promise.resolve(null);
        if (s && s.m && Date.now() - s.at < 20000) return Promise.resolve(s.m);
        return fetch('/api/data/manifest', { credentials: 'same-origin', cache: 'no-cache', headers: { Accept: 'application/json' } })
          .then(function (r) {
            if (r.status === 204 || r.status === 404) { LS.set(MIRROR_OFF, String(Date.now())); try { sessionStorage.removeItem(MIRROR_SHARE); } catch (e) { } return null; }
            return r.ok ? r.json() : null;
          })
          .then(function (m) {
            if (m && m.mode === 'off') LS.set(MIRROR_OFF, String(Date.now()));
            if (!m || typeof m.datasets !== 'object') return null;
            try { sessionStorage.setItem(MIRROR_SHARE, JSON.stringify({ at: Date.now(), m: m })); } catch (e) { }
            return m;
          })
          .catch(function () { return null; });
      })();
      window.__mzoManifestPending = mirrorP;

      // "Data as of" the last time the server checked its sources (refreshed by every frame's manifest).
      function paintAsOf() {
        var el = $('asOf'), s = mirrorCopy(), d = new Date(s && s.m && s.m.generatedAt || '');
        if (isNaN(d)) { el.hidden = true; return; }
        var t = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
        var day = d.toDateString() === new Date().toDateString() ? '' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ', ';
        el.textContent = 'Data as of ' + day + t;
        el.setAttribute('data-tip', 'Server copy of the sheets, checked ' + d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }));
        el.hidden = false;
      }
      mirrorP.then(paintAsOf);
      window.addEventListener('storage', function (e) { if (e.key === MIRROR_SHARE) paintAsOf(); });

      // In idle time, refresh datasets this device already keeps whose server copy has changed, so the
      // next report opens on current data. Small ones only on phones; nothing on data saver or 2G.
      function warmData(m) {
        var c = navigator.connection || {};
        if (!m || !m.datasets || c.saveData || /2g/.test(c.effectiveType || '')) return;
        var small = MAX_ALIVE <= 2, cap = small ? 1.5e6 : 25e6, keys = [];
        Object.keys(m.datasets).forEach(function (name) {
          var e = m.datasets[name];
          if (!e || e.sensitive || !e.version || !Array.isArray(e.dataHubKeys) || (e.bytes || 0) > cap) return;
          e.dataHubKeys.forEach(function (k) {
            var have = LS.get('mzo_hub_ver_' + k);
            if (have && have !== 'v:' + e.version && keys.indexOf(k) < 0) keys.push(k);
          });
        });
        keys = keys.slice(0, small ? 3 : 8);
        if (!keys.length) return;
        var s = document.createElement('script');
        s.src = '/mzo_data_hub.js?v=92'; s.async = true;
        s.onload = function () {
          var hub = window.mzoDataHub;
          if (!hub) return;
          keys.reduce(function (p, k) {
            return p.then(function () { return new Promise(function (done) { idle(function () { Promise.resolve(hub.waitForDataset(k)).catch(function () { }).then(done); }); }); });
          }, Promise.resolve());
        };
        document.head.appendChild(s);
      }

      /* ================= Boot ================= */
      index();
      renderNav();
      renderUser();
      applyTheme(pref(), false);
      go(fromHash(), true);

      // Validate the session in the background; refresh the profile.
      if (navigator.onLine !== false) {
        fetch('/api/session-check', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
          .then(function (r) {
            if (r.status === 401) { LS.del('mzo_authenticated'); LS.del('mzo_user_profile'); location.replace('/login.html'); return null; }
            return r.ok ? r.json() : null;
          })
          .then(function (d) {
            if (!d || !d.profile) return;
            var wasAdmin = isAdmin(profile), wasSheets = canSheets(profile);
            profile = d.profile;
            LS.set('mzo_authenticated', 'true');
            LS.set('mzo_user_profile', JSON.stringify(profile));
            renderUser();
            if (wasAdmin !== isAdmin(profile) || wasSheets !== canSheets(profile)) { index(); renderNav(); if (!MODS[active]) go('home', true); else markActive(active); }
          })
          .catch(function () { });
      }

      // After first paint: app-update notice, warm recent pages, then (mirror only) changed datasets.
      var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 1200); };
      idle(function () {
        var s = document.createElement('script');
        s.src = '/mzo_app_update.js?v=88'; s.async = true;
        document.head.appendChild(s);
        recents().slice(0, 3).forEach(function (k) { prefetch(MODS[k]); });
        mirrorP.then(function (m) { if (m) setTimeout(function () { idle(function () { warmData(m); }); }, 4000); });
      });
    })();
  </script>
</body>
